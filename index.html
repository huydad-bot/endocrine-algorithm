<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0HC1J201FL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-0HC1J201FL');

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endocrine Algorithm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF3; --card:#FFFFFF; --ink:#1B2740; --muted:#5E6878; --line:#E6E9EF; --arrow:#9AA6BC;
  --shadow:0 4px 14px rgba(30,45,80,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10151F; --card:#18202D; --ink:#E6ECF5; --muted:#A3AEBF; --line:#263042; --arrow:#6F7C92; --shadow:0 4px 14px rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ --bg:#10151F; --card:#18202D; --ink:#E6ECF5; --muted:#A3AEBF; --line:#263042; --arrow:#6F7C92; --shadow:0 4px 14px rgba(0,0,0,.35); }
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.4}
main{max-width:1180px; margin:0 auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.top{text-align:center; margin-bottom:1.1rem}
.top h1{margin:0; font-size:clamp(1.6rem,3.6vw,2.3rem); font-weight:800; letter-spacing:.02em}
.top p{margin:.25rem 0 0; color:var(--muted); font-size:.82rem}
.top a{color:var(--muted)}
.grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.9rem 1rem; align-items:stretch}
.card{--c-soft:var(--soft); --c-ink:var(--inkc);
  background:var(--card); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; border-left:5px solid var(--c); display:flex; flex-direction:column}
.card-h{display:flex; align-items:center; gap:.65rem; padding:.55rem .85rem; background:linear-gradient(135deg, color-mix(in srgb,var(--c-soft) 45%, var(--card)), var(--c-soft)); border-bottom:1px solid var(--line)}
.ic{flex:none; width:36px; height:36px; border-radius:9px; background:var(--c); display:grid; place-items:center; font-size:1.1rem; line-height:1}
.card-h h2{margin:0; font-size:1rem; font-weight:800; color:var(--ink); line-height:1.2}
.card-h small{display:block; font-size:.76rem; font-weight:500; color:var(--c)}
ul{list-style:none; margin:0; padding:.1rem 0; flex:1}
li + li{border-top:1px solid var(--line)}
li a{display:flex; align-items:center; gap:.55rem; padding:.42rem .85rem; text-decoration:none; color:var(--c-ink); transition:background .12s}
li a::before{content:""; flex:none; width:6px; height:6px; border-radius:50%; background:var(--c)}
li a .t{flex:1; min-width:0; font-size:.9rem; font-weight:500}
li a .s{white-space:nowrap}
li a .s{font-size:.72rem; font-weight:400; color:var(--muted); margin-left:.4rem}
li a::after{content:"↗"; flex:none; color:var(--arrow); font-size:.85rem; transition:transform .12s, color .12s}
li a:hover{background:color-mix(in srgb,var(--c-soft) 55%, transparent)}
li a:hover::after{color:var(--c); transform:translate(2px,-2px)}
li a:focus-visible{outline:2px solid var(--c); outline-offset:-2px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .card{--c-soft:color-mix(in srgb,var(--c) 22%, #18202D); --c-ink:color-mix(in srgb,var(--c) 45%, #FFFFFF)}
}
:root[data-theme="dark"] .card{--c-soft:color-mix(in srgb,var(--c) 22%, #18202D); --c-ink:color-mix(in srgb,var(--c) 45%, #FFFFFF)}
@media (max-width:900px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .grid{grid-template-columns:1fr} li a .t{white-space:normal} }
@media (prefers-reduced-motion: reduce){ li a, li a::after{transition:none} }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Endocrine Algorithm</h1>
    <p>⚠️ 본 자료는 내부 임상 교육 및 참고 목적의 요약본입니다. 실제 진료는 최신 원문 가이드라인과 임상적 판단에 근거하여야 합니다.</p>
    <p>프로그램 관련 연락 : <a href="mailto:jugkim@knu.ac.kr">jugkim@knu.ac.kr</a></p>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
const BASE = 'https://huydad-bot.github.io/endocrine-algorithm/';
/* [제목, 아이콘, 주색, 연한색, 글자색, [[폴더, 이름, 출처]...]] */
const GROUPS = [
 ['갑상선','🦋','#2A7F99','#D3F5FA','#1D6B82',[
  ['th-nodule','갑상선결절','KTA 2024'],
  ['dtc','갑상선분화암','KTA 2024'],
  ['mtc','갑상선 수질암','ATA 2015'],
  ['subclinical-hypothyroidism','무증상 갑상선기능저하증','대한갑상선학회 2023']]],
 ['당뇨병·비만·지질','💉','#2563EB','#DCE8FD','#1D4ED8',[
  ['mody','MODY','체계적 문헌고찰 2026'],
  ['midd','MIDD','Diabetes Obes Metab 2026'],
  ['lada','LADA','Diabetes 2020'],
  ['obesity','비만 / ABCD','AACE 2025'],
  ['dyslipidemia','이상지질혈증','ACC/AHA 2026']]],
 ['부신','🔺','#D9622B','#FDE6D8','#B84E1D',[
  ['adrenal-incidentaloma','부신우연종','ESE-ENSAT 2023'],
  ['pa','원발성 알도스테론증','대한내분비학회 2023'],
  ['ppgl','갈색세포종·부신경절종','대한내분비학회 2021'],
  ['pbmah','PBMAH','Endocrine Reviews 2023'],
  ['cah','선천부신과형성 (CAH)','Endocrine Reviews 2022']]],
 ['뇌하수체·MEN','🧠','#7C4DCC','#ECE3FB','#6435B5',[
  ['prolactinoma','프로락틴종','Pituitary Society 2023'],
  ['men1','MEN1','JCEM 2012'],
  ['men2','MEN2','GeneReviews 2023'],
  ['acromegaly','말단비대증','Nat Rev Endocrinol 2025']]],
 ['고혈압·신장·전해질','🫀','#D23B5B','#FCE0E6','#B32646',[
  ['hypertension','고혈압','대한고혈압학회 2026'],
  ['ckd','만성콩팥병 (CKD)','KDIGO 2024'],
  ['hyponatremia','저나트륨혈증','NDT 2024'],
  ['ckm','CKM 증후군','AHA 2023']]],
 ['부갑상선·골','🦴','#C28A0E','#FBEFCF','#9A6B05',[
  ['phpt','원발성 부갑상선기능항진증','국제 워크숍 2022'],
  ['osteoporosis','골다공증 (영국 NOGG)','NOGG 2024'],
  ['rickets','구루병','SIEDP 2024']]]
];
document.getElementById('grid').innerHTML = GROUPS.map(([g,ic,c,soft,ink,items])=>
 `<section class="card" style="--c:${c};--soft:${soft};--inkc:${ink}">
   <div class="card-h"><div class="ic" aria-hidden="true">${ic}</div><div><h2>${g}</h2><small>${items.length} Algorithms</small></div></div>
   <ul>${items.map(([d,t,s])=>`<li><a href="${BASE}${d}/"><span class="t">${t}<span class="s">${s}</span></span></a></li>`).join('')}</ul>
  </section>`).join('');
</script>
</body>
</html>
