<title>프로락틴종 진단 및 치료 알고리즘 (Pituitary Society 2023)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#16212B; --muted:#56646F;
  --line:#7F8D99; --test:#DCE5EB; --test-ink:#12304A;
  --accent:#1F5E7E; --accent-soft:#E3EEF4;
  --mal:#A13D33; --mal-bg:#FBEDEA; --ben:#2C6A43; --ben-bg:#E9F3EC;
  --tx:#6A4C93; --tx-bg:#F1ECF8; --warn:#85600F; --warn-bg:#FBF3DF;
  --border:#C9D3DA;
  --fn:#C2410C; --fn-bg:#FFF1E6;
  --hdr-bg:#1F4F6B; --hdr-ink:#FFFFFF; --hdr-sub:#CFE1EC; --hdr-link:#FFE8A3; --hdr-rule:#E0B44C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
    --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
    --accent:#7FB7D6; --accent-soft:#1D3140;
    --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
    --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
    --border:#2E3E4A;
    --fn:#F59E62; --fn-bg:#3A2418;
    --fn:#F59E62; --fn-bg:#3A2418;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
  --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
  --accent:#7FB7D6; --accent-soft:#1D3140;
  --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
  --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
  --border:#2E3E4A;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:16px; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.top{
  background:var(--hdr-bg); color:var(--hdr-ink);
  border:1px solid var(--hdr-bg); border-bottom:0; border-radius:10px 10px 0 0; margin:0;
  box-shadow:inset 0 -3px 0 var(--hdr-rule);
}
.fig .chart-wrap{border-top:0; border-radius:0 0 10px 10px}
.chart-note{position:absolute; right:1rem; bottom:.55rem; margin:0; padding-left:1.1em; font-size:calc(var(--ui-font,13px) * .88); line-height:1.55; color:var(--muted); white-space:nowrap}
.chart-note a{color:var(--accent)}
.top .disclaimer{font-size:.74rem; font-style:italic; color:var(--hdr-sub); opacity:.85; margin:.15rem 0 0}
.top-inner{padding:.8rem 1.25rem .9rem; text-align:center}
.top h1{font-size:1.25rem; margin:0; font-weight:700; letter-spacing:-.01em; color:var(--hdr-ink)}
.top .src{font-size:.84rem; color:var(--hdr-sub); margin:.2rem 0 0}
.top .src a{color:var(--hdr-link); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--hdr-rule)}
.top .src a:hover{text-decoration-thickness:2px}
.top .src a:focus-visible{outline-color:var(--hdr-link)}
.btn{
  font:inherit; font-size:.85rem; color:var(--ink); background:var(--surface);
  border:1px solid var(--border); border-radius:6px; padding:.35rem .7rem; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

main{max-width:1180px; margin:0 auto; padding:1rem 1.25rem .75rem}
.intro{max-width:70ch; color:var(--muted); font-size:.95rem; margin:0 0 1rem}
.legend{order:2; display:flex; flex-direction:column; gap:.2rem; font-size:var(--ui-font,13px); color:var(--muted); flex:none; align-self:flex-start; padding:.25rem .25rem 0 .25rem}
.legend span{white-space:nowrap}
.legend span{display:inline-flex; align-items:center; gap:.4rem}
.sw{width:18px; height:12px; border-radius:3px; border:1.5px solid var(--line); display:inline-block}
.sw.test{background:var(--test)}
.sw.mal{border-color:var(--mal); background:var(--mal-bg)}
.sw.ben{border-color:var(--ben); background:var(--ben-bg)}
.sw.tx{border-color:var(--tx); background:var(--tx-bg)}

.chart-wrap{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  overflow-x:auto; padding:.75rem; display:flex; gap:1rem; align-items:flex-start; position:relative;
}
.chart-size{flex:none}
.fig{width:fit-content; max-width:100%; margin:0 auto}
.below{display:flex; flex-wrap:nowrap; align-items:center; gap:.4rem; margin-top:.6rem; overflow-x:auto; padding-bottom:2px}
.below button{flex-shrink:0; white-space:nowrap}
.sep{width:1px; height:1.4rem; background:var(--border); margin:0 .25rem}
.fn-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.5rem .75rem .75rem}
.fn-panel .fn-list{margin:0}
.chart-size{position:relative}
.chart{position:absolute; left:0; top:0; transform-origin:0 0}
.chart svg{position:absolute; inset:0; overflow:visible}
.chart svg path{fill:none; stroke:var(--line); stroke-width:1.4}
.chart svg path.dot{stroke-dasharray:3 4}
.chart svg marker path{fill:var(--line); stroke:none}

.node{
  position:absolute; display:flex; align-items:center; justify-content:center; text-align:center;
  font:inherit; font-size:15px; line-height:1.2; font-weight:500; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line); border-radius:4px;
  padding:2px 8px; cursor:pointer;
  transition:box-shadow .15s ease, border-color .15s ease;
}
.node sup{font-size:13px; margin-left:2px; color:var(--accent); font-weight:700; vertical-align:baseline; position:relative; top:-.5em; line-height:0}
.node.test{background:var(--test); color:var(--test-ink); font-weight:600}
.node.mal{border-color:var(--mal); background:var(--mal-bg)}
.node.ben{border-color:var(--ben); background:var(--ben-bg)}
.node.tx{border-color:var(--tx); background:var(--tx-bg)}
.node:hover{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.node.is-active{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent)}

.fn-list{margin:0; padding:0; list-style:none; display:grid; gap:.4rem}
.fn-list button{
  width:100%; text-align:left; font:inherit; font-size:.86rem; color:var(--ink);
  background:transparent; border:1px solid transparent; border-radius:6px; padding:.35rem .5rem; cursor:pointer;
  display:grid; grid-template-columns:1.4rem 1fr; gap:.25rem;
}
.fn-list button:hover{background:var(--accent-soft); border-color:var(--border)}
.fn-list b{color:var(--accent)}
.caption{font-size:.82rem; color:var(--muted); margin:.75rem 0 0}

.abbr-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.25rem .9rem .75rem}
.abbr-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-toggle:hover,.abbr-toggle:hover{border-color:var(--accent); background:var(--accent-soft)}
.abbr-search{margin:.6rem 0; width:100%; max-width:360px; font:inherit; font-size:.9rem; padding:.4rem .6rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--ink)}
.abbr dl{display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; margin:0; font-size:.88rem}
.abbr dt{font-weight:600; color:var(--accent)}
.abbr dd{margin:0}

/* recommendations */
.rec{display:grid; grid-template-columns:auto 1fr auto; gap:.25rem .6rem; align-items:start; border:1px solid var(--border); border-radius:6px; padding:.5rem .65rem; margin:.5rem 0; background:var(--bg)}
.rec p{margin:0; font-size:.9rem}
.rid{font-weight:700; color:var(--accent); font-size:.85rem; white-space:nowrap; padding-top:.05rem}
.lv{font-size:.72rem; font-weight:600; padding:.1rem .45rem; border-radius:999px; white-space:nowrap; cursor:help; border:1px solid currentColor}
.lv.l1{color:var(--ben); background:var(--ben-bg)}
.lv.l2{color:var(--accent); background:var(--accent-soft)}
.lv.l3{color:var(--warn); background:var(--warn-bg)}
.lv.l4{color:var(--muted); background:transparent}
.small,.d-body ul.small li{font-size:.86rem}
.d-body ul.small{color:var(--ink)}
@media (max-width:520px){ .rec{grid-template-columns:auto 1fr} .rec .lv{grid-column:2; justify-self:start} }
.extras{display:contents}
.extras button{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.extras button:hover{border-color:var(--accent); background:var(--accent-soft)}

.d-body .fn-list{padding-left:0; margin:0 0 .5rem}
.d-body .fn-list li{margin:0}
.d-body a{color:var(--accent)}
.xp{border:1px solid var(--border); border-radius:6px; margin:.4rem 0; background:var(--bg)}
.xp summary{cursor:pointer; padding:.5rem .7rem; font-size:.92rem; list-style:none; display:flex; gap:.5rem; align-items:baseline}
.xp summary::-webkit-details-marker{display:none}
.xp summary::before{content:"▸"; color:var(--accent); flex:none; transition:transform .15s}
.xp[open] summary::before{transform:rotate(90deg)}
.xp[open] summary{border-bottom:1px solid var(--border); font-weight:600}
.xp > div{padding:.3rem .8rem .6rem; background:var(--surface); border-radius:0 0 6px 6px}
.xp h5{font-size:.88rem; margin:.6rem 0 .2rem}
@media (prefers-reduced-motion: reduce){.xp summary::before{transition:none}}
.d-body h5{font-size:.9rem; margin:.7rem 0 .25rem; color:var(--accent)}
.kt th,.kt td:first-child{white-space:nowrap}
.kt td:nth-child(3),.kt td:nth-child(4){white-space:nowrap}
.fnl{margin:.4rem 0 0; padding-left:1.3rem}
.fnl li{margin:.25rem 0}
.fnl li::marker{font-weight:700; color:var(--fn)}
.kt sup, .d-body h4 sup{color:var(--fn); font-weight:700; background:var(--fn-bg); border-radius:3px; padding:0 .2em; margin-left:.1em}
.fnl{background:var(--fn-bg); border-left:3px solid var(--fn); border-radius:0 6px 6px 0; padding:.5rem .7rem .5rem 1.9rem}
.term{font:inherit; color:var(--accent); font-weight:700; background:var(--accent-soft); border:0; border-bottom:2px dotted var(--accent); border-radius:3px; padding:0 .25em; cursor:pointer}
.term::after{content:" ▸"; font-size:.8em}
.term[aria-expanded="true"]::after{content:" ▾"}
.term:hover{background:var(--test)}
.pop{margin:.5rem 0 .3rem; border:1px solid var(--accent); border-radius:8px; background:var(--surface); padding:.6rem .8rem; box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pop-h{display:block; color:var(--accent); margin-bottom:.3rem}
.pop ul{margin:.2rem 0; padding-left:1.1rem}
.pop li{font-size:.9rem; margin:.3rem 0}
.pop-src{font-size:.78rem; color:var(--muted); margin:.4rem 0 0}
.pop .tbl table{min-width:0}
.pop .tbl td:first-child{width:38%}
/* drawer */
.backdrop{position:fixed; inset:0; background:rgba(10,20,28,.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.backdrop.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(560px,100%);
  background:var(--surface); border-left:1px solid var(--border);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s ease;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:none}
.d-head{display:flex; gap:1rem; align-items:flex-start; padding:1rem 1.25rem .75rem; border-bottom:1px solid var(--border)}
.d-head > div{flex:1}
.d-kind{margin:0; font-size:.8rem; color:var(--accent); font-weight:600}
.d-head h2{margin:.15rem 0 0; font-size:1.25rem; line-height:1.35}
.d-body{flex:1; overflow-y:auto; padding:1rem 1.25rem 1.5rem; font-size:.95rem}
.d-body h4{font-size:.98rem; margin:1.25rem 0 .4rem; color:var(--ink)}
.d-body h4:first-child{margin-top:0}
.d-body p{margin:.4rem 0}
.d-body ul{margin:.3rem 0; padding-left:1.2rem}
.d-body li{margin:.2rem 0}
.tbl{overflow-x:auto; margin:.5rem 0}
.tbl table{border-collapse:collapse; width:100%; font-size:.85rem; min-width:440px}
.tbl th,.tbl td{border:1px solid var(--border); padding:.4rem .5rem; vertical-align:top; text-align:left}
.tbl th{background:var(--test); color:var(--test-ink); font-weight:600}
.box{border-radius:6px; padding:.6rem .8rem; margin:.75rem 0; font-size:.9rem}
.box.fn{background:var(--accent-soft); border-left:3px solid var(--accent)}
.box.tip{background:var(--ben-bg); border-left:3px solid var(--ben)}
.box.verify{background:var(--warn-bg); border-left:3px solid var(--warn)}
.box b{display:block; margin-bottom:.15rem}
.d-next{padding:.75rem 1.25rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:.4rem; align-items:center}
.d-next:empty{display:none}
.d-next .lbl{font-size:.8rem; color:var(--muted); margin-right:.25rem}
.d-next button{font:inherit; font-size:.85rem; padding:.3rem .65rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:transparent; cursor:pointer}
.d-next button:hover{background:var(--accent-soft)}

@media (max-width:700px){
  .drawer{top:auto; height:86%; width:100%; border-left:0; border-top:1px solid var(--border); border-radius:14px 14px 0 0; transform:translateY(100%)}
  .drawer.open{transform:none}
  main{padding:1rem .75rem}
  .chart-wrap{padding:.5rem}
}
@media (prefers-reduced-motion: reduce){
  .drawer,.backdrop,.node{transition:none}
}

/* 범례 클릭 시 해당 박스 깜빡임 */
.legend .lg{font:inherit; color:inherit; background:transparent; border:1px solid transparent; border-radius:6px; padding:.15rem .35rem; margin:0 -.35rem; display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap; cursor:pointer; text-align:left}
.legend .lg:hover{background:var(--accent-soft); border-color:var(--border); color:var(--ink)}
.legend .lg.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.node{--flash:var(--accent)}
.node.test{--flash:var(--test-ink)} .node.tx{--flash:var(--tx)} .node.ben{--flash:var(--ben)} .node.mal{--flash:var(--mal)}
@keyframes nodeFlash{0%,100%{box-shadow:0 0 0 0 transparent; transform:scale(1)} 50%{box-shadow:0 0 0 5px var(--flash); transform:scale(1.04)}}
.chart.hl .node{transition:opacity .2s}
.chart.hl .node:not(.flash){opacity:.3}
.node.flash{animation:nodeFlash .8s ease-in-out 3; z-index:3}
@media (prefers-reduced-motion: reduce){
  .node.flash{animation:none; box-shadow:0 0 0 4px var(--flash)}
  .chart.hl .node{transition:none}
}

/* ---- DTC 형식 이식: 권고 설명, 하단 버튼 ---- */
.below{display:flex; flex-wrap:nowrap; align-items:center; gap:.4rem; margin-top:.6rem; overflow-x:auto; padding-bottom:2px}
.below button{flex-shrink:0; white-space:nowrap}
.node small{font-size:11px; font-weight:500; color:var(--muted); margin-left:5px; white-space:nowrap}
.lv-ic::after{content:"▸"; font-size:.8em}
.exp{margin:-.3rem 0 .7rem; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:0 0 6px 6px; background:var(--surface); padding:.55rem .8rem .6rem; font-size:.88rem; line-height:1.7}
.exp-h{display:flex; justify-content:space-between; gap:.5rem; align-items:baseline; color:var(--accent); margin-bottom:.2rem}
.exp-h span{font-size:.78rem; color:var(--muted)}
.exp p{margin:.45rem 0}
.exp h5{margin:.7rem 0 .2rem; font-size:.86rem; color:var(--ink)}
.exp p.exp-li{margin:.2rem 0 .2rem .9rem; padding-left:1.4em; text-indent:-1.4em}
.exp-note,.exp-src{font-size:.78rem; color:var(--muted)}
.exp-src{border-top:1px dashed var(--border); padding-top:.4rem; margin-top:.6rem}
.rec.has-exp{cursor:pointer; transition:border-color .15s, box-shadow .15s}
.rec.has-exp:hover{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.rec.has-exp[aria-expanded="true"]{border-color:var(--accent); border-bottom-left-radius:0; border-bottom-right-radius:0; margin-bottom:0; background:var(--accent-soft)}
.rec.has-exp[aria-expanded="true"] .lv-ic::after{content:"▾"}
.exp{margin:0 0 .8rem; border-top:0}
.exp-h{position:sticky; top:-1rem; z-index:2; background:var(--surface); margin:-.55rem -.8rem .3rem; padding:.55rem .8rem .45rem; border-bottom:1px solid var(--border); align-items:center}
.exp-h .exp-r{margin-left:auto}
.exp-close{font:inherit; font-size:.78rem; padding:.2rem .55rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:var(--surface); cursor:pointer; white-space:nowrap}
.exp-close:hover{background:var(--accent-soft)}
.exp-close-b{display:block; margin:.5rem 0 0 auto}
@media (prefers-reduced-motion: reduce){.rec.has-exp{transition:none}}
.rec.has-exp .lv{display:inline-flex; align-items:center; gap:.35rem; padding-right:.2rem}
.rec.has-exp .lv-ic{display:inline-flex; align-items:center; justify-content:center; width:1.35rem; height:1.35rem; border-radius:50%; background:var(--accent); color:#fff; flex:none; transition:transform .2s, background .15s}
.rec.has-exp .lv-ic::after{content:"▸"; font-size:.95rem; line-height:1; margin-left:.1rem}
.rec.has-exp:hover .lv-ic{background:var(--accent-ink, var(--ink)); transform:scale(1.12)}
.rec.has-exp[aria-expanded="true"] .lv-ic{transform:rotate(90deg)}
.rec.has-exp[aria-expanded="true"] .lv-ic::after{content:"▸"}
@media (prefers-reduced-motion: reduce){.rec.has-exp .lv-ic{transition:none}}
.below{gap:.4rem; margin-top:.6rem}
.below .sep{background:var(--border)}
.below button{--b:var(--accent); display:inline-flex; align-items:center; gap:.3rem; font-weight:500; font-size:var(--ui-font,13px); border:1px solid var(--b) !important; background:color-mix(in srgb, var(--b) 12%, var(--surface)) !important; color:var(--ink) !important; border-radius:6px; padding:.3rem .6rem; transition:transform .12s, box-shadow .12s, background .12s}
.below button:hover{background:color-mix(in srgb, var(--b) 24%, var(--surface)) !important; transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.12)}
.below button:focus-visible{outline:2px solid var(--b); outline-offset:2px}
.below .bt-ic{display:inline-flex; align-items:center; justify-content:center; min-width:1.05rem; height:1.05rem; padding:0 .15rem; border-radius:999px; background:var(--b); color:var(--surface); font-size:.6rem; font-weight:700; line-height:1}
.below .bt-lv, .below .bt-preg, .below .bt-peds, .below .bt-abbr{--b:var(--ben)}
@media (prefers-reduced-motion: reduce){.below button{transition:none} .below button:hover{transform:none}}
.node{flex-wrap:wrap; column-gap:0}
.below button{--b:var(--ben)}

/* ---- 프로락틴종 도구 추가 ---- */
.ctabs{display:flex; gap:.35rem; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-top:0; border-bottom:0; padding:.6rem .75rem 0}
.ctab{font:inherit; font-size:var(--ui-font,13px); font-weight:600; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-bottom:0; border-radius:8px 8px 0 0; padding:.4rem .85rem; cursor:pointer; display:inline-flex; gap:.45rem; align-items:baseline}
.ctab span{font-weight:500; font-size:.8em; color:var(--muted)}
.ctab:hover{color:var(--ink); background:var(--accent-soft)}

'11.7':['W','임신을 원하지 않는 여성에서는 월경 재개 전에 임신이 될 수 있으므로 도파민작용제 시작 시 차단 피임법(mechanical contraception)을 권고한다.'],
'12.1':['S','치료 시작 전에 카버골린의 흔하고 경미한 부작용(위장관 증상, 어지럼, 피로)을 환자에게 설명해야 한다.'],
'12.2':['S','부작용은 대개 시간이 지나면서 호전되지만 일부 환자에서는 지속되고 일상 기능을 저해할 수 있다.'],
'12.3':['S','효과적인 치료에도 일부 환자에서는 삶의 질 저하가 지속된다.'],
'12.4':['W','취침 전 및/또는 음식과 함께 투여하면 내약성이 개선될 수 있다.'],
'12.5':['W','저용량으로 시작하여 천천히 증량하면 내약성이 개선될 수 있다.'],
'12.6':['W','카버골린 불내약이 지속되는 환자에서는 퀴나골리드 등 다른 D2 특이 도파민작용제를 시도할 수 있으며 내약성이 개선될 가능성이 있다.'],
'12.7':['S','도파민작용제 치료는 강박적 구매, 도박, 공격성, 기분 변화, 과다성욕 등 신경정신과적 부작용을 일으킬 수 있으며 특히 남성에서 그렇다. 드물지만 발생하면 도파민작용제를 중단하거나 용량을 조정해야 한다.'],
'12.8':['S','장기 및/또는 고용량 카버골린 치료 시 드문 부작용인 심장판막 변화의 가능성을 환자에게 알려야 한다. 선별 심초음파의 간격은 국가마다 다르다.'],
'12.9':['W','장기 또는 고용량 치료가 고려되는 환자에서는 기저 및 추적 심초음파 선별을 제안한다.'],
'12.10':['S','침습성 거대프로락틴종이 도파민작용제로 축소되면서 드물게 뇌척수액 비루가 생길 수 있다. 의심되면 비강 분비물에서 β<sub>2</sub>-transferrin 또는 β-trace protein을 측정해야 하며, 확인되면 수술적 교정이 필요하다.'],
'12.11':['S','거대프로락틴종의 광범위한 축소로 인한 도파민작용제 유발 졸중(apoplexy)은 시각 변화를 일으킬 수 있다. 이 경우 수술적 교정이 필요할 것이다.'],
'13.1':['W','고용량(주 &gt;2.0 mg) 카버골린의 장기 치료가 예상되면 기존 판막 이상을 확인하기 위해 기저 심초음파를 시행한다. 기저 평가는 카버골린 시작 전 또는 치료 첫 몇 달 이내에 시행할 수 있다.'],
'13.2':['W','주 &gt;2.0 mg 카버골린 치료 환자는 2–3년마다 심초음파를 반복한다. 워크숍 참여자 대부분은 매년 심장 검사는 불필요하다고 보았다.'],
'13.3':['W','주 ≤2.0 mg 카버골린 치료 환자는 5–6년 후 심초음파를 시행한다. 일부 참여자는 주 &lt;1.0 mg이고 판막 기능장애의 임상 징후가 없는 환자에서는 반복 검사가 필요하지 않다고 보았다.'],
'13.4':['W','카버골린 치료 환자에서 심잡음이 발견되면 심초음파를 시행한다.'],
'14.1':['S','환자의 약 1/5은 카버골린 중단 후에도 관해를 유지할 수 있으므로, 유리한 예측인자를 평가하고 정기적으로 감량 또는 치료 중단을 고려해야 한다.'],
'14.2':['S','성공적인 중단의 유리한 예측인자는 낮은 카버골린 유지 용량, 2년을 초과하는 치료 기간, 선종 크기의 상당한 감소이다.'],
'14.3':['S','카버골린을 성공적으로 중단한 환자는 평생 혈청 프로락틴 평가(매년, 또는 증상 재발 시 더 자주)를 받아야 하며 재발 시 나타날 수 있는 증상에 대해 교육받아야 한다.'],
'14.4':['S','카버골린 중단 후 고프로락틴혈증이 재발한 환자는 대개 도파민작용제 재투여로 성공적으로 치료된다.'],
'14.5':['W','카버골린 재투여 후 장기간 혈청 프로락틴이 정상인 환자는 다시 중단 시도를 평가할 수 있다.'],
'14.6':['W','자율적인 젖분비세포 성장이 영구적으로 해소될 가능성은 폐경 또는 임신 후 증가하므로, 이들 환자에서 중단을 시도할 수 있다.'],
'15.1':['S','미세프로락틴종과 경계가 명확한 거대프로락틴종(Knosp grade 0, 1)을 숙련된 신경외과의가 절제하면 완치 가능성이 높고 비용효과적이며 장기 도파민작용제 치료를 피할 수 있다. 따라서 이 아군에서는 전문 뇌하수체 신경외과의에 의한 수술을 도파민작용제 치료와 함께 일차 치료 선택지로 논의해야 한다.'],
'15.2':['S','수술적 관해 가능성이 낮은 환자(Knosp grade ≥2)에서는 내과적 치료가 선호되는 일차 치료이다.'],
'15.3':['W','안장 종괴 효과 또는 졸중으로 인해 시력 손실이 급속히 진행하는 환자에게는 내과적 치료보다 수술을 권할 수 있다.'],
'15.4':['W','장기 도파민작용제 치료에 불내약 또는 저항성을 보이는 환자에게 수술을 제안할 수 있다.'],
'15.5':['W','젊은 여성에서는 수십 년에 걸친 도파민작용제 치료의 필요를 피하기 위해 수술적 치료를 선택할 수 있다.'],
'15.6':['W','임신을 원하는 환자에서 거대프로락틴종의 감량수술(debulking)은 향후 임신 중 증상성 종괴 증대의 위험을 줄이므로 도파민작용제 치료의 대안이 된다.'],
'15.7':['S','자발적 뇌척수액 비루가 있으면 수술적 교정을 시행해야 한다.'],
'16.1':['S','방사선 치료는 도파민작용제에 대한 종괴 축소 반응이 불량하면서 수술 후 절제 불가능한 잔여 선종이 있거나 수술 금기가 있는 환자에게 국한해야 한다.'],
'16.2':['S','정위적 방사선치료 기법은 결과를 개선하며, 가능한 곳에서는 표준 치료가 되었다.'],
'16.3':['S','방사선치료에 대한 반응은 수년이 걸릴 수 있음을 환자에게 알려야 한다.'],
'16.4':['S','치료 후 수년이 지나서도 부작용이 생길 수 있음을 알리고, 뇌하수체기능저하증, 시신경병증, 뇌신경마비, 이차 뇌종양을 발견하기 위해 평생 추적해야 한다.'],
'17.1':['S','낭성 프로락틴종은 도파민작용제 치료에 반응할 수 있으므로, 특히 시신경교차 감압이 급하지 않은 환자에서 도파민작용제 치료를 유효한 선택지로 고려해야 한다.'],
'17.2':['SW','진단 평가에서 줄기 압박으로 고프로락틴혈증을 일으키는 뇌하수체 낭성 병변을 배제해야 하며(강), 이러한 병변은 도파민작용제 치료에 반응하지 않을 가능성이 높다(약).'],
'17.3':['W','시야 결손이 없으면 6개월 간격의 MRI 추적이 적절할 것이다.'],
'18.1':['S','여성형유방, 성욕 감소, 발기부전, 불임 또는 유즙분비를 동반한 저생식샘자극호르몬 생식샘저하증 남성은 고프로락틴혈증과 프로락틴분비선종을 평가해야 한다.'],
'18.2':['S','남성의 거대프로락틴종은 더 공격적이며 여성보다 도파민작용제 반응률이 낮다(강). 도파민작용제, 수술 및/또는 방사선 치료를 병합하는 다중 치료가 흔히 필요하며 면밀한 추적이 필요하다(강).'],
'18.3':['S','충동조절장애라는 도파민작용제 부작용은 여성보다 남성에서 더 자주 관찰되므로, 치료 시작 전에 환자 및 배우자·가족과 충분한 정보를 바탕으로 논의해야 한다.'],
'19.1':['S','성장호르몬 과다 분비를 동반한 뇌하수체선종 환자의 고프로락틴혈증은 다른 치료 접근이 필요하다.'],
'19.2':['S','말단비대증과 고프로락틴혈증이 있는 환자에서는 선종 크기와 추적 경과를 고려하여 줄기효과와 선종의 동시 생산을 구별해야 한다.'],
'19.3':['SW','순수 성장호르몬세포 선종은 유선성장호르몬세포(mammosomatotroph) 선종(같은 단일 세포에서 프로락틴과 GH를 함께 분비)과 성장호르몬세포–젖분비세포 혼합 선종(두 세포 유형이 공존)과 조직학적으로 구별해야 한다(강). 유형에 따라 예후가 다르므로 정확한 진단이 중요하다(약).'],
'19.4':['W','공격적 프로락틴종은 호산성 줄기세포 선종(acidophil stem cell adenoma)의 표지자와 GH 동시 분비를 평가해야 한다.'],
'19.5':['S','말단비대증의 임상 양상이 가려지거나 시간이 지나서 나타날 수 있으므로, 고프로락틴혈증 환자는 기저 시 혈청 인슐린유사성장인자-1(IGF-1)로 자율적 GH 분비를 선별해야 한다. 자율적 GH 분비가 확인되면 치료 전략이 바뀌며, 현행 말단비대증 지침을 따라야 한다.'],
'19.6':['S','추적 중 IGF-1이 ULN 이상으로 상승하고 선종 종괴로 인한 시각 변화가 없다면, GH 과다분비를 평가하기 위해 도파민작용제를 4주간 중단해야 한다.'],
'20.1':['S','초거대 프로락틴종은 드물고 주로 남성에서 관찰되며, 대개 도파민작용제 치료에 잘 반응하므로 내과적으로 관리해야 한다.'],
'20.2':['S','이환율과 사망률 증가 위험 때문에 이러한 큰 프로락틴종의 수술적 절제는 졸중 또는 뇌척수액 누출이 있거나 최적 치료에도 종괴가 진행성으로 커지는 환자로 제한해야 한다.'],
'21.1':['S','공격적 프로락틴종은 비정상적으로 빠른 성장 속도를 보이는 침습성 선종, 또는 최대 내약 도파민작용제 용량에도 임상적으로 유의한 성장을 보이는 선종으로 정의한다.'],
'21.2':['W','카버골린으로 잘 조절되던 프로락틴종 환자에서 혈청 프로락틴이 상승하면 공격적 선종의 발생, 그리고 매우 드물게 암종을 시사할 수 있다.'],
'21.3':['S','부위 특이적 증상(신경학적 결손 또는 요통 등)이 있는 드문 프로락틴종 환자, 그리고 혈청 프로락틴과 뇌하수체 종괴 사이에 명백한 불일치가 있는 환자는 전이(암종을 정의함)를 평가해야 한다.'],
'21.4':['S','침습성을 시사하는 영상 소견과 조직학적 증식 표지자의 조합은 프로락틴종의 행태를 예측할 가능성이 높다.'],
'21.5':['S','공격적 프로락틴종에서 모든 치료법을 소진했음에도 지속적인 선종 성장이 기록되면 항암제 테모졸로마이드를 권고한다.'],
'21.6':['SW','테모졸로마이드에 대한 반응은 3개월 후 평가해야 하며, 반응하는 환자에서는 최소 6개월(강) 또는 반응이 관찰되는 한(약) 치료를 지속한다.'],
'21.7':['W','테모졸로마이드 실패 후 공격적 프로락틴종에서 면역관문억제제 사용이 유효한 선택지가 될 수 있다.'],
'22.1':['S','임신을 고려하는 프로락틴종 환자에게는 내과적 및 수술적 선택지 모두에 대해 설명해야 한다.'],
'22.2':['W','임신 직전에 시행하는 종합 검사는 혈청 프로락틴, 시야, 선종 크기에 대한 기저 정보를 제공한다.'],
'22.3':['S','임신을 원하며 임신 전 뇌하수체 수술을 받는 환자에게는 뇌하수체기능저하증의 위험과 그것이 가임력에 미치는 영향을 알려야 한다.'],
'22.4':['W','임신 전에 치료 효과를 확인하고 월경 주기를 확립하기 위해 호르몬 피임법 대신 차단 피임법을 사용해야 한다.'],
'22.5':['S','태아의 도파민작용제 노출을 줄이기 위해 임신이 확인되는 즉시 도파민작용제를 중단해야 한다.'],
'22.6':['S','큰 거대프로락틴종 환자에서는 임신 중 도파민작용제 유지도 선택지이다.'],
'22.7':['W','브로모크립틴은 반감기가 짧아 태아 노출을 줄일 수 있으나, 축적되는 안전성 자료로 인해 현재 대부분의 센터에서 카버골린을 선호한다.'],
'22.8':['S','거대프로락틴종 환자는 임신 전에 도파민작용제에 대한 선종 반응을 확인해야 한다(강). 종괴 반응이 없으면 임신 전 수술을 고려해야 한다(강).'],
'22.9':['S','미세프로락틴종 환자의 임신은 대개 문제없이 경과하며, 3개월마다 임상적으로 추적해야 한다.'],
'22.10':['S','거대프로락틴종 환자는 임신 중 임상적으로 의미 있는 선종 증대와 졸중의 위험이 있다. 임신 중 매월 진찰하면서 국소 종괴 효과를 문진하고, 3개월마다 시야검사를 시행해야 한다.'],
'22.11':['S','임신 중 임상적으로 의미 있는 선종 성장이 의심되는 환자는 가돌리늄 없이 MRI를 시행해야 한다.'],
'22.12':['S','임신 시 중단했던 도파민작용제는 임상적으로 의미 있는 선종 성장이 있으면 재개를 고려해야 한다.'],
'22.13':['S','도파민작용제 재개에 반응하지 않는 증대된 선종에서는 뇌하수체 수술, 또는 임신이 충분히 진행되었다면 분만을 고려해야 한다.'],
'22.14':['S','임신 중 선종 성장을 평가하는 데 혈청 프로락틴을 사용해서는 안 된다.'],
'22.15':['S','모유수유는 대개 금기가 아니며, 종괴 조절을 위해 치료 재개가 필요한지에 따라 일정 기간 허용할 수 있다.'],
'23.1':['S','성인과 같은 임상 증상(이차성 무월경, 유즙분비) 외에, 저생식샘자극호르몬 생식샘저하증에 의한 사춘기 지연도 소아에서 고프로락틴혈증 평가의 계기가 되어야 한다.'],
'23.2':['S','졸중과 공격적 프로락틴종 행태는 성인보다 소아에서 더 흔하므로, 임상적 의심이 높으면 신속히 검사해야 한다.'],
'23.3':['S','거대프로락틴종 소아는 <i>MEN1</i> 및 <i>AIP</i> 생식세포 변이 유전검사를 받아야 한다.'],
'23.4':['SW','도파민작용제는 저용량(예: 카버골린 주 0.25 mg)으로 시작하며(약), 소아에서 부작용 가능성이 높으므로 천천히 증량한다(강).'],
'23.5':['S','시력이 위협받는 경우, 심한 신경학적 증상이나 뇌척수액 누출이 있는 경우, 또는 종괴가 도파민작용제 치료에 저항성인 경우 수술을 고려해야 한다.'],
'23.6':['W','미세프로락틴종 소아에서는 장기 내과 치료를 피하기 위해 수술을 고려할 수 있다.'],
'23.7':['W','방사선 치료는 도파민작용제 치료와 수술에 반응하지 않는 공격적 선종 환자에 국한해야 한다.'],
'24.1':['S','기저 정신질환이 있는 환자의 프로락틴종 관리에는 내분비내과의, 신경외과의, 정신건강의학과의의 협력이 필요하다.'],
'24.2':['W','기저 정신질환이 있는 환자에서 도파민작용제 치료 시작은 아마도 안전하나, 주의와 정신건강의학과 자문이 필요하다.'],
'24.3':['S','항정신병약 시작 전에 프로락틴을 측정해야 한다.'],
'24.4':['S','ULN의 10배를 넘는 혈청 프로락틴은 항정신병약 매개 고프로락틴혈증에서 드물며 프로락틴종을 의심하는 계기가 되어야 한다.'],
'24.5':['SW','감량하거나 아리피프라졸처럼 고프로락틴혈증을 일으키지 않는 2세대 항정신병약으로 전환하면 대부분의 환자에서 프로락틴종과 약물 유발 고프로락틴혈증을 구별할 수 있다(강). MRI로 줄기효과를 동반한 큰 병변을 배제할 수 있다(약).'],
'24.6':['W','항정신병약으로 치료 중인 환자에서는 도파민작용제의 효과가 감소하여 더 높은 용량이 필요할 수 있다.'],
'24.7':['W','프로락틴을 올리지 않는 항정신병약을 단독으로, 또는 기존 항정신병약에 병용하면 도파민작용제를 감량할 수 있다.'],
'24.8':['W','항정신병약 치료가 필요한 환자에서는 미세프로락틴종에서의 성호르몬 보충이나 수술 등 대안 치료를 고려할 수 있다.'],
'25.1':['S','잘 조절되는 미세프로락틴종 여성이 폐경에 들어가면 도파민작용제 중단을 시도해야 한다.'],
'25.2':['S','폐경 후 거대프로락틴종 여성에서는 선종 성장 조절을 목표로 치료해야 한다.'],
'25.3':['W','폐경 후 미세프로락틴종 여성에서 대사 지표 개선, 유방암 위험 감소, 골밀도 개선을 목적으로 혈청 프로락틴을 정상화할 적응은 없다.'],
'26.1':['S','트랜스젠더 여성에서 에스트라디올과 시프로테론아세테이트 병합 치료는 대개 경도의 무증상 고프로락틴혈증을 일으킨다.'],
'26.2':['W','프로락틴이 현저히 상승하거나 종괴 효과 또는 유즙분비 증상이 있으면 프로락틴종 진단을 고려해야 한다.'],
'26.3':['W','성확정 호르몬 치료를 받는 트랜스젠더 여성에서 프로락틴종 발생률이 증가한다는 근거는 없다.'],
'27.1':['W','CKD 환자의 고프로락틴혈증 평가는 증상과 생식샘저하증 유무에 따라 개별화해야 한다.'],
'27.2':['W','CKD 환자에서는 임상 증상에 따라 생식샘저하증과 기저 고프로락틴혈증을 도파민작용제 또는 성호르몬 보충으로 치료하는 것을 고려할 수 있다.']
};

const EXP = {
1:['프로락틴종은 가장 흔하게는 젖분비세포(lactotroph)에서 기원한 양성 프로락틴분비선종으로, 남녀 모두에서 전체 뇌하수체선종의 50%를 차지한다. 25–44세에서는 주로 여성에게 발생하여 여남비가 5:1–10:1이나, 폐경 후에는 비율이 비슷해진다. 여성의 표준화 발생률은 남성의 3배이다. 거대프로락틴종 대 미세프로락틴종의 비는 여성에서 약 1:8, 남성에서 4:1이다.',
'미세프로락틴종(최대 직경 &lt;10 mm)은 가장 흔한 유형이며 거대프로락틴종(직경 ≥10 mm)으로 자라는 경우는 드물다. 초거대 프로락틴종(giant prolactinoma, &gt;40 mm인 거대프로락틴종)은 드물다. 지난 20년간의 연구들은 이전에 예측한 것보다 높은 유병률을 시사한다. 발생률과 유병률은 Supplementary Table 1과 Supplementary Box 1에 제시되어 있다.'],
2:['프로락틴종 발생의 분자 기전은 더 규명되어야 한다. 프로락틴종은 대부분 산발성 단클론성 신생물로, 성장 이점을 부여하는 체세포 유전 사건을 시사한다. 한 연구에서 splicing factor 3 subunit B1의 핫스팟 체세포 변이(<i>SF3B1</i><sup>R625H</sup>)가 프로락틴종의 20%에서 확인되었고, 이 변이가 없는 프로락틴종보다 혈청 프로락틴이 높고 잠재적으로 더 공격적인 행태와 관련되었다.',
'프로락틴종이 생식세포 변이와 연관되는 경우는 매우 드물며, 있는 경우 체세포 변이보다 발병 연령이 젊다. <i>MEN1</i> 생식세포 변이를 가진 다발성 내분비샘종양 1형 환자의 거대프로락틴종은 변이가 없는 경우보다 더 공격적이고 치료에 저항할 수 있다. 반면 <i>MEN1</i> 변이를 가진 미세프로락틴종은 이전에 생각한 것보다 덜 공격적일 수 있다. 병원성 <i>AIP</i> 변이는 매우 드물게 발견되므로 불필요한 검사와 비용을 피하기 위해 선별검사를 권고하지 않는다.',
'추가 논의는 Supplementary Box 1을 참조한다.'],
3:['스트레스, 임신, 수유 중 증가한 프로락틴 분비는 시상하부 키스펩틴(kisspeptin) 신경세포의 기능을 억제하여 생식샘자극호르몬분비호르몬(GnRH) 생성을 감소시킨다. 프로락틴종의 임상 양상은 부분적으로 프로락틴에 의한 시상하부–뇌하수체–생식샘 축 억제를 반영하며, 이는 대개 혈청 프로락틴이 정상화되면 회복되지만 특히 거대프로락틴종 남성에서는 생식샘저하증이 지속될 수 있다.',
'고프로락틴혈증은 여성에서 유즙분비를 동반하거나 동반하지 않는 희발월경 또는 무월경, 남성에서 발기부전을 일으키며, 성욕 감소와 불임은 양성 모두에서 관찰된다. 비만은 비기능성 뇌하수체선종 환자보다 프로락틴종 환자에서 4배 더 흔하다고 보고되지만, 이는 동반된 생식샘저하증에 이차적으로 발생할 가능성이 높다(Supplementary Box 2).',
'현재 자료에 근거하면 미세프로락틴종 및 거대프로락틴종이 있는 남성과 폐경 전 여성에서 저생식샘자극호르몬 생식샘저하증 선별은 아마도 정당하다.'],
4:['프로락틴종 환자의 GH, TSH 및/또는 ACTH 결핍의 유병률과 임상 경과는 주로 후향적 연구에서 도출되었으며, 생식샘저하증에 비해 덜 규명되어 있다. 호르몬 결핍은 미세프로락틴종보다 거대프로락틴종 환자에서 더 흔하다. 남성 81명을 대상으로 한 연구에서 치료 전 TSH 결핍과 ACTH 결핍의 유병률은 10–19 mm 거대프로락틴종에서 각각 6.7%와 0%, 20–39 mm 거대프로락틴종에서 17.9%와 6.9%, ≥40 mm 초거대 프로락틴종에서 26.1%와 33.3%였다.',
'수술과 방사선 모두 뇌하수체기능저하증을 유발할 수 있으므로 치료 후 평가 시점은 개별화해야 한다(Supplementary Box 2).',
'진단 시 거대선종과 6–9 mm 미세선종을 가진 모든 환자에서 GH, TSH, ACTH 결핍 선별이 논의되었다. 합의는 기저 뇌하수체 결핍과 종괴 확장, 그리고 프로락틴과 선종의 반응에 따라 효과적인 도파민작용제 치료 후 뇌하수체 기능을 재검사하는 것이었다. 수술적 절제를 받는 환자에서는 GH, TSH, ACTH 결핍 선별이 권고되었고, 기저 선종 크기, 수술 소견, 수술 후 증상에 따라 수술 후 약 6–12주에 재검사가 권고되었다. 일부 참여자는 진단 시 호르몬 결핍이 있었던 환자와 &gt;6 mm 프로락틴종 환자는 모두 수술 후 재검사해야 한다고 결론지었다.'],
5:['프로락틴 분비는 시상하부에서 유래한 도파민의 만성적인 억제 조절을 받는다(Fig. 1). 도파민은 뇌하수체 줄기를 거쳐 D2 수용체(D2R)를 통해 프로락틴 생성과 젖분비세포 증식을 억제한다. 이러한 억제 작용에는 에스트로겐이 대항한다.',
'고프로락틴혈증의 가장 흔한 병적 원인은 프로락틴종에 의한 프로락틴 과다 생성이다. 그러나 비분비성 뇌하수체선종을 포함하여 뇌하수체 줄기를 압박하는 안장 주위 또는 안장 내 종괴는 도파민 흐름을 방해하여 고프로락틴혈증을 일으킬 수 있다(Box 2). 따라서 혈청 프로락틴 상승(ULN의 6배까지)은 시상하부–뇌하수체 병변, 또는 국소 외상, 수술, 방사선, 두개골 골절, 내경동맥류의 증거를 반영할 수 있다. 뇌하수체선종 크기에 맞춘 프로락틴 절단값이 진성 프로락틴종과 다른 뇌하수체 병변을 구별할 수 있다.',
'에스트로겐은 고프로락틴혈증을 강력하게 유발하지만, 경구피임제가 프로락틴종 발생에 미치는 영향은 논란이 있다. 환자–대조군 분석에서는 폐경호르몬치료 및 에스트로겐–프로게스테론 복합 경구피임제 사용 시 프로락틴종 위험이 경미하게 증가했으나, 전향적 코호트 분석에서는 경구피임제에 따른 위험이 나타나지 않았다(임신 중 프로락틴 과다에 대한 논의는 Supplementary Box 3).',
'원발성 갑상선기능저하증은 고프로락틴혈증으로 나타날 수 있으며 이는 갑상선호르몬 보충으로 회복된다. 두개내 저압도 고프로락틴혈증을 일으킬 수 있다. 스트레스(예: 정맥천자)는 혈청 프로락틴을 2–4배 상승시킬 수 있으며 이는 1시간 미만 지속된다. 혈청 프로락틴이 ULN 5배 미만이거나 스트레스의 영향이 의심되면 반복 채혈 또는 카테터 거치 후 채혈을 권고한다. 운동, 고단백 식사, 음주 후에도 생리적 프로락틴 상승이 생길 수 있다. 다낭성난소증후군(PCOS) 자체는 고프로락틴혈증과 드물게 연관되므로 PCOS 환자의 프로락틴 상승은 추가 평가가 필요하다.',
'림프구성 뇌하수체염에서의 높은 프로락틴은 자가면역 세포 작용 또는 줄기효과를 반영할 수 있다. 원인 불명으로 보이는 고프로락틴혈증에서는 뇌하수체염을 고려해야 한다. 말단비대증에서 GH와의, 또는 갑상선자극호르몬분비선종에서 TSH와의 프로락틴 동시 분비는 다호르몬 선종 또는 줄기효과에 의한 것이다.',
'도파민 길항제 또는 세로토닌 작용제로 작용하는 많은 약물이 고프로락틴혈증과 유즙분비를 일으킬 수 있다(Box 2).'],
6:['고프로락틴혈증의 정확한 생화학적 진단은 추가 검사의 전제조건이지만, 프로락틴 측정값을 높이는 여러 상황이 중첩되어 어려울 수 있다. 증상과 생화학 결과가 일치하지 않는 환자에서는 측정상의 인공물을 의심해야 한다. 측정 오류, 거대프로락틴혈증, 고용량 갈고리 효과가 모두 위양성 또는 위음성 프로락틴 측정의 가능한 원인이다(Fig. 2).',
'#프로락틴 측정법',
'프로락틴은 대개 면역측정법으로 측정하며, 23 kDa 단량체 인간 프로락틴만을 포함하는 WHO 84/500 국제표준에 보정된다. 진단은 잘 확립된 측정법별·성별 참고범위에 의존한다. 그러나 발표된 상한값은 대부분의 제조사가 제시하는 값보다 낮고, 정상값은 남성보다 여성에서 높으며, 측정 단위가 다를 수 있다(1 µg/L = 21.2 mIU/L). 자극검사와 억제검사는 비특이적 결과를 보여 거의 사용되지 않게 되었다.',
'#거대프로락틴혈증',
'주된 순환 프로락틴은 분자량 23 kDa이며, 이와 달리 ‘big’ 프로락틴(40–60 kDa)과 ‘big-big’ 프로락틴(&gt;150 kDa)이 있다. 고프로락틴혈증 환자의 10–25%에서 big 및 big-big 프로락틴이 혈청에서 검출될 수 있다. 프로락틴에 결합한 항프로락틴 자가항체(주로 IgG)가 big-big 프로락틴, 즉 거대프로락틴혈증의 원인이 된다. 이 변이형들은 프로락틴 측정에 간섭하지만 생물학적으로 불활성이므로 대부분의 거대프로락틴혈증 환자는 전형적인 고프로락틴혈증 증상이 없다. 폴리에틸렌글리콜(PEG) 침전 후 프로락틴 회수율로 대개 거대프로락틴혈증과 진성 고프로락틴혈증을 구별할 수 있다(Supplementary Box 3).',
'#갈고리 효과(hook effect)',
'2부위 면역방사측정법 또는 화학발광측정법에서 극도로 높은 농도의 프로락틴과 함께 배양하면 두 항체가 모두 포화되어 샌드위치 형성이 방해되며, 이것이 이른바 갈고리 효과이다. 따라서 혈청 프로락틴이 매우 높은 환자가 측정에서는 중등도 상승으로만 나타날 수 있다. 갈고리 효과는 현재의 측정법에서는 드물지만, 프로락틴이 경미한 상승에 그치는데 거대프로락틴종에 대한 임상적 의심이 높으면 고려해야 한다.'],
7:['MRI는 뇌하수체 및 안장주위 병변의 진단과 치료 또는 미치료 뇌하수체선종의 추적에 권장되는 영상검사이다. 그러나 반복 영상은 비용 부담이 있고 선형 가돌리늄 조영제의 잔류 가능성이 보고되었다. 따라서 치료 반응을 안전하게 평가하기 위한 최적의 영상 빈도를 정하는 것이 매우 중요하지만 근거는 부족하다. 거대프로락틴종의 확장은 대개 생화학적·임상적 변화를 동반하며 혈청 프로락틴은 대개 선종 크기와 상관하지만 예외도 있다. 도파민작용제로 치료하지 않는 미세선종은 크기가 커지는 경우가 드물므로, MRI(프로락틴 모니터링의 보조 수단)는 대개 선종 성장이나 시신경교차 근접이 의심될 때, 또는 수술 가능성을 평가할 때만 필요하다.',
'프로락틴종은 T2 강조영상에서 대개 경미한 고신호를 보인다. 남성에서는 괴사와 출혈을 반영하는 불균질한 T2 신호가 나타날 수 있으며, 이는 균질한 선종에 비해 높은 혈청 프로락틴 및 낮은 도파민작용제 반응과 관련될 수 있다. 여성에서 T2 저신호는 도파민작용제 저항성과 연관되었다. 도파민작용제 치료 중 T2 고신호가 증가하지만 출혈성 또는 고신호가 매우 강한 선종에서는 뚜렷하지 않을 수 있다. T2 경사에코(gradient echo) 영상이 출혈 진단에 유용할 수 있다.',
'#내과적 치료 후 MRI 시점',
'거대프로락틴종은 도파민작용제 시작 3–6개월 후 MRI를 반복해야 한다. 카버골린 시작 3개월 시점의 크기 감소는 이후 장기 반응 및/또는 생화학적 조절을 예측할 수 있기 때문이다. 미세프로락틴종의 재촬영은 임상적·생화학적 추적에 따르지만, 1년 후 또는 적어도 도파민작용제 중단을 고려할 때 반복할 수 있다. 생화학적으로 저항성인 프로락틴종은 도파민작용제 치료 중에도 선종이 자랄 수 있으므로, 지속적으로 높거나 상승하는 혈청 프로락틴에서는 추적 영상을 고려해야 한다. 도파민작용제로 축소가 확인되지 않고 초기 혈청 프로락틴이 프로락틴종을 명백하게 시사하지 않으면 비기능성 선종에 의한 줄기효과를 다시 고려해야 한다.',
'치료에 반응하는 미세프로락틴종과 거대프로락틴종에서는 혈청 프로락틴이 지속적으로 상승하지 않는 한 1년 이후의 연속 영상이 필요하지 않다. 그러나 부분 반응을 보이는 거대프로락틴종이나 시신경교차에 가까운 경우에는 처음 3년간 매년, 그 이후 덜 자주 주기적인 영상이 필요할 수 있다. 뇌하수체 졸중을 시사하는 증상은 즉시 영상검사가 필요하다.',
'혈청 프로락틴이 정상화되었으나 종괴 축소가 미미하거나, 뚜렷한 축소에도 프로락틴이 완전히 정상화되지 않는 불일치 결과를 마주할 수 있다. 프로락틴은 흔히 첫 6개월 내에 정상화되고 상당한 종괴 축소도 일찍 일어날 수 있지만, 일부 프로락틴종은 수년간의 도파민작용제 치료에 걸쳐 서서히 작아진다.',
'도파민작용제 중단을 고려할 때 MRI상 잔여 선종이 없는 것은 재발하지 않을 유리한 예후 인자이다. 도파민작용제 중단 후 혈청 프로락틴이 진행성으로 상승하거나 두통, 시력 변화, 뇌하수체 기능장애가 생기면 MRI를 시행해야 한다.',
'#수술 후 MRI 시점',
'새로운 기저 상태를 확립하기 위해 수술 후 3–6개월에 MRI를 시행해야 한다. 도파민작용제 저항성이면서 부분 절제된 선종은 초기에 6–12개월 간격으로 연속 영상을 시행할 수 있다. 완전 절제된 선종은 혈청 프로락틴이 상승하거나 두통, 시력 변화, 뇌하수체 기능장애가 생길 때만 재촬영해야 한다. 미세프로락틴종에 대한 일차 치료로 수술을 시행하여 수술 후 프로락틴이 정상화되었다면 고프로락틴혈증 재발 시에만 반복 영상이 필요하다.',
'#임신 중 MRI',
'임신은 특히 거대프로락틴종에서 프로락틴종 증대의 위험인자이며, 이전 수술을 받지 않은 환자에서 위험이 증가한다. 프로락틴종이 있는 임신부가 이전보다 심해지거나 양상이 다른 두통, 또는 시력 변화(대개 선종 증대를 시사)를 보이면 조영제 없이 MRI를 시행해야 한다. 미세프로락틴종에서도 임신 중 졸중이 보고되었으므로, 우려되는 증상이 있으면 영상검사가 필요하다.'],
8:['수술을 받는 환자, 특히 수술적 완치 기대가 높은 미세프로락틴종이나 정위적 방사선수술을 받는 환자에서는 정확한 선종 국소화가 뇌하수체기능저하증 위험을 줄일 수 있다. 동적·용적 MRI 시퀀스는 이전에 보이지 않던 종괴를 찾는 데 유용하지만, 분자(기능) 영상은 표적 중재를 안내할 수 있다. 분자 <sup>11</sup>C-메티오닌 PET은 MRI가 불확정적일 때 새로 발생한 프로락틴종과 잔여 프로락틴종의 국소화를 위한 MRI의 보조 수단으로 유망하다(Supplementary Box 4).'],
9:['대부분의 참여자는 생식샘 기능 회복에 대한 평가를 혈청 프로락틴 정상화 후 최소 6개월에 시행해야 한다는 데 동의했다. 회복은 남성의 약 60%에서 일어나며 여성에서는 더 흔하다. 완전 뇌하수체기능저하증이 있으면 생식샘저하증 회복 가능성이 낮아 조기 호르몬 보충이 정당화될 수 있다.',
'성호르몬 보충을 시작한 후에는 혈청 프로락틴이 상승할 수 있다. 큰 선종 환자에서는 단기작용 테스토스테론 제형(예: 테스토스테론 젤)을 권고하는데, 도파민작용제와 테스토스테론 병용의 부작용(예: 과민성, 과다성욕)이 생기면 빠르게 되돌릴 수 있기 때문이다. 허가 외로 아로마타제 억제제 치료를 고려할 수 있으나 장기 자료가 제한적이고 뼈 건강에 추가적인 부작용이 있을 수 있다. 클로미펜은 생식샘저하증 남성에서 허가 외 치료로 사용되었다.',
'가임 계획을 고려할 때는 테스토스테론을 시작해서는 안 된다. 사람융모생식샘자극호르몬(hCG)과 재조합 난포자극호르몬(FSH)으로 정자형성 유도를 고려할 수 있다. 그러나 한 연구에서 테스토스테론으로 치료한 뇌하수체기능저하증 남성의 거의 50%가 임신에 충분한 정자형성을 보였으므로, 생식샘자극호르몬 치료 시작 전에 정액검사를 시행해야 한다(Supplementary Box 5).'],
10:['장기간(즉, &gt;6개월) 생식샘저하증이 의심되거나 폐경, 이전 척추골절 등 골다공증의 다른 위험인자가 있는 모든 프로락틴종 환자에서 기저 DXA를 권고한다. 골다공증, 특히 골절을 동반한 경우는 일반 지침에 따라 골다공증 치료제로 치료해야 한다. 이와 관련하여 간접 근거상 고프로락틴혈증의 조절이 잠재적인 역할을 할 수 있으나, 위험 대비 이득을 평가하기 위한 특정 연구가 필요하다(Supplementary Box 5).'],
11:['도파민작용제는 프로락틴종의 효과적인 치료로, 혈청 프로락틴 정상화, 선종 종괴 감소, 생식샘 기능 회복을 가져온다(Fig. 3). 카버골린, 브로모크립틴, 퀴나골리드는 대부분의 증상을 조절하지만, 카버골린의 효능이 우월하여 권장 치료이다(Supplementary Box 6). 초거대 프로락틴종 환자에서도 높은 효능이 유지되어 시야 개선 97%, 혈청 프로락틴 정상화 60%, 선종 용적 감소 74%가 보고되었다. 흔히 사용되는 용량은 카버골린 주 0.5–3.5 mg(FDA 승인 최대 용량 주 2 mg), 브로모크립틴 하루 2.5–15 mg, 퀴나골리드 하루 75–300 µg이다.',
'도파민작용제 치료 중 영상 및 프로락틴 변화를 분석한 연구에서 선종 크기와 혈청 프로락틴의 가장 큰 감소는 치료 시작 6개월 이내에 일어났다. 이후 6개월 동안 개선 속도는 크게 감소했고 그 후에는 더 줄었다. 따라서 첫 3–6개월에 좋은 반응을 보이지 않는 프로락틴종은 도파민작용제에 충분히 반응하지 않을 가능성이 높다. 카버골린 3개월 후 정상 프로락틴과 &gt;25% 종양 용적 감소는 장기 반응을 예측한다. 6개월 후 혈청 프로락틴이 낮을수록 장기 정상화를 예측하며(ULN 이하이면 정상화 100%, ULN 3배 이하이면 61%, ULN 3배 초과이면 39%), MRI상 종괴 축소는 장기 선종 축소와 상관하지만, 결과는 증량 프로토콜에 따라 다를 수 있다. 장기(&gt;15개월) 도파민작용제 반응의 다른 예측인자로는 치료 전 낮은 프로락틴, 진단 시 작은 선종, 낮은 도파민작용제 용량(카버골린 주 &lt;2 mg)으로의 프로락틴 정상화가 있다.'],
12:['카버골린의 가장 흔한 부작용은 위 불편감, 오심과 구토, 경미한 어지럼이다. 증상의 강도는 개인의 내약성에 따르지만 대개 경미하며 복약 순응을 드물게 저해한다. 주로 치료 시작 시 나타나며, 저용량으로 시작하여 천천히 증량하면 대개 줄거나 없어진다. 경구 카버골린에 대한 불내약이 지속되면 가능한 경우 퀴나골리드(더 특이적인 D2R 작용제) 등 다른 도파민작용제로 바꿀 수 있다. 불내약은 수술적 절제를 포함한 다른 치료를 재평가하는 적응이 될 수도 있다.',
'기분 변화나 충동조절장애는 이전 정신질환이 없는 환자에서도 도파민작용제 사용 중 발생할 수 있다. 충동성 변화는 남성에서 더 흔하지만 양성 모두에서 발생하며 용량과 관련이 없다. 이러한 변화는 도박, 공격성, 강박적인 금전 소비, 우울 또는 조증으로 이어질 수 있다. 과다성욕은 이전에 프로락틴 매개 생식샘저하증이 있던 남성에서 더 흔한데, 도파민작용제 시작으로 생식샘 기능이 회복되면서 테스토스테론이 급격히 반동 상승하기 때문일 수 있다. 일반적으로 이러한 효과는 도파민작용제를 중단하면 가역적이며 감량으로도 흔히 호전된다. Patient Health Questionnaire 9(PHQ-9)와 Barratt Impulsiveness Scale로 기분 변화와 충동조절장애를 선별하는 것이 유용하다. 환자가 충동적 도박 같은 행동을 숨겨 잠재적으로 파탄적인 결과를 초래할 수 있으므로 환자의 배우자 및 가족과 이러한 증상을 논의하는 것이 중요하다.',
'약물에 의한 선종 종괴 축소로 인한 뇌척수액 비루는 수술로 관리해야 한다. 진단은 비강 분비물의 β<sub>2</sub>-transferrin 또는 β-trace protein 상승으로 한다. 뇌척수액 누출량이 적으면 감량과 관찰을 고려할 수 있으나, 뇌척수액 누출 환자의 90%에서 결국 수술적 교정이 필요하다.'],
13:['판막질환 선별에 대한 논의는 영국 심초음파학회(British Society of Echocardiography), 영국 심장판막학회(British Heart Valve Society), 영국 내분비학회(Society for Endocrinology)가 공동 개발한 지침에 근거했다. 중요하게도, 이 합의 권고는 이전에 발표된 권고와 다소 다르다(Supplementary Box 6).'],
14:['만성 도파민작용제 사용의 잠재적 장기 부작용, 장기 내과 치료의 비용, 일부 환자의 낮은 순응도 때문에, 고프로락틴혈증의 지속 관해 가능성이 상당한 환자에서는 잘 정의된 조건하에 치료 중단을 고려할 수 있다(Supplementary Box 6).',
'신중한 환자 선택이 핵심이다(Supplementary Table 2). 중단 후 지속 관해 가능성이 가장 높은 경우는 비침습성 소형 선종이면서, 저용량 카버골린(주 0.25–0.50 mg)으로 최소 2년 치료한 후 혈청 프로락틴이 정상이고 종양 크기가 뚜렷이 감소한 환자이다. 치료받은 환자의 1/3만이 이 기준을 충족할 것이나, 이 아군에서는 미세프로락틴종의 거의 55%, 거대프로락틴종의 43%가 치료 중단 후 관해를 유지한다. 따라서 이러한 조건이고 MRI상 보이는 종괴가 없으면 치료 중단을 권장해야 한다. 대안으로, 정상 혈청 프로락틴 유지에 필요한 최소 유효 용량이 확립될 때까지 용량을 연속적으로 줄이고 투여 간격을 늘리는 방식으로 도파민작용제를 점감할 수 있다.',
'도파민작용제 중단을 시도하면 첫해에는 3개월마다, 이후에는 매년 혈청 프로락틴을 측정해야 한다. 고프로락틴혈증이 재발하면 뇌하수체 MRI를 반복할 수 있다. 중단 후 고프로락틴혈증이 재발하여 치료를 재개한 환자에서는 2–3년의 추가 치료 후 두 번째 카버골린 중단 시도가 성공할 수 있다. 이 방법은 치료 중 혈청 프로락틴이 낮고 뇌하수체 MRI에서 보이는 종괴가 없는 환자에서 특히 유용할 수 있다.',
'폐경 여성의 프로락틴종에 대한 제한된 연구들에서 도파민작용제 중단 결과는 양호하였으며, 관해율이 폐경 전 여성보다 높았다.'],
15:['#수술의 적응',
'숙련된 신경외과의가 시행하는 경접형동 수술(TSS)은 미세프로락틴종의 최대 93%, 선택된 거대프로락틴종의 75%에서 초기 정상 프로락틴을 달성할 수 있다. 2005–2021년 문헌 검토에서는 선택되지 않은 미세프로락틴종 82%, 선택되지 않은 거대선종 44%로 정상화율이 더 낮았다(Supplementary Table 3). 그러나 이러한 관해는 단기간에 그칠 수 있어, 수술로 프로락틴이 정상화된 후 약 20%에서 고프로락틴혈증이 재발하며, 이는 미세프로락틴종 10%에서 선택되지 않은 거대프로락틴종 25%까지이다(Supplementary Table 3). 개선된 관해율과 낮은 합병증률은 선택된 환자에서 일차 도파민작용제 치료의 유효한 대안으로서 수술의 역할을 재평가할 근거가 된다.',
'수술로 절제한 프로락틴종은 WHO 뇌하수체 종양 분류에 따라 세포 계열별로 추가 분류할 수 있으며, 이를 위해 특정 뇌하수체호르몬과 전사인자(프로락틴 발현 선종에서는 PIT1과 에스트로겐수용체-α)의 평가가 필요하다. 순수 젖분비세포 선종은 희박과립형(sparsely granulated)과 치밀과립형(densely granulated)으로 아형이 나뉜다. 이들은 다호르몬 유선성장호르몬세포 선종, 성숙 다호르몬 PIT1 계열 선종, 성장호르몬세포–젖분비세포 혼합 선종, 그리고 다른 뇌하수체호르몬을 동시 발현하거나 더 공격적인 행태를 보일 수 있는 두 전구체 질환(호산성 줄기세포 선종, 미성숙 PIT1 계열 선종)과 구별된다.',
'숙련된 다학제 팀과 전문 뇌하수체 외과의가 있는 센터에서는 수술 성공에 유리한 종괴 형태를 고려하여 수술적 관해와 장기 도파민작용제 치료의 가능성을 환자와 논의하고, 환자의 선호를 인정해야 한다. ‘도파민작용제 저항성 및 불내약’이라는 고전적인 수술 적응은 여전히 유효하며 거대프로락틴종 환자에서 주된 수술 적응이다(Supplementary Box 6).',
'2021년 단일기관 연구에서 미세프로락틴종 TSS의 주된 적응은 환자 선호(42%)였고, 이어 도파민작용제 불내약(27%), 도파민작용제 저항성(20%), 불내약과 저항성 병합(12%)이었다. 다른 연구에서 관해율은 현미경 TSS 후 71–93%, 내시경 수술 후 81–100%였다. 수술 전후 및 수술 후 합병증률은 낮아, 신경외과적 합병증은 2% 미만, 사망률은 0%였다.',
'수술 전 혈청 프로락틴은 미세프로락틴종 관해율과 음의 상관관계를 보여, 수술 전 프로락틴 ≤200 ng/mL에서 관해율 92%, &gt;200 ng/mL에서는 40%에 불과했다. 또한 완전히 중앙에 둘러싸인 작은 미세프로락틴종의 관해율은 87%였던 반면 외측에 위치하여 해면정맥동벽에 인접한 경우는 45%였다. 수술 후 조기 혈청 프로락틴이 정상 하한 범위이면 장기 관해와 낮은 재발률을 예측한다. 숙련된 신경외과의가 절제한 미세프로락틴종에서 새로운 전엽 및 후엽 호르몬 결핍은 드물다.',
'당연하게도 거대프로락틴종의 수술적 관해율은 미세프로락틴종보다 낮으며, 침습성, 선종 크기 증가, 특히 높은 수술 전 혈청 프로락틴에 따라 크게 감소한다. 예를 들어 한 연구에서 수술적 관해율은 비침습성 거대프로락틴종 70.4%, 침습성 거대프로락틴종 23.5%였다. 또한 여성만 대상으로 한 두 번째 연구에서 둘러싸인 거대프로락틴종의 수술적 관해율은 95%, 침습성 거대프로락틴종은 25%에 불과했다. 안장위 확장이 있는 환자와 혈청 프로락틴이 &gt;282 ng/mL(Knosp grade &lt;3이면 &gt;346 ng/mL)인 환자에서 관해 가능성이 낮으며, 남성도 수술 후 관해의 음성 예측인자이다.',
'Knosp 분류에 따른 병기는 미세프로락틴종과 거대프로락틴종으로만 나누는 것보다 수술 성공을 더 잘 판별하는 것으로 보인다(Supplementary Table 3). 일부 연구는 Knosp grade 0–1 프로락틴종이 2–4보다 결과가 좋다고 하고, 다른 연구는 Knosp grade 0–2가 3–4보다 관해율이 높다고 한다.',
'침습성 거대프로락틴종이나 초거대 프로락틴종은 대개 일차 도파민작용제 치료를 하며, 수술은 자발적 또는 도파민작용제 유발 뇌척수액 비루에 국한한다. 그러나 큰 프로락틴종에서 급속하거나 진행성인 시력 손실이 있는 경우, 또는 큰 낭성 또는 출혈성 성분이 있어 시각 경로의 즉각적인 감압이 필요한 경우에는 수술이 선호될 수 있다. 또한 도파민작용제에 저항성인 환자에서는 이후 내과 치료의 성적을 높이기 위해 감량수술을 고려할 수 있다.',
'임신을 원하는 여성은 선종 절제 후 대개 가임력이 회복되므로 즉각적인 수술을 선호할 수도 있다. 거대프로락틴종에서 임신 전 선종 감량수술은 임신 중 증대에 의한 증상을 피할 수 있다. 임신 전에 TSS를 시행하면 증상성 거대프로락틴종 증대의 위험이 21%에서 4.7%로 감소한다.',
'#수술 전 내과적 치료',
'수술 전 내과적 치료를 사용할지는 여전히 논란이 있다. 2021년 메타분석에서 13개 연구에 걸쳐 중앙값 59%의 환자가 수술 전 도파민작용제를 사용했으며, 수술 전 치료 사용률이 중앙값보다 높은 연구에서 중앙값보다 낮은 연구보다 관해율이 낮았다(다만 민감도 분석에서는 차이가 통계적으로 유의하지 않았다). 이 결과는 적절한 환자에서 수술 전 내과적 치료 없이 일차 수술을 시행하는 것을 지지할 수 있다. 1개월 이상 브로모크립틴 치료 후 수술한 환자 대부분에서 선종 섬유화가 관찰되었으나 카버골린에서는 그 효과가 훨씬 덜 두드러졌다.'],
16:['방사선 치료는 프로락틴종에서 가장 적게 사용되는 치료로, 주로 내과적·수술적 치료가 성공하지 못한 경우, 대개 크기가 진행하는 공격적 프로락틴종 또는 프로락틴분비 악성종양 환자에게 제공된다. 기대 결과는 Supplementary Box 6에 기술되어 있다.'],
17:['낭성 성분은 모든 뇌하수체선종에서 드물지 않으며, 대개 용적의 50% 이상이 액체로 차 있는 주로 낭성인 프로락틴종과 구별해야 한다. 이 구분에는 도파민작용제 치료의 결과로 낭성 변성을 겪은 프로락틴종도 포함되지 않는다. 낭성 거대프로락틴종은 비슷한 크기의 고형 프로락틴종보다 혈청 프로락틴이 낮으므로(50–150 ng/mL) 진단이 어려울 수 있다. 이 특성 때문에 낭성 프로락틴종과, 줄기 압박으로 고프로락틴혈증을 일으키는 비기능성 낭성 병변을 감별하기 어렵다. 도파민작용제 시작 후 프로락틴이 감소하는 속도는 두 경우를 구별하는 데 항상 도움이 되지는 않는다. 도파민작용제 치료는 낭종 축소에 높은 효능을 보였으므로, 특히 시신경교차 감압이 급하지 않은 환자에서 고려해야 한다. 그러나 도파민작용제로 줄어들지 않는, 고프로락틴혈증을 동반한 다른 뇌하수체 낭성 병변도 고려하는 것이 중요하다.'],
18:['남성의 프로락틴종은 크고 침습적이며 때로 초거대일 수 있고, 생식샘저하증과 함께 시력 손상과 뇌하수체기능저하증을 포함한 종괴 효과로 나타난다. 혈청 프로락틴은 대개 높으며, 치료하지 않으면 낮은 테스토스테론과 골다공증을 동반한다. 성욕 감소와 발기부전은 서서히 진행하고 비특이적이며 노화 탓으로 여겨지거나 과소 보고될 수 있어, 고령 남성에서 고프로락틴혈증 진단이 흔히 지연된다. 프로락틴종은 일반적으로 여성보다 남성에서 더 공격적이며, Ki-67로 평가한 높은 증식, 세포 비정형, 혈관신생 및 증식 특징, 더 큰 침습성을 보인다.',
'크기나 침습과 무관하게 도파민작용제 치료가 선호된다. 거대프로락틴종 남성의 80–85%가 혈청 프로락틴 정상화를, 90%가 상당한 종괴 축소를 보인다. 거대프로락틴종과 시력 손상이 있는 남성의 85–95%에서 도파민작용제 치료 후 시야가 개선된다.'],
19:['유선성장호르몬세포 전구세포가 젖분비세포와 성장호르몬세포로 분화하므로, GH 분비세포와 프로락틴 분비세포로 이루어진 혼합 세포형 선종이 관찰될 수 있다(Supplementary Box 7).'],
20:['초거대 프로락틴종은 직경 &gt;40 mm, 뚜렷한 안장외 확장, 매우 높은 혈청 프로락틴(대개 &gt;1,000 µg/L), GH 또는 ACTH 동시 분비가 없는 경우로 정의된다. 남녀비는 약 9:1이다. 주위 구조로의 대량 확장으로 뇌신경마비, 수두증, 측두엽 뇌전증, 안구돌출 같은 신경학적 합병증이 생길 때까지 진단이 대개 지연된다. 공격적인 외양에도 이 선종들은 대부분 양성이며 카버골린에 잘 반응한다. 대부분의 환자에서 뚜렷한 종괴 크기 감소와 함께 신경학적 증상이 호전되며, 혈청 프로락틴은 최대 70%에서 정상화된다. 이 병변들은 대개 완전 절제가 불가능하다.'],
21:['#정의',
'대부분의 프로락틴종 환자는 도파민작용제에 잘 반응하여 혈청 프로락틴 정상화와 종괴 축소를 모두 보인다. 그러나 다양한 정도의 치료 저항성을 마주하게 되며, 이는 특정 기저 병태생리를 시사할 수 있다. 합의에 따라 ‘저항성’은 표준 도파민작용제 용량(브로모크립틴 하루 7.5–10 mg 또는 카버골린 주 2.0 mg)으로 최소 6개월 치료했을 때 혈청 프로락틴이 정상화되지 않거나 의미 있는 종괴 축소(최대 직경 ≥30% 감소)가 없는 것으로 정의한다. 중요하게도, 저항성 환자 모두가 치료 변경을 필요로 하지는 않는다. 예컨대 종괴 효과가 없고 위치상 종양 축소가 필요하지 않은 환자, 또는 선종은 조절되지만 지속적인 고프로락틴혈증으로 생식샘저하증이 남아 성호르몬 보충으로 관리되는 거대프로락틴종 환자에서는 도파민작용제 지속이 좋은 선택이다.',
'최대 내약 용량까지 도파민작용제를 증량해도 프로락틴이 조절되지 않아 감량 목적의 수술을 고려하는 경우 ‘불응성(refractory)’ 프로락틴종이라는 용어를 제안한다. 또한 불응성은 ‘공격성(aggressiveness)’과 구별해야 하며, 공격성은 최대 내약 용량의 도파민작용제 치료에도 선종 증식이 계속되는 환자에 국한하여 사용해야 한다.',
'원격전이가 생길 수 있으며 이는 프로락틴종을 암종으로 정의한다. 전체적으로는 극히 드물지만, 젖분비세포 기원 암종은 전체 뇌하수체 암종의 30%를 차지하며 가장 흔한 유형이다.',
'#예후',
'대부분의 예후 표지자 연구는 도파민작용제 저항성의 예측 표지자에 초점을 두며 공격성이나 악성에 특정하게 초점을 두지 않는다. 남성, 젊은 나이, 침습성은 도파민작용제 저항성 위험 증가와 관련된다. 침습(MRI, 수술, 조직 소견에 근거)과 증식(Ki-67 지수 ≥3%, 고배율 10시야당 유사분열 2개 초과, p53 염색 양성)을 함께 고려하는 임상병리학적 분류가 뇌하수체선종의 잠재적 공격적 행태를 예측할 수 있다.',
'#치료',
'저용량에 반응하지 않는 큰 잔여 또는 성장하는 선종에서는 최대 내약 카버골린 용량으로의 증량이 첫 단계이다. 감량수술은 수술 후 내과적 조절을 개선할 수 있으며, 보조 방사선치료도 고려할 수 있다. 이러한 치료가 실패하면 알킬화 항암제 테모졸로마이드가 현재 최선의 선택이며, 치료한 뇌하수체선종의 약 40%가 최소 부분 관해를 보인다. 더 긴 기간(&gt;6개월)의 테모졸로마이드 치료, 조기 사용, 방사선 치료와의 병용이 결과를 개선할 수 있다. 프로락틴분비 암종에서 면역관문억제제 ipilimumab과 nivolumab에 의한 면역치료는 종괴 축소를 포함한 반응을 유도하여, 공격적 프로락틴종에서 테모졸로마이드가 실패할 경우 선택지가 될 수 있음을 시사한다. 공격적 프로락틴종 환자에서 연구된 다른 선택지로는 everolimus, bevacizumab, lapatinib 등 표적항암제, 에스트로겐수용체 조절제 tamoxifen, 펩타이드수용체 방사성핵종 치료가 있다.',
'관리는 현행 유럽내분비학회(ESE) 진료지침에 상세히 논의되어 있다. 환자는 다학제 뇌하수체종양 전문센터(Pituitary Tumour Centres of Excellence)에서 추적해야 한다.'],
22:['대부분의 워크숍 참여자는 임신을 원하는 프로락틴종 여성의 일차 치료로 도파민작용제 내과 치료를 권고했다(Fig. 4, Supplementary Box 7). 그러나 숙련된 뇌하수체 외과의에 의한 비침습성 미세프로락틴종 수술도 합리적이라고 보았다. 숙련된 뇌하수체 외과의가 수술하면 미세프로락틴종의 수술 후 뇌하수체기능저하증 위험은 매우 낮다. 반면 거대프로락틴종 환자에서는 대부분 선종이 도파민작용제에 반응하지 않거나 및/또는 시신경 구조에 가까운 경우에만 수술을 권고한다. 이런 경우 전문 신경외과의, 산부인과의, 안과의, 내분비내과의로 구성된 다학제 팀에 의한 관리를 권고한다. 이전에 수술을 받은 환자는 임신 중 선종 성장 위험이 매우 낮다.',
'임신을 원하는 모든 여성을 카버골린에서 브로모크립틴으로 일률적으로 전환하기보다, 대부분의 워크숍 참여자는 최저 유효 용량의 카버골린 사용을 선호했다. 이 전략은 이미 카버골린으로 잘 조절되는 환자에서 특히 의미가 있는데, 브로모크립틴으로 전환하면 혈청 프로락틴 조절을 잃고 가임력에 악영향을 줄 수 있다는 우려가 있었기 때문이다. 또한 브로모크립틴 전환 후 부작용이 증가할 가능성은 순응도와 용량 조정 필요성에 영향을 주어 결과적으로 가임력에도 불리할 수 있다. 한 후향적 연구에서 임신 중 카버골린을 지속한 경우 중단한 임신보다 유산율이 높았으나, 추가 자료는 거의 없다.',
'임신 중 프로락틴 측정을 권고하지 않는다는 강한 합의가 있었다. 대신 임신 중 임상적으로 의미 있는 뇌하수체 종괴 확장의 평가는 증상에 근거해야 하며, 선종 확장의 증상이나 징후가 있으면 영상검사를 시행해야 한다.'],
23:['소아 환자의 프로락틴종은 <i>MEN1</i>과 <i>AIP</i> 생식세포 변이의 존재를 의심하게 해야 한다. 이러한 변이를 가진 뇌하수체선종은 변이가 없는 경우보다 더 공격적인 행태를 보일 수 있다(Supplementary Box 7).',
'도파민작용제가 일차 치료이며, 소아에서 부작용 감수성이 높을 수 있으므로 저용량으로 시작하고 용량 조정을 개별화한다. 시력이 위협받는 소아에서는 수술을 고려해야 한다.',
'졸중으로 이어지는 뇌하수체 출혈은 성인보다 소아의 프로락틴종에서 더 흔할 수 있다. 새로운 두통, 시력 손실 또는 다른 갑작스러운 증상이 있는 소아 프로락틴종에서는 졸중 가능성에 대한 의심 수준이 높아야 한다. 미세프로락틴종에서 소아 수술 연구들의 관해율은 약 80%였다.'],
24:['정신질환을 가진 환자의 프로락틴종 관리는 어려우며 내분비내과의, 신경외과의, 정신건강의학과의 사이의 협력이 필요하다. D2R 길항에 의한 고프로락틴혈증은 항정신병약 복용자의 30–75%에서 치료 첫 3개월 이내에 발생하며, ULN 10배까지의 상승이 보고되었다.',
'항정신병약 시작 전 프로락틴 측정은 불필요한 검사와 기저 프로락틴종에 대한 우려를 피할 수 있다. 항정신병약을 복용하면서 혈청 프로락틴이 ULN 10배를 넘거나, 두통이나 시각장애 같은 종괴 효과 증상이 있거나, 생식샘 축 이외의 뇌하수체호르몬 결핍이 있으면 MRI를 시행해야 한다. 항정신병약 감량 또는 프로락틴을 올리지 않는 항정신병약으로 전환한 후 혈청 프로락틴이 감소하는지 보는 것이 유용하다. 항정신병약을 중단하면 약물 유발 고프로락틴혈증은 48–96시간 이내에 해소된다.',
'도파민작용제 치료는 기저 정신질환의 악화에 기여할 수 있으나, 이 효과는 드문 것으로 보이며 출판 편향의 영향을 받는다. 도파민작용제는 항정신병약을 복용하는 환자의 프로락틴종 치료에 효과적이며, 생화학적 조절과 선종 축소를 위해 통상보다 높은 용량이 필요하지만 일차 도파민작용제 치료를 받은 대부분의 환자에서 시야가 개선된다(Supplementary Box 7). 아리피프라졸 같은 프로락틴 비상승 항정신병약으로 전환하면 도파민작용제 감량 또는 중단도 가능할 수 있으나 이 결과가 일관되게 나타나지는 않는다. 기존 항정신병약에 아리피프라졸을 추가하는 방법은 항정신병약 매개 고프로락틴혈증에 사용된다. 정신질환을 가진 프로락틴종 환자에서 도파민작용제 불내약이나 효과 부족이 우려되면 뇌하수체 수술을 고려해야 한다.'],
25:['폐경은 순환 프로락틴의 생리적 감소와 관련된다. 폐경에 들어가는 미치료 미세프로락틴종 여성의 45%에서 혈청 프로락틴이 정상화된다. 또한 폐경 후 프로락틴종(주로 미세선종) 여성의 52–71%에서 도파민작용제 중단 후, 중단 전 혈청 프로락틴과 무관하게, 프로락틴이 정상으로 유지되었다. 폐경 후 새로 진단되는 프로락틴종의 유병률은 정확히 알 수 없는데, 종괴 효과를 일으키지 않는 미세프로락틴종이나 작은 거대프로락틴종은 내분비 증상이 없으면 발견되지 않을 수 있기 때문이다. 3개의 보고에서 폐경 후 프로락틴종으로 진단된 37명의 여성 중 대부분이 거대프로락틴종(73%) 또는 초거대 프로락틴종(18.9%)이었고, 다수가 두부 영상에서 우연히 발견되었다. 대부분의 환자에서 도파민작용제 치료로 혈청 프로락틴 정상화와 종괴 축소를 달성했다.',
'현재 근거는 무증상 폐경 후 여성의 미세프로락틴종 치료를 지지하지 않는다. 거대프로락틴종은 표준 진료에 따라 치료해야 한다. 폐경 후 프로락틴종 여성에서 유방암 위험은 증가하지 않았다.'],
26:['여성화 호르몬 치료와 관련된 고프로락틴혈증은 트랜스젠더 여성의 최대 20%에서 발생하며 대개 경도이고 무증상이다. 시프로테론아세테이트를 병용한 에스트라디올 시작 후 ULN 2배까지의 혈청 프로락틴이 관찰되었으나 대부분의 환자에서 정상 범위에 머물렀다. 유즙분비를 일으키는 현저하거나 증상성인 프로락틴 상승은 추가 검사가 필요하다.',
'여성화 호르몬 치료를 받는 트랜스젠더 여성에서 프로락틴종이 보고되었다(Supplementary Box 7). 그러나 성확정 호르몬 치료와 프로락틴종 사이의 명확한 연관은 없다.'],
27:['CKD 환자에서 혈청 프로락틴은 상승한다. 한 연구에서 혈청 크레아티닌 &lt;6.8 mg/dL인 CKD 환자의 23%가 고프로락틴혈증이었고, 그 비율은 크레아티닌 &gt;6.8 mg/dL에서 77%, 혈액투석 환자에서 78%로 증가했다. 혈청 크레아티닌이 2.0 mg/dL 정도로 낮은 환자에서도 프로락틴 상승이 보고되었다. 이들 환자의 프로락틴은 대부분 단량체이며 거대프로락틴 축적 때문이 아니다. 고프로락틴혈증은 순환 프로락틴 청소의 지연과 프로락틴 생성 증가에 의해 발생한다. 고프로락틴혈증은 투석 강화의 영향을 받지 않으나 신장이식으로 회복된다.',
'브로모크립틴은 CKD와 고프로락틴혈증이 있는 남성에서 혈청 프로락틴을 효과적으로 낮추고 테스토스테론을 높이며 성기능을 회복시킨다. 흥미롭게도 혈액투석 중인 CKD 환자를 재조합 에리스로포이에틴으로 치료하면 혈청 프로락틴이 정상화될 수 있다.']
};

/* ---------- 권고문 렌더 ---------- */
const EXPMAP = {}; Object.keys(REC).forEach(id=>{ EXPMAP[id] = id.split('.')[0]; });
const secIds = s => Object.keys(REC).filter(k=>k.split('.')[0]===String(s));
const R = id => {
  const [g, t] = REC[id];
  const key = id.replace(/\./g,'-');
  const badge = `<span class="lv ${LVCLS[g]}" title="${LV[g]}">${LVTXT[g]}<span class="lv-ic" aria-hidden="true"></span></span>`;
  return `<div class="rec has-exp" role="button" tabindex="0" aria-expanded="false" aria-controls="exp-${key}" data-rid="${id}"><span class="rid">${id}</span><p>${t}</p>${badge}</div><div class="exp" id="exp-${key}" hidden></div>`;
};
const RR = (...ids) => ids.map(R).join('');
const RS = s => secIds(s).map(R).join('');
const rangeLabel = ids => ids.length === 1 ? ids[0] : ids[0] + '–' + ids[ids.length-1];
function renderExp(rid){
  const s = EXPMAP[rid], ids = secIds(s);
  const paras = EXP[s].map(t => t.startsWith('#') ? `<h5>${t.slice(1)}</h5>` : `<p>${t}</p>`).join('');
  const shared = ids.length > 1 ? `<p class="exp-note">이 설명은 ${rangeLabel(ids)} (${SEC[s]})에 공통으로 해당한다.</p>` : '';
  return `<div class="exp-h"><b>본문 설명 · ${SEC[s]}</b><span class="exp-r">${rangeLabel(ids)}</span><button type="button" class="exp-close" data-rid="${rid}" aria-label="설명 닫기">닫기 ✕</button></div>${shared}${paras}<p class="exp-src">Petersenn S, et al. Nat Rev Endocrinol 2023;19:722–740 본문 번역. 참고문헌 번호는 생략하였다.</p><button type="button" class="exp-close exp-close-b" data-rid="${rid}">설명 접기 ▴</button>`;
}
const tip = (label, t) => `<div class="box tip"><b>${label}</b>${t}</div>`;
const note = (label, t) => `<div class="box verify"><b>${label}</b>${t}</div>`;
const fn = (label, t) => `<div class="box fn"><b>${label}</b>${t}</div>`;

d_hook:{kind:'감별', title:'큰 선종 + 경미한 프로락틴 상승: 고용량 갈고리 효과', next:['d_prlnoma'], body:`
${R('6.6')}
<p>2부위 면역방사측정법이나 화학발광측정법에서 극도로 높은 프로락틴이 두 항체를 포화시켜 샌드위치 형성을 막으면, 실제로 매우 높은 프로락틴이 중등도 상승으로만 측정된다. 현재 측정법에서는 드물지만 프로락틴이 경미한 상승에 그치는데 거대프로락틴종이 강하게 의심되면 고려한다.</p>`},
d_prlnoma:{kind:'진단', title:'프로락틴종', next:['a_micro','a_k1','a_k2'], nextLabel:'치료 선택으로', body:`
<h4>크기 분류</h4>
<ul><li>미세프로락틴종: 최대 직경 &lt;10 mm (가장 흔함, 거대선종으로 자라는 경우 드묾)</li>
<li>거대프로락틴종: ≥10 mm</li>
<li>초거대 프로락틴종(giant): &gt;40 mm</li></ul>
${RS(1)}
<h4>진단 시 추가 평가</h4>
${RR('4.1','19.5','2.1','2.2','10.3')}
${RR('4.2')}`},

/* ===== Fig. 3a 1차 치료 ===== */
a_micro:{kind:'1차 치료 선택', title:'미세선종 (Knosp 0)', next:['a_surg','a_da','a_post','a_pre'], body:`
<p>미세선종은 수술 또는 도파민작용제로 치료하며, 환자 선호에 따라 폐경·생식샘 상태를 고려한 관찰 또는 호르몬 보충도 선택할 수 있다(Fig. 3a의 점선).</p>
${RR('11.3','15.1','9.2')}
${KNOSP}`},
a_k1:{kind:'1차 치료 선택', title:'거대선종 Knosp 1', next:['a_surg','a_da'], body:`
<p>잘 둘러싸인 거대선종(Knosp 0–1)은 숙련된 신경외과의의 수술과 도파민작용제가 모두 일차 선택지이다.</p>
${RR('11.3','15.1')}
${KNOSP}`},
a_k2:{kind:'1차 치료 선택', title:'거대선종 Knosp ≥2', next:['a_da'], body:`
${RR('11.4','15.2','20.1','18.2')}
<p>침습성 거대프로락틴종이나 초거대 프로락틴종은 대개 일차 도파민작용제 치료를 하며, 수술은 자발적 또는 DA 유발 뇌척수액 비루, 급속·진행성 시력 손실, 큰 낭성·출혈성 성분으로 즉각적 감압이 필요한 경우에 고려한다.</p>
${KNOSP}`},
a_post:{kind:'미세선종', title:'폐경 후', next:['a_obs'], body:`
${RR('9.4','25.1','25.3')}
<ul><li>폐경에 들어가는 미치료 미세프로락틴종 여성의 45%에서 프로락틴이 정상화된다.</li>
<li>폐경 후 DA 중단 후 52–71%에서 프로락틴이 정상으로 유지되었다.</li>
<li>폐경 후 새로 진단된 경우는 대부분 거대(73%) 또는 초거대(18.9%) 프로락틴종이었다.</li></ul>`},
a_pre:{kind:'미세선종', title:'폐경 전', next:['a_eu','a_hypo'], body:`
<p>생식샘 기능 상태에 따라 관찰 또는 호르몬 보충을 선택할 수 있다.</p>
${RR('9.1','9.2')}`},
a_eu:{kind:'폐경 전', title:'생식샘 기능 정상', next:['a_obs'], body:`${R('9.1')}`},
a_hypo:{kind:'폐경 전', title:'생식샘저하', next:['a_hrt'], body:`${RR('9.2','9.3')}`},
a_obs:{kind:'관리', title:'관찰', next:[], body:`
${RR('9.1','9.4','25.3')}
<p>도파민작용제로 치료하지 않은 미세선종은 드물게 커지므로, MRI는 대개 선종 성장이나 시신경교차 근접이 의심되거나 수술 가능성을 평가할 때만 필요하다.</p>`},
a_hrt:{kind:'치료', title:'호르몬 보충 (HRT)', next:[], body:`
${RR('9.2','9.3','9.5','9.6','9.7')}
<ul><li>생식샘 기능 회복 평가는 프로락틴 정상화 후 최소 6개월에 한다. 회복은 남성의 약 60%, 여성에서는 더 흔하다.</li>
<li>큰 선종 남성은 부작용 시 빨리 되돌릴 수 있는 단기작용 제형(테스토스테론 젤)을 권고한다.</li>
<li>가임 계획 시 테스토스테론을 시작하지 않으며, hCG·재조합 FSH 전에 정액검사를 한다.</li></ul>`},
a_surg:{kind:'치료', title:'수술 (경접형동 수술)', next:['fu'], nextLabel:'추적', body:`
${RS(15)}
<h4>수술 성적</h4>
${SURGTBL}
<h4>수술 전후 평가와 영상</h4>
${R('4.2')}
<ul><li>수술 예정 환자는 GH·TSH·ACTH 결핍을 선별하고, 수술 후 약 6–12주에 재검사한다.</li>
<li>수술 후 3–6개월에 MRI로 새 기저를 확립한다. 완전 절제 후에는 프로락틴 상승이나 증상 발생 시에만 재촬영한다.</li>
<li>수술 전 도파민작용제 사용은 논란이 있다. 1개월 이상 브로모크립틴 후에는 선종 섬유화가 흔했으나 카버골린에서는 덜했다.</li></ul>`},
a_da:{kind:'치료', title:'도파민작용제 치료', next:['fu','ae','wd'], nextLabel:'관련', body:`
${RS(11)}
<h4>용량</h4>
${DOSE}
<h4>반응 예측</h4>
<p>선종 크기와 프로락틴의 가장 큰 감소는 첫 6개월 이내에 일어난다. 첫 3–6개월에 좋은 반응이 없으면 충분히 반응하지 않을 가능성이 높다.</p>
${RESP}
<h4>치료 중 MRI</h4>
<ul><li>거대프로락틴종: 시작 3–6개월 후</li>
<li>미세프로락틴종: 임상·생화학적 추적에 따라, 1년 후 또는 중단 고려 시</li>
<li>치료 반응이 좋으면 프로락틴이 지속 상승하지 않는 한 1년 이후 연속 영상은 불필요. 부분 반응 또는 시신경교차 근접 거대선종은 처음 3년간 매년.</li></ul>`},
a_fsurg:{kind:'기타 고려 요인', title:'수술 쪽으로 고려할 요인', next:['a_surg'], body:`
<ul><li><b>젊은 성인</b>: 수십 년의 DA 치료를 피하기 위해</li>
<li><b>급속한 시력 저하</b>: 종괴 효과 또는 졸중</li>
<li><b>GH–프로락틴 혼합 선종</b></li>
<li><b>정신질환</b>: DA 불내약이나 효과 부족 우려</li></ul>
${RR('15.3','15.5','19.1','24.8')}`},
a_fda:{kind:'기타 고려 요인', title:'도파민작용제 쪽으로 고려할 요인', next:['a_da'], body:`
<ul><li><b>남성</b>: 남성 프로락틴종은 크고 침습적인 경우가 많아 크기나 침습과 무관하게 DA를 선호한다. 거대프로락틴종 남성의 80–85%가 정상화, 90%가 상당한 축소를 보인다.</li>
<li><b>소아</b>: DA가 일차 치료이며 저용량으로 시작한다.</li></ul>
${RR('18.2','23.4')}`},

/* ===== Fig. 3c 2차 치료 ===== */
c_rec:{kind:'2차 치료', title:'재발', next:['c_surg','c_da'], body:`
<p>재발 또는 관해 실패는 도파민작용제 증량 또는 수술 고려의 계기가 되며, 모든 경우 뇌하수체종양 전문센터(PTCOE)에서의 관리를 권고한다(Fig. 3c).</p>
${RR('14.4','14.5','21.2')}
<ul><li>수술로 정상화된 후 약 20%에서 재발한다(미세 10% ~ 비선택 거대 25%).</li>
<li>DA 중단 후 재발하여 재개한 경우 2–3년 추가 치료 후 두 번째 중단 시도가 성공할 수 있다.</li></ul>`},
c_inad:{kind:'2차 치료', title:'불충분한 관해 (저항성)', next:['c_surg','c_da'], body:`
<h4>정의</h4>
<ul><li><b>저항성(resistance)</b>: 표준 용량(브로모크립틴 하루 7.5–10 mg 또는 카버골린 주 2.0 mg)으로 최소 6개월 치료해도 프로락틴이 정상화되지 않거나 의미 있는 종괴 축소(최대 직경 ≥30% 감소)가 없는 경우</li>
<li><b>불응성(refractory)</b>: 최대 내약 용량까지 증량해도 조절되지 않아 감량수술을 고려하는 경우</li>
<li><b>공격성(aggressive)</b>: 최대 내약 용량에도 선종 증식이 지속되는 경우</li></ul>
<p>저항성 환자 모두가 치료 변경이 필요한 것은 아니다. 종괴 효과가 없거나, 선종은 조절되나 생식샘저하증만 남아 성호르몬 보충으로 관리되는 경우 DA를 지속할 수 있다.</p>
${RR('11.5','15.4','7.3')}
${tip('위험인자','남성, 젊은 나이, 침습성은 DA 저항성 위험 증가와 관련된다. 여성의 T2 저신호도 저항성과 연관된다.')}`},
c_intol:{kind:'2차 치료', title:'도파민작용제 불내약', next:['c_switch','c_surg'], body:`
${RR('12.1','12.2','12.3','12.4','12.5','12.6')}
<p>가장 흔한 부작용은 위 불편감, 오심·구토, 경미한 어지럼으로 주로 치료 시작 시 나타난다. 불내약이 지속되면 다른 DA로 바꾸거나 수술적 절제 등 다른 치료를 재평가한다.</p>
${R('15.4')}`},
c_surg:{kind:'2차 치료', title:'수술 (전문센터)', next:['aggr'], nextLabel:'관련', body:`
${RR('15.4','15.7')}
<ul><li>DA 저항성 환자에서 감량수술은 이후 내과 치료 성적을 높일 수 있다.</li>
<li>‘DA 저항성과 불내약’은 거대프로락틴종의 주된 수술 적응이다.</li></ul>
<h4>방사선 치료</h4>
${RS(16)}`},
c_da:{kind:'2차 치료', title:'도파민작용제 증량·재투여', next:['aggr'], nextLabel:'관련', body:`
<p>저용량에 반응하지 않는 큰 잔여 또는 성장하는 선종에서는 최대 내약 카버골린 용량까지 증량하는 것이 첫 단계이다. 수술 후 관해가 불충분하면 도파민작용제를 시작한다.</p>
${RR('11.5','14.4')}
${tip('고용량 시 확인','주 &gt;2.0 mg 카버골린 장기 치료가 예상되면 기저 심초음파를 시행하고 2–3년마다 반복한다(13.1–13.2).')}`},
c_switch:{kind:'2차 치료', title:'다른 도파민작용제로 교체', next:['c_surg'], body:`
${RR('12.6','11.5')}
<p>경구 카버골린 불내약이 지속되면 가능한 경우 퀴나골리드(더 특이적인 D2R 작용제)로 바꿀 수 있으며, 불내약은 수술 등 다른 치료를 재평가하는 적응이 될 수 있다.</p>`},

/* ===== Fig. 4 임신 ===== */
p_micro:{kind:'임신 희망', title:'미세프로락틴종', next:['p_surg','p_da'], body:`
<p>대부분의 참여자는 DA 내과 치료를 일차로 권고했으나, 숙련된 뇌하수체 외과의에 의한 비침습성 미세프로락틴종 수술도 합리적이라고 보았다. 완치 가능성이 높으면 수술을 고려할 수 있다(점선).</p>
${RR('22.1','22.3')}`},
p_macro:{kind:'임신 희망', title:'거대프로락틴종', next:['p_da','p_surg'], body:`
<p>대부분 선종이 DA에 반응하지 않거나 시신경 구조에 가까울 때만 수술을 권고하며, 이때 신경외과·산부인과·안과·내분비내과 다학제 팀 관리를 권고한다. 임신 전 감량수술은 증상성 증대 위험을 21%에서 4.7%로 줄인다.</p>
${RR('15.6','22.8')}`},
p_surg:{kind:'임신 전 치료', title:'수술', next:['p_prl'], body:`
${RR('22.3','15.6')}
<p>임신을 원하는 여성은 선종 절제 후 대개 가임력이 회복되므로 즉각적인 수술을 선호할 수도 있다. 이전에 수술한 환자는 임신 중 선종 성장 위험이 매우 낮다.</p>`},
p_da:{kind:'임신 전 치료', title:'도파민작용제 치료', next:['p_mri','p_prl'], body:`
${RR('22.4','22.7','11.7')}
<p>모든 여성을 카버골린에서 브로모크립틴으로 일률적으로 전환하기보다, 대부분의 참여자는 최저 유효 용량의 카버골린 사용을 선호했다. 전환하면 프로락틴 조절을 잃거나 부작용 증가로 순응도와 가임력에 불리할 수 있다.</p>
${tip('차단 피임','DA 치료 중에는 MRI에서 종괴 축소가 확인될 때까지 차단 피임법을 사용한다(Fig. 4).')}`},
p_prl:{kind:'확인', title:'프로락틴 <ULN?', next:['p_conc','p_da'], body:`
<ul><li><b>예</b> → 임신 시도</li><li><b>아니오(수술 후)</b> → 도파민작용제 치료</li></ul>
${RR('22.2')}`},
p_mri:{kind:'확인', title:'거대선종: MRI상 크기 감소?', next:['p_conc','p_surg'], body:`
${RR('22.8','22.2')}
<ul><li><b>예</b> → 임신 시도</li><li><b>아니오</b> → 임신 전 수술 고려</li></ul>`},
p_conc:{kind:'임신', title:'임신', next:['p_stop','p_fu'], body:`
${RR('22.5','22.6')}
<p>한 후향적 연구에서 임신 중 카버골린 지속은 중단한 경우보다 유산율이 높았으나 추가 자료는 거의 없다.</p>`},
p_stop:{kind:'임신', title:'도파민작용제 중단?', next:['p_fu'], body:`${RR('22.5','22.6','22.7')}`},
p_fu:{kind:'임신 중 추적', title:'임신 중 추적', next:['p_grow'], body:`
<div class="tbl"><table><thead><tr><th>항목</th><th>미세프로락틴종</th><th>거대프로락틴종</th></tr></thead><tbody>
<tr><td>외래 진찰</td><td>3개월마다</td><td>매월 (국소 종괴 효과 문진)</td></tr>
<tr><td>시야검사</td><td>–</td><td>3개월마다</td></tr>
<tr><td>조영제 없는 MRI</td><td colspan="2">시야 변화, 심하거나 지속되는 두통 시 언제든</td></tr>
<tr><td>프로락틴 측정</td><td colspan="2">하지 않음</td></tr></tbody></table></div>
${RR('22.9','22.10','22.11','22.14')}`},
p_grow:{kind:'임신 중', title:'MRI상 크기 증가?', next:['p_da2','p_surg2'], body:`
<p>크기가 증가하면 이전에 중단한 경우 도파민작용제를 재개하고, 반드시 필요하면 2분기 수술을 고려한다(Fig. 4).</p>

const chartSize = document.getElementById('chartSize');
const nodeEls = {}, NODE_CHART = {}, chartEls = {};
const SVGNS = 'http://www.w3.org/2000/svg';
Object.entries(CHARTS).forEach(([key, c])=>{
  const el = document.createElement('div');
  el.className = 'chart'; el.id = 'chart-' + key; el.hidden = true;
  el.setAttribute('role','group'); el.setAttribute('aria-label', c.aria);
  el.style.width = c.w + 'px'; el.style.height = c.h + 'px';
  const svg = document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox', `0 0 ${c.w} ${c.h}`); svg.setAttribute('aria-hidden','true');
  svg.style.width = c.w + 'px'; svg.style.height = c.h + 'px';
  svg.innerHTML = `<defs><marker id="ah-${key}" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>`;
  c.edges.forEach(([d, arrow, cls, start])=>{
    const p = document.createElementNS(SVGNS,'path');
    p.setAttribute('d', d);
    if (arrow) p.setAttribute('marker-end', `url(#ah-${key})`);
    if (start) p.setAttribute('marker-start', `url(#ah-${key})`);
    if (cls) p.setAttribute('class', cls);
    svg.appendChild(p);
  });
  c.labels.forEach(([x,y,t,cls])=>{
    const tx = document.createElementNS(SVGNS,'text');
    tx.setAttribute('x', x); tx.setAttribute('y', y); tx.textContent = t;
    if (cls) tx.setAttribute('class', cls);
    svg.appendChild(tx);
  });
  el.appendChild(svg);
  c.nodes.forEach(n=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'node' + (n.cls ? ' ' + n.cls : '');
    b.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
    b.innerHTML = n.label;
    b.addEventListener('click', ()=>open(n.id, b));
    el.appendChild(b);
    nodeEls[n.id] = b; NODE_CHART[n.id] = key;
  });
  chartSize.appendChild(el);
  chartEls[key] = el;
});

  layout();
}

    inp.addEventListener('input', e=>render(e.target.value)); render('');
  }
};

/* ---------- 범례 클릭: 해당 종류 박스 깜빡임 ---------- */
let flashTimer = null;
function flashLegend(cls, btn){
  clearTimeout(flashTimer);
  const chart = chartEls[curChart];
  Object.values(nodeEls).forEach(el=>el.classList.remove('flash'));
  Object.values(chartEls).forEach(el=>el.classList.remove('hl'));
  document.querySelectorAll('.legend .lg').forEach(b=>{ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); });
  void chart.offsetWidth;
  CHARTS[curChart].nodes.forEach(n=>{ if ((n.cls||'').split(' ').includes(cls)) nodeEls[n.id].classList.add('flash'); });
  chart.classList.add('hl');
  btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
  flashTimer = setTimeout(()=>{
    Object.values(nodeEls).forEach(el=>el.classList.remove('flash'));
    chart.classList.remove('hl');
    btn.classList.remove('on'); btn.setAttribute('aria-pressed','false');
  }, 2400);
}
document.querySelectorAll('.legend .lg').forEach(b=>b.addEventListener('click',()=>flashLegend(b.dataset.cls,b)));

const backdrop = document.getElementById('backdrop');
const dKind = document.getElementById('dKind');
const dTitle = document.getElementById('dTitle');
const dBody = document.getElementById('dBody');
const dNext = document.getElementById('dNext');

let lastFocus = null, current = null;

function open(id, trigger){
  const d = D[id]; if (!d) return;
  if (trigger && !drawer.classList.contains('open')) lastFocus = trigger;
  current = id;
  if (NODE_CHART[id] && NODE_CHART[id] !== curChart) showChart(NODE_CHART[id]);
  dKind.textContent = d.kind;
  dTitle.textContent = d.title;
  dBody.innerHTML = d.body;
  /* 같은 소제목의 본문 설명은 패널 안에서 첫 권고문에만 남김 */
  const seenExp = new Set();
  dBody.querySelectorAll('.rec.has-exp').forEach(rec=>{
    const g = EXPMAP[rec.dataset.rid];
    if (!seenExp.has(g)) { seenExp.add(g); return; }
    const box = document.getElementById(rec.getAttribute('aria-controls'));
    if (box && dBody.contains(box)) box.remove();
    rec.classList.remove('has-exp');
    ['role','tabindex','aria-expanded','aria-controls','data-rid'].forEach(a=>rec.removeAttribute(a));
    rec.querySelectorAll('.lv-ic').forEach(i=>i.remove());
  });
  dBody.scrollTop = 0;
  dNext.innerHTML = '';
  if (d.next && d.next.length){
    const s = document.createElement('span'); s.className = 'lbl'; s.textContent = d.nextLabel || '다음 단계';
    dNext.appendChild(s);
    d.next.forEach(nid=>{
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = D[nid].title;
      b.addEventListener('click', ()=>open(nid));
      dNext.appendChild(b);
    });
  }
  if (d.onOpen) d.onOpen();
  Object.values(nodeEls).forEach(el=>el.classList.remove('is-active'));
  if (nodeEls[id]) nodeEls[id].classList.add('is-active');
  drawer.classList.add('open'); backdrop.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  dClose.focus({preventScroll:true});
}
function close(){
  drawer.classList.remove('open'); backdrop.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  Object.values(nodeEls).forEach(el=>el.classList.remove('is-active'));
  if (lastFocus) lastFocus.focus({preventScroll:true});
  lastFocus = null; current = null;
}
dClose.addEventListener('click', close);
function toggleExp(rid, force){
  const key = rid.replace(/\./g,'-');
  const rec = dBody.querySelector(`.rec.has-exp[data-rid="${rid}"]`);
  const box = document.getElementById('exp-' + key);
  if (!rec || !box) return;
  const show = force !== undefined ? force : box.hidden;
  if (show && !box.innerHTML){ box.innerHTML = renderExp(rid); }
  box.hidden = !show; rec.setAttribute('aria-expanded', String(show));
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if (show) rec.scrollIntoView({behavior:smooth, block:'start'});
  else { rec.scrollIntoView({behavior:smooth, block:'nearest'}); rec.focus({preventScroll:true}); }
}
dBody.addEventListener('click', e=>{
  const c = e.target.closest('.exp-close');
  if (c){ toggleExp(c.dataset.rid, false); return; }
  const rec = e.target.closest('.rec.has-exp');
  if (!rec) return;
  if (String(window.getSelection && window.getSelection()).trim()) return;
  toggleExp(rec.dataset.rid);
});
dBody.addEventListener('keydown', e=>{
  const rec = e.target.closest('.rec.has-exp');
  if (rec && e.target === rec && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleExp(rec.dataset.rid); }
});
backdrop.addEventListener('click', close);
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && drawer.classList.contains('open')) close(); });

/* ---------- 한 화면 맞춤 ---------- */
const wrap = document.getElementById('chartWrap');
const NODE_PX = 15;
const mainEl = document.querySelector('main');
function fitWidth(){
  /* 전체 폭을 하단 버튼 줄(약어 버튼까지) 길이에 맞춤 · 최소 900px */
  const bl = document.querySelector('.below');
  if (window.innerWidth <= 700){ mainEl.style.maxWidth = ''; return; }
  bl.style.flexWrap = 'nowrap';
  const w = bl.lastElementChild.getBoundingClientRect().right - bl.getBoundingClientRect().left;
  bl.style.flexWrap = '';
  const ms0 = getComputedStyle(mainEl);
  mainEl.style.maxWidth = Math.ceil(Math.max(w, 900) + parseFloat(ms0.paddingLeft) + parseFloat(ms0.paddingRight) + 2) + 'px';
}
function layout(){
  /* 버튼 글자 크기가 배율에 따라 바뀌므로 폭과 배율을 몇 차례 맞춤 */
  for (let i = 0; i < 4; i++){
    const before = mainEl.style.maxWidth;
    fitWidth(); layoutOnce();
    if (mainEl.style.maxWidth === before && i) break;
  }
}
function layoutOnce(){
  const c = CHARTS[curChart], chart = chartEls[curChart];
  const ms = getComputedStyle(mainEl);
  const cs = getComputedStyle(wrap);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  const leg = document.getElementById('legend');
  const gap = parseFloat(cs.columnGap) || 0;
  const mainW = mainEl.clientWidth - parseFloat(ms.paddingLeft) - parseFloat(ms.paddingRight);
  const availW = mainW - padX - leg.offsetWidth - gap;
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  const below = document.querySelector('.below').offsetHeight + 20;
  const availH = window.innerHeight - top - padY - below - 4;
  const scale = Math.min(1.3, availW / c.w, Math.max(availH, 320) / c.h);
  chart.style.transform = `scale(${scale})`;
  chartSize.style.width = (c.w * scale) + 'px';
  chartSize.style.height = (c.h * scale) + 'px';
  const ui = Math.max(11, Math.min(16, NODE_PX * scale));
  document.documentElement.style.setProperty('--ui-font', ui.toFixed(2) + 'px');
}
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
showChart('dx');

</script>
