<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#16212B; --muted:#56646F;
  --line:#7F8D99; --test:#DCE5EB; --test-ink:#12304A;
  --accent:#1F5E7E; --accent-soft:#E3EEF4;
  --mal:#A13D33; --mal-bg:#FBEDEA; --ben:#2C6A43; --ben-bg:#E9F3EC;
  --tx:#6A4C93; --tx-bg:#F1ECF8; --warn:#85600F; --warn-bg:#FBF3DF;
  --border:#C9D3DA;
  --fn:#C2410C; --fn-bg:#FFF1E6;
  --hdr-bg:#1F4F6B; --hdr-ink:#FFFFFF; --hdr-sub:#CFE1EC; --hdr-link:#FFE8A3; --hdr-rule:#E0B44C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
    --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
    --accent:#7FB7D6; --accent-soft:#1D3140;
    --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
    --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
    --border:#2E3E4A;
    --fn:#F59E62; --fn-bg:#3A2418;
    --fn:#F59E62; --fn-bg:#3A2418;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
  --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
  --accent:#7FB7D6; --accent-soft:#1D3140;
  --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
  --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
  --border:#2E3E4A;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:16px; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.top{
  background:var(--hdr-bg); color:var(--hdr-ink);
  border:1px solid var(--hdr-bg); border-bottom:0; border-radius:10px 10px 0 0; margin:0;
  box-shadow:inset 0 -3px 0 var(--hdr-rule);
}
.fig .chart-wrap{border-top:0; border-radius:0 0 10px 10px}
.chart-note{position:absolute; right:1rem; bottom:.55rem; margin:0; padding-left:1.1em; font-size:calc(var(--ui-font,13px) * .88); line-height:1.55; color:var(--muted); white-space:nowrap}
.chart-note a{color:var(--accent)}
.top .disclaimer{font-size:.74rem; font-style:italic; color:var(--hdr-sub); opacity:.85; margin:.15rem 0 0}
.top-inner{padding:.8rem 1.25rem .9rem; text-align:center}
.top h1{font-size:1.25rem; margin:0; font-weight:700; letter-spacing:-.01em; color:var(--hdr-ink)}
.top .src{font-size:.84rem; color:var(--hdr-sub); margin:.2rem 0 0}
.top .src a{color:var(--hdr-link); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--hdr-rule)}
.top .src a:hover{text-decoration-thickness:2px}
.top .src a:focus-visible{outline-color:var(--hdr-link)}
.btn{
  font:inherit; font-size:.85rem; color:var(--ink); background:var(--surface);
  border:1px solid var(--border); border-radius:6px; padding:.35rem .7rem; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

main{max-width:1180px; margin:0 auto; padding:1rem 1.25rem .75rem}
.intro{max-width:70ch; color:var(--muted); font-size:.95rem; margin:0 0 1rem}
.legend{order:2; display:flex; flex-direction:column; gap:.2rem; font-size:var(--ui-font,13px); color:var(--muted); flex:none; align-self:flex-start; padding:.25rem .25rem 0 .25rem}
.legend span{white-space:nowrap}
.legend span{display:inline-flex; align-items:center; gap:.4rem}
.sw{width:18px; height:12px; border-radius:3px; border:1.5px solid var(--line); display:inline-block}
.sw.test{background:var(--test)}
.sw.mal{border-color:var(--mal); background:var(--mal-bg)}
.sw.ben{border-color:var(--ben); background:var(--ben-bg)}
.sw.tx{border-color:var(--tx); background:var(--tx-bg)}

.chart-wrap{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  overflow-x:auto; padding:.75rem; display:flex; gap:1rem; align-items:flex-start; position:relative;
}
.chart-size{flex:none}
.fig{width:fit-content; max-width:100%; margin:0 auto}
.below{display:flex; flex-wrap:nowrap; align-items:center; gap:.4rem; margin-top:.6rem; overflow-x:auto; padding-bottom:2px}
.below button{flex-shrink:0; white-space:nowrap}
.sep{width:1px; height:1.4rem; background:var(--border); margin:0 .25rem}
.fn-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.5rem .75rem .75rem}
.fn-panel .fn-list{margin:0}
.chart-size{position:relative}
.chart{position:absolute; left:0; top:0; transform-origin:0 0}
.chart svg{position:absolute; inset:0; overflow:visible}
.chart svg path{fill:none; stroke:var(--line); stroke-width:1.4}
.chart svg path.dot{stroke-dasharray:3 4}
.chart svg path.thick{stroke-width:5}
.lv.l5{color:var(--mal); background:var(--mal-bg)}
.lv.l5{cursor:help}
.chart svg marker path{fill:var(--line); stroke:none}

.node{
  position:absolute; display:flex; align-items:center; justify-content:center; text-align:center;
  font:inherit; font-size:15px; line-height:1.2; font-weight:500; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line); border-radius:4px;
  padding:2px 8px; cursor:pointer;
  transition:box-shadow .15s ease, border-color .15s ease;
}
.node sup{font-size:13px; margin-left:2px; color:var(--accent); font-weight:700; vertical-align:baseline; position:relative; top:-.5em; line-height:0}
.node.test{background:var(--test); color:var(--test-ink); font-weight:600}
.node.mal{border-color:var(--mal); background:var(--mal-bg)}
.node.ben{border-color:var(--ben); background:var(--ben-bg)}
.node.tx{border-color:var(--tx); background:var(--tx-bg)}
.node:hover{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.node.is-active{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent)}

.fn-list{margin:0; padding:0; list-style:none; display:grid; gap:.4rem}
.fn-list button{
  width:100%; text-align:left; font:inherit; font-size:.86rem; color:var(--ink);
  background:transparent; border:1px solid transparent; border-radius:6px; padding:.35rem .5rem; cursor:pointer;
  display:grid; grid-template-columns:1.4rem 1fr; gap:.25rem;
}
.fn-list button:hover{background:var(--accent-soft); border-color:var(--border)}
.fn-list b{color:var(--accent)}
.caption{font-size:.82rem; color:var(--muted); margin:.75rem 0 0}

.abbr-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.25rem .9rem .75rem}
.abbr-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-toggle:hover,.abbr-toggle:hover{border-color:var(--accent); background:var(--accent-soft)}
.abbr-search{margin:.6rem 0; width:100%; max-width:360px; font:inherit; font-size:.9rem; padding:.4rem .6rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--ink)}
.abbr dl{display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; margin:0; font-size:.88rem}
.abbr dt{font-weight:600; color:var(--accent)}
.abbr dd{margin:0}

/* recommendations */
.rec{display:grid; grid-template-columns:auto 1fr auto; gap:.25rem .6rem; align-items:start; border:1px solid var(--border); border-radius:6px; padding:.5rem .65rem; margin:.5rem 0; background:var(--bg)}
.rec p{margin:0; font-size:.9rem}
.rid{font-weight:700; color:var(--accent); font-size:.85rem; white-space:nowrap; padding-top:.05rem}
.lv{font-size:.72rem; font-weight:600; padding:.1rem .45rem; border-radius:999px; white-space:nowrap; cursor:help; border:1px solid currentColor}
.lv.l1{color:var(--ben); background:var(--ben-bg)}
.lv.l2{color:var(--accent); background:var(--accent-soft)}
.lv.l3{color:var(--warn); background:var(--warn-bg)}
.lv.l4{color:var(--muted); background:transparent}
.small,.d-body ul.small li{font-size:.86rem}
.d-body ul.small{color:var(--ink)}
@media (max-width:520px){ .rec{grid-template-columns:auto 1fr} .rec .lv{grid-column:2; justify-self:start} }
.extras{display:contents}
.extras button{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.extras button:hover{border-color:var(--accent); background:var(--accent-soft)}

.d-body .fn-list{padding-left:0; margin:0 0 .5rem}
.d-body .fn-list li{margin:0}
.d-body a{color:var(--accent)}
.xp{border:1px solid var(--border); border-radius:6px; margin:.4rem 0; background:var(--bg)}
.xp summary{cursor:pointer; padding:.5rem .7rem; font-size:.92rem; list-style:none; display:flex; gap:.5rem; align-items:baseline}
.xp summary::-webkit-details-marker{display:none}
.xp summary::before{content:"▸"; color:var(--accent); flex:none; transition:transform .15s}
.xp[open] summary::before{transform:rotate(90deg)}
.xp[open] summary{border-bottom:1px solid var(--border); font-weight:600}
.xp > div{padding:.3rem .8rem .6rem; background:var(--surface); border-radius:0 0 6px 6px}
.xp h5{font-size:.88rem; margin:.6rem 0 .2rem}
@media (prefers-reduced-motion: reduce){.xp summary::before{transition:none}}
.d-body h5{font-size:.9rem; margin:.7rem 0 .25rem; color:var(--accent)}
.kt th,.kt td:first-child{white-space:nowrap}
.kt td:nth-child(3),.kt td:nth-child(4){white-space:nowrap}
.fnl{margin:.4rem 0 0; padding-left:1.3rem}
.fnl li{margin:.25rem 0}
.fnl li::marker{font-weight:700; color:var(--fn)}
.kt sup, .d-body h4 sup{color:var(--fn); font-weight:700; background:var(--fn-bg); border-radius:3px; padding:0 .2em; margin-left:.1em}
.fnl{background:var(--fn-bg); border-left:3px solid var(--fn); border-radius:0 6px 6px 0; padding:.5rem .7rem .5rem 1.9rem}
.term{font:inherit; color:var(--accent); font-weight:700; background:var(--accent-soft); border:0; border-bottom:2px dotted var(--accent); border-radius:3px; padding:0 .25em; cursor:pointer}
.term::after{content:" ▸"; font-size:.8em}
.term[aria-expanded="true"]::after{content:" ▾"}
.term:hover{background:var(--test)}
.pop{margin:.5rem 0 .3rem; border:1px solid var(--accent); border-radius:8px; background:var(--surface); padding:.6rem .8rem; box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pop-h{display:block; color:var(--accent); margin-bottom:.3rem}
.pop ul{margin:.2rem 0; padding-left:1.1rem}
.pop li{font-size:.9rem; margin:.3rem 0}
.pop-src{font-size:.78rem; color:var(--muted); margin:.4rem 0 0}
.pop .tbl table{min-width:0}
.pop .tbl td:first-child{width:38%}
/* drawer */
.backdrop{position:fixed; inset:0; background:rgba(10,20,28,.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.backdrop.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(560px,100%);
  background:var(--surface); border-left:1px solid var(--border);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s ease;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:none}
.d-head{display:flex; gap:1rem; align-items:flex-start; padding:1rem 1.25rem .75rem; border-bottom:1px solid var(--border)}
.d-head > div{flex:1}
.d-kind{margin:0; font-size:.8rem; color:var(--accent); font-weight:600}
.d-head h2{margin:.15rem 0 0; font-size:1.25rem; line-height:1.35}
.d-body{flex:1; overflow-y:auto; padding:1rem 1.25rem 1.5rem; font-size:.95rem}
.d-body h4{font-size:.98rem; margin:1.25rem 0 .4rem; color:var(--ink)}
.d-body h4:first-child{margin-top:0}
.d-body p{margin:.4rem 0}
.d-body ul{margin:.3rem 0; padding-left:1.2rem}
.d-body li{margin:.2rem 0}
.tbl{overflow-x:auto; margin:.5rem 0}
.tbl table{border-collapse:collapse; width:100%; font-size:.85rem; min-width:440px}
.tbl th,.tbl td{border:1px solid var(--border); padding:.4rem .5rem; vertical-align:top; text-align:left}
.tbl th{background:var(--test); color:var(--test-ink); font-weight:600}
.box{border-radius:6px; padding:.6rem .8rem; margin:.75rem 0; font-size:.9rem}
.box.fn{background:var(--accent-soft); border-left:3px solid var(--accent)}
.box.tip{background:var(--ben-bg); border-left:3px solid var(--ben)}
.box.verify{background:var(--warn-bg); border-left:3px solid var(--warn)}
.box b{display:block; margin-bottom:.15rem}
.d-next{padding:.75rem 1.25rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:.4rem; align-items:center}
.d-next:empty{display:none}
.d-next .lbl{font-size:.8rem; color:var(--muted); margin-right:.25rem}
.d-next button{font:inherit; font-size:.85rem; padding:.3rem .65rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:transparent; cursor:pointer}
.d-next button:hover{background:var(--accent-soft)}

@media (max-width:700px){
  .drawer{top:auto; height:86%; width:100%; border-left:0; border-top:1px solid var(--border); border-radius:14px 14px 0 0; transform:translateY(100%)}
  .drawer.open{transform:none}
  main{padding:1rem .75rem}
  .chart-wrap{padding:.5rem}
}
@media (prefers-reduced-motion: reduce){
  .drawer,.backdrop,.node{transition:none}
}

/* 범례 클릭 시 해당 박스 깜빡임 */
.legend .lg{font:inherit; color:inherit; background:transparent; border:1px solid transparent; border-radius:6px; padding:.15rem .35rem; margin:0 -.35rem; display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap; cursor:pointer; text-align:left}
.legend .lg:hover{background:var(--accent-soft); border-color:var(--border); color:var(--ink)}
.legend .lg.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.node{--flash:var(--accent)}
.node.test{--flash:var(--test-ink)} .node.tx{--flash:var(--tx)} .node.ben{--flash:var(--ben)} .node.mal{--flash:var(--mal)}
@keyframes nodeFlash{0%,100%{box-shadow:0 0 0 0 transparent; transform:scale(1)} 50%{box-shadow:0 0 0 5px var(--flash); transform:scale(1.04)}}
.chart.hl .node{transition:opacity .2s}
.chart.hl .node:not(.flash){opacity:.3}
.node.flash{animation:nodeFlash .8s ease-in-out 3; z-index:3}
@media (prefers-reduced-motion: reduce){
  .node.flash{animation:none; box-shadow:0 0 0 4px var(--flash)}
  .chart.hl .node{transition:none}
}

/* ---- DTC 형식 이식: 권고 설명, 하단 버튼 ---- */
.below{display:flex; flex-wrap:nowrap; align-items:center; gap:.4rem; margin-top:.6rem; overflow-x:auto; padding-bottom:2px}
.below button{flex-shrink:0; white-space:nowrap}
.node small{font-size:11px; font-weight:500; color:var(--muted); margin-left:5px; white-space:nowrap}
.lv-ic::after{content:"▸"; font-size:.8em}
.exp{margin:-.3rem 0 .7rem; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:0 0 6px 6px; background:var(--surface); padding:.55rem .8rem .6rem; font-size:.88rem; line-height:1.7}
.exp-h{display:flex; justify-content:space-between; gap:.5rem; align-items:baseline; color:var(--accent); margin-bottom:.2rem}
.exp-h span{font-size:.78rem; color:var(--muted)}
.exp p{margin:.45rem 0}
.exp h5{margin:.7rem 0 .2rem; font-size:.86rem; color:var(--ink)}
.exp p.exp-li{margin:.2rem 0 .2rem .9rem; padding-left:1.4em; text-indent:-1.4em}
.exp-note,.exp-src{font-size:.78rem; color:var(--muted)}
.exp-src{border-top:1px dashed var(--border); padding-top:.4rem; margin-top:.6rem}
.rec.has-exp{cursor:pointer; transition:border-color .15s, box-shadow .15s}
.rec.has-exp:hover{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.rec.has-exp[aria-expanded="true"]{border-color:var(--accent); border-bottom-left-radius:0; border-bottom-right-radius:0; margin-bottom:0; background:var(--accent-soft)}
.rec.has-exp[aria-expanded="true"] .lv-ic::after{content:"▾"}
.exp{margin:0 0 .8rem; border-top:0}
.exp-h{position:sticky; top:-1rem; z-index:2; background:var(--surface); margin:-.55rem -.8rem .3rem; padding:.55rem .8rem .45rem; border-bottom:1px solid var(--border); align-items:center}
.exp-h .exp-r{margin-left:auto}
.exp-close{font:inherit; font-size:.78rem; padding:.2rem .55rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:var(--surface); cursor:pointer; white-space:nowrap}
.exp-close:hover{background:var(--accent-soft)}
.exp-close-b{display:block; margin:.5rem 0 0 auto}
@media (prefers-reduced-motion: reduce){.rec.has-exp{transition:none}}
.rec.has-exp .lv{display:inline-flex; align-items:center; gap:.35rem; padding-right:.2rem}
.rec.has-exp .lv-ic{display:inline-flex; align-items:center; justify-content:center; width:1.35rem; height:1.35rem; border-radius:50%; background:var(--accent); color:#fff; flex:none; transition:transform .2s, background .15s}
.rec.has-exp .lv-ic::after{content:"▸"; font-size:.95rem; line-height:1; margin-left:.1rem}
.rec.has-exp:hover .lv-ic{background:var(--accent-ink, var(--ink)); transform:scale(1.12)}
.rec.has-exp[aria-expanded="true"] .lv-ic{transform:rotate(90deg)}
.rec.has-exp[aria-expanded="true"] .lv-ic::after{content:"▸"}
@media (prefers-reduced-motion: reduce){.rec.has-exp .lv-ic{transition:none}}
.below{gap:.4rem; margin-top:.6rem}
.below .sep{background:var(--border)}
.below button{--b:var(--accent); display:inline-flex; align-items:center; gap:.3rem; font-weight:500; font-size:var(--ui-font,13px); border:1px solid var(--b) !important; background:color-mix(in srgb, var(--b) 12%, var(--surface)) !important; color:var(--ink) !important; border-radius:6px; padding:.3rem .6rem; transition:transform .12s, box-shadow .12s, background .12s}
.below button:hover{background:color-mix(in srgb, var(--b) 24%, var(--surface)) !important; transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.12)}
.below button:focus-visible{outline:2px solid var(--b); outline-offset:2px}
.below .bt-ic{display:inline-flex; align-items:center; justify-content:center; min-width:1.05rem; height:1.05rem; padding:0 .15rem; border-radius:999px; background:var(--b); color:var(--surface); font-size:.6rem; font-weight:700; line-height:1}
.below .bt-lv, .below .bt-preg, .below .bt-peds, .below .bt-abbr{--b:var(--ben)}
@media (prefers-reduced-motion: reduce){.below button{transition:none} .below button:hover{transform:none}}
.node{flex-wrap:wrap; column-gap:0}
.below button{--b:var(--ben)}

/* ---- 프로락틴종 도구 추가 ---- */
.ctabs{display:flex; gap:.35rem; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-top:0; border-bottom:0; padding:.6rem .75rem 0}
.ctab{font:inherit; font-size:var(--ui-font,13px); font-weight:600; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-bottom:0; border-radius:8px 8px 0 0; padding:.4rem .85rem; cursor:pointer; display:inline-flex; gap:.45rem; align-items:baseline}
.ctab span{font-weight:500; font-size:.8em; color:var(--muted)}
.ctab:hover{color:var(--ink); background:var(--accent-soft)}
.ctab.on{color:var(--hdr-ink); background:var(--hdr-bg); border-color:var(--hdr-bg)}
.ctab.on span{color:var(--hdr-sub)}
.fig .chart-wrap{border-top:1px solid var(--border); border-radius:0 0 10px 10px}
.chart[hidden]{display:none}
.chart svg path.sepl{stroke:var(--border); stroke-dasharray:6 5; stroke-width:1.2}
.chart svg text{font-family:inherit; font-size:12.5px; fill:var(--muted)}
.chart svg text.sec{font-size:14px; font-weight:700; fill:var(--accent)}
.node.fac{flex-direction:column; flex-wrap:nowrap; gap:3px; font-weight:600}
.node.fac small{white-space:normal; margin:0; font-size:12.5px; line-height:1.35}
.node.test.fac small{color:var(--test-ink); opacity:.85}
.legend .chart-note{position:static; white-space:normal; max-width:11.5rem; margin:.9rem 0 0; padding-left:1.1em}
.lv.l1,.lv.l2,.lv.l3{cursor:help}
.d-body .fn-list button{grid-template-columns:1.2rem 1fr}
.node small sup{font-size:9px; top:-.45em; margin-left:1px; color:inherit}
.node.fac .nt sup{font-size:11px}
.node sup{font-size:.62em; line-height:0}
.node .nt{display:inline}
.below{flex-wrap:wrap; overflow-x:visible; row-gap:.4rem}
</style>

<script>
const REC={"1.1": ["I", "C", "진료실혈압, 활동혈압, 가정혈압 측정은 검증된 커프형 혈압계의 사용을 권고한다."], "1.2": ["IIb", "B", "커프리스 혈압계는 진료실 밖 혈압 측정 시 활용을 고려할 수 있다."], "2.1": ["I", "A", "고혈압의 진단, 치료 결정 및 예후 평가를 위해 진료실혈압 측정을 권고한다."], "2.2": ["I", "C", "진료실혈압 측정에는 검증된 자동혈압계 또는 무수은수동(청진형)혈압계의 사용을 권고한다."], "2.3": ["I", "C", "진료실혈압은 표준적인 방법에 따라 반복 측정하여 고혈압을 진단하도록 권고한다."], "2.4": ["I", "B", "양측 팔의 수축기혈압 차이가 지속적으로 10 mmHg 이상일 경우 심혈관질환의 위험이 증가하므로, 최초 혈압 측정 시 양측 팔의 측정을 권고하며, 이후 더 높은 혈압이 측정된 팔을 기준으로 고혈압을 진단하도록 권고한다."], "2.5": ["I", "B", "고혈압의 정확한 진단, 혈압 패턴 분석, 치료 효과 평가 및 예후 예측을 위하여 진료실 밖 혈압(가정혈압 또는 활동혈압) 측정을 병행할 것을 권고한다."], "3.1": ["I", "B", "고혈압의 진단, 백의고혈압 및 가면고혈압의 진단, 난치성(혹은 저항성)고혈압의 진단과 치료 효과 판정 및 예후 예측을 위해 활동혈압 측정을 권고한다."], "4.1": ["I", "B", "고혈압, 백의고혈압 및 가면고혈압 및 난치성(혹은 저항성)고혈압의 진단, 치료 효과 평가 및 예후 예측을 위해 가정혈압 측정을 권고한다."], "4.2": ["I", "C", "정확한 가정혈압 측정을 위해 모든 환자에게 올바른 가정혈압 측정 방법을 교육할 것을 권고한다."], "5.1": ["I", "C", "기본 검사는 적어도 고혈압 진단 시점에 시행하며, 이후에는 매년 1회 정기적으로 시행할 것을 권고한다."], "5.2": ["IIa", "B", "고혈압의 중증도가 높거나 표준화된 약물치료에도 불구하고 혈압 조절이 충분하지 않은 경우에는 추가적인 권장 검사의 시행을 고려한다."], "6.1": ["I", "B", "이차성 고혈압이 의심되는 임상 증상, 징후 또는 병력을 가진 고혈압환자에서는 이차성 원인을 확인하기 위한 적절한 선별 검사의 시행을 권고한다."], "7.1": ["I", "C", "성인 고혈압환자에서 다음 중 하나라도 해당하는 경우에는, 일차성 알도스테론증에 대한 선별 검사의 시행을 권고한다. - 난치성(혹은 저항성) 고혈압, 부신 우연종, 조기 발병 고혈압, 저칼륨혈증, 폐쇄성 수면무호흡증, 40세 미만의 뇌졸중 가족력 또는 일차성 알도스테론증 가족력이 있는 경우"], "7.2": ["I", "C", "일차성 알도스테론증에 대한 선별 검사 적응증이 있는 성인에서는 혈장 알도스테론 농도, 혈장 레닌 활성 및 알도스테론/레닌 활성 비율을 이용한 초기 선별 검사의 시행을 권고한다."], "7.3": ["I", "C", "일차성 알도스테론증 선별 검사 적응증이 있는 성인에서는 초기 선별 검사 시행 전 미네랄코르티코이드 수용체길항제를 제외한 대부분의 항고혈압제를 중단하지 않고 지속적으로 사용할 것을 권고한다."], "8.1": ["IIa", "B", "고혈압 전단계 환자에서는 가면고혈압을 진단하기 위해 가정혈압 측정 또는 활동혈압 측정을 고려한다."], "8.2": ["I", "A", "주의혈압 및 고혈압 전단계 환자에서는 고혈압 발생 및 심뇌혈관질환 예방을 위하여 적극적인 생활요법을 권고한다."], "8.3": ["IIa", "B", "심혈관질환*이 동반된 고혈압 전단계 환자에서는 약물치료를 고려한다."], "8.4": ["IIb", "B", "고혈압 전단계이면서 심혈관질환 위험이 높은 고위험 환자(당뇨병, 만성콩팥병, 고혈압으로 인한 장기 손상)에서는 3개월간 생활요법 시행 후에도 혈압이 130/80 mmHg 이상으로 유지되는 경우 약물치료를 고려할 수 있다."], "9.1": ["I", "A", "중위험군 또는 고위험군 1기 고혈압환자에서는 생활요법과 함께 약물치료를 병행할 것을 권고한다."], "10.1": ["I", "A", "2기 고혈압환자에서는 생활요법과 동시에 약물치료를 권고한다."], "11.1": ["I", "A", "지역사회에 거주하는 65세 이상 건강한 노인에서 수축기혈압이 140 mmHg 이상인 경우에는 생활요법과 동시에 약물치료를 시행할 것을 권고한다."], "11.2": ["I", "A", "노쇠한 노인 또는 80세 이상의 노인은 수축기혈압이 160 mmHg 이상인 경우 생활요법과 동시에 약물치료를 시행할 것을 권고한다."], "12.1": ["I", "A", "저위험군 및 중위험군을 가진 고혈압환자에서는 혈압을 140/90 mmHg 미만으로 조절할 것을 권고한다."], "13.1": ["I", "A", "심뇌혈관질환 위험도가 고위험군에 해당되는 환자에서는 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다."], "13.2": ["I", "A", "심혈관질환, 즉, 관상동맥질환, 말초혈관질환, 복부 대동맥류, 심부전이 동반된 환자에서는 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다."], "14.1": ["I", "A", "노인 고혈압환자에서는 수축기혈압을 140 mmHg 미만으로 조절할 것을 권고한다."], "15.1": ["I", "A", "당뇨병이 동반된 고혈압환자에서는 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다."], "16.1": ["I", "A", "뇌졸중 병력이 있는 고혈압환자에서는 수축기혈압을 130 mmHg 미만으로 조절할 것을 권고한다."], "17.1": ["I", "A", "만성콩팥병 환자의 혈압은 환자가 견딜 수 있다면 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다."], "17.2": ["IIa", "B", "표준화된 혈압 측정법*으로 측정한 경우에는 수축기혈압을 120 mmHg 미만으로 조절하는 것을 고려한다."], "18.1": ["IIb", "B", "수축기혈압이 110 mmHg 미만이거나, 이완기혈압이 70 mmHg 미만으로 감소할 경우, 사망률 및 관상동맥질환의 발생 위험이 증가될 수 있다. 따라서 특히 노인, 당뇨병 환자, 재관류술을 시행 받지 않은 다발성 관상동맥질환 환자, 그리고 심비대가 동반된 고혈압환자들에서는 이완기혈압을 70 mmHg 미만으로 낮추지 않는 것을 고려할 수 있다."], "19.1": ["I", "A", "주의혈압, 고혈압 전단계 및 고혈압환자에게는 생활요법 시행을 권고한다."], "20.1": ["I", "A", "과체중 또는 비만한 사람에게는 체중 감량을 통해 혈압을 낮출 것을 권고한다."], "21.1": ["I", "A", "하루 소금 섭취량을 5 g(염화나트륨 5 g 또는 나트륨 2,000 mg)이하로 제한할 것을 권고한다."], "22.1": ["I", "A", "하루 2잔 미만으로 금주에 준하는 수준의 절주를 시행할 것을 권고한다."], "23.1": ["I", "A", "모든 성인에서는 일주일에 중강도 150분 또는 고강도 75분 이상의 유산소 운동(걷기, 뛰기, 자전거타기, 수영 등) 시행할 것을 권고한다."], "23.2": ["I", "A", "유산소 운동과 함께 저항성 운동(스쿼트, 팔굽혀펴기, 덤벨 등)을 병행할 것을 권고한다."], "24.1": ["I", "B", "모든 흡연자에서는 금연을 권고하며, 금연을 위해 지지적 돌봄을 제공하고 금연 프로그램에 연계할 것을 권고한다."], "24.2": ["I", "B", "전자담배 흡연은 혈압 및 맥박수 상승과 심혈관질환 발생 증가와 연관성이 높아, 전자담배 흡연자에서도 금연을 권고한다."], "25.1": ["I", "A", "채소와 과일을 충분히 포함하고, 지방 섭취를 제한하되, 탄수화물, 단백질 및 지질을 비롯하여 식이섬유, 미네랄, 비타민 등의 영양소가 균형 있게 포함된 식사를 권고한다."], "26.1": ["IIa", "B", "호흡 훈련, 마음 챙김 훈련 및 명상을 통하여 스트레스를 줄일 것을 고려한다."], "27.1": ["IIa", "B", "심혈관질환을 동반한 고혈압 전단계 환자에서는 약물치료를 고려한다."], "27.2": ["IIa", "B", "심뇌혈관질환 저위험군인 고혈압환자에서는 3개월간의 비약물적 치료에도 불구하고 혈압이 조절이 되지 않을 경우, 목표 혈압 달성을 위해 약물치료를 고려한다."], "27.3": ["I", "A", "심뇌혈관질환 중위험군 이상에 해당하는 모든 고혈압환자는 약물치료의 적응이 되며, 적극적인 생활요법과 병행하여 목표 혈압 도달을 위한 적절한 약물치료를 권고한다."], "28.1": ["I", "A", "RAS억제제, 베타차단제, 칼슘통로차단제, 이뇨제를 고혈압 치료의 1차 약제로 권고한다."], "28.2": ["IIa", "B", "80세 이하의 2기 고혈압이거나 고위험 1기 고혈압환자에서는 초치료로 2제 병용요법을 고려한다. 이때 초기 병용요법은 RAS 억제제, 칼슘차단제, 이뇨제 중에서 두 가지 약제를 병용하여 투여하는 것을 고려한다."], "28.3": ["IIa", "B", "2제 병용요법을 사용할 경우에는 단일제형복합제의 사용을 우선적으로 고려한다."], "28.4": ["IIa", "B", "2제 병용요법으로 혈압이 조절되지 않는 경우, RAS 억제제, 칼슘통로차단제, 이뇨제의 3제 병용요법을 고려한다."], "28.5": ["IIa", "B", "80세 이상이거나 노쇠한 환자의 경우 초기 치료는 단일 약제로 시작하는 것을 고려한다."], "28.6": ["I", "A", "베타차단제는 적응증*이 동반된 환자의 경우 초기 치료, 또는 병용요법으로 사용을 권고한다."], "29.1": ["IIa", "B", "일차 항고혈압 약제로서 티아지드계 이뇨제를 사용할 수 있으며, 하이드로클로로티아지드, 클로르탈리돈, 인다파미드 중에서 선택하여 사용을 고려한다."], "29.2": ["IIa", "B", "고리작용이뇨제는 울혈성심부전 혹은 만성콩팥병 4-5기 환자에서 고혈압이 동반된 경우에 사용을 고려한다."], "29.3": ["IIa", "B", "난치성(혹은 저항성)고혈압의 치료를 위해 추정사구체 여과율이 30ml/min/m2 이상이고, 고칼륨혈증이 동반되지 않는 경우, 미네랄코티코이드수용체길항제인 스피로놀락톤 사용을 고려한다."], "29.4": ["IIa", "B", "난치성(혹은 저항성)고혈압 치료를 위해 추정사구체 여과율이 30ml/min/m2 미만인 경우 클로르탈리돈 사용을 고려한다."], "30.1": ["I", "A", "베타차단제는 협심증, 심근경색 후, 박출률감소심부전, 심방세동의 치료에 적응증이 있으며, 심박수 조절이 필요한 고혈압환자에서 투여를 권고한다."], "31.1": ["I", "A", "안지오텐신수용체-네프릴리신억제제는 심부전이 동반된 고혈압환자에서 ACE 억제제나 ARB보다 우선적으로 권고한다."], "31.2": ["IIa", "B", "안지오텐신수용체-네프릴리신억제제인 사쿠비트릴/발사르탄은 염분 감수성이 높은 고혈압환자에서 사용을 고려한다."], "32.1": ["I", "A", "나트륨-포도당 공동수송체 2(SGLT2) 억제제인 다파글리플로진과 엠파글리플로진은 심부전이 동반된 고혈압환자에서 이차 예방을 위하여 사용을 권고한다."], "33.1": ["I", "C", "난치성(혹은 저항성)고혈압의 진단을 위해 약제에 대한 치료 지속성을 확인하고 가정혈압 또는 활동 혈압 측정을 권고한다."], "33.2": ["IIa", "A", "난치성(혹은 저항성)고혈압환자에서는 수면무호흡증의 동반 여부 평가를 고려한다."], "33.3": ["IIa", "B", "난치성(혹은 저항성)고혈압에서는 추가 치료로 알도스테론 길항제인 스피로놀락톤의 사용을 고려한다."], "33.4": ["IIa", "B", "난치성(혹은 저항성)고혈압환자에서 스피로놀락톤의 사용이 어려운 경우에는 아밀로라이드 추가를 고려한다."], "33.5": ["IIb", "B", "난치성(혹은 저항성)고혈압환자에서 추가적인 혈압 강하가 필요한 경우 ACE 억제제나 ARB를 ARNI로 변경하는 것을 고려할 수 있다."], "33.6": ["IIb", "B", "난치성(혹은 저항성)고혈압환자에서는 알도스테론합성효 억제제(aldosterone synthase inhibitor)의 추 가를 고려할 수 있다."], "33.7": ["IIb", "B", "난치성(혹은 저항성)고혈압환자에서 약물치료로 혈압 조절이 어려운 경우, 콩팥교감신경차단술 (renal sympathetic denervation)을 고려할 수 있다."], "34.1": ["I", "A", "심혈관질환이 있는 고혈압환자에서는 2차 예방을 위해 아스피린 투여를 권고한다."], "34.2": ["IIb", "B", "심혈관질환이 없는 고위험 고혈압환자에서는 1차 예방 목적으로 저용량 아스피린 투여를 고려할 수 있다."], "34.3": ["III", "A", "심혈관질환이 없는 저위험 또는 중등도 위험의 고혈압환자에서 아스피린 투여는 권고되지 않는다."], "35.1": ["I", "A", "LDL-콜레스테롤 치료의 시작 시점과 목표 수치는 심혈관질환 발생 위험도와 기저 심혈관질환 유무에 따라 결정할 것을 권고한다."], "35.2": ["I", "A", "중등도 이상 위험도를 가진 고혈압환자에서는 스타틴 투여가 심혈관 사건 발생을 감소시키므로 이를 권고한다."], "35.3": ["I", "A", "심혈관질환이 있는 고혈압환자에서는 스타틴 투여가 심혈관질환 발생을 감소시키므로 이를 권고한다."], "36.1": ["I", "A", "고혈압이 동반된 당뇨병 환자에서 저혈당 위험이 없다면, 당화혈색소를 6.5% 미만으로* 조절할 것을 권고한다."], "36.2": ["I", "A", "심부전이 동반되었거나, 알부민뇨가 존재하거나 추정사구체 여과율이 감소한 경우에는 SGLT2 억제제의 사용을 권고한다."], "36.3": ["I", "A", "죽상동맥경화성 심혈관질환이 동반된 당뇨병 환자에서는 GLP-1 수용체작용제 혹은 SGLT2 억제제를 포함한 치료를 권고한다."], "37.1": ["I", "C", "새로 항고혈압 약물치료를 시작하거나 약물 용량을 조절한 경우에는 치료 지속성과 혈압 조절 여부를 평가하기 위해 목표 혈압에 도달할 때까지 2–4주 간격으로 추적 관찰할 것을 권고한다."], "37.2": ["IIa", "C", "전해질 및 콩팥 기능 검사는 연 1-2회 시행을 고려한다."], "37.3": ["IIa", "B", "혈압이 목표 혈압 이하로 조절된 고혈압환자에서는 3-6개월 간격으로 추적 관찰할 것을 고려한다."], "37.4": ["I", "A", "항고혈압 약제를 투여 중인 환자에서는 가정혈압을 이용한 추적 관찰 및 모니터링을 권고한다."], "38.1": ["I", "A", "고혈압 약제의 투여 횟수를 최소화하여 약물치료 지속성을 개선하기 위해, 가능하면 하루 한 번 투여를 권고한다."], "38.2": ["IIa", "B", "약물치료 지속성을 높이기 위해 단일제형복합제 투여를 고려한다."], "39.1": ["I", "C", "고혈압에 대한 약물치료를 시작하기 전에 백의고혈압을 배제할 것을 권고한다."], "39.2": ["I", "B", "백의고혈압의 진단을 위해 진료실 밖 혈압(활동혈압 또는 가정혈압) 측정을 권고한다."], "39.3": ["I", "B", "백의고혈압환자에서는 지속성 고혈압으로의 이행을 감시하고 장기 손상을 조기에 발견하기 위해 정기적인 혈압 측정과 위험인자 평가를 권고한다."], "39.4": ["I", "B", "항고혈압 약물치료 중 진료실혈압이 조절되지 않는 경우, 백의비조절고혈압의 가능성을 배제하기 위해 진료실 밖 혈압 측정을 권고한다."], "39.5": ["IIb", "C", "백의고혈압 또는 백의비조절고혈압환자에서 심혈관질환 위험이 높거나 동반된 장기 손상이 있는 경우 치료를 고려할 수 있다."], "39.6": ["I", "B", "혈압이 정상 또는 고혈압 전 단계 범위이면서 장기 손상 소견이 있는 경우 가면 고혈압을 의심하여 진료실 밖 혈압 측정을 권고한다."], "39.7": ["I", "C", "항고혈압 치료 중 진료실혈압이 고혈압 전단계 수준이면서 심뇌혈관질환 고위험군 또는 고혈압으로 인한 장기 손상이 동반된 고혈압환자에서는 가면비조절고혈압을 배제하고 예후를 평가하기 위해 진료실 밖 혈압 측정을 권고한다."], "39.8": ["IIb", "C", "가면고혈압 또는 가면비조절고혈압에서 심혈관질환 위험이 높거나 동반된 장기 손상이 있는 경우 치료를 고려할 수 있다."], "40.1": ["I", "B", "당뇨병이 없는 대사증후군을 동반한 고혈압환자에서는 식이 요법, 체중 조절 및 운동과 같은 생활요법을 철 저히 시행할 것을 권고한다."], "40.2": ["IIa", "B", "항고혈압제로는 ACE 억제제 또는 ARB, 혹은 칼슘통로차단제를 우선적으로 고려한다."], "41.1": ["I", "A", "과체중 또는 비만을 동반한 고혈압환자에서는 혈압 감소와 심혈관질환 예방을 위해 체중 감량을 권고한다."], "41.2": ["IIa", "B", "당뇨병과 고혈압을 동반한 비만 환자에서는 체중과 혈압을 모두 감소시킬 수 있는 혈당강하제의 사용을 고려한다."], "42.1": ["I", "A", "당뇨병 환자에서는 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다."], "42.2": ["I", "A", "당뇨병을 동반한 고혈압환자에서는 모든 계열의 항고혈압제를 일차 치료 약제로 권고한다."], "42.3": ["I", "A", "알부민뇨가 동반된 경우에는 ACE 억제제나 ARB를 권고한다."], "43.1": ["I", "A", "지역사회에 거주하는 65세 이상의 노인 환자에서는 수축기혈압을 140 mmHg 미만으로 조절할 것을 권고한다."], "43.2": ["IIb", "B", "65세 이상 노인 환자 중 심혈관질환, 만성콩팥병을 동반한 고위험 환자에서는 수축기혈압을 130 mmHg 미만으로 조절하는 것을 고려할 수 있다."], "43.3": ["IIb", "C", "노쇠한 노인, 85세 이상 고령자, 기대 여명 3년 이내이거나 증상을 동반한 기립성 저혈압 환자에서는 개별화된 혈압 목표를 설정하고 이에 따라 혈압 조절을 고려할 수 있다."], "44.1": ["I", "B", "젊은 고혈압환자에서는 이차성 고혈압의 원인에 대한 선별 검사를 시행할 것을 권고한다."], "44.2": ["IIa", "B", "젊은 고혈압환자에서는 고혈압에 의한 표적장기 손상에 대한 평가를 통해 고위험군을 조기에 선별하고, 필요시 신속한 약물치료 시작을 고려할 수 있다."], "45.1": ["I", "A", "관상동맥질환이 동반된 고혈압환자에서는 목표 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다."], "45.2": ["I", "A", "심근경색이 동반된 고혈압환자에서는 일차 치료 약제로 베타차단제, ACE 억제제 또는 ARB를 권고한다."], "45.3": ["I", "A", "관상동맥질환이 동반된 고혈압환자에서 협심증이 있는 경우에는 베타차단제 및 칼슘통로차단제를 고혈압 치료 약제로 권고한다."], "46.1": ["I", "B", "심부전 발생 위험이 높은 고혈압환자에서는 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다."], "47.1": ["IIa", "B", "심방세동이 동반된 고혈압환자에서 ARB는 심방세동의 재발을 줄이므로 사용을 고려한다."], "47.2": ["I", "B", "심방세동이 동반된 고혈압 환자에서 항응고치료에 따른 주요 출혈 위험을 줄이기 위해 가능한 조속히 수축기혈압을 160 mmHg 미만으로 조절할 것을 권고한다."], "48.1": ["IIa", "B", "알부민뇨가 동반된 만성콩팥병 환자에서 고혈압 치료 시 ACE 억제제 혹은 ARB의 사용을 고려한다."], "48.2": ["I", "A", "만성콩팥병이 동반된 고혈압환자에서는 SGLT2 억제제의 사용을 권고한다."], "48.3": ["IIa", "B", "티아지드 유사 이뇨제인 클로르탈리돈은 추정사구체 여과율이 30 ml/min/1.73 m2 미만에서도 혈압 조절을 위해 고려한다."], "48.4": ["I", "A", "당뇨병과 고혈압이 동반되고 알부민뇨가 있는 추정사구체 여과율 25 ml/min/1.73 m2 이상인 만성콩팥병 환자에서는 비스테로이드성 미네랄코티코이드수용체길항제인 피네레논의 사용을 권고한다."], "49.1": ["I", "B", "정맥내 혈전용해치료가 적합한 급성 허혈성 뇌졸중 환자에서 혈압이 높은 경우 뇌출혈 위험성을 낮추기 위해 혈전용해치료 시작 전 혈압을 185/110 mmHg 이하로 조절하고, 치료 후 24시간 동안은 180/105 mmHg 이하로 유지할 것을 권고한다."], "49.2": ["I", "A", "혈관내 재개통치료를 시행하는 환자에서는, 뇌출혈 위험 감소를 위해 시술 전 혈압을 185/110 mmHg 이하로 유지하는 것이 바람직하다. 혈관내 재개통치료 후 성공적 재관류(TICI 2b 또는 3)가 이루어진 경우, 첫 24시간 동안 과도한 혈압 강하는 해로울 수 있으므로 수축기혈압은 140 mmHg 미만으로 낮추기보다는 180 mmHg 이하로 유지할 것을 권고한다."], "49.3": ["IIa", "B", "신경학적으로 안정적인 허혈성 뇌졸중 환자에서 혈압이 140/90 mmHg 이상인 경우, 입원 중 다른 금기사항이 없다면 장기적인 혈압 조절 개선을 위해 항고혈압제의 시작 또는 재개를 고려한다."], "49.4": ["IIb", "C", "정맥내 혈전용해치료나 혈관내 재개통치료를 시행하지 않은 급성기 허혈성 뇌졸중 환자에서 혈압이 220/120 mmHg 이상인 경우, 고혈압 치료가 필요한 다른 합병증이 없다면, 발병 후 초기 48-72 시간 이내 항고혈압 치료의 효과는 확실하지 않다. 그럼에도 불구하고 치료를 시행하는 경우, 발병 후 첫 24시간 동안 혈압을 15% 이내로 점진적으로 낮추는 것을 고려할 수 있다."], "49.5": ["III", "A", "정맥내 혈전용해치료나 혈관내 재개통치료를 시행하지 않은 급성기 허혈성 뇌졸중 환자에서 혈압이 220/120 mmHg 이하인 경우, 고혈압 치료가 필요한 다른 합병증이 없다면, 발병 후 초기 48-72 시간 이내에는 고혈압 치료의 효과가 확실하지 않아 권고하지 않는다."], "50.1": ["IIb", "B", "발병 후 6시간 이내의 뇌실질내출혈 환자의 수축기혈압이 150-220 mmHg인 경우 혈압 강하 치료를 고려할 수 있다. 다만, 혈압을 낮출 때에는 수축기혈압을 140 mmHg 이상으로 유지하도록 한다."], "50.2": ["IIa", "C", "뇌실질내출혈 환자에서 수축기혈압이 220 mmHg 이상인 경우에는 혈압 강하를 위해 지속적인 정맥내 항고혈압제 투여와 함께 면밀한 혈압 모니터링을 고려한다."], "51.1": ["I", "A", "기존에 고혈압으로 치료 중이었거나 새로 고혈압으로 진단된 환자에서 뇌졸중 또는 일과성 허혈 발작이 발생한 경우, 뇌졸중 및 혈관질환의 재발 예방을 위해 발병 수일 이내에 항고혈압제의 투여를 재개하는 것을 권고한다."], "51.2": ["I", "A", "뇌졸중 또는 일과성 허혈 발작 환자의 혈압 조절을 위해 티아지드계 이뇨제, ACE 억제제, ARB, 또는 티아지드계 이뇨제와 ACE 억제제 또는 ARB의 병용요법을 권고한다."], "51.3": ["IIa", "C", "뇌졸중 또는 일과성 허혈 발작 환자의 고혈압 조절을 위해 칼슘통로차단제 사용을 고려한다."], "51.4": ["IIa", "B", "열공성 뇌경색 환자에서는 목표 수축기혈압을 130 mmHg 미만으로 조절하는 것을 고려한다."], "52.1": ["IIa", "B", "임신중 고혈압 진단을 위해 진료실 밖 혈압(활동혈압 또는 가정혈압) 측정을 고려한다."], "52.2": ["IIb", "B", "만성고혈압 또는 임신성 고혈압이 있는 임신부에서 가정혈압 측정은 혈압 관리 및 예후 개선을 위해 고려할 수 있다."], "52.3": ["I", "B", "만성고혈압 또는 임신성 고혈압이 있는 임신부는 수축기혈압 ≥ 140 mmHg 또는 이완기혈압 ≥ 90 mmHg에서 약물치료의 시작 또는 혈압 강하를 권고한다."], "52.4": ["I", "B", "만성고혈압(전자간증 유무와 무관) 또는 임신성 고혈압이 있는 임신부에서는 혈압 목표를 140/90 mmHg 미만으로 유지할 것을 권고한다."], "52.5": ["III", "C", "고혈압 질환이 있는 임신부에서는 과도한 혈압 강하(이완기혈압 <80 mmHg)는 권고하지 않는다."], "52.6": ["I", "A", "전자간증 위험이 중등도 이상인 고위험 임신부에게는 저용량 아스피린(75~150 mg/일) 사용을 권고한다."], "52.7": ["I", "C", "임신부에서 중증 고혈압(수축기혈압 ≥160 mmHg 또는 이완기혈압 ≥ 110 mmHg)인 경우 즉각적인 입원 치료를 권고한다."], "52.8": ["IIb", "C", "임신부의 고혈압 약물 요법은 병용요법보다 단일 요법의 증량을 우선적으로 고려할 수 있다."], "52.9": ["I", "A", "산후 고혈압 여성의 목표 혈압은 140/90 mmHg 미만으로 조절할 것을 권고한다."], "53.1": ["IIb", "B", "고혈압이 동반된 수면무호흡증 환자에서는 지속적 기도 양압 치료를 고려할 수 있다."], "54.1": ["I", "A", "성인 고혈압환자에서는 인지 기능 저하 및 치매의 발생 위험을 낮추기 위해 고혈압 치료를 권고한다."], "55.1": ["I", "C", "고혈압성 응급 환자에서는 지속적인 혈압 및 급성 장기 손상 모니터링을 위해 입원하여 집중 감시하에 치료하는 것을 권고하며, 임상 상황에 따라 정주 항고혈압제 사용을 권고한다."], "55.2": ["I", "C", "대동맥 박리가 동반된 고혈압성 응급 환자에서는 초기 치료 목표로 수축기혈압을 <120 mmHg로 신속히 조절하는 것을 권고한다."], "55.3": ["IIa", "C", "대동맥 박리를 제외한 고혈압성 응급 환자에서는 과도한 급속 혈압 강하는 피하며, 평균 동맥압을 초기 1시간 이내 약 20~25% 감소시키는 것을 고려한다."], "55.4": ["III", "C", "고혈압으로 인한 급성 장기 손상이 확인되지 않은 급성 중증 고혈압환자에서는 즉각적인 정주 항고혈압제 사용을 권고하지 않는다."], "56.1": ["IIa", "B", "환자의 요구와 이해 수준에 맞춘 심혈관질환 위험도 및 치료 이점에 대한 설명을 고혈압 관리의 일환으로 고려한다."], "56.2": ["I", "B", "자가 혈압 측정을 활용한 가정혈압 측정은 고혈압 관리에 효과적이므로 혈압 조절 향상을 위해 권고한다."], "56.3": ["I", "B", "적절하게 수행되는 자가 혈압 측정은 고혈압의 진단 정확도를 높이고, 환자 역량 강화와 치료 지속성을 향상시키므로 권고한다."], "56.4": ["I", "A", "고혈압환자의 혈압 조절 및 심혈관 사건 예방을 위해 의사, 간호사, 약사, 영양사 등이 참여하는 다학제 팀 기반 접근을 권고한다."]};

const SEG={"ch1": [["p", "1. 고혈압의 정의와 혈압의 분류 본 지침에서 `고혈압’은 고혈압환자를 대상으로 수행된 엄격한 무작위대조시험(randomized controlled trial)에서 약물 치료의 유효성이 입증된, 특정 역치 이상의 혈압(blood pressure, BP)으로 정의한다. 또한 고혈압 기준보다 낮은 혈압 범위에서도 역학적 위험도에 기반하여 혈압을 세분화하고 생활요법을 적용하도록 함으로써, 고혈압의 예방에 본 지침을 활용하고자 한다."], ["p", "현재까지의 추적된 임상시험 근거에 따르면, 수축기혈압(systolic blood pressure) 140 mmHg 이상 또는 이완기혈압 (diastolic blood pressure) 90 mmHg 이상을 ‘고혈압’으로 분류한다. 반면, 수축기혈압과 이완기혈압이 각각 120 mmHg 미만 및 80 mmHg 미만인 경우를 ‘정상혈압’으로 정의하며, 이는 임상적으로 심뇌혈관질환 위험도가 가장 낮은 최적의 혈압 범주로서, 고혈압의 위험성을 평가할 때 기준점으로 사용된다."], ["p", "수축기혈압 120~129 mmHg 및 이완기혈압이 80 mmHg 미만은 ‘주의혈압’으로 분류하며, 수축기혈압이 130~139 mmHg 또는 이완기혈압이 80~89 mmHg는 ‘고혈압 전단계’로 정의한다. 또한 이완기혈압은 90 mmHg 미만이면서 수축기혈압만 140 mmHg 이상으로 상승한 경우는 ‘수축기단독고혈압(isolated systolic hypertension)’으로 하고, 수축기혈압은 140 mmHg 미만이면서 이완기혈압만 90 mmHg 이상으로 상승한 경우를 ‘이완기단독고혈압(isolated diastolic hypertension)’으로 한다. 고혈압은 혈압 상승의 정도에 따라 ‘1기 고혈압’과 ‘2기 고혈압’으로 세분된다<표 1>."], ["cap", "표 1. 혈압의 분류"], ["p", "고혈압 고혈압 예방과 관리를 위한 다양한 노력에도 불구하고, 전 세계적으로 고혈압의 유병률과 유병자 수가 증가하고 있으며 고혈압 조절률도 또한 일부 지역에서만 개선되었다. 더욱 적극적인 고혈압 예방과 관리를 위하여, 주요 국제 학술단체들은 고혈압 진료지침들을 주기적으로 개정하고 있다. 그러나 최근 발표된 주요 고혈압 진료 지침들 간에는 혈압 분류 기준에 차이가 있어 주의가 필요하다."], ["p", "미국심장학회/미국심장협회(American College of Cardiology/American Heart Association, ACC/AHA)의 2017년 고혈압 진료지침2은 수축기혈압 130 mmHg 이상 또는 이완기혈압 80 mmHg 이상을 고혈압으로 정의하여 기존보다 더 많은 인구를 고혈압으로 분류하였다. 이후 2025년 개정된 ACC/AHA 고혈압 진료지침3에서도 이러한 혈압 분류 기준은 유지되었다. 반면 유럽고혈압학회(European Society of Hypertension, ESH) 20234, 유럽심장학회 (European Society of Cardiology, ESC) 20245 및 일본고혈압학회(Japanese Society of Hypertension, JSH) 2025의 고혈압 진료 지침은 대한고혈압학회 지침과 동일하게 수축기혈압 140 mmHg 이상 혹은 이완기혈압 90 mmHg 이상을 고혈압으로 정의하고 있으며, 2026년 개정 대한고혈압학회 진료지침에서도 이러한 기준을 그대로 유지하였다."], ["p", "그러나 고혈압에 해당하지 않는 혈압 구간의 분류에서는 지침 간 큰 차이가 있다. ESH 2023은 Optimal/Normal/ High-Normal의 세 단계로 구분하는 반면, ESC 2024는 ‘Non-elevated’와 ‘Elevated’라는 새로운 용어를 도입 하였고, 특히 이완기혈압은 70 mmHg 이상일 경우 ‘Elevated’로 분류하여 이완기혈압 관리의 중요성을 강조하고 있다. JSH 2025는 수축기혈압은 Normal/High-normal/Elevated의 세 단계로, 이완기혈압은 별도의 High-normal 기준 없이 Normal/Elevated의 두 단계로 구분한다,8. 2023년 대한고혈압학회 진료지침은 수축기혈압을 정상혈압/ 주의혈압/고혈압 전단계의 세 단계로 분류하며, 이완기혈압은 정상혈압/고혈압 전단계의 두 단계로 구분하고 있다. <그림 1>은 ESH 20234, ESC 20245, AHA/ACC 20253, JSH 20256 및 대한고혈압학회 진료지침의 혈압 분류를 비교한 것이다. 수축기혈압과 이완기혈압의 분류 기준을 각각 제시하였으며, 두 기준이 상이할 경우 더 높은 범주에 해당하는 혈압 분류를 적용한다."], ["cap", "그림 1. 주요 고혈압 진료지침의 혈압 분류 비교"], ["p", "수축기혈압(mmHg) High- Stage 1 Stage 2 HTN High- normal 고혈압 이완기혈압(mmHg) High- normal Non- ESH 2023, European Society of Hypertension Guidelines 2023; ESC 2024, European Society of Cardiology Guidelines for Hypertension 2024; AHA 2025, American College of Cardiology / American Heart Association Guidelines for Hypertension 2025; JSH, Japanese Society of Hypertension Guidelines 2025; KSH 2026, Korean Society of Hypertension 2026 2. 고혈압의 중요성 고혈압이 심뇌혈관질환의 발생 및 사망 위험을 현저히 증가시키는 것은 이미 잘 확립된 사실이다. 국내 여러 관찰연구 에서도 고혈압이 관상동맥질환 및 뇌혈관질환의 위험을 크게 높이는 것으로 보고되었다. 또한 고혈압 전단계에 해당하는 사람들도 정상혈압군에 비해 바람직하지 않은 생활습관을 보이는 경향이 있으며, 고혈압으로 진행할 가능성이 높고 심뇌혈관질환 발생 위험도가 증가하는 것으로 알려져 있다."], ["p", "우리나라를 포함한 동아시아 국가들, 호주, 뉴질랜드 등 16개 지역의 데이터를 통합한 APCSC 연구에서도 고혈압이 뇌졸중과 관상동맥질환 발생의 주요한 원인으로 확인되었다. 특히, 수축기혈압이 10 mmHg 감소할 경우, 동아시아 지역에서는 뇌졸중 위험이 41% 감소한 반면, 호주와 뉴질랜드에서는 30% 감소하여, 동아시아 인구에서 혈압 조절을 통한 뇌졸중 예방 효과가 더욱 클 것으로 예측되었다."], ["p", "<표 2>에서 제시한 바와 같이, 우리나라에서는 관상동맥질환과 뇌혈관질환 모두에서 고혈압의 인구집단기여위험도가 가장 높게 나타났다. 또한 수축기혈압이 20 mmHg 상승할 경우, 허혈성뇌졸중, 뇌내출혈, 지주막하출혈의 위험도는 남성에서 각각 1.79배, 2.48배, 1.65배, 여성에서 1.64배, 3.15배, 2.29배 증가하는 것으로 보고되었다."], ["p", "최근 국가건강검진과 건강보험청구데이터를 활용한 국내 역학 연구에서도 수축기혈압과 이완기혈압의 증가에 따라 심혈관질환 위험이 선형적으로 증가하는 양상이 확인되었다<그림 2>18. 수축기혈압의 상승 뿐 아니라 수축기혈압이 정상 범위에 있으면서 이완기혈압이 상승한 경우에도 심혈관질환 위험이 유의하게 증가하는 것으로 관찰되었다 <그림 3>19. 이러한 결과는 한국인에서 고혈압이 심뇌혈관질환 발생에 미치는 영향이 매우 크며, 적극적인 혈압 관리의 중요성이 국내 데이터를 통해 명확히 입증되었음을 시사한다."], ["cap", "표 2. Korean Heart Study에서 심혈관계 위험요인의 인구집단기여위험도(%)16"], ["cap", "그림 2. 수축기혈압과 이완기혈압의 분포와 심혈관질환 발생의 상대위험도18"], ["cap", "그림 3. 젊은 한국 성인에서 고혈압의 표현형에 따른 심혈관질환 발생률19"], ["p", "3. 고혈압의 유병률과 혈압의 분포 우리나라 성인의 고혈압 유병률은 국민건강영양조사(Korean National Health and Nutrition Examination Survey) 결과를 통해 추정할 수 있다. 국민건강영양조사는 제1기(1998)부터 제3기(2005)까지는 3~4년 주기로 실시하였으나, 제 4기(2007~2009)부터는 매년 조사가 이루어지고 있으며, 3개년 자료를 통합하여 전국을 대표하는 확률 표본을 구성하는 방 식으로 진행되고 있다. 국민건강영양조사에서는 검진 시 수축기혈압 140 mmHg 이상, 이완기혈압이 90 mmHg 이상, 또는 혈압강하제를 복용 중인 경우를 `고혈압’으로 정의한다. 2005년에는 인구 구조를 기준으로 연령표준화한 고혈압 유병률은 30세 이상에서 25%, 20세 이상에서는 20%였으며, 2023년 국민건강영양조사결과로 추정한 고혈압 유병률은 30세 이상 성인에서 34%, 20세 이상에서는 29% 였다."], ["p", "<그림 4>에서 보는 바와 같이 우리나라 성인의 연령표준화한 고혈압 유병률은 1998년부터 2007년까지 감소했다가 2011년까지 일시적으로 증가하였으나, 이후로는 약간의 변동은 있지만 조금씩 감소하는 추세를 보이고 있다. 2005년 인구구조를 기준으로 연령 표준화한 고혈압 유병률은 20세 이상 남성에서는 1998년에 29.6%에서 2023년 23.8%까지 낮아졌으며, 20세 이상 여성에서는 1998년에 22.3%에서 2023년 16.8%까지 감소하였다. 같은 기간 동안 30세 이상 남성의 연령표준화 고혈압 유병률은 33.4%에서 29.5%로, 30세 이상 여성의 연령 표준화 고혈압 유병률은 27.4%에서 21.4%로 변하였다."], ["cap", "그림 4. 1998-2023 고혈압 유병률 변화(20세 이상 연령 표준화)21"], ["p", "연령 증가에 따라서 혈압은 상승하는 경향을 보인다. 남자의 경우 20대부터 60대까지 혈압이 지속적으로 증가하나, 70대 이후에는 큰 변동을 보이지 않는다. 반면 여자는 50대 이전까지 혈압 상승 속도가 비교적 느리다가, 폐경 이후인 50대부터 혈압이 급격히 증가하기 시작한다. 이로 인해 60대까지는 남자의 고혈압 유병률이 여자보다 높으나, 70세 이후에는 남자보다 여자의 유병률이 더 높아지기 때문에 이에 대한 적극적인 관리가 요구된다<그림 5>."], ["p", "특히, 고령층에서는 여성 인구가 남성보다 더 많기 때문에, 고혈압환자 수 역시 고령층에서 여성 비중이 크게 증가하는 특징을 보인다. 2023년 우리나라 성인 고혈압 유병자수는 남자 670만명, 여자 590만명으로 추정되지만, 65세 이상 고혈압 인구는 남자가 267만명, 여자가 332만명으로 추정된다<그림 6>."], ["p", "또한, 수축기혈압은 연령 증가와 함께 지속적으로 상승하는 반면, 이완기혈압은 60대 이후 감소하는 경향을 보여 노인 인구에서는 맥압(수축기혈압과 이완기혈압의 차이)이 증가하고, 수축기단독고혈압의 유병률이 높아지는 것도 중요한 연령 관련 특징이다."], ["cap", "그림 5. 성별, 연령별 고혈압 유병률의 변화21"], ["cap", "그림 6. 성별, 연령별 추정 고혈압 유병자수의 변화21"], ["p", "4. 고혈압의 관리 현황 고혈압 관리 수준을 평가하는 주요 지표로는 고혈압의 인지율, 치료율 및 조절률이 있다. 고혈압 인지율은 “고혈압 유병자 중 의사로부터 고혈압 진단을 받은 사람의 분율”로, 고혈압 치료율은 “조사 시점에 고혈압 치료제를 한달에 20일 이상 복용한 사람의 분율”로, 고혈압의 조절률은 “항고혈압제를 복용하여 수축기혈압 140 mmHg 미만이면서, 이완기혈압 90 mmHg 미만인 사람의 분율”로 정의한다."], ["p", "우리나라 고혈압 인지율, 치료율 및 조절률은 지난 수십 년간 크게 개선되었다. 국민건강영양조사 분석 결과, 20세 이상 인구에서 고혈압 인지율은 1998년 24.9%에서 2023년 78.6%로 향상되었으며, 고혈압 치료율도 같은 기간 24.5% 에서 76.0%로 크게 개선되었다. 고혈압 조절률은 두 경우로 구분하는데, 전체 고혈압 유병자 중 혈압이 조절되고 있는 사람의 비율을 의미하는 유병자 조절률은 1998년 6.8%에서 2023년 62.2%로 개선되었으며, 고혈압 치료자 중 혈압 조절이 달성된 비율을 의미하는 치료자 조절률도 1998년 27.7%에서 2023년 81.3%까지 향상되었다<표 3>."], ["p", "과거 30여 년간 고혈압 유병률 자체는 큰 변동이 없었지만, 고혈압 관리 수준의 향상으로 고혈압 유병자의 평균혈압이 유의하게 감소하였고, 이는 전체 인구의 평균혈압 감소로 이어졌다. 이러한 성과를 바탕으로 우리나라는 전 세계적으로 고혈압 관리의 성공적인 사례로 평가되며, 현재 인구 집단 평균혈압이 가장 낮은 나라로 꼽힌다. 이러한 결과를 종합 하면, 우리나라는 지난 20년 동안 고혈압 관리 수준이 크게 향상되었음을 알 수 있다."], ["p", "그러나 여전히 젊은 연령층, 특히 30∼40대 고혈압 유병자의 인지율, 치료율 및 조절률이 고령층에 비해 뚜렷이 낮아 이에 대한 대책이 필요하다. 유병자 조절률은 젊은 층에서 고령층에 비해 낮지만 치료자 조절률은 연령에 따른 차이가 없어, 젊은 고혈압환자도 일단 치료를 시작하면 충분한 혈압 조절이 가능함을 시사한다. 따라서 고혈압의 조기 발견과 치료 개입이 중요하다."], ["cap", "표 3. 우리나라 고혈압 관리 지표 추이(20세 이상, 단위 %)"], ["p", "5. 소금 섭취와 고혈압 일반적으로 소금(salt) 섭취를 줄이면 혈압이 낮아지는 것으로 알려져 있다. 2022년 국민건강영양조사결과에 따르면 우리나라 성인의 1 일평균 소금 섭취량은 8.0 g(남자 9.4 g, 여자 6.6 g), 나트륨(소듐, sodium) 기준으로는 3,213 mg (남자 3,770 mg, 여자 2,643 mg)이었으며, 이는 과거보다 감소하였으나, 여전히 세계보건기구(WHO) 권장량의 약 1.6배 수준이다."], ["p", "국민건강영양조사의 1998년, 2001년, 2005년 자료를 단면적으로 분석한 연구에서는 40대 미만 고혈압군에서 소금 섭취량이 높다는 결과가 보고되었으나, 에너지 섭취량을 보정한 후에는 소금 섭취와 혈압 간의 독립적 연관성은 관찰되지 않았다. 다만, 대사증후군을 대상으로 한 연구에서는 소금 섭취량과 혈압 간 유의한 상관관계가 보고된 바 있다."], ["p", "또한 국내 연구에 따르면 소금 섭취량 자체보다는 소변 내 나트륨/크레아티닌 비율이 혈압과 더 강한 상관성을 보였다. 이는 국민건강영양조사에서 사용된 소금 섭취량 추정치가 설문 기반 자료로, 실제 섭취량을 정확히 반영하기 어렵다는 점과 단면 연구(cross-sectional study)의 특성상 고혈압 진단 전후의 식습관 변화를 구분하기 어렵다는 연구적 한계에 기인할 수 있다. 따라서 소금 섭취와 혈압 간의 상관관계를 규명하기 위해서는 추가적인 연구가 필요하다."], ["p", "비록 국내 단면 연구에서 소금 섭취와 혈압 간의 명확한 상관성이 확인되지 않았지만, 해외 연구들은 소금 섭취 제한이 혈압을 유의하게 낮춘다고 보고하고 있다. 이러한 근거에 기반하여 대한고혈압학회의 진료 지침은 하루 소금 섭취량을 5 g(나트륨 2,000 mg) 이하로 제한할 것을 권고하였으나, 2013∼2016 국민건강영양조사 자료를 분석한 연구에 따르면 고혈압 유병자 중 일일 소금 섭취량 6 g(나트륨 섭취량 2,400 mg) 이하인 비율은 28.8%에 불과하였다."], ["p", "현재까지, 우리나라 일반 인구를 대상으로 한 소금 섭취 제한의 혈압 강하 효과에 대한 중재 연구는 부족한 실정으로, 향후 보다 체계적인 연구 수행이 필요하다."], ["p", "6. 대사증후군, 비만과 고혈압 심장대사증후군학회가 국민건강영양조사 자료를 분석한 결과, 우리나라 성인의 대사증후군(metabolic syndrome) 유병률은 2007-2009년 22.1%에서 2019-2021년 24.9%로 증가하였으며, 성별로 구분하면 남자는 23.9%에서 30.8%로 크게 상승한 반면, 여자에선 20.1%에서 19.0%로 유의한 변화가 관찰되지 않았다. 같은 기간 복부 비만 유 병률은 24.2%에서 33.2%로 증가하였으며, 고중성지방혈증은 28.1%에서 27.1%로, 저고밀도지단백 콜레스테롤 (low high density lipoprotein-cholestero, 저HDL-콜레스테롤)혈증은 41.4%에서 25.6%로 감소하였다. 반면 높은 혈압은 29.2%에서 31.2%로, 고혈당은 23.7%에서 32.2%로 증가하여, 복부 비만과 고혈당 유병률 상승이 대사증후군 유병률 증가의 주요 요인임을 확인할 수 있었다."], ["p", "2001년 및 2005년 국민건강영양조사 자료를 활용한 연구에서 대사증후군 유병률은 주의혈압 및 고혈압 전단계에서 26.2%, 고혈압군에서 53.3%로, 일반 인구에서의 유병률 24.1%에 비해 현저히 높게 나타났다. 이러한 결과는 대사장애가 정상혈압에서 고혈압으로 진행하는 과정에서 중요한 역할을 하며, 따라서 생활요법의 주요 관리 목표가 되어야 함을 의미한다."], ["p", "대한비만학회가 국민건강보험공단 일반검진자료를 분석한 결과에 따르면 체질량지수(body mass index, 체질량지수) 25 kg/m² 이상을 비만으로 정의할 때, 우리나라 성인의 비만 유병률은 2013년 31.1%에서 2023년 38.4%로 증가 하였다. 같은 기간 여성의 비만 유병률은 23.7%에서 27.5%로 완만히 증가한 반면, 남성의 비만 유병률은 38.8%에서 49.8%로 보다 빠른 증가 추세를 보였다. 국민건강영양조사 자료를 분석한 결과 비만인은 사람은 그렇지 않은 사람에 비하여 고혈압 유병률이 2.1배 높았으며 비만한 성인의 39.2%(남성)와 40.8%(여성)가 고혈압을 가지고 있었다."], ["p", "특히 19∼39세의 젊은 성인에서는 비만 시 고혈압 유병률이 비만하지 않은 경우보다 5.1배 높아, 비만과 고혈압의 연관성이 젊은 연령층에서 더욱 뚜렷하게 나타났다."], ["p", "해외 대규모 메타분석(meta-analysis) 및 코호트 연구(cohort study) 에서도 체질량지수 증가 뿐 아니라 복부 비만, 체지방률 증가가 고혈압 발생 위험을 선형적으로 증가시키는 독립적 위험요인임이 반복적으로 보고되었다. 특히 대사적으로 건강해 보이는 비만(Metabolically Healthy Obesity)도 시간이 지남에 따라 고혈압 발생 위험이 증가함이 밝혀져, 비만 그 자체가 고혈압의 주요 선행 요인임이 강조되고 있다. 이러한 경향은 국내 연구에서도 일관되게 관찰되었다. 국민건강영양조사를 이용한 분석과 전향적 코호트 연구에서, 일반 비만(체질량지수 기준), 복부 비만(허리 둘레 기준), 체지방률 증가는 모두 고혈압 발생 위험 증가와 밀접한 관련성을 보였다. 특히 정상 체중이라 하더라도 체지방률 또는 복부지방이 높은 경우 고혈압 발생 위험이 증가하였으며, 대사적으로 건강한 비만 또한 고혈압 발생 위험이 유의하게 높았다. 이는 고혈압의 예방과 관리에서 비만의 다양한 지표를 통합적으로 평가하고 관리할 필요가 있음을 보여준다."], ["p", "7. 심혈관질환 위험 점수 고혈압환자의 심혈관질환 예방을 위해 위험요인 평가는 매우 중요하다. 다만, 사용되는 위험요인 및 위험도 평가 방법은 진료 지침에 따라 차이가 존재한다. <표 4>는 심혈관위험도 평가에 사용되는 대표적인 심혈관위험점수(Cardiovascular Risk Score)들을 비교한 것이다."], ["p", "미국에서는 AHA Risk Assessment Work Group이 개발한 Pooled Cohort Equations(PCE) 이 고혈압, 이상지질혈증 및 심혈관질환 예방 지침 등에서 장기간 표준 위험도 평가 도구로 활용되어 왔다. 그러나 2023년 AHA는 새로운 위험도 예측 모델인 Predicting Risk of Cardiovascular Disease Events(PREVENT) 공식을 발표하였으며, AHA/ACC 2025 고혈압 지침부터는 PREVENT 위험 점수의 사용을 권고하고 있다."], ["p", "유럽의 고혈압 진료지침에서는 다양한 심혈관위험도 평가 도구가 언급되지만, 가장 널리 권고되는 것은 Systematic COronary Risk Estimation(SCORE) system이다. SCORE는 유럽 12개 코호트 약 20만 명의 자료를 기반으로 개 발되었으며, 유럽 국가들을 심혈관질환 위험도 수준에 따라 네 개 그룹으로 구분하여 각 그룹에 특화된 모델을 제시한다는 점 에서 유럽 진료지침에서 선호된다. 다만 SCORE는 심혈관질환 사망(fatal cardiovascular disease, fatal CVD) 위험만을 추정하는 제한점이 있다. 이러한 단점을 보완하기 위해 2021년 발표된 SCORE2는 심혈관질환 발생 및 사망(fatal and non-fatal CVD) 및 사망 위험을 모두 추정할 수 있도록 확장되었으며, 70세 이상 고령자를 위한 별도 도구인 SCORE2-Older Person(SCORE2-OP)이 개발되어 해당 연령대에서 활용되고 있다. 이후 개정된 유럽 고혈압 진료지침들은 SCORE2와 SCORE2-OP 사용을 권고하고 있다,5."], ["p", "아울러 기존 SCORE2가 아시아 인구에서 심혈관위험을 과대추정하는 문제를 보완하기 위해, 최근 아시아태평양 지역 데이터를 활용해 재보정한 SCORE2-Asia Pacific(SCORE2-AP) 이 개발되었다. 이 모델 개발과 검증에는 우리나라 건강보험 빅데이터를 포함한 11개국 자료가 활용되었으며, 아시아 지역에서의 활용 가능성을 높인 중요한 진전으로 평가된다."], ["cap", "표 4. 주요 심혈관질환 위험 점수의 비교 46-50"], ["p", "Estimated glomerular filtration rate PCE, Pooled Cohort Equations; PREVENT, Predicting Risk of Cardiovascular Disease Events; SCORE, Systematic COronary Risk Evaluation; SCORE-2 OP, Systematic COronary Risk Evaluation-Older Person; SCORE-2-AP, Systematic COronary Risk Evaluation-Asia-Pacific 고혈압환자에서 심혈관위험점수는 특히 고혈압 전단계(prehypertension) 또는 1기 고혈압(stage 1 hypertension)과 같이 혈압이 비교적 높지 않은 환자의 약물치료 여부를 결정하는 데 중요한 역할을 한다. AHA/ACC 2025에서는 당뇨병, 만성콩팥병이 있거나 PREVENT 공식을 통해 추정한 10년 심혈관질환 위험도가 7.5% 이상인 경우를 고위험군 으로 정의한다. 이에 따라 수축기혈압 140 mmHg 미만 혹은 이완기혈압 90 mmHg 미만으로 고혈압 진단 기준 미만이더라도 고위험군에 해당되면 약물치료를 고려할 수 있다고 권고한 바 있다. ESH 2023 또한 high-normal 혈압이나 grade 1 고혈압환자에서 위험도 평가 결과를 바탕으로 약물치료 여부와 시작 시점을 결정하도록 권고한다. ESC 2024는 elevated BP 환자에서 SCORE2 또는 SCORE2-OP로 추정한 10년 심혈관질환 위험이 10% 이상일 경우 생활요법에 더해 약물치료를 추가할 수 있다고 권고한다."], ["p", "우리나라는 연령 표준화 심혈관질환 발생률이 매우 낮기 때문에, 고혈압환자의 치료 방침 결정에 심혈관위험점수에만 의존할 경우 적극적인 혈압 조절이 필요한 고위험군을 놓칠 우려가 있다. 약물치료의 시작 시기와 강도는 환자의 혈압 수준, 고혈압으로 인한 장기 손상(hypertension-mediated organ damage, HMOD), 임상적 심혈관질환, 동반질환 (comorbidities) 등 다양한 요소를 우선적으로 고려하여 결정해야 한다-5,8. 또한 심혈관위험도 점수는 연령에 크게 의존하므로, 이를 단독 기준으로 적용할 경우 특히 젊은 고혈압환자에서 필요한 예방 전략과 적극적 혈압 조절이 간과될 우려가 있다. 따라서 심혈관질환 위험 점수는 중요한 참고 지표이지만, 반드시 임상적 맥락 및 개별 환자의 특성과 함께 종합적으로 고려되어야 한다. 향후에는 국내 대규모 코호트와 국가 단위 자료의 연계를 통해 대표성 높은 위험 예측 모델을 개발하고, 외부 검증을 수행하며, PREVENT 및 SCORE2-AP와 같은 최신 국제 모델과의 비교 연구가 필요하다."], ["h", "8.1. 고혈압의 선별 검사와 진단"], ["h", "8.1.1. 고혈압의 선별 검사"], ["p", "고혈압 진단을 받지 않은 모든 성인은 고혈압 여부를 확인하기 위해 정기적인 선별 검사가 권장된다<그림 7>. 혈압이 높을수록 심뇌혈관질환 및 사망 위험이 증가하며, 약물치료 및 비약물치료를 통해 혈압을 조절하면 이러한 위험을 감소시킬 수 있으므로 고혈압 선별 검사의 중요성이 강조된다. 비록 고혈압 선별 검사의 효과를 직접 평가한 무작위 대조시험은 부족하지만, 다수의 관찰연구에서 조기 발견과 치료가 심뇌혈관질환 위험을 낮춘다는 근거가 제시되었다. 또한, 캐나다의 지역사회 기반 클러스터 무작위대조시험에서는, 약국 기반 고혈압 선별 검사가 65세 이상 노인의 심혈관질환 입원을 9% 감소시킨 것으로 보고되었다. 선별 검사로 인한 중대한 위해나 삶의 질 저하, 심리적으로 부정적 영향은 보고되지 않았으며, 이에 따라 진료실혈압 측정을 기반으로 한 고혈압 선별 검사는 이득이 위해를 크게 상회하여 권고된다."], ["p", "고혈압 선별 검사 주기에 대한 근거는 충분하지 않으나, 혈압 측정은 위해가 거의 없고, 비용도 낮아 많은 국가에서는 비용-효과 분석보다는 그 나라의 의료 환경과 건강검진 인프라를 고려하여 주기를 결정한다. 국내의 경우 국민 건강보험공단에서 20세이상 성인을 대상으로 2년 주기의 일반건강검진을 시행하고 있으며, 민간건강검진도 활발히 이루어지고 있어 2년 주기 측정이 적절하며, 고위험군에서는 더 짧은 간격으로 측정하는 것이 권장된다. 미국질병예방 서비스위원회(US Preventive Services Task Force)는 40세 이상 성인 및 고위험군(흑인, 고혈압 전단계, 과체중/ 비 만 등)에 대해 고혈압 선별 검사를 받을 것을 권고하고 있다. 이러한 근거를 바탕으로 대한고혈압학회는 일반 성인은 2 년 주기, 고위험군은 1년 주기로 진료실혈압 측정을 통한 고혈압 선별 검사를 권고한다<그림 7>."], ["cap", "그림 7. 고혈압의 선별 검사와 진단"], ["h", "8.1.2. 고혈압의 진단"], ["p", "고혈압의 진단, 치료, 예후 평가에 있어서 가장 기본이 되는 요소는 정확한 혈압 측정이다. 혈압은 측정 환경, 측정 기기, 측정자의 술기 등 다양한 요인에 의해 변동될 수 있으므로, 혈압 측정 결과 고혈압이 의심되는 경우에는 재방문하여 표준화된 방법으로 진료실혈압을 반복 측정하거나<그림 7>, 24시간 활동혈압 측정(ambulatory blood pressure monitoring) 또는 가정혈압 측정(home blood pressure monitoring)과 같은 진료실 밖 혈압(out-of- office blood pressure)을 추가적으로 측정하여 고혈압을 진단하고 분류할 수 있다-5,71,72<그림 7>."], ["h", "8.2. 혈압 측정 기기와 기기의 검증"], ["h", "8.2.1. 혈압 측정 기기"]], "1": [["p", "진료실혈압, 활동혈압, 및 가정혈압 측정에는 현재 커프형 혈압계(cuff-type blood pressure monitor)가 표준으로 권고되나, 커프(cuff, 공기압박대) 가압으로 인한 불편감이 보고되고 있다. 이러한 제한점을 보완하기 위해 최근에는 커프 가압 없이, 다양한 환경에서 연속적으로 혈압을 측정할 수 있으며 사용이 간편한 커프리스 혈압계(무커프 혈압계, cuffless blood pressure monitor)가 개발되어 활용되고 있다. 커프리스 혈압계는 기기별로 정확도에 차이가 있으나, 일부 기기는 활동혈압 측정에 준하는 정도의 정확도를 보여 임상적 활용 가능성을 제시하고 있다. 그러나, 임상 적용을 위해서는 커프리스 혈압계의 정확도에 대한 엄격한 검증과 더불어, 혈압 측정 결과의 임상적 해석을 위한 표준화된 지침이 필요하다."], ["h", "8.2.1.1 커프형 혈압계"], ["p", "수동혈압계는 측정자가 커프를 빠르게 가압 후 일정 속도로 감압하면서 청진기를 이용해 코로트코프음(Korotkoff sound)을 청취하여 혈압을 측정하는 방식이다. 대표적으로 수은혈압계가 있으나, 수은의 독성 문제로 사용이 중단 되었으며, 이에 따라 검증된 무수은혈압계(mercury-free sphygmomanometer) 사용이 권고된다,90,91."], ["p", "무수은혈압계는 측정 방식에 따라서 무수은수동(청진형)혈압계[mercury-free manual(auscultatory) blood pressure monitor]와 자동전자식혈압계[automated(electronic) blood pressure monitor]로 구분된다. 무수은수동(청진형) 혈압계는 커프의 압력 변화에 따라 지침이 움직이는 아네로이드(aneroid)혈압계와 수은주 대신 전자식 압력계를 이용해 혈압을 표시하는 하이브리드혈압계(hybrid, 전자식청진형혈압계)으로 나뉜다. 이들은 수은혈압계와 유사하게 측정자 오류 가능성이 있으나, 눈높이 차이로 인한 혈압값 오차는 제한적이다. 아네로이드혈압계는 정확한 측정을 위해 정기적인 정도 관리가 필수적이다."], ["p", "자동(전자식)혈압계는 버튼 조작만으로 자동 가압과 감압이 이루어지면서 혈압이 측정되고, 측정결과가 숫자로 표시된다. 자동혈압계는 사용이 간편하고, 측정자에 의한 오류가 적으며, 반복 측정이 가능하다는 장점이 있다. 측정 방식에 따라 진동법 자동혈압계(oscillometric automated blood pressure device)와 청진법자동혈압계(auscultatory blood pressure device)로 분류된다."], ["p", "진동법자동혈압계는 커프 내 혈관 진동(oscillation)을 센서로 감지해 평균혈압을 산출하고, 알고리즘을 통해 수축기 혈압과 이완기혈압을 계산한다. 고령자, 소아, 임신부, 부정맥 환자, 팔둘레가 매우 두껍거나 얇은 경우, 동맥경직도가 증가한 경우에는 정확도가 저하될 수 있다. 청진법자동혈압계는 자동 가압과 감압 과정에서 내장된 전자 청진기로 코로트코프음을 감지하고, 이 신호를 혈관 진동 신호와 함께 분석하여 혈압을 산출한다. 이 방식은 코로트코프음과 진동 신호를 시각화함으로써 혈압 측정 시 부정맥 여부를 확인할 수 있는 장점을 가진다."], ["cap", "그림 8. 커프형 혈압계의 분류"], ["h", "8.2.1.2. 커프리스(무커프) 혈압계"], ["p", "커프리스 혈압계는 커프 없이 혈압을 측정하는 기술로, 맥파전도시간(pulse transit time, PTT)과, 광혈류측정센서 (photoplethysmography)을 이용한 맥파속도(pulse wave velocity) 및 맥파형태분석(pulse wave analysis) 또는 손가락의 혈류량 변화를 기반으로 알고리즘을 적용해 혈압을 추정하는 방식 등이 사용된다. 이러한 기술은 간헐적 또는 연속적 측정을 가능하게 하며, 스마트워치(smart watch)나 반지형 혈압계(ring-type blood pressure monitor) 등 다양한 형태로 상용화되고 있다. 일부 기기는 미국 식품의약국(Food and Drug Administration, FDA) 및 유럽연합(European Union, EU)에서 의료기기 승인을 받았으며 [CE 마크, Conformité Européenne mark (CE mark)], 일부 기기는 주간 활동혈압 측정값과 유사한 정확도를 보이기도 했다. 이 중 측정 정확도는 기기 종류에 따라, 또 연구마다 차이를 보여 기기별 추가적인 임상적 검증이 필요하다."], ["p", "커프리스 혈압계는 커프 가압에 따른 불편감이 없고, 일상생활이나 수면 중에도 연속 측정이 가능하여 사용자 편의성이 높으며, 혈압 변동성에 대한 정밀하고 객관적인 정보를 제공할 잠재력을 가진다. 또한 자가 측정의 용이성을 통해 고혈압의 인지율 및 치료율 향상에 기여할 수 있으나, 이를 뒷받침할 과학적 근거는 아직 충분하지 않다."], ["p", "따라서, 향후에는 커프리스 혈압계의 정확도 검증, 보정 방법(calibration), 적용 기술 및 데이터 분석 절차, 임상적 적용 방식, 결과의 해석 등에 대한 표준 지침이 필요하다."], ["h", "8.2.2. 혈압계의 검증"], ["p", "커프형 혈압계의 경우, 정확한 혈압 측정을 위해 각 기기별 표준화된 지침에 따른 임상적 검증(validation)을 거친 기기 사용을 권고한다-5. 특히 자동혈압계 혈압 산출에 사용되는 알고리즘이 제조사 고유 기술로 외부에 공개되지 않기 때문에, 그 정확성과 신뢰성에 대한 독립적인 검증이 필요하다."], ["p", "국제적으로는 다양한 혈압계 검증 프로토콜이 존재하며, 대부분 수은혈압계를 표준기기(standard or reference device)로 삼아 시험용 혈압계(test device)의 정확도를 평가해왔다. 최근에는 국제적 합의를 바탕으로 통일된 검증 프로토콜(Universal Protocol of Validation of Blood pressure Device, 2018)이 제시되었으며, 이 프로토콜에서는 수은혈압계뿐 아니라 수은혈압계 대비 ±1 mmHg 이내의 혈압값 오차를 보이는 무수은청진법 혈압계도 표준기기로 인정하고 있다. 또한 표준기기와 평균 오차 ≤5 mmHg, 표준편차 ≤8 mmHg를 만족하는 시험용 혈압계를 ‘검증된 기기(validated device)`로 정의하였고, 3세 미만 소아, 임산부, 팔둘레 ≥ 42cm, 심방세동 환자와 같은 특수 집단을 위한 별도의 검증 기준도 제시하였다."], ["p", "그러나 이러한 검증 프로토콜에 따른 임상적 정확도 평가가 법적 의무는 아니므로, 임상 현장에서 검증되지 않은 혈압계의 사용 사례가 보고되고 있다. 이에 따라, 사용 중인 혈압계의 공인된 검증 여부를 확인하는 것이 중요하다."], ["p", "국제적으로 STRIDE BP(https://www.stridebp.org/), Medaval(https://medaval.ie/), Dabl Educational Trust (http://www.dableducational.org/) 등에서 검증된 기기 목록을 제공하고 있으며, 일부 지역 거점 기관(reginal site) 에서도 검증된 기기 목록을 제공한다. 다만, 기관별로 적용하는 검증 프로토콜이 상이하여 이들 기관에서 제시하는 검증 기기 목록은 차이가 있다."], ["p", "커프리스 혈압계 역시 임상적 정확도 검증이 필요하며, 일부 기기에서는 정확성이 입증된 바 있다. 하지만, 현재 까지 커프리스 혈압계에 대한 국제적으로 통일된 검증 기준은 마련되어 있지 않으며, 정적 상태뿐 아니라 동적 상태에서의 정확도 평가를 포함하는 이상적인 검증 절차가 요구된다."], ["h", "8.3. 진료실혈압 측정"]], "2": [["h", "8.3.1. 표준 혈압 측정법"], ["p", "진료실혈압을 정확하게 측정하기 위해서는 검증된 기기를 사용하고 표준화된 측정법을 준수해야 한다<그림 9>. 혈압 측정은 다양한 요인에 의해 오류가 발생할 수 있으므로, 이러한 요소들을 충분히 고려하는 것이 중요하다."], ["p", "혈압 측정 시에는 등받이가 있는 의자에 앉아 5분간 안정을 취한 후, 검증된 위팔용 혈압계를 사용하여 커프를 심장 높이에 맞추어 측정한다, 커프가 심장보다 낮게 위치하면 혈압이 과대 측정될 수 있다. 또한 측정 대상자의 팔둘레에 적절한 크기의 커프를 사용하는 것이 중요하며, 팔둘레보다 작은 커프를 사용할 경우 혈압이 과대 측정될 수 있다. 청진법 혈압계는 상완 둘레의 75-100% 길이와, 37-50% 너비를 갖는 커프를 사용해야 하며, 자동혈압계는 제조사에서 권장하는 커프 크기를 따라야 한다. 혈압은 최소 30초 간격으로 2회 이상 반복 측정 후 평균값을 기록하는 것이 권장된다."], ["p", "청진법 혈압계를 사용할 경우, 커프 아래에 청진기의 종부분을 위치시키고 초당 2 mmHg의 속도로 감압한다. 감압 속도가 빠르면 수축기혈압은 과소 평가되고, 이완기혈압은 과대 평가될 수 있다. 일반적으로 코로트코프 제1기 음을 수축기혈압으로, 제5기 음을 이완기혈압으로 판독하나, 임신, 동정맥 단락, 대동맥판 역류 등 제 5음을 들을 수 없는 경우에서는 코로트코프 제4기 음을 이완기혈압으로 판독한다."], ["p", "최초 혈압 측정 시에는 양측 팔에서 측정하여 차이를 확인하고, 이후에는 수치가 더 높은 혈압이 측정된 팔에서 측정하여 고혈압을 진단한다. 양팔동시측정이 순차적 혈압 측정보다 혈압 차이가 적게 나타날 수 있지만, 순차적 측정에서 유의한 차이가 없다면 양팔 혈압 차이는 없다고 간주할 수 있다. 지속적으로 수축기혈압이 10 mmHg 이 상의 차이를 보이는 경우는 심혈관질환 위험 증가와 관련되며, 20 mmHg 이상일 경우, 대동맥 축착 (coactation of aorta)이나 위팔동맥(upper extremity artery, 상지동맥)의 죽상동맥경화증질환등을 의심해야 한다."], ["p", "또한, 동정맥루나 액와부림프 절제술을 시행한 팔에서는 혈압 측정을 피해야 한다."], ["p", "위팔에 기형이나 위팔동맥협착(upper extremity artery stenosis)이 의심되어 위팔 혈압 측정이 어려운 경우, 다리 혈압을 측정해야 한다. 다리 혈압 측정 방법은 국제적으로 통일된 권고는 없으나, 일부 지침에서는 누운 자세에서 발목에 커프를 감고 검증된 자동혈압계를 이용해 발목 혈압 측정을 제시하며, 청진법은 측정이 어려워 권장되지 않는다. 일반적으로 발목 혈압은 위팔의 혈압보다 높고, 발목 혈압의 고혈압 진단 기준은 명확하지 않으나, 일부 연구에서는 발목 혈압이 연령에 따라 증가하고, 남성이 여성보다 높다고 보고하였다."], ["cap", "그림 9. 올바른 진료실혈압측정"], ["h", "8.3.2. 특별 상황에서의 혈압 측정"], ["h", "8.3.2.1. 심방세동 환자의 혈압측정"], ["p", "심방세동 환자는 박동 간 혈압 변동성이 크기 때문에 자동혈압계로 측정할 경우 정확도가 저하될 수 있다. 따라서 청진법혈압계를 이용하여 혈압을 3회 이상 반복 측정한 후 평균값을 사용하는 것이 권고된다. 최근에는 심방세동 감지 기능이 탑재된 자동혈압계가 개발되어 혈압 측정 중 부정맥 감지에 대한 높은 민감도와 특이도를 보이는 것으로 보고되었으나, 이들의 혈압값 정확도에 대한 연구가 필요하며, 안정 시 심박수 및 부정맥 확인을 위해 혈압 측정 시, 맥박을 함께 측정하는 것이 권고된다."], ["h", "8.3.2.2. 기립성 저혈압 환자의 혈압 측정"], ["p", "기립성 저혈압을 진단하기 위한 혈압 측정 방법은 지침 마다 다소 차이가 있으나,144, 본 지침에서는 ESC 2024를 준용하여 기립 후 1분과 3분에 혈압을 측정하고, 수축기혈압이 20 mmHg 이상 또는 이완기혈압이 10 mmHg 이상 감소하는 경우를 기립성 저혈압으로 정의한다."], ["h", "8.3.2.3. 임신부의 혈압 측정"], ["p", "임신부의 혈압은 임신기간에 따라 변동하며, 일반적으로 임신 중기에 가장 낮아졌다가 임신 말기로 갈수록 점차 상승하는 경향을 보인다. 임신 중 혈압 측정 시 자동혈압계는 실제 혈압을 과소평가할 수 있으며, 특히 중증 임신 중독증 환자에서는 측정 신뢰도가 저하될 가능성이 있다. 현재 임신 및 전자간증 상태에서 임상적으로 검증된 진료실용 혈압계는 제한적이다."], ["h", "8.3.3. 진료실자동혈압 측정"], ["p", "진료실자동혈압(automated office blood pressure, AOBP)은 의료진의 개입 없이 별도 공간에서, 자동혈압계를 사용하여, 사전 설정된 간격과 횟수(예: 5분간 휴식 후 1분 간격으로 3회 측정)에 따라 혈압을 측정하고, 그 평균값을 활용하는 방식이다. 측정 조건은 연구마다 다소 차이가 있으나, 백의 효과(white-coat effect)를 감소시키는 데 도움이 되는 것으로 알려져 있다. 다만 백의 효과를 완전히 배제할 수는 없으며, 가면고혈압의 진단에는 제한이 있어, 가정혈압 측정이나 활동혈압 측정이 어려운 경우에 대안으로 활용될 수 있다."], ["p", "진료실자동혈압의 진단 기준은 가정혈압 또는 주간활동혈압의 기준과 동일하게 적용된다. 항고혈압제를 복용 중인 환자에서 진료실자동혈압으로 측정한 수축기혈압이 130 mmHg 미만인 경우, 진료실자동혈압이 주간활동 혈압보다 오히려 더 낮게 측정될 수 있다는 보고도 있다."], ["h", "8.4. 진료실 밖 혈압 측정"], ["p", "진료실 밖 혈압 측정에는 활동혈압 측정과 가정혈압 측정이 있으며, 이 중 활동혈압 측정은 24시간 동안의 혈압 변화를 종합적으로 평가할 수 있어 고혈압의 진단과 치료 결정에 유용하다. 최근에는 커프리스 혈압계를 이용한 활동혈압 측정 결과가 기존 커프형 활동혈압 측정 값과 유사한 정확도를 보였다는 보고가 있으며, 이 중 반지형 혈압계는 국내에서 보험 적용을 받아 임상에 도입되었다. 다만, 커프리스 혈압계의 임상적 유용성과 정확성, 결과의 해석에 대해서는 추가적인 검증이 필요하다. 가정혈압 측정은 자동혈압계를 이용하여 간편하게 반복 측정할 수 있으며, 상담에 활용함으로써 환자의 치료 지속성 향상과 고혈압 조절률 개선에 기여하는 것으로 알려져 있다."], ["p", "진료실 밖 혈압은 진료실혈압보다 심혈관질환의 예후를 더 잘 반영하는 것으로 알려져 있으나, 실제 임상 적용 시에는 활동혈압 측정과 가정혈압 측정 간에 차이가 발생할 수 있다. 이러한 혈압 차이가 관찰되는 경우 최적의 진단 및 치료 전략을 도출하기 위해서는 추가 연구가 필요하다."], ["h", "8.4.1. 활동혈압 측정"]], "3": [["p", "커프형 혈압계를 이용한 활동혈압 측정은 진료실 밖 환경에서 24시간동안 반복 측정을 통해, 일일평균혈압, 주간평균혈압, 야간평균혈압, 아침평균혈압 등 시간대별 혈압을 제공하여 혈압의 일중 변화와 혈압 변동성을 종합적으로 평가할 수 있는 방법이다. 이러한 특성으로 인해 고혈압의 초기 진단에서는 가정혈압 측정보다 우선적으로 고려되지만, 장기 추적관찰에는 적합하지 않은 것으로 알려져 있다. 활동혈압의 측정 방법, 측정 전 주의사항, 결과 분석 및 고혈압 기준은 <그림 10>에 제시하였다."], ["p", "활동혈압 측정은 수면장애, 통증, 불안감, 멍, 피부 자극 등의 경미한 부작용을 유발할 수 있는 것으로 보고되었다. 주요 적응증은 <표 5>에 제시하였다. 또한 활동혈압 측정은 개인별 혈압 수치와 dipping 상태 재현성이 제한적이라는 보고가 있다."], ["cap", "그림 10. 활동혈압 측정"], ["cap", "표 5. 활동혈압 측정의 적응증"], ["h", "8.4.2. 가정혈압 측정"]], "4": [["p", "가정혈압 측정은 사용이 간편하고, 반복 측정 및 장기적 혈압 추적이 가능하며, 비용 측면에서도 경제적이라는 장점이 있다. 그러나, 의료진의 감독 없이 환자 스스로 측정해야 하므로, 정확한 측정을 위해 표준화된 방법의 준수가 필수적이며, 이를 위해 모든 환자에게 올바른 측정법에 대한 교육이 필요하다.(http://www.koreanhypertension.org/sense/family). 가정혈압 측정에는 검증된 위팔 자동혈압계 사용이 권장된다. 손목혈압계는 심장 높이를 정확히 맞추지 않을 경우 오차가 크기 때문에 일반적으로 권장되지 않으나, 비만 등으로 위팔둘레가 매우 클 경우 예외적으로 검증된 손목혈압계를 사용할 수 있다."], ["p", "올바르게 가정혈압을 측정하기 위해서는, 5분간 안정을 취한 뒤 앉은 자세에서 시행하며, 팔둘레에 적합한 크기의 커프를 심장 높이에 맞추어 착용한 후 자동혈압계를 이용해 측정한다. 올바른 가정혈압 측정 방법은 <그림 11>에 제시하였다,72,156,157."], ["p", "가정혈압은 고혈압, 백의고혈압 및 가면고혈압의 진단에 유용하며, 치료 중 백의비조절고혈압, 가면비조절고혈압 및 난치성 (혹은 저항성) 고혈압 평가에도 활용된다. 이를 통해 혈압 조절 상태를 보다 정확하게 정확하게 파악하고, 환자와의 상담을 통해, 치료 전략을 최적화할 수 있으며, 환자의 치료 지속성을 향상시켜 고혈압 조절률 개선에 기여한다. 또한 가정혈압 은 진료실혈압보다 심혈관질환 예후를 더 잘 예측하는 것으로 알려져 있으며, 의료 경제적 측면에서도 효과적인 관리 수단 으로 평가된다. 이러한 근거를 바탕으로, 가정혈압 측정은 고혈압의 진단뿐 아니라 치료 및 장기 관리 전반에서 중요한 역할을 수행한다."], ["p", "다만, 가정혈압은 진동법자동혈압계를 사용하므로, 부정맥 환자나, 임신부에서는 정확도가 떨어지고, 수면 중 혈압 측정에는 한계가 있다. 최근에는 부정맥 감지 기능을 탑재한 자동혈압계가 시판되고 있으며, 혈압 측정 중 부정맥 감지율은 비교적 높은 것으로 보고되었다. 일반적으로 가정혈압은 진료실혈압보다 더 낮게 나타나므로 가정혈압 측정에서는 수축기혈압 135 mmHg 이상 또는 이완기혈압 85 mmHg 이상을 고혈압으로 정의한다<그림 11>."], ["cap", "그림 11. 가정혈압 측정"], ["h", "8.4.3. 활동혈압 측정과 가정혈압 측정의 비교"], ["p", "활동혈압 측정은 24시간 동안 반복 측정이 가능하여 혈압의 일중 변동과 야간고혈압의 진단, 단기 혈압 변동성 평가에 유용하다. 그러나 측정 과정에서 수면 방해 등의 불편감이 발생할 수 있으며, 반복적•장기적 시행에는 제약이 있다. 반면 가정혈압은 측정이 간편하고 편안한 환경에서 장기간 반복 측정이 가능하여 장기적인 혈압 변동성을 평가하는데 적합하다. 그러나 의료진의 감독 없이 환자 스스로 측정해야 하므로 측정 방법의 오류 가능성이 존재하며, 혈압의 일중 변동 및 야간고혈압 평가에는 한계가 있다. 활동혈압 측정과 가정혈압 측정의 비교는 <표 6>에 정리하였다."], ["cap", "표 6. 활동혈압 측정과 가정혈압 측정의 비교"], ["h", "8.4.4. Dipping 패턴"], ["p", "활동혈압 측정을 통해 혈압의 일중 변동(circadian rhythm)를 확인할 수 있으며, 이를 기반으로 혈압 패턴은 dipper, non-dipper, reverse dipper, extreme dipper의 네 가지 유형으로 분류된다. Dipper 패턴은 정상적인 일중 혈압 변동을 반영하며, 야간 수면 중 혈압이 주간 대비 10~20% 감소하는 경우를 의미한다. Non-dipper는 야간 혈압 감소폭이 10% 미만 감소인 경우, reverse dipper는 야간 혈압이 오히려 상승하는 경우, extreme dipper는 야간 혈압이 20% 이상 과도하게 감소하는 경우로 정의한다. 이러한 dipping 패턴은 개인 간 차이 및 일간 변동성이 커 재현성이 낮은 것으로 알려져 있다."], ["p", "Non-dipper 패턴은 자율신경계이상, 수분 및 나트륨 조절의 장애 등 다양한 병태생리적인 기전과 연관되며, dipper 패턴에 비해 좌심실 비대, 심근 허혈, 사망률이 더 높게 보고되었다. Reverse dipper 패턴은 자율신경장애, 당뇨병, 만성콩팥병, 수면무호흡증, 난치성(혹은 저항성) 고혈압, 이차성 고혈압, 전자간증 등과 관련되며, 좌심실 비대, 관상동맥 석회화, 동맥경직도 증가, 심부전, 심혈관 사건, 사망률의 증가와도 연관된 것으로 알려져 있다. Extreme dipper 패턴은 허혈성 뇌졸중 및 동맥경화의 위험 증가와 관련성이 보고되었으나, 불량한 임상 예후와의 명확한 연관성을 뒷받침하는 근거는 제한적이며, 향후 추가 연구가 필요하다."], ["h", "8.4.5. 혈압 변동성"], ["p", "혈압 변동성(blood pressure variability)은 시간의 경과에 따라 혈압이 지속적으로 변동하는 현상을 의미하며, 이는 환경•정서•신체적 요인과 같은 외부 요인뿐 아니라 자율신경계 기능 및 호르몬 조절과 같은 내부 심혈관 조절 기전의 복잡한 상호작용에 의해 발생한다. 정상 생리 상태에서 혈압 변동은 체내 항상성 유지와 장기 관류를(organ perfusion) 를 보장하는데 중요한 역할을 하지만, 변동성이 지속적으로 증가할 경우 심혈관계 합병증의 위험을 높일 수 있다."], ["p", "혈압 변동성은 관찰 기간에 따라 매우 단기(수초~수분, very short-term) 단기(수분~수시간, short-term), 중기(수일~수주, mid-term), 장기(수개월~수년, long-term) 변동성으로 구분된다. 단기 변동성은 활동혈압 측정을 통해, 중기 및 장기 변동성은 가정혈압 측정이나 진료실혈압 측정을 통해 평가할 수 있다. 그러나 혈압 변동성은 측정 지표가 다양하고 표준화가 되어 있지 않으며, 심혈관계 위험도를 예측할 수 있는 명확한 기준도 합의되지 않은 상태이다. 일부 연구에서는 전체 사망률 및 심혈관계 사망률의 증가와 더불어 심혈관질환 발생 위험을 높이는 것으로 보고되었으나, 혈압 변동성의 감소가 실제로 심혈관계 질환 발생에 미치는 영향을 입증하는 무작위대조시험 근거는 부족하다. 따라서, 현 시점에서 혈압 변동성의 임상적 활용은 제한적이다."], ["h", "8.5. 중심동맥압 측정"], ["p", "중심동맥압(central blood pressure)은 다양한 방법으로 측정할 수 있으며, 위팔동맥압(brachial blood pressure)과 약 80% 정도의 상관관계를 보인다. 중심동맥압이 위팔동맥압보다 표적장기 손상(target organ damage)이나 임상 예후와 더 강한 연관성을 보이는 경우도 있어, 두 혈압 간 차이가 큰 환자에서는 중심동맥압 측정이 유용할 수 있다. 그러나, 고혈압 치료 지표로서 중심동맥압이 위팔동맥압보다 우월하다는 근거는 아직 충분하지 않으며, 현재로서는 일반적으 로 우선적 지표로 사용되지는 않는다."], ["h", "8.6. 대응 혈압과 혈압 측정 방법에 따른 고혈압의 진단 기준"], ["p", "대응 혈압(corresponding blood pressure)은 심혈관질환 발생 위험도가 진료실혈압과 유사한 수준으로 나타나는 진료실 밖 혈압 값을 의미한다. 코호트 연구 또는 무작위대조시험을 기반으로 활동혈압 및 가정혈압에 대한 대응 혈압 기준이 제시되어 있으며, 측정방법별 고혈압의 진단 기준은 <표 7>에 정리하였다. 고혈압의 진단과 치료에는 동일한 대응 혈압 값을 적용하며, 수축기혈압 수준에 따른 대응 혈압 값은 <표 8>에 제시하였다."], ["p", "진료실혈압이 130 mmHg 이하인 경우, 평균적으로 주간활동혈압과 가정혈압은 거의 유사한 경향을 보이나, 개별 환자에서는 이 범위에서도 백의 효과 또는 가면효과(masked effect)가 존재할 수 있다. 따라서 이러한 가능성을 확인하는 과정은 여전히 중요하다."], ["cap", "표 7. 혈압 측정 방법에 따른 고혈압의 진단 기준"], ["cap", "표 8. 대응 혈압"], ["p", "9. 환자의 평가 고혈압의 진단과 평가를 위해서는 1) 일차성과 이차성 고혈압을 감별하고, 2) 고혈압의 중증도를 평가하며, 3) 심뇌혈관 질환의 위험인자와 생활습관을 파악하고, 4) 심뇌혈관질환의 존재 유무와 치료에 영향을 줄 수 있는 동반질환 또는 무증상 장기 손상(asymptomatic organ damage) 유무를 종합적으로 확인해야 한다."], ["h", "9.1. 증상 및 징후"], ["p", "대부분의 고혈압환자는 혈압 상승과 직접적으로 연관된 특이적인 증상을 보이지 않는다. 많은 경우 우연한 혈압 측정에서 고혈압이 발견되거나, 고혈압성 심뇌혈관질환 증상이나 이차성 고혈압을 유발하는 기저질환과 관련된 증상으로 의료기관을 방문하게 된다."], ["p", "두통은 흔히 혈압 상승과 관련된 증상으로 인식되지만, 중증 고혈압의 경우를 제외하고는 혈압 상승과의 명확한 연관성이 입증되기 어렵다. 고혈압과 동반되는 두통은 주로 뒤통수 부위에 국한되며, 환자가 잠에서 깨어나는 이른 아침에 발생 하였다가 수시간 내 자연 소실되는 양상을 보인다. 그 밖에도 혈압 상승과 연관될 수 있는 증상으로는 어지러움, 두근거림, 피로, 성기능 장애 등이 보고된다."], ["p", "고혈압성 심뇌혈관질환(cardiovascular and cerebrovascular disease)이 발생한 경우에는 혈뇨, 시야 흐림, 일과성 뇌허혈에 의한 어지러움, 협심증에 의한 흉통, 심부전에 의한 호흡곤란 등의 증상이 나타날 수 있다. 드물게는 대동맥 박리 (aortic dissection)나 대동맥류(aortic aneurysm)에 의한 흉통이 발생하기도 한다."], ["p", "이차성 고혈압의 경우 원인 질환에 따라 특징적인 증상이 동반될 수 있다. 예를 들어, 수면무호흡증(sleep apnea) 환자에서는 아침 두통, 주간의 과도한 졸림, 우울 증상, 집중력 저하, 야간 호흡곤란 등이 나타날 수 있다. 일차성 알도스테론증 (primary aldosteronism) 환자에서는 다뇨, 다음 및 근무력감이 흔히 관찰되며, 쿠싱증후군(cushing syndrome) 환자에서는 체중 증가와 정서적 불안정이 동반될 수 있다, 크롬친화세포종(갈색세포종, pheochromocytoma) 환자에서는 발작성 두통, 두근거림, 발한 그리고 기립성 어지러움이 특징적으로 관찰될 수 있다."], ["h", "9.2. 병력"], ["p", "고혈압환자의 병력 청취 시에는 다음과 같은 사항을 체계적으로 평가하여야 한다: 1) 환자의 과거력 및 현재 병력과 가족력을 확인하다. 2) 이차성 고혈압을 시사하는 증상이나 병력을 문진한다. 3) 무증상 장기 손상을 의심할 수 있는 병력이 있는지 평가한다. 4) 심뇌혈관질환 위험인자 존재 유무를 파악한다. 5) 당뇨병, 이상지질혈증 등 동반 질환의 병력을 확인한다. 6) 식이습관, 흡연 및 음주 여부, 신체 활동과 운동량, 수면 상태, 성격 특성과 심리 상태 등 생활습관 을 확인한다. 7) 과거 고혈압의 유병 기간과 치료 여부, 치료 반응 및 부작용에 대해 확인한다. 8) 소염진통제, 경구피 임약, 한약 등 혈압에 영향을 미칠 수 있는 약물의 복용력을 확인한다. 9) 사회경제적 요인을 포함한 환경적 요인을 종합적 으로 문진한다."], ["h", "9.3. 진찰"], ["p", "고혈압환자의 평가는 체계적인 신체 진찰을 통해 이루어져야 한다. 진찰 항목으로는 1) 최초 측정에는 좌우 양팔의 혈압, 맥박수 측정, 2) 키와 몸무게 및 이를 이용한 체질량지수 및 허리둘레 측정, 3) 경동맥, 복부 및 대퇴부 잡음(bruit)의 존재 여부 청진, 4) 갑상선 촉진, 5) 심장과 폐의 진찰, 6) 콩팥 비대, 종양, 방광 팽창, 비정상적 대동맥 박동 등을 확인하기 위한 복부 진찰, 7) 하지 부종의 존재 확인과 맥박의 촉진, 8) 신경학적 검사를 시행하여야 한다."], ["p", "허리둘레는 선 자세에서 복부를 노출한 상태로 피검자가 편안하게 숨을 내쉰 시점에 갈비뼈 하연과 엉덩뼈 능선 상단의 중간 지점에서 측정한다. 이때 줄자는 피부를 압박하지 않도록 주의해야 한다."], ["h", "9.4. 검사"]], "5": [["p", "검사는 고혈압환자에서 심뇌혈관질환 위험인자, 이차성 고혈압의 가능성, 무증상 장기 손상, 그리고 동반 질환의 존재 여부를 확인하기 위하여 시행한다. 고혈압 치료를 시작 전에는 반드시 기본 검사를 수행하여야 하며, 임상적 필요에 따라 권장 검사 및 확대 검사를 추가적으로 시행한다<표 9>."], ["cap", "표 9. 고혈압의 검사"], ["p", "기본 검사 권장 검사 eGFR, estimated glomerular filtration rate; LDL, low density lipoprotein; HDL, high density lipoprotein; MMSE, Mini Mental State Examination; MoCA, Montreal Cognitive Assessment 12-유도 심전도에서 좌심실 비대, 좌각차단, 심근경색의 소견이 발견될 경우, 심뇌혈관질환의 위험도가 증가한 것으로 해석할 수 있다. 소변 검사에서 단백뇨 또는 혈뇨는 콩팥 질환을 시사하며, 요당은 당뇨병의 가능성을 시사한다. 혈색소와 적혈구 용적률 검사는 빈혈의 동반 여부를 평가하는 데 유용하다. 적혈구용적률의 증가는 혈압 상승과 관련될 수 있으나 그 상관성은 매우 낮은 것으로 알려져 있다."], ["p", "치료 전 저칼륨혈증이 발견되는 경우에는, 일차성 알도스테론증 등 미네랄코티코이드(mineralocorticoid) 과잉 상태를 의심할 수 있다. 티아지드(thiazide)나 고리작용이뇨제(loop diuretics)의 사용은 칼륨(포타슘, potassium) 및 나트륨 손실을 유발할 수 있으므로 혈중 칼륨과 나트륨 농도의 측정이 필요하다. 저칼륨혈증은 근무력감, 부정맥, 당뇨병 발생 위험 증가와 관련되며, 고칼륨혈증은 콩팥 기능 저하 또는 레닌-안지오텐신계 억제제(renin-angiotensin system inhibitor, RAS 억제제) 사용시 나타날 수 있다. 혈청 크레아티닌(creatinine)의 상승 또는 계산된 사구체 여과율(estimated glomerular filtration rate, eGFR)의 감 소(<60 ml/min/1.73m²)는 콩팥 기능 저하를 의미한다. 혈청 크레아티닌을 이용하여 신기능을 평가에 한계가 있 는 경우에는 시스타틴 C를 측정하고, 이를 이용한 사구체 여과율을 함께 평가할 것을 권고한다. 이는 근육양이 많은 젊은 환자에서 혈청 크레아티닌이 상대적으로 높게 측정되는 경우나, 근육양이 적은 노인 환자에서 콩팥 기능 장애를 진단할 데 특히 유용하다. 혈청 요산의 증가는 통풍, 콩팥 기능 장애, 비만 상태, 또는 이뇨제 사용 시 관찰될 수 있다."], ["p", "공복혈당 및 지질 검사는 각각 고혈당 및 이상지질혈증을 평가하기 위해 필요하다. 이뇨제, 베타차단제의 장기 사용은 고혈당과 이상지질혈증의 발생 위험을 증가시킬 수 있으므로, 주기적인 모니터링이 필요하다. 갑상선자극호르몬 (thyroid stimulating hormone, TSH) 검사는 갑상선기능저하증 및 갑상선기능항진증 평가에 유용하다."], ["p", "흉부 X-선에서 심장/가슴 비(cardiothoracic ratio)의 증가는 심비대를 시사하며, 폐혈관 음영의 증가 및 폐부종 소견은 심부전을 시사하며, 대동맥궁의 석회화는 동맥경화를 의미한다."], ["p", "단백뇨 검사는 요시험지 검사, 소변 단백질/크레아티닌 비 또는 알부민/크레아티닌 비로 시행할 수 있다. 이 중 민감도와 정확도를 고려할 때 소변 알부민/크레아티닌 비 검사를 권장한다. 요 검체는 아침 첫 소변이 가장 적절하나, 여의치 않을 경우 임의뇨(random urine) 검체도 사용할 수 있다. 요로 감염, 격렬한 운동, 비스테로이드성 항염증제 사용, 여성의 월경혈 등은 일시적인 알부민뇨를 유발할 수 있으므로 해석에 주의한다. 요 알부민/크레아티닌 비가 ≥30 mg/g (≥3 mg/mmol)인 경우 알부민뇨로 정의하며 >300 mg/g(>30 mg/mmol)인 경우에는 현성알부민뇨(또는 중증 알부민뇨)로 확진이 가능하다. 30 mg/g 이상 300 mg/g 미만일 경우 1개월 간격으로 2회 추적 검사를 시행하여, 이 중 1회이상에서 동일 소견이 확인되면 알부민뇨로 진단할 수 있다. 기본 검사는 치료 중에도 연 1회 이상 정기적 으로 시행할 것을 권고한다."], ["p", "고혈압의 중증도가 심하거나, 표준화된 약물치료에도 혈압 조절이 불충분한 경우, 무증상 장기 손상 평가 또는 임상적 필요에 따라 추가 검사를 고려할 수 있다. 경흉부 심초음파는 좌심실 비대 진단에 유용한 검사이다. 경동맥 내-중막 두께 측정은 측정 방법의 표준화가 부족하고 임상적인 근거가 충분하지 않아 권고되지 않는다. 반면, 경동맥 동맥경화반은 예후 예측에 유용할 수 있다. 발목-위팔 혈압 지수(ankle brachial index)는 하지동맥질환의 선별 검사로 효과적이며, 맥파전달속도(pulsed wave doppler, PWV) 측정은 가성저항성고혈압을 배제하는데 도움이 된다."], ["p", "노인 인구의 증가에 따라 인지 기능 장애의 유병률이 증가하고 있으며, 고혈압환자는 정상 혈압자에 비해 인지 기능 장애의 위험이 더 높은 것으로 보고되고 있다. 이에 따라 65세 이상 노인 고혈압환자에서는 Mini Mental State Examination(MMSE)이나 Montreal Cognitive Assessment(MoCA) 등을 활용한 인지 기능 검사를 고려할 수 있다. 검사에서 이상 소견이 확인되는 경우에는 신경과 또는 정신건강의학과 전문의에게 의뢰하여 추가 평가를 시행하는 것이 필요하다. 권장 검사 또는 확대 검사를 일정한 간격으로 반복 시행하는 것에 대한 근거는 현재로서는 충분하지 않다."], ["h", "9.5. 심뇌혈관질환 위험인자와 무증상 장기 손상"], ["p", "고혈압환자는 대부분 다른 심뇌혈관질환 위험인자를 동반하므로 혈압 조절만으로는 고혈압 관련된 전반적 위험을 충분히 감소시키기 어렵다. 심뇌혈관질환 위험도 평가를 통하여 위험도가 높거나, 장기 손상이 확인된 경우에는, 혈압이 고혈압 진단 기준 미만이라 하더라도 생활요법 등 적절한 치료 전략을 고려할 수 있다. 그러나 아직까지 고혈압 환자의 위험도 산출에 활용할 수 있는 국내 연구자료는 아직 제한적인 실정이다."], ["p", "일반적으로 <표 10>에서 제시된 바와 같이 위험도 평가에 중요한 지표로는 혈압 수치 이외에도 1) 연령, 흡연, 비만, 이상지질혈증, 혈당 상승, 조기심질환의 가족력, 당뇨병과 같은 심뇌혈관질환 위험인자와, 2) 미세알부민뇨, 좌심실 비대, 망막증, 동맥경화, 동맥경직도 증가와 같은 무증상 장 손상, 3) 뇌혈관질환, 심장 질환, 만성콩팥병, 말초혈관 질환과 같은 임상적 심뇌혈관질환 여부이다. 이러한 지표들를 종합적으로 평가하여 개별 환자의 심뇌혈관질환 위험도를 과학적으로 산출하고, 이를 치료 계획 수립에 활용하는 것은 임상적 의사 결정에 유용하다. 따라서 향후 우리나라 환자를 대상으로 한 체계적인 심뇌혈관질환 위험도 예측 연구가 필요하다."], ["cap", "표 10. 심뇌혈관질환 위험인자와 무증상 장기 손상"], ["h", "9.6. 고혈압 치료 방침 결정을 위한 심뇌혈관질환 위험도 분류"], ["p", "고혈압의 위험도 분류에 활용된 국내 Korean Medical Insurance Corporation Study(KMIC) 자료는 1) 90년대 초에 조사된 자료로 시기적 한계가 있고, 2) 연구 대상이 35~59세의 비교적 젊은 연령층에 제한되어 있으며, 3) 연구 대상자의 사회경제적 수준이 상대적으로 높아 저위험군 특성을 보이므로, 전체 인구 집단을 대표하는 고혈압의 절대 위험도 평가에는 다소 제한점이 있다."], ["p", "이에 따라 본 지침에서는 국내 인구를 대상으로 한 상대적 위험도 평가를 목적으로, 최저위험도(lowest risk group)의 2배에 해당하는 위험도를 ‘평균위험도(average risk)’로 정의하고, 평균위험도 이하의 군을 ‘최저위험군’으로 정의 하였다. 평균위험도를 초과하는 위험도를 가진 군을 ‘저위험군(low added risk group)’으로, 평균위험도의 2배를 초과하는 군을 ‘중위험군(moderate added risk group)’으로, 중위험군 기준의 2배를 초과하는 군을 ‘고위험군(high added risk group)’으로 정의하였다."], ["p", "상대적 위험도 관점에서 KMIC 자료에 따르면, 40대 최저위험군의 10년 심뇌혈관질환 발생률은 2~3%(약 2.5%)로 보고되었다. 본 지침서에서는 이를 근거로 ‘평균위험도’를 10년 발생률 5%로 간주하였다. 이에 따라 각 위험군의 10년 심뇌혈관질환 발생률은 최저위험군 <5%, 저위험군 5~10%, 중위험군은 10%~15%, 고위험군은 ≥15%(20% 이상의 최고위험군 포함)로 정의하였다. 이러한 분류는 이는 유럽 고혈압 진료지침에서 제시한 위험도 분류(최저위험군 5% 미만, 저위험군 5~15%, 중위험군 15~20%, 고위험군 ≥20%)와 개념적으로 유사하다."], ["p", "KMIC 자료에 따르면 위험인자가 전혀 없는 1기 고혈압 40대 남성의 위험도는 4.3~5.3%로 일부에서는 평균위험도를 초과하는 것으로 나타났다. 반면 여성에서는 4.0~4.9%로서 평균위험도에 약간 못 미친다. KMIC 자료는 10년을 단위로 연령을 분류하였음으로 성별 간 연령에 따른 위험도의 차이를 세밀하게 평가하는 데에는 제한이 있다. 그러나 50대에서는 여성의 위험도 역시 평균 위험도를 뚜렷이 상회하여 저위험군으로 분류할 수 있다. 이러한 제한점에도 불구하고, 본 지침에서는 이러한 결과를 근거로 하여 여성에서는 55세 이상을 위험인자로 간주하였다. 50대에서는 수축기혈압 130 mmHg 이상이면서, 흡연, 고콜레스테롤혈증이 동반된 경우 10년 심뇌혈관질환 발생 위험도가 9.8~11.0%로 보고되었다. 이에 따라 고혈압 전단계이면서 위험인자가 3개 이상인 경우에는 최소한 중위험군에 해당하는 것으로 판단할 수 있다. 또한 60대에서는 동일한 조건에서 명확히 고위험군에 포함된다."], ["p", "KHS에서 보고된 심뇌혈관질환 위험도 계산식에 따르면, 미국심장학회/심장협회의 심뇌혈관질환 위험도 계산식(백인)을 국내 인구에 적용할 경우 심뇌혈관질환 발생률을 약 20~60% 정도로 과대평가하는 것으로 나타났으며, 이러한 차이는 특히 고위험군에서 두드러졌다. KHS에서 도출된 심뇌혈관질환 위험도는 대체로 KMIC 자료의 위험도와 유사하나 KMIC 자료에 비해 대상자의 연령 범위가 높아 연령에 따른 위험도를 보다 적절히 반영하는 장점이 있다. 연령을 이용한 시뮬레이션 결과에 따르면, 65세 이상에서는 고혈압 전단계부터는 대부분 고위험군으로 분류되었다. 이에 따라 본 지침에서는 65세 이상일 경우 연령에 따른 위험도를 반영하여 연령을 위험인자 2개에 해당하는 가중치로 간주하였다. 다만 이러한 접근은 전체 인구를 대표할 수 있는 인구 집단에서 도출된 직접적인 근거가 부족하다는 제한점이 있으므로, 향 후 국내 위험도 평가에 적용 가능한 전향적 관찰 연구가 반드시 필요하다."], ["p", "본 지침에서는 혈압 수치, 심뇌혈관질환 위험인자의 개수, 무증상 장기 손상의 존재 여부, 심뇌혈관질환 병력을 종합하여 <표 11>과 같이 심뇌혈관질환 위험도를 분류하였다."], ["cap", "표 11. 고혈압 치료 방침 결정을 위한 심뇌혈관 질환 위험도 분류"], ["h", "9.7. 이차성 고혈압의 증상 및 선별 검사"]], "6": [["p", "일반적으로 이차성 고혈압에 대한 선별 검사는 다음과 같은 경우에 시행한다. 1) 연령, 병력, 신체 진찰, 고혈압의 중증 도 또는 기본 검사실 검사상 이차성 고혈압이 의심될 때, 2) 혈압이 표준화된 약물치료에 충분히 반응하지 않을 때, 3) 이전에 잘 조절되던 혈압이 뚜렷한 원인 없이 다시 상승할 때, 4) 고혈압이 갑자기 발생할 때 등이다."], ["p", "과거에는 이차성 고혈압의 유병률이 낮은 것으로 인식되었으나, 최근 연구들에 따르면 전체 고혈압환자의 10∼35%를 차지하는 것으로 보고되어 유병률이 결코 낮지 않다. 이차성 고혈압은 원인 질환에 따라 수술적 치료 또는 약물치료를 통해 완치 또는 의미 있는 혈압 호전을 기대할 수 있으므로, 적절한 선별 검사와 진단이 중요하다."], ["h", "9.7.1. 일차성 알도스테론증"]], "7": [["p", "일차성 알도스테론증은 수축기/이완기혈압이 180/110 mmHg 이상인 중증 고혈압환자에서 최대 12%에 이를 정도로 비교적 높은 빈도로 보고되고 있다. 그럼에도 불구하고 실제 임상에서 일차성 알도스테론증에 대한 선별 검사가 시행되는 비율은 2∼4%에 불과한 것으로 나타나고 있다. 또한 자발적 저칼륨혈증은 일차성 알도스테론증 환자의 약 20~50%에서만 관찰되므로, 저칼륨혈증의 병력만을 근거로 일차성 알도스테론증에 대한 선별검사 시행 여부를 국한 해서는 안된다."], ["p", "따라서 난치성(혹은 저항성) 고혈압, 부신 우연종(adrenal incidentaloma)을 동반한 고혈압, 조기 발병 고혈압(early- onset hypertension), 40세 미만에서 뇌졸중의 가족력이 있는 고혈압환자, 또는 일차성 알도스테론증의 가족력이 있는 경우 등 일차성 알도스테론증의 가능성이 높은 환자군에서는 적극적인 선별 검사가 필요하다."], ["p", "알도스테론 생성 선종(aldosterone-producing adenoma) 또는 양측 부신 과다형성(bilateral adrenal hyperplasia) 등 아형(subtype)을 구분하기 위하여 부신 종양의 크기, 위치, 악성 여부를 평가할 수 있는 부신 전산화단층촬영(adrenal computed tomography, adrenal CT)을 시행하며, 일측성 또는 양측성을 확인하기 위해 부신정맥채혈(adrenal vein sampling)를 시행할 수 있다."], ["p", "일차성 알도스테론증의 치료는 원인에 따라 달라지며, 부신 종양이 원인일 때는 종양을 제거하는 부신절제술(adrenalectomy) 을 고려한다. 반면 특발성 부신증식증(idiopathic adrenal hyperplasia)에서는 칼륨보존이뇨제(potassium sparing diuretics)를 이용한 약물치료를 통해 혈압 및 칼륨 농도를 조절한다."], ["cap", "그림 12. 일차성 알도스테론증의 진단 알고리즘"], ["h", "9.7.2. 신동맥협착증"], ["p", "신혈관성고혈압(renovascular hypertension)을 유발하는 신동맥협착증(renal artery stenosis)의 가장 흔한 원인은 죽상동맥경화증(atherosclerosis) 병변으로, 전체의 약 90%을 차지하며, 섬유근육형성이상(fibromuscular dysplasia) 은 약 10%를 차지한다. 죽상동맥경화성 신동맥협착증은 고령, 흡연, 당뇨병, 이상지질혈증 등 전통적인 심뇌혈관질환 위험인자를 동반하는 경우가 많다. 반면 섬유근육형성이상은 주로 젊은 여성에서 호발하며, 소동맥에 비죽종성(non- atherosclerotic), 비염증성의 분절적 협착(segmental stenosis)을 특징으로 하는 원인 미상의 혈관 질환이다."], ["p", "신동맥협착증에 대한 선별 검사는 임상적 의심이 있는 경우 시행한다. 복부 잡음이 청진되거나, RAS 억제제인 안지오텐신 전환효소억제제(angiotensin converting enzyme inhibitor, ACE 억제제)나 안지오텐신수용체차단제(angiotensin receptor blocker, ARB)를 사용 후 혈청 크레아티닌이 30% 이상 상승하는 경우에는 신동맥협착증에 의한 고혈압을 의심해 볼 수 있다."], ["p", "선별 검사로는 신장동맥 이중초음파검사(duplex ultrasonography), 또는 CT 혈관조영술(angiography), 자기공명혈관조영술 (Magnetic Resonance Angiography, MRA)을 시행할 수 있으며, 확진 검사로는 신장동맥조영술(renal angiography)을 시 행할 수 있다."], ["p", "죽상동맥경화증 신동맥협착증에서의 일차 치료는 약물치료이며 혈압 조절이 어렵거나, 신기능 악화, 반복적인 폐부종 등이 동반되는 선택적 환자에서 신동맥성형술(percutaneous transluminal renal angioplasty) 혹은 스텐트삽입술 (stent placement) 등을 시도해볼 수 있다. 반면 섬유근육형성 이상에 의한 신동맥협착증에서는 신동맥성형술이 최우선 치료법이다."], ["h", "9.7.3. 기타"], ["p", "고혈압 약제에 반응이 없는 발작성 중증 고혈압이 있거나 카테콜아민 과다를 시사하는 증상이 동반된 경우에는 크롬 친화세포종의 가능성을 고려해야한다. 이러한 경우 혈중 호르몬 검사(메타네프린 및 노르-메타네프린), 소변 호르몬 검사, 복부 CT, 자기공명영상촬영(Magnetic Resonance Imaging, MRI), 또는 MIBG(metaiodobenzylguanidine) 스캔을 시행한다."], ["p", "중심성 비만(central obesity)과 달 모양 얼굴(moon face), 자색 선조(purple striae) 등이 보일 경우 쿠싱증후군의 가능성이 있으므로 24시간 소변 유리코티솔(free cortisol) 및 덱사메타손억제검사(dexamethasone suppression test)를 시행한다."], ["p", "수면무호흡증도 이차성 고혈압의 주요한 원인으로 알려져 있다. 아직까지 고혈압환자에서 수면무호흡증의 선별 검사에 대한 명확한 근거가 확립되어 있지는 않지만, 비만과 난치성(혹은 저항성)고혈압환자에서 유병율이 현저히 높고, 설문조사로 선별하는 방법이 알려져 있어서 임상의의 관심이 매우 중요하다. 하지만 수면무호흡증은 이차성 고혈압의 직접적인 원인이라기 보다는 비만 등과 관련된 난치성(혹은 저항성)고혈압 등에 자주 동반되는 경우가 많다. 수면 무호흡증은 수면다원검사(polysomnography)로 확진한다<표 12>."], ["cap", "표 12. 이차성 고혈압의 임상적 적응증 및 진단"], ["p", "일차성 알도스테론증 반복적인 폐부종 콩팥실질병 크롬친화세포종 (갈색세포종) 쿠싱증후군 ARR, aldosterone-to-renin ratio; CT, computed tomography; MRA, magnetic resonance angiography, MRI, Magnetic Resonance Imaging, MIBG, metaiodobenzylguanidine 제3장 고혈압의치료 10. 고혈압의 치료 고혈압 치료의 목표는 혈압을 목표혈압 미만으로 낮춤으로써 혈압 상승으로 인한 심뇌혈관질환의 발생을 예방하고 이에 따른 사망률을 감소시키는데 있다. 이미 심뇌혈관질환이 발생한 환자에서는 혈압 조절을 통해 질환의 진행을 억제하고 재발을 예방함으로써 사망률을 낮추고 삶의 질을 향상시키는 것이 치료의 주요 목표이다."], ["p", "심뇌혈관질환의 위험이 높은 환자일수록 혈압 강하(blood pressure lowering) 치료에 따른 임상적 이득이 크다. 다수의 고혈압 임상 연구에서 수축기혈압을 약 10~20 mmHg, 이완기혈압을 약 5~10 mmHg 낮출 경우 뇌졸중 발생 위험은 30~40%, 허혈성 심질환 발생 위험은 15~20% 정도 감소하는 것으로 보고되었다."], ["p", "대부분의 임상 연구가 비교적 단기간에 걸쳐 수행되었음으로, 5년 이상 장기간 고혈압을 치료할 경우 그 임상적 이득은 연구에서 관찰된 치료 효과보다 더 클 것으로 예상된다. 고혈압 치료에 따른 심혈관질환 예방 효과는 성별이나 연령에 관계없이 일관되게 나타나며, 특히 노인의 수축기단독고혈압에서도 유사한 효과가 확인되었다. 또한 고혈압 치료는 심뇌혈관질환의 예방 전략 중 비용-효과 측면에서 가장 우수한 중재 중 하나로 평가된다."], ["h", "10.1. 고혈압의 치료 계획"], ["p", "초기 진료에서 혈압이 높게 측정된 경우에는 치료를 시작하기 전에 가급적 진료실 밖 혈압(가정혈압 또는 활동혈압)을 측정하여 고혈압의 유무를 정확히 진단하여야 한다. 진료실 밖 혈압 측정은 고혈압 진단의 정확도를 높일 뿐만 아니라, 고혈압 치료의 적정성을 평가하는데 유용하며, 치료 지속성을 향상시키는데 도움이 된다. 고혈압으로 진단된 경우에는 심뇌혈관질환의 위험인자, 동반질환, 그리고 고혈압 합병증의 유무를 체계적으로 평가해야 한다<그림 13>."], ["p", "진료실혈압만 상승된 백의고혈압환자에서도 향후 심뇌혈관질환의 발생 위험이 증가하는 것으로 알려져 있으므로, 3~6개월 간격으로 주기적인 추적 관찰이 필요하다. 약물치료의 시작 시점은 혈압 수치뿐만 아니라 심뇌혈관질환의 위험인자 및 고혈압으로 인한 장기 손상 유무를 종합적으로 고려하여 결정하여야 한다. 일반적으로 혈압이 140/90 mmHg 이상인 경우에는 위험인자 또는 동반 질환의 유무와 관계없이 약물치료를 고려할 수 있다."], ["p", "고혈압의 약물치료는 반드시 비약물치료(생활요법)와 병행하여 시행하여야 한다. 고혈압환자의 삶의 질은 질환 자체로 인한 신체적, 정신적 문제뿐만 아니라 약물의 영향 및 부작용, 그리고 환자-의사 관계에 의해서도 영향을 받는다. 따라서 충분한 의사소통과 적절한 정보 제공에 의한 공유의사결정이 중요하며, 약의 개수와 복용 횟수를 줄임으로써 환자의 치료 지속성을 높이고 혈압 조절률을 향상시켜 지속적인 치료가 이루어지도록 하여야 한다."], ["h", "10.2. 고혈압 치료의 시작 혈압"], ["h", "10.2.1. 고혈압 전단계"]], "8": [["p", "심뇌혈관질환으로 인한 사망률은 혈압이 115/75 mmHg일 때를 기준으로, 수축기혈압이 20 mmHg, 또는 이완기혈압이 10 mmHg씩 증가할 때마다 약 2배씩 지속적으로 증가하는 것으로 보고되었다. 이에 따라 혈압이 120/80 mmHg 이상인 경우에는 고혈압의 발생 및 심혈관 사고를 예방하기 위해 생활요법의 시행이 권고된다."], ["cap", "그림 13. 고혈압의 치료계획"], ["p", "혈압 측정, 병력 청취, 신체 검사, 기본 검사 아니요 140/90 mmHg 이상 심혈관질환† 또는 가면고혈압 의심 예 활동혈압 또는 가정혈압 측정* 백의고혈압 또는 일시적 고혈압 심뇌혈관질환 위험도 평가 (위험인자, 무증상 장기 손상, 심혈관질환 유무 평가) 고혈압 전단계에서 약물치료를 시행할 경우 고혈압으로의 진행 속도를 지연시킬 수는 있으나, 대부분의 연구에서 조기 약물치료에 따른 임상적 이득에 대한 증거는 충분하지 않다. 중등도 위험군을 대상으로 시행된 HOPE-3 연구 에서도 전체 분석에서는 약물치료의 유의한 효과가 관찰되지 않았으나 추가 분석에서는 수축기혈압이 140 mmHg 이상인 환자에서 약물의 효과 가능성이 제시되었다."], ["p", "저위험군 및 중위험군 환자에서 고혈압 전단계에 대한 약물치료의 효과는 명확하지 않으며, 일관된 임상적 이득이 입증되지 않았다. 따라서 혈압 강하를 목적으로 고혈압 전단계에서 약물치료를 고려할 경우에는 비용-효과 측면을 신중히 고려하여야 한다<그림 13>."], ["p", "치료 지연을 최소화하기 위하여 생활요법은 약 3개월간 시행 한 후 약물치료 병행 여부를 결정하는 것이 바람직하다. 반면 혈압이 130/80 mmHg 미만으로 잘 유지되는 경우에는 약물치료를 병행하지 않고 지속적인 생활요법을 유지하는 것이 권장된다."], ["h", "10.2.2. 1기 고혈압"]], "9": [["p", "다른 심뇌혈관질환 위험인자가 없는 1기 고혈압환자는 저위험군에 해당되며, 약물치료에 따른 단기적인 임상 효과는 크지 않을 수 있다. 그러나 시간이 경과함에 따라 전체 심뇌혈관위험도가 점차 증가하여 가역적인 치료 시기를 놓칠 수 있다. 또한 심뇌혈관위험도가 낮은 경우에는 고혈압 약물치료를 시작하기 전에 생활요법을 적극적으로 시행할 수 있다."], ["p", "다만 생활요법의 효과가 미미하다고 판단되는 경우, 생활요법 시행 중 새로운 위험인자가 추가되는 경우, 또는 환자가 정기적으로 의료기관을 방문하여 충분한 교육과 지도를 받기 어려운 상황에서는 약물치료를 가급적 조기에 시작하는 것이 좋다. 일반적으로 생활요법은 약물치료를 대체하는 수단이라기 보다는 보조적인 치료로 간주하는 것이 적절하다. 최근 사용되는 항고혈압제는 대부분 비용이 저렴하고 안전성이 높으며, 실제 임상에서 생활요법의 지속적인 실천이 충분히 이루어지지 않는 경우가 많아 약물치료는 비용-효과 측면에서 유용한 전략으로 평가된다."], ["p", "약물치료를 결정하기 전에는 가정혈압 또는 활동혈압 등 진료실 밖 혈압 측정을 시행하여 백의고혈압 여부를 확인하는 것이 권고된다. 백의고혈압환자에서 약물치료의 효과는 아직 명확히 입증되지 않았으나, 백의고혈압은 정상혈압군에 비해 대사적 위험이 증가되어 있고 장기적으로 심뇌혈관질환 발생 위험도 증가하는 것으로 알려져 있다. 따라서 백의고혈압환자 에서는 생활요법을 권고하면서 지속성고혈압으로 진행하는지를 주기적으로 추적 관찰하여야 한다."], ["p", "심뇌혈관질환 위험도가 저위험군인 1기 고혈압환자에서는 적극적인 생활요법을 우선 시행 후 혈압 조절 상태에 따라 약물치료를 고려한다. 반면 중위험군 및 고위험군에 해당하는 1기 고혈압환자에서는 초기부터 약물치료를 시작 하는 것이 권고된다."], ["h", "10.2.3. 2기 고혈압"]], "10": [["p", "대부분의 무작위대조시험과 메타분석에서 160/100 mmHg 이상의 고혈압환자에서는 약물치료의 효과가 뚜렷하게 입증되었음으로, 생활요법과 동시에 즉시 약물치료 시작을 권고한다."], ["h", "10.2.4. 노인 고혈압"]], "11": [["p", "고령 환자에서도 고혈압의 약물치료 효과는 명확하다. 80세 이상 또는 노쇠한 노인을 포함한 모든 노인 환자는 수축기혈압이 160 mmHg 이상인 경우 약물치료를 시행하여야 한다. 또한 수축기혈압이 140~159 mmHg인 경우에 도 약물치료에 잘 적응할 것으로 기대되는 건강한 노인 환자에서는 약물치료를 고려할 수 있다."], ["h", "10.3. 고혈압 치료의 목표 혈압"]], "12": [], "13": [["p", "심뇌혈관질환 위험도가 고위험군에 해당하거나 심혈관질환이 동반된 고혈압환자에서는 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다. 반면에 심뇌혈관질환 위험도가 저위험군 또는 중위험군에 해당하는 고혈압환 자에서는 기존과 같이 혈압을 140/90 mmHg 미만으로 조절할 것을 권고한다."], ["p", "<표13>에서 제시된 바와 같이 특별한 경우가 아니면, 일반적인 목표 혈압은 수축기혈압 140 mmHg 미만 및 이완기혈압 90 mmHg 미만이다. 목표혈압 도달을 위한 임상적 알고리즘은 <그림 14>에 제시하였다."], ["cap", "표 13. 고혈압 치료의 목표 혈압"], ["h", "10.3.1. 노인 고혈압"]], "14": [["p", "노인 고혈압환자에서는 수축기혈압을 140 mmHg 미만으로 조절할 경우와 150 mmHg 미만으로 조절할 경우 사이에 예 후의 차이가 없다는 보고가 있었으나, SPRINT271 연구 및 STEP277 연구에서는 노인 환자에서도 적극적인 혈압 강 하 치료가 유의한 임상적 이득을 보이는 것으로 확인되었다."], ["p", "따라서 이완기혈압이 과도하게 감소하지 않는 범위, 즉 최소한 60 mmHg 이상을 유지하는 조건에서 수축기혈압을 140 mmHg 미만으로 조절하는 것을 목표로 치료할 것을 권고한다."], ["h", "10.3.2. 당뇨병을 동반한 고혈압"]], "15": [["p", "당뇨병을 동반한 고혈압환자에서 혈압 감소는 심혈관 합병증을 줄이는데 매우 중요하다. ACCORD 연구 대상 자에서 SPRINT 연구 대상자를 별도로 분석 연구인 ACCORD-BP에서는 수축기혈압을 120 mmHg 미만으로 유지한 경우 심혈관 사건 위험 감소 효과가 확인되었다. STEP 연구에서는 수축기혈압을 110-130 mmHg로 조절한 환자군의 심혈관 사건 위험이 130-150 mmHg로 조절한 군보다 26% 감소하였고, ESPRIT 연구에서 심혈관질환 고위험군을 대상으로 수축기혈압 120 mmHg 미만으로 조절했을 때 140 mmHg 미만으로 조절한 군보다 심혈관사건이 감소하였다 272. 또한 최근에 발표된 BPROAD 연구는 50세 이상, 심혈관질환의 발생위험이 높은 당뇨병 환자들을 대상으로 수축기 혈압 120 mmHg 미만을 목표로 한 적극적 치료군과 140 mmHg 미만을 목표로 한 통상적 치료군으로 무작위배정해서 연구를 진행한 결과 적극적 치료군에서 심혈관질환의 발생 위험을 21% 감소시켰다."], ["p", "당뇨병환자에서 이완기혈압의 조절 목표에 대한 연구로 HOT 연구의 하위분석에서 이완기혈압 조절 목표를 각각 90, 85, 80 mmHg, 세 군으로 나눠 비교했는데, 이완기혈압이 낮을수록 심혈관 이익을 보였다."], ["p", "그렇지만 아직까지 심혈관질환의 발생 위험이 적은 당뇨병에서 수축기혈압 130 mmHg 미만으로의 적극적인 혈압 조절이 이득이 있다는 임상적인 증거는 없으나 동반된 위험인자가 하나도 없는, 심혈관질환의 발생위험이 저위험에 해당되는 당뇨병 환자들은 전체 2% 미만이기 때문에 저위험 당뇨병을 따로 분류하는 것 자체가 임상적인 의의가 크지 않을 것으로 판단된다. 이에 모든 당뇨병 환자들에서 목표혈압을 130/80 mmHg 미만으로 할 것을 권고한다."], ["h", "10.3.3. 뇌졸중을 동반한 고혈압"]], "16": [["p", "고혈압이 뇌졸중 발생에 가장 중요한 위험인자이고, 또 혈압 치료 결과에 따라 뇌졸중 재발 및 심뇌혈관질환 사건을 감소시킬 수 있음이 알려져 있다. 그러나 RESPECT 연구 결과가 발표되기 전까지는, 수축기혈압을 130 mmHg 미만으로 낮춘 임상 연구들에서 뇌졸중 감소에 대한 명확한 임상적 이득을 입증되지 않았고, 수축기혈압을 140 mmHg 미만으로 조절한 연구에서조차 더 나은 결과를 보여주지 못하였다. 예외적으로 열공성뇌경색 환자들을 대상으로 한 SPS3 연구에서 목표 혈압을 <130 mmHg로 한 군에서 목표혈압을 130-140 mmHg으로 한 군에 비해 서 심혈관 사건 발생은 줄이지 못하였으나 뇌출혈의 발생을 유의하게 감소시켜, 이를 기반으로 2022년 고혈압진료 지침 에서는 열공성뇌경색 환자들에서 목표 혈압은 130 mmHg 미만을 고려할 수 있다고 권고한 바 있다."], ["p", "이러한 배경에서, RESPECT 연구에서는 뇌경색의 과거력이 있는 환자 1,280명을 통상적 혈압 조절군(목표 혈압: 140/90 mmHg) 대 적극적 혈압 조절군(목표 혈압: 120/80 mmHg)으로 무작위배정하여 연구를 진행한 결과 통상적 혈압 조절군에서의 평균 혈압은 133.2/77.7 mmHg, 적극적 혈압 조절군의 평균 혈압은 126.7/77.4 mmHg을 보였다. 그 결과, 적극적 혈압 조절군에서 뇌졸중의 재발 위험 감소의 통계적 경향성이 처음으로 관찰되었다(HR 0.73, 95% CI: 0.49-1.11, P=0.15). 이후 RESPECT 연구 결과를 기존의 SPS3, PAST-BP, PODCAST의 3개의 연구들과 293-295 함께 메타 분석한 결과 적극적 혈압 조절군에서 뇌졸중의 재발이 유의하게 감소됨이 확인되었다(RR: 0.78, 95% CI, 0.64-0.96, P=0.02). 이러한 근거를 바탕으로, 최근에는 대부분의 뇌졸중 환자에서 목표 수축기혈압을 130 mmHg 미만으로 적극적으로 조절할 것을 할 것을 권고하고 있다."], ["p", "다만, 두개내 뇌혈관협착이 동반된 뇌경색 환자의 경우 전반적으로 혈압 강하로 이득을 볼 가능성이 높지만, 혈역학적 장애가 확인된 환자나 뇌졸중 후 급성기에 수축기혈압을 120 mmHg 미만으로 낮춘 경우에는 오히려 이득을 보지 못할 가능성이 일부 연구에서 제기되고 있다. 따라서 중증의 두개내 뇌혈관 협착이 있는 환자에서는 일률적인 적극적 혈압 강하보다는 보다 조심스러운 혈압 강하를 고려할 수 있다."], ["h", "10.3.4. 만성콩팥병을 동반한 고혈압"]], "17": [["p", "만성콩팥병(chronic kidney disease) 환자의 혈압을 조절하는 목적은 콩팥 기능의 악화 속도를 늦추고 심뇌혈관질환의 발생 및 사망률을 낮추는 것이다. SPRINT 연구에서 당뇨병이 없는 만성콩팥병 고혈압환자의 수축기혈압을 120 mmHg 미만으로 조절하였을 때 전체 사망률과 주요 심혈관질환의 발생이 감소하였다. 이를 근거로 2021년 개정된 Kidney Disease: Improving Global Outcomes(KDIGO) 가이드라인에서는 비투석 만성콩팥병 환자에서 표준화된 방법으로 측정한 수축기혈압을 120 mmHg 미만으로 조절할 것을 제안하였다."], ["p", "그러나, 연구 대상자에 포함되지 않았던 비교적 젊은 나이 환자, 당뇨병이 있는 만성콩팥병 환자, 사구체 여과율 <20 ml/min/1.73m² 인 중증 만성콩팥병 환자, 단백뇨 1g/일 초과하는 환자에게 이 기준을 그대로 적용하기에는 제 한이 있다. 한편, ACC/AHA 2017에서는 만성콩팥병의 목표 혈압을 130/80 mmHg 미만으로 권고하였으며, ESH 2023은 만성콩팥병 환자에서는 목표 혈압을 140/90 mmHg 미만으로 하되, 젊고 알부민뇨가 있거나 심혈관질환의 고위험군인 환자에서는 환자가 견딜 수 있다면 130/80 mmHg 미만으로 조절할 것을 권고하였다. 이는 AASK, MDRD, SPRINT, ACCORD-BP 등을 포함한 메타분석에서 수축기혈압 130 mmHg 미만으로 조절 시 전체 사망률 감소 경향과 함께, 단백뇨가 1g/일을 초과하는 환자에서 단백뇨 감소 및 사구체 여과율 저하 속도 둔화 효과가 있다고 보고한 연구 결과를 근거로 한 것이다. ESC 2024 에서도 당뇨병 유무와 관계없이 중등도 이상 만성콩팥병 환자에게 목표 수축기혈압을 120∼129 mmHg으로 조절할 것을 제시하였다."], ["p", "2023년도에 발표된 MDRD, AASK, ACCORD, SPRINT, SPS3, ESCAPE, REIN-2등 7개 임상시험의 만성콩팥병 환자 데이터를 통합한 분석에서는, 적극적 혈압 조절이 일반 혈압 조절에 비해 신장 결과 및 사망 위험을 낮추는 경향을 보였다. 특히, 만성콩팥병 4–5기 환자에서는 적극적 혈압 조절이 주요 신장 결과의 위험을 20% 감소시키는 결과를 보 여주었으며 단백뇨의 정도에 따른 유의한 상호작용 효과는 관찰되지 않았다. 이는 적극적 혈압 조절이 만성콩팥병 환자에서 신기능 악화를 지연시킬 수 있음을 시사한다."], ["p", "따라서, 본 진료지침에서는 만성콩팥병을 동반한 고혈압환자의 목표 혈압을, 환자가 견딜 수 있는 경우, 130/80 mmHg 미만으로 설정할 것을 권고한다. 그렇지만 SPRINT 연구에서와 같이 표준화된 측정법으로 혈압을 측정할 경우에는 수축기혈압 치료 목표를 120 mmHg미만으로 조절하는 것을 고려한다. 실제 임상에서는 환자의 연령, 노쇠, 기립성 저혈압, 낙상과 골절의 위험, 기대 여명 등을 종합적으로 고려하여 혈압 목표를 개별화해야 한다."], ["cap", "그림 14. 목표혈압 도달의 임상적 알고리즘"], ["h", "10.3.5. 치료 혈압의 하한치"]], "18": [["p", "혈압이 높을수록 심뇌혈관질환 위험도가 증가하고, 또 어느 수준까지는 혈압 감소에 따른 심뇌혈관질환 발생 위험이 줄어든다. J-곡선 가설(수축기혈압 또는 이완기혈압을 지나치게 낮추면 오히려 심혈관 사건 및 사망률이 더 증가한다는 가설)의 증명을 위한 임상 연구는 없으나, 임상 연구들의 사후 분석에서 그 가능성이 제기되고 또 혈압이 너무 낮을 때 병태생리학적인 불이익이 생길 개연성이 있으므로 혈압을 지나치게 낮출 필요는 없다. 즉, 1) 관상동맥질환이 동반되어 있을 가능성이 높은 노인, 2) 재관류술을 시행 받지 않은 다발성 관상동맥질환 환자, 3) 다발성 관상동맥질환이 동반되어 있을 가능성이 높은 당뇨병 환자, 4) 심비대가 동반된 고혈압환자들에서는 이완기혈압을 70 mmHg 미만으로 낮추지 않는 것을 고려할 수 있다."], ["h", "10.3.6 혈압측정 방식에 따른 목표혈압"], ["p", "측정 방식에 따라 진료실 밖 혈압은 진료실혈압에 비해 혈압이 평균적으로 수축기혈압 및 이완기혈압 모두 5 mmHg 정도 낮다. 따라서, 일반적인 고혈압환자를 약물치료할 때 진료실혈압 목표가 140/90 mmHg인 경우, 가정혈압 또는 활동혈압을 참고하여 고혈압약을 조절할 때에는 가정혈압평균, 활동혈압으로 주간평균혈압 또는 일일평균혈압으로 각각 135/85 mmHg, 135/85 mmHg, 130/80 mmHg 미만을 목표로 조절한다. 진료실 목표혈압이 130/80 mmHg일 때는 각각, 130/80 mmHg, 130/80 mmHg, 125/75 mmHg 미만을 목표로 조절한다. 그러나 혈압측정 방식에 따른 혈압의 차이는 혈압의 높이와 개개인의 특성에 따라 편차가 크고 반복 측정 시에도 일정하지 않기 때문에 측정 방식에 따라 목표혈압을 환산할 때는 개인 차이를 고려하여야 한다. 특히 진료실자동혈압에 의한 목표혈압은 가면 효과로 인해 조절되지 않은 고혈압의 가능성이 높아 주의가 필요하다."]], "19": [["p", "적정 체중 유지, 소금 섭취 제한, 절주, 금연, 규칙적인 운동, 건강한 식습관 형성 등과 같은 비약물적치료 또는 생활요법은 혈압 감소 효과가 뚜렷하기 때문에 고혈압환자뿐 아니라, 모든 사람에서 고혈압과 심혈관질환의 예방을 위하여 적극적으로 권장된다<표 14>309-313. 바람직한 생활습관의 실천은 항고혈압제 1제에 해당되는 정도의 혈압 강하 효과를 보이며, 다양한 만성질환의 발생 위험을 감소시키는 효과가 있다."], ["p", "또한 항고혈압제를 복용 중인 고혈압 환자에서 생활요법을 병행할 경우, 혈압 조절 효과를 향상시키는 동시에 항고 혈압제의 용량 및 약물 개수를 줄여 부
