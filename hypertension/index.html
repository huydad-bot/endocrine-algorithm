작용을 줄일 수 있는 장점이 있다. 적극적인 생활요법은 혈압 강하 효과뿐만 아니라, 혈당과 콜레스테롤 등 다른 대사 지표를 개선하여 전반적인 심혈관질환 위험을 감소시키는 데에도 기여한다."], ["p", "그러나 생활요법은 장기적인 유지가 어렵고, 특히 2기 이상의 고혈압에서는 목표 혈압에 도달하기에 충분한 혈압 강하 효과를 얻기 어려운 한계가 있다. 따라서 고혈압환자가 생활요법을 지속적으로 실천할 수 있도록 반복적인 교육과 꾸준한 동기부여를 제공하는 동시에, 생활요법의 효과와 한계에 대해서도 충분히 이해할 수 있도록 설명하는 것이 필요하다. 여러가지 생활요법들을 병행하여 시행할 경우 단일 생활요법에 비해 혈압 강하 효과와 뇌혈관질환 예방 효과가 더욱 크게 나타날 수 있다. 이에 따라 적정 체중 유지, 소금 섭취 제한, 절주, 금연, 규칙적인 운동 및 건강한 식습관 형성을 포함한 전반적인 생활습관 개선을 목표로 지속적인 노력을 권고한다."], ["cap", "표 14. 생활요법에 따른 혈압 감소 효과"], ["cap", "그림 15. 고혈압의 비약물치료 및 생활요법"], ["h", "11.1. 체중 조절"]], "20": [["p", "비만은 고혈압, 이상지질혈증, 당뇨병, 관상동맥질환의 발생 및 사망률과 밀접한 관련이 있다. 체질량지수가 증가할수록 혈압이 상승하는 경향을 보이며, 과체중 또는 비만한 사람은 정상 체중인 사람에 비해 혈압이 높은 경향이 있다. 또한 고혈압환자에서 체중을 감량한 경우 혈압이 유의하게 감소한다. 비만한 상태에서는 인슐린저항성이 증가하고, 교감신경과 레닌-안지오텐신-알도스테론계(renin-angiotensin-aldosterone system RAAS)가 활성화되며, 염분에 대한 민감도가 증가되어 혈압 상승을 유발하는 것으로 알려져 있다."], ["p", "비만도는 체질량지수 및 허리 둘레로 측정할 수 있다. 체질량지수는 체중(kg)을 키(m)의 제곱으로 나눈 값으로 계산한 다. 적정 체질량지수는 연구에 따라 다소 차이가 있으나, 일부 연구에서는 체질량지수가 22.5~25 kg/m²에서 사망률 이 가장 낮았고, 다른 연구에서는 과체중 범위에서 사망률이 가장 낮은 것으로 보고되었다. 그러나 대부분의 연구에서 과체중 및 비만에서는 심혈관질환 발생 위험이 증가하는 경향을 보이며, 국내 연구에서 체질량지수 약 25 kg/m² 전후에서 사망률이 가장 낮았다는 점을 고려하여 적정 체질량지수는 25 kg/m²미만으로 권고한다. 허리 둘레에 대한 국내 연구는 제한적이나, 동일한 체질량지수라도 동양인은 서양인에 비해 체지방률이 높은 특성을 보이므로, 목표 허리둘레는 남자 90 cm 미만, 여자 85 cm 미만으로 권고한다."], ["p", "고혈압환자에서 체중이 적정 체중의 10% 이상 초과된 경우, 5 kg의 체중감량만으로도 수축기혈압이 약 4.44 mmHg kg 감소 시 수축기혈압은 1.05 mmHg, 이완기혈압은 0.92 mmHg 감소하는 것으로 보고되었다. 특히 5 kg 이상 체중을 감량한 경우에는, 체중 감량이 없는 경우에 비해 수축기혈압 강하 효과가 더욱 컸다(-6.63 mHg vs. -2.70 mmHg). 당뇨병, 이상지질혈증, 좌심실 비대 등 다른 심혈관질환의 위험요인을 동반한 경우에는 체중 감량의 효과가 더욱 뚜렷하게 나타난다. 또한 운동, 절주, 소금 섭취 제한과 같은 다른 생활요법을 체중 감량과 병행할 경우 혈압 강하 효과가 증강되며, 심혈관질환 발생 예방 효과도 더욱 크게 기대할 수 있다. 따라서 체중 감량은 최소 4∼5 kg를 1차 목표로 시행하고, 감량 후에도 적정 체중을 초과하는 경우 추가적인 체중 감량을 지속적으로 권고한다."], ["p", "체중 감량을 위한 식사 지침으로는 식사를 거르지 않고 천천히 섭취할 것을 권고하며, 당분이 많은 음식과 음주는 피할 것을 권고한다. 또한, 빵, 과자, 청량음료 등 불필요한 간식의 섭취를 제한할 것을 권고한다. 섬유소가 풍부한 식품의 섭취를 늘리고, 지방 함량이 높거나 기름을 많이 사용하여 조리한 음식은 피할 것을 권고한다. 신선한 과일과 채소, 생선의 섭취를 권장하며, 콜레스테롤과 포화지방산의 섭취는 최소화할 것을 권고한다. 다만 당뇨병이 동반된 경우에는 과도한 과일 섭취가 혈당 상승을 유발할 수 있으므로 주의가 필요하다."], ["h", "11.2. 소금 섭취 제한"]], "21": [["p", "한국인은 하루 평균 소금(NaCl, 염화나트륨) 섭취량은 약 8.0 g, 남자 9.4 g, 여자 6.6 g이며, 이는 나트륨 섭취량으로 환산하면 약 3,200 mg(남자 3,700 mg, 여자 2,600 mg)에 해당한다. 전 세계 평균 소금 섭취량은 약.78 g(나트륨 4,300 mg)으로 보고되고 있으며, 이는 세계보건기구(World Health Organization, WHO)가 권고하는 하루 소금 섭취 권고량 5 g(나트륨 2,000 mg)의 1.6배에 해당한다. 한국인의 주요 소금 섭취원은 김치, 면류, 국류 및 찌 개류 등으로 알려져 있다."], ["p", "고혈압환자에서 소금 섭취는 말초동맥혈압보다는 심뇌혈관질환 발생과 더 밀접한 관련이 있는 중심동맥혈압과 높은 연관성을 보인다. 하루 약 10 g의 소금을 섭취하던 사람이 소금 섭취량을 절반으로 줄일 경우 수축기혈압이 4∼6 mmHg 감소하는 것으로 보고되었다. 또한 하루 3 g의 소금 섭취를 줄이면 고혈압환자에서는 수축기/이완기혈압이 각각 4∼6/2∼3 mmHg, 정상 혈압인 사람에서 2∼4/1∼2 mmHg 감소하는 효과가 관찰되었다."], ["p", "소금 섭취 감소가 심뇌혈관 질환 발생을 줄이는지에 대해서는 연구 결과가 일관되지 않게 보고되고 있으나, 우리나라와 같이 소금 섭취량이 높은 인구 집단에서 소금 섭취를 감소시켰을 때 해롭다는 근거는 제시되지 않았다. 비록 국내에서 소금 섭취와 고혈압 및 심뇌혈관질환 발생 간의 관련성을 평가한 전향적인 연구나 중재 연구는 부족하지만, 이러한 점을 고려할 때 소금 섭취 제한은 여전히 권고되어야 한다."], ["p", "세계보건기구는 하루 소금 섭취량을 약 1티스푼에 해당하는 5 g(나트륨 2,000 mg; 계산식 나트륨 = 0.4 X 소금 섭취량) 이하로 제한 할 것을 권고하고 있다. 소금 섭취 제한은 만성질환 부담을 줄이는 데 있어 비용 대비 효과가 가장 우수 고혈압 치료 과정에서 이뇨제 사용 필요성을 줄여 이뇨제에 따른 칼륨 소실 위험을 완화하는데 기여한다. 더불어 소변 을 통한 칼슘 배설을 감소시켜 골다공증 및 요로결석 발생 위험을 낮추는 효과도 기대할 수 있다."], ["p", "염분 감수성(salt sensitivity)이란 식단을 통한 소금 섭취량의 증가나 감소에 반응하여 개인의 혈압이 비정상적으로 뚜렷하게 상승하거나 하강하는 생리적 특성을 의미하는데, 고령자, 비만한 사람, 당뇨병 환자 및 고혈압의 가족력이 있는 경우에서 더 높은 것으로 알려져 있다. 염분 감수성이 높을수록 적극적인 저염식을 시행할 경우 혈압 강하 효과가 더욱 뚜렷하게 나타난다. 또한 소금 섭취량은 에너지 섭취량과 높은 상관관계를 보이므로, 총 에너지 섭취를 감소시키는 것은 소금 섭취를 줄이는 데에도 도움이 된다."], ["p", "소금 섭취를 줄이기 위해서는 식탁에서 추가로 소금을 첨가하지 않을 것을 권고하며, 소금이 많이 함유된 가공식품의 섭취를 제한할 것을 권고한다."], ["p", "특히 김치, 찌개, 국, 젓갈, 라면, 마른 안주 등 한국인이 흔히 섭취하는 식품은 소금 함량이 높으므로 주의가 필요하다. 자연 재료를 사용하여 직접 조리한 음식의 섭취를 늘리고, 염장 식품과 가공 식품의 섭취를 줄일 것을 권고한다."], ["p", "칼륨(포타슘, potassium) 섭취는 혈압 및 고혈압과 U자형 연관성을 보이는 것으로 보고되었다. 최근 연구에 따르면 적절한 칼륨 섭취는 혈압을 낮추는 효과가 있으나, 과도한 칼륨 섭취는 오히려 혈압을 상승시킬 수 있다. 하루 1.7∼2.9 g 수준의 칼륨 보충은 혈압 강하에 도움이 되며 특히 고혈압환자나 소금 섭취가 많은 사람에서 그 효과가 더욱 큰 것으로 나타났다. 약 1.4 g의 칼륨 보충은 정상혈압군에서 2 mmHg, 고혈압군에서 4~5 mmHg 정도의 혈압 강하 효과를 보였다. 대규모 임상 연구인 Salt Substitution and Stroke Study(SSaSS)에서는 나트륨을 칼륨으로 대체한 소금 사용이 뇌졸중 발생 위험과 전체 사망 위험을 유의하게 감소시키는 것으로 보고되었다."], ["p", "대부분의 임상 연구들은 칼륨을 약물 형태로 투여하였으나, 채소와 과일, 저지방 유제품, 일부 생선과 육류, 견과류 및 콩류 등 칼륨이 풍부한 식품을 통한 섭취로도 유사한 혈압 강하 효과를 기대할 수 있다. 하루 4∼5 접시 분량의 채소와 과일은 약 1.5∼3 g 이상의 칼륨을 공급할 수 있다. 다만, 만성콩팥병 환자의 경우 소변을 통한 칼륨 배출이 감소하여 고칼륨혈증이 발생할 수 있으므로, 사구체 여과율이 감소한 환자에서는 칼륨 섭취에 각별한 주의가 필요하다."], ["h", "11.3. 절주"]], "22": [["p", "알코올 섭취와 혈압 상승의 연관성은 다수의 역학 연구를 통해 일관되게 입증이 되었다. 일부의 연구에서 적절 수준의 음주가 HDL-콜레스테롤을 증가시키고 관상동맥질환 위험을 감소시킬 수 있다는 보고가 있으나, 아시아인을 대상 으로 한 메타분석에서는 비음주자에 비해 소량의 음주자에서도 고혈압 발생 위험이 증가하였으며, 음주량이 증가할수록 고혈압 발생 위험이 용량 의존적으로 상승하는 것으로 나타났다."], ["p", "과도한 음주는 혈압을 상승시키고 심뇌혈관질환 발생 위험을 증가시킬 뿐만 아니라, 항고혈압제의 효과를 저해하여 혈압 강하 효과를 감소시키고, 난치성(혹은 저항성)고혈압의 발생을 증가시킬 수 있다. 또한 다른 메타분석 연구에서는 절주를 시행할 경우 음주량 감소 정도에 비례하여 혈압 강하 효과가 나타남이 보고되었다."], ["p", "음주는 알코올 양을 기준으로 남자는 하루 20~30 g 미만, 여자는 10~20 g 미만으로 제한할 것을 권고한다. 체중이 적은 경우에는 알코올에 대한 감수성이 높으므로 상기 허용량의 절반 수준으로 제한할 것을 권고한다. 하루 음주 허용량은 에탄올 기준 하루 30 g으로, 맥주 720 mL(1병), 와인 200∼300 mL(1잔), 정종 200 mL(1잔), 위스키 60 mL(2샷), 소주 2∼3잔에 해당한다. 따라서 혈압이 적정 수준 이상으로 상승한 사람이나 고혈압이 있는 환자에서는 하루 2잔 이내로 음주를 제한하는 절주를 적극적으로 권고한다."], ["h", "11.4. 운동"]], "23": [["p", "규칙적인 운동은 혈압을 낮추고, 심폐기능을 개선하며, 체중 감소와 이상지질혈증 개선, 스트레스 완화 등 다앙한 이점을 통해 고혈압환자에게 유익한 효과를 제공한다. 반면 신체 활동이 부족한 경우 고혈압의 발생 위험이 증가하는 것으로 보고되었다. 여러 메타분석 연구에서 유산소 운동과 저항성 운동 모두 혈압 강하 효과를 보고하였으며, 다른 메타분석 연구에서는 규칙적인 운동은 심혈관질환 사망률과 총 사망률을 모두 감소시키는 것으로 보고하였다."], ["p", "속보, 조깅, 자전거 타기, 수영, 줄넘기, 에어로빅 체조 등은 대표적인 유산소 운동으로, 고혈압환자에서 혈압을 낮추는 효과가 있음이 이미 잘 알려져 있다. 또한 유산소 운동은 심폐기능 개선을 통해 고혈압 발생 위험을 감소시키는 데에도 기여한다. 운동 강도는 최대 심박수(220-연령)의 약 60∼80% 정도 또는 그 이하가 적절하며, 주 5∼7일 정도로 꾸준히 하는 것이 권고된다. 다만 중강도 운동을 150분이상 또는 고강도 운동을 75분 이상 몰아서 하는 것도 규칙적인 운동과 유사한 심폐기능 개선 효과를 기대할 수 있다. 또한 운동 능력이 낮거나 시간이 없어서 30분 이상 연속적으로 운동을 하지 못하는 경우에는 10분 이상씩 나누어 시행하더라도 심폐기능과 심혈관 위험인자 개선에 긍정적인 효과를 기대할 수 있다."], ["p", "운동을 처음 시작할 때에는 10∼20분 정도의 짧은 시간으로 시작하여, 점진적으로 30∼60분까지 연장하는 것이 바람직하며, 운동 전후에는 각각 약 5분간의 준비 운동과 마무리 운동을 시행할 것을 권고한다."], ["p", "스쿼트, 팔굽혀펴기, 덤벨과 같은 저항성 운동은 근량과 근력을 증가시키고, 직접적인 혈압 강하 효과뿐만 아니라 심혈관질환 및 그 위험인자 개선에도 긍정적 영향을 미친다. 일부 메타분석 연구에서는 주 2∼3회 정도의 저항성 운동이 수축기혈압을 6∼7 mmHg, 이완기혈압을 3∼4 mmHg 감소시키는 것으로 보고하였으며, 이는 유산소 운동과 유사한 수준의 효과였다. 이에 본 진료지침에서는 미국 심장학회와 같이 혈압 강하를 목적으로 주 2∼3회의 저 항성 운동을 권고한다."], ["p", "저항성 운동은 각 근육별로 주 2∼3회 시행하되, 동일 근육근에 대해서는 최소 48시간의 휴식 기간을 둘 것을 권고한다. 운동 강도는 1회 반복 최대 중량(repetition maximum, 1RM)을 기준으로 초보자인 경우 40∼50% 수준에서 시작하 근육군부터 작은 근육 순으로 운동을 진행하는 것이 바람직하다. 대부분의 연구에서 급성 혈압 상승이나 사고 위험은 낮 의가 필요하다."], ["p", "합병증이 없는 대부분의 고혈압환자는 운동 시작전에 특별한 검사를 시행하지 않더라도 안전하게 운동량을 증가시킬 수 있다. 그러나 심장 질환 병력이 있거나, 흉통, 어지러움 등의 증상이 있는 경우, 이전에 격렬한 운동 경험이 없는 65세 이상의 고령자, 또는 심혈관 위험 요인을 가진 환자에서는 운동 시작 전에 전문의의 평가를 통해 운동부하검사 등의 정밀검사를 시행한 후에 개별화된 운동 프로그램에 따라 시행하는 것이 안전하다."], ["h", "11.5. 금연"]], "24": [["p", "흡연은 전 세계적으로 매년 약 630 만명의 사망을 초래하며, 전체 질병부담의 6.3%를 차지하는 주요 공중보건 위협 요인이다. 고혈압환자에서 혈압이 적절히 조절되더라도 흡연을 지속할 경우 심뇌혈관질환 발생 및 사망 위험은 유의하게 증가한다. 흡연과 간접흡연은 악성 종양 및 호흡기 질환과의 연관성이 잘 알려져 있으나, 고혈압 및 심혈관질환의 위험 또한 증가시키는 것으로 보고되고 있다. 흡연은 교감신경계를 즉각적으로 자극하여 혈압을 상승시키고 심박수를 증가시킴 으로써 심근의 산소 요구량을 증가시킨다. 또한 이러한 효과가 반복•지속되면 주간활동혈압을 상승시킬 수 있으며, 이로 인해 혈압 측정값의 정확성이 저하될 가능성이 있다. 일부 연구에서는 현재 흡연자의 혈압이 비흡연자나 과거 흡연자보다 오히려 더 낮게 관찰되었으며, 금연이 역설적으로 혈압을 상승시킬 수 있다는 보고도 있다."], ["p", "그러나 금연 후 나타나는 일시적인 혈압 상승은 주로 금연에 따른 체중 증가에 기인하는 것으로 여겨진다. 따라서 혈압 조절을 목적으로 흡연을 지속하거나 금연을 회피하는 것은 흡연으로 인한 다양한 유해 효과를 고려할 때 이득보다는 위험이 훨씬 크다. 또한 간접 흡연과 전자담배 사용 역시 혈압과 맥박을 상승시키고, 심뇌혈관질환 및 사망 위험을 발생을 증가시킬 수 있음이 보고되었다."], ["p", "따라서 모든 흡연자에게 금연을 강력히 권고해야 하며, 금연을 위해 행동요법과 함께 금연 보조제를 병행할 수 있다. 아울러 금연 이후 체중 증가가 발생할 수 있으므로 이를 예방하기 위해 식사요법과 규칙적인 운동을 함께 시행하도록 권고해야 한다."], ["h", "11.6. 건강한 식사요법"]], "25": [["p", "채식위주의 식사는 비채식 식사에 비해 혈압이 낮고, 고혈압 발생 위험을 감소시키는 것으로 보고되었다. 특히 통곡물, 과일, 채소, 견과류, 콩류 등을 중심으로 한 건강한 채식 식단은 정제된 곡류, 가당 음료, 염장 식품 등으로 구성된 덜 건강한 채식 식단에 비해 고혈압 발생 위험을 더욱 유의하게 감소시킨다. 이러한 효과는 과일과 채소 섭취 증가에 따른 식이섬유 섭취 증가, 포화지방산과 콜레스테롤 섭취 감소로 인한 산화 스트레스 완화와 만성 염증 억제 등을 통해 혈관 기능이 개선되기 때문으로 설명된다."], ["p", "노령 인구를 대상으로 한 연구에서 과일과 채소 섭취만 증가시킨 군에서 수축기/이완기혈압이 각각 약 3/1 mmHg 감소한 반면, 여기에 지방 섭취 제한을 병행한 군에서 6/3 mmHg의 혈압 감소 효과가 관찰되었다. 채소, 과일, 생선 섭취를 늘리고 지방 섭취를 줄이는 DASH 식단은 수축기/이완기혈압을 최대 11/6 mmHg까지 낮출 수 있는 것으로 보고되었으며, 다양한 식품군을 복합적으로 포함함으로써 영양소간 상호작용의 이점을 기대할 수 있다. 또한 칼슘, 마그네슘, 혹은 칼륨 섭취 증가에 따른 부가적인 혈압 강하 효과도 기대할 수 있다."], ["p", "마그네슘은 혈관 평활근 세포 내 칼슘통로를 차단하여 혈관 평활근을 이완시키고, 혈관 내피에서 산화질소(nitric oxide, NO) 및 프로스타사이클린(prostacyclin) 분비를 촉진함으로써 혈압을 낮추는 것으로 알려져 있다. 칼륨은 나트륨의 신배출을 증가시키고, 혈관 이완을 촉진하며, RAAS의 활성화를 억제하여 혈압을 낮추고 심혈관 사건 발생 위험을 감소시킨다. 적색육과 가공육 섭취는 고혈압 발생 위험을 증가시키는 반면, 가금류는 이러한 위험 증가와 관련이 없는 것으로 보고되어 단백질 섭취가 필요한 경우에는 가금류나 생선 위주의 섭취가 바람직하다. 생선 섭취는 비만한 고혈압환자에서 혈압을 낮추고, 지질대사를 개선하는 효과가 있는 것으로 나타났다. 국내 연구 에서도 두부와 콩류, 과일, 채소, 생선으로 구성된 식단과 유제품 섭취가 많은 식단이 고혈압 유병률과 음의 상관 관계를 보이는 것으로 보고되었다."], ["p", "또한 지중해식 식단(Mediterranean Diet)은 이미 관상동맥 질환이 있는 환자에서도 주요 심혈관 사건 예방에 효과 적인 것으로 알려져 있다. 고혈압환자에서는 특정 영양소의 단일 섭취를 강조하기 보다는 전체적인 식사 패턴을 개선하는 것이 혈압 강하에 더욱 도움이 된다."], ["p", "그러므로, DASH나 지중해식 식단처럼 균형 잡힌 건강한 식단은 혈압을 떨어뜨릴 뿐 아니라 심혈관질환 예방에도 도움이 되므로 적극적으로 권장한다."], ["h", "11.7. 마음 요법"]], "26": [["p", "스트레스와 불안은 고혈압과 심혈관사건의 위험을 증가시킨다. 정신적 고통이나 강한 정서적 충격은 교감 신경계를 활성화하여 혈압을 상승시킬 수 있다. 최근 메타분석에서는 호흡 조절 훈련, 마음 챙김 훈련, 명상과 같은 스트레스와 불안을 완화하는 중재가 혈압을 유의하게 감소시키는 효과를 보인다고 보고하였다."], ["p", "따라서, 스트레스, 불안, 긴장이 높은 사람에서 혈압 조절을 위한 비약물적 중재로 호흡조절훈련, 마음 챙김 훈련 및 명상이 고려된다."]], "27": [["p", "고혈압환자에서 혈압을 낮추면 심뇌혈관질환의 발생률이 감소된다는 사실은 잘 알려져 있다. 현재 권고되는 모든 주요 고혈압 약제는 위약과 비교해서 심뇌혈관질환을 예방효과가 입증되었으며, 특히 관상동맥질환보다 뇌졸중 예방 효과가 상대적으로 큰 것으로 알려져 있다. 고혈압 약제의 심뇌혈관질환 예방효과는 특정 약물의 종류 보다는 혈압 강하 정도가 가장 중요한 결정 요인이다."], ["p", "저위험군 1기 고혈압환자에서 약물치료를 통한 심뇌혈관질환 예방 효과에 대해서는 아직 강력한 직접적인 근거가 부족하다. 그러나 PREVER-Prevention 연구에서는 수축기혈압이 120-139 mmHg인 주의혈압 및 고혈압 전단계 환자를 대상으로, 3개월간 생활습관조절 후에도 혈압이 120 mmHg 미만으로 조절되지 않은 환자 730명을 chlorthalidone/amiloride 치료군과 위약군으로 무작위배정하여 비교하였다. 그 결과, 약물치료군에서 고혈압으로 진행 위험이 44% 감소하였으며(HR 0.56, 95% CI: 0.38-0.82,) 심비대 발생 또한 유의하게 감소하였다."], ["p", "비록 저위험군인 1기 고혈압환자만을 대상으로 고혈압 약물치료가 심혈관질환 발생을 감소시키는지를 직접 평가한 무 작위대조시험은 없으나, 동반 심혈관질환이 없는 1기 고혈압환자를 대상으로 한 메타분석에서는 수축기/이완기혈압 을 3.6/2.4 mmHg 낮췄을 때 뇌졸중 발생 위험이 28%(HR: 0.72, 95% CI: 0.55-0.94), 심혈관질환 사망률이 25%(HR: 0.75, 95% CI: 0.57-0.98) 감소하는 것으로 보고되었다."], ["p", "이러한 근거들을 종합할 때, 저위험군 1기 고혈압이더라도 3개월간의 생활습관 개선 후 혈압이 적절히 조절되지 않는 경우에는 고혈압의 진행을 억제하고 표적장기 손상을 예방하며, 나아가 심혈관질환의 발생 위험을 낮추기 위해 약물 치료를 고려하는 것이 타당하다."], ["p", "한편, 주요 고혈압 약제들은 모두 일차 약제로 사용 가능하나, 약물 별로 효과적인 적응증과 부작용 양상이 다르므로 환자의 임상적 특성에 따라 적절한 약제를 선택해야 한다. 또한 치료 지속성을 높이기 위해 처방을 단순화하고 부작용 을 면밀히 모니터링하며, 가정혈압 측정을 통해 환자가 치료 과정에 적극적으로 참여하도록 하는 것이 중요하다."], ["h", "12.1. 고혈압약의 처방 원칙"], ["h", "12.1.1. 고혈압약 선택의 원칙"]], "28": [["p", "심뇌혈관질환의 장기적인 이환율과 사망률을 최대한 낮추기 위해서는 교정 가능한 위험인자를 적극적으로 관리하는 것이 중요하다. 혈압은 일차적으로는 140/90 mmHg 미만을 목표로 조절하며, 치료에 잘 적응하는 환자군에서는 추가 목표로 130/80 mmHg 미만까지 조절할 수 있다. 항고혈압제를 처음 투여할 때는 부작용 발생을 최소화하기 위해 저용량으로 시작한다."], ["p", "약물은 24시간 약효가 지속되어 1일 1회 복용이 가능한 제제를 우선적으로 선택한다. 특히 1일 1회 복용 제제 중에서는 최저/최대 효과 비(trough/peak ratio)가 0.5 이상인 약물이 바람직한데 418, 이러한 약물은 환자의 치료 지속성을 높여주며 혈압 변동을 최소화하여 혈압을 안정적으로 조절하는 데 도움을 준다. 하루 1회 복용하여도 혈압이 안정적으로 조절되지 않는 경우 1일 2회 이상으로 나누어 복용할 수 있다."], ["p", "일차 항고혈압제로는 RAS 억제제인 ACE 억제제, ARB, 베타차단제, 칼슘통로차단제, 이뇨제 중에서 선택하며, 적응증과 금기 사항, 환자의 동반 질환, 무증상 장기 손상 여부 등을 종합적으로 고려해야 한다. 노인환자에서 베타차단제는 치료 이득에 대한 논란이 있으므로, 특별한 적응증이 있는 경우에만 사용하도록 한다. 또한 베타차단제와 이뇨제의 병용 요법은 당뇨병 발생 위험을 증가시킬 수 있으므로, 당뇨병 발생 위험이 높은 환자에서는 주의가 필요하다."], ["p", "혈압이 160/100 mmHg 이상이거나 목표 혈압보다 20/10 mmHg 이상 높은 경우에는 혈압 강하 효과를 극대화하고 조기에 혈압을 조절하기 위해 초기부터 항고혈압제의 병용 요법을 고려할 수 있다. 특히 단일제형복합제(single-pill combination)는 혈압 강하 효과를 향상시키는 동시에 부작용을 줄이고, 치료 지속성을 증가시켜, 심뇌혈관질환 및 무증 상 장기 손상을 예방하는 데 도움이 된다."], ["h", "12.1.2. 고혈압 약의 선택"], ["p", "고혈압 약제의 선택은 단순한 혈압 수치보다는 환자의 임상적 특성과 동반질환을 종합적으로 고려하여 결정하는 것이 바람직하다. 현재 강압 효과가 충분하고 안전성이 입증되었으며 부작용이 비교적 경미하여 일차약으로 사용되는 고혈압 약제는 크게 네가지 계열로 분류한다. 이에 해당하는 약제는 1) RAS 억제제인 ACE 억제제 또는 ARB, 2) 베타차단제 (알파-베타차단제 포함), 3) 칼슘통로차단제, 4) 티아지드 또는 티아지드유사 이뇨제이다. 이번 진료지침 에서는 혈압 강하 효과를 근거로 안지오텐신수용체-네프릴리신억제제(angiotensin receptor-nephrilysin inhibitor, ARNI)를 고혈압 치료 약제로 새롭게 포함하였다. 그외의 고혈압 치료 약제로는 고리작용이뇨제(loop diuretics), 알도스테론길항제 (aldosterone antagonist), 알파차단제(alpha-blocker), 혈관확장제(vasodilator), 나트륨-포도당 공동수송체 2 억제제 (sodium-glucose transporter 2 inhibitor, SGLT2 억제제) 등이 있다."], ["p", "이들 약제는 적절한 용량 조절 시 강압 효과의 정도는 서로 유사하지만, 개인별 혈압 반응, 장기적 심혈관질환 예방 효과 및 부작용 발생 양상에서는 차이를 보일 수 있다. 특히, 환자가 다른 동반 질환이나 심뇌혈관 위험인자를 가지고 있는 경우에는 이를 고려하여 항고혈압제를 선택해야 한다<표 15>. 따라서 특정 약제가 다른 약제보다 일관되게 우월하다고 단정하기는 어렵고, 환자 개인의 임상적 특징과 부작용 발생 가능성을 고려하여 가장 적절한 약제를 우선 선택하여 투여하는 것이 중요하다<표 15, 표 16>."], ["cap", "표 15. 질환에 따른 추천 고혈압약"], ["cap", "표 16. 고혈압 약의 적응증과 금기"], ["h", "12.2. 고혈압 약의 종류와 사용법"], ["h", "12.2.1. 이뇨제"]], "29": [["p", "이뇨제(thiazide diuretics)는 사용 초기에는 원위곱슬세관(distal convoluted tubule)에서 나트륨 재흡수를 감소시켜 혈압을 낮추며, 장기적으로는 말초혈관 저항을 감소시켜 혈압 강하 효과를 나타낸다. 티아지드계 이뇨제는 고용량 투여 시 저칼륨혈증, 포도당불내성, 고요산혈증, 부정맥, 지질대사장애 등 여러가지 부작용이 나타날 수 있으나, 저용량 사용 시에는 이러한 부작용이 비교적 드물다."], ["p", "그러나 비만이거나 당뇨병 발생의 고위험군에 해당하는 환자에서 티아지드계 이뇨제를 베타차단제와 병용할 경우 당뇨병 또는 이상지질혈증이 발생 위험이 증가할 수 있으므로 주의가 필요하며, 이러한 병용은 일반적으로 권장되지 않는다. 클로르탈리돈(chlorthalidone), 인다파미드(indapamide)와 같은 티아지드유사(thiazide-like diuretics) 이뇨제는 하이드로클로로티아지드(hydrochlorothiazide)에 비해 강압 효과가 더 우수하다고 알려졌으나 저나트륨혈증 혹은 저칼륨혈증과 같은 전해질 이상 발생 가능성에 유의해야 한다."], ["p", "최근에 발표된 DCP에서는 65세 이상 고혈압환자에서 클로르탈리돈이 하이드로클로로티아지드에 비해 심혈관질환 발생위험을 유의하게 감소시키지 못한 것으로 보고되었으며, 이에 따라 일차 항고혈압제로 티아지드계 이뇨제는 특정 제제에 국한하지 않고 사용할 수 있다."], ["p", "푸로세미드(furosemide), 토라세미드(torsemide)와 같은 헨레고리(loop of Henle)에 작용하는 고리작용이뇨제 (loop diuretics)는 울혈성 심부전이 동반되었거나 사구체 여과율이 30 mL/min/1.73 m² 미만으로 감소한 경우에 사용한다."], ["p", "스피로놀락톤(spironolactone)은 스테로이드 구조를 가진 미네랄코티코이드수용체길항제(steroidal mineralocorticoid receptor antagonist, steroidal-MRA)로 신장의 원위곱슬세관과 집합관(collecting duct)에서 알도스테론 수용체 (aldosterone receptor)를 차단하는 알도스테론 길항제(aldosterone antagonist)이다. 이로 인해 나트륨과 수분의 재흡수가 감소하고 칼륨 배설이 억제되는 칼륨보존이뇨제(potassium-sparing diuretics)로 작용한다. 혈압 조절이 어려운 환자에서 유의한 혈압 강하 효과가 입증되었으나, 사구체 여과율이 <45 ml/min/1.73m² 미만으로 감소한 환자에서 ACE 억제제 또는 ARB와 병용할 경우 고칼륨혈증이나 신기능 악화가 발생될 수 있으므로 주의가 필요하다. 또한 스피로놀락톤은 안드로겐 수용체를 차단하고 프로게스테론 수용체에도 작용하므로 성기능 장애, 여성형 유방, 월경 불순 등의 부작용이 있다. 최근 난치성(혹은 저항성)고혈압환자를 대상으로 한 연구에서는 집합관의 상피 나트륨 통로길항제(epithelial sodium channel antagonist, ENaC)인 아밀로라이드(amiloride)가 스피로놀락톤에 비해 혈압 강하 효과에서 비열등함을 보였다. 이에 따라 스피로놀락톤을 사용 중 부작용이 발생하였거나 부작용 위험이 높은 환자에서는 아밀로라이드 사용을 대안으로 고려한다 ."], ["p", "또한 CLICK 연구에서는 사구체 여과율 <30 ml/min/1.73m²의 만성콩팥병 4-5기 환자에서 조절되지 않는 고혈압을 대상으로 클로르탈리돈의 혈압 강하 효과가 입증되어, 해당 환자 군에서 사용을 고려한다."], ["h", "12.2.2. 베타차단제"]], "30": [["p", "베타차단제(beta blocker)는 협심증, 심근경색, 박출률감소심부전, 심방세동이 동반된 경우 심혈관 사건 감소 및 예후 개선 효과가 확인되어 해당 환자에서 사용을 권고하며, 이러한 목적으로 베타차단제를 사용하는 경우 2세대 베타-1 선택성 베타차단제나 3세대 혈관 확장성 베타차단제를 고려한다<부록 1>. 안정시 심박수가 80회를 넘는 비교적 젊은 환자에서도 효과적이다. 고혈압환자의 안정 시 심박수가 분당 80회가 넘는 경우가 흔하며, 이는 교감신경항진을 반영하며 고혈압환자의 심박수 증가는 심방세동, 심부전 및 사망과 연관성이 있다고 알려져 있어 교감신경 항진과 연관된 젊은 고혈압, 심방세동, 갑상선 기능 항진/저하 연관 또는 불안 장애가 동반된 경우 효과적으로 고려될 수 있다. 라베타롤 (labetalol)은 임신성 고혈압 또는 임신을 계획하는 가임기 여성에서 일차 약제로 사용할 수 있다."], ["p", "그러나 베타차단제는 천식이나 만성폐쇄성 폐질환, 2~3도 방실 전도 장애가 있거나, 말초혈관질환이 동반된 환자에게 신중히 사용해야 한다. 또한 혈당 및 지질 대사 장애를 초래할 수 있기 때문에 노인, 혈당 상승, 당뇨병 환자, 대사증후 군 환자에게 투여할 때 주의가 필요하다. 또한 이형 협심증을 악화시킨다는 보고가 있어 주의가 필요하다."], ["p", "특히 아테놀롤(atenolol)은 뇌졸중 예방효과가 다른 고혈압 약에 비해 열등하므로 노인에게 일차약으로는 추천되지 않는다. 또한 수축기단독고혈압환자나 동맥경직도가 증가한 고혈압환자에서 베타차단제 사용은 심박수 감소와 연관된 심박출량 증가로 혈압 강하의 이득이 줄어 적응증이 없다면 사용을 피하는 것이 좋다. 베타차단제와 이뇨제의 병용요법은 강압 효과는 열등하지 않으나 당뇨병 발생이 증가할 수 있으므로, 당뇨병 발생위험이 높은 환자에게는 특별한 사유가 있지 않는 한 추천하지 않는다. 각각의 베타차단제는 계열 효과(class effect)가 일관되지 않는다. 베타-1 선택성이 높은 비소프로롤(bisoprolol)이나 혈관 확장 효과가 있는 카르베딜롤(carvedilol), 네비볼롤 (nebivolol)은 기존의 베타차단제의 부작용(기관지 경련, 성기능 감소)이 적다고 알려져 있다. 아테놀롤과 비교하여 혈관 확장 효과가 있는 3세대 베타차단제는 다른 효과를 나타낼 가능성이 있으나, 후향적 연구에서 일부 효과를 보였으나, 전향적인 대규모 심혈관 합병증을 관찰한 연구는 아직 없다."], ["h", "12.2.3. 칼슘통로차단제"], ["p", "칼슘통로차단제(calcium channel blocker)는 장시간 작용형(long-acting) 칼슘통로차단제를 권고한다. 속효성 칼슘 통로차단제는 반사성 빈맥을 유발하여 심장에 부담을 줄 수 있으므로 고혈압 조절목적으로는 사용하지 않아야 한다. 칼슘통로차단제는 관상동맥 확장 작용이 있어 안정형협심증에 효과적이며, 특히 관상동맥연축에 의한 이형협심증에 매우 효과적이다. 또한 경동맥 죽상동맥경화증의 진행속도를 늦추고 심비대 감소에도 효과적이다. 비디히드로 피리딘계(non-dihydropyridine) 칼슘통로차단제인 베라파밀(verapamil)과 딜티아젬(diltiazem)은 반사성 빈맥이 없어 심근경색 후에도 효과적이며 확장기 충만을 개선시키므로 비후성심근증 환자에서 추천된다. 칼슘통로차단제의 부작용으로는 디히드로피리딘계(dihydropyridine) 칼슘통로차단제에서 빈맥, 발목 부종, 두통 및 안면홍조가 흔하다. 칼슘통로차단제 관련 부종은 소동맥 확장으로 인한 모세혈관 정수압 증가로 발생하며, 특히 암로디핀(amlodipine)의 R형 이성질체 이상반응으로, 다른 약제로 변경하거나 S형 암로디핀 단독 제제로 변경하면 부종의 발생을 줄일 수 있다. 또한 디히드로피리딘계 칼슘통로차단제 사용 중인 환자에서 혈압 조절이 불충분하여 ACE 억제제 또는 ARB를 병용하는 경우, 혈압 강하 효과를 높잎 뿐만 아니라 발목 부종 감소에도 도움이 될 수 있다 446. 비디히드로피리딘계 칼슘통로차단제는 변비, 방실 전도 장애와 심근 수축력 저하를 유발할 수 있으므로 방실 차단 및 박출률감소심부전증(heart failure with reduced ejection fraction) 환자에게는 사용하지 않는다. 또한 고령 환자 에게 베타차단제와 병용 투여할 때 서맥 발생 위험이 증가하므로 주의가 필요하다."], ["h", "12.2.4. 레닌-안지오텐신계 억제제"], ["p", "RAS 억제제인 ACE 억제제와 ARB는 박출률감소심부전 환자의 사망률을 감소시키고, 콩팥기능장애의 진행을 억제하는 데 효과적이어서 이들에게 권고한다. 또한 좌심실 비대와 죽상동맥경화의 진행을 억제하며, 혈당 및 지질 대사에 미치는 영향이 적다. 이들 약제는 혈관내피세포의 기능을 개선하고 혈관 재형성에 이로운 효과를 가진다."], ["p", "고령 환자나 탈수 상태의 환자에게 투여할 경우 치료 초기에 저혈압이 발생할 수 있으므로 주의가 필요하다. 양측성 신동맥협착증 환자에게 투여하면 심한 저혈압 및 급격한 신기능 악화를 초래할 수 있다. 또한 치료 시작 후 첫 2개월 이내에 혈청 크레아틴이 상승할 수 있으나, 기저치 대비 30% 이내의 상승을 보이며, 혈중 칼륨이 5.5 mEq/L 이상 증가하지 않으면 약을 중단할 필요는 없다. 혈청 크레아티닌이 3.0 mg/dL 이상인 환자는 고칼륨혈증 발생에 주의해야 한다. 칼륨 및 콩팥 기능은 투여 전과 투여 후 1~4주 사이에 검사한다. 그 후에는 3개월, 6개월 후에 검사해야 한다."], ["p", "ACE 억제제는 브래디키닌(bradykinin), 서브스턴스 P(substance P), 프로스타글란딘(prostaglandin) 등의 분해를 억제하여 마른 기침이 생길 수 있으나, 투약 중단 시 수일에서 수주 이내에 소실된다. 이러한 마른 기침은 여성과 비흡연자에게 더 흔하다. ARB는 브래디키닌에 대한 영향을 미치지 않아 기침 발생이 드물다. ACE 억제제 및 ARB는 태아에 유해하므로 임신부에게는 금기이다. ACE 억제제와 ARB의 동시 사용은 추가적인 단백뇨 감소가 관찰되기는 하나, 저혈압과 고칼륨혈증의 빈도가 증가하고 신기능 악화 위험이 높아 권장되지 않는다. 이들 약제의 부작용 으로는 고칼륨혈증과 양측성신동맥협착증 환자에서는 급성 콩팥 손상이 동반될 수 있으며, 그 외 미각 이상, 백혈구 감소증, 혈관 부종, 발진 등이 보고되었다."], ["h", "12.2.5. 안지오텐신수용체-네프릴리신억제제(ARNI)"]], "31": [["p", "안지오텐신수용체-네프릴리신억제제(angiotensin receptor-neprilysin inhibitor, ARNI)인 사쿠비트릴/발사르탄 (sacubitril/valsartan)는 ARB인 발사르탄(valsartan)과 내인성 단백분해효소인 네프릴리신(neprilysin)의 억제제인 사쿠비트릴(sacubitril)이 1:1 비율로 결합된 복합제이다."], ["p", "이 약제는 박출률감소심부전과 경도감소심부전(mildly reduced heart failure, 좌심실구혈률 40-49%) 환자에서 예후 개선 효과가 입증되었다. 특히 심부전이 동반된 고혈압환자에서 좌심실의 재형성 관련 이득과 혈압 조절 효과가 확인되어, 심부전이 동반된 고혈압환자에서는 ACE 억제제나 ARB보다 우선적으로 사용을 권고한다. 또한 ARB로 인한 혈관 확장 효과와 네프릴리신 억제에 따른 이뇨작용과 염분 배설 증가 효과로 인해, 염분 감수성이 높은 아시아 고혈압환자에서 ARB 대비 활동혈압에서 유의한 혈압 강하 효과가 보고되었다. 더불어 PARAGON-HF 연구의 하위 분석에서 박출률보존심부전(heart failure with preserved ejection fraction)을 동반한 환자에서 난치성(혹은 저항성) 고혈압 치료에 유의한 혈압 강하 효과가 보고되었다."], ["p", "이러한 근거를 바탕으로, 사쿠비트릴/발사르탄은 이번 진료지침에서 항고혈압 치료 약제로 새롭게 포함되었으며, 심부전과 염분 감수성이 동반된 고혈압환자에서 치료 옵션으로 고려되는 약제로 제시되었다. 다만, 해당 적응증에서의 임상적 효과를 확증하기 위해서는 추가적인 연구가 필요하다. 난치성(혹은 저항성)고혈압 치료 목적으로 사용되는 경우 사쿠비트릴/발사르탄은 고용량(1회 투여, 200 mg 또는 400 mg)을 사용한다."], ["h", "12.2.6. 기타 약물"]], "32": [["p", "알파차단제(alpha-blocker)는 혈압 강하 효과와 함께 전립선비대증 환자의 배뇨 증상 개선에 효과적이며 혈당 및 지질대사를 효과적으로 개선한다. 그러나 기립성 저혈압의 부작용이 있으며, 심부전을 악화시켰다는 연구 결과가 보고된 바 있어 사용 시 주의가 필요하다."], ["p", "중추신경에 작용하는 고혈압약(centrally acting agent)으로 클로니딘(clonidine), 메틸도파(methyldopa), 레세르핀 (reserpine) 등이 있으며, 메틸도파와 레세르핀은 국내에 도입되어 있지 않다. 또한 이들 약제들은 부작용이 상대적으로 많아 일차 약제로는 권고되지 않으나, 특별한 적응증이 있는 경우에 한해서 사용할 수 있다. 레닌억제제인 알리스키렌 (aliskiren)은 단독 또는 이뇨제와 병용하여 사용하였을 때 강압 및 단백뇨 감소 효과가 우수한 것으로 보고되었으나, 현재 국내에는 도입되어 있지 않다. 메틸도파는 임신부의 고혈압 치료에서 여전히 선호되는 항고혈압제이나 국내에는 도입되어 있지 않다. 혈관확장제인 히드랄라진(hydralazine)은 임신부 고혈압에 비교적 안전하게 사용할 수 있으나, 현재 경구 약제는 국내에 없으며 정맥 제제는 희귀 필수의약품센터(Korea Orphan & Essential Drug Center, KOED, https://www.kodc.or.kr/index)를 통하여 제한적으로 사용할 수 있다."], ["p", "SGLT2 억제제인 다파글리플로진(dapagliflozin)과 엠파글리플로진(empagliflozin)는 신장의 근위곱슬세관(proximal convoluted tubule)에 위치한 나트륨-포도당 공동수송체 2를 억제하여 요당의 재흡수를 차단하고 나트륨 이뇨 작용을 나타낸다. 이로 인해 요당 배설 증가를 통해 하루 약 280-320 kcal의 에너지 손실이 발생하여 체중이 2-3kg 정도 감소 효과가 보고되었으며, 메타 분석에 따르면 당뇨병이 동반된 고혈압환자에서 혈압 감소 효과가 확인되었으며, 수축기혈압 4.53 mmHg, 이완기혈압은 2.12 mmHg 감소하였다. 또한 당뇨병이 없는 경우를 포함한 메타분석에서 24시간 활동혈압 감소 효과는 수축기혈압은 3.76 mmHg, 이완기혈압은 1.83 mmHg 감소로 보고되었다. 이에 따라 SGLT2 억제제는 항고혈압제로서 단독 요법으로 사용하기에는 제한적이나, 당뇨병이나 심부전이 동반된 고혈압환 자에서 이차 예방 목적으로 사용이 권고되며, 일부 혈압 강하 효과와 더불어 대사적 이점을 고려하여 사용을 권고한다."], ["p", "비스테로이드성 미네랄코티코이드수용체길항제(nonsteroidal mineralocorticoid receptor antagonist, 비스테로이드성 MRA)는 기존 MRA와 분자구조가 다르면서 알도스테론 수용체를 좀 더 특이적으로 길항하는 약제이다. 이로 인해 고칼륨혈증의 발생 위험이 상대적으로 낮고, 호르몬 교란에 따른 부작용인 남성의 여성형 유방 비대와 여성의 월경 이상 발생이 적다. 혈압 강하 효과와 관련하여 에사세레논(esaxerenone)은 위약 대비 유의한 혈압 강하 효과를 보였으며 463, 그 효과는 에플레레논(eplerenone)과 유사한 수준으로 보고되었다. 피네레논(finerenone)은 혈압 강하 효과를 일차 평가변수(primary end point)로 한 연구는 없으나, 당뇨병 및 만성콩팥병 환자를 대상으로 한 임상시험에서 수축기혈압을 약 2.7 mmHg 감소시키는 효과를 보였다. 이와 같이 수축기혈압 감소 효과는 충분하지 않아 일차적인 혈압 강하제로서의 사용은 제한적이나, 당뇨병, 만성콩팥병, 심부전 환자에서 콩팥 및 심혈관 보호 효과가 입증되었다. 따라서 비스테로이드성 MRA는 일관된 혈압 강하 효과가 입증되지는 않았으나, 동반된 심혈관 위험도를 고려할 때 일 부 고혈압환자에서 사용을 고려할 수 있으며, 향후 난치성(혹은 저항성)고혈압을 포함한 추가 연구가 필요하다."], ["p", "알도스테론합성효소억제제(aldosterone synthase inhibitor)는 알도스테론 합성의 최종 단계에 관여하는 CYP11B2 효소(aldosterone synthase)를 선택적으로 억제하여 알도스테론 생성을 감소시킴으로써 혈압을 낮추는 새로운 계열의 항고혈압제이다. 박스드로스타트(baxdrostat)와 로룬드로스타트(lorundrostat)은 2제 이상의 항고혈압제를 사용함에도 불구하고 목표 혈압에 도달하지 못한 고혈압환자를 대상으로 한 위약 대조 임상시험에서 위약 대비 7-8 mmHg의 추가적인 혈압 강하 효과가 확인되었다. 이상반응은 전반적으로 허용 가능한 수준이었으나, 고칼륨혈증의 발생률은 다소 높게 나타났다. 이들 약물은 만성콩팥병을 동반하여 2제 이상의 항고혈압제를 투여함에도 혈압 조절이 어려운 난치성(혹은 저항성)고혈압환자의 새로운 치료 약제로 고려되고 있으며, 알도스테론 억제에 따른 심장, 혈관, 신장 보호 효과를 평가하기 위한 다양한 임상 연구가 진행 중이다."], ["h", "12.3. 병용요법"], ["p", "고혈압환자의 3분의 2 이상은 단일 고혈압 약제로 충분히 혈압이 조절되지 않으며, 이 경우 기전이 서로 다른 두 가지 이상의 항고혈압제 약제가 필요하다. 특히 치료 기간이 길수록, 임상적 위험도가 높거나 목표 혈압이 낮은 환자일수록 이러한 경향이 더욱 뚜렷하다. 초기 일차 약제에 효과가 없는 경우에는 다른 계열의 약제로 교체하고, 일부 효과는 있으나 목표 혈압에 도달하지 못하는 경우에는 용량 증량보다는 서로 다른 기전의 약제를 추가한다. 일반적으로 항고혈압제는 단일 약제의 용량을 증량하기보다는 서로 다른 기전의 약제를 저용량으로 병용하는 것이 혈압 강하 효과와 치료 지속성을 높이면서 부작용을 최소화할 수 있다."], ["p", "따라서 80세 이하의 고혈압환자 중 2기 고혈압이거나 고위험 1기 고혈압에 해당되는 경우에는 초기부터 2제 병용요법을 고려하는 것이 권고된다. 반면, 80세 이상이거나 노쇠한 환자의 경우에는 부작용 발생 위험을 고려하여 단일 약제로 치료를 시작하는 것을 고려한다<그림 16>."], ["cap", "그림 16. 고혈압 정도와 심뇌혈관질환 위험도에 따른 단일 또는 병용약의 선택"], ["p", "고혈압 정도와 심뇌혈관 위험평가 단일 약제로 혈압이 충분히 조절되지 않는 경우, 이후 치료 전략에서는 약제 병용요법이 중요하다. 일반적으로 기전이 다른 두 가지 항고혈압제를 병용하는 것은 단일 약제의 용량을 증량하는 것보다 혈압 조절 효과가 우수하며, 대부분의 병용요법은 허용된다. 다만 어떤 병용 전락이 장기적으로 가장 우수한 임상적 이점을 제공하는지에 대한 연구는 아직 충분하지 않다. 현재까지의 근거에 따르면 RAS 억제제, 칼슘통로차단제, 이뇨제 중 두 가지를 병용하는 2제 병용 요법이 비교적 우수한 효과를 보여 우선적으로 권장되며, 이러한 2제 병용요법으로도 혈압이 충분히 조절되지 않는 경우에는 RAS 억제제, 칼슘통로차단제, 이뇨제를 포함한 3제 병용요법을 통해 많은 환자에서 목표 혈압 이하로 조절 할 수 있다. 베타차단제는 명확한 적응증이 있는 경우 다른 기전의 항고혈압제와 병용하여 사용할 수 있으나<그림 17>, 베타차단제와 이뇨제의 병용은 당뇨병 및 대사 이상 발생 위험을 증가시킬 수 있으므로 추가적인 모니터링이 필요하다. 또 ACE억제제와 ARB병용과 같이 유사한 기전의 약제를 함께 사용하는 경우, 단백뇨 감소에는 일부 효과가 있을 수 있으나 만성콩팥병 악화가 오히려 증가하므로 피하는 것이 바람직하다."], ["cap", "그림 17. 권장되는 병용요법"], ["h", "12.3.1. 단일제형복합요법"], ["p", "두가지 이상의 항고혈압제 성분을 하나의 제형에 포함한 단일제형복합제(single-pill combination)는 항고혈압 치료의 지속성을 향상시키고, 개별 약제를 병용하는 방식에 비해 더 우수한 치료 결과를 얻는 데 도움이 될 수 있다. Gupta등이 수행한 메타분석에서 단일제형복합제는 개별 약제 병용요법에 비해 약물치료 지속성을 유의하게 향상시켰으며 (odds ratio 1.21, 95% CI: 1.03-1.43, P=0.02), Parati 등의 메타분석에서도 단일제형복합제가 개별 약제 병용 요법에 비해 수축기혈압(-3.99 mmHg, 95% CI: -7.92 - -0.07, P=0.05)과 이완기혈압(-1.54 mmHg, 95% CI: 방식에 비해 비용 절감 효과를 효과를 보이는 것으로 나타났다 단일제형복합제는 통상적인 시작 용량 <부록 2>에 따라 초저용량, 저용량, 표준용량, 그리고 고용량 단일제형복합제로 나눌 수 있다<표 17> 최근에는 초저용량 단일제형복합제를 기반으로 초저용량 3제 단일제형복합제(Ultralow-dose triple combination), 초저용량 4제 단일제형복합제 Ultralow-dose quadruple combination) 제제가 개발이 되고 있다. 이러한 제제들은 표준 용량의 단일 제제보다 혈압 강하 효과가 우수하면서도 부작용 빈도는 증가하지 않아 향후 고혈압 치료에서의 적용 가능성이 주목되고 있다."], ["cap", "표 17. 단일제형복합제의 분류와 정의"], ["h", "12.4. 난치성(혹은 저항성)고혈압"]], "33": [["p", "난치성(혹은 저항성)고혈압환자에서 약물치료로 혈압 조절이 어려운 경우, 콩팥교감신경차단술 (renal sympathetic denervation)을 고려할 수 있다. 일반적인 항고혈압 약물치료에도 혈압이 충분히 조절되지 않아 지속적인 치료적 개입이 필요한 상태를 조절하기 어려운 고혈압(difficult-to-control hypertension 혹은 uncontrolled hypertension)이라 하며, 대한고혈압학회에서는 이를 `난치성 고혈압’으로 통칭한다. 임상 연구에서는 통상 2제 이상 항고혈압제를 사용함에도 목표 혈압에 도달하지 못하는 경우로 정의하며, 학문적으로는 이뇨제를 포함한 3제 이상의 항고혈압제 치료에도 목표 혈압에 도달하지 못하는 저항성 고혈압(resistant hypertension)과 5제 이상의 항고혈압제 치료에도 목표 혈압에 도달하지 못하는 불응성 고혈압(refractory hypertension)을 모두 포함하는 포괄적 개념으로 정의할 수 있다."], ["p", "외국 보고에 따르면 치료 중인 환자에서 저항성 고혈압의 유병률은 5~30%로 보고되었는데, 가성저항성 고혈압을 혈압환자에서는 심뇌혈관질환 및 콩팥 질환 합병증의 발생 위험이 더 높다."], ["p", "난치성(혹은 저항성)고혈압의 발생 원인은 다양하나<표 19>, 고혈압약을 치료 계획대로 복용하지 않는 치료 지속성 부족이 가장 흔한 원인이다. 또한 감기약, 비스테로이드성 소염진통제, 부신 피질 스테로이드, 피임제 등의 약물 사용과 과도한 소금 섭취, 과음도 원인이 될 수 있다. 고혈압 약제에 이뇨제가 포함되지 않은 경우에는 용적 과부하로 인해 난치성(혹은 저항성)고혈압이 발생할 수 있으며, 이차성 고혈압이 원인일 수도 있다."], ["p", "난치성(혹은 저항성)고혈압을 진단할 때는 먼저 약제에 대한 치료 지속성을 확인하고, 가정혈압이나 활동혈압 측정을 통해 백의 효과(백의비조절고혈압)을 배제한 후 난치성(혹은 저항성)고혈압의 원인을 규명하여야 한다. 이후 혈압 상 승을 유발하는 생활 습관이나 약제가 있을 경우 이를 교정하고, 이차성 고혈압에 대한 선별 검사를 시행해야 한다. 특 히 이차성 고혈압 중에서는 일차성 알도스테론증의 빈도가 가장 높은 것으로 알려져 있다. 또한 난치성(혹은 저항성) 고혈압환자에서는 수면무호흡증의 유병률이 높으므로 이에 대한 확인과 치료를 고려한다<표 18>."], ["p", "서로 다른 작용 기전의 3가지 약제를 충분한 용량으로 사용했음에도 혈압이 조절되지 않는 경우에는 이뇨제 용량을 증 량하거나 종류를 변경하며, 콩팥기능이 저하된 경우에는 티아지드계 이뇨제 대신 고리작용이뇨제를 사용한다. 난치성 (혹은 저항성)고혈압환자의 치료에서 일차적으로 추가해볼 수 있는 약제는 PATHWAY-2 연구 및 메타분석 결과들 을근거로 할 때 알도스테론 길항제인 MRA 중 스피로놀락톤이 우선적으로 권유되나, 스피로놀락톤은 여성형 유방 등의 부작용으로 10% 내외의 환자에서 복용이 어려울 수 있다는 제한점이 있다. 스피로놀락톤이 금기이거나 치료 효과가 제한적인 경우에는 비소프로롤(bisoprolol), 독사조신(doxazocin), 클로니딘(clonidine) 등이 대체 약물로 사용될 수 있다. 최근 난치성(혹은 저항성)고혈압환자에서 스피로놀락톤 대비 아밀로라이드(amiloride)가 동등한 혈압 강하 효과와 안정성을 확인한 연구 결과가 보고되어 스피로놀락톤을 사용이 어려운 경우에는 아밀로라이드 추가를 고려한다. 스피로놀락톤 또는 아밀로라이드 투여와 관련하여 발생하는 고칼륨혈증은 만성콩팥병이 동반된 환자에서 더 흔하며, ACE 억제제 또는 ARB를 복용 중인 환자에게 특히 증가할 수 있다. 따라서 스피로놀락톤 또는 아밀로라이드 치료를 시작한 후 1-2주 이내에 혈청 칼륨 수치를 확인해야 한다<그림 18>."], ["p", "최근 난치성(혹은 저항성)고혈압의 추가적인 혈압 강하에 도움을 주는 약제와 시술들이 개발되어 그 효과가 확인되고 있다. 난치성(혹은 저항성)고혈압환자에서 ACE 억제제나 ARB를 사용하고 있음에도 혈압 조절이 불충분한 경우, ARNI로의 변경을 추가 강압 전략으로 고려할 수 있다. 사쿠비트릴/발사르탄은 기존 ARB에 비해 수 mmHg 이상 의 추가적인 수축기혈압 강하 효과를 나타내었으며, 동맥경직도를 유의하게 개선하는 효과가 보고되었다 496. 또한 일부의 난치성(혹은 저항성)고혈압 환자 및 심부전을 동반한 난치성(혹은 저항성) 고혈압환자에서 잠재적 이점이 제시되고 있다."], ["p", "난치성(혹은 저항성)고혈압의 병태생리에 RAAS의 과활성, 특히 과도한 알도스테론 분비가 핵심적으로 관여한다는 점을 고려할 때, 알도스테론합성효소억제제(aldosterone synthase inhibitor, ASI)는 난치성(혹은 저항성) 고혈압의 새로 운 치료 옵션으로 고려될 수 있다. 박스드로스타트(baxdrostat), 로룬드로스타트(lorundrostat) 등 신세대 ASI는 선택 적으로 CYP11B2를 억제하여 혈장 알도스테론을 감소시키면서 코르티솔 합성에 대한 영향은 최소화하도록 설계되었 으며, 초기 임상시험에서 저항성 또는 조절 불량 고혈압환자에서 의미 있는 수축기혈압 감소를 보여주었다. 다만 이들 약제는 아직 장기 안전성 및 심혈관·콩팥 기능에 미치는 예후에 대한 근거가 축적되고 있는 단계에 있으며, 고칼륨혈증, 콩팥 기능 변화, 스테로이드 합성 저해와 관련된 잠재적 부작용을 면밀히 모니터링해야 한다. 따라서 알도 스테론합성효소억제제는 기존 이뇨제 및 MRA 등 표준 치료를 충분히 최적화한 후 임상시험 근거와 허가 범위를 고려 하여 제한적으로 사용을 검토하는 것이 바람직하다."], ["cap", "그림 18. 난치성(혹은 저항성)고혈압의 진단 및 치료 알고리즘"], ["cap", "표 18. 난치성(혹은 저항성)고혈압의 감별 진단"], ["h", "12.5. 콩팥교감신경차단술"], ["p", "콩팥교감신경차단술(renal sympathetic denervation)은 약물치료 없이 카테타를 이용하여 콩팥 주위의 교감신경을 차단함으로써 혈압을 낮추는 시술을 의미한다. 과거에는 단기 효과에 대한 명확한 근거가 부족하고 장기 효과 또한 충분히 규명되지 않아 권장하기 어려웠으나, 최근 발전된 고주파 및 초음파 카테터를 기반으로 한 연구들에서 난치성 효과가(혹은 저항성)고혈압을 포함한 다양한 환자 군에서 항고혈압제 복용 여부와 관계없이 콩팥교감신경차단술의 혈 압 강하 확인되었다. 이에 따라서 콩팥교감신경차단술은 진성 난치성(혹은 저항성)고혈압환자에서 하나의 치료 옵션 으로 고려할 수 있다."], ["p", "그러나 혈압 강하 효과의 크기가 제한적이라는 점, 비용대비 효과 측면, 그리고 심뇌혈관질환 발생 감소와 관련된 장기 예후 근거가 아직 충분하지 않다는 점은 제한점으로 남아있다. 따라서 콩팥교감신경차단술은 고혈압의 근치적 치료나 항고혈압제의 완전한 대체 요법으로 간주되어서는 안되며, 최적의 항고혈압 약물치료에도 불구하고 약물 부작용으로 치료 유지가 어려운 성인 난치성(혹은 저항성)고혈압환자에서 제한적으로 시행하는 것이 바람직하다."], ["h", "12.6. 고혈압 약의 감량 또는 중단"], ["p", "고혈압 약물 감량 또는 중단에 대한 다양한 연구 결과를 종합해보면, 일부 환자에서는 엄격한 조건과 면밀한 모니터링 하에 약제를 감량하거나 중단할 수 있는 가능성이 제시되고 있다.(ADVANCE) 연구의 하위 분석에서는 당뇨병 환자 에서 혈압약을 중단할 경우 미세 및 대혈관 합병증 위험이 증가한다고 보고하였다."], ["p", "반면, 고령 환자나 일반 고혈압환자를 대상으로 한 여러 메타분석 및 전향적 관찰연구에서는 상황에 따라 약물 중단이 비교적 안전할 수 있다는 결과도 보고되었다. 예를 들어, 코크란 체계적 문헌 고찰(Cochrane systemic review)과 스웨덴에서 시행된 5년 추적 관찰 연구에서는 고령자에서 정기적인 혈압 모니터링과 생활요법을 병행할 경우 약물 중단이 가능함을 보여주었다."], ["p", "또한 영국의 3년 추적 관찰 연구에서는 약 20%의 환자가 약제 중단 후 특별한 문제없이 지낼 수 있었지만, 모든 연구에서 중단 후 면밀한 추적 관찰의 중요성이 강조되었다. 국내 연구에서도 혈압이 잘 조절되는 젊은 환자에서 약제를 중단한 후 6개월동안 정상 혈압을 유지한 비율이 21%에 달하였다. ESH 2023 고혈압 진료지침 역시 일부 환자에서 약물 중단이 심혈관 위험 증가로 이어질 수 있으나, 반드시 그런 것은 아니며, 약제 종류에 따라 위험도가 다를 수 있음을 언급하였다."], ["p", "따라서 혈압이 장기간 안정적으로 조절되고 생활요법을 철저히 시행하는 일부 환자에서는 약물 감량 또는 중단을 신중히 고려할 수 있으며, 이후 최소 3개월 간격으로 정기적인 혈압 측정과 생활요법 이행 여부에 대한 점검이 필요하다."], ["h", "12.7. 기타 약물치료"], ["p", "고혈압 치료의 목적은 전체 심뇌혈관질환 위험도를 감소시키는데 있으므로, 환자가 가지고 있는 다른 위험인자들도 동시에 관리해야 한다. 이때 주로 고려해야 할 사항은 당뇨병, 이상지질혈증, 관상동맥질환, 뇌졸중, 콩팥 질환이다."], ["h", "12.7.1. 항혈소판제"]], "34": [["p", "고혈압환자에서 항혈소판제 치료의 권고 여부는 개별 환자의 심혈관 위험도에 근거하여 결정되어야 하며, 1차 예방 혹은 2차 예방의 목적과 출혈 위험도를 고려하여 판단해야 한다."], ["p", "기존 심혈관질환이 있는 환자에서 저용량 아스피린은 위장관 출혈 위험 증가와 관련이 있으나, 주요 심혈관 사건을 유의하게 감소시키는 효과가 입증되어 있어 2차 예방목적으로 저용량 아스피린 사용을 권고한다."], ["p", "코크란 체계적 문헌고찰에서는 총 61,015명의 고혈압환자를 대상으로 항혈소판제 및 항응고제의 효과를 평가하였다. 이 가운데 41,695명은 1차 예방과 관련된 4개 연구에, 19,320명은 2차 예방과 관련된 2개 연구에 포함되었다. 저용량 아스피린과 위약을 비교한 1차 예방 관련 연구 결과, 두 군간의 전체 사망률 또는 심혈관 사망률에는 유의한 차이가 없었으나, 아스피린 치료군에서는 비치명적 심혈관 사건의 위험이 감소하였다. 그러나 아스피린 치료 군에서 주요 출혈 위험이 증가하였으며, 이에 따라 고혈압환자의 1차 예방 측면에서 항혈소판 요법의 보호 효과에 대한 근거는 현재까지 충분하지 않는다고 결론지었다."], ["p", "HOT 연구결과에서는, 이전에 심혈관 사건이 없었으나 진행된 콩팥 질환으로 인해 고위험 심혈관질환으로 분류된 일부 하위집단에서 저용량 아스피린의 보호 효과가 제한적으로 관찰되었다."], ["p", "2019년 발표된 AHA/ACC의 심혈관질환의 1차 예방을 위한 가이드라인에서 70세 이상 성인이나 출혈 위험이 높은 환자에게 아스피린의 일상적인 1차 예방 사용을 권고하지 않는 반면, 출혈 위험이 높지 않으면서 심혈관 위험이 높은 40세에서 70세 사이의 성인에게는 아스피린 사용을 고려할 수 있다고 제안하였다."], ["h", "12.7.2. 지질강하제"]], "35": [["p", "본 진료지침에서의 스타틴 사용은 한국지질·동맥경화학회(KSoLA)의 이상지질혈증 진료지침에서 제안한 위험 기반 지질 강하 치료 개념을 따른다. 동반 위험인자가 없는 고혈압 전단계나 1기 고혈압 환자에게는 우선적으로 생활습관 개선을 권고하여 LDL-콜레스테롤 수치를 160mg/dL 이하로 낮추도록 노력한다. 죽상경화성 허혈성 뇌졸중 및 일과성 뇌허혈 발작, 경동맥질환, 말초동맥질환, 복부 대동맥류, 또는 당뇨병 환자는 LDL-콜레스테롤 수치를 70mg/dL 이하로 낮춘다. 관상동맥질환이 있으면 LDL-콜레스테롤 수치를 55mg/dL 이하로 낮춘다. 고혈압 환자에서 동반 위험인자가 1개 이상 이면서 상기 분류에 해당되지 않는 경우 LDL-콜레스테롤 수치를 130mg/dL 이하로 낮춘다."], ["p", "ASCOT 연구에서는 고혈압과 중등도 심혈관 위험을 가진 환자에서 하루 10 mg의 아토르바스타틴(atorvastatin) 치료가 복합 심혈관 사건의 위험을 36% 감소시키는 것으로 보고되었다. 다수의 무작위대조시험과 메타분석에서도 스타틴 치료는 LDL-콜레스테롤 감소 정도에 비례하여 심혈관 사건 위험을 감소시키는 것으로 확인되었다."], ["p", "최근에는 에제티미브와 PCSK9(Proprotein converase subtilisin/kexin type 9) 억제제에 대한 무작위대조시험 결과가 축적되면서, LDL-콜레스테롤 감소가 심혈관 보호에 효과적이라는 근거가 더욱 강화되고 있다. 특히, 중등도 심혈관 위험을 가진 환자에서도 지질 강하 치료의 이점은 혈압 수치와 무관하게 나타나는 것으로 보고되었으며, 고혈압환자에서는 전반적인 심혈관질환 발생 위험이 높아 그 효과가 더욱 뚜렷하게 나타난다."], ["p", "ASCOT515 및 HOPE-3 연구 결과에 근거하여, 고혈압이 있으면서 심혈관질환의 위험이 높은 환자에서는 중등 용량의 스타틴 치료를 권고한다. 한편, 고위험 또는 초고위험으로 분류되어 집중적인 LDL-콜레스테롤 강하 치료가 필요한 고혈압환자에서는, 심혈관 예방을 위한 목표 LDL-콜레스테롤 수치를 달성하기 위해 스타틴을 최대 내약 용량까지 증량하는 것이 필요하다."], ["p", "최신 이상지질혈증 진료 지침에 따르면, LDL-콜레스테롤 조절이 목표에 도달하지 못한 경우 에제티미브 추가를 권고하며, 약물치료 지속성을 높이기 위해 가능하면 단일제형복합제 형태로 사용하는 것이 바람직하다. 또한, 초고위험군 환자에서는 LDL-콜레스테롤 목표치를 달성하기 위해 PCSK9 억제제를 고려할 수 있다."], ["h", "12.7.3. 혈당 조절"]], "36": [["p", "당뇨병의 미세혈관 및 대혈관합병증을 예방하기 위해서는 적극적인 혈당 조절이 필요하다. 2형당뇨병 성인 환자의 일반적인 혈당 조절 목표는 당화혈색소 6.5% 미만이다. UKPDS에서는 철저한 혈당 조절이 미세혈관합병증을 예방하는데 효과가 있음이 입증되었으며, ADVANCE 연구에서는 미세혈관합병증을 최소화하기 위한 당화혈색소 목표치를 6.5% 미만으로 분석하였다. 그러나, 혈당조절 목표는 유병 기간, 저혈당 위험, 사용 약물, 기대 여명, 주요 동반질환, 개인 선호도, 활용 가능한 자원 등 환자의 특성을 반영하여 개별적으로 설정해야 한다."], ["p", "심혈관질환이 있거나 심혈관 위험인자를 가진 2형당뇨병환자에서 SGLT2 억제제(엠파글리플로진, 다파글리플로진)는 심부전으로 인한 입원 위험을 약 30% 정도 유의하게 감소시키는 결과를 보여주어서, 심부전이 동반된 경우 SGLT2 억제제 사용을 권고한다. 또한 SGLT2 억제제로 치료한 무작위대조시험 및 메타분석에서 알부민뇨 감소, 추정사구체 여과율 감소 억제, 말기콩팥질환으로의 진행 억제 효과가 확인되어, 알부민뇨가 있거나 추정사구체 여과율이 감소한 경우에도 SGLT2 억제제 사용을 권고한다. 다만 SGLT2 억제제 사용 시 탈수, 혈액량 저하증, 생식기감염증, 드물지만 당뇨병성 케토산증 발생 위험에 유의해야 한다."], ["p", "글루카곤 유사 펩타이드-1 수용체 작용제(Glucagon-like peptide-1 receptor agonist, GLP-1 수용체작용제)인 리라글루타이드(liraglutide), 둘라글루타이드(dulaglutide), 세마글루타이드(semaglutide) 등은 기저 죽상동맥경화성 심혈관질환이 동반된 2형당뇨병환자에서 비치명적 심근경색, 비치명적 뇌경색, 사망으로 구성된 3대 주요 심혈관사건의 위험을 감소시키는 효과를 보여준 무작위대조시험들이 보고되었다. 또한 죽상동맥경화성 심혈관질환을 동반한 당뇨병환자에서 SGLT2 억제제 사용이 주요 심혈관질환 및 심혈관질환으로 인한 사망, 그리고 심부전으로 인한 입원 위험을 감소시킴을 보여주는 메타분석 결과가 보고되었다. 따라서 죽상동맥경화성 심혈관질환이 동반한 경우에는 GLP-1 수용체작용제 혹은 SGLT2 억제제를 포함한 치료를 권고한다."], ["h", "12.8. 환자 모니터링과 추적 관찰"]], "37": [["p", "새로 약제를 시작하였거나 약제의 용량 또는 복용 시간을 조정한 경우에는 치료 지속성과 혈압 조절 여부를 평가하기 위해 목표 혈압에 도달할 때까지 2-4주 간격으로 추적 관찰을 권고한다. 2기 이상의 고혈압환자에서는 보다 자주 추적 관찰할 수 있다. 전해질 및 콩팥 기능 검사는 최소 년 1-2회 시행하는 것을 고려한다."], ["p", "목표 혈압에 도달하고 혈압이 지속적으로 안정적인 경우에는 3-6 개월 간격으로 추적 관찰을 고려한다. 추적 관찰 간격이 길어질수록 환자의 치료 지속성이 저하되는지 여부를 모니터링하고, 혈액 검사가 누락되지 않도록 유의해야 한다."], ["p", "또한 가정혈압 측정을 권고함으로써 추적 관찰 간격이 길어지는 경우에도 혈압 조절 상태를 평가하는데 도움을 받을 수 있다."], ["h", "12.9. 치료 지속성"]], "38": [["p", "고혈압의 치료에서는 환자-의사 간 신뢰가 매우 중요하며, 혈압 치료 계획 수립 과정에 환자가 적극적으로 참여하도록 유도하는 공유의사결정(shared decision making)을 함으로써 약물치료 지속성을 높일 수 있다. 약물치료 지속성을 향상시키기 위해서는 약물과 관련된 이상반응을 확인하고, 복잡한 복약 일정보다는 하루 1회 복용이 가능한 장기 지속형 약물을 사용하는 것이 바람직하다. 가능하면 단일제형복합제를 사용하며, 장기적으로는 가족의 지지나 의료시스템을 활용한 적절한 교육이 약물치료 지속성 향상에 도움이 된다. 또한 환자가 자동혈압계를 활용하여 스스로 측정한 혈압 수치를 바탕으로 의사와 상담할 경우 치료 과정에 대한 참여도가 높아져 치료 지속성이 향상될 수 있다."], ["h", "13.1. 백의고혈압 및 가면고혈압"]], "39": [["h", "13.1.1. 백의고혈압과 가면고혈압의 정의"], ["p", "고혈압환자에서는 진료실혈압과 진료실 밖 혈압을 병행하여 측정함으로써 다양한 고혈압의 표현형(phenotypes)을 분류할 수 있다. 항고혈압 약제를 복용하지 않는 경우, 정상혈압(true Normotension), 백의고혈압(white- coat hypertension, WCH), 가면고혈압(masked hypertension, MH), 지속성고혈압(sustained hypertension)의 네 가지로 분류한다. 한편 항고혈압제를 투여 중인 환자에서는 조절고혈압(controlled Hypertension), 백의비조절고혈압 (white-coat uncontrolled Hypertension, WUCH, 또는 white-coat effect), 가면비조절고혈압(masked uncontrolled hypertension, MUCH), 비조절고혈압(uncontrolled hypertension)의 네 가지 표현형으로 분류한다."], ["p", "백의고혈압 또는 백의비조절고혈압은 진료실혈압은 높고, 진료실 밖 혈압은 정상인 경우로 정의되며, 가면고혈압 또는 가면비조절고혈압은 이에 반대로 진료실혈압은 정상이나, 진료실 밖 혈압이 높은 경우로 정의된다. 정상혈압은 진료실혈압 140/90 mmHg 미만이고, 가정혈압 또는 주간 활동혈압이 135/85 mmHg 미만이거나 24시간 평균활동혈압이 130/80 mmHg 미만인 경우로 정의된다. 조절고혈압은 목표혈압이하로 조절되는 경우를 의미 하며 지속형고혈압 또는 비조절고혈압은 진료실혈압과 진료실 밖 혈압이 모두 높은 경우를 의미한다,72<그림 19>."], ["cap", "그림 19. 진료실혈압과 진료실 밖 혈압을 이용한 고혈압의 분류"], ["h", "13.1.2. 백의고혈압과 백의비조절고혈압"], ["p", "백의고혈압은 진료실에서 일시적 혈압 상승이 나타나는 상태로, 의사가 혈압을 측정 시 발생하는 경보 반응(alarm reaction)에 기인한다. 이로 인해 혈압이 과대평가되어 불필요한 치료가 시행되거나 약물 부작용의 위험이 증가할 수 있다. 이러한 현상은 단기간 내 반복 측정으로 해소되지 않으며, 간호사가 혈압을 측정을 측정할 경우 의사가 측정할 때보다 상대적으로 혈압 상승이 적게 나타날 수 있다. 외국 보고에 따르면 백의고혈압의 빈도는 15~30%로 알려져 있으며, 치료 중인 환자에서 백의비조절고혈압의 빈도는 30~40%에 이르는 것으로 보고된다 123,555,563. 대한고혈압학회의 활동혈압모니터 등록 사업에 따르면 2차 및 3차 의료기관을 대상으로 분석한 결과, 백의고혈압과 백의비조절고혈압의 빈도는 각각 14.9%와 13.5%로 보고되었다."], ["p", "백의고혈압 및 백의비조절고혈압은 여성, 고령자, 비흡연자, 임신부, 체질량지수가 낮은 경우, 그리고 진료실 수축기 혈압이 150 mmHg 미만인 경우에 더 흔하게 나타나는 것으로 알려져 있다. 반면, 고혈압으로 인한 장기 손상이 동반된 환자에서는 그 빈도가 상대적으로 낮은 것으로 보고되었다."], ["p", "백의고혈압은 정상혈압보다 대사 이상(혈당, 지질, 요산 등)이 더 많고, 심혈관질환의 위험도가 높으며, 기저에 장기 손상이 동반되지 않은 경우라도 장기 추적 관찰에서 사망률과 고혈압으로 인한 장기 손상 발생 위험이 증가하는 것으로 보고되었다. 또한 지속형고혈압으로의 이행 가능성을 가진다. 이러한 이유로 백의고혈압환자는 정기적인 혈압 측정, 대사 이상 검사, 심혈관질환 및 고혈압으로 인한 장기 손상 위험에 대한 추적관찰이 필요하며 생활습관 개선이 필요하다,554."], ["p", "백의고혈압환자만을 대상으로 한 약물치료 연구는 부족하나, 심혈관질환 위험이 높거나 동반된 장기 손상이 있는 경우 치료를 고려할 수 있다."], ["p", "고혈압 치료 중 백의비조절고혈압은 정상혈압과 비교하여 심혈관질환의 위험이 유의하게 증가하지 앉는 것으로 보고 되었으나, 난치성(혹은 저항성)고혈압으로 오인될 수 있어 주의가 필요하다. 약물 용량 증량이 혈압 조절에 도움을 줄 수 있다는 보고는 있으나, 백의비조절고혈압환자만을 대상으로 한 약물 연구는 제한적이며, 이에 따른 치료 전략에 대한 근거는 아직 명확하지 않다."], ["p", "따라서, 백의고혈압 및 백의비조절고혈압은 정확한 진단을 위해서는 진료실혈압 외에 활동혈압 측정 또는 가정혈압 측정이 필수적이며, 이들 혈압 이상은 재현성이 낮고, 측정 환경에 따라서 변동성이 크므로 진단을 위해 반복 측정을 시행할 것을 권고한다. 또한, 불필요한 약물치료 및 그로 인한 부작용을 방지하기 위해, 치료 시작 또는 용량 조절 전 백의고혈압 및 백의비조절고혈압을 여부를 반드시 배제해야 한다."], ["h", "13.1.3. 가면고혈압과 가면비조절고혈압"], ["p", "가면고혈압 및 가면비조절고혈압은 진료실혈압은 정상 범위이나 진료실 밖 혈압이 상승된 상태로, 일반 진료 환경에서 간과되기 쉽고, 조기 진단이 어려우며, 조절된 고혈압으로 오인되어 적절한 치료가 지연될 가능성이 높다."], ["p", "외국 보고에 따르면 가면고혈압의 빈도는 일반 인구에서 9~30%로 보고되었으며, 치료 중인 환자에서의 록 사업 자료에 따르면 가면고혈압의 빈도는 17.6% 이며, 치료 중 가면비조절고혈압의 빈도는 13.0%로 나타났다."], ["p", "가면고혈압 및 가면비조절고혈압은 젊은 연령, 남성, 흡연, 음주, 사회심리적 요인, 직무 스트레스, 높은 신체 활동, 당뇨병, 만성콩팥병, 수면무호흡증 등과 밀접한 관련이 있는 것으로 보고되었다. 대한고혈압학회 활동혈압모니터 등록사업에서는 치료 중 진료실혈압은 정상이나 24시간평균활동혈압이 130/80 mmHg 이상을 기준으로 가면비조절 고혈압을 정의하였을 때 이상지질혈증, 뇌졸중 과거력, 좌심실 비대, 수축기혈압 130~139 mmHg, 적은 수의 항고혈압제 사용과 유의한 연관성이 있는 것으로 보고하였다."], ["p", "가면고혈압은 지속성고혈압과 유사하거나 더 불량한 예후를 보일 수 있으며, 향후 지속성고혈압으로 이행할 가능성도 보고되었다. 치료 중 가면비조절고혈압은 조절고혈압환자에 비해 진료실 밖 혈압 변동성이 크고 심박수 변동성은 낮으며, 교감신경계 활성도 증가 등과 같은 생리적 특성을 보이며, 불량한 예후와 관련되는 것으로 알려져 있다. 또한 가면고혈압 및 가면비조절고혈압은 진료실 밖 혈압 측정 방법(활동혈압 또는 가정혈압)에 무관하게 불량한 예후와 유의한 연관성을 보인다."], ["p", "현재까지 가면고혈압을 선별하기 위한 명확하고 표준화된 검사 기준은 부족한 실정으로, 발생 위험도가 높은 고위험군을 중심으로 한 선별적 접근이 필요하다. 고위험군에서는 진단을 위해 진료실혈압 뿐 아니라, 활동혈압 또는 가정혈압과 같은 진료실 밖 혈압 측정을 적극적으로 활용하는 것이 필요하며, 혈압 측정의 재현성이 낮을 수 있으므로 반복 측정이 권장된다."], ["p", "아직까지, 가면고혈압 및 가면비조절고혈압의 치료 효과에 대한 임상적 근거는 충분하지 않으며, 일부 연구에서는 가면고혈압환자에서 약물치료가 고혈압에 의한 장기 손상을 개선시킬 수 있음이 보고되어 치료의 필요성이 제기되고 있다. 그러나, 심혈관 합병증 예방에 대한 장기적인 이점에 대해서는 아직 아직 추가적인 근거가 필요한 상황이다."], ["h", "13.2. 야간고혈압과 아침고혈압"], ["p", "야간고혈압(nocturnal hypertension)은 수면 중 혈압이 120/70 mmHg 이상인 경우로 정의되며, 서구인에 비해 동양인에서 더 흔하게 관찰된다. 야간고혈압의 발생 원인으로는 과도한 교감신경계 활성, 높은 소금 섭취 및 염분 감수성, 음주, 수면 자세에 따른 정맥 환류 증가, 수면의 질 저하, 심부전 및 신부전 등 진행된 장기 손상, 수면무호흡증, 작용시간이 짧은 항고혈압제의 사용 등이 제시되고 있다."], ["p", "야간고혈압은 24시간 활동혈압 측정을 통해 진단할 수 있으며, 가정혈압 측정을 통한 진단에는 제한이 있다. 야 간고혈압은 심혈관질환 발생 위험 및 사망률 증가와 밀접한 관련이 있으며, 특히, 교감신경계 항진 및 염분 감 수성과 연관된 야간고혈압은 심부전의 중요한 병태생리적 요인으로 간주된다."], ["p", "국내 연구에 따르면 야간고혈압의 빈도는 일반 인구에서 약 18-23%로 보고되었으며, 진료실혈압에서 고혈압 전단계를 보이는 경우에 더 흔하게 나타났다. 또한 야간고혈압환자의 92.6%가 가면고혈압으로 분류되었고, 정상 혈압군과 비교하여 동맥경직도 증가, 좌심실 비대 및 이완기 심기능 장애 빈도가 유의하게 높은 것으로 보고되었다."], ["p", "아침고혈압(morning hypertension)은 진료실혈압이 140/90 mmHg 미만으로 정상이나, 활동혈압 또는 가정혈압에서 아침 혈압이 135/85 mmHg 이상인 경우를 의미하며, 아침고혈압(morning hypertension)과 아침혈압 상승(morning surge)으로 구분된다."], ["p", "아침고혈압은 과도한 교감신경계 활성, 혈관 노화 등과 연관성이 있는 것으로 알려져 있다. 진단에 있어서는 가정혈압 측정이 재현성이 높고 혈관 질환과의 연관성도 높아, 활동혈압 측정보다 선호되는 방법으로 보고되었다. 이 중 아침 시간대 혈압이 과도하게 상승하는 아침혈압 상승은 뇌졸중 등 심혈관 사건의 위험인자로 제시되고 있으나, 그 정의, 재현성 및 치료에 대해서는 추가적인 연구가 필요하다."], ["p", "국내 고혈압환자를 대상으로 한 연구에 따르면 아침고혈압의 빈도는 15.9%로 보고되었으며, 남성, 고령, 복부 비만, 내당능 이상 및 대사 장애를 가진 경우에서 더 흔하게 나타났다."], ["p", "야간고혈압과 아침고혈압은 가면고혈압 및 가면비조절고혈압의 원인으로 작용할 수 있으며, 이로 인한 심혈관질환 발생 위험이 증가할 가능성이 있다, 따라서 이에 대한 적절한 인식과 진단이 중요하다."], ["p", "치료 전략으로는 작용시간이 긴 항고혈압제의 사용이 권장된다. 반면, 취침 전 약물 복용의 유효성은 아직 충분히 입증되지 않았으므로, 심혈관 사건 예방을 목적으로 한 일률적인 취침 전 항고혈압제 복용은 현재로서는 권장되지 않는다"], ["h", "13.3. 대사증후군과 고혈압"]], "40": [["p", "고혈압환자의 상당수는 고혈압 이외에도 비만, 이상지질혈증, 고혈당증 등의 대사 이상을 동반하고 있으며, 무증상 심뇌혈관질환도 드물지 않게 발견된다. 대사증후군은 복부 비만, 이상지질혈증, 고혈당증, 혈압 상승이 군집하여 존재하는 상태로서, 일반적으로는 다음의 5개 구성요소 중 3개 이상을 충족하는 경우로 정의된다. 즉, 1) 복부 비만, 2) 공복혈당 ≥100 mg/dL(당뇨병 포함), 3) 중성지방≥150 mg/dL, 4) HDL-콜레스테롤 <40 mg/dL(남자), <50 mg/dL(여자), 5) 혈압 ≥130/85 mmHg이다. 복부 비만은 허리 둘레로 평가하며 국내 기준은 아직 통일되어 있지 않다. 현재 임상에서는 아시아-태평양 인구 기준인 남자 >90 cm, 여자 >80 cm, 또는 한국인 특이 기준으로 제시된 남자 ≥90 cm, 여자 ≥85 cm가 흔히 사용되고 있다."], ["p", "대사증후군을 동반한 고혈압환자에 대한 치료의 목표는 단순한 혈압 강하에 그치지 않고, 궁극적으로 심뇌혈관질환 발생을 예방하고 사망률을 낮추며, 특히 당뇨병 발생의 위험을 감소시키는데 있다. 비약물치료로서 생활요법, 특히 체중 감량과 규칙적인 운동은 모든 환자에게 권고된다. 이러한 생활요법은 인슐린 감수성(insulin sensitivity)을 향상 시켜 혈압을 낮추고, 대사 이상을 개선하며, 당뇨병 발병을 지연시키는 효과가 있는 것으로 보고되었다."], ["p", "대사증후군을 동반한 고혈압환자에서는 생활요법과 함께 약물치료를 시행하나, 주의혈압 또는 고혈압 전단계 환자에서는 약물치료의 심뇌혈관질환 예방 효과에 대한 근거가 부족하므로 적극적인 생활요법을 우선적으로 실시한다. 항고혈압제 선택 시에는 혈압 강하 효과뿐 아니라 대사 이상과 인슐린 감수성에 유리하거나, 최소한 불리한 영향을 미치지 않는 약제를 고려하는 것이 바람직하다. 이러한 점을 고려하여 ACE 억제제 또는 ARB나 칼슘통로 차단제를 우선 적으로 선택한다."], ["p", "반면, 베타차단제 중 아테놀롤(atenolol) 같은 구세대 베타차단제는 당뇨병 발생을 증가시키고 혈청 지질에 불리한 영향이 있어 단독으로 장기간 사용하는 경우에는 주의가 필요하다. 그러나 혈관 확장 효과를 지닌 베타차단제는 혈당 및 혈청 지질에 불리한 영향을 미치지 않는 것으로 알려져 있어, ACE 억제제 또는 ARB를 사용할 수 없는 경우에 대안으로 사용하거나, 이들 약제와의 병용요법으로 사용할 수 있다. 다만 ACE 억제제 또는 ARB와 베타차단 제와의 병용요법은 칼슘통로차단제와의 병용요법에 비하여 혈압 강하 효과가 낮을 수 있음을 고려해야 한다. 티아지드 또는 티아지드 유사 이뇨제는 단독 요법 또는 고용량으로 사용하는 것은 피하고, 저용량 병용요법으로 사용하는 것이 바람직하다. 고용량 이뇨제는 저칼륨혈증을 유발하며 당뇨병 발생 위험을 증가시키고 혈청 지질에 불리한 영향을 미칠 수 있다."], ["p", "병용요법으로 이뇨제를 사용할 경우에는 구세대 베타차단제와의 병용은 피하고 칼륨 보존 이뇨제와의 병용요법을 고려할 수 있다. 또한 이뇨제를 병용요법으로 사용하는 경우 혈당 및 지질 대사에 대한 불리한 영향을 최소화하기 위해서는 ACE 억제제 또는 ARB와의 병용요법을 우선적으로 고려한다."], ["h", "13.4. 비만과 고혈압"]], "41": [["p", "비만과 고혈압은 흔히 동반되며, 2형당뇨병과도 밀접한 관련이 있다. 비만을 동반한 고혈압환자는 비만하지 않은 환자 에 비해 더 많은 항고혈압제가 필요하고, 난치성(혹은 저항성)고혈압을 보일 가능성이 더 높은 것으로 보고되었다. 비만 여부에 따라 혈압 조절 목표가 달라지지 않으나, 비만 환자에서는 목표 혈압에 도달하기가 더 어려운 경향이 있다. ALLHAT 연구의 후향적 분석에 따르면, 치료 5년 후 환자의 약 3분의 2에서 체질량지수와 무관하게 혈압 조절에 성공 하였으나, 비만 환자군에서는 더 많은 항고혈압제가 필요하였다. 비만 고혈압환자에게 항고혈압제를 치료를 시작할 때에는 인슐린 감수성이나 비만을 악화시키지 않는 ACE 억제제, ARB, 칼슘통로차단제를 우선적으로 고려할 수 있다 반면, 고용량의 티아지드 또는 티아지드유사 이뇨제는 포도당 및 지질 대사를 악화시키고 2형당뇨병 위험을 증가시킬 수 있으며, 베타차단제는 체중 증가, 이상지질혈증, 2형당뇨병 발생 위험을 높일 수 있다. 그러나, 이러한 약제들이 바람직하지 않은 대사적 영향을 미칠 수 있음에도 불구하고, 고혈압 치료의 가장 중요한 목표는 적절한 혈압 조절이므로, 임상적으로는 이들 약제를 포함한 병용요법이 자주 필요하고 권고된다. 비만에서는 비정상적인 염분 처리 및 체액량 증가가 동반될 수 있어, 이뇨제는 특히 효과적인 혈압강하제로 작용할 수 있다. 또한, 베타차단제는 심근경색 후 상태 나 박출량감소심부전과 같은 동반 질환이 있는 비만 환자에서는 적응증에 해당하며, 비만과 고혈압을 동반한 환자에 서 활성화된 교감신경계의 심혈관 영향을 약화시킬 수 있다는 장점도 있다."], ["p", "체중 감량은 대사 위험 요인 개선뿐 아니라 혈압 조절에도 유익한 효과를 보인다. 고혈압 전단계 환자를 대상으로 한 영양 중재 연구에서, 2.7 kg의 체중 감량은 대조군의 고혈압 발생률 19.2%에 비해 중재군의 고혈압 발생률은 8.8%로 유의하게 감소시켰다. TOHP Phase I 연구에서는 고혈압 전단계 환자에서 평균 3.9 kg의 체중 감량 후 18개월 동안 수축기혈압 2.9 mmHg, 이완기혈압이 2.3 mmHg 감소하였으며, 중증 비만 환자에서 혈압 감소 폭이 더 크게 나타났다. TOHP Phase II 연구에서는 6개월에 4.5 kg 이상 체중 감량을 달성하고 이를 30개월 동안 유지한 환자에서 고혈압 발생 위험이 65% 감소하였다. 또한 TONE 연구에서는 비만 노인 고혈압환자에서 평균 3.5 kg의 체중 감량이 항고혈압제 치료 필요성을 약 36% 감소시키는 것으로 보고되었다. 식사요법을 통한 체중 감량은 혈압을 낮추는 효과가 있으며, 이러한 효과는 메타분석 연구에서도 확인된 바 있다. 체중 감량은 교감신경계 활성도를 낮추고 나트륨이뇨펩타이드(natriuretic peptide) 조절 이상을 개선함으로써 혈압 강하에 기여하는 것으로 알려져 있다. 따라서, 비만을 동반한 고혈압환자에게는 저칼로리 식사와 신체 활동 증가를 통해 체중 감량을 목표로 하는 생활 습관 개선을 권고한다."], ["p", "GLP-1 수용체작용제, Glucose-dependent Insulinotropic Polypeptide/Glucagon-Like Peptide-1 Receptor Agonist(GIP/GLP-1 이중작용제)인 터제파타이드(tirzepatide) 및 비만 수술은 체중감소와 함께 간접적인 혈압 강하 효과를 통해 비만환자의 혈압 조절에 기여할 수 있으나, 혈압 조절만을 목적으로 한 치료 방법으로는 권고하지 않는다."], ["p", "한편, 당뇨병과 고혈압을 동반한 비만 환자에서 혈당강하제를 선택할 때는 체중 및 혈압 감소를 함께 기대할 수 있는 약제를 고려하는 것이 바람직하다. SGLT2 억제제, GLP-1 수용체작용제, GIP/GLP-1 이중작용제가 체중감소와 혈 압 강하 효과를 함께 보이는 것으로 보고되었다."], ["h", "13.5. 당뇨병과 고혈압"]], "42": [["p", "당뇨병 환자에서는 일반 인구에 비해 고혈압의 유병률이 약 2배 높으며, 고혈압환자에서도 당뇨병 발생 위험이 약 2배 증가하는 것으로 보고되었다. 고혈압과 당뇨병이 공존할 경우 심혈관질환, 뇌졸중, 콩팥 질환의 진행 위험이 증가하여 매우 위험하다."], ["p", "당뇨병 환자에게 고혈압 발생이 높은 이유는 체중 증가와 함께 고인슐린혈증이 발생하여 교감신경을 항진시키고, 콩팥에서의 나트륨 저류로 인한 체액량 증가 등이 제시되고 있다. 또한 고혈당은 혈관경직도를 증가시키고 동맥경화를 촉진하여 고혈압 발생에 기여하는 것으로 알려져 있다. 당뇨병 환자에서는 야간 혈압의 생리적 저하(dipping) 현상이 소실되는 경우가 흔하며, 이는 좌심실 비대와 미세알부민뇨와 같은 무증상 장기 손상과 밀접한 관련이 있다."], ["p", "영국에서 시행한 연구에 따르면 수축기혈압이 10 mmHg 감소할 때마다 당뇨병 관련 사망률은 15%, 심근경색증 발 생률은 11%, 망막증 혹은 콩팥 병과 같은 미세혈관 합병증은 13%씩 감소하였다. 이 외에도 많은 연구들에서 적 절한 혈압 조절이 당뇨병 환자의 심뇌혈관질환 발생 위험을 유의하게 감소시키는 것으로 보고되었다."], ["p", "당뇨병을 동반한 고혈압 전단계 환자에서 약물치료의 임상적 유용성에 대한 근거는 아직 충분하지 않다. 반면, 당뇨병을 동반한 고혈압환자에서는 혈압은 130/80 mmHg 미만으로 조절할 것을 권고한다. ACCORD-BP 연구, STEP 연구, ESPRIT 연구와 BPROAD 연구에서는 적극적인 혈압 조절군에서 심혈관질환의 발생 위험이 유의하게 감소한 것으로 보고되었다. 다만, 이러한 적극적 혈압 강하 치료 시는 저혈압, 고칼륨혈증 등의 부작용 발생에 유의해야 한다."], ["p", "항고혈압 약제 선택과 관련하여, 여러 임상 연구에 근거해서 ACE 억제제, ARB, 지속성 칼슘통로차단제, 이뇨제 및 베타차단제를 사용할 수 있으며, 환자의 동반 질환과 임상적 특성을 고려하여 약제를 선택할 수 있다. 특히 알부민뇨 또는 단백뇨가 동반된 경우에는 신기능 보호 효과를 고려하여 ACE 억제제와 ARB를 우선적으로 권고한다."], ["p", "어떠한 항고혈압제가 당뇨병 환자에서 더 우월한지에 대해서는 여전히 논란이 있으나, 대부분의 당뇨병 환자들이 충분한 혈압 강하를 위해 두 가지 이상의 항고혈압제를 병용해야 하는 경우가 많아, 특정 약제의 우선 선택 여부에 대한 임상적 의의는 제한적이다. 그러나 베타차단제와 티아지드계 이뇨제를 병용하는 것은 인슐린 저항을 증가시켜 당뇨 조절을 악화시킬 수 있으므로 주의가 필요하며 ACE 억제제와 ARB의 병용은 신기능 저하 등의 위험이 있어 권고되지 않는다."], ["p", "당뇨병 치료 약제 중 SGLT2 억제제는 혈압 강하 효과를 나타낼 수 있으므로, 병용 중인 항고혈압 약제의 용량 조절 필요성에 대해 주의 깊게 평가해야 한다."], ["h", "13.6. 노인 고혈압"]], "43": [["p", "노인에서의 고혈압 치료는 심뇌혈관질환의 발생 및 사망률을 감소시키는 것으로 보고되었으며, 수축기단독고혈압 환자에서도 고혈압 치료의 임상적 이득이 관찰된다. 따라서 노인 고혈압환자에서도 고혈압의 진단과 치료를 적극적으로 수행해야 한다. 다만, 80세 이상의 처음 진단된 1기 고혈압환자에서 항고혈압 약물치료에 따른 이득은 아직까지 명확하지 않으므로, 환자의 특성을 고려한 치료가 필요하다."], ["p", "노인 고혈압의 특징적인 소견으로는 중심 대동맥 경직도 증가로 인한 수축기혈압과 맥압의 증가가 있다. 또한 죽상 동맥경화에 의한 신혈관성고혈압이 흔히 관찰된다. 노인 고혈압환자에서는 야간 혈압 강하가 감소하고, 하루 동안의 혈압 변동성이 큰 경향이 있다. 더불어 기립성 저혈압이나 식후 저혈압과 같은 혈압 변동이 흔하며, 노쇠한 환자 에서는 기립성 고혈압이 동반되기도 한다. 따라서 노인 고혈압환자의 초기 평가에서는 기립성 혈압 변화를 확인 하는 것이 필요하다."], ["p", "노인 고혈압환자에서도 비약물치료는 효과적이나, 치료가 환자의 삶의 질에 미치는 영향도 함께 고려해야 한다. 일반적으로 수축기혈압 140 mmHg 미만을 목표로 하나 기립성 저혈압을 유발할 정도의 과도한 혈압 강하는 피하는 것이 바람직하다. 고령자 및 노쇠한 노인 고혈압환자의 적절한 목표 혈압에 대해서는 추가적인 연구가 필요하며, 환자의 전반적인 상태를 고려하여 치료 방침을 개별화해야 한다. 따라서 고혈압 치료의 시작 혈압과 목표 혈압을 설정 하기 위해 노인 고혈압환자에서는 노쇠에 대한 평가를 수행하는 것이 필요하다<부록 3, 부록 4>."], ["p", "SPRINT 및 STEP 연구 결과 노인 고혈압환자에서도 적극적인 혈압 강하 치료가 임상적 이득을 보였으나, 초고령자, 노쇠한 노인 및 시설 요양 시설 입소 노인에서의 적절한 목표 혈압에 대해서는 추가적인 연구가 필요하다. 따라서 이러한 환자군에서는 개별 환자의 상태와 전반적인 기능 수준을 고려하여 치료 방침을 결정하는 것이 바람직 하다."], ["p", "노인 고혈압환자에서 항고혈압제를 시작할 때는 젊은 성인의 1/2 용량에서 시작하는 것이 안전하며, 충분한 혈압 강하 효과가 관찰될 때까지 점진적으로 증량하는 것을 권고한다. 다른 동반 질환이 없는 노인 고혈압환자에서는 ACE 억제제, ARB, 칼슘통로차단제, 이뇨제를 1차 치료 약제로 선택한다."], ["p", "반면, 베타차단제는 노인 고혈압환자에서 예후 개선 효과가 다른 항고혈압제에 비해 상대적으로 제한적인 것으로 보고되어, 협심증, 심부전, 빈맥 등 동반 질환이 있는 경우에만 선별적으로 선택하여 사용한다. 단일 항고혈압제로 목표 혈압에 도달하지 못하는 경우에는 두 가지 이상의 약을 병용하여 사용한다. 항고혈압제를 선택 시에는 환자의 다른 동반 질환을 고려하는 것이 바람직하다. 노인 환자에서는 혈압을 서서히 낮추는 것이 안전하며, 약물 사용에 따른 합병증 발생 여부를 관찰하면서 단계적으로 용량을 증량한다."], ["p", "노인 고혈압환자에서는 기립성 저혈압의 동반 여부를 확인하기 위해 주기적으로 기립 혈압 변화를 측정해야 한다. 기립성 저혈압은 앉은 자세에서 측정한 혈압과 비교하여 기립 후 1분과 3분에 측정한 혈압에서 수축기혈압이 20 mmHg, 이완기혈압이 10 mmHg 이상 감소하는 경우로 정의된다. 적극적인 혈압 강하 치료는 오히려 기립성 저혈압의 위험을 감소시키는 것으로 보고되어 있어, 기립성 저혈압이 의심된다는 이유만으로 항고혈압제를 감량할 필요는 없다. 기립성 저혈압의 치료로는 수분 및 염분 섭취 증가, 다리 꼬기, 웅크림과 같은 자세 유지, 압박 스타킹 사용 등의 비약물치료와 미도드린(midodrine), 피리도스티그민(pyridostigmine), 플루드로코르티손(fludrocortisone) 등의 약물치료가 있다."], ["h", "13.7. 젊은 연령 고혈압"]], "44": [["p", "정된다. 이 연령대에서 고혈압 인지율은 36%, 치료율은 35%, 조절율은 33%로, 다른 연령대에 비해 매우 낮은 수 준이다. 또한 젊은 고혈압환자의 약 59%는 의료서비스를 이용하지 않고 있으며, 85%는 치료 지속성부족으로 분류되 었다."], ["p", "국내 20-45세 건강한 성인 450만명 이상을 대상으로 한 고혈압 유병, 치료 여부 및 심혈관 사건 간의 연관성을 분석한 대규모 연구에서, 고혈압군은 정상혈압군에 비해 주요 심혈관 사건 위험이 2배 이상 증가한 것으로 나타났다. 반면, 항고혈압제를 사용한 경우 심혈관 사건 위험은 70% 가량 감소하는 경향을 보였다. 이러한 결과는, 젊은 성인에서도 고혈압을 조기 진단하고 치료하는 것이 심혈관 사건 예방에 중요함을 국내 연구를 통해 확인한 것이다."], ["p", "젊은 성인 고혈압환자에서 이차성 고혈압 유병률은 14-33%까지 보고된 바 있어, 젊은 고혈압이 진단된 경우 이차성 고혈압 가능성을 보다 적극적으로 고려해야 한다."], ["p", "젊은 고혈압환자에서 이차성 고혈압의 원인으로는 일차성 알도스테론증, 신혈관성고혈압, 만성콩팥병, 약제 유발 고혈압 등이 보고되었다. 또한 젊은 연령에서도 혈관 구조 및 기능 변화가 시작될 수 있으므로, 고혈압에 의한 표적 장기 손상 여부를 평가하는 것이 필요하다."], ["p", "젊은 고혈압환자에서는 고혈압에 대한 인식 부족과 치료 개시 지연이 큰 문제로 지적되며, 진단되더라도 치료를 시작하지 않거나 치료를 지속하지 않는 경우가 흔하다. 젊은 연령일수록 심혈관질환 발생의 절대 위험도가 낮게 평가되는 경향이 있어, 젊은 고혈압환자에서 고혈압 치료 개시가 지연될 수 있다. 그러나, 고혈압 상태에 장기간 노출될수록 고혈압에 의한 표적장기 손상의 평생 위험이 누적으로 증가하며, 젊은 나이에 고혈압이 진단될수록 누적 평생 심혈관질환 위험도가 높아지는 점을 고려해야 한다. 또한 국내 코호트 연구에서 젊은 고혈압에서 항고혈압제 사용이 심혈관 사건 위험 감소와 유의하게 연관됨이 보고되었다. 따라서 젊은 고혈압환자에서는 치료 개시 기준을 과도하게 보수적으로 설정 하기보다는, 환자의 위험도를 종합적으로 평가하여 적절한 시점에 조기 약물치료를 고려하는 것이 바람직하다."], ["h", "13.8. 심장 질환과 고혈압"], ["h", "13.8.1. 관상동맥질환"]], "45": [["p", "혈압 수치가 높을수록 관상동맥질환의 위험은 증가하며, 이러한 위험 증가는 수축기혈압 110~115 mmHg, 이완기혈압 70~75 mmHg 범위부터 관찰되는 것으로 보고되었다. 관상동맥질환을 동반한 고혈압 전단계 환자에서 수축기혈압을 120~129 mmHg, 이완기혈압을 70~79 mmHg 범위로 낮춘 경우 임상적 예후가 개선된다는 보고도 있다. 반면, 관상동맥질환 환자를 대상으로 한 일부 연구에서는 혈압이 120/70 mmHg 이하 또는 심지어 130/80 mmHg 이하로 낮을 때, 심혈관 사건 발생률이 J-형 또는 U-형 곡선을 보였다는 보고도 있다. 관상동맥 질환이 동반된 고혈압환자에서 이완기혈압 감소와 사건발생의 연관성이 더 큰 것은 관상동맥 혈류가 주로 이완기에 이루어지기 때문인 것으로 여겨진다."], ["p", "그럼에도 불구하고, 권장 혈압 목표치를 추구하는 데 주저해서는 안되며 다만 혈압을 과도하게 낮출 경우 관상 동맥 관류가 불충분해질 수 있으므로, 치료 과정에서 협심증 증상과 징후에 대한 주의가 필요하다. 또한 관상동맥질환 환자에서는 좌심실 비대가 흔히 동반되므로, 관류 압이 지나치게 낮아질 경우 심근 산소 소모 증가 및 미세혈관 순환 장애로 인해 허혈이 악화될 수 있음을 고려해야 한다."], ["p", "관상동맥질환 환자 중 협심증을 동반한 고혈압환자의 치료에서는 베타차단제, 칼슘통로차단제를 우선적으로 권고한다. 특히 최근 심근경색을 경험한 환자에서는 베타차단제가 예후 개선 효과를 보이는 것으로 보고되어 특별한 금기가 없는 한 반드시 처방하는 것이 권장된다. 베타차단제 치료의 최적 치료 기간에 대해서는 아직 명확하지 않으나, 환자가 약제를 잘 견디고 특별한 부작용이 없는 경우에는 베타차단제 치료를 중단할 이유는 없다. 또한, ACE 억제제는 고위험 심혈 관질환군과 관상동맥질환 환자에서 심혈관 사건을 감소시키는 효과가 무작위대조시험을 통해 입증되었으며, 이에 따라 관상동맥질환 환자에서 항고혈압 병용 치료의 일환으로 사용이 권장된다. 만약 ACE 억제제에 부작용이 발생하였을 때는 ARB를 대체 약제로 사용할 수 있다."], ["h", "13.8.2. 심부전"]], "46": [["p", "고혈압은 심부전의 가장 중요한 위험인자 중 하나로, 심부전 환자의 약 75%에서는 고혈압 병력을 가지고 있다. 그러나 심부전 환자에서의 혈압 조절의 효용성과 고혈압 약제 간 효과를 직접 비교한 연구는 없는 실정이다. 만성 심부전 (chronic heart failure)환자에서 혈압을 철저히 조절하면 심부전의 악화를 예방할 뿐만 아니라 심뇌혈관 사건 및 사망률 감소에 도움이 될 가능성이 높은 것으로 보고되었다."], ["p", "고혈압을 동반한 비대상성 심부전(decompensated heart failure) 환자의 혈압을 적극적으로 조절해야 한다. 고혈압성 급성 심부전(acute heart failure)의 경우 치료 시작 후 수시간 동안 초기 혈압의 25% 이내 범주에서 혈관확장제 주사와 고리작용이뇨제를 병용하여 혈압을 신속히 낮추는 적극적인 혈압 강하 치료가 필요하다."], ["p", "박출률감소심부전이 동반된 고혈압환자에서는 혈압 조절과는 별도로, 심부전 환자의 사망률과 재입원률 감소 효과가 입증된 약제를 우선적으로 사용한다. 이 중 ARNI는 ACE 억제제, ARB 보다 우선하여 사용을 고려한다."], ["p", "ARNI를 사용할 수 없는 경우에는 ACI 억제제 또는 ARB를 대안으로 사용할 수 있으며, 베타차단제, 알도스테론 길항제인 스피로놀락톤, 그리고 SGLT2 억제제와의 병용을 권고한다. 이러한 약제를 병용함에도 불구하고 혈압이 조절되지 않는다면 티아지드계 이뇨제를 추가한다. 이후에도 혈압 조절이 어려운 경우에는 디히드로피리딘계 칼슘통로차단제를 추가 할 수 있다. 반면 비디히이드로피리딘계열 칼슘통로차단제(베라파밀, 딜티아젬)은 좌심실 수축 기능을 저하시킬 수 있어 사용에 주의해야 한다. 알파차단제는 신경호르몬계 활성 증가, 수분 저류, 심부전의 악화를 유발할 수 있어 사용에 주 의해야 한다."], ["p", "박출률보존심부전은 고혈압이 주요 위험인자이지만, 대부분의 연구에서 혈압이 현저히 상승된 경우는 드물다. 그럼에도 불구하고 고혈압이 동반된 박출률보존심부전 환자에서도 철저한 혈압 조절은 심부전 악화를 예방하고 심뇌혈관 사건 및 사망률 감소에 도움이 될 가능성이 있다."], ["p", "단기간에 혈압이 급격히 상승하는 상황에서는 급성 심부전이 발생할 수 있다. 이러한 급성 고혈압성 심부전에서는 심부전에 대한 표준 치료와 함께 조기에 혈압을 낮추는 치료를 병행해야 한다. 다만 혈압을 지나치게 빠른 속도로 감소 시킬 경우 콩팥, 뇌 및 심근 허혈을 유발할 수 있으므로 주의가 필요하며, 치료 시작 후 초기 수시간 동안의 혈압 강하 정도는 초기 혈압의 25%를 초과하지 않도록 한다. 이때 정주용 혈관확장제와 고리작용이뇨제를 병용하여 적극적인 혈압 강하를 시행하는 것이 권장된다."], ["p", "증상을 동반한 비대상성 급성 심부전 환자에서도 철저한 혈압 조절은 사망률과 재입원률을 감소시킬 가능성이 있다. 그러나 어지럼증 등 증상을 동반한 심부전 환자에서 120/60 mmHg 이하로 과도하게 저하되는 경우에는 사망률 증가와 관련성이 있으므로 주의가 필요하다."], ["h", "13.8.3. 심방세동"]], "47": [["p", "고혈압은 유병률이 높고 좌심실 비대 및 좌심방 확장과 같은 심장의 구조적 변화를 초래할 수 있어, 심방세동 발생의 가장 흔한 위험인자이다. 또한 고혈압과 심방세동은 허혈성 색전증 및 출혈성 뇌졸중의 가장 중요한 위험인자로 알려져있다."], ["h", "13.8.4. 판막질환"], ["p", "중증 심장판막질환과 심부전이 동반된 환자의 대부분은 심혈관질환 고위험군으로 간주된다. 따라서 이들 환자에서 기저 혈압이 130/80 mmHg를 초과하는 경우 혈압 강하 치료를 권고하며, 치료를 견딜 수 있다면 목표 혈압은 120- 129/70-79 mmHg로 설정할 수 있다."], ["p", "경도 또는 중등도의 판막 질환이 있는 환자에서는 고혈압 치료 시작 기준과 목표 혈압을 설정하기 전에 개별 환자의 심혈관 위험도를 평가하는 것이 필요하다. 판막 질환에 따른 심부전 발생을 고려하면 디히드로피리딘계 칼슘통로차단제 보다 ARB 또는 ACE억제제가 선호된다."], ["h", "13.8.4.1. 대동맥판 협착"], ["p", "대동맥판 협착(aortic valve stenosis) 환자의 3분의 2 이상이 고혈압이 동반되며, 이는 판막 질환의 병태생리에 기여 하는 것으로 알려져 있다. 그러나 중등도에서 중증 대동맥판 협착으로의 진행을 예방하는 데 있어 항고혈압제의 효과를 평가한 대규모 무작위대조시험은 아직 보고되지 않았다. 따라서 대동맥판 협착 환자에서의 고혈압 치료는 소규모 병태생리 연구, 임상 경험 및 관찰 연구 자료에 근거하고 있다. 판막 치환 수술 전후 또는 경피적 판막 시술 전후의 대동맥판 협착 환자에서 항고혈압 치료는 일반적인 고혈압 치료 지침에 따라 목표 혈압을 설정하고, 약제를 선택하되, 관상동맥질환, 심부전 및 부정맥 등 동반 질환에 대한 평가를 함께 시행하는 것이 필요하다."], ["h", "13.8.4.2. 대동맥판 역류"], ["p", "대동맥판 역류에서 혈역학적 특성상 1회 박출량이 증가하므로 수축기혈압이 상승하는 경향이 있다. 대동맥판 역류 (aortic valve regurgitation) 환자에서 항고혈압 치료는 대동맥판막에 대한 수술 또는 경피적 시술이 필요한 시점까지는 일반적인 고혈압 치료 지침에 따라 혈압을 조절한다. 무작위대조시험에서 대동맥판 역류 환자를 니페디핀(nifedipine)으로 치료한 경우 수술 시점을 지연시킬 수 있음이 보고되었다. 이는 대동맥판 역류 환자에서 칼슘통로차단제에 의한 후부하 감소가 효과가 임상적으로 유의함을 시사하며, 유사한 혈관확장 작용을 갖는 다른 약제, 예를 들어 RAS억제제 역시 효과를 보일 가능성이 았다."], ["h", "13.8.4.3. 승모판 역류"], ["p", "고혈압환자에서는 고혈압이 장기간 지속되거나 중증으로 진행될 경우 좌심실 확장을 유발할 수 있으며, 이로 인해 건삭(chordae tendineae)이 신장되어 수축기 동안 승모 판막의 두개 판엽이 완전히 닫히지 못하고 좌심방으로 혈액이 역류하게 되고, 그 결과 경도에서 중등도 이상의 승모판 역류(mitral valve regurgitation)가 발생할 수 있다. 이러한 병태생리는 드문 현상이 아니며, 실제로 영국의 인구 기반 연구에서는 수축기혈압이 20 mmHg 증가할 때마다 승모판 역류의 위험이 26% 증가하는 것으로 보고되었다."], ["p", "고혈압환자에서 승모판 역류가 진단된 경우에는 고혈압 치료에 대한 일반적인 권고에 따라 혈압을 조절하는 것이 심장 보호 효과를 기대할 수 있다. 이들 환자에서는 심초음파를 시행하여 좌심실 확장의 회복 여부와 승모판 역류 정도의 호전을 추적 관찰해야 한다. 특히 고혈압에 의한 심실 확장으로 인해 기능적 승모판 역류가 발생하면, 승모 판막 자체는 구조적으로 정상인 경우가 대부분이므로, 항고혈압제 또는 심부전 치료를 통해 역류가 호전된다면 판막 수술은 필요하지 않다."], ["h", "13.9. 혈관질환과 고혈압"], ["h", "13.9.1. 경동맥 죽상동맥경화증"], ["p", "혈압 강하 치료는 경동맥 죽상동맥경화증의 진행을 억제하며, 칼슘통로차단제와 ACE 억제제가 베타차단제 또는 이뇨제 보다 죽상동맥경화증 진행 억제 효과가 더 우수한 것으로 보고되었다."], ["h", "13.9.2. 동맥경화증(혈관경직도)"], ["p", "혈압이 감소하면 혈관벽에 가해지는 기계적 부하가 줄어들어 맥파전달속도(pulsed wave Doppler)를 감소시킬 수 있으므로, 혈압 강하 효과가 있는 모든 항고혈압제는 혈관경직도를 완화시키는 효과를 가진다. 그러나 특정 항고혈압제가 혈관경직도 개선에 있어 다른 약제보다 우월 한지에 대해서는 아직 명확하지 않다."], ["p", "RAS 억제제는 혈압 강하 효과와는 독립적으로 맥파전달속도를 감소시킬 수 있는 것으로 보고되었으며, 혈관확 장 작용을 가진 베타차단제는 아테놀롤에 비해 중심동맥 수축기혈압을 더 효과적으로 감소시키는 것으로 알려져 있다 이와 같은 혈관경직도 개선 효과는 다수의 장기 연구를 통해 관찰되어 왔으나, 혈관경직도 감소가 향후 심뇌혈관질환 발생을 줄이는지에 대해서는 현재까지 말기신장질환(end stage renal disease)예서만 입증되었으며, 일반 인구 집단에서의 임상적 이득을 확증하기 위해서는 추가적인 연구가 필요하다."], ["h", "13.9.3. 말초혈관질환"], ["p", "말초혈관질환은 10년 후 사망률이 약 40%에 이르는 중증 질환으로, 심뇌혈관질환의 모든 위험인자를 철저히 조절하는 것이 매우 중요하다. 특히 당뇨병과 말초혈관질환이 동반된 환자에서 수축기혈압을 적절히 조절할 경우 하지절단율과 사망률이 감소하는 것으로 보고되었다."], ["p", "최근의 메타분석 결과와 SPRINT 연구를 고려할 때, 말초혈관질환이 동반된 고혈압환자에서는 혈압을 130/80 mmHg 미만으로 충분히 조절할 것을 권고한다."], ["p", "말초혈관질환이 동반된 고혈압환자에서는 소금 섭취 제한, 체중감량, 절주 및 규칙적인 운동과 같은 생활요법을 철저히 시행하는 것이 중요하다. 약물치료에는 ACE 억제제 또는 ARB를 기본으로 하며, 필요 시 아스피린을 병용하는 것이 권장된다. ACE 억제제는 장기적인 심혈관 사고를 감소시켰는데, 이는 약의 고유한 효과와 혈압 강하 효과가 모두 작용한 것으로 분석된다. 그러나 어떤 종류의 항고혈압제를 사용하여도 혈압이 적절히 조절될 경우 심뇌혈관 질환 발생 위험 감소 효과가 나타나는 것으로 보고되었다. 따라서, 혈당 및 지질 조절 치료를 병행하여 전체적인 심뇌혈관질환 위험도를 관리하는 한편, 동반 질환으로서 관상동맥질환 및 심부전의 유무를 고려하여 항고혈압 약제를 선택하는 것이 바람직하다."], ["p", "베타차단제는 과거에는 말초혈관질환 증상을 악화시킬 수 있다는 우려로 사용이 제한되었으나, 이를 뒷받침하는 직접적인 근거는 부족하다. 오히려 중등도 이하의 말초혈관질환 환자에서는 베타차단제가 임상 증상을 악화시키지 않는 것으로 보고되었으며, 협심증이나 빈맥 등의 적응증이 있는 경우에는 사용을 고려할 수 있다."], ["p", "말초혈관질환과 고혈압이 동반된 경우 신동맥협착의 빈도가 증가하므로 이에 대한 평가를 고려하거나 치료과정에서 각별한 주의가 필요하다. 특히, 중증의 하지 허혈이 동반된 환자에서는 혈압 강하 치료가 하지 허혈을 악화시킬 수 있으므로, 혈압 조절 시 주의를 요한다."], ["h", "13.9.4. 대동맥 질환"], ["p", "대동맥 축착(coarctation of the aorta)의 치료는 가능하면 유년기에 수술적 치료로 교정을 시행하는 것이 원칙이다. 그러나, 수술적 교정 이후에도 유년기에 수축기고혈압으로 진행되는 경우가 있어 장기간의 추적 관찰이 필요하다. 일부 환자에서는 성인이 될 때까지 대동맥 축착이 진단되지 않아 중증 고혈압으로 진행되어, 이로 인해 심비대, 좌심실 비대, 협착 원위부에 광범위한 측부 순환을 동반한 표적장기 손상이 나타날 수 있다. 다만, 대동맥 축착 환자에서 최적의 혈압 치료 전략에 대한 무작위대조시험은 부족한 실정이다."], ["p", "대동맥류 환자는 대개 증상이 없으나 혈압 조절이 불충분할 경우 대동맥벽의 긴장이 증가되어 탄력성이 저하되어 대동맥 파열로 진행할 위험이 있다. 또한, 혈압의 변동성이 큰 경우 대동맥 파열 위험이 증가한다는 보고도 있다. 따라서 대동맥류 환자에서는 혈압을 엄격하게 조절해야 하며, 환자가 견딜 수 있는 범위 내에서 가능한 한 혈압을 충분히 낮추는 것이 권장된다 752. 베타차단제는 혈압 강하 효과뿐 아니라 수축기 동안 동맥벽에 가해지는 전단 응력(shear stress)을 감소시키는 효과가 있어 사용이 권장되나, 마르팡증후군(Marfan syndrome)이 아닌 환자에서의 근거는 제한적이다."], ["p", "베타차단제는 만성 대동맥 박리 환자에서 수술 위험을 감소시키고, ACE 억제제에 비해 생존율을 개선시킨다는 보고도 있다. 대동맥 박리를 포함한 급성 대동맥 증후군에서도 베타차단제를 포함한 병용 치료를 통해 혈압과 심박수를 신속하고 적극적으로 조절해야 한다."], ["p", "이첨 대동맥판(bicuspid aortic valve)은 남성에서 흔하며 대동맥판 협착과 연관되는 경우가 많아, 동반 유무를 반드시 확인해야 한다. 이첨 대동맥판 환자는 일반 인구에 비해 대동맥병증의 발생 위험이 높아, 혈압이 적절히 조절되지 않을 경우 대동맥류로 진행하거나 대동맥 파열과 같은 중대한 합병증을 초래할 수 있다. 따라서, 이첨 대동맥판 환자 에서는 혈압은 130/80 mmHg 이하로 조절하는 것이 도움이 될 수 있다."], ["p", "심한 대동맥판 협착이 동반한 환자에서 혈압 조절이 필요한 경우에는 ARB 사용을 고려해 볼 수 있다."], ["h", "13.10. 만성콩팥병과 고혈압"]], "48": [["p", "만성콩팥병은 원인 질환과 관계없이 콩팥 손상 또는 기능 감소가 3개월 이상 지속되는 상태로 정의한다. 콩팥 손상의 지표에는 사구체 여과율 감소(<60 mL/min/1.73 m²)뿐 아니라, 알부민뇨, 혈뇨, 농뇨 등 요검사 이상, 세뇨관 기능 장애에 따른 전해질 이상, 영상 의학적 또는 병리학적으로 확인된 콩팥 구조의 이상, 그리고 콩팥 이식 상태가 포함된다. 알부민뇨는 하루 요 알부민 배설량이 30 mg 이상이거나, 임의 요검사에서 알부민:크레아티닌 비율이 30 mg/g(3 mg/mmol) 이상인 경우로 정의한다."], ["p", "고혈압은 당뇨병과 함께 만성콩팥병의 주된 원인 질환이자, 대표적인 합병증이며, 고혈압이 동반된 만성콩팥병 환자에서 혈압을 적절히 조절하면 콩팥 기능 저하의 진행을 늦추고 심뇌혈관 합병증 발생을 감소시킬 수 있음이 국내외 연구를 통해 보고되었다."], ["p", "이에 따라서 본 진료지침에서는 만성콩팥병을 동반한 고혈압환자의 목표 혈압을 당뇨병 동반 여부와 무관하게, 환자가 견딜 수 있는 경우 130/80 mmHg 미만으로 설정할 것을 권고한다. 다만 실제 진료 현장에서는 환자의 연령, 노쇠 여부, 낙상 및 골절 위험, 기대 여명, 기립성 저혈압 증상 등을 종합적으로 고려하여 혈압 목표를 개별화해야 한다."], ["p", "만성콩팥병 환자에서도 생활습관 관리가 중요하다. 한국인 만성콩팥병 환자를 대상으로 한 전향적 관찰 코호트인 KNOW-CKD 연구에서 대사 이상과 비만이 만성콩팥병 진행과 유의한 연관성을 보였다. 이에 따라 건강한 체중 유지를 위해 체질량지수를 20~25 kg/m²로 유지하고, 소금 섭취를 하루 5 g(나트륨 2,000 mg) 미만으로 제한하며, 규칙적인 운동과 절주 등 생활요법을 적극적으로 권고한다. 대부분의 만성콩팥병 환자들은 목표 혈압 도달을 위해 여러 개의 항고혈압제 사용이 필요하며, 모든 계열의 항고혈압제를 사용할 수 있다<그림 18>. 이 중 알부민뇨를 동반한 만성콩팥병 환자에게는 ACE 억제제 혹은 ARB를 우선적으로 사용하도록 권고한다. 이러한 약제 선택은 주로 콩팥 기능 보호 효과에서 기인한 것이나, Xie 등이 보고한 대규모 메타분석에서는 RAS억제제가 만성콩팥병 환자에서 콩팥 기능 보호 효과뿐 아니라 심혈관질환 발생 감소 효과도 보이는 것으로 확인되었다."], ["p", "다만, 중증의 신기능 저하 환자나 양측성신동맥협착증 환자에서 RAS억제제를 사용할 경우 콩팥 기능 악화 및 고칼륨혈증 등을 초래할 수 있으므로 주의가 필요하다. 또한, 만성콩팥병 환자에서 ACE억제제와 ARB병합요법은 권고되지 않는다. 병합요법과 단일요법의 임상 결과를 분석한 무작위대조시험 및 메타분석에서 병합요법이 단일 요법과 비교하여 알부민뇨의 감소 효과는 있었으나, 사망률, 말기신부전으로의 진행 또는 심혈관질환의 발생을 감소 시키지 못하였고, 오히려 병합요법에서 급성신부전과 고칼륨혈증 등의 부작용이 의미 있게 증가하였다. 이러한 결과는 RAS억제제와 직접레닌억제제의 병합요법 연구에서도 유사하게 관찰되었다. 2형당뇨병 환자를 대상으로 한 주요 심혈관계 임상시험에는 상당수의 만성콩팥병 환자가 포함되어 있으며, SGLT2억제제는 복합 신장 결과를 약 40% 감소시키는 일관된 신장 보호 효과를 나타냈다. 이러한 효과는 ACE억제제 또는 ARB를 최대 허용 용량으로 투여하는 표준 치료에 SGLT2억제제를 추가한 세 개의 대규모 무작위대조시험인 CREDENCE, DAPA-CKD, EMPA-KIDNEY 연구를 통해 입증되었다."], ["p", "이들 연구는 모두 복합 및 개별 신장 결과의 유의한 감소로 인해 조기 종료되었으며, 이러한 신장 보호 효과는 혈당 강하 효과와는 독립적으로 사구체 내압 감소 및 항섬유화 작용 등 신장에 대한 직접적인 기전에 의해 설명된다. 치료 초기에는 경미한 사구체 여과율 감소가 관찰될 수 있으나, 이는 RAS억제제와 유사한 양상으로 임상적으로 관리 가능하다. 또한 CREDENCE 및 DAPA-CKD 연구에서는 일부 심혈관계 사건 감소 효과가, DAPA-CKD 연구에서는 사망률 감소 효과도 확인되었다."], ["p", "실제 임상에서 SGLT2 억제제는 만성콩팥병 환자의 혈압 조절을 주된 목적으로 선택하지는 않지만, 입증된 심혈관 및 신장 보호효과를 고려할 때 요로 생식기 감염, 약제의 혈압 감소 효과로 인한 기립성 저혈압 등의 부작용에 유의하면서 만성콩팥병 환자에서 적극적으로 사용을 권고한다."], ["p", "한편, 이뇨제는 단백뇨를 동반한 만성콩팥병 환자에서 RAS 억제제에 추가 투여 시 단백뇨를 효과적으로 감소시킬 수 있다. 그러나 사구체 여과율이 45 mL/min/1.73m² 미만으로 감소할 경우 티아지드 이뇨제의 효과가 저하된다. 이는 티아지드유사 이뇨제에도 적용되나, 최근 발표된 CLICK 연구에서는 만성콩팥병 4기 환자 160 명을 대상으로, 평균 23 mg의 클로르탈리돈을 1일 1회 투여 받은 환자에서 24시간 평균 수축기혈압이 10.5 mmHg 감소함이 보고 되었다. 이 연구 대상자 중 약 60%는 이미 고리작용이뇨제를 복용 중이었으며, 연구 기간 동안 해당 치료를 유지하였다. 일반적으로 추정사구체 여과율 mL/min/1.73m² 환자에서는 이뇨제 용량과 종류를 개별화하여 조정해야 하며, 사구체 여과율 <30 mL/min/1.73m² 미만으로 감소한 경우에는 티아지드계 이뇨제를 고리작용이뇨제로 대체하는 것이 권장된다. CLICK 연구 결과를 고려할 때 만성콩팥병 환자의 혈압 조절이 충분하지 않은 경우에는 전해질 이상 발병 여부 등을 면밀히 감시하면서 클로르탈리돈의 추가 처방을 고려할 수 있다<그림20>."], ["p", "이전 여러 연구들에서는, 단백뇨가 동반된 당뇨병성 만성콩팥병 환자에게 ACE 억제제 또는 ARB에 스테로이드성 MRA인 스피로놀락톤또는 에플레레논을 추가한 경우, 혈압 강하 효과와는 독립적으로 요중 알부민 또는 단백 배설이 유의하게 감소하는 것으로 보고되었다. 그러나 실제 임상에서는, 스테로이드성 MRA의 신장 예후에 대한 근거가 제한적이고, 고칼륨혈증 발생 위험이 높아 사용에 제약이 있다."], ["p", "피네레논은 새로운 비스테로이드성 MRA로, 스테로이드성 MRA와 비교하여 작용 지속시간과 조직 분포가 다르며, MRA에 결합하는 다양한 보조 조절 분자의 결합을 억제한다. 이를 통해 염증 및 섬유화 반응 억제 효과는 유지하면서, 원위곱슬세관에서의 미네랄코티코이드 작용에 대한 간섭은 상대적으로 감소시켜, 혈압 강하 및 혈청 칼륨 상승의 정도가 스테로이드성 MRA보다 적다. 실제로 피네레논에 의한 혈압 강하 효과는 스피로놀락톤보다 적고, 장기 보호 효과에 혈압 강하가 크게 기여하지는 않는 것으로 보고되었다. 최근 FIDELIO-DKD763와 FIGARO-DKD762 연구에 포함된 13,026명의 환자 데이터를 통합 분석한 결과, 위약 대비 피네레논은 당뇨병성 콩팥병의 진행을 지연시키고, 심부전으로 인한 입원, 심혈관 사망 및 심근경색의 발생 위험을 유의하게 감소시켰다. 피네레논은 우수한 내약성을 보였으나, 위약군에 비해 고칼륨혈증 발생 빈도가 높았다. 따라서 당뇨병이 동반된 고혈압성 콩팥병 환자에게 피네레논을 투여할 경우 혈청 칼륨과 콩팥 기능에 대한 면밀한 모니터링이 필요하다."], ["cap", "그림 20. 만성콩팥병을 동반한 고혈압환자의 약물 조절"], ["h", "13.11. 뇌혈관질환과 고혈압"], ["p", "허혈성 및 출혈성 뇌졸중의 위험은 혈압 수준이 높을수록 증가하며, 고혈압은 조절 가능한 뇌졸중 위험인자 중에서 가장 흔하며 인구 집단에 대한 기여 위험도가 높다. 고혈압 치료, 특히 수축기혈압의 조절은 뇌졸중 발병을 현저히 감소시키는 것으로 알려져 있다."], ["p", "이를 위해 체중 감량, 저지방 식이, 소금 섭취 제한, 규칙적인 운동, 절주, 금연과 같은 생활요법을 우선적으로 시행하며, 필요 시 약물치료를 병행한다. 혈압이 115/75 mmHg 이상인 경우 수축기혈압이 20 mmHg, 이완기혈압이 10 mmHg 증가할 때마다 뇌졸중으로 인한 사망이 2배 이상 증가하는 것으로 보고되었으며, 수축기혈압을 10 mmHg 혹은 이완기혈압을 5 mmHg 낮출 경우 뇌졸중 사망률이 약 40% 감소할 것으로 예측되었다."], ["p", "임상 연구 메타분석 결과, 약물치료로 수축기 및 이완기혈압을 10/5 mmHg 감소시키면 뇌졸중 예방 효과는 환자의 기왕력 여부와 무관하게 약 30~40%에 이르는 것으로 나타났다. 이에 따라 뇌졸중의 일차 예방을 위해 혈압은 140/90 mmHg 미만으로 조절할 것을 권고한다."], ["p", "뇌졸중 예방을 위해 어떤 약이 더 우수한 지는 명확한 결론이 없으나, 칼슘통로차단제 또는 ACE 억제제나 ARB가 베타차단제가보다 우수한 효과를 보였다고 보고되었다. 그러나 뇌졸중의 일차 예방에 있어서는 특정 약제의 선택보다는 혈압을 충분히 낮추는 것이 가장 중요하며, 항고혈압제 선택은 환자의 임상적 특성을 고려하여 개별화해야 한다."], ["h", "13.11.1. 급성기 허혈성 뇌졸중에서 고혈압 관리"]], "49": [["p", "급성기의 허혈성 뇌졸중 환자에서는 혈압 상승이 흔히 관찰되며. 이는 스트레스 반응, 기존의 고혈압 병력, 그리고 허혈된 뇌조직의 관류를 유지하기 위한 보상작용에 기인하는 것으로 여겨진다. 따라서 급성기에는 혈압을 지속적으로 모니터링하되, 적절한 뇌관류 유지를 위해 급격한 혈압 강하는 피하는 것이 중요하다."], ["p", "허혈성 뇌졸중 발병 1주 이내의 급성기 환자를 대상으로 ARB를 1주일간 투여한 연구에서 12개월 추적 시 사망률 감소가 보고되었으나, 이러한 결과를 확증하기 위해서는 추가적인 대규모 연구가 필요하다. 오히려 급성기 동안 혈압 상승에 대해 과도하게 적극적인 치료를 시행할 경우 허혈 부위의 관류를 저하시켜 오히려 뇌경색 부위를 확대시킬 수 있으므로, 발병 초기 1주 이내에는 적극적인 혈압 강하 치료는 바람직하지 않다."], ["p", "초급성 허혈성 뇌졸중에서 혈전용해 요법을 시행하는 경우, 출혈 발생 위험은 치료 전후의 혈압과 밀접한 관련이 있으므로 목표 혈압을 185/110 mmHg 미만으로 조절해야 한다. Tissue plasminogen activator(tPA)를 이용한 혈전용해요법을 시 행할 때에는 약물 투여 전 수축기혈압과 이완기혈압을 각각 185 mmHg 및 110 mmHg 미만으로 낮추는 것이 권 고된다."], ["p", "최근의 여러 임상 연구에서는 혈관내 재개통치료 후 성공적으로 재관류가 이루어진 환자를 대상으로 적절한 목표 혈압을 평가하였다. 이들 연구의 통합 분석 결과, 집중 혈압 치료군에서 90일째 기능적으로 독립하는 비율이 표준 치료군에 비해 유의하게 낮았으며(45.1% vs. 55.9%), 사망률이나 증상성 뇌출혈 비율에는 유의한 차이가 없었다."], ["p", "종합하면, 성공적인 혈관내 재개통치료 이후 처음 24시간 동안 수축기혈압을 180 mmHg 이하로 유지하는 것이 적절하며, 140 mmHg 이하로 보다 공격적으로 혈압을 낮추는 것은 추가적인 이점이 없고 잠재적인 위해 가능성이 있 어 권고하지 않는다."], ["p", "급성기 허혈성 뇌졸중에서 혈압 조절을 위해 사용할 수 있는 정맥내 항고혈압제로는 라베타롤, 니카르디핀(nicardipine), 딜티아젬, 니트로글리세린(nitroglycerin), 및 니트로프루사이드(nitroprusside)가 권장된다."], ["p", "다만 고혈압성 뇌병증, 대동맥 박리, 급성 콩팥손상, 급성 폐부종, 급성 심근경색이 동반된 경우에는 고혈압으로 인한 추가적인 장기 손상의 위험이 높으므로, 보다 적극적인 혈압 강하 치료가 필요하다."], ["h", "13.11.2. 급성기 뇌실질내출혈에서 고혈압 관리"]], "50": [["p", "이론적으로 뇌출혈의 급성기에 고혈압을 적절히 조절하면 재출혈로 인한 혈종 확장과 부종을 억제할 수 있으므로, 급성기 뇌출혈 환자에서는 고혈압 치료가 권장한다. 수축기혈압이 200 mmHg 이상이거나 평균혈압이 150 mmHg 이상이면 5분 간격으로 혈압을 측정하면서 조절한다."], ["p", "압 감시 장치를 이용하여 뇌관류압을 60~80 mmHg로 유지하면서 혈압을 점진적으로 낮춘다. 급성기 동안 과도한 혈 압 강하는 오히려 높은 사망률과 연관될 수 있으므로, 뇌관류압은 60 mmHg 이상을 유지하는 것이 바람직하다."], ["p", "수축기혈압이 180 mmHg 이상이거나 평균 동맥압이 130 mmHg 이상이지만 뇌압 상승의 증거가 없는 경우에는, 15분 간격으로 혈압을 평가하면서, 치료 전 혈압의 80% 수준 또는 동맥압 110 mmHg, 혹은 혈압 160/90 mmHg 까지 점진적으로 혈압을 낮추는 것을 고려한다."], ["p", "혈압 조절을 위한 정맥내 항고혈압제로는 라베타롤, 니카르디핀, 딜티아젬, 니트로글리세린, 니트로프루사이드을 사용할 수 있다."], ["p", "수축기혈압을 140 mmHg 근처까지 혈압을 낮추었던 연구에서 약간의 이득이 보고되었으나, 수축기혈압을 140 mmHg 미만으로 낮추는 것은 현재로서는 권고되지 않는다."], ["h", "13.11.3. 뇌졸중의 이차 예방"]], "51": [["p", "뇌졸중 이후의 이차 예방을 위한 고혈압 치료는 사망률을 감소시키고, 뇌졸중 및 혈관질환의 재발을 유의하게 낮추는 것으로 보고되었다. 고혈압 병력이 없는 환자라도 뇌졸중 또는 일과성 허혈 발작 후 수일이 경과한 시점에 혈압이 140/90 mmHg 이상으로 지속되는 경우에는 이차 예방을 목적으로 항고혈압제를 시작해야 한다. 마찬가지로 기존에 항고혈압제를 투여 받던 환자에서는 뇌졸중 또는 일과성허혈성 발작이 발생한 경우에도, 급성기를 지나 수일 후 이차 예방목적으로 항고혈압 치료를 재개하는 것이 권고된다."], ["p", "고혈압의 과거력 유무와 관계없이, 뇌졸중 이후의 고혈압 치료는 사망률과 합병증 발생을 감소시키기 때문에, 약물 치료와 함께 생활요법을 포함한 포괄적인 고혈압 관리가 필요하다. 항고혈압제의 선택은 두개강외 폐색성 뇌혈관질환, 콩팥 질환, 심장 질환, 당뇨병 등 환자의 동반 질환와 임상적 특성을 고려하여 개별화해야 한다."], ["p", "메타분석 결과에 따르면, 뇌졸중 이차 예방을 위한 항고혈압 치료로는 ACE 억제제와 이뇨제의 병용요법이 효과적인 것으로 보고되었다. 또한 열공성뇌경색 환자를 대상으로 한 SPS3 연구에서는 목표 수축기혈압을 <130 mmHg 미만으로 설정한 군이 목표 혈압을 130-140 mmHg으로 설정한 군에 비해 심혈관 사건 발생을 유의하게 감소시키지는 못하였으나, 뇌출혈의 발생 위험은 63% 감소시켰다. 이러한 결과를 근거로, 열공성뇌경색 환자에서는 목표 수축기혈압을 130 mmHg 미만으로 조절하는 것을 고려할 수 있다."], ["h", "13.12. 발기 부전 환자의 고혈압 치료"], ["p", "고혈압환자에서 발기 부전은 심뇌혈관질환의 위험인자 중 하나로 간주되며, 불량한 예후와 연관된다는 보고가 있다. 따라서 당뇨병, 이상지질혈증, 흡연 등 동반된 위험인자를 적극적으로 조절하고 생활습관 개선을 포함한 포괄적인 관리 전략을 통해 전반적인 심뇌혈관 위험을 낮추는 것이 중요하다."], ["p", "그러나 고혈압환자의 발기 부전은 대부분 진단되지 않은 상태로 남아 있으며, 소수의 환자만이 자발적으로 의사에게 상담을 요청하는 것으로 알려져 있다. 이에 따라 심뇌혈관 예후 개선을 위해서는 진료 과정에서 발기 부전에 대한 적극적인 문진과 평가를 시행하고, 치료 전략에 이를 반영하는 것이 필요하다."], ["p", "항고혈압제에 의한 발기 부전의 발생률은 약 0~25%로 보고되고 있으나, 고혈압 자체도 내피세포 기능 장애, 산화스트레스 증가 등을 통해 발기 부전을 유발할 수가 있어 약제와의 인과 관계를 명확히 평가하기는 어렵다. 발기 부전은 대개 항고혈압제 투여 후 4주 이내에 나타나며, 약제와의 연관성이 명확한 경우에는 약물 변경을 고려할 수 있다. 다만 이 경우에도 기존 동맥경화성 혈관 질환의 진행 가능성을 함께 고려하여야 한다. 베타차단제와 이뇨제가 발기 부전과 연관되는 것으로 보고된 반면, 칼슘통로차단제나 ACE 억제제는 대체로 중립적인 영향을 보이며, ARB는 발기 기능에 오히려 유익할 수 있다는 보고가 있다. 베타차단제가 발기 부전과 연관된 것으로 판단되는 경우에는 혈관 확장 작용이 있는 베타차단제로의 변경을 고려할 수 있다."], ["p", "Phosphodiesterase-5 억제제(PDE5 inhibitor)는 항고혈압제에 의한 발기 부전 환자에서 비교적 안전하고 효과적으 압 저하 여부에 대한 주의 깊은 관찰이 필요하며, 질산염 제제와의 병용 투여는 금기이다. 또한 베타차단제와 알파차단제를 병 용할 경우 저혈압 발생 위험이 증가할 수 있으므로 주의가 필요하다."], ["p", "최근 SPRINT 연구에 따르면 중년 및 노년 여성에서는 고혈압 또는 항고혈압제의 사용이 성기능장애와 연관성을 보이지 않았으며 여성에서 고혈압 및 항고혈압제에 의한 성기능 장애 간의 관련성은 남성에 비해 명확하지 않은 것으로 보고되었다."], ["p", "치료 지속성을 향상시키기 위해 모든 고혈압환자에서는 진단 초기뿐 아니라 추적관찰 기간 동안에도 성기능 장애 여부에 대한 문진을 정기적으로 시행하는 것이 필요하다. 특히 성기능 장애를 호소하는 남성 환자에서는 임상적으로 반드시 필요한 경우가 아니라면, 상대적으로 성기능 장애와의 연관성이 높은 베타차단제나 이뇨제의 사용을 피하거나 다른 계열의 항고혈압제로의 변경을 고려하는 것이 바람직하다."], ["h", "13.13. 임신과 고혈압"]], "52": [["p", "임신중 발생하는 고혈압(hypertensive disorders in pregnancy)은 크게 네 가지로 분류된다 <표 19>. 임신중 발병하는 고혈압의 중증도는 혈압 정도에 따라 경증(수축기혈압 140–149 또는 이완기혈압 90–99 mmHg), 중등증(150– 159/100–109 mmHg), 중증(≥160/110 mmHg)으로 구분한다."], ["cap", "표 19. 임신중 발생하는 고혈압의 분류3"], ["p", "만성고혈압 (Chronic hypertension) 임신성 고혈압 (Gestational hypertension) 전자간증 단백/크레아티닌 비율 ≥300 mg/g) 또는 기타 신경학적 증상, 폐부종, 혈액학적 이상, (Preeclampsia) 급성 신손상, 간기능 이상 등 장기 기능이 동반된 경우 만성고혈압에 겹친 전자간증 (Preeclampsia superimposed on 발생한 경우 chronic hypertension) 임신부에서도 진료실혈압의 한계를 보완하고 보다 정확한 고혈압의 진단과 예후 평가를 위해 진료실 밖 혈압(활동혈압 또는 가정혈압) 측정을 시행하는 것이 바람직하다. 이러한 진료실 밖 혈압 측정은 백의고혈압 및 가면고혈압의 감별 뿐 아니라 약물치료의 필요성 및 치료 효과 평가에도 유용하다. 활동혈압 측정 또는 가정혈압 측정은 임신성 고혈압이 있는 임신부에서 혈압 조절 및 예후 개선에 도움이 된다. 또한 여러 역학 연구에 따르면 불임 치료 경험이 있는 여성은 그렇지 않은 여성에 비해 임신중 고혈압 질환의 발생 위험이 약 1.2~1.7배 증가하는 것으로 보고되어, 이런 환자군에서 는 혈압 측정이 더욱 중요하다. 임신성 고혈압(gestational hypertension) 또는 만성고혈압(chronic hypertension)이 있는 임신부에서 수축기혈압 ≥140 mmHg 또는 이완기혈압 ≥90 mmHg인 경우 약물치료의 시작 또는 혈압 강하를 권고한다. 만성고혈압이 있거나(전자간증 유무와 무관) 임신성 고혈압이 있는 경우, 목표 혈압은 수축기혈압은 <140 mmHg 이완기혈압은 <90 mmHg로 강하시키되, 이완기혈압을 80 mmHg 미만으로 과도하게 낮추지 않도록 주의한다,835. 과도한 혈압 강하는 태아 혈류 감소와 태아 성장 지연의 위험을 증가시킬 수 있으므로 권장되지 않는다."], ["p", "전자간증(preeclampsia) 발생 위험이 중등도 이상인 고위험 임신부에서는 저용량 아스피린(75~150 mg/일) 투여를 권고한다. 임신부에서 15분 간격으로 반복 측정하여 수축기혈압 ≥160 mmHg 또는 이완기혈압 ≥110 mmHg이 확인되는 경우에는 중증 고혈압으로 간주하여 입원을 권고한다,4."], ["p", "약물 요법은 단일 요법이 병용요법보다 우선 고려될 수 있으며, 임신 중 안전하게 사용 가능한 항고혈압제로는 메틸도파, 라베타롤, 니페디핀, 암로디핀(amlodipine)등이 있으며, 이 중 메틸도파, 라베타롤 경구 및 히드랄라진 주사 약제는 희귀·필수 약품센터을 통해 신청이 가능하다(부록 5.1). ACE 억제제 또는 ARB는 태아 기형과 신독성 위험이 있으므로 임신 전 또는 임신 확인 즉시 중단하고 다른 약제로 교체해야 한다. 전자간증이나 중증 고혈압 등 응급 상황 에서는 라베타롤 정주 또는 경구 니페디핀을 사용할 수 있다. 또한 임신을 계획하는 여성에서는 아테놀롤, ACE 억제제, ARB, 니트로프루시드, MRA의 사용을 피해야 한다."], ["p", "분만 후에는 혈압을 140/90 mmHg 미만으로 조절할 것을 권고하며,839, 수유 중에는 모유 이행이 적은 니페디핀, 에 날라프릴(enalapril), 암로디핀, 라베타롤을 우선 고려한다<부록 5.2>4,845. 전자간증 병력이 있는 여성은 향후 고혈압 및 심뇌혈관질환의 발생 위험이 증가하므로 지속적인 혈압 모니터링과 생활습관 개선 교육 및 장기 추적 관찰이 필 요하다. 특히 32주 이전에 전자간증이 발생하였거나, 태아 성장지연, 사산 등의 병력이 있는 경우에는 보다 면밀한 관 리가 요구된다,4. 임신성 고혈압은 대체로 산후 12주 이내 정상화되므로 이 기간 동안 혈압 추적 관찰이 필요하며, 산 후 12주 이후에도 고혈압이 지속될 경우 `임신성 고혈압’ 진단보다는 `만성고혈압’으로의 전환을 고려해야 한다."], ["h", "13.14. 여성과 고혈압"], ["p", "여성의 고혈압 유병률은 젊은 연령대에서는 남성보다 낮으나, 폐경 이후 급격히 증가하여 60세 이후에는 남녀 차이가 없거나 오히려 여성에서 더 높게 나타난다<그림 6>. 연령이 증가에 따른 맥압의 증가는 남녀 모두에서 관찰되지만, 폐경 이후 여성에서는 폐경 이전보다 수축기혈압과 이완기혈압이 모두 상승하는 경향을 보인다. 다만 폐경 이후 여성에서는 백의고혈압의 빈도가 높아 고혈압 진단 시 진료실혈압에만 의존하기 보다는 진료실 밖 혈압 측정을 통한 신중한 평가가 필요하다."], ["p", "폐경 이후에는 체중 증가, 호르몬 변화 및 심리적인 변화가 동반되며, 특히 여성 호르몬인 에스트로겐 감소로 인해 다양한 폐경기 증상과 함께 많은 심혈관 변화가 나타난다. 과거에는 폐경기 이후 여성에서 호르몬 대체요법이 널리 사용되었으나, 임상 연구 결과 심뇌혈관질환 예방 효과가 없으며, 오히려 위험을 증가시키는 것으로 보고되어, 심뇌혈관질환 예방을 목적으로 한 호르몬 대체요법은 권고되지 않는다. 또한 호르몬 대체요법은 혈압을 상승시킬 수 있으므로, 고혈압 발생 위험이 있는 여성에서는 치료 초기 수개월 동안 혈압을 면밀히 관찰할 필요가 있다."], ["p", "여성과 남성 간 고혈압 치료 전략에는 차이가 없으며, 혈압 강하 효과나 항고혈압제 계열 간 치료 효과에서도 성별에 따른 유의한 차이는 보고되지 않았다. 경구피임약 복용 시 일부 여성에서 혈압 상승이 관찰될 수 있으나, 가속성 혹은 악성 고혈압의 발생은 드물다. 다만 고혈압의 가족력, 임신중 고혈압의 과거력, 잠재성 콩팥 질환, 비만이 있거나 경구 피임약 복용 기간이 길수록 그 위험이 증가하므로, 피임약 복용 초기에는 혈압을 주의 깊게 관찰하고 이후에는 정기적인 혈압 측정을 권고한다."], ["h", "13.15. 수면무호흡증"]], "53": [["p", "지속적 기도 양압(continuous positive airway pressure, CPAP) 치료는 수면무호흡증의 증상과 중등도를 효과적으로 개선하며,고혈압이 동반된 환자에서는 평균 2~3 mmHg의 혈압 강하 효과를 보인다. 혈압 감소 효과는 치료 순응도와 질환의 중증도, 주간 졸림 증상의 동반 여부에 따라 차이를 보인다."], ["h", "13.16. 인지 기능장애"]], "54": [["p", "혈관질환 및 그 위험인자들은 알츠하이머 치매를 포함한 대부분의 치매 발생에 중요한 병인으로 작용한다. 고혈압은 허혈성 대뇌 소혈관질환과 대뇌 백진 이상의 주요 위험인자이고, 이러한 병변들은 대뇌 신경회로의 손상을 통해 인지 기능 저하를 유발할 수 있다. 다수의 관찰연구에서 수축기혈압이 잘 조절된 경우 알츠하이머 치매 및 기타 치매의 발생이 감소하였으며, 특히 60대 이후에 치료를 시작한 경우보다 50대부터 고혈압 치료를 시작한 환자에 서 치매 예방 효과가 더 큰 것으로 보고되었다."], ["p", "고혈압 치료가 치매 발생에 미치는 영향을 평가한 무작위대조시험에서는 인지 기능 저하나 치매 발생에 대한 고혈압 치료의 부정적인 영향은 관찰되지 않았다. 비록 검정력 부족과 추적 관찰 기간의 한계로 통계적으로 유의한 예방효과를 입증하지는 못하였으나, 적극적인 혈압 조절이 치매 발생을 감소시키는 경향이 일관되게 관찰되었다."], ["h", "13.17. 고혈압성 응급 및 급성 중증 고혈압"]], "55": [["p", "고혈압성 응급(hypertensive emergency)은 혈압이 ≥180/110 mmHg로 현저히 상승하면서 뇌, 심장, 신장 또는 대동맥 등 표적장기에 고혈압으로 인한 급성 손상이 동반된 상태로 정의되며, 즉각적인 입원 치료와 정주 항고혈압제 를 이용한 신중한 혈압 강하 치료가 필요하다. 반면 급성 중증 고혈압(acute severe hypertension)은 혈압은 ≥180/110 mmHg로 급격히 상승하였으나, 고혈압에 의한 급성 장기 손상이 명확히 확인되지 않은 경우를 의미한다 3,5,869. 과거 급성 장기 손상이 없는 중증 고혈압을 지칭하던 ‘고혈압성 긴급(hypertensive urgency)’이라는 용어는 개념적 모호성이 지적되어 왔으며, 이를 별도의 응급 상태로 구분하기보다는 급성 중증 고혈압의 범주에서 접근하는 것이 바람직하다."], ["p", "급격한 혈압 상승은 뇌와 신장을 포함한 주요 장기의 자율 조절 범위를 초과하여 관류 장애를 유발할 수 있으며, 이는 고혈압에 의한 급성 장기 손상의 발생 또는 악화를 초래한다. 특히 만성 고혈압환자에서는 장기 관류에 대한 자율 조절 곡선이 상향 이동되어 있어, 혈압을 급속히 낮출 경우 상대적 저관류가 발생할 위험이 크다. 따라서 고혈압성 위기 환자에서 치료의 목표는 혈압을 즉각적으로 정상화하는 데 있지 않으며, 장기 손상의 진행을 예방하면서 안전한 범위 내에서 단계적으로 혈압을 조절하는 데 있다. 이러한 병태생리적 특성을 고려하여, 모든 환자에게 동일한 혈압 목표와 강하 속도를 일률적으로 적용하기보다는 개별 환자의 임상 상황과 위험도를 반영한 맞춤형 접근이 필요하다."], ["p", "모든 환자에서는 반복적인 혈압 측정을 통해 일시적인 혈압 상승과 지속적인 중증 고혈압을 구분하고, 신경학적 증상, 흉통, 호흡곤란, 시야 이상, 소변량 감소 등의 임상 증상을 확인하여 고혈압에 의한 급성 장기 손상 가능성을 평가해야 한다. 급성 장기 손상에 대한 평가는 혈액검사와 소변검사, 심전도 및 흉부 영상 검사를 기본으로 시행하며, 임상적 필요에 따라 뇌 영상, 심장초음파, 대동맥 영상 검사 등을 추가로 고려한다."], ["p", "고혈압성 응급 환자는 입원하여 집중 감시하에 치료하는 것을 원칙으로 하며, 과도한 급속 혈압 강하는 피해야 한다."], ["p", "일반적으로 정맥내 항고혈압제를 사용하여 초기 1시간 이내 평균동맥압을 약 20~25% 감소시키고, 이후 수 시간에서 수일에 걸쳐 점진적으로 혈압을 조절한다. 다만 급성 대동맥 박리가 동반된 고혈압성 응급 환자에서는 정주용 베타차단제를 우선 투여하여 대동맥벽 스트레스를 감소시키고, 심박수를 분당 60~80회로 조절하면서 장기 관류를 유지하는 범위 내에서 수축기혈압을 120 mmHg 미만으로 신속히 조절하는 것을 권고한다,871,872. 반면 고혈압에 의한 급성 장기 손상이 확인되지 않은 급성 중증 고혈압환자에서는 즉각적인 정주 항고혈압제 사용은 권고되지 않으며, 경구 항고혈압제의 조정 또는 재개를 우선적으로 고려하고, 임상적으로 안정적인 경우 외래 추적 관찰을 포함한 치료 계획을 수립한다."], ["p", "급성 중증 고혈압환자에서는 고혈압에 의한 급성 장기 손상이 동반되지 않더라도, 고령, 만성콩팥병, 심뇌혈관 질환의 동반, 또는 고혈압 치료 지속성 부족 등으로 인해 임상 경과가 불량할 수 있다. 따라서 급성기 치료 이후에도 지속적인 혈압 조절과 심뇌혈관 위험인자 관리가 필요하다. 다만 이러한 환자 군의 추적 관찰 및 관리 전략에 대한 근거는 제한적 이므로, 개별 환자의 임상적 특성을 고려하여 외래 추적관찰을 포함한 장기적인 관리 계획을 수립하는 것이 바람직하 다."], ["h", "14.1. 환자 중심 진료의 개념과 의사 소통"], ["p", "환자 중심 진료(patient-centered care)는 환자의 선호와 필요를 최우선으로 고려하는 의료인의 태도에 기반한 진료 접근으로, 환자를 단순한 치료의 대상이 아닌 보건의료 서비스의 동반자로 인식하는 개념이다. 특히 고혈압과 같은 만성질환의 관리에서 환자 중심 진료는 환자 만족도 증가, 치료 권고 및 약물 처방에 대한 이행도 증가, 그리고 전반적인 치료 결과 성과 개선과 연관되어 있다."], ["p", "환자 중심 진료는 단순히 치료 방법에 대한 일방적인 설명을 넘어, 치료 결정 과정 전반에 환자를 적극적으로 참여 시키는 공유의사결정을 포함한다. 비록 고혈압 진료에서 구체적인 공유 의사결정 전략의 효과에 대한 근거는 아직 제한적 이지만, 환자 중심 진료는 임상 진료 지침 뿐 아니라 보건의료 정책 및 의료 윤리의 관점에서도 윤리적으로 필수적인 접근으로 인정되고 있다."], ["p", "환자가 자신의 고혈압 관련 위험도, 치료의 필요성 및 목표, 치료의 이점과 잠재적 부작용을 충분히 이해하도록 돕는 것이 환자 중심 진료의 핵심이며, 이를 위해 의료인은 정량적 지표나 시각 자료를 활용한 설명 방식을 적용할 수 있다. 이 과정에서는 환자의 건강 문해력과 정보 이해 수준, 의사 결정에 대한 선호도를 고려한 맞춤형 의사 소통이 필요하며, 연령, 성별, 교육 수준, 사회경제적 배경과 같은 사회인구학적 특성도 중요한 고려 요소이다."], ["p", "14.2. 자가 혈압 측정 및 모니터링(self-measuring and monitoring of blood pressure) 자가 건강관리(self-care)는 건강한 생활 습관을 유지하고 질병을 예방하기 위한 개인의 주도적 행동을 의미한다. 고혈압 관리에서는 이러한 자가 건강관리에 더하여, 질환을 스스로 조절하는 자가 관리(self-management)와 혈압의 자가 측정(self-measurement)이 핵심 요소로 작용한다. 자가 관리는 식이 조절, 규칙적인 운동, 금연, 절주와 같은 생활습관 개선의 시작뿐만 아니라, 생활요법의 지속적 이행과 처방약에 대한 약물치료 지속성 등을 포함한다. 특히 자가 혈압 측정은 고혈압의 조기 발견을 가능하게 하고, 환자의 생활습관 개선에 대한 적극적 참여를 촉진하며, 의료진과의 협력적 상담을 통해 약물치료를 조정함으로써 보다 안정적이고 효과적인 혈압 조절에 기여할 수 있다."], ["h", "14.3. 치료 지속성 향상"], ["p", "실제 임상에서는 혈압강하제 복용에 대한 약물치료 지속성은 임상시험 환경보다 낮은 경우가 많으며, 난치성(혹은 저항성)고혈압의 상당 부분은 치료 지속성 부족(non-adherence)에 기인한다. 치료 지속성에 대한 평가는 환자를 비난하지 않는 비난 없는(no-blame) 접근을 원칙으로 하여야 하며, 이를 위해 다양한 평가 도구의 활용와 치료 지속성 저해 요인에 대한 체계적인 분석이 필요하다."], ["p", "치료 지속성을 향상시키기 위해서는 환자에게 적합한 최적의 약물치료 전략을 구성하는 것이 중요하며, 이는 정기적인 약물 복용 검토를 통해 달성할 수 있다. 이러한 과정에서 고려되어야 할 요소는 다음과 같다<표 20>."], ["cap", "표 20. 치료 지속성 향상을 위한 고려 사항"], ["p", "한편, 고혈압을 포함한 만성질환에서 자가 관리를 지원하기 위한 디지털 헬스 도구들이 개발되고 있으나, 현재까지는 이러한 개입의 효과에 대한 근거가 제한적이다. 따라서 현 시점에서는 특정 기술에 대한 권고는 근거가 충분하지 않다"], ["h", "14.4. 다학제 관리(Multidisciplinary management)"], ["p", "고혈압환자에서 혈압 조절 및 심혈관계 예후 개선을 위해 다학제 팀 기반 접근(multidisciplinary team-based approach)의 중요성이 점차 강조되고 있다. 이러한 접근은 의사뿐 아니라 간호사, 약사, 영양사 등 다양한 보건의료 인력이 참여하여 환자의 상태를 다각도로 평가하고 치료를 수행하는 방식으로, 진료의 질 향상과 환자의 치료 지속성을 높이는 데 기여한다."], ["p", "다학제 팀 기반 접근은 단독 의사 진료에 비해 수축기 및 이완기혈압을 보다 효과적으로 낮추고, 치료 지속성을 향상시키는 것으로 보고되었다. 또한 심혈관 사건 발생을 감소시킬 가능성도 제기되고 있으나, 이에 대한 근거는 아직 제한적이다. 특히, 고혈압 진료에서의 적절하고 안전한 역할 분담(task-shifting)은 의료 자원의 효율 적 활용과 지속적인 혈압 조절에 도움이 될 수 있다. 이러한 접근은 ESC 20245 및 ACC/AHA 20253 권고에 따라 혈압 조절을 위한 효과적인 전략으로 인정되어, Class I 권고 등급으로 제시되고 있다. 다만, 실제 일차 진료 환경에서는 인력, 시간, 재정적 자원 부족 등의 제약으로 인해 다학제 협력 체계를 구현하기 어려운 경우가 많아, 모든 진료 환경에 일률적으로 적용하는 데에는 한계가 있으며, 이에 대한 추가적인 연구가 필요하다."], ["h", "14.5. 환자 중심 고혈압 관리의 한계와 향후 관리"]], "56": [["p", "현재까지 고혈압 영역에서 환자 중심 진료가 환자 삶의 질 및 기능 상태와 같은 환자 보고 결과(patient-reported outcome measures, PROMs)에 미치는 영향에 관한 근거는 제한적이다. 이러한 환자 중심 진료의 필요성은 널리 인식되고 있으나, 실제 임상 현장에 적용하는 데에는 여러 수준의 구조적 장벽이 존재한다. 주요 장벽으로는 짧은 진료 시간과 환자 참여 기회의 부족, 다학제 협력 시스템의 미비, 환자 중심 평가를 뒷받침하는 보상·수가 체계 미비, 의료진의 PROMs 활용에 대한 교육· 및 훈련 부족 등이 있다. 디지털 헬스(digital health) 및 모바일 헬스(mobile health) 기술의 발전을 활용하여 환자 중심 진료 및 다학제 관리의 효과를 활성화하기 위해서는 정책적·제도적 지원과 함께, 이를 뒷받침할 연구와 근거 축적이 필수적이다."]]};
const tbl = (h, rows, cap) => `<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${cap?`<p class="small" style="color:var(--muted)">${cap}</p>`:''}`;

'10':{t:'심뇌혈관질환 위험인자와 무증상 장기 손상', h:tbl(['구분','내용'],[['심뇌혈관질환 위험인자','연령(남성 ≥45세, 여성 ≥55세)* · 조기 심뇌혈관질환의 가족력(남성 &lt;55세, 여성 &lt;65세) · 흡연 · 비만(체질량지수 ≥25 kg/m²) 또는 복부 비만(복부 둘레 남성 ≥90 cm, 여성 ≥85 cm) · 이상지질혈증(총콜레스테롤 ≥240 mg/dL, LDL-콜레스테롤 ≥160 mg/dL, HDL-콜레스테롤 &lt;40 mg/dL, 중성지방 ≥200 mg/dL) · 당뇨병 전단계[공복혈당 장애 또는 내당능 장애(100≤ 공복혈당 &lt;125 mg/dL)] · 당뇨병(공복혈당 ≥125 mg/dL, 경구 당부하 2시간 혈당 ≥200 mg/dL, 또는 당화혈색소 ≥6.5%)*'],['무증상 장기 손상','뇌 – 뇌실주위백질 고신호강도, 미세 출혈, 무증상 뇌경색 · 심장 – 좌심실 비대 · 콩팥 – 미세알부민뇨(무작위 소변 알부민/크레아티닌 비율 30∼300 mg/g) · 혈관 – 죽상경화반, 목동맥-대퇴동맥 간 맥파전달속도 &gt;10 m/sec, 위팔동맥-발목동맥 간 맥파전달속도 &gt;18 m/sec, 관상동맥석회화 점수 ≥400, 발목-위팔 혈압 지수(&lt;0.9)† · 망막 – 3~4단계 고혈압성 망막증'],['임상적 심뇌혈관질환 및 콩팥 질환','뇌 – 뇌졸중, 일과성 허혈발작, 혈관성 치매 · 심장 – 협심증, 심부전, 심방세동 · 콩팥 – 만성콩팥병 3기 이상(eGFR &lt;60 mL/min/1.73 m²), 현성단백뇨(&gt;300 mg/g) · 혈관 – 말초혈관질환, 대동맥류, 대동맥 박리증']],'*65세 이상, 당뇨병은 위험인자 2개로 간주. †발목-위팔 혈압 지수(ankle brachial index, ABI). 원문 표기대로 옮겼다(당뇨병 전단계 상한 125, 당뇨병 공복혈당 ≥125).')},

'12':{t:'이차성 고혈압의 임상적 적응증 및 진단', h:tbl(['원인','임상적 적응증','진단적 검사'],[['일차성 알도스테론증','근력저하 · 조기 발병 고혈압 · 40세 미만에서 뇌혈관질환 발생의 가족력 · 저칼륨혈증','선별: 알도스테론-레닌 활성 비율(ARR) · 확진: 경구 염분부하검사, 생리식염수 주입검사, 캅토프릴 억제검사, 플루드로코르티손 억제검사 · 아형구분: 부신 CT, 부신정맥채혈'],['신동맥협착증','섬유근형성이상: 젊은 연령, 여성 · 죽상경화증: 고혈압 악화 및 치료 저항성 고혈압, 반복적인 폐부종 · 신체 진찰: 복부 잡음','선별: 신장동맥 이중초음파검사, CT 혈관조영술, MRA · 확진: 신장동맥 조영술'],['콩팥실질병','요로 감염 또는 요로 폐쇄의 병력 · 진통제 남용, 당뇨병의 가족력','소변 내 단백질, 사구체 여과율 감소 평가, 콩팥초음파'],['복부 종양(다낭콩팥병)','복부 종괴 · 가족력','콩팥초음파'],['크롬친화세포종(갈색세포종)','발작적 고혈압, 두통, 발한 · 신체 진찰: 신경섬유종증의 피부병변(café-au-lait 반점)','24시간 소변/혈장 내 메타네프린 및 노르-메타네프린 검사 · 복부 CT/MRI 또는 MIBG 스캔'],['쿠싱증후군','빠른 체중 증가, 다모, 무월경 · 신체 진찰: 중심성비만, 달모양얼굴, 자색 선조','24시간 소변 내 유리코티솔 검사 · 덱사메타손 억제 검사'],['수면무호흡증','비만, 심한 코골이, 수면 중 무호흡, 주간 졸림','수면다원검사']])},
'13':{t:'고혈압 치료의 목표 혈압', h:tbl(['임상 상황','수축기혈압(mmHg)','이완기혈압(mmHg)','권고 등급/근거 수준'],[['<b>합병증이 없는 고혈압</b>','','',''],['중∙저위험도 고혈압','&lt;140','&lt;90','I/A'],['노인 고혈압','&lt;140','&lt;90','I/A'],['고위험도 고혈압*','&lt;130','&lt;80','I/A'],['당뇨병','&lt;130','&lt;80','I/A'],['<b>합병증이 동반된 고혈압</b>','','',''],['심혈관질환†','&lt;130','&lt;80','I/A'],['만성콩팥병‡','&lt;130','&lt;80','I/A'],['뇌졸중§','&lt;130','&lt;80','I/A']],'*무증상 장기 손상 또는 심뇌혈관질환 위험인자가 3개 이상 동반된 경우 †관상동맥질환, 말초혈관질환, 복부 대동맥류, 심부전 ‡표준 혈압 측정법으로 혈압을 측정할 시 수축기혈압을 120 mmHg 미만을 고려해 볼 수 있다. §두개내 뇌혈관 협착이 동반된 뇌경색 환자는 &lt;140/90 mmHg을 권고한다.')},
'14':{t:'생활요법에 따른 혈압 감소 효과', h:tbl(['생활요법','혈압 감소(수축기/이완기, mmHg)','권고사항'],[['소금 섭취 제한','-5.1/-2.7','하루 소금 5 g(나트륨 2,000 mg) 미만'],['체중 감량','-1.1/-0.9','매 체중 1kg 감소'],['절주','-3.9/-2.4','하루 2잔 미만'],['운동','-4.9/-3.7','하루 30~50분 일주일에 5일 이상'],['식사 조절','-11.4/-5.5','채식 위주의 건강한 식습관*']],'* 건강한 식습관: 칼로리 및 동물성 지방의 섭취를 제한하고, 채소, 과일, 생선류, 견과류, 유제품의 섭취를 증가시키는 식이 요법을 권고. 단 당뇨병 환자에서는 과도한 과일 섭취가 혈당 상승을 유발할 수 있으므로 주의 필요')},
'15':{t:'질환에 따른 추천 고혈압약', h:tbl(['동반질환','ACE 억제제/ARB','베타차단제','칼슘통로차단제','이뇨제','ARNI'],[['심부전','○','○','','○','○'],['좌심실 비대','○','','○','',''],['관상동맥질환','○','○','○','',''],['만성콩팥병','○','','','',''],['뇌졸중','○','','○','○',''],['노인수축기단독고혈압','○','','○','○',''],['심근경색 후','○','○','','',''],['심방세동 예방','○','','','',''],['당뇨병','○','○','○','○',''],['난치성(저항성)고혈압*','○','○','○','○','○']],'*스피로놀락톤, 아밀로라이드를 권고. 열 배치는 원문 레이아웃의 기호 위치로 판독하였다.')},
'16':{t:'고혈압 약의 적응증과 금기', h:tbl(['약제','적극적 적응','적응 가능','주의 요망','금기'],[['ACE 억제제/ARB','심부전 · 당뇨병성신증 · 만성콩팥병','','양측성신동맥협착증 · 고칼륨혈증','임신 · 혈관 부종'],['베타차단제','협심증 · 심근경색','빈맥성 부정맥','혈당 이상 증가 · 말초혈관질환','천식 · 심한 서맥'],['칼슘통로차단제','노인 고혈압 · 수축기단독고혈압 · 협심증','','심부전','서맥(non-DHP*)'],['이뇨제','심부전 · 수축기단독고혈압','','혈당 이상 증가','통풍 · 저칼륨혈증'],['ARNI','심부전 · 염분감수성 고혈압','난치성 고혈압','고칼륨혈증','임신 · 혈관 부종']],'*non-DHP, non-dihydropyridine calcium channel blocker. 칸 배치는 원문 레이아웃으로 판독하였다.')},
'17':{t:'단일제형복합제의 분류와 정의', h:tbl(['분류','정의'],[['초저용량 단일제형복합제 (Ultralow-dose SPC)','복합제에 포함된 약제들의 반 이상이 통상 시작 용량의 1/3 이하 용량으로 구성된 복합제'],['저용량 단일제형복합제 (Low-dose SPC)','복합제에 포함된 약제들의 반 이상이 통상 시작 용량의 1/2 용량으로 구성된 복합제'],['표준용량 단일제형복합제 (Standard-dose SPC)','복합제에 포함된 약제들의 반 이상이 통상 시작 용량으로 구성된 복합제'],['고용량 단일제형복합제 (High-dose SPC)','복합제에 포함된 약제들의 반 이상이 통상 시작 용량의 2배 내지 최대 용량으로 구성된 복합제']])},

'19':{t:'임신 중 발생하는 고혈압의 분류', h:tbl(['질환 구분','정의'],[['만성고혈압 (Chronic hypertension)','임신 전 또는 임신 20주 이전에 진단된 고혈압'],['임신성 고혈압 (Gestational hypertension)','임신 20주 이후 새로 발병한 고혈압으로, 단백뇨나 전자간증의 다른 징후가 없는 경우'],['전자간증 (Preeclampsia)','임신성 고혈압에 의해 단백뇨(24시간 요 단백 ≥300 mg 또는 단백/크레아티닌 비율 ≥300 mg/g) 또는 기타 신경학적 증상, 폐부종, 혈액학적 이상, 급성 신손상, 간기능 이상 등 장기 기능이 동반된 경우'],['만성고혈압에 겹친 전자간증','임신 전 또는 임신 20주 이전부터 고혈압이 있었던 임신부에서 새롭게 전자간증이 발생한 경우']])},

const LV = {I:'I: 이익이 명백함 — 권고한다 (is recommended)', IIa:'IIa: 이익이 손해보다 많음 — 고려한다 (should be considered)', IIb:'IIb: 편익에 대한 근거는 제한적이나 진료현장에서의 활용도가 높거나 보통인 경우 — 고려할 수 있다 (may be considered)', III:'III: 이익이 없거나 손해가 명백함 — 권고하지 않는다 (is not recommended)'};
const LOE = {A:'A: 2개 이상의 무작위대조시험 또는 무작위대조시험으로 이루어진 메타분석', B:'B: 1개의 무작위대조시험 또는 관찰 연구나 코호트 연구로 이루어진 메타분석', C:'C: 제한적인 연구결과 또는 전문가 의견'};
const LVCLS = {I:'l1', IIa:'l2', IIb:'l3', III:'l5'};
const recNum = id => id.split('.')[0];
const EXPMAP = Object.fromEntries(Object.keys(REC).map(k=>[k, k.split(".")[0]]));
const R = id => {
  const [c, l, t] = REC[id];
  const key = id.replace('.','-');
  const badge = `<span class="lv ${LVCLS[c]}" title="${LV[c]} · 근거 ${LOE[l]}">${c} · ${l}<span class="lv-ic" aria-hidden="true"></span></span>`;
  return `<div class="rec has-exp" role="button" tabindex="0" aria-expanded="false" aria-controls="exp-${key}" data-rid="${id}"><span class="rid">${id}</span><p>${t}</p>${badge}</div><div class="exp" id="exp-${key}" hidden></div>`;
};
const RR = (...ids) => ids.map(R).join('');
const RN = n => { const ids = Object.keys(REC).filter(k => recNum(k) === String(n)); return `<h4>권고 ${n}. ${TITLES[n]}</h4>${RR(...ids)}${NOTES[n] ? `<p class="small" style="color:var(--muted)">${NOTES[n]}</p>` : ''}`; };
const segHTML = blocks => blocks.map(([t, x]) => {
  if (t === 'h') return `<h5>${x}</h5>`;
  if (t === 'cap') {
    const m = x.match(/^(표|그림)\s?(\d+)\./);
    if (m && m[1] === '표' && TABS[m[2]]) return `<h5>표 ${m[2]}. ${TABS[m[2]].t}</h5>${TABS[m[2]].h}`;
    if (m && m[1] === '그림' && FIGTAB[m[2]]) return `<p class="small" style="color:var(--muted)">〔${x.replace(/\d+$/,'')} → ‘${CHARTS[FIGTAB[m[2]]].tab}’ 탭에서 순서도로 볼 수 있다〕</p>`;
    return `<p class="small" style="color:var(--muted)">〔${x.replace(/\d+$/,'')} — 원문 참조〕</p>`;
  }
