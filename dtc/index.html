하는 잔존 병소의 존재 등에 대한 유용한 정보를 제공하여, 치료를 변화 시키고 결과에 도움을 줄 수 있다.", "최근 미국갑상선학회(American Thyroid Association, ATA), 유럽핵의학회(European Association of Nuclear Medicine, EANM), 유럽갑상선학회(European Thyroid Association, ETA), 미국핵의학분자영상학회(Society of Nuclear Medicine and Molecular Imaging, SNMMI)의 공 동성명서에서 중간위험군 환자에서 수술 후 방사성요오드 진단스캔의 사용은 일률적인 사용 또는 거부가 아닌 선택적 접근 방식을 지지한다고 발표하였다. 특히, 평면 영상에서 비정상적인 섭취가 의심되는 경우, SPECT/CT를 시행하면 병소의 확인 및 정확한 해부학적 위치 파악을 통해 평면영상에서의 불명확한 소견을 줄여주고 수술 후 병기를 변화시킬 수 있다. SPECT/CT 소견과 TSH-자극 갑상선글로불린을 함께 이용하여 15%의 환자에서 추적 관찰 중 재평가(지속적위험분류; ongoing risk stratification, ORS)된 재발위험도를 바꾸었으며 29.4%의 환자에서 치료 방침의 변화를 가져올 수 있었다. 방사성요오드 치료 전에 <sup>131<\/sup>I을 이용한 진단스캔을함으로써 발생할 가능성이 있는 기절 효과(stunning effect)에 의한 방사성요오드 잔여갑상선제거 실패의 위험은 <sup>123<\/sup>I을 사용하거나 저용량(1-3 mCi, 37-111 MBq)의 <sup>131<\/sup>I를 사용함으로써 경감시키거나 피할 수 있다."]}, "I.6.2.A": {"ids": ["I.6.2.A", "I.6.2.B", "I.6.2.C"], "p": ["방사성요오드 치료의 의사결정에 있어서 수술 후 종합적으로 평가된 재발위험도와 함께 추가적으로 고려할 사항으로는, 환자의 동반 질환(방사성요오드 치료 용량 이나 준비과정에의 잠재적 영향), 선호되는 추적관찰 방법, 방사성요오드 치료가 환자의 치료 목표에 미칠 것으로 예상되는 효과와 치료 연관 합병증의 위험도, 환자의 선호도와 가치관(특히 방사성요오드 치료 선택에 대한 높은 수준의 전향적 근거가 적을 때 중요함) 등이 있다. 방사성요오드 치료의 최종 결정은 종종 환자의 바람과 희망, 거부감, 공포 등에 영향을 받는다. 따라서 담당 의사가 가능한 최대한 객관적인 평가를 제공하고 환자의 개별 상황에 관련하여 방사성요오드 치료의 장단점을 토의하는 것이 뒷받침되어야 한다.", "(1) 저위험군 중 RAI 치료 대상", "Table I.5.1.A에 제시된 저위험군 환자들은 질병관련 사망 및 잔존/재발 질병의 위험이 낮고, 잔존 질병을 늦게 발 견하더라도 질병의 완치 가능성이 낮아진다는 증거는 없다.", "저위험군 환자들에 대한 방사성요오드 보조치료 효과에 대한 관찰 연구를 살펴보면, 대부분의 미세유두암 (≤1 cm, 단일 혹은 다발성) 환자에서 다른 위험 요소가없다면 재발에 대해서는 서로 상충된 보고들이 있으나, 질병 관련 혹은 무병 생존율을 개선시키지 않았다. 최근 발표된 대규모 전향적 무작위 다기관 연구 (ESTIMABL2)에 따르면, N0 또는 Nx인 pT1a 또는 pT1b 환자를 대상으로 방사성요오드 치료를 시행하지 않은 환자군에서 치료를 시행한 환자군에 비해 3년간의 추적 관찰 기간 동안 기능적, 구조적, 생화학적 이상 발생에 차이가 없었다. 저위험군 환자에서 방사성요오드 치료 여부에 따른 예후의 차이를 보고자 하는 또다른대규모 전향적 무작위 연구(IoN)도 진행 중이다. 이에 따라, 2015 ATA 권고안에서는 방사성요오드 치료의 대 상군과 용량을 축소하여, 저위험군 갑상선암 환자에서는 일률적인 잔여갑상선제거술을 권고하지 않았다.", "그러나 이에 대한 우려와 반론이 제시되면서, 저위험군에서 방사성요오드 치료의 이득은 과학적 논쟁의 대상이 되었다. 저위험군 환자의 질병특이사망은 1% 미만이며 지속성/재발성 질병의 위험은 2-3% 정도로 낮은 것으로 알려져 있는데, 이런 환자군을 대상으로 하는 후향적 연구에서 무진행생존의 이득을 증명하는 것이 어렵다. 또한 많은 연구들이 수술 후 질병 상태를 일관적으 로 기술하지 않았고 이들을 대상으로 한 체계적 문헌고찰 연구 결과 역시 일관성을 찾기 어려웠다. 이러한 논쟁의 결과, EANM과 SNMMI는 치료 대상 환자군과 치료 용량에 대한 미국갑상선학회 진료권고안과 다른 진료권고안을 발표하였고, 이후, 2019년 ATA, EANM, SNMMI와 ETA의 공동성명서에서는 저위험군 갑상선암 환자에서의 방사성요오드 잔여갑상선제거술에 대해서 현재까지의 근거로는 권고하지도 반대하지도 않는다고 하였다. 2022년 독일 외과/핵의학회에서는 초기 병 기뿐 아니라 수술 후 검사 소견 등을 종합한 재발에 대한 개별적 위험 인자를 고려하여 환자와의 공유의사결정을 하도록 권고하였다. SNMMI와 EANM에서는 저위험군에서 잔여갑상선제거술 적응증을 별도로 제시하고 있지는 않으면서도 이의 목적과 방법을 제시하여, 일반적으로 잔여갑상선제거술의 시행을 권고하는 것으로 이해된다.", "본 권고안에서 제시한 저위험군은 알려진 재발률이 5% 이하로서, 일률적인 방사성요오드 잔여제거술을 권 고하지는 않았다. 다만 위험도가 낮을 때는 어떤 환자가 일률적으로 방사성요오드 치료의 이득이 기대되는지 확인하여 선택하기 어렵기 때문에 방사성요오드 치료 여부는 개별 위험 요인을 확인하고 결정되어야 한다. 또한 재 발위험도뿐만 아니라 환자의 동반질환과, 추적관찰 방법, 환자의 선호도(특히 방사성요오드 치료 선택에 대한 높은 수준의 전향적 근거가 적을 때) 등을 추가로 고려할 수 있다. 또한 ETA/SNMMI/EANM 등에서 제시한 바와 같이 저위험군이라 하더라도 추적 중 혈청 갑상선글로불린과 경부 초음파 등에 의한 재평가(Table II.1.A) 결과에 따라 방사성요오드 치료 필요성을 고려하여야 한다. 특히, 아직까지 근거가 충분하지는 않지만, 동반된 돌연변이와 종양의 다발성 여부 등에 따라 재발위험도가 달라질 수 있으므로 이에 대한 고려가 필요하다.", "(2) 중간위험군의 RAI 치료 대상", "본 권고안에서 재발위험도 평가를 위해 분류한 중간 위 험군은 재발위험도가 5-30% 사이로 차이를 보이는 이질적 인 환자군이다(Table I.5.1.B – I.5.2.I). 중간위험군에서 방사성요오드 치료의 필요성, 목적(잔여절제술 또는 보조치 료)과 용량 등은 각 환자가 보유하고 있는 위험인자에 따른 재발위험도를 종합적으로 판단하여 결정하여야 한다.", "수술 후 방사성요오드 치료는 공격적인 조직아형(긴 세포, 원주세포, hobnail 등)이거나, 경부 림프절 양성 (N1)이거나 혹은 종양이 4 cm를 초과하는 경우에서 전체적인 생존율을 향상시킨다. 그러나 방사성요오드 치료의 잠재적 이득을 연구한 많은 후향적 연구들이 수술 후 질병 상태에 대한 기술이 일관적이지 않았고 환자 선택과 치료법 역시 매우 이질적이었다는 한계를 가지고 있다. 한 체계적 문헌고찰 연구에서 방사성요오드 치료의 재발감소 효과는 서로 상반된 결과로 결론을 내 리지 못하였으나, 미국 National Cancer Database를 이용하여 중간위험군 환자 21,870명을 분석한 연구에서 방사성요오드 치료가 전체 생존기간을 향상시키는 것으로 보고되었다. 또한, 중간 또는 고위험군만을 대상으로 최근 시행된 체계적 문헌고찰 연구에서 중간위험군의 잔여갑상선제거술 성공률은 72%로 고위험군의 52%보다 높았으며, 성공적인 잔여갑상선제거가 이루어진 중간위험군 환자에서 향후 재발률은 2%에 불과하여 잔여갑상선제거술이 필요함을 보여주었다. 현재 공격적인 조직형, 전이 림프절 개수가 많은 경우, 중앙경부 이외 부위 로의 림프절전이, 고령의 환자 등에서는 잠재적인 이득이 있을 것으로 여겨지고 있다. 다만, 중간위험군에서 보유한 위험인자에 따른 재발위험도가 다양하므로, 방사성요오드 치료의 연구 결과를 모든 중간위험군 환자에게 일률적으로 적용하는 것은 불가능하며, 향후 중간위험군 환자에서 위험인자 단독 혹은 조합에 따른 개별화된 재발위험도 평가와 방사성요오드 치료의 효능을 평가하기 위한 무작위 대조군 연구를 포함하여 더 많은 연구가 필요하다. 현재 저-중간위험군 환자에서 방사성요오드 치료 여부에 따른 예후의 차이를 보고자 하는 국내 다기관 전향적 연구(MOREthyroid)가 진행 중이다.", "이러한 근거들의 한계점을 고려하여 중간위험군에서는 수술 후 위험도 평가, 방사성요오드 투여가 임상 결과 (재발, 질환특이사망률)를 의미 있게 개선시킬 가능성, 잠재적 부작용의 평가, 환자의 선호도와 가치관 등을 고려해야 한다. 특히 방사성요오드 치료 선택에 대한 높은 수준의 전향적 연구 결과를 바탕으로 한 근거가 적을 때, 환자의 선호도와 가치관이 중요하다. 그러나 방사성요오드 치료의 최종 결정은 종종 환자의 바람과 희망, 거부감, 공포 등에 영향을 받는다. 따라서 담당 의사가 가능한 최대한 객관적인 평가를 제공하고, 환자의 개별 상황에 관련하여 방사성요오드 치료의 장단점을 포함한 상담이 뒷받침되어야 한다.", "(3) 고위험군 중 RAI 치료 대상에 대한 기술", "고위험군 갑상선암 환자와 지속적 병소(persistent disease)가 있는 환자는 보조치료 또는 알려진 병소의 치료(therapy of known disease) 대상이 된다. NTCTCSG (National Thyroid Cancer Treatment Cooperative Study Group) 병기 III, IV 환자를 대상으로 한 전향적인 다기관 연구에서 방사성요오드 치료는 무병 생존뿐 아니라 전체 및 질병관련 사망률을 유의하게 감소시켰다. 또한, 미국 SEER 암등록자료의 분석에서도 수술 후 방사성요오드 치료는 원격전이가 있는 유두암 및 여포암 환자에서 전체적인 생존율의 향상과 관련이 있었다.", "원격전이는 갑상선분화암 환자의 10% 미만에서 발생 하는데, 이중 절반은 첫 진단 시 이미 존재하고, 나머지는 나중에 발견되며 때로는 초기 치료 후 수십 년 후에 발견되기도 한다. 원격전이가 있는 환자 3명 중 1명은 방사성요오드 치료로 완치되어 정상에 가까운 기대 수명을 갖게 된다. 고위험군에 해당하는 위험 인자 중, 돌연변이, 전이 림프절의 크기 등의 일부 인자들에 대해서는 방사성요오드 치료에 의한 예후에 대한 영향이 아직까지 확실하게 알려져 있지 않지만, 각 위험인자에 대하여 알려진 재발위험도와 사망에 미치는 영향을 고려하여, 고위험군 환자에서는 수술 후 방사성요오드 치료를 권고한다."]}, "I.6.3.A": {"ids": ["I.6.3.A", "I.6.3.B", "I.6.3.C"], "p": ["잔여갑상선제거 또는 보조치료를 목표로 한 저위험군 환자와 위험도가 낮은 특성의 일부 중간위험군 환자를 대상으로 한 대규모 전향적 무작위 임상 연구(HiLo, ESTIMABL1)에서 30 mCi (1.11 GBq)와 100 mCi (3.7 GBq)의 <sup>131<\/sup>I 은 대체로 비슷한 잔여갑상선제거 성공률과암 재발률을 보였다. 이를 바탕으로 미국갑상선학회에서는 2015 진료권고안에서 저위험군 또는 위험도가 낮은 특성의 중간위험군 환자에서 잔여갑상선제거를 위해 30 mCi (1.11 GBq)의 투여량이 일반적으로 선호됨을 발표하였다. 이후 HiLo와 ESTIMABL1 환자군의 5년 이상의 추적 관찰 연구에서도 재발률의 차이를 보이지 않았으며, 최근 발표된 체계적 문헌고찰 연구에서도 방사성요오드 투여량에 따른 잔여갑상선제거 성공률과 재발률은 차이를 보이지 않았다. 갑상선 주위 연부조 직으로 현미경적 침범이 있는 경우에도 30 mCi (1.11 GBq)의 저용량 방사성요오드 투여로도 고용량 투여와 유사한 치료 성적을 보였다. 이에 따라, 본 권고안에서는 저위험군의 갑상선암에서는 초기 잔여갑상선제거술 목적의 방사성요오드 치료량으로 일반적으로 30 mCi (1.11 GBq)를 사용함을 제시하였으나, 30-50 mCi (1.11-1.85 GBq) 용량으로 사용 가능하다. 한편, 아직까지 방사성요오드 잔여갑상선제거의 성공률에 대한 우리 나라에서의 무작위 대조군 연구 결과는 없지만, 몇몇 관찰연구 결과에 따르면 30 mCi (1.11 GBq)를 사용하였을 때 과거 100 mCi (3.7 GBq) 이상을 사용하였을 때보다 다소 낮게 보고되고 있다. 국내에서 시행된 중간위험 군을 대상으로 한 연구에서는 저용량 투여 군이 높은 생 화학적/구조적 불완전 반응 비율을 보였고 더 많은 추가 방사성요오드 치료를 필요로 하여 저용량 투여가 불충 분할 수 있음이 제시되었다. 최근 국내 25개 기관의 1563 명의 환자를 대상으로 진행된 다기관 후향적 관찰연구에서 100 mCi (3.7 GBq) 이상의 고용량 방사성요오드 치료가 완전반응 등의 좋은 치료 결과의 독립적 예측 인자임이 발표되기도 하였다. 그러나 재발 및 사망 등의 장기 예후에 미치는 영향에 대해서는 알려진 바가 없다, 특히, 우리나라 사람들의 일일 요오드 섭취량이 많은 것을 고려하면, 국내 환자에서 적절한 방사성요오드 치료 용량에 대해서는 무작위 대조군 연구의 장기적 추적이 필요하다.", "중간위험군에서는 방사성요오드 치료 목적이 잔여갑상선제거술과 보조치료로 명확하게 구분하기 어려운 경우가 많으므로, 치료 전 평가된 위험 소견을 고려한 개별 환자의 재발위험도에 따라 30-100 mCi (1.11-3.7 GBq) 의 용량을 사용하도록 권장하고 있다. 고위험군 환자에서 보조치료를 목적으로 방사성요오드 치료를 시행하는 경우에는 100 mCi (3.7 GBq) 용량이 일반적으로 권고된다. ESMO 권고안에서는 100 mCi (3.7 GBq) 이상으로 제시하고 있으나, T4 또는 N1b 환자의 보조치료(adjuvant therapy)를 위해 100 mCi (3.7 GBq)의 방사성요오드를 투여한 군에서 150 mCi (5.55 GBq) 투여 군과 비교하여 잔존암의 여부와 재발률의 차이를 보이지 않았다.", "그러나, 수술 후에도 알려진 갑상선암 병소가 존재하는 경우에는 병소의 정도에 따라 100 mCi (3.7 GBq) 이상 용량의 방사성요오드 치료가 필요하다. 2022년 SNMMI/EANM에서는 예상되는 잔존 병소의 상태 또는 양에 따라서 방사성요오드 치료 권장량을 보다 상세히 제시하고 있다. 병소의 양이 적은 국소 재발 병소만 존재하는 경우에는 100-150 mCi (3.7-5.6 GBq), 국소 재발 병 소라 하더라도 진행이 되었거나 병소의 양이 많지 않은 원격전이 병소 치료에는 150-200 mCi (5.6-7.4 GBq), 진행된 원격전이 병소의 치료에는 200 mCi (7.4 GBq) 이상 또는 안전하게 사용 가능한 최대용량(maximum tolerable safe activity)을 권고하였다. 한편 ESMO에서는 dosimetry 로 결정한 치료용량의 사용이 100 mCi (3.7 GBq) 용량의 반복적인 치료 효과에 비교하여 생존율 향상에 도움이 되지 않았다는 연구결과 에 근거하여, 치료 용량으로 100-200 mCi (3.7-7.4 GBq)를 사용할 것을 권고하고 있다."]}, "I.6.4.A": {"ids": ["I.6.4.A", "I.6.4.B", "I.6.4.C", "I.6.4.D", "I.6.4.E", "I.6.4.F", "I.6.4.G"], "p": ["방사성요오드 치료(잔여갑상선제거, 보조치료, 및 잔 존병소치료) 및 전신스캔 검사나 혈청 갑상선글로불린 농도로 추적관찰을 위해서는 TSH 자극이 필요하다. 이를 위하여 전통적으로 치료 혹은 검사 전 LT4를 중단하여 내인성 TSH를 자극하였는데, 2000년대 초반 인간유전자재조합 갑상선자극호르몬(recombinant human TSH, rhTSH) 주사가 개발된 이후, LT4 중단에 따른 동반질환 의 악화 위험성을 낮추고 삶의 질을 높일 수 있다는 장점이 있어 널리 사용되고 있다.", "원격전이가 없는 갑상선분화암 환자를 대상으로 방사성요오드 잔여갑상선제거술을 시행한 무작위대조연구 에서 잔여갑상선제거 성공률은 rhTSH 사용군과 갑상선호르몬 중단군 사이에 유의한 차이가 없었으며, 장기 치료성적 비교를 위해 진행된 HiLo와 ESTIMABL1 환자군의 5년 이상의 추적 관찰 연구에서도 TSH 자극 방법에 따른 재발률의 차이는 보이지 않았다. 대부분의 환자는 저위험군이었지만 영국 HiLo 연구에는 일부 중간위험군 환자 (림프절전이 또는 현미경적 갑상선외부 침범)도 포함되었다. 두 연구 모두 rhTSH 사용군에서 우수한 삶의 질을 보였는데, 장기적인 추적 후에는 두 군에서의 삶의 질에는 차이가 없었다. 국내 연구에서도 잔여갑상선제거 성공률은 두 군 사이에 차이가 없으면서, rhTSH 사용군에서 삶의 질이 향상된 결과가 보고되었으며, 이러한 결과를 근거로 유럽갑상선학회에서 는 잔여갑상선제거를 위한 목적으로는 rhTSH의 사용을 권고하였고, 우리나라를 포함한 여러 나라에서 방사성요오드 잔여갑상선제거를 위한 전처치로 rhTSH 의 사용이 승인되었다. 최근 국내의 메타분석 연구에서도 중간 및 고위험군 갑상선분화암 환자를 대상으로 하는 메타분석 연구에서는 rhTSH 사용군에서 더 우수한 잔여갑상선제거 성공률을 보였다.", "다만, 국내에서 진행된 다기관 후향적 관찰연구에서 치료 반응 평가를 위해 초음파와 혈청 갑상선글로불린 만을 사용한 경우에는 양군에서 치료 성적의 차이가 없었으나, 완전반응의 판정을 위해 초음파, 혈청 갑상선글로불린, 방사성요오드 진단스캔을 모두 사용한 경우에는 갑상선호르몬 중단군이 rhTSH 사용군보다 더 높은 완전반응 성적을 보여주었다. 그러므로 치료 반응 평가 방법에 따라 잔여갑상선제거의 성공 여부가 다르게 판단될 수 있으므로, 연구결과의 해석에 주의를 요한다.", "결론적으로, 이상의 rhTSH 사용과 연관된 우수한 단기간의 삶의 질, 전통적인 갑상선호르몬 중단과 비슷한 잔여갑상선제거 성공률과 재발률 등의 연구 결과를 토 대로, 원격전이가 없는 갑상선암 환자에서 방사성요오드 잔여갑상선제거술이나 보조치료에 rhTSH 사용을 권고하였다. 그러나 장기 재발 및 사망에 미치는 영향에 대한 후속 연구가 필요하다.", "한편, 고위험군 환자에서 지속적으로 남아있는 알려진 병소(known disease)를 치료하기 위해서 rhTSH를 사용하는 경우에는 근거가 충분하지 않아 향후 대규모 전향적 연구가 필요하다. 원격전이 갑상선암 환자의 경우, 고용량 방사성요오드 치료를 시행한 4편의 연구 결과를 바탕으로 한 체계적 문헌고찰 연구 결과에서도 LT4 중단군과 rhTSH군에서 질병진행 위험도는 차이가 없었다. 그러므로 비록 구조적 질병진행에 대한 이득이 관찰되지는 않았지만 질병진행 위험도가 증가하지는 않았으며, 환자의 삶의 질이 전반적으로 개선되고 있으므로 환자의 이득과 위해를 고려한 각 개별 상황에 따른 판단으로 사용을 고려하도록 권고하였다. 특히, 갑상선 기능저하 상태를 견디지 못하거나 내인성 TSH가 충분히 상승될 수 없는 환자에서 rhTSH 주사는 혈중 TSH를 상승시키며, 중대한 의학적 혹은 신경 / 정신과적 동반 질환을 가진 환자에서 갑상선기능저하증과 관련된 합병증의 위험을 감소시킨다.", "(가) 갑상선호르몬(LT4) 중단에 의한 TSH 자극내인성 TSH 농도는 1) levothyroxine (LT4)을 liothyronine (LT3)으로 변경하여 2-4주간 지속한 후 2주간 LT3를 중단하거나, 또는 2) 3-4주간 LT4를 중단하여 증가시킬 수 있다(Fig. I.6.4.A). LT4를 4주간 중단한 군, LT4 를 4 주간 중단하면서 첫 2 주간 LT3 를 복용한 군, rhTSH 를 사용한 군을 비교한 국내 연구결과 모든 군에서 TSH 는 30 mIU/L 이상이었고, 12 개월에 확인한 잔여갑상선제거 성공률에 유의한 차이가 없었다. 또 다른 무작위대조연구에서도 LT4를 중단한 군과 LT4를 중단하면서 LT3를 대체 사용한 군 간에 단기간의 삶의 질이나 갑상선기능저하증 지표는 유사하였다.", "후향적 연구에 의하면 혈청 TSH 농도가 30 mIU/L 이상일 경우 종양의 방사성요오드 섭취가 증가하였다. 방사성요오드 잔여갑상선제거 성공률을 높이기 위한 적절한 TSH 농도에 대해, 갑상선호르몬 중단으로 TSH ＞25 mIU/L이면 잔여갑상선제거 성공률이 유의하게 증가한다 는 보고가 있으나, 치료 전 TSH치와 잔여갑상선제거 성공 사이에 유의한 관련이 없다는 연구결과도있다. 이와 같이 아직까지 잔여갑상선절제 및 장기 예후 향상을 위한 LT4 중단 후 적절한 TSH 농도는 불확실한 상태로서, 추가 연구 결과가 보고되기 전까지는 기존에 제시되고 있는 바와 같이 30 mIU/L 이상이 되도록 한다.", "(나) 인간유전자재조합 갑상선자극호르몬 (recombinant human TSH, rhTSH) 주사의 사용방사성요오드 투여 48시간 전과 24시간 전 rhTSH 0.9 mg을 근육 주사한다(Fig. I.6.4.A). 이 때 복용 중인 LT4 는 계속 복용할 수 있으나, LT4에 포함된 요오드 성분 등을 고려하여 4-7일 정도 중단할 수도 있다. rhTSH를 근육 주사하였을 때 일시적으로 구역감(nausea)과 두통, 피로감 등이 드물지 않게 발생할 수 있다."]}, "I.6.4.H": {"ids": ["I.6.4.H"], "p": ["방사성요오드 치료의 효과는 갑상선조직에 도달하는 방사선량에 달려있다. 방사성요오드 투여 전에 유효 방사선량의 증가를 위하여 저요오드 식이 (하루 50 μ g 미만) 와 요오드의 오염을 줄이기 위한 간단한 권고들이 환자에게 권장된다. SNMMI/EANM에서는 적정한(optimal) 하루 섭취량을 50 μg 미만으로, 적절한(adequate) 섭취량 으로 100 μg 미만을 제시하였다. 하지만, 50 μg 미만으로 저요오드 식이를 하는 것이 방사성요오드 치료에 의한 장기간의 질병 관련 재발이나 사망률에 영향을 주는지를 조사한 연구는 없다.", "또한 저요오드 식이의 적절한 기간에 대한 연구결과 는 국가별로 다르며 이는 식이를 통한 요오드 섭취량이 국가별로 다른데 기인한 것으로 여겨진다. 체내 요오드 저장량 (pool) 을 감안하여 저요오드 식이는 기간뿐 아니라 1일 섭취량에 대한 철저한 관리가 필요하다. 대부분의 연구에서 하루 50 μg 이하의 요오드를 포함하는 저요오드 식이를 1-2주간 시행하며 이것이 소변의 요오드 배설을 감소시키고 방사성요오드 섭취의 증가와 관련이 있는 것으로 나타났다. 하지만 최근의 체계적 문헌고찰 연구에서는 체내의 요오드풀이 치료의 성공에 영향을 미치는지에 대한 여부는 아직 명확하지 않다고 보고하였으며, 저요오드 식이가 환자에게 미치는 영향을 생각하면 대규모 스터디가 필요하다고 하였다. 종합적으로는, 우리나라의 경우 식이를 통한 요오드 섭취량이 높아 평상시의 요오드풀을 고려하여 저요오드 식이를 권고하였다.", "국내의 경우 실제적으로 50 μg 미만을 지키기 어려운 경우가 많고, 요오드 함유 식품의 제한 기준을 완화 또는 100 μg 미만 기준 으로 하였을 때도 잔여갑상선제거의 효과가 충분하게 보고되어, 100 μg까지를 허용하기도 한다, 이 경우 2주 이상의 저요오드 식이가 권장 되는데, 50 μg 미만을 엄격하게 지킨 경우에는 1주일 만으로도 충분한 것으로 보고되었다.", "요오드의 섭취원으로서 식이 이외에 약물에 포함된 요오드(조영제, 아미오다론 등의 약제)도 있으므로, 약물에 의한 요오드 섭취가 치료에 방해가 되지 않도록 미리 점검하는 것이 권장된다. 저요오드식을 저염식으로 오 인하여 지나친 저염식을 하는 환자에서 드물게 저나트 륨혈증이 나타날 수 있으므로 요오드가 첨가되지 않은 소금은 금하지 않도록 한다. 본 학회에서는 저요오드 식이를 포함한 방사성요오드 치료를 위한 환자용 안내서 를 학회 홈페이지를 통해 제공하고 있다."]}, "I.6.5.A": {"ids": ["I.6.5.A", "I.6.5.B"], "p": ["원격전이의 진단을 위해서는 방사성요오드 투여 후 약 1 주 내외에 치료 후 전신스캔을 시행한다. 진단스캔 과 비교하여 치료 후 전신스캔에서는 10-26% 의 전이 병소가 추가로 발견되는데, 새로운 비정상적 방사성요오드 섭취는 경부, 폐, 종격동에서 가장 흔하게 발견되었 고, 이러한 새로운 병소는 약 10%의 환자에서 병기에 영향을 주거나 9-15%에서 치료 방침에 영향을 준 것으로 보고되었다.", "<sup>131<\/sup>I SPECT/CT 융합 영상은 잔여갑상선제거술 후 병소를 더 잘 국소화하는 등, 그 유용성에 대한 많은 전향적, 후향적 연구결과가 있다. 특히, 치료 후 평면 전신스캔이 불확실하거나 질병이 진행되어 있는데 평면 전신스캔이 결론에 이르지 못할 때 SPECT/CT의 진단적 가치가 커진다. 평면 전신스캔에서 전이가 의심되는 소견이 없는 경우에도 혈청 갑상선글로불린이 높을 때에는 SPECT/CT 검사가 숨겨진 전이를 추가로 발견할 수 있는 유용한 방법의 하나로 제시되기도 하였다. 평면 전신스캔에 일률적으로 SPECT/CT를 추가하 면 6.4%의 환자에서 수술 후 재발위험도가 변화하며 약 2%에서 치료 계획에 영향을 주고 20%의 환자에서 추가적인 단층영상의 필요를 줄여주는 것으로 예상되었다. 또, 평면 전신스캔과 SPECT/CT를 일률적으로 같이 시행한 연구에서 SPECT/CT는 22%의 환자에서 요오드를 섭취하지 않는 병소를 발견하였다.", "결론적으로, 비록 SPECT/CT의 시행에 의한 추가적인 방사선 피폭이 소폭 증가하기는 하지만, 병소의 위치 평가 및 병기설정의 정확도를 높이고 불필요한 치료를 방지하는 등의 뚜렷한 이득이 있다. 그러므로, 방사성요오드 전신스캔의 평면영상에서 비정상적인 섭취가 의심되는 경우 SPECT/CT를 추가 시행하는 것을 권고하였다."]}, "I.7.1.A": {"ids": ["I.7.1.A", "I.7.1.B", "I.7.1.C"], "p": ["외부방사선조사는 국소적으로 진행되었으나 절제가 불가능한 병소의 증상 완화 치료 등에 가끔 사용된다. 그러나 외부 방사선조사가 진행성 방사성요오드 불응성 갑상선암의 티로신 키나아제억제제 치료 후 누공, 위장관 천공 등 중증 이상반응의 위험요인으로 알려져 있으므로 티로신 키나아제억제제 치료를 계획 중인 환자에서는 외부 방사선조사 시행에 주의할 필요가 있다. 일부 전향적, 후향적 연구에서 주변 조직 침범이나 경부 림프절전이를 동반한 갑상선분화암에서 수술 및 방사성요오드 치료 후 추가로 시행한 외부 방사선조사 치료가 국소 재발률을 감소시킨다는 보고가 있으나 생존율 증가를 입증한 대규모 전향적 연구는 없으며 치료의 위험과 이득을 고려하여 선택적으로 시행할 수 있다. 일부 후향적 연구와 증례 보고에서 절제가 불가능한 국소진행 갑상선암에서 동시항암화학방사선요법(concurrent chemoradiation, CCRT)이 방사선조사에 비해 국소병소의 조절 에 효과적이라는 연구 결과가 있으나 통계적으로 유의한 대규모 전향적 연구결과가 부족한 상황으로 추가적인 연구가 필요하다."]}, "I.7.2.A": {"ids": ["I.7.2.A"], "p": ["갑상선분화암의 치료에 보조적(adjuvant) 항암제 사용을 정당화하는 자료는 없다."]}, "II.1.A": {"ids": ["II.1.A", "II.1.B"], "p": ["수술 후 초기위험군을 고려하여 시행한 초기 치료가 완료된 후에는, 치료 반응에 따른 재발위험도를 재평가 한다. 이는 병소의 조기 발견이나 적절한 치료 방법의 결정에 기초가 되며, 이러한 재평가는 추적 기간 중에지속적으로 이루어져야 한다. 추적관찰 기간 동안 시행한 모든 임상적, 생화학적, 영상학적(구조적, 기능적), 그리고 세포병리학적 검사의 결과는 환자의 임상적 상태를 재판정하고 치료 반응을 평가하기 위해 사용된다. 이러한 평가를 통하여 치료 반응 정도를 판정하고 환자의 위험도를 재분류하는 동적위험분류(DRS)가 미국갑상선학회 권고안에서 처음으로 제안되었다. 이 체계가 처음 제안되었을 때는, 초기 치료 후 첫 2년간의 추적관찰 중 가장 좋은 반응을 기술하도록 하였다. 그러나, 개개 환자에서 초기 치료에 대한 반응뿐만 아니라 추적 경과 중 이의 변화 양상에 따라 재발 위험도가 달라질 수 있다. 즉, 초기위험도나 1회의 위험도 재분류만으로 환자의 평생 재발위험도가 고정되는 것이 아니므로, 추적 중 새로이 추가되는 임상지표들을 바탕으로 지속적으로 재발위험도를 재분류하는 것이 필요하므로 DRS 대신 지 속적위험분류(ORS)라는 개념이 도입되었다. 두 분류는 궁극적으로 평가하는 시점을 제외하면 동일한 위험분류체계로서, 본 권고안에서는 DRS를 포함한 개념으로서 ORS를 통일된 용어로 사용하였다. 추적 관찰 중 ORS를 시행함으로써, 개개 환자에게 적절한 추적 감시 및 치료의 강도를 결정하고, 궁극적으로 예후가 좋은 대다수의 환자에서는 과잉치료와 검사를 피하고, 좋지 않은 예후를 가지게 될 환자에 대한 치료 노력을 집중할 수 있도록 하고자 하였다.", "ORS는 추적 검사에서 얻어진 임상적, 생화학적, 구조적인 지표에 따라 환자를 완전(excellent), 불명확(indeterminate), 생화학적 불완전(biochemical incomplete), 구조적 불완전(structural incomplete) 반응으로 분류하여 재발 위험을 평가하고 환자의 추적관찰 전반에 걸쳐 활 용된다(Table II.1.A). 이 때, 갑상선전절제술과 방사성요오드 치료를 받은 환자뿐 아니라, 갑상선절제술 후 방사성요오드 치료를 받지 않거나, 갑상선 엽절제술을 받은 환자도 분류에 포함한다. 영상학적 소견이란 방사성요오드 전신스캔이나 경부 초음파, 전산화단층촬영, <sup>18<\/sup>F-FDG PET/CT 등 시행된 모든 영상 소견을 의미한다.", "ORS는 방사성요오드 치료 결과와 경부 초음파 소견, 그리고 혈청 갑상선글로불린과 항체 결과를 기본으로 하여 평가한다. 첫 ORS 평가는 일차 치료 종료 6-24개월 이내에 시행하고, 이후 추적 시 지속적으로 Table II.1.A 와 같이 ORS를 시행한다. 하지만 ORS에 따라 재분류된 위험군이 모든 초기위험군에서 동일하게 적용될 수 있 는지는 명확하지 않다. 즉, 초기 고위험군 또는 중간위험군 환자에서 완전반응을 보일 경우가 초기 저위험군에 서의 완전반응과 동일한 재발위험도를 가질 것인가는 아직까지 확실하지 않다.", "몇몇의 연구에서 초기 고위험군 환자가 처음으로 평가한 ORS에서 완전반응을 보인다면 구조적 재발위험이 매우 낮다고 보고했으나, 그 중 한 연구는 대상으로 한 초기 고위험군 환자가 5명에 불과했고, 다른 연구들에서는 초기 고위험군이면서 첫 ORS에서 완전반응을 보인 환자의 11%가 다시 ORS를 하였을 때 생화학적 질병의 증거를 보이거나, 11%가 재발을 하였다고 보고하였다. 그러므로, 고위험군 환자는 ORS에서 완전반응으로 평가된 경우라 하더라도 추적에 주의가 필요하다.", "초기 중간위험군이지만 첫 ORS 시 완전반응을 보인 환자의 재발률은 2% 정도이며, 측경부 림프절전이, 방사성요오드 잔여갑상선절제술 시행 전 thyroid stimulating hormone (TSH)-자극 혈청 갑상선글로불린 ≥1 ng/mL, 측경부 림프절의 방사성요오드 섭취 등이 재발예측인자 로 보고되었다. 이외에도 <sup>18<\/sup>F-FDG PET, 혈청 갑상선글로불린 농도의 배가시간(doubling time) 등은 또 다른 유용한 예후 인자로 제시된다.", "한편, 초기 저위험군이지만 완전반응에 도달하지 못한 환자에서 추가적인 수술이나 방사성요오드 치료를 하지 않고 추적관찰만 한 경우 장기 예후에 대해서도 추가적인 연구가 필요하다. 최근 체계적 문헌고찰에서 엽절제술을 시행 받은 갑상선분화암 환자에서는 재발 혹은 전이성 병소를 확인하는데 있어서 혈청 갑상선글로불린의 유용성이 낮음이 보고되었다. 그러나 분석에 포함된 문헌만으로는 근거가 충분하지 않고 아직까지 초기 저위험군 환자가 엽절제술을 받은 경우 생화학적 불완전 반응을 어떻게 정의할 것인가는 불분명하다. 한편, 혈청 갑상선글로불린은 TSH를 자극(보통 30 mIU/L 이상)한 후 측정한 수치(TSH-자극 갑상선글로불린)와 자극을 하지 않은 상태에서 측정한 수치(TSH-비자극 갑상선글로불린) 가 상이한데, TSH- 자극 갑상선글로불린의 평가가 필요한 경우에 대해서도 추가적인 근거가 필요한 실정이다.", "본 권고안에서는 치료 반응 평가에 적용되는 갑상선글로불린 기준치를 2019년 유럽종양학회(European Society for Medical Oncology, ESMO) 권고안 에 기반하여 적 용하였다. 향후, 우리나라 갑상선암의 특성과 수술적 치료 효과 등의 우리나라 환경을 반영한 기준치 설정이 필요하다. 이러한 필요성에 따라 우리나라 갑상선분화암 환자에서 치료 방법에 따른 적절한 혈청 갑상선글로불린 농도의 기준을 확인하고자 하는 다기관 연구가 진행 중이다."]}, "II.2.2.A": {"ids": ["II.2.2.A", "II.2.2.B", "II.2.2.C", "II.2.2.D", "II.2.2.E"], "p": ["2016년 대한갑상선학회, 2015년 미국갑상선학회와 2019년 유럽종양학회의 권고안에서는 초기위험군 분류에서 저위험군에서는 TSH를 0.5-2.0 mIU/L, 중간위험군에서는 0.1-0.5 mIU/L, 고위험군에서는 ＜0.1 mIU로 유지하는 TSH 목표 농도가 권고되어 왔다. 그러나, 아직까지 초기위험군과 초기 수술 범주에 따른 적절한 초기 TSH 목표 농도와 그에 따른 효과에 대한 근거는 불 명확하다.", "초기위험군 분류에서 동일하게 저위험군으로 분류된 경우에도, 시행된 수술 범주에 따라 TSH 목표농도가 다 를 수 있다. 전절제술 또는 아전절제술을 한 National Thyroid Cancer Treatment Cooperative Study Group (NTCTCS) 저위험군 중 병기 I-II 의 환자에서 TSH 농도가 측정되지 않을 정도로 억제된 경우에 TSH 농도 0.1-0.4 mIU/L였던 경우와 비교하여 전체 생존율과 무질 병생존율이 유의한 차이를 보이지 않았다. AMES (age, metastasis, extension, size) 구분을 적용한 두 편의 무작위대조연구에서도 저위험군에서 TSH ＜0.01 mIU/L, ＜0.1 mIU/L, 그리고 정상 범위인 환자들에서 재발률에차이가 없었다. 따라서, 전절제술 또는 아전절제술을 한 저위험군 갑상선암 환자에서 일반적으로 초기 혈청 TSH 억제를 권고하지 않는다. 한편 한 전향적 연구에서는 저위험군에서 TSH ＜2.0 mIU/L 로 유지하였을 때에도 재발에 대한 이득이 없었다고 보고하였다.", "엽절제술을 한 저위험군에서 기준 TSH 농도를 1.85 (1편) 또는 2.0 mIU/L (3편)로 나누어 재발억제 효과를 보고한 4편의 연구를 종합하였을 때에도 TSH 농도 기준에 따른 재발률은 유의한 차이를 보이지 않았다(위험 비 1.22, 95% 신뢰구간: 0.58, 2.58). 이 분석에 포함되지 않은 한 편의 관찰연구에서도 TSH 중앙값 2.25 mIU/L인 군과 4.33 mIU/L인 군 사이에서 재발 환자수 에 유의한 차이는 없었다(상대위험비 1.47, 95% 신뢰구간: 0.69, 5.70). 그러나 TSH 목표농도에 따른 사망 혹은 질병특이 사망을 분석한 문헌은 없었다. 이상을 종합하여 엽절제술을 한 저위험군 갑상선암 환자에서 초기 혈청 TSH를 정상의 하한 농도 이하로 억제하는 것은 권고하지 않는다.", "비록 대부분의 연구에서 TSH 목표농도 2.0 mIU/L 이하로 유지하는 것에 의한 재발 감소 효과는 불확실하지만, 아직까지 TSH 목표농도를 2.0 mIU/L 이상이 되어도 안전 한가에 대한 근거가 부족하고, 2.0 mIU/L 이상의 적절한 TSH 농도의 상한선에 대해서 알려진 바가 없다. 그러므로, 본 권고안에서는 초기 TSH를 0.5-2.0 mIU/L 정도로 유지할 것을 제안하였다. 그러나, 엽절제술을 시행 받은 저위험군 환자에서 불필요한 갑상선호르몬 복용에 따른 합병증과 삶의 질 등을 고려하였을 때 TSH의 상한 농도 등을 포함한 적절한 TSH 목표 농도에 대한 연구가 필요하다.", "중간위험군 갑상선암 환자만을 대상으로 TSH 억제 치료를 한 경우와 하지 않은 경우에 대한 주요 유해사례 를 비교한 근거는 없었다. 중간-고위험군 갑상선암 환자에 대한 한 다기관 후향적 연구에서 TSH 농도가 각각 ＜0.1, 0.1-0.5, ≥0.5 mIU/L로 유지되었던 환자군 사이에서 5년 무질병생존율은 유의한 차이를 보이지 않았다. 저-중간위험군 환자를 대상으로 한 두 개의 연구에서도 TSH 농도에 따른 재발률은 유의한 차이가 없었다. 그 중 저위험군 및 중간위험군 263명을 대상으로 한 전향적 연구에서는 수술 후 1년째 TSH 농도에 따라 TSH ＜ 0.1, 0.1-0.5, 0.5-2.0, ＞ 2.0 mIU/L 군으로 구분하였을 때, 이들 사이에서 구조적 재발률에 차이가 없음을 보고하여, 비록 추적기간이 3년으로 짧지만 중간위험군 환자에서도 초기 TSH 목표 농도를 0.1-0.5 mIU/L 사이로 유지할 필요가 없음의 근거를 제시하였다. 이와는 반대로, 최근 한 연구에서 중간위험군 환자 65,736명 중 수술과 방사성요오드 치료 및 TSH 억제를 시행한 군에서 10년 생존율이 향상되었음을 보고하였으나, 이 연구에서 의 분석한 TSH 농도는 확실하지 않다. 이와 같이 아직까지 중간위험군 갑상선암 환자에서 예후를 향상시킬 수 있는 적절한 TSH 목표 농도는 확실하지 않아, 합병증 위험도를 고려하여 중간위험군에서 초기 TSH 농도를 0.1 mIU/L 미만으로 일률적으로 억제하지 않도록 권고하였다. 본 권고안 에서는 Table I.5.1.B-I.5.2.I에서 제시한 바와 같이 중간위험군은 동반한 임상병리학적 특성에 따른 재발위험도를 종합적으로 고려하여 TSH 목표농도를 0.1-2.0 mIU/L 사이로 하도록 권고하였다. 중간위험군 환자에서 장기 예후를 향상시키기 위한 적절한 초기 TSH 농도에 대해서는 향후 연구가 필요하다.", "원격전이가 동반된 갑상선분화암 환자에서 TSH 억제 치료의 질병 특이 생존의 이득이 두 편의 후향적 연구에서 보고되었다. 원격전이를 동반한 71명의 갑상선유두암 환자를 대상으로 분석한 일본 연구에서 TSH 억제 치료 시 10년 암 특이 생존율이 79%로 TSH 억제 치료를 하지 않은 군의 64%에 비해 15% 더 높았다. 원격전이가 동반된 갑상선분화암 환자 157명에 대한 독 일의 연구에서는 TSH 중앙값 0.1 mIU/L 이하로 억제 시 갑상선암 관련 생존 기간의 중앙값이 15.8년으로 대조군 7.1년에 비해 유의하게 길었지만, TSH ≤0.03 mIU/L로 TSH를 더 억제하였을 때 추가적인 이득은 없었다. 반면, 세 편의 전향적 연구에서는 TSH를 0.1 mIU/L 미만으로 억제하였을 때 생존 및 재발에서 유의한 이득이 확인되지 않았다. 다만 고위험군을 NTCTCS 또는 AMES로 정의하여 수술 초기위험군의 분류와 차이가 있고, 이 중 한 개의 연구는 TSH를 0.01 mIU/L 미만으로 정의하여 농도 기준에도 차이가 있었다. 이상의 근거들을 종합하여, 고위험군에서 TSH 억제 치료가 갑상선암의 예후를 향상시킬 가능성이 높고, 특히 원격전이가 동반된 경우 TSH 0.1 mIU/L를 기준으로 질병 특이 생존의 이득이 확인되므로, 고위험군에서는 초기 혈청 TSH 농도를 0.1 mIU/L 미만으로 유지하도록 권고하였다."]}, "II.2.3.A": {"ids": ["II.2.3.A", "II.2.3.B", "II.2.3.C"], "p": ["지속적위험분류(ORS)는 최근에 도입된 개념으로, TSH 억제 정도와 기간에 따른 장기 추적 결과나 전향적 연구는 아직까지 없다. 다만, 중앙값 105개월간 501명의 방사성요오드 치료 후 경과를 후향적으로 분석한 연구에서 초기위험군 분류와 AJCC TNM 8 병기체계는 ORS 와 밀접한 상관관계를 보였다. 불명확 및 생화학적 불완전반응을 보인 환자의 대부분이 추가 치료 없이 완전반응으로 호전되었고, 대부분의 질병 진행 및 사망은 초기위험군 상 고위험군 또는 ORS 에서 구조적 불완전반응을 보인 환자에서 발생하였다. 따라서, 초기위험군과 상관없이 구조적 불완전반응을 보인 환자는 특별한 금기사항이 없는 한 혈청 TSH 농도는 계속 0.1 mIU/L 미만으로 유지하는 것이 바람직하다. 다만, 심각한 질환 동반 여부 및 TSH 억제에 따른 합병증의 위험도를 고려하여 목표 TSH 농도를 조정하는 것이 필요할 수 있다.", "ORS에서 완전반응으로 평가된 경우의 재발위험도는 높지 않다. 2019년 ESMO 권고안에서는 완전 반응을 보이는 환자에서 TSH 농도를 0.5-2.0 mIU/L 로 유지하도록 하였다. 2022 년 영국의 National Institute for Health and Care Excellence (NICE) 권고안에서는 고위험군이다수를 차지하는 방사성요오드 치료 후 완전반응을 보인 환자에서 TSH 0.3-2.0 mIU/L로 평생 유지할 것을 권고하였다. 이를 감안하여, 본 권고안에서는 고위험군을 포함한 모든 환자에서 ORS에서 완전반응을 보인 경우에는 TSH 억제를 권고하지 않았다. 다만, 아직까지 적정한 TSH 농도에 대한 근거가 없으므로 ESMO 권고안을 수용하여 0.5-2.0 mIU/L를 목표 농도로 제안하였다 (Fig. II.2.3.A).", "ORS에서 불명확 또는 생화학적 불완전반응으로 평가된 경우의 재발위험도는 초기위험군에 따라 달라질 수있다. 영국 NICE 권고안에서는 불명확반응을 보인 환자에서는 초기위험군에 무관하게 TSH 0.1-0.5 mIU/L로 유지할 것을 권고하였고, 10년 이상 TSH 억제를 지속해 온 환자들에게 위험과 이득의 개별화된 평가 후에 TSH 억제 유지 여부를 결정하도록 하였다. 국내 후향적 연구에서 엽절제술을 시행한 619명의 갑상선유두암 환자에서 중앙값 103개월의 경과 관찰 중에 완전반응군 1.6%, 불명확반응군 3.8%, 생화학적 불완전반응군 2.9% 에서 구조적 재발이 발생하였는데, 수술 후 1년째 TSH 농도가 높은 군(TSH 3.41 vs. 9.67 mIU/L)에서 유의하게 재발이 많았지만 2년째의 TSH 농도는 재발과 상관이 없었다. 최근 메타분석에서 TSH 2.0 mIU/L 이하로 유지한 2455명의 저위험군 환자에서 평균 5년 이상(평균 60개월, 중앙값 100개월) 추적한 7개 연구 결과 재발률은 2.3%로 낮고, 그 이상으로 유지된 경우와 차이를 보이지 않았다.", "2936명의 환자를 대상으로 한 전향적 연구에서 NTCTCS 병기 3, 4기 환자들은 TSH 0.1 mIU/L 미만, NTCTCS 병기 2기 환자들은 약 0.1-0.5 mIU/L인 경우 전체생존(overall survival)이 호전되었다. 그러나 2기 환자에서 TSH를 측정한계 미만으로 낮게 억제하는 것은 이득이 없었다. 다른 연구에서 혈청 TSH 2.0 mIU/L를 기준으로 했을 때 무질병 상태와 재발 또는 암 관련 사망에 대해 유의하게 개선되었고, 이는 나이와 갑상선암 병기를 보정한 후에도 유지되었다. 한 전향적 연구에서는 TSH 억제를 하지 않은 저위험군 환자에서 무병 생존율은 TSH를 억제한 환자에 비해 열등하지 않았다.", "이와 같이 불명확 또는 생화학적 불완전반응의 경우 TSH 억제의 강도나 기간과 관련하여 아직까지 자료가 부족한 상태이다. 낮은 근거 수준의 데이터와 전문가의 의견을 바탕으로 하였을 때, 초기 저위험군 환자에서는 불명확 또는 생화학적 불완전반응으로 평가된 경우 일반적으로 TSH 억제는 필요하지 않다. 그러나 적절한 TSH 목표 농도에 대한 근거는 여전히 부족하므로 본 권고안에서는 목표 TSH를 0.5-2.0 mIU/L로 고려하도록하였다. 이러한 환자군에서 적절한 TSH 목표 농도에 대한 근거를 마련하기 위해서 엽절제술을 시행한 저-중간위험군 갑상선유두암 환자를 대상으로 한 국내 다기관 무작위 배정 전향적 연구(MASTER 연구)가 대한갑상선 학회와 연계하여 진행 중이다.", "불명확 또는 생화학적 불완전반응을 보이는 초기 중간위험군과 고위험군 환자에게는 재발위험도를 고려하여 목표 TSH를 0.1-0.5 mIU/L로 권고하였다. 그러나, TSH 목표 농도 유지 기간에 대해서도 명확하게 알려진 바가 없으므로, 불명확 또는 생화학적 불완전반응을 보이더라도, 추적 중의 갑상선글로불린 또는 갑상선글로불린항체의 변화 양상이나 초음파 소견 등을 고려하여 TSH 목표 농도를 조정할 수 있다. 다만, 초기 고위험군은 처음 5년 동안은 TSH를 0.1-0.5 mIU/L로 유지하고, 이후 안정적인 경우에 0.5-2.0 mIU/L로 조정하는 것을 고려하는 것이 좋다. 중간위험군에서는 5년 이내라도 초기에 임상병리학적 위험인자를 종합하여 평가한 재발위험도와 추적 중 검사 소견의 변화 양상을 고려하여 TSH 목표 농도를 재조정한다. 완전반응에 가깝게 1-2 ng/mL 정도로 안정된 TSH- 억제 갑상선글로불린치를 보이는 경우에서는 중간 또는 고위험군에도 TSH 목표농도를 0.5-2.0 mIU/L로 조정할 수 있으며, 반대로, 갑상선글로불린치가 더 높거나 급격히 상승하는 경우에는 TSH를 ＜0.1 mIU/L로 유지하는 것이 필요할 수 있다."]}, "II.3.1.A": {"ids": ["II.3.1.A", "II.3.1.B", "II.3.1.C"], "p": ["(1) 혈청 TSH", "TSH는 체내 갑상선호르몬의 적정 농도를 유지하기 위해 LT4를 복용 중인 모든 환자에서 최소 12개월 간격 이하로 혈청 TSH를 측정하며 LT4의 용량을 조절하여 야 한다. 그 외에도 재발방지를 위한 TSH 목표 농도로 유지하고 있는지를 확인하기 위해서도 중요하다. 그런데, 비록 본 권고안에서 지금까지 사용된 권고안의 TSH 목표농도인 0.5와 2.0 mIU/L를 제시하였으나, 대한갑상선학회지에 보고된 바와 같이 현재 각 기관에서 사용 중인 TSH 측정검사법에 따라 동일한 시료의 TSH 농도가 다르게 측정되고 있다(Table II.3.1.A). 권고문에 따라서는 0.5 mIU/L 농도 기준 대신, 각 측정 기관에서 결정한 정상 하한값이 있으면 이를 사용하도록 제시하고 있다. 그러므로, 본 권고안의 기준을 적용할 때에, TSH 농도가 각 기관에서 사용하고 있는 TSH 검사법에 따른 차이가 있음을 고려하여야 하며 추후 TSH 측정값 또는 기준값 제시 방식에 대한 표준화가 필요하다.", "저위험군 환자에서 LT4를 복용하지 않으면서 TSH를 목표 농도로 유지하고 있는 경우 TSH를 측정하는 적절한 간격은 확실하지 않다. 후향적 연구에서 엽절제술 후 TSH 목표 농도를 2 mIU/L 이하로 유지하기 위해서 73-87%의 환자가 1년 이내 LT4의 복용이 필요하게 되었 다. 갑상선기능저하증은 측정키트의 정상범위인 4.2-5.5 mIU/L로 정의한 연구들에서는 엽절제술 후 약 60%에서 2년 이내에 갑상선기능저하증으로 진행하였으 며, 이후 매년 2% 정도로 갑상선기능저하증이 추가로 발생하였다. 그러므로 이를 고려한 TSH 추적이 필요하며, 5년 이상의 장기 추적 중에도 갑상선기능저하증의 증상이 의심되는 경우에는 갑상선기능을 측정해야한다. 특히 자가면역성 갑상선염이 동반된 경우에는 갑 상선기능저하를 줄이기 위해 요오드 함유 식품을 과잉 섭취하지 않도록 해야 한다.", "(2) 혈청 갑상선호르몬", "TSH 보충 또는 억제 시 LT4 과투여에 의한 합병증을 최소화하기 위해서 TSH 목표 농도를 유지할 수 있는 가능한 한 최소 용량으로 LT4 용량으로 조정하여야 한다. 이를 위해서 유리 T<sub>4<\/sub> 측정이 도움이 될 수 있는데, LT4 복용 직전에 측정한 유리 T<sub>4<\/sub> 농도가 하루 중 가장 낮은 농도이므로, 이를 감안하여 LT4 복용 전에 측정한 유리 T<sub>4<\/sub> 의 농도를 적정한 정상범위로 유지되도록 하여야 한다.", "유리 T<sub>4<\/sub> 와 TSH와 비교하여 유리 T<sub>3<\/sub> 는 일중 변동이 더 많고 나이가 들어가면서 유리 T<sub>4<\/sub> 는 증가하지만 유리 T<sub>3<\/sub> 는 지속적으로 감소하여 일상적으로 유리 T<sub>3<\/sub> 측정은 필요하지 않지만 일부 환자에서 도움이 될 수 있다. 갑상선기능저하증 증상을 가진 나이 많은 성인에서 유리 T<sub>3<\/sub> 는 낮음에도 불구하고 유리 T<sub>4<\/sub> 는 높을 수 있기 때문에 노인의 갑상선기능저하증의 진단과 시상하부 - 뇌하수체 - 갑상선 축 평가에 중요한 의미를 가진다. LT4 보충 치료에도 불구하고 갑상선기능저하증 환자 특히 갑상선절제술 이후 약 10-15% 환자에서 지속적인 갑상선기능저하증 증상을 호소한다. 대부분의 권고안에서 갑상선기능저하증을 치료하기 위해 LT4와 LT3 제제의 병 합치료는 일차치료로 권장하지 않지만 잔여갑상선기능 을 고려하여 혈중 T<sub>3<\/sub> 혹은 유리 T<sub>3<\/sub> 가 낮은 환자에서 병 합치료가 도움이 될 수 있다는 보고가 있지만 관계가 없다는 연구도 있기 때문에 더 많은 연구가 필요하다."]}, "II.3.2.A": {"ids": ["II.3.2.A"], "p": ["혈청 갑상선글로불린 측정은 잔존병소나 재발을 모니 터링하는 중요한 검사이다. 특히, 혈청 갑상선글로불린의 시간 경과에 따른 변동을 추적하면 의미 있는 잔존병 소와 재발의 진단에 도움을 준다. TSH-자극 또는 비자 극 혈청 갑상선글로불린 농도가 점점 증가하면 장차 병소가 드러날 것을 의미한다. 또한, 혈청 갑상선글로불린의 배가시간의 감소는 재발의 유용한 예측 인자이다. 다만, 혈청 갑상선글로불린은 측정 방법에 따라 차이를 보일 수 있어, 변화 여부를 추적하기 위해서는 동일 기관에서 같은 방법으로 측정하는 것이 이상적이 며, 변경 시에는 이를 감안하여 평가하여야 한다.", "또한, 갑상선글로불린항체가 있으면 위음성 결과가 쉽게 나타나며, 특히 갑상선글로불린항체의 변동성에 의하여 항체가 위음성이 되는 경우, 존재는 하지만 측정되지 않은 항체에 의해서 혈청 갑상선글로불린이 검출되지 않는 오류가 나타날 수 있음을 주의해야 한다. 그러므로 혈청 갑상선글로불린항체를 면역계량법으로 항상 혈청 갑상선글로불린과 함께 측정해야 한다.", "갑상선글로불린항체는 수술 후 일시적인 면역 반응으로 증가할 수 있고, 방사성요오드 치료 후에도 증가할 수 있다. 수술병리조직검사에서 하시모토 갑상선염이 배후에 관찰되면 갑상선글로불린항체의 존재를 고려하여야 하고, 수술 전 검사에서 갑상선글로불린항체 음성이었다면 추후 에는 다른 검사법으로 갑상선글로불린항체를 측정하여야한다. 하시모토 갑상선염이 없는 환자에서 수술 직후에 갑상선글로불린항체가 높으면 재발의 가능성을 예고하는 소견이기 때문에 방사성요오드 치료를 시행하기 전에 갑상선글로불린항체를 측정하는 것이 좋다. 이와 유사하게, 처음에는 갑상선글로불린항체가 양성이었다가 음성이 되었지만 이후 점진적으로 항체가 증가되는 경우는 재발이나 진행을 암시한다. 반대로, 갑상선글로불린항체가 감소되는 것은 치료가 성공적임을 시사한다. 이처럼 동일한 방법으로 갑상선글로불린항체를 순차적으로 측정하면 정상 갑상선, 하시모토 갑상선염 및 종양의 잔존병소에 대한 정량적인 지표로 사용할 수 있다.", "갑상선전절제술과 방사성요오드 잔여갑상선제거 치료를 시행 받고, 경과 관찰할 때 병소가 지속되지 않는 환자에서는 3년 정도 지나면 갑상선글로불린항체는 대개 소실된다. 갑상선글로불린항체가 새로 나타나 거나 증가되는 양상을 보이면 재발이나 지속되는 병소의 위험이 높다는 것을 의미하며 사망률이 증가된다는 연구 결과들이 있다.", "(1) 방사성요오드 잔여갑상선제거술을 시행한 환자에", "서의 혈청 갑상선글로불린"]}, "II.3.2.B": {"ids": ["II.3.2.B", "II.3.2.C"], "p": ["갑상선전절제술과 방사성요오드 잔여갑상선제거 치료를 시행한 환자에서 혈청 갑상선글로불린 측정은 잔존암과 재발을 진단하는 민감도와 특이도가 높은 검사이다. 혈청 갑상선글로불린을 측정하여 재발 위험이 낮은 환자의 향후 무병 생존 정도를 예측할 수 있다. 그러나, 아직까지 재발을 예측하거나 생존율을 향상시킬 수 있는 갑상선글로불린 농도 및 측정 간격에 대해서는 정확하게 알려지지 않았다. 2015년 미국 갑상선학회의 권고안은 대부분 기능적인 민감도가 1 ng/mL인 검사법 을 적용한 결과에 기반하여 제정되었다. 하지만, 현재 시 행되는 검사의 기능적 민감도(functional sensitivity)는 0.2 ng/mL 이하이므로, TSH를 자극하지 않고 측정한 TSH-비자극 갑상선글로불린검사 결과를 기준으로도 평가할 수 있다.", "갑상선호르몬 투여 중단 또는 인간유전자재조합-TSH (recombinant human TSH, rhTSH) 투여로 TSH를 자극 하는 것이 혈청 갑상선글로불린 측정의 민감도를 가장 높인다고 알려져 있다. 그러나 잔존병소가 작을 때에는 찾아내지 못할 경우가 있으며, 이러한 경우 병소는 대개 경부에 존재하므로 경부 초음파검사를 시행하면 도움이 된다. 또한 임상적으로 의미 있는 종양이 존재하더라도 갑상선글로불린항체가 존재하거나 종양세포의 갑상선글로불린 생산 및 분비 능력이 저하 된 경우에는 TSH 자극검사가 의미 없을 수 있다. 따라서 혈청 갑상선글로불린 농도는 임상적으로 의미있는 잔존암과 재발에 대한 예비검사로 판단해야 한다.", "갑상선글로불린항체 음성, TSH- 자극 혈청 갑상선글로불린 농도가 0.5-1.0 ng/mL 미만이면 경과 관찰 중에 재발이 없을 가능성은 대략 98-99.5% 이다. 기저혈청 갑상선글로불린이 검출되지 않고 경부 초음파검사에 이상 소견이 없는 환자에게 TSH-자극 혈청 갑상선글로불린검사를 다시 시행할 필요는 없다. 한편, 임상적으로 재발이나 전이가 없고 TSH-비자극 혈청 갑상선글로불린 농도가 1 ng/mL 미만인 환자의 약 20%에서 수술과 방사성요오드 치료 후 12개월에 TSH-자극 혈청 갑상선글로불린 ＞2 ng/mL의 결과를 보였다는 연구도있다. 이러한 환자의 약 1/3에서 잔존 또는 재발병소와 TSH-비자극 갑상선글로불린의 증가가 관찰되며, 다른 2/3에서는 임상적인 병소가 나타나지 않고, TSH-자극 혈청 갑상선글로불린 농도는 안정적이거나 감소되었다. 그러므로, 혈청 갑상선글로불린 농도가 완전반응을 보인 경우에도 경과 중 다른 임상상을 고려한 추적 평가가 필요할 수 있다. TSH-자극 혈청 갑상선글로불린 ＞2 ng/mL는 잔존병소가 지속됨을 확인하는 민감도가매우 높은 소견이었다.", "(2) 방사성요오드 잔여갑상선제거술을 시행하지 않은", "환자에서의 혈청 갑상선글로불린"]}, "II.3.2.D": {"ids": ["II.3.2.D", "II.3.2.E", "II.3.2.F"], "p": ["저위험군 및 중간위험군 환자가 갑상선전절제술 후 방사성요오드 잔여갑상선제거나 보조치료를 시행하지 않은 경우, TSH-비자극 혈청 갑상선글로불린과 경부 초음파검사를 9-12개월 간격으로 시행하며 추적하였을 때, 대부분 환자는 경부 초음파에서 이상 소견이 없고, TSH-억제 혈청 갑상선글로불린이 ＜1 ng/mL이며, 부가적인 치료를 하지 않아도 혈청 갑상선글로불린이 낮게 유지되거나(＜2 ng/mL) 점차 감소한다. 이러한 경우 rhTSH 투여 후 갑상선글로불린을 측정하면 대상 환자의 절반 이상에서 1 ng/mL 를 초과하기 때문에 굳이 TSH- 자극 갑상선글로불린을 측정할 필요는 없다. 이러한 환자들은 갑상선호르몬을 복용하면서 주기적으로 TSH와 갑상선글로불린을 측정하며 경과를 관찰한다. 잔여(정상)갑상선 조직과 잔존하는 갑상선암의 병소를 구분하는 갑상선글로불린 농도에 대한 정확한 기준이 규명되어 있지 않으나, 시간 경과에 따라 증가되는 갑상선글로불린 농도는 갑상선 암의 증가를 시사한다. 그러므로, 혈청 갑상선글로불린이 지속적으로 높게 유지되 거나 특히 점차 증가되는 경우에 경부 초음파검사 음성 이면 방사성요오드 전신스캔을 고려해야 한다.", "엽절제술을 받은 갑상선분화암 환자에서는, 갑상선글로불린 측정에 대한 최근 메타분석에서 저위험군의 경우 재발이나 전이를 예측할 수 없다고 보고한 반면, 임상적 근거는 부족하나 일부 중간위험군 및 고위험군 환자에서는 재발이나 전이를 예측하는데 갑상선글로불린 측정이 어느 정도 기여함이 보고되었다. 즉, 갑상선엽절제술을 시행 받은 저위험군 환자에서 갑상선글로불린 측정이 재발이나 전이 예측에 도움이 되지 않을 수 있으나, 일부 중등도 및 고위험군 환자에서는 도움이 될 수 있다. 그러므로 엽절제술을 받은 갑상선분화암 환자에서는 주기적인 혈청 갑상선글로불린 측정을 고려하여야 한다. 하지만 아직까지 갑상선글로불린을 얼마나 자주 측정하고 어떻게 해석해야 하는지에 대한 명확한 근거가 없어 추가적 연구가 필요하다. 또한, 갑상선전절제술 후 방사성요오드 치료를 받은 환자와 달리 엽절제술을 받은 환자에서는 갑상선글로불린항체의 측정이 잔여 갑상선조직의 영향으로 재발이나 전이를 예측하기 어렵기 때문에 좀 더 추가적 연구가 필요한 실정이다. 아울러 엽절제술을 받은 환자에서 TSH-자극 갑상선글로불린은 도움이 되지 않는다."]}, "II.3.3.A": {"ids": ["II.3.3.A"], "p": ["경부 초음파검사는 고주파 탐촉자(10-15 Hz)를 사용하 며, 갑상선분화암, 특히 유두암 환자에서 갑상선 수술부위 재발암 및 경부 전이림프절을 발견하는 데 예민한 검사이다. 경부 초음파는 수술 후 발생할 수 있는 이상 소견이나 잔존암을 평가하는 데에도 유용하여, 여러 권고안에서 수술 후 갑상선 수술부위 재발암 및 경부 전이림프절을 진단하고 병소를 평가하는데 유용한 일차적 검사법으로 제시하고 있다. 초음파로 전이림프절 의심 소견이 보이는 경우, 실제 전이일 가능성은 73-90%로 높게 알려져 있다.", "수술 후 추적관찰에서 시행하는 경부 초음파검사에 는 갑상선수술부위와 경부 림프절 전 구역의 평가가 포 함되어야 한다. 갑상선 수술부위 재발암에 대한 특이적 초음파 소견은 정립되어 있지 않으나 여러 논문에서 유사한 초음파 소견(저에코 병소, 내부 혈류증가, 미세석회 화, 불규칙한 경계, 전후 장경이 넓이보다 큰 경우 등)을 제시하고 있다. 전이림프절을 시사하는 초음파 소견은 2021년 대한갑상선영상의학회에서 발간한 권고안에 따르면 림프절 피질의 고에코(국소 혹은 미만형), 고에코 점(echogenic foci, 석회화), 낭성 변화(cystic change), 색도플러 영상에서 보이는 비정상적 혈류(주변 부 혹은 미만형)이며, 이 중 한 가지 소견이라도 보이는 경우 전이림프절을 의심할 수 있다. 전이림프절을 시사하는 초음파 소견이 없지만 림프절 문의 혈관의 에코 나 혈류가 보이지 않는 경우 미결정(indeterminate) 림프절로 분류한다.", "수술 후 초음파를 시행하는 시기에 대해서는 국내외 권고안에서 수술 후 첫 6-12개월에 잔존암 혹은 갑상선 수술부위 재발암 및 경부 전이림프절 유무를 경부 초음파를 이용하여 평가하도록 권고하고 있다. 방사성요오드 잔여갑상선제거술 후 갑상선글로불린 ＜2 ng/mL 인 환자에서 6-12개월에 시행한 경부 초음파에서 갑상선 수술부위 재발암이나 경부 전이림프절의 소견이 없는 경우 높은 음성예측도(97.7%)를 보였다. 또한 수술 직 후로 갑상선글로불린검사 결과에 대한 해석이 어려운 경우에도 경부 초음파검사를 통해 잔존암 혹은 갑상선 수술부위 재발암 및 경부 전이림프절에 대한 정보를 얻을 수 있다. 첫 6-12개월 검사 이후에는 재발위험도나 혈청 갑상선글로불린 수치에 따라 이후의 추적 주기를 정한다.", "경부 초음파검사를 시행할 때에는 다른 임상적, 생화학적인 소견들을 고려해야 한다. 갑상선 수술부위 재발암 및 경부 전이림프절의 위험도는 처음 진단 당시의 림프절전이 여부나 전이의 개수 등과 연관성이 있다. 2015년 미국갑상선학회의 권고안에 따르면 전이림프절의 크기가 클수록(＞3 cm), 전이림프절의 개수가 많을수록, 림프절외부침범이 있는 경우 재발위험도가 증가한다고 제시하였다. 이러한 임상적, 생화학적 소견들을 참고해서 환자들의 경부 초음파검사에 대한 주기 및 추가 검사여부를 결정하여야 한다."]}, "II.3.4.A": {"ids": ["II.3.4.A", "II.3.4.B"], "p": ["갑상선분화암 환자에서 수술 후 경부 전이림프절이 의심되는 경우 그 크기에 따라서 초음파 유도하 세침흡인검사와 세침흡인세척액-갑상선글로불린검사가 권고된다. 2021년 대한갑상선영상의학회 권고안에서는 림프절의 단경이 3-5 mm를 초과하고 초음파에서 전이 의심 소견을 보이는 경우, 혹은 단경이 5 mm를 초과하면 서 초음파에서 미결정 림프절 소견을 보이는 경우에 세침흡인검사를 권고하고 있다.", "세침흡인세척액-갑상선글로불린은 측경부 림프절에서는 일반적으로 권고되며 중앙경부 림프절에서는 잔존 정상 갑상선에 의한 오염 가능성이 없는 의심 병소인 경우에 권고된다. 단, 크기가 작은(단경 ≤8-10 mm) 갑상선 수술부위 재발 의심 병소나 경부 전이 의심 림프절인 경우에 즉각적 치료를 계획하지 않는다면 세침흡인검사를 시행하지 않고 초음파검사로 경과를 관찰할 수 있다. 이후 의심 병소 크기가 커지거나 인접한 주요 장기의 침범이 의심되는 경우에 치료전략 결정을 위해 세침흡인검사를 고려할 수 있다. 따라서 임상 소견, 환자 요 인, 병소의 위치에 따른 중요 기관 침범 위험도, 재발 종양 진단 후 가능한 치료 계획(적극적 관찰, 비수술적 절제 치료, 수술)을 종합적으로 고려하여 세침흡인검사를 결정하는 것이 적절하다.", "갑상선분화암 수술 후 갑상선 수술부위 재발암 및 경부 전이림프절이 의심되는 환자에서 세침흡인세척액-갑 상선글로불린을 함께 시행하는 경우에 세침흡인검사 단독 검사보다 진단 민감도를 증가시킬 수 있다. 2257 명 환자의 메타분석 결과에서 세침흡인검사와 세침흡인 세척액 - 갑상선글로불린의 단독 검사와 동시 시행한 경우의 진단 예민도는 각각 81.3%, 94.5%, 96.8% 였고, 진단 특이도는 96.4%, 88.8%, 93.2% 였다. 특히 심한 낭성 변화를 보이는 경부 전이림프절은 세침흡인검사에서 비진단적 결과를 보일 수 있기 때문에 세침흡인세척액-갑상 선글로불린을 함께 시행하는 것이 필요하다.", "세침흡인세척액-갑상선글로불린검사는 혈중 갑상선자극호르몬과 갑상선글로불린항체에 유의미한 영향을 받지 않는다. 그러나 아직까지 농도측정법이 표준 화되지 않은 점, 진단 기준값의 미확립, 혈액 오염에 의해 혈중 갑상선글로불린 수치가 높은 경우 위양성이 가능하 다는 점 등의 제한점을 갖고 있다. 다만, 아직까지 확실한 진단 기준값이 정립되어 있지는 않으나, 갑상선엽절제술 및 전절제술을 받은 환자에서는 세침흡인세척액-갑상선글로불린 농도가 1 ng/mL보다 증가된 경우, 전이림프절에 대한 진단능은 예민도 90.8-100%, 특이도 90.0-96.5% 정도로 알려져 있다. 또한, 세침흡인세척액-갑상선글로불린 농도가 혈중 갑상선글로불린 농 도보다 증가된 경우에도 전이림프절을 의심할 수 있는데, 68개의 전이림프절에서 시행한 검사 결과에서는 예민도가 98.2%, 특이도가 77.8%로 보고되었다.", "한편, 세침흡인세척액-갑상선글로불린검사는 갑상선분화암이 아닌 악성종양들과 일부 유두암에서도 드물게 위 음성을 나타낼 수 있으며, 전이림프절과 유사한 소견을 보일 수 있는 이소성 혹은 잔류 갑상선에서 위양성을 보일 수 있기 때문에 세침흡인세척액-갑상선글로불린검사 결과는 세침흡인검사 결과와 함께 해석되어야 한다.", "세침흡인검사 이후 발생할 수 있는 부작용으로는 통증, 출혈, 암의 파종 등이 있으며, 세침흡인검사에서 적절한 세포가 얻어지지 않을 경우 반복적인 검사를 시행할 가능성이 있다. 하지만 최근에 발간된 체계적 문헌고찰에 따르면 세침흡인검사로 인해 발생하는 부작용은 미미하며, 주요 합병증의 발생이 거의 없어 안전한 검사 라는 결론을 보여주고 있다. 따라서 검사 전에 환자에게 부작용에 대한 설명이 정확하게 이루어진다면 검사의 실행에 있어서 어려움은 없을 것이다.", "현재 재발암의 진단에 있어서 세침흡인검사와 세침흡 인세척액-갑상선글로불린이 가장 많이 이용되고 있으나, 갑상선글로불린이 증가되지 않는 미분화암이나 수 질암, 림프종이 의심되는 경우에 있어서는 중심생검검 사를 시행하는 것이 도움이 된다. 갑상선암 이외의 암에서 비롯된 전이림프절 혹은 림프종에서도 중심생검검사 는 높은 진단능을 보였다. 최근 갑상선 수술부위 병소에서 시행한 중심생검검사에 대한 연구에서 그 안 전성과 높은 진단능을 보여주어 재발암의 진단에 있어서 중심생검검사가 보완적으로 고려될 수 있다."]}, "II.3.5.A": {"ids": ["II.3.5.A", "II.3.5.B", "II.3.5.C"], "p": ["국내외 권고안에서 조영증강 경부 전산화단층촬영 (computed tomography, CT) 검사는 갑상선암 수술 후 일차적인 추적 검사로 권고하고 있지 않으나, 경부 초음파 검사의 보조적인 영상검사로 권고된다. 조영증강 경부 CT는 경부 초음파로 진단이 어려운 재발 의심 종양의 진단과 초음파검사에서 발견된 병소의 기도, 식도 등의 주변 조직 침범과 혈관 관계를 평가하는데 유용하 며, 초음파에서 평가하기 어려운 중앙 및 종격동 림프절전이와 기도 뒤쪽의 병소 평가에 도움이 된다. 또한 갑상선암 수술 후 재발 종양과 경부 외상신경종과 구분에 서 CT와 초음파를 비교한 연구에서 CT가 민감도 및 특이도가 초음파보다 높은 결과를 보여주고 있어, 재발암이 의심되는 경우 CT검사가 추가 검사로 고려될 수 있다.", "미국갑상선학회 및 대한갑상선영상의학회 권고안에 따르면 초음파에서 병소의 범위가 확인되지 않을 정도로 크기가 큰 갑상선 수술부위 재발암 및 경부 전이림프절이 의심되거나, 상부 호흡소화관에 갑상선 재발암의 침범이 의심되는 경우에 조영증강을 이용한 경부 CT를 시행할 것을 권고하고 있으며, 혈청 갑상선글로불린 또는 갑상선글로불린항체가 높거나 증가되는데 경부 초음파나 방사성요오드 영상에서는 병소가 없는 경우에 종격동 이나 기도 후방 부위 등 초음파로 진단이 어려운 경부 병소의 진단을 위해 경부 CT 검사가 권고되고 있다.", "경부와 종격동을 평가하기 위해 경부 MRI도 이용할 수 있다. 경부 MRI 는 일차적 추적 검사로 사용되지 않으나 진행된 재발암의 호흡기 또는 소화기 장기 침범이 의심되는 경우 종양의 침범 범위 평가나 심부 평가를 위해추가적으로 고려될 수 있다. 그러나 재발암에서 MRI 진단능에 대한 연구는 부족하다.", "흉부 CT는 미세 폐 전이를 진단하는데 유용한 검사로, 고위험군 환자나 혈청 갑상선글로불린, 갑상선글로불린항체 수치가 상승한 경우 고려할 수 있다. 일반적으로 조영증강 흉부 CT가 우선적으로 고려되지만, 조영제에 부작용이 있는 환자의 경우 비조영증강 흉부 CT 도 촬영할 수 있다."]}, "II.3.6.A": {"ids": ["II.3.6.A", "II.3.6.B", "II.3.6.C", "II.3.6.D", "II.3.6.E"], "p": ["저위험군 환자가 방사성요오드 잔여갑상선제거술 후에 시행한 전신스캔에서 갑상선 부위 이외에 방사성요오드 섭취가 관찰되지 않을 때, ORS에서 완전반응을 보이면, 즉 임상적으로 잔존 병소가 없고, TSH- 비자극 갑상선글로불린이 검출되지 않으며 경부 초음파가 음성이 면 진단적 목적으로 방사성요오드 전신스캔을 다시 시행할 필요는 없다.", "진단적 방사성요오드 전신스캔은 다음과 같은 경우에 시행할 것을 권한다.", "가. 치료 후 전신스캔에서 갑상선부위 이외에 비정상적인 섭취가 관찰된 경우", "나. 잔여 갑상선조직에 섭취되는 방사성요오드의 양이 많아서 경부 림프절 부위의 방사성요오드 섭취를 정확하게 평가하기 어려운 경우", "다. 혈청 갑상선글로불린항체가 양성이어서 치료 후 시행한 혈청 갑상선글로불린 측정 결과를 신뢰하기 어려운 경우", "진단적 목적으로 전신스캔을 촬영할 때는 <sup>131<\/sup>I보다 <sup>123<\/sup>I 을 선호한다. <sup>123<\/sup>I이 인체에 흡수되는 방사능양이 더 적고, 전신스캔 영상의 질이 더 좋기 때문이다.", "방사성요오드 전신스캔은 진단적인 용량(주로 2-5 mCi) 또는 치료적인 용량(30-150 mCi)을 투여한 뒤 전 신을 촬영하고, 비정상적 방사성요오드 섭취를 보이는 경우, 그 부위를 국소적으로 촬영하거나 SPECT (또는 SPECT/CT)를 이용하여 단층 영상을 촬영한다. SPECT/CT는 해부학적 영상과 기능적 영상을 융합한 정보를 활 용하여 비정상적 섭취를 정확하게 국소화할 수 있으며, 이에 의한 방사선량은 조영증강 CT와 큰 차이가 없다. 전신스캔에서 SPECT/CT를 촬영하면 림프절전이 진단이 증가하고, CT 영상에서 방사성요오드가 섭취되지 않는 병소에 대한 추가적인 정보를 얻을 수 있으며, 애매한 소견을 나타내는 경우를 감소시켜 상당수의 환자에서 치료 방침을 변경시킬 수 있다. 그러므로 방사성요오드 전신스캔의 평면영상에서 비정상적인 소견이 의심되는 경우 SPECT/CT를 추가 시행하는 것이 권장된다.", "잔여갑상선 또는 잔존 갑상선암 존재 여부를 확인하 거나 이의 방사성요오드 섭취능을 확인하기 위해서는 rhTSH 자극 또는 LT4 중단을 모두 고려할 수 있다. 두 가지 방법에 의한 스캔 결과는 차이가 없었으나, 삶의 질을 고려하면 rhTSH 사용이 권고된다."]}, "II.3.7.A": {"ids": ["II.3.7.A", "II.3.7.B"], "p": ["<sup>18<\/sup>F-FDG PET/CT의 진단성적에는 여러 요인들이 영향을 미칠 수 있다. <sup>18<\/sup>F-FDG PET/CT는 분화도가 나쁘거나, 갑상선유두암의 고위험 아형, 침습성 호산성암, 혹은 고등급여포세포유래 비역형성갑상선암처럼 공격적인 조직형을 보이는 환자에서 민감도가 높았다. TSH를 자극하면 <sup>18<\/sup>F-FDG PET/CT의 민감도를 다소 증가시킬 수 있다는 연구 결과가 보고되었으나, 최근 메타분석에서는 TSH- 자극과 TSH- 억제 상태에서 <sup>18<\/sup>F-FDG PET/CT의 진단 성적에 유의한 차이가 없었다. 일부 연구에서는 혈청 갑상선글로불린 수치 정도에 따라 <sup>18<\/sup>F-FDG PET/CT의 민감도가 상승하는 경향을 보이나, 현재까지 <sup>18<\/sup>F-FDG PET/CT 촬영여부를 결정하는 혈청 갑상선글로불린 수치 기준에 대해서는 충분한 근거가 없다.", "본 권고안에서는 수술 후 갑상선분화암 환자의 추적에 <sup>18<\/sup>F-FDG PET/CT가 유용한지 평가하기 위해 핵심질문형 임상진료지침개발을 진행하였다. 이를 위해 2012-2023 년에 발표된 연구들을 대상으로 문헌검색을 시행하였고, 총 1988 명의 환자를 대상으로 한 24 개의 임상연구를 메타분석하였다. 분석 결과, <sup>18<\/sup>F-FDG PET/CT 의 진단성적은 민감도 87% (95% 신뢰구간, 83 – 92%), 특이도 84% (95% 신뢰구간, 80 – 89%)였다. 혈청 갑상선글로불린 또는 혈청 갑상선글로불린항체만 상승한 경우를 각각 나누어 분석하였을 때 <sup>18<\/sup>F-FDG PET/CT의 진단성적에는 유의한 차이가 없었다. <sup>18<\/sup>F-FDG PET/CT가 환자의 치료 방침에 영향을 주는지 6개의 문헌들을 종합한 결과, <sup>18<\/sup>F-FDG PET/CT 시행 후 치료방침이 바뀐 환자의 분율은 40% (95% 신뢰구간, 34 – 47%)였다. 치료방침 변경의 세부 내용은 <sup>18<\/sup>F-FDG PET/CT에서 발견한 재발병소에 대한 근치적 수술의 시행, 근치적 수술 예정이었 으나 추가 병소가 발견되어 전신 치료(표적 치료제, 방사성요오드 치료)로 전환, 방사성요오드 치료 예정이었 으나 투여 용량 변경 또는 수술이나 외부방사선치료로 전환 등이었다. 또한 기존의 영상검사에서 구조적 재발이 의심되는 환자에게 <sup>18<\/sup>F-FDG PET/CT을 추가적으로시행한 경우에서도 50%에서 치료 방침이 바뀌었다고 보고하였다. 9편의 문헌에서 <sup>18<\/sup>F-FDG PET/CT에서 재발 병소의 위치를 확인한 결과, 갑상선 주위(thyroid bed) 및 경부 림프절 62%, 폐 실질 8.4%, 종격동 림프절 10.5%, 뼈 6.3%, 그 외 원격전이 1.0% 순이었다. 또한 환 자별로 분석할 때 국소재발과 원격전이가 동시에 발견된 경우가 12.5%였고, 여기에 원격전이만 있는 경우를 합하면 총 38.7%였다. 따라서 <sup>18<\/sup>F-FDG PET/CT는 진단성적이 우수하고 전신 평가가 한번에 가능하므로, 혈청 갑상선글로불린(또는 갑상선글로불린항체)이 상승되어 재발이 의심되는 경우 <sup>18<\/sup>F-FDG PET/CT 시행을 권고한다. 그러나 갑상선분화암 환자에서 치료 후 혈청 갑상선 글로불린(혹은 갑상선글로불린항체)이 상승하는 경우에 대해, 여러 다른 영상검사의 진단 성적을 서로 비교한 연구는 거의 없는 상태이다. 따라서 어떤 영상검사를 우선 순위로 시행할 지에 대해서는 진단성적 및 비용 효과에 대한 근거 도출이 필요하다.", "방사성요오드가 섭취되는 전이 병소를 가진 환자에게 도 <sup>18<\/sup>F-FDG PET/CT의 보조적인 역할을 기대할 수 있는데, 만약 방사성요오드가 섭취되지 않는 전이 병소가 함께 존재한다면 <sup>18<\/sup>F-FDG가 섭취를 확인하여 병소를 발견할 수 있다. 또한, 전이성 갑상선분화암에 <sup>18<\/sup>F-FDG 가 섭취되는 것은 방사성요오드 치료 시 치료 반응에 대한 중요한 음성 예측 인자이고, 낮은 생존율을 예측하는 독립적인 인자이다. 방사성불응성의 정의에 포함되 지는 않으나, <sup>18<\/sup>F-FDG 섭취가 높을 경우 방사성요오드에 섭취가 낮은 경향이 있고, 해당 병소가 방사성요오드 불응성일 가능성이 있다. 방사성요오드 불응성 갑상선분화암의 전신 항암 치료 시, 치료 반응 평가 및 예후 예측에 <sup>18<\/sup>F-FDG PET/CT가 도움이 될 수 있다."]}, "II.4.1.A": {"ids": ["II.4.1.A"], "p": ["수술 후 초기 추적 검사의 간격에 관해서는 일관된 의견은 없지만, 일차 치료가 종료되기 전, 즉 ORS를 평가하기 전까지는 일반적으로 수술 후 초기에 재발의 위험도 평가에 근거한 초기위험군에 따라 결정한다. 저위험군 및 중간위험군에서는 6-12개월 간격으로, 고위험군에서는 6개월 이하의 간격으로 TSH-비자극 혈청 갑상선글로불린을 측정한다. 경부 초음파는 저위험군 및 중간위험군에서는 6-12개월 후, 고위험군에서는 6-12개월 이내 경부 초음파를 시행한다. 이 때, 갑상선글로불린이 증가되거나 임상적으로 재발이나 전이가 의심되는 경우 전산화단층촬영 등 추가 영상의학적 검사를 시행한다.", "초기 치료 결과에 따라서는 계획된 시점보다 초음파를 조기에 시행하여 잔존 병소의 존재를 평가할 수 있다. 2013년 유럽갑상선학회 권고안에서는 갑상선 수술 후에 최종 병리조직 결과에서 우연히 암이 진단된 경우, 림프절전이의 지속 병소를 확인가능한 자세한 수술 전 초음파가 없는 경우, 잔여제거술 이후 전신스캔에서 갑상선부위 이외 부위에 현저한 섭취가 있는 경우, 방사성요오드 잔여제거술 전 갑상선글로불린이 방사성요오드 치료 후 전신스캔에서 보이는 잔여갑상선 조직에서 예상되는 것보다 상당히 높은 경우 등에는 갑상선전절제술 시행 1-3개월 후, 혹은 방사성요오드 잔여제거술 시점에 초음파로 경부림프절의 외측 구역을 확인하도록 권고한 바있다."]}, "II.4.2.A": {"ids": ["II.4.2.A", "II.4.2.B", "II.4.2.C", "II.4.2.D"], "p": ["초기 저-중간위험군 갑상선유두암 환자가 ORS에서 완전반응을 보인 경우 1-2년 주기로 임상진찰, 경부 초음파검사, 혈청 갑상선글로불린 및 항체 검사로 추적 검사를 시행하며 혈청 갑상선글로불린 및 갑상선글로불린항체 수치 등에 따라 필요하면 반복적인 경부 초음파를 고려할 수 있다. 최근 연구에서 일차 치료 완료 5-8년 후까 지 완전반응을 보인 경우에는 일상적인 경부 초음파 평가 없이 1-2년마다 임상적 평가와 TSH-비자극 혈청 갑상선글로불린 및 갑상선글로불린항체 측정으로 경과 관찰할 수 있다고 제시하였다.", "초기 저 - 중간위험군 갑상선유두암 환자의 치료 후 1 년째 평가 시 TSH-비자극 갑상선글로불린 0.2 ng/mL 미만이면서 경부 초음파가 정상인 경우(완전반응) 마지막 경과 관찰 중앙값 72개월 시점에서 경부림프절 재발에 대한 음성예측도(negative predictive value)가 98.2%로 높았다. 따라서, 이러한 환자에서는 일상적인 초음파검사 없이 TSH-비자극 갑상선글로불린 및 갑상선글로불린항체 검사만으로 경과 관찰할 수 있다고 제시하였다. 다만, 몇몇 연구에서 세침흡인검사로 경부림프절 전이가 확인된 환자의 45-60.5% 가 TSH- 비자극 갑상선글로불린 1 ng/mL 미만이었지만 경부 초음파에서 재발이 확인되어, 국소림프절 재발의 확인에 경부 초음파가갑상선글로불린보다 더 민감한 방법일 수 있다.", "초기 고위험군에서는 완전반응을 보인 경우라 하더라도 주의 깊은 추적 관찰이 필요하며, 6-12개월마다 혈청 갑상선글로불린 및 갑상선글로불린항체 측정이 권고되며 6-12개월마다 반복적인 경부 초음파를 고려할 수 있다. 다만, 완전반응으로 평가된 초기 고위험군 환자는 경부 초음파와 혈청 갑상선글로불린 측정으로 발견되지 않는 병소를 배제하기 위하여 적극적으로 경과 관찰을 해야 하며, 추가적인 구조적 혹은 기능적 영상검사가 필요할 수 있다."]}, "II.4.2.E": {"ids": ["II.4.2.E", "II.4.2.F", "II.4.2.G"], "p": ["불명확반응으로 분류된 경우에는 결국 다른 반응 범주로 재분류할 수 있을 때까지 비특이적인 병소에 대한 적절한 영상검사와 혈청 갑상선글로불린 및 갑상선글로불린항체의 증가를 주기적으로 검사하며 경과관찰한다.", "초기 재발위험도에 따라 경과 관찰 간격이 달라지는 데, 저위험군 환자가 불명확반응을 보인 경우 1-2년 주기로 임상진찰, 혈청 갑상선글로불린 및 항체 검사로 추적검사를 시행하며, 결과에 따라 경부 초음파를 시행할 수있다. 초기 중간위험군 또는 고위험군 환자가 불명확반응을 보인 경우 6-12개월마다 혈청 갑상선글로불린 및 갑상선글로불린항체 측정, 경부 초음파검사가 권고되며 추적 관찰 중 갑상선글로불린 또는 갑상선글로불린항체가 증가하는 경우 전산화단층촬영, 진단적 방사성요오드 전신스캔 및 <sup>18<\/sup>F-FDG-PET/CT 를 포함한 영상검사를고려할 수 있다. 이후 ORS에서 완전반응을 보인 경우에는 경과 추적 검사의 강도와 빈도, TSH 억제 정도를 완화할 수 있고 이러한 치료의 변화는 중간 및 고위험 환자들에서 가장 현저하다.", "TSH-비자극 갑상선글로불린 농도가 증가하면 불명확반응을 보인 환자의 재발위험이 높아진다. ORS에서 불명확반응을 보인 145명의 갑상선분화암 환자에서 중앙값 68개월 경과 관찰 중에 9%의 환자가 생화학적 혹은 구조적 불완전반응으로 재분류되었음이 최근 보고되었다. 이들 환자는 혈청 TSH-비자극 갑상선글로불린 농도가 매 방문마다 평균 27.1%씩 지속적으로 증가하였다."]}, "II.4.2.H": {"ids": ["II.4.2.H", "II.4.2.I", "II.4.2.J", "II.4.2.K", "II.4.2.L"], "p": ["초기 저위험군 환자가 생화학적 불완전반응을 보인 경우는 1-2 년마다 혈청 갑상선글로불린 및 갑상선글로불린항체를 측정한다. 혈청 갑상선글로불린 및 갑상선글로불린항체 수치에 따라 필요하면 반복적인 경부 초음파를 시행할 수 있다. 초기 중간위험군 또는 고위험군 환자가 생화학적 불완전반응을 보인 경우는 6-12개월마다 혈청 갑상선글로불린 및 갑상선글로불린항체 검사와 경부 초음파를 시행한다.", "갑상선분화암 환자의 15-20%에서 생화학적 불완전반응을 보인다. 다행히도, 이러한 환자들 중 대다수가 추가적인 방사성요오드 치료나 수술적 치료 없이도 결국 추적 관찰 종료 시 무병 상태로 다시 판정받게 된다. 하지만, 추적 관찰 중 갑상선글로불린 또는 갑상선글로불린항체가 증가하는 경우 구조적으로 확인되는 국소적인 병소 혹은 원격전이가 발견될 위험성이 높아지므로, 이러한 경우에는 즉각 추가적인 영상검사(전산화단층촬 영, <sup>18<\/sup>F-FDG-PET/CT 혹은 진단적 방사성요오드 전신스캔)를 한다. 혈청 갑상선글로불린이 상승되어 있으나 방사성요오드 전신스캔이 음성인 환자에 대한 방사성요오드 치료가 생존을 개선시켰다는 증거는 없으나, 특히 미세전이암에서는 무진행생존율을 증가시켰다는 보고가 있어, 이러한 경우 구조적으로 분명한 병소가 없는 경우 경험적 방사성요오드 치료를 고려할 수 있다 (III.5장 참조)."]}, "II.4.2.M": {"ids": ["II.4.2.M"], "p": ["초기 재발위험도에 관계없이 구조적 불완전반응을 보인 경우 혈청 갑상선글로불린 및 갑상선글로불린항체를 3-6개월마다 측정하고 경부 초음파 및 영상검사를 3-6개월마다 시행한다. 병소의 크기, 위치, 성장 속도, 방사성요오드 섭취 여부, 이전 치료에 대한 반응 등의 다양한 요소에 따라 수술, 방사성요오드 치료, 외부 방사선 치료, 표적치료제와 같은 추가적인 치료를 할 수 있고 일부 환자에서는 지속적인 경과관찰을 할 수 있다."]}, "III.1.A": {"ids": ["III.1.A", "III.1.B"], "p": ["경부 재수술에서는 다발성 림프절전이와 미세전이가능성을 고려하여 해당 구역의 림프절을 모두 절제하 고, ‘berry picking’과 같이 재발한 림프절을 선택적으로 제거하는 방식(targeted approach)은 가급적 피하는 것이 좋다. 하지만, 재발한 림프절이 이전에 이미 절제된 구역 인 경우 전체 구역의 림프절을 다시 모두 제거하는 것이 어렵고 합병증의 위험이 있다. 특히 구역 VI 재발의 경우, 저칼슘혈증과 후두 신경 손상과 같은 합병증 가능성이 높다. 따라서 미국 두경부외과학회 공동 성명서 (American Head and Neck Society Consensus Statement) 에서는 양측 구역 VI의 림프절전이가 있지 않는 한 양측 구역 VI 림프절절제술은 피하는 것을 권고하였으며, 심 지어 양측 구역 VI 재발이 있는 경우에도 반대측은 2차 수술로 단계적으로 수행할 수 있다고 언급하였다. 한 연구에서, 구역 VI 림프절에 대한 재수술 적응증으로 제안된 최대 림프절의 크기(8 mm)가 너무 엄격한 기준일 수 있으며, 15 mm로 상향 조정하여도 수술 합병증이 증가하지 않는다고 제안하였다. 이와 반대로, Clayman 등은 구역 6/7에서 재발/지속성 갑상선암 환자에 대해 양측 림프절절제술이 안전하고 효과적이라고 보고하였다. 그 들의 연구에서 영구적 저칼슘혈증 발생률은 1%이고, 되돌이후두신경 마비 발생률은 2%였다. 첫 번째 수술 후 재발률은 10%였으며, 두 번째 수술 후 재발률은 2%였다. 10년 동안의 질병 특이 생존율은 45세 미만 환자에서는 98.9%이고, 45세 이상 환자에서는 77.9%였다.", "구역 VI 림프절 재수술과 비교하여, 측경부 림프절 재 수술(구역 II-V)에서는 재발한 림프절을 선택적으로 제거하는 방식(targeted approach)보다는 구역 중심적인 절 제(compartment oriented dissection)의 필요성이 보다 강 조된다. Chinn 등 은 재발/지속성 갑상선암 환자에서 구역 II-V 림프절절제술을 시행 후 10년 전체 생존율과 질병 특이 생존율은 각각 78%와 91%였으며 수술로 인한 합병증은 거의 없었다고 보고하였다. 또다른 연구에서 갑상선전절제 및 방사성요오드 치료 후 측경부 림프절 재발은 여러 구역에 거쳐서 다발성으로 발생할 가능성이 높으며, 첫 번째와 두 번째 측경부 재발에서 각각 77%와 64%에서 여러 구역에 거쳐 다발성으로 재발하였다.", "경부의 진행성 병소가 상부 호흡기-소화기를 침범한 경우에는, 일반적으로 수술과 함께 추가적인 방사성요오드 치료 및 외부 방사선조사 치료를 고려한다. 환자의 예후는 기능은 보존하면서 육안으로 보이는 종양을 완전히 제거할 수 있는가에 달려 있는데, 기도 혹은 식도의 표면에 있는 종양을 제거하는 것부터 기도 침범이 깊을 경우 기도절제와 문합 혹은 식도인두절제술등의 적극적인 수술까지 다양한 기법이 동원된다. 수술 결정은 복합적이며, 종양의 완전한 제거와 상부 호흡기-소화기의 기능을 보존하는 것의 균형을 맞춰야 한다. 수술을 근치 목적으로 시행하는 경우도 있으나, 원격전이가 있으면서 호흡곤란이 악화되거나 객혈이 있는 경우에는 증상 완화 목적으로 시행할 수도 있다."]}, "III.2.A": {"ids": ["III.2.A"], "p": ["갑상선 수술부위 재발암 및 경부 전이림프절의 표준 치료법은 수술과 방사성요오드 치료로 알려져 있다. 하지만 반복적으로 수술을 시행한 환자의 경우 해부학적 구조의 변형과 심한 섬유화가 발생하여, 갑상선 수술부위 재발암과 경부 전이림프절을 수술적으로 제거하는 것이 쉽지 않다. 뿐만 아니라 재수술로 인한 합병증의 위험도가 증가하게 된다. 최근 들어 수술을 거부하거 나 재수술로 인한 합병증의 위험도가 높은 환자에서 갑상선 수술부위 재발암과 경부 전이림프절의 치료 대안으로 초음파 유도 하에 진행되는 비수술적절제 치료가 대안적 치료법으로 제시되고 있다. 비수술적절제 치료에는 고주파, 에탄올, 레이저, 마이크로파절제술이 있으며, 이 중에서 국내에서는 고주파절제술이 가장 많이 이용되고 있으며, 고주파절제술은 다른 비수술적 절 제술보다 갑상선 수술부위 재발암과 경부 전이림프절에서 그 효과와 안정성이 많은 연구들에서 보고되어 있다.", "고주파절제술을 포함한 비수술적절제술은 갑상선 수술부위 재발암과 경부 전이림프절을 치료하는데 있어서 높은 완전 소실률을 보이고 있으며, 수술과 비교해서 유사한 무재발생존율(recurrence free survival rate)을 보이고 있다. 갑상선 수술부위 재발암 및 경부 전이림프절의 치료성적을 평가하는데 있어서 정립된 지표는 아직 없지만, 근치적 목적으로 시행하는 치료에 있어서 갑상선 수술부위 재발암 및 경부 전이림프절 완전 소실률 (complete disappearance rate) 과 재발률이 중요한 결과지표로 고려되고 있다. 총 11 개의 연구를 대상으로 진행한 분석 결과 갑상선 수술부위 재발암 및 경부 전이림프절의 수술의 완전 소실율은 51-100%로 확인되었다. 이와 비교해서 갑상선 수술부위 재발암 및 경부 전이림프절의 비수술적절제술 치료에 대한 메타 분석에서 82% 의 완전 소실률을 보여주었으며, 162명을 포함한 5개 연구의 메타분석에서는 68.8%의 완전 소실률을 보여주 었다. 국내에서 갑상선 수술부위 재발암 및 경부 전이림프절에서 시행한 고주파절제술의 5년 이상의 장기 추적 관찰 연구에서 총 46개의 재발암 중 91.8%에서 완전 소실률을 보여주었다. 갑상선 수술부위 재발암 및 경부 전이림프절의 치료로 수술과 고주파절제술의 무재발생존율을 비교한 연구에 의하면 고주파절제술이 수술과 비교해서 유사한 무재발생존율을 보여주고 있다(1년: 96.0% vs. 92.2%; 3년: 92.6-100% vs. 92.2-97.9%; 6년: 100% vs. 97.8%). 연구의 기간과 포함된 환자군의 차이가 있기는 하지만 최근에 나온 5년 이상의 장기 추적 연구에 의하면 고주파절제술의 무재발생존율이 66%, 마이크로파절제술의 무재발생존율은 72%로 확인되었다. 이와 같은 결과는 갑상선 수술부위 재발암 및 경부 전이림프절에서 고주파절제술을 포함한 비수술적절제 술의 효과를 입증해주고 있다.", "반면에 완화적 목적의 치료에 있어서는 갑상선 수술부위 재발암 및 경부 전이림프절의 부피 감소나 증상의 개선이 중요한 결과지표로 이용되고 있다. 완화적 목적으로 시행한 고주파의 연구에서 16명의 갑상선 수술부위 재발암의 증상 완화율이 63.6%로 확인되었다.", "치료의 안정성 또한 중요한 결과지표로 평가할 수 있다. 갑상선 수술부위 재발암 및 경부 전이림프절에서 시행한 고주파절제술의 메타분석에서 10.9%의 전체 합병증 발생률, 6.7%의 주요 합병증 발생률을 보여주었으 며, 129명의 환자를 대상으로 진행한 연구에서는 7.8% 의 전체 합병증 발생률과 5.4%의 주요 합병증 발생률을 보여주었다. 수술과 고주파절제술의 합병증을 비교한 연구에 의하면 전체 합병증이 고주파절제술에서 낮게 확인되었다(1.8% vs. 8.1%, 10% vs. 38.6%). 따라서 수술을 시행하기 어려운 환자나, 수술을 거부하는 경우, 혹은 여러 번의 수술로 인해 추가적인 수술 후 부작용의 가능성이 높은 환자에서 비수술적절제 치료를 고려할 수 있다. 대한갑상선영상의학회에서 2017년에 발표한 고주파절제술 권고안에 갑상선 수술부위 재발암 및 경부 전이림프절의 고주파절제술에 대한 적응증 및 치료 방법이 포함되어 있으며, 이 권고안에 따르면 수술을 거부하거나 수술의 위험도가 높은 환자에서 근치적 혹은 완화적 목적으로 고주파절제술을 권고하고 있다. 미국을 포함한 국제 다학제 합의 권고안과 유럽갑상선학회의 권고안에서도 유사한 적응증을 바탕으로 갑상선 수술부위 재발암 및 경부 전이림프절에서 비수술적절제술 을 권고하고 있다."]}, "III.3.1.A": {"ids": ["III.3.1.A", "III.3.1.B", "III.3.1.C", "III.3.1.D", "III.3.1.E", "III.3.1.F"], "p": ["원격전이는 갑상선분화암 환자의 10% 미만에서 발생한다. 이 중 절반은 첫 진단 시 이미 존재하고, 나머지는 나중에 발견되며 때로는 초기 치료 후 수십 년 후에 발견되기도 한다. 가장 흔한 부위는 폐와 뼈(각각 49%와 25%) 이며, 두 부위에 모두 전이되는 경우도 15% 로 보고되었다. 뼈 전이는 갑상선유두암(31.5%)보다 갑상선여 포암(55.5%)에서 더 흔하며, 가장 흔하게 침범하는 곳은 척추(34.6%)와 골반(25.5%)이다.", "원격전이를 동반한 갑상선분화암 환자에게 TSH 억제와 방사성요오드 섭취가 유지되는 한 방사성요오드 치료를 주기적으로 반복하는 것이 주요한 치료법이다. 원격전이 갑상선암 환자의 약 2/3가 방사성요오드 섭취 병소를 가지고 있으며 이 중 40% 이상이 방사성요오드 치료 후 관해를 획득한다. 나머지 환자 중 일부는 요오드를 충분한 양으로 농축하여 효과적인 방사선 흡수선량을 전달할 수 있는 능력을 상실하게 되어 방사성요오드 불응성에 빠진다. 그러나 방사성요오드 불응성 갑상선암은 드문 질환으로서, 유럽에서는 전체 인구 백만 명당 연간 4-5건의 추정 발생률을 보인다고 하였다. 또한, 실제 임상에서는 어떠한 기준으로 방사성불응성을 정의할지 그리고 어느 시점에서 방사성요오드 불응성으로 분류해야 하는지를 결정하는 것이 쉽지 않다.", "폐전이 병소는 다발성인 경우가 많고 크기도 다양하다. 폐 미세전이(pulmonary micrometastasis)는 방사성요오드 치료를 우선적으로 시행한다. 미세전이는 직경 2 mm 미만의 병소로서 일반적으로 구조적 영상에서는 관찰되지 않으며, 방사성요오드를 섭취하는 경우 방사성요오드 치료로 완전관해될 가능성이 가장 높다. 그러므로 방사성요오드 섭취가 있고 임상적 반응이 있는 경우에는 6-12개월 간격으로 반복하여 방사성요오드 치료를 시행한다. 대결절 폐전이(macronodular pulmonary metastasis)도 방사성요오드 섭취가 있으면 방사성요오드 치료를 시행할 수 있다. 그러나 대결절 폐전이는 폐 미세전이에 비하여 완전관해가 흔하지 않으며 치료 후 생존율도 상대적으로 불량하다.", "갑상선암 환자는 비교적 생존 기간이 길기 때문에 뼈전이 병소가 있으면 병적골절, 척수압박, 통증완화 또는 골절예방을 위한 외부방사선 요법 또는 수술 시행, 고칼슘혈증과 같은 골격계 합병증(skeletal related events, SRE) 위험이 증가한다. 방사성요오드 섭취를 보이는 뼈전이 병소는 방사성요오드 치료를 일차 치료로 고려한다. 뼈전이 환자에서 방사성요오드 치료 시 완치가 되는 경우는 드물지만, 일시적으로 병의 진행을 안정화시킴으로써 생존율을 증가시키는 치료 이득을 얻을 수 있음이 보고되었다. 뼈전이 병소를 대상으로 방사성요오드 치료를 시행할 때에는, 구조적 영상에서 보이는 뼈전이 병소라면 직접적인 치료방법(수술, 외부방사선조사치료, 고주파절제술 등의 국소적인 요법)이나 뼈를 표적으로 하는 전신치료 요법의 필요성에 대해서 각각의 치료에서 기대되는 효과와 위해를 비교하여 평가하여야 한다.", "방사성요오드 치료를 위해 TSH 자극을 하거나 방사성요오드 치료에 의한 종양 반응이 일시적으로 뼈전이 병소에 증상을 일으키거나 골절, 신경학적 합병증 등을 유발할 수 있다. 이런 가능성이 예상될 때 방사성요오드 치료 전에 스테로이드제 투여를 병행한 외부 방사선 치료를 먼저 고려한다. 뼈전이 병소 치료에 방사성요오드를 비롯한 여러 국소치료법을 단독으로 사용하거나 또는 전신치료와 병행할 수 있으며, 뼈의 통증을 경감시키는데 효과적이고 삶의 질을 향상시키고, 골격계 합병증을 줄이는데 도움이 될 수 있다."]}, "III.3.2.A": {"ids": ["III.3.2.A", "III.3.2.B"], "p": ["방사성요오드 치료는 많은 환자에게 그 치료효과가 입증된 치료법이나 최적의 용량에 대하여서는 아직 논란이 있다. 방사성요오드 치료의 효과는 병소에 흡수되는 선량과 종양 조직의 방사선 민감성과 관련되어 있다. 일반적으로 젊은 환자, 분화도가 좋은 암, 방사성요오드 섭취가 있으면서 <sup>18<\/sup>F-FDG 섭취는 없는 유두암 또는 여포암이 종양의 방사선 민감성이 높다.", "방사성요오드 치료의 용량을 결정하는 방법은 세 가 지가 있는데, 1) 고정용량을 경험적으로 투여하는 방법, 2) 혈액과 체내 방사선량을 측정하여 최대허용용량을 결정하는 방법, 3) 종양의 방사선량을 정량적으로 측정하는 방법 등이다. 원격전이가 있거나 신부전, 소아, 고령 혹은 폐전이가 광범위한 환자를 치료할 때 등, 제한적인 경우에 방사선량 측정법을 사용하여 용량을 결정할 수 있다. 향후 <sup>123<\/sup>I 또는 <sup>131<\/sup>I-SPECT/CT나 <sup>124<\/sup>I-PET을 이용하면 전신 또는 국소 병소에 대한 선량평가가 용이할 것으로 예상된다.", "국소 혹은 원격전이 병소의 방사성요오드 치료 시 투 여량을 결정하기 위해 경험적 고용량과 선량측정법 중 어느 것이 더 우월한 지 아직까지 밝혀져 있지 않다. 미국갑상선학회에서는 특별한 용량 결정 방법을 제시하지 않았으며, 미국핵의학회(Society of Nuclear Medicine and Molecular Imaging, SNMMI)에서는 크기가 크지 않은 국소 병소는 100-150 mCi (3.7-5.6 GBq), 진행된 국소 병소나 제한된 원격전이 병소는 150-200 mCi (5.6-7.4 GBq)의 경험적 용량을 사용하고, 광범위한 원격전이 병소의 치료를 위하여 선량 측정을 통한 200 mCi (7.4 GBq) 이상의 고용량의 방사성요오드 치료를 권고하였다. 이상의 근거와 권고안을 바탕으로 본 권고안에서는 수술적 제거가 어려운 진행성 혹은 원격전이 병소의 방사성요오드 치료 용량으로 100-200 mCi (3.7-7.4 GBq) 를 우선적으로 사용할 것을 권고하였으며, 원격전이 병소가 광범위한 경우에는 경험적으로 100-200 mCi (3.7-7.4 GBq)의 용량을 사용하거나 선량 측정을 통하여 용량을 결정하는 방법을 함께 제시하였다.", "골수 기능에 영향을 주지 않는 최대허용방사선흡수선량(maximum tolerated radiation absorbed dose)은 보통 혈액의 흡수선량 200 cGy로 정의한다. 그러나 200 mCi (7.4 GBq)의 용량을 사용하였을 때, 70세 이하는 8-15%, 70세 이상은 22-38% 정도의 환자에서 최대허용방사선흡수선량을 초과하였고 250 mCi (9.3 GBq) 용량에서는 70 세 미만의 22%, 70세 이상의 50%에서 초과했다는 보고가 있다. 특히 70세 이상의 고령 환자 및 신기능이 저 하된 경우 등에서는 100-150 mCi (3.7-5.6 GBq) 이상의 경험적 용량을 투여해도 최대허용방사선흡수선량을 초과할 수 있으므로 주의가 필요하다.", "미만성 폐전이 병소에서는 드물지만 고용량의 방사성요오드 치료 직후에 발생하는 방사선 폐렴이나 장기 추적 중 발생하는 폐섬유화 등에 대한 주의가 필요하다. 이를 예방하기 위해 방사성요오드 스캔에서 미만성 폐섭취가 있을 경우 투여 후 48시간째 전신잔류량 80 mCi (3.0 GBq) 또는 골수선량이 200 cGy 이하가 되도록 선량을 평가하여 치료하는 방안을 고려할 수 있다. 만약 폐섬유화가 의심된다면, 주기적으로 일산화탄소확산능검사 를 포함한 폐기능검사와 호흡기 기능에 대한 자문이 필요하며, 폐섬유화가 진단되면 이후 방사성요오드 치료 시행이 제한될 수 있다."]}, "III.3.3.A": {"ids": ["III.3.3.A", "III.3.3.B"], "p": ["전이암에 대해 rhTSH를 이용한 방사성요오드 치료의 효과에 대해 아직까지 갑상선호르몬 중단요법을 직접 비교한 무작위배정 임상연구는 없으나, 대부분의 비무 작위배정 연구에서 rhTSH를 사용한 치료가 갑상선호르몬 중단요법을 시행한 경우와 비교하여 병의 진행이나 장기 치료 성적의 유의한 차이가 없었다고 보고하였다. LT4 중단군과 rhTSH군을 비교한 메타분석 문 헌에서도 질병진행 위험도는 차이가 없었다. 그러므로 비록, 구조적 질병 진행에 대한 이득이 관찰되지는 않았지만 위험도가 증가하지 않았으며, 환자의 삶의 질이 전반적으로 개선되고 있으므로 각 개별 상황에서 환자의 이득과 위해를 고려하여 사용하도록 권고하였다. LT4 중단 시 발생하는 갑상선기능저하가 기저질환을 악화시켜 위험을 초래할 수 있는 경우, 뇌하수체 질환이나 갑상선암 병소에서 갑상선호르몬이 생성되어 내인성 TSH를 충분히 상승시킬 수 없는 경우, 또는 치료 지연이 심각한 악영향을 초래하는 경우 등에서 rhTSH를 이용한 방사성요오드 치료를 우선 시행할 수 있다. 이 경우 방사성요오드의 용량은 LT4를 중단하였을 경우 또는 개별 선량측정법으로 결정한 경우와 동일하거나 더 높게 투여할 수 있다.", "한편, 과도하거나 너무 오랫동안 TSH가 상승해 있는 것은 갑상선암의 성장을 자극할 우려가 있다. 척수나 상 대정맥에 인접한 전이암은 LT4 중단 대신 rhTSH를 사용하여 방사성요오드 치료를 하는 경우에도 각각 신경학적 증상이나 상대정맥증후군 등을 유발할 수 있으므로, 치료 전에 치명적 전이병소를 찾기 위해 MRI 등의 영상을 시행할 것을 권한다. 이 경우 종양이 급격하게 팽창할 위험을 줄이기 위해 일시적으로 고용량 스테로이드를 투여한다. rhTSH를 사용하는 경우에는 rhTSH 투여 6-12시간 전, LT4를 중단하는 경우에는 중단 후 10-12일 뒤부터 덱사메타손 2-4 mg을 8시간 간격으로 투여하고, rhTSH 투여 후 48-72 시간 뒤 혹은 LT4 재투여 72시간 뒤부터 1주일 간 스테로이드를 단계적으로 감량 하여 중단한다.", "효과적인 방사성요오드 치료를 위해서는 혈청 TSH 수준이 30 mIU/L 이상이 되어야한다. 이를 고려하여 TSH 상승이 치명적일 수 있는 전이암이 있는 환자에 대해서는 혈청 TSH를 모니터링하면서 rhTSH의 용량을 줄여서 투여하거나, LT4 중단 기간이나 정도를 완화 하도록 하며, 이를 위해 일시적으로 체내 반감기가 짧은 LT3 로 대체하여 사용할 수 있다. 갑상선호르몬 중단요법을 하였다면 방사성요오드를 투여한 직후 갑상선호르몬을 재투여하기 시작하여 TSH 상승 기간을 줄이도록한다.", "rhTSH의 안전성에 관한 연구결과, 갑상선호르 몬중단요법을 시행한 경우와 비교하여 혈액학적 지표, 신기능, 환자의 주요 증상 및 재원기간 등에 유의한 차이가 없었다. 또한 삶의 질 개선 효과가 확인되어, 국소 진행성 혹은 원격전이가 있는 갑상선분화암 환자에게 방사성요오드 치료 시 전처치 목적의 rhTSH 사용은 개별 환자의 임상적 상황에 따른 이득과 위해를 고려하여 사용할 것을 권한다."]}, "III.3.5.A": {"ids": ["III.3.5.A", "III.3.5.B"], "p": ["혈청 갑상선글로불린이 상승되어 있으나 방사성요오드 전신스캔이 음성인 환자에 대한 일률적인 방사성요오드 치료는 분명한 이득을 얻기 어렵다. 이런 환자를 대상으로 경험적 방사성요오드 치료를 결정할 때에는 구조적인 병소 여부에 대한 고려가 필요하다. <sup>18<\/sup>F-FDG PET/CT를 시행하는 것이 도움이 될 수 있다. 일반적으로 <sup>18<\/sup>F-FDG를 섭취하는 종양은 방사성요오드를 잘 섭취하지 않으므로, 방사성요오드 치료가 효과적이지 않을 가능성이 있다.", "SNMMI에서는 혈청 갑상선글로불린이 상승되어 있으나 방사성요오드 전신스캔이 음성인 환자의 치료 방침을 결정할 때, 해당 환자에 대한 치료 목표(완치, 진행 감소, 완화 등), 마지막 방사성요오드 치료 용량, 반응, 기간 및 합병증, 누적 용량, 예상되는 효과와 이득, 동반질환 등을 고려하도록 권고하고 있다.", "경험적 방사성요오드 치료를 시행하는 혈청 갑상선글로불린의 기준치(cut-off)를 결정하기 위해 전향적으로 시행된 연구는 없다. 혈청 갑상선글로불린이 5 ng/mL 이상인 경우 치료 없이 감소되는 경우는 거의 없으며, 차후에 구조적 재발이 발생할 비율이 높았고, 혈청 갑상선글로불린의 상승속도가 빠를 경우, 임상적으로 재발 소견이 발견될 가능성이 있다. 이 점을 고려하여 대부분의 연구는 갑상선호르몬 중단요법 후 혈청 갑상선글로불린 10 ng/mL 이상 또는 rhTSH 투여 후 혈청 갑상선글로불린 5 ng/mL 이상을 기준으로 제시하였다.", "진단적 전신스캔은 <sup>123<\/sup>I이나 <sup>131<\/sup>I을 저용량 투여하기 때문에 광자량(photon flux)이 적어서 잔존 병소를 찾지 못할 수 있으나, 치료 시에는 더 높은 용량을 사용하기 때문에 치료 후 스캔에서는 병소가 국소화될 수 있다. 따라서 경험적 방사성요오드 치료를 통해 1) 병소를 국소화 하거나, 2) 미세전이암에 대한 치료 효과에 따른 혈청 갑상선글로불린의 감소를 기대해 볼 수 있다.", "본 권고안에서는 혈청 갑상선글로불린 양성이며 방사성요오드 전신스캔 음성인 환자에 대한 경험적 방사성요오드 치료가 유용한지 평가하기 위해 이에 대한 체계적 문헌고찰을 시행하였다. 경험적 방사성요오드 치료 후 생존 혹은 무진행생존에 미치는 영향을 보고한 논문은 각 1편으로, 전체 생존을 개선시켰다는 증거는 없으나, 무진행생존율은 유의하게 개선되었다. 한편, 치료 후 병소의 국소화에 대해 발표된 12개 연구 298명을 대상으로 메타분석한 결과 61% (95% 신뢰구간, 0.48-0.73)의 환자에서 경험적 방사성요오드 치료 후 진단적 전신스캔에서 관찰되지 않았던 병소를 추가적으로 찾을 수 있었고, 치료 후 혈청 갑상선글로불린의 감소에 대해 발표된 10개 연구 330명을 대상으로 메타분석한 결과 61% (95% 신뢰구간, 0.43-0.78) 에서 경험적 방사성요오드 치료 후 혈청 갑상선글로불린의 감소를 관찰할 수 있 었다.", "치료 전 시행한 구조적 영상에서 측정이 불가능한 미 세전이암과 측정이 가능한 전이암(직경≥1 cm)을 가진환자로 나누어 하위그룹 분석을 한 결과, 측정가능한 전 이암을 가진 환자에서 경험적 방사성요오드 치료의 효과가 더 낮았다. 측정 가능한 병소가 있는 경우 43% (95% 신뢰구간, 0.16-0.73), 미세전이암 환자군에서는 64% (95% 신뢰구간, 0.51-0.77)에서 치료 후 전신 스캔에서 추가적인 병소가 관찰되었으며, 측정가능 전이암 군에서 는 24% (95% 신뢰구간, 0.01-0.61), 미세전이암 환자군에서는 69% (95% 신뢰구간, 0.52-0.84)에서 혈청 갑상선글로불린 감소가 확인되었다. 따라서 방사성요오드 전신스캔에 음성이면서 구조적으로 측정가능한 병소(직경≥ 1 cm)가 있는 환자는 경험적 방사성요오드 치료의 효과가 상대적으로 낮을 것으로 예상되므로 이에 대한 임상적 고려가 필요하다. 그러므로 방사성요오드 전신스캔 음성이지만 혈청 갑상선글로불린이 증가되어 있는 환자에서, 경험적 방사성요오드 치료를 결정할 때에는 구조적인 병소 여부에 대한 고려가 필요하고 구조적으로 분명한 병소가 없는 경우에는 경험적 방사성요오드 치료를 고려할 수 있다. 그러나 측정 가능한 구조적 병소(직경≥1 cm)가 있는 경우에는 경험적 방사성요오드 치료를 고려할 근거가 충분하지 않다. 또한, 경험적 방사성요오드 치료 후 전신스캔에서 음성이었던 경우에는 추가적인 경험적 방사성요오드 치료는 적절하지 않다. 경험적 방사성요오드 치료는 예상되는 치료 효과(이득)와 위험을 균형감 있게 고려하여 결정하여야 한다."]}, "III.3.6.A": {"ids": ["III.3.6.A", "III.3.6.B", "III.3.6.C", "III.3.6.D"], "p": ["방사성요오드 치료 시 완벽하게 안전한 치료용량이나 특정 임상상황에서 사용할 수 없는 최대누적용량은 정의할 수 없다. 그러나 누적용량이 높을수록 앞서 언급한 부작용의 발생 빈도는 증가한다. 일시적인 미각 이상이 나 상실, 침샘염을 막기 위해서 충분한 수분섭취, 신맛 나는 사탕, 침 분비 촉진제 등 침샘손상을 예방하는 조치 를 사용할 수 있으나, 아직까지 이를 권고하거나 반대할 만한 증거는 부족하다. 한 연구에서는 신맛 나는 사탕을 방사성요오드 투여 후 1시간 이내에 섭취한 경우 24시간 이후에 섭취한 경우와 비교하여 침샘 손상이 증가하기 도 하였다. 다른 연구에서는 <sup>124<\/sup>I을 투여한 후 20분 이내에 레몬주스를 마시게 하면 침샘에 흡수되는 방사선 량이 증가한다고 보고하였다. 또다른 연구에서는 조기에 반복적으로 레몬주스를 섭취하게 하는 것이 귀밑샘 의 방사선피폭을 줄인다고 보고하였으나 아직까지 침 분비 촉진제가 정확하게 어떤 기전으로 침샘손상을 예 방하는지 불분명하다.", "다만, 통증을 동반한 침샘염은 얼음 마사지로 통증을 완화하고, 구강건조증이나 충치 같은 만성 합병증이 있을 경우 콜린계 약제가 침분비를 증가시킬 수 있다. 일부 연구에서는 내과적 치료에 반응이 없을 경우 중재 적 침샘관내시경술이 효과적일 수 있다고 보고하였다. 최근 전향적 무작위 연구 12개를 대상으로 시행한 체계적 문헌고찰 에서는 침샘마사지, aromatherapy, 비타민 E, 셀레늄, amifostine, bethanechol 등의 침샘촉진 제가 예방 효과가 있을 가능성을 제시하였다. 그러므로 아직까지는 방사성요오드 치료 시 발생할 수 있는 침샘 염 예방을 위한 확립된 권고안은 없으며, 각 환자의 상황에 따라 선택한다.", "방사성요오드 치료 후 구강건조증이 발생한 환자는 충치의 위험이 증가하므로 이에 대한 치과적 예방 조치 를 고려하여야 한다. 이 때, 침샘스캔은 구강건조증 환자를 구분하는데 도움을 줄 수 있으나, 이를 통한 침샘기능 의 객관적 평가가 충치에 대한 예방적 조치에 도움이 되 는지에 대해서는 아직까지 이를 권고하거나 반대할 만한 증거는 부족하다. 방사성요오드 치료 후 코눈물관이 좁아져서 눈물 배출이 막히면 눈물흘림증뿐 아니라 감 염에도 취약해지므로 수술적 교정을 고려하여야 한다."]}, "III.3.6.E": {"ids": ["III.3.6.E"], "p": ["방사성요오드 치료 후 이차원발암 발생 및 평가에는 일반적으로 누적선량, 치료 당시 나이, 조직의 방사선민 감성, 이차암 발생의 잠복기 등이 중요한데, 연관된 보고 들의 연구 대상군의 특성과 관찰 기간, 연구 방법 등에 따라 차이가 심하여 아직까지 논란이 많다. 메타분석 을 포함한 몇몇 연구에서 누적 방사성요오드 용량이 증 가함에 따라 이차원발암이 증가하며, 누적 방사성요오드 용량이 200 mCi (7.4 GBq) -1000 mCi (37.0 GBq) 를 초과할 경우 이차원발암이 증가하는 것을 보고하였다. 이와는 반대로 누적용량 1000 mCi (37.0 GBq) 이상에서 이차암 발생위험비에 유의한 차이가 없다는 결과도 보고되고 있다. 최근의 한 메타분석에서도 방사성요오드 치료군과 수술군 사이에 조정위험비 차이가 없음이 보고되었다.", "개개의 이차원발암 중 방사성요오드 치료와 연관성을 보이는 것은 백혈병이 가장 뚜렷하며, 100 mCi (3.7 GBq) 누적용량에서 증가가 관찰되었고, 메타분석에서 백혈병의 상대위험도는 1.6-2.5배로 보고되었다. 침 샘암 등에서 일부 연구 결과에 차이는 있으나, 다수의 연구에서 백혈병 이외 다른 고형암의 발생율의 위험도의 증가는 관찰되지 않았다. 방사성요오드 치료 후 유방 암의 위험이 증가한다는 보고가 있으나, 체계적 문헌고찰 결과에서는 유방암이 증가하지 않았다. 다만 방사선요오드 치료 이후 10년 이상 경과하였을 때 유방암 발생이 증가하기 시작하였고, 체르노빌 사고 이후 유방암이 증가하였다고 보고한 연구에서는 잠복기의 중앙값이 20 년이었으므로, 이차암 발생에 관한 연구결과 들을 해석할 때 관찰기간에 대한 주의가 필요하다.", "한편 20년 이상 장기 생존 갑상선암 환자를 대상으로 한 미국 SEER 암등록자료에서는 방사성요오드 치료는 고형암과 혈액암 발생증가와 관련이 있었고, 고형암의 6%, 혈액암의 14% 발생에 기여하는 것으로 추정하였다. 특히 방사성요오드 치료 당시 나이가 어릴수록, 관찰기간이 오래될수록 이차암 발생이 증가하였는데, 치료 당시 나이가 25세 미만인 경우 고형암의 상대위험이 1.60 (95% 신뢰구간, 1.07-2.40)이고, 관찰기간 20년 경과 시 상대위험이 1.47 (95% 신뢰구간, 1.24-1.74)이었다. 우리나라에서 29세 이하 갑상선암 환자를 대상으로 방사성요오드 치료를 받은 군과 수술군을 비교한 연구는 관찰기간의 중앙값이 79개월에 불과하였으나, 방사성요오드 치료군의 이차암 조정 발생위험비가 1.52 (95% 신뢰구간, 1.03-2.24)로 높음을 보고하였다.", "그러므로 반복적인 방사성요오드 치료를 계획하는 경우에는, 환자의 연령 등의 특성과 누적 방사성요오드 용량에 따라 이차원발암 발생위험도를 고려하여야 하고, 치료 전 이차원발암을 포함한 합병증 발생위험도와 치료의 이득을 평가하여, 환자와 공유의사결정을 통해 방사성요오드 치료 여부를 결정하여야 한다. 이와 같이 갑상선암 환자에서 방사성요오드 치료 후 일부 이차원발 암의 발생 위험이 증가하지만, 해당 이차원발암 발생의 절대위험도는 높지 않고, 조기 진단 혹은 발생 예측 효과가 보고되고 있지 않은 상황으로, 동일 연령대의 일반인 이 시행하는 건강검진에 추가하여 이차원발암 발생을 선별하기 위하여 특별한 선별검사는 권고되지 않는다.", "(3) 골수 기능 및 신 기능에 미치는 영향", "골수선량이 200 cGy 이하일 경우 백혈구나 혈소판에 미치는 영향은 일시적이나, 반복하여 치료하는 일부 환자에서는 백혈구나 혈소판의 가벼운 감소가 지속될 수 있다. 신장은 요오드를 몸에서 배출하는 주요 장기이 므로 기능 부전이 있을 경우 방사성요오드의 배설이 감소하여 골수를 비롯한 방사선민감장기에 흡수되는 선량이 높아질 수 있다. 복막투석을 시행하는 환자는 방사성요오드 제거율이 만성신질환이 없는 환자들의 20% 수준 이하로 감소한다는 연구보고가 있다. 그러나 혈액 투석을 시행하는 경우 오히려 방사성요오드가 몸에서 빨리 제거되므로 전이암 병소에 충분한 양의 방사선이 전달되지 못할 우려가 있다. 신부전 환자에게 충분히 효율적이면서 안전한 방사성요오드 치료 프로토콜은 정립되어 있지 않기 때문에 환자의 개별 임상상황을 고려하여 방사성요오드 치료 용량을 결정하고 치료 전후 투 석 프로토콜을 결정할 것이 권고된다."]}, "III.3.6.F": {"ids": ["III.3.6.F", "III.3.6.G", "III.3.6.H"], "p": ["방사성요오드 치료가 예정된 가임기 여성은 먼저 임 신검사를 시행하여야 한다. 생식선은 혈액, 소변, 대변에 있는 방사성요오드로부터 방사선피폭을 받는다. 가임기 여성의 20-27%에서 방사성요오드 치료 후 4-10개월간 일시적인 무월경 또는 희발월경이 나타날 수 있다. 그러나 방사성요오드 치료가 난소예비력에 영향을 주는지에 대해서는 아직 논란이 있다. 두 편의 연구에서 난소예비력을 나타내는 항뮬러관 호르몬(anti-Müllerian hormone, AMH)이 감소함을 보고하였으나, 1년 후 부분적으로 회 복되었고, AMH가 낮았음에도 불구하고 불임이 보고된 바 없었다. 또다른 연구에서는 방사성요오드 치료군과 대조군 사이에 AMH 차이가 없었다.", "방사성요오드 치료가 임신결과에 미치는 영향을 연구한 결과, 방사성요오드 치료 후 임신은 안전하였으며 유산, 사산, 조산, 선천 기형, 출생아의 저체중 또는 영아사 망률에 영향을 주지 않았다. 한 대규모 후향적 연구에서는 방사성요오드 치료 후 임신 연령이 늦어지고 출산율이 떨어졌다고 보고하기는 하였으나, 이는 담당 의사가 임신을 늦출 것을 권유하는 진료행태와 관련이 있으며, 임신 선택이나 생식 건강 (reproductive health) 과 관련이 있는지 명확하지 않았다. 최근 여러 진료권고안에서 방사성요오드 치료 종료 후 갑상선호르몬 보충 요법을 시작하여 그 수치가 안정되는 것을 충분히 기다 리기 위해 최소 6개월 이상 임신을 미룰 것을 권하였다.", "방사성요오드는 수유 중인 유선조직에 농축되므로임상적 상황에 따라서 수유 중인 여성은 최소한 6주 이상, 가능하다면 3-6개월간 수유나 착유를 중단한 뒤 방사성요오드 치료를 시행하는 것이 권고된다. 수유부에 게 치료시기를 결정하기 위해서 진단스캔을 촬영하여 방사성요오드의 유방 섭취를 확인할 수 있다. 도파민계약제가 수유 중인 여성의 유방 피폭 감소에 유용할 수 있으나, 드물지만 심각한 부작용이 있을 수 있으므로 일률적 사용에는 주의가 필요하다.", "남성은 방사성요오드 치료 시 일시적으로 정자 수가 감소하거나 혈청 난포자극호르몬(follicle stimulating hormone, FSH)이 증가할 수 있다. 최근 방사성요오드 약 80-300 mCi (3.0-11.1 GBq)를 투여하여 치료한 남성 143명을 대상으로 한 연구 6개를 메타분석한 결과 생식호르몬 이상이 방사성요오드 치료 6개월 이내에 일시적으로 나타날 수 있음을 보고하였다. 누적용량이 높을 경우(500-800 mCi, 18.5-29.6 GBq), 혈청 FSH 상승이 지속될 위험이 있으나, 400 mCi (14.8 GBq) 미만 용량에서는 불임, 유산, 기형 등과 직접적 관련성은 아직 보고된 바 없다. 남성의 영구 불임은 단회 치료 용량으로 발생하지는 않으나, 이론적으로는 반복치료 시 생식선 손상의 가능성이 있으므로, 반복적으로 고용량의 방사성요오드 치료가 필요한 경우 불임의 잠재적 위험성에 대한 상담이 필요할 수 있다. 한편, 40명의 남성 을 대상으로 방사성요오드 100 mCi (3.7 GBq) 투여 후 생식기능과 정자의 염색체 이상을 연구한 결과, 정자 염색체 이상(이형성 또는 이수성)의 빈도는 치료 전 3.2% 에서 치료 후 3개월째 4.8%로 증가하였다가 13개월째 3.7%로 줄어든다고 보고하였다. 수분섭취를 충분히 하고, 자주 소변을 보며, 변비를 피하는 등의 방법이 생식선에 대한 방사선량을 줄일 수 있다. 생식세포의 일시적 염색체 손상 가능성을 고려하면, 정자의 수명을 기준으로 3-6개월간 피임하는 것이 좀더 신중한 방법이라 고 볼 수 있다."]}, "III.4.1.A": {"ids": ["III.4.1.A"], "p": ["갑상선분화암의 진행성 전이 병소의 요오드 섭취능은 시간이 지나면서 감소되고, 결국 약 40-70%에서는 방사성요오드 치료에 불응하게 된다. 진단 당시에 분화도가 나쁜 경우에는 갑상선분화암이라 하더라도 처음부터 방사성요오드 불응성이 흔하고, 재발 또는 전이에 의한 사망의 위험이 더 높다. 요오드 섭취능이 낮아서 방사성요오드 치료에 반응이 없는 경우에는 10년 생존율이 10%, 평균 생존 기간은 3-5년이다. 그러므로, 국소 또는 전이성 갑상선분화암이 방사성요오드 섭취를 보이지 않거나, 섭취 여부와 무관하게 치료 중에도 진행하는 경우에는 진행 과정 중 분화도 감소 및 방사성요오드 불응성 발생 가능성을 고려하여 치료 방침을 결정한다. 갑상선분화암에서 전신항암치료를 고려해야 하는 방사성요오드 불응성은 다음과 같이 분류한다."]}, "III.4.1.B": {"ids": ["III.4.1.B", "III.4.1.C"], "p": ["전신항암요법의 개발 및 적용과 함께 여러 권고안과 연구들에서 방사성요오드 불응성 개념을 정의하고 있으나, 지금까지 사용되고 있는 방사성요오드 불응성의 정의는 종양이 방사성요오드 치료에 불응할 가능성을 예측하는 것이므로, 진행성 갑상선암 환자의 치료 방침을 결정할 때에는 방사성요오드 불응성의 정의와 개별 환자의 계층화된 지속적위험분류(ongoing risk stratification, ORS) 상태를 함께 고려하여야 한다. 방사성요오드 치료 불응성 여부는 주로 방사성요오드 치료 후 전신스캔과 진단스캔을 포함한 CT, MRI, <sup>18<\/sup>F-FDG PET/CT 영상 소견을 기반으로 판단한다. 그러나 불응성에 대한 세부 기준은 다소 이견이 있을 수 있으며 개별 환자에서의임상적인 판단이 중요하며, 현재까지 명확하게 합의된 바는 없다. 방사성요오드 불응성의 개념은 다양한 진단 및 치료 기술의 발전과 함께 계속 변화할 것이며, 이에 대한 다학제적 논의의 필요성이 증가하고 있다.", "방사성요오드 치료효과를 예측하는 인자로는 종양의 방사성요오드 섭취 여부가 가장 중요하며, 그 외, 젊은 나이, 분화도가 좋은 세포형, 작은 전이 병소 등이 있다. <sup>18<\/sup>F-FDG 섭취가 높을 경우에는 방사성요오드에 섭취가낮은 경향이 있고, 방사성요오드 불응성의 가능성이 높다. 이러한 요인들은 서로 관련성이 있으며 전이 병소 발견 시점에서 방사성요오드 치료에 대한 결과 예측에 도움이 된다. 적절하게 시행된 첫 번째 방사성요오드 치료 후 전신스캔에서 병소에 방사성요오드 섭취가 보이지 않는 경우는 방사성요오드 불응성으로 판단할 수 있으며, 이 경우 대부분 방사성요오드 불응성을 확인하기 위한 추가적인 방사성요오드 전신스캔은 필요하지 않다.", "공통적으로 인정되고 있는 방사성요오드 불응성에 대한 정의는 일반적으로 방사성요오드 전신스캔에서의 섭취 정도와 치료 후 병소의 진행 상태에 따라 1) 모든 병소에 방사성요오드 섭취가 없는 경우, 2) 일부 병소에서만 방사성요오드가 섭취가 있고, 다른 병소에는 섭취가 없는 경우, 3) 방사성요오드 섭취가 있음에도 불구하고 질병이 진행하는 경우로 구분될 수 있다. 이때, 방사성요오드 불응성을 정의하기 위한 전신스캔으로 일부 연구들에서는 치료 후 전신스캔을 기준으로 제시하고 있지만, 최근의 권고안에서는 진단스캔과 치료 후 스캔을 모두 고려하고 있다. 또한, 방사성요오드 흡수에 영향을 미치는 요인, 즉 환자 준비, 투여 과정 및 스캔 프로토콜 등의 요인들은 방사성요오드의 섭취와 검출의 민감 도에 영향을 미칠 수 있다. 아울러, 방사성요오드의 섭취가 방사성요오드 치료의 효과가 반드시 있음을 보장 하는 것은 아니다.", "한편, 방사성요오드 치료 후 이미 방사성요오드 불응성이 확인된 환자에서 새로 발견된 병소는 방사성요오드 불응성으로 볼 수 있기 때문에 추가적인 방사성요오드 전신스캔(진단 또는 치료)을 권고하지 않는다. 특히, 전신항암요법 전에 다시 한번 방사성요오드 전신스캔 (진단 또는 치료)을 하여 방사성요오드 불응성 여부를 판단하는 것은 환자에게 갑상선자극호르몬 상승에 따른 질병 악화의 잠재적인 위험의 가능성이 높고 치료의 이득이 거의 없기 때문에 권고하지 않는다.", "(1) 방사성요오드 전신스캔에서 방사성요오드 섭취가", "없는 경우방사성요오드 전신스캔에서 모든 병소에서 섭취가 보이지 않는 경우, 방사성요오드 추가 치료가 생존율 향상에 도움이 된다는 증거는 없다. 육안적으로 병소가 확인된 후 진단적 전신스캔에서 병소에 섭취가 없는 경우에는 추가적으로 시행한 방사성요오드 치료 후 전신스캔에서 흡수가 확인되더라도 치료 효과가 제한적일 가능성이 높아 불응성으로 간주될 수 있다. 이전의 방사성요오드 치료에서 섭취가 있었으나, 이후 섭취가 사 라진 경우(지속적으로 관찰되는 비특이적인 방사성요오드 섭취 제외)도 방사성요오드 불응성으로 정의되는 데, 방사성요오드 섭취를 보이는 분화가 좋은 종양세포 는 제거되고 분화도가 나쁜 세포가 잔존하는 경우가 많 기 때문이다.", "(2) 일부 병소에서만 방사성요오드 섭취가 있고, 다른", "병소에는 섭취가 없는 경우일부 병소가 방사성요오드를 섭취하고, 다른 병소가 섭취하지 않는 혼합된 양상은 방사성요오드 불응성으로 간주된다. 이러한 상황에서 방사성요오드 치료를 계속 하는 것이 환자에게 유익하다는 증거가 불분명하기 때문이다. 방사성요오드 불응성이 확인된 병소가 진행되는 환자에서는 전신항암치료가 우선적으로 고려되어야한다. 일부 환자에서는 방사성요오드 섭취가 있는 병소에 대한 방사성요오드 치료와 방사성요오드 불응성을 지닌 제한된 숫자의 병소에 대한 국소 치료의 조합이 고려될 수 있다.", "(3) 방사성요오드 섭취가 있음에도 불구하고 질병이", "진행하는 경우대부분의 연구에서 질병의 진행이 방사성요오드 불응성의 기준이라는 데 동의하지만, 진행의 정의는 다양하다. 방사선학적 진행은 중요한 기준으로 널리 받아들여 지고 있지만, 일부에서는 생화학적 진행을 포함하기도한다. 임상 연구에서는 질병 진행을 Response Evaluation Criteria in Solid Tumours (RECIST) 1.1 기준 을 따라 엄격하게 정의한다. 하지만, RECIST에 의해 정의된 진행은 개별 환자 치료를 위해서 설계되지 않았음을 유의해야 한다. 예를 들어, 작은 새로운 병소의 출현은 기술적으로 방사선학적 진행으로 정의되지만, 임상적인 의미는 거의 없을 수도 있다. 반면, 작은 부피의 증가조 차도 전이성 병소의 해부학적 위치에 따라서 큰 임상적 영향을 미칠 수도 있다. 진행성 갑상선암에서 드물지 않게 보이는 뼈전이와 속립성 폐전이의 경우와 같이 RECIST 기준을 적용하기 어려운 경우가 많다. 그러므로, 진행성 갑상선암을 평가하기 위한 진단 검사의 해석 은 내분비학, 내분비종양학, 외과학, 영상의학, 핵의학 및 병리학 분야의 전문 지식을 갖춘 전문가들의 논의가 필요하다.", "(4) 기타", "누적 방사성요오드 치료 용량이 600 mCi에 도달한 경우도 방사성요오드 불응성으로 간주되기도 한다. 프랑스에서 진행된 한 연구에서 전이성 갑상선암 환자의 누적 용량이 600 mCi에 도달한 후 더 이상 완전 관해가 달성되지 않았다. 600 mCi를 초과하는 추가적인 방사성요오드 치료가 유익하지 않을 것이라는 결론은 이 연구를 근거한 것으로서 객관적인 기준으로서 임상 적용 이 용이하여 대부분의 임상연구에서 방사성요오드 불응성의 기준으로 사용되고 있다. 그러나 아직까지 보편적 인 누적 용량의 기준이 되기에는 근거가 부족하다. 예를 들어, 방사성요오드 치료를 여러 번 받은 후에 질병이 안정적인 환자는 방사성요오드 치료 불응성으로 간주되 기 어렵고, 임상적인 치료 이득이 기대되는 경우 600 mCi 이상의 방사성요오드 치료를 시행할 수 있다. 그러나, 잔존 병소가 지속되거나 질병이 진행하여 추가적인 치료 이득이 없다고 판단될 경우에는 방사성요오드 불응성 갑상선암으로 정의할 수 있다.", "방사성요오드 불응성의 정의에 사용되지는 않지만, <sup>18<\/sup>F-FDG-PET 스캔에서 의미 있는 섭취를 보이는 경우, 공격적이거나 분화도가 나쁜 아형의 병리소견을보이는 경우, TERT 프로모터 돌연변이와 같이 예후가 나쁜 유전자 돌연변이를 동반한 경우 등도 방사성요오드 불응성을 예측하는 데 도움이 될 수 있다."]}, "III.4.2.A": {"ids": ["III.4.2.A"], "p": ["갑상선분화암이 방사성요오드 불응성을 보이는 경우에는 방사성요오드로 치료하는 것은 이득이 거의 없다. 그러므로, 방사성요오드 불응성으로 확인된 경우에는 추가적인 방사성요오드 치료를 일반적으로 권고하지 않는다. 방사성요오드 불응성으로 정의는 되지만 그 특성에 따라서 추가적인 방사성요오드 치료를 고려할 경우에는, 치료의 이득과 위험을 고려하여 다학제 전문가들과 논의해서 결정하여야 한다. 방사성요오드 섭취 정도와 치료에의 반응이 균일하지 않은 다발성 병소를 보이는 경우에는 불응성이 확인된 병소에 대한 국소 치료와 함께 방사성요오드 치료를 병행하는 것의 장단점을 고려하여 결정할 수 있다.", "한편, 진행성 갑상선암 병소가 방사성요오드 불응성을 보이는 경우에는, 이를 극복하기 위하여 치료 전에 재분화 유도제를 투여하여 암세포에 방사성요오드가 섭 취되도록 유도, 방사성요오드 불응성을 극복하고자 하는 시도가 이루어지고 있다. 한 예비연구에서는 MEK 억제제가 방사성요오드 치료 불응성 환자에서 나 트륨-요오드 공동수송체(Na-I Symporter, NIS)의 발현을 증가시켜 방사성요오드 섭취를 증가시킬 수 있음을 보고하였으나 후속 3상 임상연구에서 MEK 억제제와 방사성요오드 병합치료의 효과 입증에 실패하였다. 그러나, 최근 BRAF<sup>V600E<\/sup> 유전자 변이 환자에게 BRAF 억제제인 다브라페닙 단독 또는 다브라페닙과 MEK 억제제인 트라메티닙을 병합한 2상 임상연구에서 방사성요오드 섭취가 증가하고 일부 환자에게 부분관해가 보고되었 다. 또한, RET 유전자 및 NTRK 유전자를 표적으로 한 표적치료제에 의한 방사성요오드 섭취 증가 등이 보 고되는 등, 방사성요오드 불응성 극복을 위해 표적항암제를 이용한 임상연구가 활발하게 이루어지고 있다. 표적항암제를 단기간 사용하면서 재분화를 유도하고 방사성요오드 치료를 병합하는 방법은 전신항암제의 장기간 사용에 따른 부작용과 경제적 부담을 해소할 수 있는 장점이 있다."]}, "III.4.2.B": {"ids": ["III.4.2.B", "III.4.2.C", "III.4.2.D"], "p": ["병소의 개수가 제한적인 경우에는 전신항암치료 전에 수술을 포함하는 국소 치료를 우선적으로 고려해야 하며, 전신항암치료는 다발성 전이가 진행되는 증거가 나타날 때부터 고려해야 한다(Fig. III.4.2.A). 그러나, 환자가 전신항암치료를 받고 있는 경우에도 조절되지 않고 성장하는 단일 또는 소수 병소에 대해서 국소 치료를 고려할 수 있다. 이 경우 국소 치료를 위해서 전신항암치료를 일시적으로 중단하고 시행할 수 있다. 방사성요오드 치료 후 섭취를 보이는 병소와 그렇지 않은 병소가 혼재 하는 경우, 방사성요오드 치료를 계속하면서 섭취를 보이지 않는 일부 단일 또는 소수 병소에 대해서 국소 치료를 함께 병행하는 것을 장단점을 고려하여 시행할 수도 있다.", "(3) 전신항암치료", "전신항암치료는 환자의 나이, 전반적인 건강 상태와 같은 임상적인 특징에 대한 면밀한 분석과 병소의 개수, 크기, 위치, 종양 성장 속도 등을 고려하여 치료여부를 결정한다(III.3장 참조)."]}, "III.4.3.A": {"ids": ["III.4.3.A", "III.4.3.B", "III.4.3.C", "III.4.3.D", "III.4.3.E", "III.4.3.F"], "p": ["방사성요오드 불응성 갑상선분화암 환자들의 질병 경 과도 매우 다양하기 때문에 어떤 환자에서 적극적인 항암치료를 해야 할지 그렇지 않으면 TSH 억제 요법을 하면서 경과 관찰을 할지를 판단하는 것이 매우 중요하다. 현재, 방사성요오드 불응성 갑상선암에 대한 근치적인 약물 치료법이 없고, 표적항암제 치료에도 부작용이 수반되기 때문에 진행성 질환이 있는 환자, 종양 부하가 상당한 환자, 전신항암치료를 하지 않은 경우에 가까운 미래에 상당한 임상 합병증을 초래할 수 있는 경우에는 전신항암치료를 고려해야 한다. 전신항암치료를 시작하기 전에는 국소 치료의 가능성과 유용성에 대해서 고려해야 한다. The National Comprehensive Cancer Network (NCCN), European Society of Medical Oncology (ESMO), 미국갑상선학회 및 유럽갑상선학회의 진료권고안에서는 방사성요오드 치료 불응성 갑상선분화암에서 질병의 경과가 진행성인 경우에만 전신항암치료를 권고하고 있다."]}, "III.4.4.A": {"ids": ["III.4.4.A", "III.4.4.B", "III.4.4.C", "III.4.4.D", "III.4.4.E", "III.4.4.F", "III.4.4.G"], "p": ["소라페닙과 렌바티닙은 3상 무작위 배정 이중맹검 위 약대조 임상연구를 통해서 갑상선암 환자의 무진행생존의 증가를 보여서 1차 치료제로 승인된 약제이다. 소라페닙은 총 417명의 환자가 등록된 DECISION 연구에서 무진행 생존 기간이 10.8 개월로 대조군의 5.8 개월에 비해서 유의한 효과를 나타내었다. 객관적인 종양의 크기 감소는 12.2%에서 부분 관해가 확인되었다. 392명의 환자가 등록된 SELECT 연구에서는 렌바티닙군의 무진행생존 기간이 18.3개월이었고, 대조군에서는 3.6개월에 불과하였다. 렌바티닙은 1.5%에서 완전관해, 63.2%에서 부분관해를 보고하였다. 하지만, 이 두 가지 임상연구에 서는 대조군에 포함된 환자에서 질병의 진행이 확인된 경우에 소라페닙이나 렌바티닙으로 치료를 받았기 때문에 암환자의 생존 기간의 차이를 확인할 수는 없었다. 중국에서 별도로 진행된 3 상 임상연구 (study 308) 에서는 총 199 명의 환자를 무작위배정하였으며, 무진행생존 기간이 렌바티닙군에서 23.9개월, 대조군에서는 3.7개월로 의미있는 차이를 보였다. 이 연구에서도 1.9%의 완전관해, 68%의 부분관해가 확인되었다. 직접적인 비교는 어렵지만, 무진행생존 기간과 객관적 반응률이 SELECT 연구에 비해서 조금 더 나은 양상을 보였다.", "카보잔티닙은 방사성요오드 불응성 갑상선분화암에서 이전에 소라페닙, 렌바티닙 또는 두 가지 약제를 모두 사용했던 환자들을 대상으로 2차 이상 치료에서 그 효과를 확인한 약제이다. COSMIC-311 연구에서는 초기 100 명의 환자에서 객관적 치료 반응률을 비교하였으며 카보잔티닙군에서는 부분관해가 15%였으나 대조군에서는 0%로 확인되었다. 카보잔티닙 치료군에서의 무진행생존 기간 또한 대조군에 비해서 유의하게 길었다. 이 연구를 바탕으로 카보잔티닙은 2차 이상의 항암치료에 사용할 수 있는 항암제가 되었고, 우리나라에서도 사용이 승인되었다.", "최근에는 더 선택적인 분자 표적치료제들이 관련된 유전변이를 가지는 전이성 갑상선분화암의 치료에 상당한 효과를 보인다는 연구결과들이 발표되었다. 최근 NCCN과 ESMO의 진료권고암에 따르면 전이성 갑상선암에서 이러한 분자 표적 치료제의 사용 여부를 결정하기 위해서 유전자 변이 검출을 위한 분자 검사를 권고한다. RET 유전자 융합변이는 갑상선유두암 환자의 5-10%에서, Neutrophic Tropomyosin Receptor Kinase (NTRK1/2/3) 유전자 융합변이는 2.34%에서 검출된다. RET, NTRK 유전자 융합변이는 주로 FISH (fluorescence in situ hybridization), RT-PCR (reverse transcription polymerase chain reaction) 또는 NGS (nextgeneration sequencing) 검사에서 검출된다. NTRK 유전자 융합변이는 ALK 유전자 융합변이와 달리 다양한 유전자와 다양한 절단부위, 그리고 일부는 인트론 부위 에서 절단되어 융합된다. RET 유전자 융합변이의 90% 는 CCDC6::RET 과 NCOA4::RET 이지만 일부에서 다양한 유전자와 융합되기 때문에 암조직에서 적절한 품질 의 충분한 RNA를 추출할 수 있는 경우에는 RET, NTRK 유전자 융합변이 검사는 RNA 기반 NGS (RNA-based NGS) 분석이 가장 적합한 검사방법이다.", "RET 유전자 융합이 확인된 갑상선암에서는 셀퍼카티닙과 프랄세티닙이라는 RET 특이적 억제제가 치료에 사용될 수 있다. 셀퍼카티닙은 LIBRETTO-001이라는 1/2상 임상연구에서 이전에 소라페닙 또는 렌바티닙으로 1 차 치료를 받고 진행한 RET 유전자재배열 양성, 전이성 갑상선유두암 환자 19 명에서 객관적 반응률 79%, 안정 병소를 포함한 질병조절률 100% 의 효과를 보였다. 셀퍼카티닙은 1차 치료에도 효과를 보여서, 미국에서는 1차 치료제로 사용이 가능하지만, 우리나라에서는 2023년 현재 2차 치료 이상, 즉 소라페닙 또는 렌바티닙 사용 후 진행한 경우에 한하여 사용이 허가되어 있다. 셀퍼카티닙은 뇌전이 병소에서도 효과를 보인다고 보고하였다. 프랄세티닙은 ARROW 1/2상 임상연구에서 진행성 혹은 전이성 RET 유전자재배열 양성 갑상선유두암 환자의 치료에 효과를 보였는데, 초기 연구에서는 11 명의 환자 중에서 객관적 반응률이 89%에 달하였다. 최근에 발표된 후속 연구에서도 25명의 환자 중에서 객관적 반응률이 84%로 보고되었지만, 대상 환자수가 적 고 치료 기간이 충분하지 않은 제한점이 있다. 프랄세티닙은 미국에서는 셀퍼카티닙과 동일한 적응증으로 허가를 받았으나, 우리나라에서는 2024년 1월 현재 승인을 받지 못하여 임상연구로만 사용이 가능하다.", "NTRK 유전자재배열은 비교적 드문 유전자 변이로 이를 표적으로 한 특이적 항암제인 라로트렉티닙과 엔 트릭티닙이 갑상선암을 포함한 고형암의 치료에 승인되었다. 라로트렉티닙은 55명의 NTRK 유전자재배열 양성 고형암 환자가 포함된 1/2상 임상연구에 86%의 객관적인 반응률(완전관해 13%, 부분관해 62%)을 보고하여 승인을 받으며 이중에 5명의 갑상선암 환자가 포함되어 있었다. 최근 보고된 1/2상 임상연구 3개를 종합한 연구에서는 22명의 갑상선분화암 환자에서 객관적 반응률 86%를 보였고 24개월의 무진행생존율이 84%였다. 라로트렉티닙은 NTRK 융합 유전자 양성인 모든 고형암을 대상으로 허가를 받은 약제로서, 1차 이상의 치료제로 사용이 가능하다. 갑상선분화암의 경우, 수술이 불가능 하거나, 방사성요오드 치료를 포함한 다른 치료방법에 효과가 없는 전이 병소가 있는 환자가 치료 대상이 될 수 있다. 성인 및 2세 이상의 소아 환자를 대상으로 허가를 받았으며, 뇌전이 병소에도 효과가 있는 것으로 보고되고 있다. 엔트렉티닙은 NTRK 뿐만 아니라 anaplastic lymphoma kinase (ALK), c-ros oncogene 1 (ROS1), janus kinase 2 (JAK2), 그리고 tyrosine kinase non receptor 2 (TNK2) 등 다수의 표적에 작용하는 약제이다. NTRK 유전자재배열 고형암 환자 121명이 포함된 1/2상 임상연구에서 13명의 갑상선암 환자들의 객관적 반응률은 53.8%로 보고하였다. 엔트렉티닙은 NTRK 융합 유전자 양성인 모든 고형암을 대상으로 허가를 받은 약제로서, 1차 치료제로 사용이 가능하다. 갑상선분화암의 경우, 수술적 절제가 불가능한 원발병소나 방사성요오드 치료를 포함한 표준치료 후 진행한 전이 병소가 있는 환자가 치료 대상이 될 수 있다.", "BRAF<sup>V600E<\/sup> 유전자 돌연변이가 동반된 갑상선분화암에서 BRAF 억제제인 다브라페닙과 MEK 억제제인 트라메티닙을 사용한 2상 연구 결과도 보고되었다. 총 27명 의 환자가 다브라페닙과 트라메티닙 병합치료를 받았으 며 객관적 반응률은 29.6%, 무진행생존 기간은 15.1개월 로 보고되었다. 아직 대규모 3상 연구가 진행 중인 상 황이지만, NCCN 진료권고안에서는 BRAF<sup>V600E<\/sup> 유전자돌연변이가 있는 방사성요오드 불응성 갑상선분화암 환자에서 BRAF와 MEK를 각각 억제할 수 있는 다브라페닙과 트라메티닙의 병용 요법을 권고하고 있다. NCCN 진료권고안에서는 암돌연변이의 부하가 높은 경 우(≥10 돌연변이/Mb)에는 면역항암제인 펩브롤리주맙을 권고하고 있으나 아직 3상 임상연구 결과는 발표되지 않았다."]}, "III.4.5.A": {"ids": ["III.4.5.A", "III.4.5.B", "III.4.5.C", "III.4.5.D"], "p": ["중증 신장 장애 또는 간 기능 장애를 제외하고는 승인된 용량으로 항암치료를 시작한다. 그러나 부작용이 발생할 경우에는 항암 치료의 용량을 줄이거나 치료를 일시적으로 중단하여 삶의 질과 질병의 조절 사이에 균형을 유지해야 한다. 고령의 환자에서는 부작용의 발생 가능성이 더 높기 때문에 특별한 주의를 기울여야 한다. 진행성 갑상선암에 대한 항암치료는 임상적 이점이 있는 한 계속되어야 한다. 다른 치료 방법이 있거나 부작용을 견디기 힘들거나 치료가 더 이상 임상적 이점을 제공 하지 않거나 환자가 요청하는 경우에는 중단을 고려해야 한다. 치료 2-3개월 후에 항암치료의 효과를 확인하기 위해서 첫 번째 방사선학적 평가를 수행해야 한다. 표적항암제 치료를 시작한 이후 주기적인 영상의학적 종양 평가와 함께 이상반응에 대한 평가를 지속하여야 한다. 표적항암제 투여를 중단할 경우 대부분에서 종양이 진행하기 때문에 종양 억제 효과가 지속되는 경우 중증 이상반응이 발생하지 않는 한 약제 투여를 장기간 유지하는 것이 필요하다. 경우에 따라 표적항암제의 용량을 감 량하거나 약제 투여를 일시적으로 중단하는 것이 이상반응의 증상을 완화시키고 장기적으로 표적항암제에 대한 순응도를 높이는 데 도움이 될 수 있다.", "표적항암제의 이상반응은 투여 초기 환자의 약제 순응도를 떨어뜨리는데 결정적인 요인이 되므로 치료 시작 초기에는 짧은 간격으로 이상반응 발생 정도를 모니 터링하고 증상에 대한 적절한 관리를 하는 것이 항암제 치료 효과를 향상시키는 데에 도움이 된다. 전신항암치료를 시작하기 전에 환자와 보호자에게 치료제의 복용 방법, 잠재적인 독성과 그 관리에 대한 교육을 제공해야한다. 환자가 부작용을 보고할 수 있도록 교육해야 한다. 치료 초기 임상적 및 생화학적 검사(신체검사, 이상반응 평가, 혈액검사, 소변검사, 신장 및 간기능검사, 갑상선 기능 검사 등), 심전도 검사, 임상 모니터링을 통해서 엄격하게 환자를 추적 관찰해야 한다. 치료 첫 2개월 동안 에는 2-4주, 그 후 첫 6개월까지는 매달, 이후 3개월마다 추적관찰하는 것이 권장된다. 전신항암치료제의 주요 부작용은 Table III.4.5.A에 요약되어 있다.", "일차 치료제로 주로 사용되는 소라페닙과 렌바티닙의 경우 주로 신생혈관생성을 억제하는 기전으로 작용하므 로 다양한 전신 혈관 부작용이 공통적으로 나타날 수 있다. 특히 수족피부반응(hand-foot skin reaction, HFSR), 고혈압, 단백뇨, 설사 등의 흔한 이상반응의 경우 약제 투여 전 선제적인 설명과 상비약 처방 등의 조치가 환자의 복약 순응도를 높이고 중증 이상반응으로의 진행을 예방하는 데에 효과적이다.", "표적항암제 투여 후 드물게 위장관 출혈 또는 누공 발생 등의 중증 이상반응이 발생할 수 있으므로 이에 대한 사전 설명 및 증상 발생 시 즉각적인 응급처치가 필요하다. 수술 또는 방사능 조사 과거력, 출혈이나 누공 발생 위험을 높이는 기저질환 등의 임상적인 요인을 표적항암제 투여 여부 결정이나 약제 선택 과정에서 함께 고려하여야 한다.", "소라페닙의 DECISION 연구에서 치료 기간이 중앙값 10.6개월이었으며 평균 유지 용량은 651 mg이었다. 연구기간 중 207명의 환자 중에서 204명(98.6%)의 환자에서 부작용이 보고되었으나, 대조군에서도 87.6%나 부작용을 보고하였다. 대부분의 부작용은 CTCAE (Common Terminology Criteria for Adverse Events) 1-2단계의 경한 부작용이었으며, 가장 흔한 부작용은 수족피부반응 (76.3%), 설사 (68.6%), 탈모 (67.1%), 피부발진 (50.2%), 피로감 (49.8%), 체중감소 (46.9%), 고혈압 (40.6%), TSH 증가 (33.3%) 등이었다. 대부분의 부작용은 초기 4-8주에 나타났으며, 이후 호전되는 양상을 보였다. CTCAE 3-4단계의 부작용은 소라페닙 투여군의 37.2%에서 확인되었으며, 대조군에서도 26.3% (55/209)나 보고되었다. 소라페닙과 관련된 심각한 부작용으로는 2차암의 발생(4.3%), 호흡곤란 (4.8%), 흉수(2.9%) 등이 있었다. 소라페닙 치료 중에 부작용으로 인해서 약물을 일시 중단한 환자는 66.2%였고, 용량을 감량한 환자도 64.3%에 달하였다. 부작용으로 인해서 치료를 중단한 환자는 18.8%였다.", "렌바티닙의 부작용은 소라페닙과는 다른 양상으로 SELECT 연구에서 렌바티닙 복용군 97.3%, 대조군의 59.5%가 부작용을 보고하였다. CTCAE 3단계 이상의 심한 부작용을 보고한 환자는 렌바티닙군에서 75.9%나 되었으나 대조군은 9.9%에 불과하였다. 렌바티닙군의 7.7%에서 사망이 보고되었으며, 치료와 관련성이 확인된 경우는 2.3%였다. 가장 흔한 부작용은 고혈압(67.8%, 3단계 이상 41.8%), 설사(59.4%), 피로감(59%), 식욕감소 (50.2%), 체중감소(46.4%), 오심(41%) 등이었다. 임상적으로 중요한 부작용으로는 단백뇨(31%, 3단계 이상 10%), 동맥혈전증/색전증(5.4%, 3단계 이상 2.7%), 정맥 혈전증/색전증(5.4%, 3단계 이상 3.8%), 신부전(4.2%, 3단계 이상 1.9%), 간부전(3단계 이상 0.4%), 소화기계 누공 (1.5%, 3단계 이상 0.8%), QT 연장(8%, 3단계 이상 1.5%) 등이 확인되었다. 일시적으로 약을 중단한 경우가 82.4%, 용량을 줄인 경우가 67.8%로 보고되었다. 처음으로 용량을 줄이기까지의 기간은 중앙값으로 3개월이었고 약을 일시적으로 중단하게 되는 흔한 원인은 설사(22.6%), 고혈압(19.9%), 단백뇨(18.8%), 식욕감소(18%)였다. 부작용으로 인해서 약물을 완전히 중단한 경우는 14.2%였다. 중국에서 시행된 3상 연구에서 좀 더 많은 부작용이 보고되었으며, 렌바티닙 투여군의 100%에서 부작용이 보고되었으며, CTCAE 3단계 이상의 부작용이 87.4%나 되 었다. 약을 일시적으로 중단하는 경우는 67% 였고, 용량을 감량하는 경우는 80.6%나 되었다. 특히, 고혈압(81.6%, 3단계 이상 62.1%), 단백뇨(80.6%, 3단계 이상 23.3%), 수족피부반응(58.3%, 3단계 이상 9.7%)으로 SELECT 연구에 비해서 동양인에서 더 많이 발생하는 부작용이었다. 한국인을 대상으로 한 후향적 임상연구에서도 100%의 환자가 부작용을 보고하였으며 고혈압(94.6%)과 단백뇨(80.4%)는 매우 흔히 발견되는 부작용이었다. 렌바티닙의 유지 용량의 중앙값은 10 mg이었으며, 일시적으로 중단하는 경우가 44.6%, 용량을 줄이는 경우는 82.1%, 완전히 중단한 경우는 10.7% 였다. 한국인을 포함하는 동양인에서 고혈압과 단백뇨를 포함하는 심각한부작용의 가능성이 높게 나타났으며, 이러한 결과는 체중에 비해서 상대적으로 많은 용량의 렌바티닙과 관련 되었을 가능성이 있다. 따라서, 렌바티닙을 사용하는 환자에서는 고혈압의 조절과 단백뇨 발생에 대한 모니터링이 매우 중요하다.", "다브라페닙과 트라메티닙 병합요법의 경우 주로 수족 피부반응이나 발열을 호소하나, 3단계 이상은 거의 보고되지 않았다. 이상반응에 대한 국내 보고가 많지 않으나 한 후향적 연구에서 설사와 피로감, 발열이 20% 정도의 환자에서 보고되었다. 따라서 감염으로 인한 발열 과 약제로 인한 발열에 대한 감별에 주의해야 한다."]}, "III.5.1.A": {"ids": ["III.5.1.A", "III.5.1.B", "III.5.1.C", "III.5.1.D", "III.5.1.E", "III.5.1.F", "III.5.1.G", "III.5.1.H", "III.5.1.I"], "p": ["폐는 갑상선암이 가장 흔히 원격 전이되는 장기이다. 폐전이 환자에서 치료방침을 결정하는 주요 기준은 다음과 같다.", "가. 전이 병소의 크기(단순 흉부방사선에서 관찰되는 대결절, CT에서 발견되는 소결절, CT의 해상도 이하의 미세전이)", "나. 방사성요오드 섭취 정도와 이전 치료에 대한 반응", "다. 전이 병소의 진행 여부(안정성)", "폐전이 병소는 다발성인 경우가 많고 크기도 다양하다. 폐 미세전이(pulmonary micrometastasis)는 방사성요오드 치료를 우선적으로 시행한다. 미세전이는 직경 2 mm 미만의 병소로서 일반적으로 해부학적 영상에서는 관찰되지 않으며, 방사성요오드를 섭취하는 경우 방사성요오드 치료로 완전관해될 가능성이 가장 높다. 그러므로 방사성요오드 섭취가 있고 임상적으로 반응이 있는 경우에는 6-12개월 간격으로 반복하여 방사성요오드 치료를 시행한다. 대결절 폐전이 (macronodular pulmonary metastasis)도 방사성요오드 섭취가 있으면 방사성요오드 치료를 시행할 수 있다. 그러나 대결절 폐전이는 폐 미세전이에 비하여 완전관해가 흔하지 않으며 치료 후 생존율도 상대적으로 불량하다.", "폐의 단일 혹은 소수의 전이 병소의 경우 수술적 제거를 고려할 수 있다. 환자의 전신 상태가 좋고, 제한된 수의 폐전이 병소는 수술적으로 큰 합병증 없이 제거할 수있다. 한 후향적 연구에서는 방사성요오드 불응성 폐 전이를 수술적으로 잘 제거하는 경우에 예후에 좋은 영향을 미칠 수 있음을 보고하였다. 병소의 크기와 위치 로 인해서 특정 증상을 유발하는 단일 병소에 대해서는고주파절제술도 시행할 수 있다. 고주파절제술은 수술이 불가능하고 광범위한 절제가 필요하지 않고 크기가 2-3 cm 미만의 병소에서 고려할 수 있다.", "흉막 혹은 심막 삼출액의 배액 및 유착술 등도 증상과 진행 속도에 따라 고려한다.", "폐전이 병소에 대해서 시행한 조직 검사 및 유전자변이 검사는 원발성 폐암 및 타 암종의 전이를 감별하고, 갑상선분화암의 전신항암치료제 선택에 도움이 될 수있다."]}, "III.5.2.A": {"ids": ["III.5.2.A", "III.5.2.B", "III.5.2.C", "III.5.2.D", "III.5.2.E", "III.5.2.F", "III.5.2.G", "III.5.2.H"], "p": ["갑상선암 환자는 비교적 생존 기간이 길기 때문에 뼈전이가 있는 경우에는 병적 골절, 척수압박, 고식적 외부방사선 요법 및 수술, 고칼슘혈증과 같은 뼈 관련 사건 발생의 위험이 증가하며 방사성요오드 치료 불응성 갑상선분화암 환자에 있어 특히 임상적인 문제를 자주 유 발한다. 뼈 관련 사건을 경험하는 환자에서는 예후가 좋지 않은 것으로 알려져 있다.", "수술로 완전 제거가 가능한 뼈전이 병소는 수술적 완전 절제를 우선적으로 고려한다.", "방사성요오드 섭취를 보이는 뼈전이 병소는 방사성요오드 치료를 일차치료로 고려한다. 뼈전이 환자에서 방사성요오드 치료 시 완치가 되는 경우는 드물지만, 일시적으로 병의 진행을 안정화시킴으로써 생존율을 증가시키는 치료 이득을 얻을 수 있음이 보고되었다.", "뼈전이 병소를 대상으로 방사성요오드 치료를 시행할 때, 구조적 영상에서 보이는 뼈전이 병소라면 직접적인 치료방법(수술, 외부방사선조사 치료나 다른 국소적인 요법)이나 뼈를 표적으로 하는 전신치료 요법의 필요성에 대해서 각각의 치료에서 기대되는 효과와 위해를 비교하여 평가하여야 한다. 방사성요오드 치료를 위해 TSH 자극을 하거나 방사성요오드 치료 효과에 의한 종양 반응이 일시적으로 뼈전이 병소에 증상을 일으키거나 골절, 신경학적 합병증 등을 유발할 수 있다. 이런 가능성이 예상될 때 방사성요오드 치료 전에 스테로이드제 투여를 병행한 외부 방사선 치료를 먼저 고려한다.", "방사성요오드, 외부 방사선조사 치료, 동맥색전술, 고주파절제술, 주기적인 뼈흡수억제제 치료(비스포스포네 이트 또는 데노수맙), 척추성형술 등 여러 방법을 단독 또는 전신치료와 병행할 수 있으며 이는 암에 의한 뼈 통증을 경감시키는데 효과적이고 삶의 질을 향상시키고, 뼈 관련 사건을 줄이는데 도움이 될 수 있다.", "하지만, 증상이 없고 인접 부위에 중요한 구조물이 없는 안정적인 방사성요오드 불응성 뼈전이 병소에 대해서는 국소 치료 또는 전신항암치료의 이득에 대한 근거가 없다. 국소 치료는 수술적 완화, 척추성형술, 외부 방사선 치료, 비수술적절제술, 색전술 등이 있으며, 출혈 위험을 줄이기 위해서 수술적 절제 이전에 색전술을 고려해야 한다. 선택된 사례에서 수술적 절제 또는 외부 방사선 치료의 대안으로 색전술 및 기타 중재 치료를 고려할 수 있다. 특히, 체중이 실리는 부위에 골절의 위험이 있거나 척추 골절이 동반되거나 동반되지 않는 척 수 압박의 위험이 있는 경우에는 수술적인 치료와 국소 치료를 적극적으로 고려한다. 수술 기술과 기법이 향상됨에 따라서 뼈전이, 특히 척추 병소를 안전하게 수술적으로 제거할 수도 있고 증상을 유발하는 단일 뼈 전이는 완전 절제가 가능하다면 생존율을 증가시킨다 (특히, 45세 미만인 경우). 증상을 유발하지 않아도 완전 절제가 가능하다면, 제한된 전이 병소는 수술을 포함하는 국소 치료가 도움이 된다는 보고도 있다. 하지만, 전신 뼈전이가 있는 경우에는 국소치료만으로는 효 과적으로 조절하기 힘든데, 다른 전이 병소에 비해 전신 요법에 대한 반응률도 떨어진다. 따라서 증상이 있거나 곧 합병증을 일으킬 것이 예측되는 경우에는 국소 치료를 전신 치료보다 먼저 시행하는 것이 좋다. 증상이 없거나 안정적인 뼈전이 병소를 조절하기 위해 전신 치료를 시작하는 것은 적절하지 않다.", "비스포스포네이트와 데노수맙은 유방암, 전립선암, 폐암과 관련된 뼈 관련 사건과 통증을 줄이는 것으로 알려져 있으며, 여러 개의 뼈전이가 있는 갑상선암 환자는 뼈흡수억제제를 고려해야 한다. 치료는 4주마다(비스포스포네이트 및 데노수맙) 또는 3개월마다(비스포스포네 이트) 투여할 수 있다. 최적의 치료 기간은 확립되어 있지 않지만, 다른 종양(유방암, 전립선암, 폐암)에서 최소 2년의 치료가 권장된다. 치료 중에는 적절한 칼슘과 비타민D 수치를 유지해야 한다. 이 약물과 관련된 가장 심각한 부작용은 턱뼈괴사이며, 혈관 신생을 막는 표적 치료제 치료를 받는 환자에서는 위험이 증가한다. 비스포스포네이트 치료 시에는 신기능과 혈중 칼슘 농도를, 데노수맙의 경우에는 혈중 칼슘 농도를 매 투약 전 정상범위인지 확인해야 하고, 장기간의 약제 투여가 필요한 경우 약제에 의한 턱뼈괴사 위험에 주의하여야 한다."]}, "III.5.3.A": {"ids": ["III.5.3.A", "III.5.3.B"], "p": ["주로 고령의 환자에서 나타나는 뇌 전이는 발견 당시부터 진행암인 경우가 흔하며 예후가 나쁘다. 치료는 수술적 절제와 외부 방사선조사 치료가 주를 이루 며, 방사성요오드 치료의 효용성을 입증하는 자료는 거의 없다. 정위 방사선조사 치료는 신경계 합병증을 최 소화할 수 있다는 측면에서 전뇌 방사선조사 치료보다선호된다."]}, "IV.1.A": {"ids": ["IV.1.A", "IV.1.B", "IV.1.C"], "p": ["임신부의 갑상선암 유병률은 알려진 바가 없으나 갑상선암이 여성에서 흔하고 특히 가임기의 젊은 여성에 서도 많이 발생하는 것을 고려하면, 임신 중에도 갑상선암이 새로 진단될 수 있다. 이러한 경우에 수술을 출산 이후로 미루는 것이 가능한지에 대해 소규모의 후향적 연구들이 발표된 바가 있다. Moosa 등 은 61명의 임신 중 갑상선분화암이 진단된 여성을 장기간 추적 관찰하 였고 이들 중 77%가 출산 후 수술을 하였고 20%가 임신 2분기에 수술을 받았으며, 출산 후 수술을 받은 여성들 은 임신 2분기에 수술을 받은 여성에 비해 장기 예후에서 차이가 없었다. Uruno 등 의 연구에서 45명의 임신 중 갑상선분화암이 진단된 여성에서 24명은 임신 기간 중에 수술을 하고 21명은 출산 후에 수술을 하였으며, 임신 중 수술은 79%에서 2분기에 시행하였으며 수술로 인한 합병증은 없었다고 보고하였으며, 예후에서 양 군 간 차이는 없었다. Oh 등 은 19명의 미세갑상선유두암 을 진단받은 임신부 중 7명에 대해 임신 분기별로 갑상 선초음파를 시행하였고 임신 분기별 결절의 유의한 크기 증가 소견은 없었고 새로 발견된 병소나 림프절전이는 없었다고 보고하였으며, 이들 중 84%는 출산 후 수술을 시행하였다. 이러한 결과들로 볼 때 임신 중 진단된 갑상선분화암에 대해 수술을 출산 후로 미루는 것이 예후에 영향을 주지 않을 것으로 보이며, 임신 2분기의 수술은 비교적 안전한 것으로 보인다.", "갑상선분화암의 진행의 정의는 아직까지 불명확한데, 미국갑상선학회에서 제시하고 있는 종양 부피의 50% 이상 증가 혹은 2개 이상의 종양 직경의 20% 이상 증가(최 소 2 mm 이상)하는 경우 혹은 경부 림프절전이의 발생 등이 널리 사용되고 있다. 그러나 임신 중 갑상선수질암 이나 역형성암의 예후에 대한 연구는 시행된 바가 없고, 이 암종들의 불량한 예후를 고려하면 치료를 늦추는 것이 예후를 악화시킬 가능성이 높기 때문에 모든 임상 상황을 고려한 이후 수술을 적극 고려해야 한다. 임신 기간 중 수술을 하는 경우 임신부의 갑상선기능저하증 및 부갑상선기능저하증의 발생 위험성을 고려하고 적절히 치 료해야 한다."]}, "IV.2.A": {"ids": ["IV.2.A", "IV.2.B"], "p": ["무증상 갑상선기능항진증으로 인한 임신부 또는 신생 아 합병증에 대한 메타분석에서 무증상 갑상선기능항진 증은 임신성 고혈압이나 전자간증을 높이지 않았고, 태아의 체중에 영향이 없었고, 조산을 유발하지 않았다. 이러한 연구 결과에 근거하여 임신 전 유지하였던 TSH 억제를 임신 기간 동안 유지하는 것이 추가적인 위험을 유발하지 않을 것으로 기대된다.", "TSH 억제의 적절한 수준은 임신 전 갑상선암의 재발위험에 따라 다르며, 갑상선분화암에 대한 여러 학회들 의 진료권고안에 따르면 구조적으로 확인된 갑상선암 병소가 있는(지속적위험분류에서 구조적 불완전반응을 보인 경우) 임신부에서 혈청 TSH는 0.1 mIU/L 미만으로 지속적으로 유지되어야 한다. 임신 기간 중에는 16-20주까지 갑상선호르몬의 요구량이 점진적으로 증가하고 이후 평형 상태에 도달하는데, 갑상선전절제술을 한 여성에서 갑상선호르몬(levothyroxine, LT4) 용량은 임신 주수에 따라 증량해야 하며, 변경된 LT4 용량의 적정성은 4주 뒤에 TSH 검사를 통해 확인이 필요하다."]}, "IV.3.A": {"ids": ["IV.3.A", "IV.3.B"], "p": ["갑상선암으로 진단받은 평균 4.3년 이후 임신한 36명 의 여성을 대상으로 한 연구 (1997-2006 년) 에서, 임신 전 경부 초음파 소견이 음성이고 혈청 갑상선글로불린이 1 ng/mL 미만인 여성에서 산후 초기에 재발의 증거는 발견되지 않았으나 알려진 전이 병소가 있는 임신부는 전이 림프절이 임신 기간 중 커지거나 갑상선글로불린 값 이 20% 이상 상승하는 경우가 확인되었다. 동일 기관에서 발표된 최근 결과에 따르면, 235명의 갑상선분화암 치료 후 임신을 한 여성 중, 11명(5%)의 여성이 출산 후 재발 혹은 질병의 진행이 확인되었는데, 임신 전 갑상선암 치료 반응이 완전반응, 불명확반응 혹은 생화학적 불완전반응인 경우에는 출산 때까지 구조적으로 확인되는 재발은 나타나지 않았고 임신 전 구조적 불완전반응인경우에 주로 진행이 확인되었다(29%, 38명 중 11명).", "또 다른 연구에서도 유사한 결과가 보고되었는데, 혈청 갑상선글로불린 ＜0.9 ng/mL 및 갑상선 초음파에서재발의 증거가 없는 경우 질병의 증거가 없다고 정의하고 평균 4.8년 동안 갑상선유두암에 대해 치료를 받은 후 출산한 여성 63명을 추적하였을 때, 임신 전 질병이 없는 것으로 분류된 50명의 여성 중 누구도 질병의 진행이 없었으나 임신 전 갑상선암이 남아 있었던 여성 13명 중 6명(46%)이 임신 중 갑상선암의 진행이 확인되었다.", "이러한 결과로 볼 때 임신 전에 갑상선암이 잔존하는 것이 확인된 경우(구조적 불완전반응)나 불명확반응 및 생화학적 불완전반응을 보인 경우에는 임신 기간 동안 에도 지속적인 갑상선 초음파검사 및 혈청 갑상선글로불린 추적 관찰이 필요할 것으로 보인다."]}, "IV.4.A": {"ids": ["IV.4.A"], "p": ["임신 중에는 혈액량의 증가로 인하여 혈청 총 칼슘은 감소할 수 있으나 이온화 칼슘과 알부민 조정 칼슘은 정상적으로 유지된다. 따라서 임신 중에는 혈청 총 칼슘보 다는 이온화 칼슘이나 알부민 조정 칼슘 수치를 모니터 링하는 것이 필요하다.", "수술 후 부갑상선기능저하증이 있는 임신부에서 임신 기간 중 혈청 칼슘을 정상의 하한선에서 중간 범위로 맞 추기 위해서는 3-4주 간격으로 주기적인 모니터링이 필요하다. 혈청 인, 마그네슘, 25- 하이드록시비타민 D 는 정 상범위를 유지하도록 한다. 칼슘이나 비타민D의 용량을 변경하는 경우 1-2주 뒤에 칼슘 수치의 확인이 권고된다. 임신부의 저칼슘혈증은 태아의 부갑상선을 자극할 수 있고, 이로 인하여 태아 골격의 무기질화를 방해할 수 있다. 반대로 고칼슘혈증은 태아의 부갑상선을 억제하여 신생아의 저칼슘혈증을 유발할 수 있다. 칼시 트리올을 포함한 활성형 비타민D의 경우 인간 태아에서 기형이 보고된 적은 없으며 치료의 득실을 고려했을 때 치료 시 얻을 수 있는 이점이 크므로 경구 칼슘과 비타민 D 만으로 조절이 되지 않는 경우에는 활성화 비타민 D 의 사용을 고려한다. 부갑상선호르몬제는 임신 중의영향에 대해 아직 증거가 부족하고 티아지드(thiazide) 이뇨제의 경우 임신 위험범주 B에 해당하여 임신 중 사용은 권고되지 않는다."]}, "V.1.1.A": {"ids": ["V.1.1.A"], "p": ["소아에서 진단 시 종양의 주변조직으로의 침범이나 경부 림프절전이가 확인된 경우에는 갑상선분화암이 측 경부뿐 아니라 종격동 림프절까지 전이되었을 가능성이있으므로 수술 전에 전산화단층촬영(computed tomography) 또는 자기공명영상(magnetic resonance image) 검사를 시행하여 수술계획을 세우는 것이 필요하다."]}, "V.2.1.A": {"ids": ["V.2.1.A"], "p": ["가족성 비수질 갑상선암의 5% 정도가 유전종양증후 군과 연관된 것으로 보고되는데, 대표적으로 DICER1 (Dicer 1, Ribonuclease III) 변이에 의한 DICER1 증후군, PTEN (Phosphatase And Tensin Homolog) 변이에 의한 PTEN 과오종 종양증후군/Cowden 증후군, PRKAR1A (Protein Kinase CAMP-Dependent Type I Regulatory Subunit Alpha) 또는 CNC2 (Carney Complex Type 2) 변이에 의한 카니복합체(Carney complex), APC (APC Regulator Of WNT Signaling Pathway) 변이에 의한 APC-연관 용종증, WRN (WRN RecQ Like Helicase) 변이에 의한 Werner 증후군이 있다(Table V.2.1.A). 벡위드-비데만(Beckwith – Wiedemann) 증후군, 가족성 부신결절종 증후군, Li – Fraumeni 증후군, 매 큔-올브라이트(McCune – Albright) 증후군, 푀츠-제거스 (Peutz – Jeghers) 증후군에서도 갑상선분화암 증례가 보고되어 있다.", "유전종양증후군이 있으면 다결절 갑상선종(multinodular goiter), 유두암, 여포선종, 여포암이 발생할 수 있으며, 갑상선 이외 장기에도 종양이 발생할 수 있다. 따라서, 갑상선 종양이 진단된 소아에서 종양 가족력과 과거 질병력을 확인하고, 동반된 임상증상과 피부소견 을 살피고, 키, 체중 및 머리둘레를 포함한 신체검진이 필요하다. 만약, 대두증 (macrocephaly), 혈관종, 지방종, 모종, 유두종, 생식기 색소침착 등의 피부소견이 있으면 PTEN 과오종 종양증후군/Cowden 증후군, 흑색점 피부소견이 있으면 카니복합체나 APC-연관 용종증 가능성을 고려한다. 대두증은 DICER1 증후군에서도 가능하다 (Table V.2.1.A).", "소아에서 여포암의 빈도는 전체 소아 갑상선암의 10% 미만으로 보고되는데, 국내 소아 여포암의 종양유전자 변이 분석결과 DICER1 변이가 가장 흔하고, PTEN, APC 변이 빈도 순으로 확인되었다. 여포암으로 진단된 소아가 10 세 미만이거나, 다발성 갑상선결절로 수술 받은 가족력이 있거나, 소아기 갑상선 이외 장기에 배아종양(embryonal tumor) 병력이 있으면 DICER1 증후군 가능성을 고려한다. 유전자 확진을 통해 유전종양증후 군으로 진단되면, 해당 증후군에서 권고되는 연령별 종 양선별검사를 정기적으로 추적한다."]}, "V.2.2.A": {"ids": ["V.2.2.A", "V.2.2.B"], "p": ["소아기 혈액암이나 고형암으로 전신 또는 두경부 방사선 치료를 받은 소아기 종양생존자에서 이차암으로 발생한 갑상선분화암은 산발성(sporadic)으로 발생한 원발암에 비해 재발(이차암 15.8% vs. 원발암 10.5%) 및 수술 후 합병증(이차암 36.8% vs. 원발암 22.2%)의 빈도가 높은 경향을 보였으나 통계적으로 유의하지 않았고, 10 년 생존율 97%로서 추적기간 동안 이차암과 원발암의 생존율 차이는 없었다. 다만, 이차암으로 발생한 갑상선분화암은 양측성 다발성(multifocal)인 경우가 60%로 보고되어 종양 크기가 작아도 갑상선전절제술을 시행한다.", "소아기 종양생존자는 과거 방사선 및 항암치료로 인해 장기적인 합병증 발생 위험이 있다. 소아기 anthracycline 항암제 또는 흉부 방사선 치료로 인해 심장기능이 저하될 수 있는데, 3162명의 생존자를 40세까지 추적하였을 때 심장질환의 빈도가 11%로 보고되었다. 소아기 Bleomycin 항암제 또는 흉부방사선치료로 인해 폐기능 이 저하될 수 있는데 45 세까지 추적 시 29.6% 빈도로 보 고되었고 폐섬유화 발생 위험이 증가하였다. 알킬화제 항암제 또는 복부/골반의 방사선치료는 난소/고환 부전 을 초래한다. 또한, 소아기 종양생존자는 과거 방사선 또는 항암치료로 인해 이차암 발생 위험이 대조군에 비해 높다. 소아청소년/젊은 성인 갑상선분화암에서 방사성요오드 치료는 이차
