암 발생 위험(고형종양 1.23 배, 혈액종양 1.51배) 증가와 관련이 있고, 20년 추적 후에도 발생할 수 있다. 즉, 소아기 종양생존자는 과거종 양치료로 인해 이미 장기합병증 발생 위험을 가지고 있고, 방사성요오드 치료가 합병증 위험을 증가시킬 가능성을 배제할 수 없다. 따라서, 방사성요오드 치료 여부를신중하게 결정하고 향후 발생 가능한 합병증에 대해서도 지속적인 추적이 필요하다."]}, "V.3.1.A": {"ids": ["V.3.1.A", "V.3.1.B", "V.3.1.C", "V.3.1.D", "V.3.1.E", "V.3.1.F"], "p": ["대부분의 소아 갑상선암 환자는 성인과 달리 진단 당시 경부 림프절전이를 동반하거나 국소진행성암으로 발견되는 경우가 많다. 소아 갑상선암 환자에서 갑상선 절제 범위의 결정은 수술 후 재발 및 잔존암의 가능성을 낮추는 것뿐 아니라, 수술에 따르는 합병증 발생을 최소화하는 것도 중요하다. 한 연구에서는 갑상선전절제 술이 관해율(완치율)에 중요한 요소임을 보고한 반면 몇몇 연구에서는 갑상선전절제술과 아전절제술이 재발률에 차이가 없음을 보고하였다. 특히 림프절전이가 없으며 육안적 갑상선외부침범이 없는 저위험군 갑상선암에서는 갑상선엽절제술만 시행하여도 전절제술에 비해 재발률이 높지 않음이 보고되었다. 따라서 소아 갑상선암의 좋은 예후를 고려해 볼 때, 갑상선 수술 후 합병증을 감소시키고 삶의 질을 유지하기 위해서 저위험군 갑상선암에서는 엽절제술을 포함한 덜 광범위한 수술을 고려할 수 있다. 하지만, 아직까지는 이에 대한 연구가 충분하지 않은 상태로 추가적인 연구가 필요하다.", "수술 전 신체 진찰 및 초음파를 포함한 임상 검사에 따라 림프절절제술의 시행 여부를 결정하는 것을 권고 한다. 예방적 중앙경부 림프절절제술은 갑상선 미세림프절전이를 제거하여 림프절 재발을 줄이고 생존율을 높이는 것을 목표로 한다. 그러나 예방적 중앙경부 림프절절제술의 효과에 대한 연구결과들은 일관되지 않았다. 예방적 중앙경부 림프절절제술을 포함한 광범위한 수술이 진행된 소아 갑상선암에서 재발을 줄였다고 하 였지만 Olmsted 등 은 림프절 청소술의 시행과 재발률은 뚜렷한 관계가 없음을 보고하였다. 반면 중앙경부 림프절절제술은 부갑상선의 혈류를 감소시키고, 되돌이후두신경 손상 등의 합병증 위험을 높일 수 있다. 소아에서는 중앙경부 림프절절제술 후 영구적 부갑상선기능저하증의 발생 비율이 4-10%로 성인에 비해 높게 보고되 므로, 재발의 위험인자를 고려하여 선택적으로 예방적 중앙경부 림프절절제술의 시행을 고려한다.", "측경부 림프절전이 의심 소견이 초음파에서 확인되면 세침흡인검사 또는 세침흡인세척액-갑상선글로불린 검사를 시행하여 림프절전이 여부를 확인 후, 측경부 림프절절제술 시행 여부를 결정한다. 특히 소아 갑상선암은 성인에 비해 진단 시 림프절전이의 동반 비율이 높다는 점을 고려해야 한다. 소아 갑상선암에서 측경부 림프절전이의 예측인자로는 종양 크기, 다발성, 갑상선외부침범, 미만성경화성 아형 및 중앙경부 림프절전이 개수 등이 알려져 있는데, 대부분의 예측인자는 수술 후 병리검 사를 통해서만 알 수 있는 경우가 많다. 수술 중 동결절편 검사의 시행이 이러한 예측인자를 확인하는데 도움이 될 수 있어, 선택적으로 동결절편 검사의 시행을 고려할 수 있다.", "성인과 마찬가지로 소아에서도 갑상선 수술 후 합병증은 삶의 질을 악화시킨다. 수술 후 주요 합병증으로는 부갑상선 기능저하증, 되돌이후두신경 손상, 출혈 및 흉 관 손상이 있다. 특히 성인보다 소아에서는 부갑상선의 확인이 어려울 수 있어 수술 후 부갑상선 기능저하증의 발생 위험이 높다. 많은 수술 경험을 가진 숙련된 전문가 에 의한 수술은 수술 후 합병증을 감소시킬 수 있다."]}, "V.4.1.A": {"ids": ["V.4.1.A", "V.4.1.B", "V.4.1.C", "V.4.1.D"], "p": ["소아 갑상선분화암은 사망률이 낮고, AJCC TNM 분류에서 연령 55세 이하는 원격전이가 있어도 2기이므로 예후를 결정하는데 한계가 있다. 하지만, AJCC TNM 분류 체계가 질병 범위(extent)를 기술하고 평가와 치료 계획을 세우는데 유용하므로 2015년 미국갑상선학회에는 소아도 수술 후 종양의 TNM 분류를 적용하여 소아위험수준을 3단계로 분류하였다. 소아위험수준 분류는 질병이 지속될 위험을 가진 환자를 선별하고, 수술 후 병기설 정(postoperative staging)이 필요한 환자를 결정하는데 도움이 된다.", "저위험군은 갑상선외부침범이 없고 병소가 갑상선에 국한되어 있는 경우로 림프절전이는 N0/Nx 또는 예방적 중앙경부림프절 절제술 후 발견된 미세전이(≤0.2 cm)가 있는 N1a인 경우이다(microscopic metastasis to a small number of central neck lymph nodes). 중간위험군은 림프절전이가 광범위한(extensive) N1a 또는 미세전이가 있는 N1b인 경우로, 중앙경부(VI) 림프절전이가 있거나 측경부(I, II, III, IV, V) 또는 후경부와 상부 종격동 (VII) 림프절전이가 있는 경우이다. 고위험군은 진행된 원발암(T4)이거나 림프절전이가 광범위한 N1b인 경우로 원격전이가 동반될 수 있다. 소아 갑상선분화암에서 전이림프절 최대 직경, 전이림프절 개수, 전체 림프절 개수 대비 전이림프절 개수 비율이 재발위험도에 미치는 영향을 분석한 연구들은 제한적이었다. 국내 연구에서 전이림프절 최대 직경 2.5 cm 이상이면서 측경부 전이림프절 개수 비율이 0.3 이상이면 유의하게 재발률이 높았고, 국외 연구에서 경부 전이림프절 개수가 5개 초과되는 경우 재발 위험이 증가하였다 는 보고가 있으나 위험군 분류에 전이림프절 최대 직경 또는 개수를 기준으로 포함하기에는 아직 근거가 부족하였다."]}, "V.4.2.A": {"ids": ["V.4.2.A", "V.4.2.B", "V.4.2.C", "V.4.2.D"], "p": ["중간위험군 및 고위험군에서 갑상선외부침범이나 주변 경부림프절전이는 종양이 잔존하거나 원격전이를 동 반할 위험이 높다. 따라서 수술 후 병기설정을 통해 추가 치료 여부를 결정하는 것이 필요하다. 수술 후 12주 이내에 병기설정을 시행하는데, 중간위험군 및 고위험군에서는 thyroid stimulating hormone (TSH)-자극 갑상선글 로불린검사와 방사성요오드 스캔을 시행하여 질병이 잔 존하는지 확인한다.", "수술 후 방사성요오드 스캔에서 요오드섭취가 있는 원격전이가 확인되거나, 경부 병소 섭취가 확인되었는 데 수술적 절제가 어려운 경우에는 방사성요오드 치료를 고려한다(Fig. V.4.2.A). 반면, 수술 후 방사성요오드 스캔에서 요오드 섭취가 없거나 갑상선 부위만 미미한 섭취를 보이는 경우에는 TSH-자극 갑상선글로불린 수치에 따라 개별화한다. 미국갑상선학회에서는 TSH-자극 갑상선글로불린 수치가 2 ng/mL 미만이면 방사성요오드 치료를 시행하지 않고, 2-10 ng/mL이면 잔여갑상선 섭취가 확실한 경우 방사성요오드 치료를 선택적으로 시행하고, 10 ng/mL 초과이면 방사성요오드 치료를 시행하는 것을 권고하였다.", "성인과 동일한 수치 기준을 소아에게 적용하는 것이 타당한지 여부는 추가 검증이 필요하다. 17명의 소아 연구에서 수술 후 TSH-자극 갑상선글로불린 수치가 31.5 ng/mL 미만이면 100% 민감도와 특이도로 무질병 상태를 예측하였는데, Karapanou 등 의 103명 소아 연구에서는 TSH-자극 갑상선글로불린 수치가 14 ng/mL 초 과일 때 94.7% 민감도와 62.5% 특이도로 질병지속상태 를 예측하였다.", "미국갑상선학회 권고안 에서 제안한 소아위험수준 3 단계(저, 중간, 고위험군) 분류는 무질병 또는 질병지속 의 예후를 예측하는데 유용한 것으로 확인되었다. 소아위험수준 분류는 미국갑상선학회 성인갑상선분화 암 권고안에서 제안한 초기치료에 대한 반응을 분류한 동적위험분류(dynamic risk stratification, DRS)와도 유의한 상관성을 보이고, 소아위험수준분류와 초기 DRS 분류 모두 무질병 생존 또는 질병지속을 예측하는 데 유용하였다. 통상적으로 수술 후 초기위험군(소아위험수준 3단계) 분류에 따른 초기 치료를 마치면, 초기 치료 종결 직후(동적위험분류; DRS)와 이후 추적 관찰 중 지속적으로 치료 반응과 질병 상태를 재평가한다(지속적위험분류; ongoing risk stratification, ORS). 본 권고안에서는 동적위험분류(DRS)와 지속적위험분류(ORS)를 지속적위험분류로 통일하였고, 초기위험군과 지속적위험분류를 종합적으로 고려하여 이후 치료 및 추적 방법을 정하도록 하였다.", "수술 후 소아위험수준 분류가 어디에 해당하든 관계없이 모든 환자에서 TSH 억제치료가 필요하다. 다만, 미국갑상선학회에서는 소아위험수준에 따라 TSH 억제 치료의 목표 TSH 수치를 다르게 제안하여 저위험군에서는 0.5-1.0 mIU/L, 중간위험군에서는 0.1-0.5 mIU/L, 고위험군에서는 0.1 mIU/L 미만으로 권고하였다(Fig. V.4.2.A). 갑상선글로불린항체가 음성이면서 TSH-자극 갑상선글로불린 수치가 검출되지 않으면 무질병 상 태임을 시사하므로 향후에는 TSH 억제치료 목표와 추적 관찰 간격을 완화할 수 있다.", "소아 갑상선분화암이 잔존하거나 재발하는 부위는 경부림프절이 가장 흔하므로, 추적 관찰 시 경부 초음파와 갑상선글로불린 수치를 함께 시행하는 것은 유용하다 (Fig. V.4.2.A). 경부 초음파는 모든 소아에서 수술 후 6개월째 시행을 고려하고, 중간위험군 또는 고위험군은 이후 6-12개월 간격으로, 저위험군은 1년 간격으로 추적을 고려한다. 이전 치료 후 스캔을 통해 요오드 섭취 전이병소가 확인된 소아는 진단스캔을 이용한 후속 병기 결정에서 도움을 받을 가능성이 가장 높다. 마지막 방사성요오드 치료 후 반응을 평가하기 위해 6-12개월 충분한 시간이 경과한 후 진단스캔을 실시하는 것이 바람직하다.", "질병이 잔존하거나 재발하는 경우에는 TSH 억제치 료를 지속하는데, TSH 억제치료 동안 갑상선중독 증상이 나타나지 않도록 주의를 요하며 유리 T<sub>4<\/sub> 농도는 정상 범위를 유지한다. 소아는 키와 체중이 적절하게 증가하고 있는지 확인이 필요하며, 성장기에 성인에 비해 LT4 요구량이 증가할 수 있으므로 3-6개월 간격으로 추적하여 LT4 용량을 조절한다.", "Dekker 등 의 연구에 의하면 소아 갑상선분화암 생존자를 최소 5년 이상 간격을 두고 골밀도 검사를 추적한 연구에서 46명 중 6명(13%)에서 낮은 골밀도를 보였다. 성장기에는 칼슘이나 비타민D 요구량이 증가할 수 있으므로 혈중 칼슘과 비타민D 농도를 추적하여 정상범 위를 유지하도록 한다. 특히, 부갑상선기능저하증이 지속되는 소아청소년에서 성장기에 칼슘이나 비타민D 요구량이 증가할 수 있으므로 3-6개월 간격으로 추적하여 용량을 조절한다."]}, "V.5.A": {"ids": ["V.5.A", "V.5.B", "V.5.C", "V.5.D"], "p": ["방사성요오드는 성인과 소아 갑상선분화암 환자 모두 에게 오랫동안 안전하게 사용되어 왔으며 임상적으로 매우 유용한 치료법이다. 소아 갑상선분화암 환자들은 어린 나이에 이미 암이 발생하였으므로 이온화 방사선 등 발암 기전에 대해 유전적 취약성(genetic susceptibility) 이 높을 가능성이 있다. 또한 소아에서는 전이 병소가 지속되어도 대부분 장기 생존 예후가 양호하기 때문에 기대수명이 긴 소아 환자에서는 치료의 잠재적 부작용을 신중하게 고려하여야 한다. 따라서 소아 환자의 생물학적 특성을 충분히 고려하여 방사성요오드 치료의 위험-이득 평가를 기반으로 다학제적으로 치료결정을 하는 것이 중요하다.", "소아를 대상으로 하는 방사성요오드 치료는 치료 적응증과 목표(잔여갑상선 제거, 보조적 치료, 지속 또는 재발로 알려진 병소의 치료) 설정에 논란의 여지가 있다. 소아 갑상선분화암 환자는 잔여갑상선 제거보다는 남아 있는 병소를 치료하는 목적으로 방사성요오드 치료를 시행하는 경우가 많다. 특히 잔여갑상선 제거와 보조치료를 구별하는 것은 비교적 최근에 도입된 개념 이므로, 국외 진료권고안에서도 소아 환자들을 대상으로 방사성요오드 치료의 목표에 관하여 근거에 기반한 권고안을 제시하기 어려웠음을 밝히고 있다.", "소아 갑상선분화암 환자의 방사성요오드 치료의 이득과 위험을 평가하는 연구는 그 대상 환자수가 매우 적기 때문에 수행하기 어렵고 문헌 수가 적다는 점을 충분히 감안하여야 한다. 방사성요오드 치료는 수술이 불가능한 국소 및 구역(locoregional) 병소나 원격전이암이 요오드 섭취를 잘 하는 경우, 또는 원발종양이 크거나(직경 ＞4 cm) 주변 림프절을 광범위하게 침범한 경우 임상적이득을 얻을 수 있다. 남아 있는 병소를 제거하기 위해 방사성요오드 치료를 시행한 경우 재발이 감소하 였으나, 무질병생존(disease-free survival)에 대해서는 상반된 결과를 보고하였다. 방사성요오드 섭취가 있는 미세 폐전이암(micrometastasis)이나 종양부담(tumor burden)이 적은 대결절 폐전이암은 방사성요오드 치료 후 상당수 완치가 보고되었다. 하지만 폐전이암의 범위가 넓고 종양부담이 큰 경우에는 반복적인 치료에도 불구하고 병소가 지속될 수 있다. 따라서 폐전이가 지속되 고 방사성요오드 섭취가 있으면 치료의 위험-이득 평가를 기반으로 반복 치료 여부를 결정한다. 그러나 경부 림프절전이나 원격전이가 없는 소아 환자에게 방사성요오드 치료가 생존을 증가시키거나 재발을 감소시키는 지 여부는 확실치 않았다.", "방사성요오드의 투여용량을 결정하는 방법은 소아와 성인 모두 동일하다. 고정용량을 투여하거나, 최대허용용량을 계산하거나, 종양의 선량을 평가하는 방법을 사용할 수 있다. 이론적으로 부작용을 최소화하면서 병소를 충분히 파괴할 수 있는 흡수선량을 전달할 수 있는 용량을 투여하여야 하지만, 최적의 투여용량에 대해서는 아직 논란이 있다. 특히 소아를 대상으로 최적화 된 방사성요오드 투여용량을 결정하기 위해 참고할 수 있는 논문은 극히 제한적이다.", "현재 표준 치료법은 경험적으로 결정된 고정용량을 투여하고, 필요 시 반복하여 투여한다. 체르노빌 사고 이후 발생한 소아 갑상선암 환자들을 치료한 경험을 바탕으로 한 기관에서 고정용량을 제시하였는데, 잔여갑상선 제거/보조치료 목적으로 체중당 50 MBq, 알려진 전이 병소 치료를 위해 체중당 100 MBq을 투여한다. 그러나 고정용량 투여법은 환자의 개별 특성을 고려하지 않는다는 단점이 있다. 최대허용방사선흡수선량(maximum tolerated radiation absorbed dose)은 골수 기능에 영향을 주지 않는 기준(혈액의 흡수선량 200 cGy)으로 계산하여 투여하 며, 폐전이가 있는 경우 방사성요오드 투여 24시간째 측정한 폐섭취가 3 GBq를 넘지 않도록 한다. 방사선량 측정법은 소아 에서 제한적으로 사용할 수 있으나 소아를 대상으로 하여 선량평가 기반으로 최적의 선량효 과곡선을 탐색한 논문은 따로 없다. 향후 <sup>123<\/sup>I 또는 <sup>131<\/sup>I-SPECT/CT나 <sup>124<\/sup>I-PET을 이용하면 전신 또는 국소병소에 대한 선량평가가 용이할 것으로 예상된다.", "일반적으로 방사성요오드 치료는 투여 6-12개월 후 치료반응을 평가한다. 그러나 방사성요오드는 투여 후 수 년 뒤까지 혈청 갑상선글로불린이 감소하는 것이 알려져 있어 치료효과를 평가하는 최적의 시기를 결정하는 것이 쉽지 않다. 성인 환자 223명을 대상으로 혈청 TSH-비자극 갑상선글로불린이 1 ng/mL 미만에 도달하는 시기를 누적으로 평가한 연구에서, 58%에서 6개월, 75%에서 12개월, 100% 도달에 18개월이 걸렸음을 보고하였다. 미국과 유럽 갑상선학회 소아 진료권고안에서는 소아 환자에게 재치료 전에 최소 12개월 간격의 기간을 두고 치료를 고려할 것을 전문가 합의로 권고한 바있다. 그러나 이 논문은 구조적 질병의 증거가 없는 환자들을 대상으로 잔여갑상선 제거를 위해 방사성요오드를 투여한 뒤 혈청 TSH-비자극 갑상선글로불린이 1 ng/mL 미만에 도달하는 시기를 평가한 것이며, 현재 질병이 있는 환자들을 대상으로 방사성요오드 치료의 간격을 결정하기 위해 시행한 연구가 아니므로 해석에 주의를 요한다.", "소아에서도 방사성요오드 치료를 위해 성인과 마찬가지로, 적절한 수준으로 TSH를 상승시켜야 하고 유효 방사선량의 증가를 위하여 저요오드 식이가 권장된다. 그러나 방사성요오드 치료 준비를 위해 인간유전자재조합 TSH (rhTSH)를 주사하는 것은 소아에서 자료가 제한적이다. 비록 제한적이지만 소아에서 rhTSH의 효과와 안전성에 관한 연구 결과, rhTSH 주사 후 충분한 수준으로 TSH 에 도달하였고, 유의한 부작용은 보고되지 않 았다. 치료효과 측면에서도 갑상선호르몬을 중단한군과 rhTSH 주사한 군 간의 차이를 보이지 않았다.", "소아 방사성요오드 치료의 급성 및 만성 부작용은 성인과 동일하다. 소아 환자는 소아의 생물학적 특성과 장기적 생존을 고려하여 이차암 발생과 생식력 보존에 대한 자문이 필요하다. 방사성요오드 치료 후 이차암의 발생에는 일반적으로 누적선량, 치료 당시 나이, 조직의 방 사선민감성, 이차암 발생의 잠복기 등이 중요하다. 방사선요오드 치료 이후 10년 이상 경과하였을 때 유방암 발생이 증가하기 시작하였고, 체르노빌 사고 이후 유방암이 증가하였다고 보고한 연구에서는 잠복기의 중앙값이 20년이었다. 20년 이상 장기 생존 갑상선암 환자를 대상으로 한 미국 SEER 암등록자료에서 방사성요오드 치료는 고형암의 6%, 혈액암의 14% 발생에 기여하는 것으로 추정된다. 특히 방사성요오드 치료 당시 나이가 25세 미만인 경우 고형암의 상대위험이 1.60 (95% 신뢰구간, 1.07-2.40)이고, 관찰기간 20년 경과 시 상대위험이 1.47 (95% 신뢰구간, 1.24-1.74)이었다. 국내 29세 이하 갑상선암 환자를 대상으로 방사성요오드 치료를 받은 군과 수술군을 비교한 연구에서 방사성요오드 치료군의 이차암 조정 발생위험비가 1.52 (95% 신뢰구간, 1.03-2.24)로 높음을 보고하였다.", "남성은 방사성요오드 치료 시 일시적으로 정자수가 감소하거나 혈청 난포자극호르몬(follicle stimulating hormone, FSH)이 증가할 수 있다. 누적용량이 높을 경우(500-800 mCi) 혈청 FSH 상승이 지속될 위험이 있으나, 400 mCi 미만 용량에서는 불임, 유산, 기형 등과 직접적 관련성은 아직 보고된 바 없다. 남성의 영구 불임은 단회 치료 용량으로 발생하지는 않으며, 장기간 관찰연구 자료에서 방사성요오드 치료 후 정상적으로 정액의 성상이 유지되었고 임신과 출산의 결과가 정상 대조군과 다르지 않았다. 이론적으로는 반복치료 시 생식선 손상의 가능성이 있고 소아를 대상으로 하는 연 구자료가 부족한 점을 감안하여, 누적용량이 높을 경우에는 불임의 잠재적 위험성에 대한 상담이 필요할 것으로 생각된다.", "방사성요오드 치료가 예정된 가임기 여성은 먼저 임 신검사를 시행하여야 한다. 가임기 여성의 20-27%에서 방사성요오드 치료 후 4-10개월간 일시적인 무월경 또는 희발월경이 나타날 수 있다. 그러나 방사성요오드 치료가 난소예비력에 영향을 주는지에 대해서는 아직 논란이 있다. 두 편의 연구에서 난소예비력을 나타내는 항뮬러관 호르몬 (anti-müllerian hormone, AMH) 이 감소함을 보고하였으나, 1 년 후 부분적으로 회복되었고, AMH 가 낮았음에도 불구하고 불임이 보고된 바 없었다. 또다른 연구에서는 방사성요오드 치료군과 대조군 사이에 AMH 차이가 없었다. 최근 여자 소아 갑상선분화암 환자의 생식력에 대해 연구가 보고되었는데, 여성 갑상선암 생존자들은 가임능력에 이상이 없었고, 난소 기능상실을 예측하는 소견 역시 발견되지 않았다."]}, "V.6.A": {"ids": ["V.6.A", "V.6.B", "V.6.C", "V.6.D", "V.6.E", "V.6.F"], "p": ["소아 갑상선분화암 재발의 호발 부위는 경부림프절이다. 따라서 TSH 억제치료 중 갑상선글로불린 또는 항체가 상승하는 경우에는 경부 갑상선 초음파를 우선 시행하고 경부에 병소가 보이지 않으면 <sup>123<\/sup>I 진단스캔이 나 <sup>18<\/sup>F-FDG PET 검사를 고려할 수 있다. 경부의 재발병소는 육안으로 확인되면 수술 또는 방사성요오드 치료를 고려한다. 재발 병소가 경부에 국한되고 수술적 절제 가능하면 수술을 시행하고, 병소의 크기가 작거나 위 치상 수술적 절제가 어려운 경우에는 <sup>123<\/sup>I 진단스캔 검사상 방사성요오드 섭취가 있으면 방사성요오드 치료를 고려할 수 있다. 경부 림프절에 대한 고주파절제술 치료에 대해서는 소아 5 명에서의 경부 림프절 10 개를 치료한이후 크기가 감소했다는 보고가 있다.", "소아에서 폐전이는 20% 정도 동반되는데, 대부분 미 세전이(micrometastasis)이고 방사성요오드를 잘 섭취하 여 치료에 잘 반응한다. 하지만, 소아유두암의 폐전이는 방사성요오드 치료를 반복해도 완전히 소실되지 않고 지속되는 빈도가 높은 것으로 알려져 있으나, 그럼에 도 불구하고 폐전이로 인한 사망률은 2-5%로 낮다. 또한 방사성요오드 치료 후 15-18개월까지도 폐 병소의 감소와 갑상선글로불린 농도의 감소가 나타날 수 있으므로, 12개월 정도의 간격을 두고 반복적인 방사성요오드 치료를 고려한다. 따라서 방사성요오드 치료의 이득과 위해를 고려하여 방사성요오드 치료의 횟수와 용량을 개별화한다. 폐전이가 있어서 반복적인 방사성요오드 치료를 시행하는 소아에서는 폐기능 검사를 추적한다. 특히, 소아기 종양생존자는 과거 폐독성 항암제 (bleomycin 등) 투여력 또는 흉부방사선 병력이 있으면 폐섬유화 발생 위험이 증가하므로 주의를 요한다."]}, "V.7.A": {"ids": ["V.7.A", "V.7.B", "V.7.C"], "p": ["소아 갑상선분화암의 전이 병소는 대부분 방사성요오드 섭취가 잘 되지만, 드물게 방사성요오드 불응성암이있다. 갑상선분화암의 지속 병소가 방사성요오드 불응 성인 경우 종양조직의 유전자변이 확인을 고려한다. 불응성암 병소가 무증상이고 진행하지 않으면 TSH 억제 치료를 지속하면서 추적한다. 하지만 불응성암 병소가 진행하는 경우에는 추가 치료를 요하며, 수술적인 완전 제거가 어려운 경우에는 종양조직의 유전자변이에 근거한 표적치료 약제가 있는지 확인을 요한다.", "소아의 갑상선유두암은 성인에 비해 융합유전자변이 (fusion oncogene) 빈도가 높은데, 연령이 어리고 병기가 높을수록 RET, NTRK1/3 융합유전자변이 빈도가 높 다. 소아에서 융합유전자변이를 가진 종양이 점돌연변이(point mutation)를 가진 종양에 비해 병기가 높고 예후가 불량한 것으로 알려져 있으며, 폐전이가 동반된 소아 갑상선유두암의 75-85%에서 종양유전자변이가 RET 또는 NTRK1/3 융합유전자임이 확인되었다. 반면, 소아기에 매우 드물게 발생하는 갑상선여포암은 진단 당시 림프절이나 원격전이 동반이 드물고, 장기추 적 결과 재발률이 낮아 좋은 예후를 보인다. 국내 소아 갑상선여포암에서 DICER1, PTEN 유전자변이 빈도가 높은 것으로 보고되었다.", "소아에서 진행하는 방사성요오드 불응성 갑상선유두암에서 융합유전자변이가 확인되고 표적치료 약제가 있으면 치료를 고려한다. 국내에서 진행성 방사성요오드 불응성 갑상선유두암으로 진단된 2명의 어린 소아를 대상으로 임상시험 참여를 통해 각각 종양의 TPR-NTRK1 변이에 근거한 라로트릭티닙, CCDC6-RET 변이에 근거한 셀퍼카티닙 치료를 시행한 결과, 폐전이 병소가 감소 되고 방사성요오드 섭취가 회복하는 것을 확인하였다. 국외에서도 방사성요오드 불응성을 보이는 진행성 갑상선유두암 소아에서 TPM3-NTRK1 변이에 근거한 라로트렉티닙 치료를 시행한 결과 경부와 폐전이 병소의 크기가 감소하고 방사성요오드 섭취가 회복되어, 표적치료 6개월 이후 방사성요오드 치료를 시행하였고 유의한 종양크기 감소를 확인하였다. 즉, 소아 방사성요오드 불응성 갑상선유두암에서 융합유전자 표적치료를 통해 종양 크기 감소뿐 아니라 방사성요오드 섭취가 회복되 는 경우에는 표적 <h4>I.1.3 수술 전 <sup>18</sup>F-FDG PET/CT</h4>${R('I.1.3.A',3,'수술 전 병기 결정에 <sup>18</sup>F-FDG PET/CT 검사가 일반적으로 권고되지는 않으나, 수술 전 측경부 림프절전이나 원격전이가 의심되는 경우, 또는 수술 전후 시행한 갑상선 병리진단검사 결과가 갑상선유두암의 고위험 아형, 갑상선저분화암, 고등급갑상선분화암과 같은 공격적인 조직형의 경우 초기 병기 결정을 위해 <sup>18</sup>F-FDG PET/CT 촬영을 시행할 수 있다.')}`},
as:{kind:'Part I. 초기 치료', sec:'I.2.3', title:'저위험군 미세갑상선유두암에 대한 적극적 관찰', next:['surg'], nextLabel:'진행 시', body:`${R('I.2.3.A',2,'저위험군 미세갑상선유두암으로 진단된 성인 환자에서 적극적 관찰을 고려할 수 있다.')}
<h4>대상 선정: 다음은 수술을 우선 고려</h4>
<ul><li>임상적으로 림프절전이 또는 원격전이가 의심되는 경우</li>
<li>임상적으로 육안적 갑상선외부침범이 있거나 기관 또는 되돌이후두신경 침범이 의심 또는 우려되는 경우</li>
<li>공격적인 조직아형(긴세포, 원주세포, hobnail 아형 등)이 관찰되는 경우</li></ul>
<h4>진행의 정의</h4>
<ul><li>대부분의 연구: 최대 길이 3 mm 이상 증가, 또는 새로운 경부 림프절·원격전이·갑상선외부침범 소견</li>
<li>부피 50% 이상 증가(과대평가 우려로 72–100% 기준 사용 연구도 있음), 2개 이상 직경이 각 2 mm 이상 증가를 쓰는 연구도 있다.</li>
<li>크기 증가 시 측정 오차를 고려하여 3–6개월 간격 초음파로 재확인한다.</li></ul>
<h4>근거 요약</h4>
<ul class="small"><li>2 cm 이하 저위험 유두암 9개 연구(평균 19개월–7.6년): 길이 ≥3 mm 증가 2.2–10.8%, 부피 ≥50% 증가 16.0–28.8%, 새 림프절전이 0–4.5%</li>
<li>일본 3222명(평균 7.3년): 10년/20년 크기 증가 4.7%/6.6%, 새 림프절전이 1.0%/1.6%. 즉시 수술군의 림프절전이 0.4%/0.7%보다 유의하게 높으나 차이는 크지 않았다.</li>
<li>1–2 cm 종양의 적극적 관찰은 자료가 제한적이며, 9 mm 이상에서 진행 위험 증가(HR 1.79) 보고가 있다.</li></ul>
<h4>진행 관련 인자</h4>
<ul class="small"><li>30세 미만, 남성, 종양 6 mm 이상, 기저 TSH 7 mIU/L 이상, 종양 내 혈류, 미만성 갑상선질환 소견, 빠른 종양배가시간</li>
<li>40세 미만은 60세 이상보다 크기 증가(5.9% vs. 2.2%)와 림프절전이(5.3% vs. 0.4%)가 많아, 고령에서 적극적 관찰을 더 고려해 볼 수 있다.</li>
<li>가임기 여성은 적극적 관찰 중 임신에 대한 고려가 필요하다.</li></ul>`},
surg:{kind:'Part I. 초기 치료', sec:'I.2.1–I.2.2', title:'초기 수술 (수술범위 결정)', next:['lnd','robot','local','comp'], body:`<h4>병리진단검사에서 암으로 진단된 경우 (I.2.2)</h4>${R('I.2.2.A',1,'갑상선암의 크기가 1 cm 이하이고 임상적으로 육안적 갑상선외부침범이 없으며(cT1a), 경부 림프절전이의 증거가 없는 경우(cN0), 반대쪽 엽을 절제해야 하는 분명한 이유가 없다면 갑상선엽절제술을 시행한다.')}${R('I.2.2.B',1,'갑상선암의 크기가 1-2 cm이면서 임상적으로 육안적 갑상선외부침범이 없고(cT1b), 경부 림프절전이의 증거가 없는 경우에는(cN0) 갑상선엽절제술을 우선적으로 고려한다. 단, 수술 후 방사성요오드 치료 계획, 추적 검사의 효율, 환자의 선호도 등을 고려하여 갑상선전절제술을 시행할 수 있다.')}${R('I.2.2.C',2,'갑상선암의 크기가 2-4 cm이면서 임상적으로 육안적 갑상선외부침범이 없고(cT2), 경부 림프절전이의 증거가 없는 경우(cN0), 재발과 합병증에 미치는 영향을 고려하여 갑상선엽절제술 또는 갑상선전절제술을 선택하여 시행할 수 있다.')}${R('I.2.2.D',2,'크기가 4 cm를 초과하는 갑상선분화암이 임상적으로 띠근육과 주요 기관에 대한 육안적 갑상선외부침범이 없고(cT3a), 경부 림프절전이의 증거가 없는 경우, 재발 감소 효과와 합병증 증가 위험을 고려하여 일반적으로 갑상선전절제술을 권고한다.')}${R('I.2.2.E',2,'갑상선암의 크기에 상관없이 임상적으로 종양의 띠근육에 국한된 육안적 갑상선외부침범이 확인되는 경우(cT3b), 재발 또는 사망 감소 효과와 합병증 증가 위험을 고려하여 갑상선전절제술을 선택적으로 시행할 수 있다.')}${R('I.2.2.F',2,'갑상선암의 크기에 상관없이 임상적으로 주요 기관에 대한 육안적 갑상선외부침범(cT4), 또는 경부 림프절전이(cN1)나 원격전이(M1)가 분명한 경우에서는 특별한 금기가 없는 한 처음 수술 시 갑상선전절제와 원발암의 완전한 육안적 제거를 시행하여야 한다.')}
<h4>임상 병기별 수술범위 요약</h4>
<div class="tbl"><table><thead><tr><th>임상 병기</th><th>권고 수술범위</th><th>권고수준</th></tr></thead><tbody>
<tr><td>cT1a N0 (≤1 cm)</td><td>엽절제술 (적극적 관찰 가능)</td><td>1</td></tr>
<tr><td>cT1b N0 (1–2 cm)</td><td>엽절제술 우선, 상황에 따라 전절제술</td><td>1</td></tr>
<tr><td>cT2 N0 (2–4 cm)</td><td>엽절제술 또는 전절제술 선택</td><td>2</td></tr>
<tr><td>cT3a N0 (&gt;4 cm)</td><td>일반적으로 전절제술</td><td>2</td></tr>
<tr><td>cT3b (띠근육 육안 침범)</td><td>전절제술 선택적 시행</td><td>2</td></tr>
<tr><td>cT4, cN1, M1</td><td>전절제술 + 원발암의 완전한 육안적 제거</td><td>2</td></tr></tbody></table></div>
<p class="small">수술범위는 재발률뿐 아니라 합병증, 건강 상태, 환자 선호도를 함께 고려하여 개별화한다. 수술 중·후 확인된 위험인자에 따라 완료절제술을 고려한다(I.2.5).</p>`},
comp:{kind:'Part I. 초기 치료', sec:'I.3', title:'수술 전후 합병증 평가', next:[], body:`<h4>I.3.1 수술 전후 음성 평가</h4>
<h5>(1) 수술 전</h5>${R('I.3.1.A',1,'갑상선 수술을 받는 모든 환자에서 음성 이상 유무를 확인한다.')}${R('I.3.1.B',2,'갑상선 수술을 받는 환자에서 후두의 육안적 관찰을 고려한다.')}${R('I.3.1.C',1,'다음과 같은 상황에서는 반드시 성대 상태를 평가한다.')}<ul class="small rl"><li>C1. 음성 이상이 있는 경우</li><li>C2. 후두육안검사상 이상 소견이 관찰되는 경우</li><li>C3. 후방 침범이 의심되거나, 종괴가 큰 경우, 이전의 경부수술의 과거력, 광범위한 림프절전이가 의심되는 경우</li></ul>
<h5>(2) 수술 중</h5>${R('I.3.1.D',3,'신경 확인 및 신경기능 확인을 위해 수술 중 신경감시시스템 사용을 고려한다.')}
<h5>(3) 수술 후</h5>${R('I.3.1.E',1,'갑상선 수술 후 모든 환자에게 음성 이상 유무를 확인한다.')}${R('I.3.1.F',1,'수술 후 음성 이상이 있는 모든 환자에서 후두의 육안적 관찰을 시행한다.')}
<h4>I.3.2 수술 전후 부갑상선기능 평가</h4>${R('I.3.2.A',2,'갑상선전절제술 또는 갑상선완료절제술을 받는 모든 환자에서 수술 전 혈청 칼슘, 부갑상선호르몬, 25-hydroxyvitamin D (25[OH]D) 검사를 고려한다.')}${R('I.3.2.B',3,'수술 전 혈청 칼슘 수치가 낮은 환자에서는 경구 칼슘제 투여를 고려할 수 있다.')}${R('I.3.2.C',3,'수술 전 비타민D 결핍이 있는 환자에서는 비타민D 보충 요법을 고려할 수 있다.')}${R('I.3.2.D',2,'수술 직후 발생한 부갑상선기능저하증 확인을 위해 수술 24시간 내 혈청 칼슘과 부갑상선호르몬 검사를 고려한다.')}${R('I.3.2.E',2,'수술 직후 발생한 부갑상선기능저하증에서는 혈청 부갑상선호르몬과 칼슘 수치 및 저칼슘혈증의 증상이나 징후에 따라 칼슘과 활성형비타민D 보충 요법을 결정한다.')}${R('I.3.2.F',1,'영구적 부갑상선기능저하증은 기능저하의 정도에 따라 비타민D, 경구 칼슘제 등을 포함한 약물 치료가 필요하다.')}${R('I.3.2.G',2,'부갑상선기능저하증으로 장기적 치료가 필요한 환자에서는 주기적인 생화학적검사를 통해 치료의 적절성을 평가한다.')}${R('I.3.2.H',3,'영구적 부갑상선기능저하증 환자에서는 질환 자체 및 치료에 의한 합병증 평가를 고려한다.')}`},
lnd:{kind:'Part I. 초기 치료', sec:'I.2.4', title:'림프절절제술', next:['patho'], body:`${R('I.2.4.A',1,'임상적으로 중앙경부 림프절전이가 확인된 경우에는 치료적 중앙경부(level VI) 림프절절제술을 시행한다.')}${R('I.2.4.B',2,'임상적으로 중앙경부 림프절전이가 발견되지 않은 갑상선유두암 환자에서 일률적인 예방적 중앙경부 림프절절제술은 권고되지 않으며, 재발 감소 효과와 합병증 증가 위해를 고려하여 선택적으로 시행할 수 있다.')}${CC('수술 후 예후 및 치료 전략 결정에 필요한 경우에도 예방적 중앙경부 림프절절제술을 시행할 수 있다.')}${R('I.2.4.C',2,'진행된 원발암(T3, T4) 및 확인된 측경부 림프절전이(N1b)가 있는 경우에는 예방적 중앙경부 림프절절제술이 권고된다.')}${R('I.2.4.D',1,'갑상선여포암에서는 대부분 예방적 중앙경부 림프절절제술이 불필요하다.')}${R('I.2.4.E',1,'명백한 측경부 림프절전이가 확인된 경우에는 치료적 측경부 림프절절제술을 시행한다.')}
<ul class="small"><li>중앙경부(level VI): 기도전·기도주위·전후두(delphian) 림프절. 상종격동(level VII)은 N1a에 포함된다.</li>
<li>측경부: level I–V (N1b). 경부 림프절 구역은 Fig. I.2.4.A 참조.</li></ul>`},
robot:{kind:'Part I. 초기 치료', sec:'I.2.6', title:'내시경 및 로봇 갑상선수술', next:['patho'], body:`${R('I.2.6.A',2,'내시경 및 로봇 갑상선수술은 환자의 선호도에 따라 적응증에 해당하는 저위험군 갑상선분화암에서 시행할 수 있다.')}
<h4>접근법</h4><p>액와접근법, 양측액와유방접근법(BABA), 후이개접근법, 경구강접근법(transvestibular) 등이 있다. 최소침습 수술 전에 경부절개 수술에 대한 충분한 경험이 선행되어야 한다.</p>
<h4>적응증</h4><ul><li>초기 경험 외과의: 갑상선 피막·띠근육 침범이 없고 전면에 위치한 2 cm 이하, 명확한 중앙경부 림프절전이가 없는 저위험군</li>
<li>숙련된 외과의: 4 cm 이하, 피막·띠근육 미세침범, 중앙경부 또는 측경부 림프절전이까지 확대 가능 (BMI ≤36 kg/m²)</li></ul>
<h4>상대적 금기</h4><ul><li>이전 방사선조사력, 큰 흉골하 갑상선종</li><li>피막·띠근육·기도식도고랑의 광범위 침범 의심</li><li>주변 구조물을 침범하는 다발성 림프절전이, 원격전이</li></ul>
<p class="small">수술 시간이 길고 비용이 높으며 학습곡선이 있으나, 미용 만족도는 경부절개술보다 우월하고 통증·음성·연하 관련 결과는 비슷하거나 양호하다.</p>`},
local:{kind:'Part I. 초기 치료', sec:'I.2.7', title:'국소 침범을 동반한 갑상선분화암의 수술', next:['patho'], body:`<h4>되돌이후두신경 침범</h4>${R('I.2.7.A',3,'갑상선분화암이 되돌이후두신경을 침범하였으나 성대의 움직임이 유지된다면 신경 보존 시술을 시도할 수 있다.')}${R('I.2.7.B',3,'갑상선분화암이 되돌이후두신경을 침범하였으며 성대 마비가 확인된 경우 되돌이후두신경을 절제할 수 있다.')}
<h4>기도 침범</h4>${R('I.2.7.C',2,'갑상선분화암의 기도 침범이 의심되는 경우, 침범된 조직을 충분한 여유를 두고 완전히 절제한다.')}${R('I.2.7.D',3,'기도 내강 침범이 없으면 기도의 shaving partial resection을 고려할 수 있다.')}${R('I.2.7.E',3,'기도 내강 내 침범이 확인되면 window resection 또는 sleeve resection을 고려한다.')}
<ul class="small"><li>기도 침범은 약 3.4–13%에서 보고되며 장기 생존에 악영향을 준다.</li>
<li>5년 질병생존율: R0 94.4%, R1 87.6%, R2 67.9%로 절제 범위에 따라 감소한다는 보고가 있다.</li></ul>
<h4>식도 침범</h4>${R('I.2.7.F',2,'갑상선분화암의 식도 침범이 의심되는 경우, 수술 시 충분한 여유공간을 두고 침범된 조직을 완전히 절제한다.')}`},
patho:{kind:'Part I. 초기 치료', sec:'I.4.1, I.4.3', title:'수술 후 병리 진단과 암의 종류', next:['stage'], body:`<h4>I.4.1 수술 후 병리학적 진단</h4>${R('I.4.1.A',1,'갑상선분화암의 병리학적 진단은 세계보건기구 종양분류체계를 따른다.')}
<p>2022년 WHO 분류는 7개 범주이며, 본 권고안은 여포세포 유래 암과 갑상선체모양-오디모양암을 대상으로 한다.</p>
<div class="tbl"><table><thead><tr><th>여포세포 유래 종양 (WHO 2022)</th><th>유형</th></tr></thead><tbody>
<tr><td>양성종양</td><td>갑상선여포결절병(FND), 여포선종(FA), 유두모양여포선종, 호산성선종(OA)</td></tr>
<tr><td>저위험종양</td><td>NIFTP, 악성도불명종양(FT-UMP, WDT-UMP), 유리질소주형종양(HTT)</td></tr>
<tr><td>악성종양: 고분화암</td><td>여포암(FTC), 침습피막형성여포유두암(IEFVPTC), 유두암(PTC), 호산성암(OCA)</td></tr>
<tr><td>악성종양: 고등급</td><td>저분화암(PDTC), 고등급분화암(DHGTC)</td></tr>
<tr><td>악성종양: 미분화</td><td>역형성암(ATC): 분화암에서 제외</td></tr></tbody></table></div>
<p class="small">그 외 범주: C세포 유래(수질암), 수질여포혼합암, 침샘형암, 조직발생 미상(체모양-오디모양암 등), 갑상선내 흉선종양, 갑상선배아종양</p>
<h4>I.4.3 병리학적 진단의 기본 원칙</h4>${R('I.4.3.A',1,'병리학적 보고서는 AJCC/UICC 병기 결정과 재발 예측에 필요한 종양의 조직학적 특징(조직학적 아형, 종양세포의 괴사, 유사분열 세포수, 혈관 침습, 침습된 혈관의 개수, 림프관 침습, 검사한 림프절 및 전이된 림프절 개수, 림프절에서 가장 큰 전이병소의 크기 및 림프절 피막외 침범 여부 등)을 포함하여 환자의 위험도 평가에 도움이 되는 정보를 기술한다.')}${R('I.4.3.B',1,'갑상선유두암에서 조직학적 아형을 기술하며, 나쁜 예후를 보이는 조직학적 아형(긴세포, 원주세포, hobnail 아형)을 구분할 수 있도록 병리 보고서에 명기한다.')}${R('I.4.3.C',1,'피막형성 여포아형 갑상선암에서 환자의 위험도 평가에 도움이 되는 조직학적 아형(최소침습형, 피막형성혈관침습형, 광범위침습형)은 병리 보고서에 명기한다.')}${R('I.4.3.D',3,'가족성 증후군과 연관된 조직학적 아형(가족성 용종증과 연관된 체모양-오디모양갑상선암; PTEN-과오종 종양 증후군과 연관된 여포암 또는 유두암)은 병리 보고서에 명기한다.')}
<ul class="small"><li>고등급분화암: 유두암·여포암에서 유사분열 2 mm²당 5개 이상 또는 종양 괴사가 있는 경우</li>
<li>Ki67 표지지수 5% 이상이면 악성도 증가, 저분화암 10% 이상, 역형성암 30% 이상 보고</li>
<li>피막형성 여포아형암(여포암, IEFVPTC, 호산성암)은 최소침습형, 피막형성혈관침습형, 광범위침습형으로 구분</li></ul>`},
stage:{kind:'Part I. 초기 치료', sec:'I.4.2', title:'수술 후 병기 결정 (TNM)', next:['prog','risk'], body:`${R('I.4.2.A',1,'갑상선분화암의 예후 예측과 추후 치료방침의 결정을 위해서 모든 갑상선분화암 환자에서 수술 후 임상적, 병리적 병기 결정을 시행한다.')}${R('I.4.2.B',1,'갑상선분화암의 병기 결정에는 질병의 사망률 예측과 국가암등록을 위하여 AJCC/UICC 병기 분류를 권장한다.')}
<h4>TNM 정의 (AJCC 8판)</h4>
<div class="tbl"><table><thead><tr><th>구분</th><th>정의</th></tr></thead><tbody>
<tr><td>T1a / T1b</td><td>≤1 cm / 1–2 cm, 갑상선외부침범 없음</td></tr>
<tr><td>T2</td><td>2–4 cm, 갑상선외부침범 없음</td></tr>
<tr><td>T3a</td><td>&gt;4 cm, 갑상선외부침범 없음</td></tr>
<tr><td>T3b</td><td>크기 무관, 띠근육에 국한된 육안적 외부침범</td></tr>
<tr><td>T4a</td><td>피하 연부조직, 후두, 기도, 식도, 되돌이후두신경 침범</td></tr>
<tr><td>T4b</td><td>prevertebral fascia 침범, 경동맥·종격동 혈관을 둘러쌈</td></tr>
<tr><td>N0a / N0b</td><td>세포·조직학적 전이 없음 / 영상·임상적 전이 없음</td></tr>
<tr><td>N1a</td><td>level VI 또는 VII (기도전, 기도주위, 전후두, 상종격동), 일측·양측</td></tr>
<tr><td>N1b</td><td>일측·양측·반대편 측경부(level I–V), 후인두 림프절</td></tr>
<tr><td>M1</td><td>원격전이</td></tr></tbody></table></div>
<h4>병기 (AJCC 8판)</h4>
<div class="tbl"><table><thead><tr><th>연령</th><th>병기</th><th>T</th><th>N</th><th>M</th></tr></thead><tbody>
<tr><td rowspan="2">55세 미만</td><td>I</td><td>Any</td><td>Any</td><td>M0</td></tr>
<tr><td>II</td><td>Any</td><td>Any</td><td>M1</td></tr>
<tr><td rowspan="6">55세 이상</td><td>I</td><td>T1–2</td><td>N0</td><td>M0</td></tr>
<tr><td rowspan="2">II</td><td>T1–2</td><td>N1</td><td>M0</td></tr>
<tr><td>T3a/b</td><td>Any</td><td>M0</td></tr>
<tr><td>III</td><td>T4a</td><td>Any</td><td>M0</td></tr>
<tr><td>IVA</td><td>T4b</td><td>Any</td><td>M0</td></tr>
<tr><td>IVB</td><td>Any</td><td>Any</td><td>M1</td></tr></tbody></table></div>`},
prog:{kind:'예후', sec:'I.4.2, I.5.2', title:'예후', next:['risk'], body:`<h4>병기와 사망 위험</h4>
<ul><li>AJCC/UICC 병기는 사망 위험을 예측하며, 대부분의 환자(70–85%)를 저위험군으로 구별한다.</li>
<li>예후를 가장 잘 반영하는 인자는 원격전이 여부, 진단 시 연령(55세 기준), 종양의 국소 진행 정도이다.</li>
<li>병기는 재발 위험을 예측하지 못하므로 추가 치료(RAI, TSH 억제) 결정에는 별도의 재발위험군 분류(I.5)를 사용한다.</li></ul>
<h4>개별 임상인자에 따른 재발 위험 (I.5.2)</h4>${R('I.5.2.A',3,'수술 후 초기위험군 분류 시 단독적인 개별 위험인자의 영향보다는 동반된 임상적 및 병리학적 위험인자들을 종합적으로 고려하여 재발위험도를 평가한다.')}
<div class="tbl"><table><thead><tr><th>인자</th><th>보고된 재발률</th></tr></thead><tbody>
<tr><td>종양 크기 (국내 PTC, 5년/10년)</td><td>≤1 cm 1.3/2.5%, 1–2 cm 2.7/4.7%, 2–4 cm 6.8/11.1%</td></tr>
<tr><td>T2 유두암</td><td>전체 5–6%. BRAF<sup>V600E</sup> 음성 1–2%, 양성 최대 12.1%</td></tr>
<tr><td>&gt;4 cm 갑상선내 국한</td><td>유두암 8.3%, 여포암 0–11.1%</td></tr>
<tr><td>공격적 아형</td><td>긴세포 22–37%, 원주세포 42%, hobnail 23–35.5%, 미만성 경화 11.6–27%, 고형 9.5–26%</td></tr>
<tr><td>저분화암·고등급분화암</td><td>진단 시 원격전이 19–39%, 5년 암특이생존율 66–70%</td></tr>
<tr><td>육안적 외부침범(띠근육)</td><td>5.9–29.4% (국내 5.9–10.8%). 경미한 침범 단독은 위험인자로 보지 않음</td></tr>
<tr><td>혈관침습</td><td>유두암 10.7–28%. 피막형성 여포아형 1–3개 1.9–15.2%, 광범위침습형 여포암 12.7–54%</td></tr>
<tr><td>림프절전이 개수</td><td>≤5개 3–8%, &gt;5개 7–21%. 국내 10년: 0개 1.2%, 1–5개 3%, 6–10개 12.9%, &gt;10개 27.7%</td></tr>
<tr><td>전이림프절 크기·피막외 침범</td><td>미세전이(≤0.2 cm) ≤5개는 저위험, &gt;3 cm는 고위험. 림프절외부침범 시 재발위험 2.21배</td></tr>
<tr><td>다발성</td><td>미세유두암 2–6%, &gt;1 cm 4–23%</td></tr></tbody></table></div>
<p class="small">여러 인자가 동반되면 재발 위험은 단독 인자보다 높아질 수 있다. 수치는 대상군, 수술 범위, RAI 여부, 추적 기간에 따라 달라 해석에 주의가 필요하다.</p>`},
risk:{kind:'Part I. 초기 치료', sec:'I.5', title:'초기 질병 상태와 재발위험도 평가, 초기위험군 분류', next:['rai','completion'], body:`${R('I.5.1.A',3,'수술 후 잔존병소의 존재나 재발위험에 따라 초기 재발위험도를 평가(initial risk stratification)하여 저, 중간, 고위험군의 초기위험군으로 분류한다.')}${R('I.5.1.B',3,'초기위험군 분류에 따라 TSH 목표농도와 추가 치료전략을 결정한다.')}
<div class="tbl"><table><thead><tr><th>위험군</th><th>기준</th></tr></thead><tbody>
<tr><td>저위험군<br>(재발 ≤5%)<br>모두 충족</td><td>1) 국소·원격전이 없음<br>2) 육안적 병소 완전 제거(R0)<br>3) 공격적 조직아형이 아닌 유두암, 또는 최소침습형 피막형성 여포아형암<br>4) ≤2 cm 유두암(T1), BRAF<sup>V600E</sup> 음성인 2–4 cm 유두암(T2), 또는 ≤4 cm 피막형성 여포아형암(T1–2)<br>5) 혈관침습 없음<br>6) 갑상선 주위조직 침범 없음<br>7) RAI 시행 시 첫 치료 후 스캔에서 갑상선 부위 외 섭취 없음<br>8) 림프절전이 없음 또는 미세전이(≤0.2 cm) 5개 이하</td></tr>
<tr><td>중간위험군<br>(재발 5–30%)</td><td>저위험군·고위험군에 해당하지 않는 경우. 개별 위험인자(Table I.5.1.B–I.5.2.I)를 종합하여 평가</td></tr>
<tr><td>고위험군<br>(재발 ≥30%)<br>하나 이상</td><td>1) 육안적 주위조직 침범 pT4 (T3b 제외)<br>2) 저분화암, 고등급분화암<br>3) 광범위침습형 피막형성 여포아형암<br>4) 광범위 혈관침습(4개 이상)<br>5) 육안적 불완전 절제(R2)<br>6) 전이림프절 최대 직경 &gt;3 cm<br>7) BRAF<sup>V600E</sup>+TERT 또는 RAS+TERT 등 위험 돌연변이 2개 이상<br>8) 원격전이</td></tr></tbody></table></div>
<ul class="small"><li>공격적 조직아형: 긴세포, 원주세포, hobnail, 고형, 미만성 경화 아형</li>
<li>TERT 프로모터 변이를 동반한 1–4 cm 유두암이나 2–4 cm 최소침습 여포암은 재발·사망 증가가 보고되어 주의가 필요하다.</li>
<li>중간위험 인자가 여러 개이면 고위험군 수준의 재발률을 보일 수 있다.</li></ul>
<h4>위험군에 따른 치료 방향</h4>
<ul><li>저위험군: 대부분 엽절제술로 충분. 전절제 시에도 RAI 잔여제거술은 일반적으로 권고하지 않음</li>
<li>중간위험군: 위험인자를 종합하여 완료절제술, RAI 여부와 용량(30, 30–100, &gt;100 mCi)을 결정</li>
<li>고위험군: 엽절제 후라면 완료절제술, 질환 상태에 따라 RAI를 포함한 적극적 치료</li></ul>`},
completion:{kind:'Part I. 초기 치료', sec:'I.2.5', title:'갑상선완료절제술', next:['rai'], body:`${R('I.2.5.A',1,'갑상선엽절제술 이후에 갑상선분화암으로 진단받은 환자가 갑상선전절제술의 적응증에 해당하면 갑상선완료절제술을 고려한다.')}${R('I.2.5.B',1,'갑상선완료절제술 시행 시 임상적으로 중앙경부 림프절전이가 있다면 치료적 중앙경부 림프절절제술을 시행한다.')}${R('I.2.5.C',2,'갑상선분화암 환자에서 띠근육에 국한된 육안적 갑상선외부침범(gross extrathyroidal extension [ETE])이 확인되는 경우, 재발 또는 사망 감소 효과와 합병증 증가 위험을 고려하여 수술 중 갑상선전절제술로의 전환 또는 갑상선완료절제술을 선택적으로 시행할 수 있다.')}${R('I.2.5.D',2,'갑상선엽절제술 후 현미경상 혈관침습 소견을 보인 갑상선유두암 환자에서, 국소 재발 및 전이 감소 효과와 합병증 위험도를 고려하여 갑상선완료절제술을 선택적으로 시행할 수 있다.')}${R('I.2.5.E',3,'갑상선완료절제술의 대안으로 방사성요오드 치료를 시행하지 않는다.')}`},
tgmol:{kind:'Part I. 초기 치료', sec:'I.5.3–I.5.4', title:'수술 후 갑상선글로불린과 분자표지자검사', next:['risk'], body:`<h4>I.5.3 수술 후 혈청 갑상선글로불린</h4>${R('I.5.3.A',1,'수술 후 질병이나 잔여갑상선의 존재를 평가하고 질병의 잠재적 재발을 예측하기 위해 혈청 갑상선글로불린(TSH-비자극 혹은 TSH-자극) 측정을 권고한다.')}
<ul class="small"><li>전절제+RAI 잔여제거 시 자극 Tg 1–2 ng/mL 이상이면 재발 위험이 높고, 10–30 ng/mL 이상이면 낮은 생존율과 관련된다. 1–2 ng/mL 이하는 관해의 강력한 예측지표이다.</li>
<li>RAI 시행 여부를 결정하는 Tg 기준값은 정해져 있지 않다. 수술 후 Tg는 RAI가 불필요한 환자보다 필요한 환자를 찾는 데 더 유용하다.</li>
<li>엽절제 후 Tg &gt;20 ng/mL에서 56% 재발, Tg 증가 추세에서 22% 재발. 전절제(RAI 없음) 후 Tg &gt;1 ng/mL 재발 5.9%, ≤1 ng/mL 0.4%</li></ul>
<h4>I.5.4 분자표지자검사</h4>${R('I.5.4.A',2,'수술 후 예후를 예측하기 위해 BRAF<sup>V600E</sup>, RAS, TERT 프로모터 돌연변이에 대한 검사를 고려할 수 있다.')}
<p class="small">BRAF<sup>V600E</sup>와 TERT 프로모터 또는 RAS와 TERT 프로모터 변이가 동반되면 고위험군으로 분류한다. 변이 유전자의 종류와 변이 분률에 따라 재발 위험도가 달라질 수 있다.</p>`},
rai:{kind:'Part I. 초기 치료', sec:'I.6', title:'갑상선절제술 후 방사성요오드 치료', next:['tsh','fuexam'], body:`<h4>I.6.1 치료 결정을 위한 수술 후 평가</h4>${R('I.6.1.A',1,'수술 후 방사성요오드 치료는 수술 후 잔존 병소 여부, 수술 후 병기 및 재발위험도를 고려하여 결정한다.')}${R('I.6.1.B',3,'수술 후 진단 목적의 방사성요오드 전신스캔은 방사성요오드 치료 여부나 용량을 결정하기 위해 선택적으로 시행할 수 있다.')}${CC('수술 소견이나 경부 초음파검사로 잔여갑상선 또는 잔존 병소 여부 또는 범위를 정확히 알 수 없을 때 등')}${R('I.6.1.C',1,'방사성요오드 전신스캔 평면 영상에서 비정상적인 섭취가 의심되는 경우, SPECT/CT (single-photon emission computed tomography/computed tomography)를 추가로 시행한다.')}
<h4>I.6.2 치료 대상</h4>${R('I.6.2.A',2,'저위험군 갑상선분화암 환자에서 일률적인 방사성요오드 잔여갑상선제거술은 권고되지 않는다.')}${CC('개별적 재발 위험인자 및 질병 추적에의 영향을 고려하여 치료 여부를 결정한다.')}${R('I.6.2.B',2,'중간위험군 갑상선분화암 환자에서는 위험인자를 종합적으로 고려한 재발위험도에 따라서 방사성요오드 치료(잔여갑상선제거술 또는 보조치료)를 고려한다.')}${R('I.6.2.C',1,'고위험군 갑상선분화암 환자에게는 방사성요오드 치료(보조치료 또는 알려진 병소의 치료)를 시행한다.')}
<h4>I.6.3 투여 용량</h4>${R('I.6.3.A',1,'방사성요오드 잔여갑상선제거술(remnant ablation)이 필요한 경우에는 일반적으로 30-50 mCi (1.11-1.75 GBq) 용량의 방사성요오드를 투여한다.')}${R('I.6.3.B',2,'보조치료(adjuvant therapy)가 필요한 경우에는 병리 소견, 혈청 갑상선글로불린, 돌연변이 등 재발 위험인자와 연령, 동반질환 등의 상황을 종합적으로 평가하여 30-100 mCi (1.11-3.7 GBq)의 방사성요오드를 투여한다.')}${R('I.6.3.C',2,'알려진 병소의 치료(treatment of known disease)에는 100 mCi (3.7 GBq) 이상의 방사성요오드를 투여한다.')}
<div class="tbl"><table><thead><tr><th>목적</th><th>대상</th><th>용량</th></tr></thead><tbody>
<tr><td>잔여갑상선제거술</td><td>저위험·일부 중간위험</td><td>30–50 mCi (1.11–1.75 GBq)</td></tr>
<tr><td>보조치료</td><td>중간·고위험</td><td>30–100 mCi (1.11–3.7 GBq)</td></tr>
<tr><td>알려진 병소의 치료</td><td>잔존·전이 병소</td><td>≥100 mCi (3.7 GBq)</td></tr></tbody></table></div>
<p class="small">HiLo, ESTIMABL1 연구에서 30 mCi와 100 mCi는 잔여제거 성공률과 재발률이 비슷했다. ESTIMABL2(N0/Nx인 pT1a–b)에서는 RAI를 시행하지 않은 군과 시행한 군 사이에 3년간 기능적·구조적·생화학적 이상 발생에 차이가 없었다.</p>
<h4>I.6.4 투여 전 준비</h4>${R('I.6.4.A',1,'방사성요오드 치료나 진단스캔 전, 혈중 TSH 농도를 자극한다. 이때, TSH 상승 정도를 평가하기 위해 방사성요오드 투여 전에 TSH를 측정한다.')}${R('I.6.4.B',2,'방사성요오드 치료나 진단스캔을 시행하기 전 적절한 저요오드 식이를 시행한다.')}
<h5>(1) TSH 자극</h5>${R('I.6.4.C',1,'방사성요오드 치료 및 진단스캔 전 TSH 자극을 위해 LT4 중단 혹은 rhTSH 주사를 사용한다.')}${R('I.6.4.D',1,'잔여갑상선제거 또는 보조치료 목적으로 갑상선분화암 환자에게 방사성요오드 치료 시 동반질환 및 삶의 질을 고려하여 LT4 중단에 비해 rhTSH 사용을 우선적으로 권고한다.')}${R('I.6.4.E',3,'알려진 병소에 대한 치료(treatment of known disease) 목적으로 갑상선암 환자에게서 방사성요오드 치료 시 전처치 목적의 rhTSH는 개별 임상적 상황에 따른 환자의 이득과 위해를 고려하여 결정한다.')}${R('I.6.4.F',1,'LT4 중단 방법으로 TSH를 자극하기 위해서는 방사성요오드 치료나 진단스캔 시행 전에 LT4를 3-4주간 중단하거나, 2-3주간 LT3로 변경하여 사용한 후 최소한 2주간 중단한다.')}${R('I.6.4.G',3,'LT4 중단 시 적절한 방사성요오드 치료 혹은 진단스캔을 위해서 TSH가 30 mIU/L 이상이 되도록 한다.')}
<h5>(2) 저요오드 식이</h5>${R('I.6.4.H',2,'방사성요오드 치료 혹은 진단검사 전 1-2주 정도의 저요오드 식이를 시행한다.')}
<h4>I.6.5 치료 후 전신스캔</h4>${R('I.6.5.A',1,'갑상선분화암 환자에서 치료를 위해 방사성요오드를 투여한 후에는 질병의 병기에 대한 정보를 얻고 병소의 방사성요오드 섭취능력을 파악하기 위해 치료 후 전신스캔을 시행한다.')}${R('I.6.5.B',1,'갑상선분화암 환자의 치료 후 방사성요오드 전신스캔의 평면 영상에서 비정상적인 섭취가 의심되는 경우, SPECT/CT 추가 시행을 권고한다.')}`},
ebrt:{kind:'Part I. 초기 치료', sec:'I.7', title:'수술 후 외부 방사선조사와 항암 치료', next:[], body:`<h4>I.7.1 외부 방사선조사</h4>${R('I.7.1.A',2,'갑상선분화암에서 초기 수술로 병소가 완전히 제거되었을 경우 외부 방사선조사의 역할은 없다.')}${R('I.7.1.B',2,'수술로 불완전하게 절제되었거나 반복적으로 재발하는 경우 선택적으로 보조적인 외부 방사선조사를 시행할 수 있다.')}${R('I.7.1.C',3,'수술 후 방사성요오드 치료 이후 재발 위험이 높을 것으로 예상되는 경우 선택적으로 보조적인 외부 방사선조사를 시행할 수 있다.')}
<h4>I.7.2 항암화학요법</h4>${R('I.7.2.A',2,'갑상선분화암 환자에서 보조적인 항암제의 일률적 사용에 대한 역할은 없다.')}`},
tsh:{kind:'Part II. 추적', sec:'II.2', title:'추적 중 TSH 목표 농도', next:['ors'], body:`<h4>II.2.2 초기위험군에 따른 초기 TSH 목표</h4>${R('II.2.2.A',1,'저위험군 갑상선분화암 환자에서 초기 혈청 TSH 억제(＜0.1 mIU/L)를 권고하지 않는다.')}${R('II.2.2.B',3,'저위험군 갑상선분화암 환자에서 초기 혈청 TSH 목표 농도는 0.5-2 mIU/L를 고려한다.')}${R('II.2.2.C',2,'중간위험군 갑상선분화암 환자에서 초기 혈청 TSH 억제(＜0.1 mIU/L)를 권고하지 않는다.')}${R('II.2.2.D',3,'중간위험군 갑상선분화암 환자에서는 초기 혈청 TSH 목표 농도를 동반된 위험인자에 따라 0.1-2.0 mIU/L를 고려한다.')}${R('II.2.2.E',1,'고위험군 갑상선분화암 환자는 초기 혈청 TSH 농도를 0.1 mIU/L 미만으로 유지한다.')}
<h4>II.2.3 ORS에 따른 추적 중 TSH 목표</h4>${R('II.2.3.A',2,'완전반응을 보인 환자에서는 TSH 억제는 필요하지 않으며, 혈청 TSH 목표 농도는 0.5-2.0 mIU/L를 고려한다.')}${R('II.2.3.B',2,'생화학적 불완전반응 또는 불명확반응을 보이는 환자에서, 혈청 TSH는 초기 재발위험도, 혈청 갑상선글로불린 수치와 그 변화 추이, TSH 억제 치료의 위험도를 고려하여 결정한다.')}<div class="subrecs">${RS('B1',3,'엽절제술 후 저위험군 환자에서 생화학적 불완전반응을 보인 경우, 혈청 TSH 농도를 0.5-2.0 mIU/L로 유지한다.')}${RS('B2',2,'갑상선전절제술 후 방사성요오드 치료를 받지 않은 초기 저위험군 환자에서 치료 후 생화학적 불완전 또는 불명확반응을 보인 경우, 혈청 TSH 농도를 0.5-2.0 mIU/L로 유지한다.')}${RS('B3',2,'초기 중간위험군 환자에서 생화학적 불완전반응 또는 불명확반응을 보인 경우 초기 TSH 농도를 0.1-0.5 mIU/L로 유지하고, 이후 TSH 억제 정도를 완화한다.')}${RS('B4',2,'초기 고위험군 환자에서 갑상선전절제술과 방사성요오드 치료 후 생화학적 불완전반응 또는 불명확반응을 보인 경우 초기 5년 동안 혈청 TSH 농도를 0.1-0.5 mIU/L로 유지하고, 이후 TSH 억제 정도를 완화한다.')}</div>${R('II.2.3.C',1,'구조적 불완전반응을 보이는 환자에서는 금기사항이 없으면 혈청 TSH 농도는 0.1 mIU/L 미만으로 유지한다.')}
<h4>TSH 목표 농도 요약 (mIU/L, Table II.2.1.A)</h4>
<div class="tbl"><table><thead><tr><th>초기위험군</th><th>초기</th><th>완전</th><th>불명확</th><th>생화학적 불완전</th><th>구조적 불완전</th></tr></thead><tbody>
<tr><td>고위험</td><td>&lt;0.1</td><td>0.5–2</td><td>0.1–0.5<br>(5년 후 완화 고려)</td><td>0.1–0.5<br>(5년 후 완화 고려)</td><td>&lt;0.1</td></tr>
<tr><td>중간위험</td><td>0.1–2.0</td><td>0.5–2.0</td><td>0.1–0.5<br>(추적 중 완화)</td><td>0.1–0.5<br>(추적 중 완화)</td><td>&lt;0.1</td></tr>
<tr><td>저위험</td><td>0.5–2.0</td><td>0.5–2.0</td><td>0.5–2.0</td><td>0.5–2.0</td><td>&lt;0.1</td></tr></tbody></table></div>
<p class="small">TSH 억제 목표는 나이와 동반 질환을 고려하여 결정한다(II.2.4).</p>
<h4>TSH 억제의 위해</h4>
<ul class="small"><li>심혈관: 심박수 상승, 좌심실 질량 증가, 이완기 기능 저하, 동맥 탄성 감소, 심방세동·심부전·관상동맥질환. 고령일수록 위험 증가</li>
<li>골격: 폐경 후 여성에서 골밀도 감소와 골다공증 증가. 특히 TSH &lt;0.1 mIU/L에서 뚜렷</li>
<li>따라서 모든 환자의 TSH를 일률적으로 0.1 mIU/L 이하로 억제하지 않는다.</li></ul>`},
fuexam:{kind:'Part II. 추적', sec:'II.3', title:'추적검사 방법', next:['ors'], body:`<h4>II.3.1 갑상선기능검사</h4>${R('II.3.1.A',2,'갑상선호르몬(LT4)을 복용하는 모든 환자에게 12개월 간격 이하로 혈청 TSH와 갑상선호르몬 농도를 측정한다.')}${R('II.3.1.B',2,'LT4를 복용하기 전에 측정한 혈청 유리 T<sub>4</sub>를 가능한 정상 범위로 유지한다.')}${R('II.3.1.C',2,'목표 혈중 TSH 농도를 유지할 수 있는 최소 용량의 LT4를 투여한다.')}
<h4>II.3.2 혈청 Tg와 Tg항체</h4>${R('II.3.2.A',1,'혈청 갑상선글로불린 농도는 동일한 검사법으로 추적하고, 동시에 측정한 혈청 갑상선글로불린항체를 고려하여 평가한다.')}${R('II.3.2.B',2,'갑상선전절제술 후 방사성요오드 잔여갑상선제거술을 받은 갑상선분화암 환자에서는 주기적으로 TSH-비자극 갑상선글로불린을 측정한다.')}${CC('TSH-비자극 갑상선글로불린은 0.2 ng/mL 이하까지 측정 가능한 민감한 방법을 사용하여 측정한다.')}${R('II.3.2.C',2,'갑상선전절제술 후 방사성요오드 잔여갑상선제거술을 받은 갑상선분화암 환자에서 임상 소견에 따라 TSH-자극 혈청 갑상선글로불린을 측정할 수 있다.')}${R('II.3.2.D',2,'갑상선전절제술 후 방사성요오드 잔여갑상선제거술을 받지 않은 갑상선분화암 환자는 TSH-비자극 혈청 갑상선글로불린을 주기적으로 측정한다.')}${R('II.3.2.E',2,'갑상선엽절제술을 시행 받은 갑상선분화암 환자에서 TSH-비자극 혈청 갑상선글로불린의 주기적인 측정을 고려한다.')}${R('II.3.2.F',2,'갑상선전절제술 후 방사성요오드 잔여갑상선제거술을 받지 않았거나, 엽절제술을 시행 받은 환자에서는 TSH-자극 혈청 갑상선글로불린검사는 권고되지 않는다.')}
<h4>II.3.3 경부 초음파</h4>${R('II.3.3.A',1,'갑상선암 수술 후 갑상선 수술부위 재발암과 경부 전이림프절을 평가하기 위해서 경부 초음파검사를 시행한다.')}
<h4>II.3.4 초음파 유도하 FNA 및 세척액-Tg</h4>${R('II.3.4.A',2,'갑상선암의 갑상선 수술부위 재발 및 경부 전이림프절이 초음파에서 의심되는 경우에 초음파 유도하 세침흡인검사를 시행할 수 있다.')}${R('II.3.4.B',2,'갑상선암의 갑상선 수술부위 재발 및 경부 전이림프절이 초음파에서 의심되는 경우에 초음파 유도하 세침흡인검사의 흡인액에서 갑상선글로불린검사를 시행할 수 있다.')}
<p class="small">2021 대한갑상선영상의학회: 단경 3–5 mm 초과이면서 전이 의심 소견, 또는 단경 5 mm 초과이면서 미결정 소견인 림프절에서 FNA를 권고한다.</p>
<h4>II.3.5 경부 및 흉부 CT</h4>${R('II.3.5.A',3,'갑상선 수술 후 초음파검사에서 갑상선 수술부위 재발암 및 경부 전이림프절이 의심되는 경우, 조영증강 경부 CT 추가 검사를 고려할 수 있다.')}${R('II.3.5.B',3,'경부 초음파검사는 음성이지만 혈청 갑상선글로불린이 상승되어 있는 경우, 크기가 크고 광범위해서 초음파로는 병소를 완전하게 파악하기 힘든 경우, 호흡기 또는 소화기 장기 침범이 의심되는 병소 등은 조영증강 경부 CT를 고려할 수 있다.')}${R('II.3.5.C',3,'고위험도 환자나 혈청 갑상선글로불린 또는 갑상선글로불린항체 수치가 상승하는 경우 흉부 CT를 고려할 수 있다.')}
<h4>II.3.6 진단적 방사성요오드 전신스캔</h4>${R('II.3.6.A',2,'갑상선분화암 환자가 방사성요오드 치료 후 전신스캔에서 갑상선 부위 이외에 비정상적 섭취 등 특정 조건을 보이는 경우 지속적위험분류(ORS)를 위해서 진단적 방사성요오드 전신스캔을 시행할 수 있다.')}${R('II.3.6.B',1,'저위험군 갑상선분화암 환자가 방사성요오드 치료 후 완전반응을 보이는 경우, 추적관찰 중 진단적 방사성요오드 전신스캔은 권고되지 않는다.')}${R('II.3.6.C',2,'중간 및 고위험군 갑상선분화암 환자의 경우 방사성요오드 보조치료 후 치료 반응 평가를 위해 6-12개월에 진단적 방사성요오드 전신스캔을 고려한다.')}${R('II.3.6.D',2,'중간 및 고위험군 환자가 전신스캔검사를 포함한 평가에서 완전반응을 보이는 경우, 추적 관찰 중에 추가적인 진단적 방사성요오드 전신스캔은 일반적으로 권고하지 않는다.')}${CC('추적 관찰 중 ORS 결과에 따라 추가적인 진단적 방사성요오드 전신스캔을 고려할 수 있다.')}${R('II.3.6.E',1,'진단적 방사성요오드 전신스캔의 평면 영상에서 비정상적인 섭취가 의심되는 경우, SPECT/CT 추가 시행을 권고한다.')}
<p class="small">진단적 스캔을 시행할 경우: 가) 치료 후 스캔에서 갑상선 부위 외 비정상 섭취, 나) 잔여 갑상선 섭취가 많아 경부 림프절 평가가 어려운 경우, 다) Tg항체 양성으로 Tg를 신뢰하기 어려운 경우. 진단 목적으로는 <sup>131</sup>I보다 <sup>123</sup>I을 선호한다.</p>
<h4>II.3.7 <sup>18</sup>F-FDG PET/CT</h4>${R('II.3.7.A',1,'수술 후 갑상선분화암 환자에서 혈청 갑상선글로불린(또는 갑상선글로불린항체) 수치가 높지만, 방사성요오드 스캔이 음성인 경우 <sup>18</sup>F-FDG PET/CT 스캔을 고려한다.')}${R('II.3.7.B',3,'<sup>18</sup>F-FDG PET/CT 스캔은 다음의 경우에도 고려할 수 있다.')}<ul class="small rl"><li>B1. 전이병소가 있는 환자에서 병소를 확인</li><li>B2. 급속한 병의 진행이나 암에 의한 사망의 위험이 높은 환자에서 예후를 예측하고자 하는 경우</li><li>B3. 잔존 혹은 재발성 병소의 전신 또는 국소 치료 후 치료 반응을 평가하는 경우</li><li>B4. 방사성요오드 불응성으로 의심되며 구조적 병소가 있는 경우</li></ul>
<p class="small">Tg(또는 항체) 상승·RAI 스캔 음성에서 민감도 86–93%, 특이도 81–85%. 분화도가 나쁘거나 공격적 조직형에서 민감도가 높다.</p>`},
ors:{kind:'Part II. 추적', sec:'II.1', title:'치료 반응에 따른 질병 상태 재평가 (ORS)', next:['er','ind','bir','sir'], nextLabel:'반응 범주', body:`${R('II.1.A',3,'초기 치료가 완료된 후, 임상적, 생화학적, 영상학적 소견을 종합하여 지속적으로 질병 상태를 재평가한다(지속적위험분류, ORS).')}${R('II.1.B',3,'초기위험군과 지속적위험분류 평가결과를 종합하여, TSH 목표 농도와 추적 검사의 방법과 간격 및 추가 치료 전략을 결정한다.')}
<p>ORS는 초기 치료 후 임상, 생화학, 영상 소견에 따라 반응을 4가지로 분류하며 추적 전 기간에 걸쳐 반복 적용한다. 동적위험분류(DRS)를 포함하는 개념이며, 엽절제나 RAI를 받지 않은 환자도 분류 대상이다.</p>
<h4>반응 범주 정의 (Table II.1.A)</h4><div class="tbl"><table><thead><tr><th>분류</th><th>전절제 + RAI</th><th>전절제, RAI 없음</th><th>엽절제</th></tr></thead><tbody>
<tr><td>완전반응</td><td>비자극 Tg &lt;0.2<br>자극 Tg &lt;1<br>TgAb 음성</td><td>비자극 Tg &lt;0.2<br>TgAb 음성</td><td>안정적 Tg<br>TgAb 음성</td></tr>
<tr><td>불명확반응</td><td>비특이적 영상<br>비자극 Tg 0.2–1<br>자극 Tg 1–10<br>TgAb 검출되나 안정·감소</td><td>비특이적 영상<br>비자극 Tg 0.2–5<br>TgAb 검출되나 안정·감소</td><td>비특이적 영상<br>TgAb 검출되나 안정·감소</td></tr>
<tr><td>생화학적 불완전</td><td>비자극 Tg ≥1<br>자극 Tg ≥10<br>TgAb 증가</td><td>비자극 Tg ≥5<br>TgAb 증가</td><td>유사 TSH에서 Tg 증가<br>TgAb 증가</td></tr>
<tr><td>구조적 불완전</td><td colspan="3">Tg·TgAb와 무관하게 국소 병소 또는 원격전이가 지속되거나 새로 확인됨</td></tr></tbody></table></div>
<p class="small">Tg 단위 ng/mL. 기준치는 2019 ESMO 권고안에 기반하였다. 완전반응은 구조적 병소가 없어야 한다.</p>
<p class="small">초기위험군과 ORS를 함께 고려하여 TSH 목표, 추적 방법·간격, 추가 치료를 결정한다(Table II.2.1.A).</p>`},
er:{kind:'ORS 범주', sec:'II.1.1', title:'완전반응 (excellent response)', next:['fu2'], body:`<p>임상적, 생화학적, 구조적으로 질환의 증거가 없는 경우이다. 전절제+RAI 후 비자극 Tg &lt;0.2, 자극 Tg &lt;1 ng/mL, TgAb 음성을 모두 만족한다.</p>
<h4>TSH 목표</h4>${R('II.2.3.A',2,'완전반응을 보인 환자에서는 TSH 억제는 필요하지 않으며, 혈청 TSH 목표 농도는 0.5-2.0 mIU/L를 고려한다.')}
<h4>추적</h4>${R('II.4.2.A',3,'완전반응을 보이는 저위험군 및 중간위험군 환자에서는 1-2년마다 TSH-비자극 갑상선글로불린을 측정한다.')}${R('II.4.2.B',2,'완전반응을 보이는 저위험군 또는 중간위험군 환자에게 TSH-자극 갑상선글로불린을 추적 검사하지 않는다.')}${R('II.4.2.C',3,'완전반응을 보인 고위험군 환자에서는 6-12개월 간격으로 TSH-비자극 갑상선글로불린을 측정한다.')}${R('II.4.2.D',2,'완전반응을 보인 고위험군 환자에서는 TSH-자극검사 대신 TSH-비자극 갑상선글로불린 검사를 시행할 수 있다.')}${CC('<ul><li>장기 추적 중 갑상선글로불린 측정 간격은 임상상과 추적 기간 등을 고려하여 변경할 수 있다.</li><li>갑상선글로불린을 측정할 때에는 갑상선글로불린항체를 동시에 측정한다.</li><li>추적 검사로 주기적인 경부 초음파와 필요한 경우 추가적인 영상검사를 고려한다.</li></ul>')}
<h4>TSH와 추적 요약 (Table II.2.1.A)</h4><div class="tbl"><table><thead><tr><th>초기위험군</th><th>TSH (mIU/L)</th><th>Tg·TgAb</th><th>경부 초음파</th></tr></thead><tbody><tr><td>고위험</td><td>0.5–2</td><td>6–12개월마다</td><td>필요 시 6–12개월마다</td></tr><tr><td>중간위험</td><td>0.5–2.0</td><td>1–2년마다</td><td>필요 시 3–5년마다</td></tr><tr><td>저위험</td><td>0.5–2.0</td><td>1–2년마다</td><td>Tg·항체 값에 따라</td></tr></tbody></table></div>
<p class="small">초기 저·중간위험 유두암이 완전반응이면 1–2년 주기로 진찰, 경부 초음파, Tg·항체로 추적한다. 일차 치료 5–8년 후까지 완전반응이면 일상적 초음파 없이 1–2년마다 임상 평가와 Tg로 추적할 수 있다는 보고가 있다.</p>`},
ind:{kind:'ORS 범주', sec:'II.1.4', title:'불명확반응 (indeterminate response)', next:['fu2'], body:`<p>비특이적인 생화학적 또는 구조적 결과로 양성·악성을 확실히 분류하기 어려운 경우이다(비특이적 영상, 비자극 Tg 0.2–1, 자극 Tg 1–10 ng/mL, TgAb가 검출되나 안정적이거나 감소).</p>
<h4>TSH 목표</h4>${R('II.2.3.B',2,'생화학적 불완전반응 또는 불명확반응을 보이는 환자에서, 혈청 TSH는 초기 재발위험도, 혈청 갑상선글로불린 수치와 그 변화 추이, TSH 억제 치료의 위험도를 고려하여 결정한다.')}<div class="subrecs">${RS('B1',3,'엽절제술 후 저위험군 환자에서 생화학적 불완전반응을 보인 경우, 혈청 TSH 농도를 0.5-2.0 mIU/L로 유지한다.')}${RS('B2',2,'갑상선전절제술 후 방사성요오드 치료를 받지 않은 초기 저위험군 환자에서 치료 후 생화학적 불완전 또는 불명확반응을 보인 경우, 혈청 TSH 농도를 0.5-2.0 mIU/L로 유지한다.')}${RS('B3',2,'초기 중간위험군 환자에서 생화학적 불완전반응 또는 불명확반응을 보인 경우 초기 TSH 농도를 0.1-0.5 mIU/L로 유지하고, 이후 TSH 억제 정도를 완화한다.')}${RS('B4',2,'초기 고위험군 환자에서 갑상선전절제술과 방사성요오드 치료 후 생화학적 불완전반응 또는 불명확반응을 보인 경우 초기 5년 동안 혈청 TSH 농도를 0.1-0.5 mIU/L로 유지하고, 이후 TSH 억제 정도를 완화한다.')}</div>
<h4>추적</h4>${R('II.4.2.E',3,'불명확반응을 보이는 저위험군 환자는 1-2년마다 갑상선글로불린을 측정한다.')}${R('II.4.2.F',3,'불명확반응을 보이는 중간위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}${R('II.4.2.G',3,'불명확반응을 보이는 고위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}
<h4>TSH와 추적 요약 (Table II.2.1.A)</h4><div class="tbl"><table><thead><tr><th>초기위험군</th><th>TSH (mIU/L)</th><th>Tg·TgAb</th><th>경부 초음파</th></tr></thead><tbody><tr><td>고위험</td><td>0.1–0.5 (5년 후 완화 고려)</td><td>6–12개월마다</td><td>6–12개월마다</td></tr><tr><td>중간위험</td><td>0.1–0.5 (추적 중 완화)</td><td>6–12개월마다</td><td>6–12개월마다</td></tr><tr><td>저위험</td><td>0.5–2.0</td><td>1–2년마다</td><td>Tg·항체 값에 따라</td></tr></tbody></table></div>
<p class="small">다른 반응 범주로 재분류할 수 있을 때까지 비특이적 병소에 대한 영상검사와 Tg·항체를 주기적으로 확인하며 경과관찰한다.</p>`},
bir:{kind:'ORS 범주', sec:'II.1.2', title:'생화학적 불완전반응 (biochemical incomplete response)', next:['fu2'], body:`<p>구조적 병소 없이 Tg가 비정상이거나 TgAb가 상승하는 경우이다(전절제+RAI 후 비자극 Tg ≥1, 자극 Tg ≥10 ng/mL, TgAb 증가). 갑상선분화암 환자의 15–20%에서 나타난다.</p>
<h4>TSH 목표</h4>${R('II.2.3.B',2,'생화학적 불완전반응 또는 불명확반응을 보이는 환자에서, 혈청 TSH는 초기 재발위험도, 혈청 갑상선글로불린 수치와 그 변화 추이, TSH 억제 치료의 위험도를 고려하여 결정한다.')}<div class="subrecs">${RS('B1',3,'엽절제술 후 저위험군 환자에서 생화학적 불완전반응을 보인 경우, 혈청 TSH 농도를 0.5-2.0 mIU/L로 유지한다.')}${RS('B2',2,'갑상선전절제술 후 방사성요오드 치료를 받지 않은 초기 저위험군 환자에서 치료 후 생화학적 불완전 또는 불명확반응을 보인 경우, 혈청 TSH 농도를 0.5-2.0 mIU/L로 유지한다.')}${RS('B3',2,'초기 중간위험군 환자에서 생화학적 불완전반응 또는 불명확반응을 보인 경우 초기 TSH 농도를 0.1-0.5 mIU/L로 유지하고, 이후 TSH 억제 정도를 완화한다.')}${RS('B4',2,'초기 고위험군 환자에서 갑상선전절제술과 방사성요오드 치료 후 생화학적 불완전반응 또는 불명확반응을 보인 경우 초기 5년 동안 혈청 TSH 농도를 0.1-0.5 mIU/L로 유지하고, 이후 TSH 억제 정도를 완화한다.')}</div>
<h4>추적</h4>${R('II.4.2.H',3,'생화학적 불완전반응을 보이는 저위험군 환자는 1-2년마다 갑상선글로불린을 측정한다.')}${R('II.4.2.I',3,'생화학적 불완전반응을 보이는 중간위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}${R('II.4.2.J',3,'생화학적 불완전반응을 보이는 고위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}${R('II.4.2.K',2,'갑상선전절제술 후 방사성요오드 잔여절제술을 받은 저위험군 또는 중간위험군 환자가 생화학적 불완전반응을 보이는 경우, 방사성요오드 전신스캔 시행과 함께, 또는 단독으로 TSH-자극 갑상선글로불린 검사를 시행할 수 있다.')}${R('II.4.2.L',3,'생화학적 불완전반응을 보인 환자에서 TSH-비자극 갑상선글로불린 농도가 감소하는 경우, 재발위험도 재평가를 위하여 TSH-자극 갑상선글로불린을 측정할 수 있다.')}
<h4>TSH와 추적 요약 (Table II.2.1.A)</h4><div class="tbl"><table><thead><tr><th>초기위험군</th><th>TSH (mIU/L)</th><th>Tg·TgAb</th><th>경부 초음파</th></tr></thead><tbody><tr><td>고위험</td><td>0.1–0.5 (5년 후 완화 고려)</td><td>6–12개월마다</td><td>6–12개월마다</td></tr><tr><td>중간위험</td><td>0.1–0.5 (추적 중 완화)</td><td>6–12개월마다</td><td>6–12개월마다</td></tr><tr><td>저위험</td><td>0.5–2.0</td><td>1–2년마다</td><td>Tg·항체 값에 따라</td></tr></tbody></table></div>
<p class="small">Tg가 상승하면서 경부 초음파가 음성이면 CT, <sup>18</sup>F-FDG PET/CT 등 추가 영상검사를 고려한다(II.3.5–II.3.7).</p>`},
sir:{kind:'ORS 범주', sec:'II.1.3', title:'구조적 불완전반응 (structural incomplete response)', next:['adv'], body:`<p>Tg 또는 TgAb 수치와 관계없이 국소 병소나 원격전이가 지속되거나 새로 확인된 경우이다. RAI 스캔, 경부 초음파, CT, <sup>18</sup>F-FDG PET/CT 등에서 구조적·기능적 병소가 발견된 경우로 정의한다.</p>
<h4>TSH 목표</h4>${R('II.2.3.C',1,'구조적 불완전반응을 보이는 환자에서는 금기사항이 없으면 혈청 TSH 농도는 0.1 mIU/L 미만으로 유지한다.')}
<h4>추적</h4>${R('II.4.2.M',3,'구조적 불완전반응을 보인 환자는 3-6개월마다 TSH-비자극 갑상선글로불린을 측정한다.')}${CC('<ul><li>갑상선글로불린을 측정할 때에는 갑상선글로불린항체를 동시에 측정한다.</li><li>질병 상태에 따라 필요한 영상검사를 시행한다.</li></ul>')}
<h4>TSH와 추적 요약 (Table II.2.1.A)</h4><div class="tbl"><table><thead><tr><th>초기위험군</th><th>TSH (mIU/L)</th><th>Tg·TgAb</th><th>경부 초음파</th></tr></thead><tbody><tr><td>모든 위험군</td><td>&lt;0.1</td><td>3–6개월마다</td><td>3–6개월마다</td></tr></tbody></table></div>
<p class="small">병소의 크기, 위치, 성장 속도, RAI 섭취 여부, 이전 치료 반응에 따라 수술, RAI, 외부 방사선, 표적치료제 등을 시행하거나 경과관찰한다.</p>`},
fu2:{kind:'Part II. 추적', sec:'II.4', title:'질병 상태 평가에 따른 추적검사', next:['ors'], nextLabel:'재평가', body:`<h4>II.4.1 초기위험군에 따른 초기 추적</h4>${R('II.4.1.A',2,'초기 추적에서 TSH-비자극 갑상선글로불린은 저위험군 또는 중간위험군에서는 6-12개월 간격으로, 고위험군 환자에서는 6개월 이내의 간격으로 측정한다.')}
<h4>II.4.2 ORS에 따른 추적</h4>
<h5>완전반응</h5>${R('II.4.2.A',3,'완전반응을 보이는 저위험군 및 중간위험군 환자에서는 1-2년마다 TSH-비자극 갑상선글로불린을 측정한다.')}${R('II.4.2.B',2,'완전반응을 보이는 저위험군 또는 중간위험군 환자에게 TSH-자극 갑상선글로불린을 추적 검사하지 않는다.')}${R('II.4.2.C',3,'완전반응을 보인 고위험군 환자에서는 6-12개월 간격으로 TSH-비자극 갑상선글로불린을 측정한다.')}${R('II.4.2.D',2,'완전반응을 보인 고위험군 환자에서는 TSH-자극검사 대신 TSH-비자극 갑상선글로불린 검사를 시행할 수 있다.')}${CC('<ul><li>장기 추적 중 갑상선글로불린 측정 간격은 임상상과 추적 기간 등을 고려하여 변경할 수 있다.</li><li>갑상선글로불린을 측정할 때에는 갑상선글로불린항체를 동시에 측정한다.</li><li>추적 검사로 주기적인 경부 초음파와 필요한 경우 추가적인 영상검사를 고려한다.</li></ul>')}
<h5>불명확반응</h5>${R('II.4.2.E',3,'불명확반응을 보이는 저위험군 환자는 1-2년마다 갑상선글로불린을 측정한다.')}${R('II.4.2.F',3,'불명확반응을 보이는 중간위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}${R('II.4.2.G',3,'불명확반응을 보이는 고위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}
<h5>생화학적 불완전반응</h5>${R('II.4.2.H',3,'생화학적 불완전반응을 보이는 저위험군 환자는 1-2년마다 갑상선글로불린을 측정한다.')}${R('II.4.2.I',3,'생화학적 불완전반응을 보이는 중간위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}${R('II.4.2.J',3,'생화학적 불완전반응을 보이는 고위험군 환자는 6-12개월 간격으로 갑상선글로불린을 측정한다.')}${R('II.4.2.K',2,'갑상선전절제술 후 방사성요오드 잔여절제술을 받은 저위험군 또는 중간위험군 환자가 생화학적 불완전반응을 보이는 경우, 방사성요오드 전신스캔 시행과 함께, 또는 단독으로 TSH-자극 갑상선글로불린 검사를 시행할 수 있다.')}${R('II.4.2.L',3,'생화학적 불완전반응을 보인 환자에서 TSH-비자극 갑상선글로불린 농도가 감소하는 경우, 재발위험도 재평가를 위하여 TSH-자극 갑상선글로불린을 측정할 수 있다.')}
<h5>구조적 불완전반응</h5>${R('II.4.2.M',3,'구조적 불완전반응을 보인 환자는 3-6개월마다 TSH-비자극 갑상선글로불린을 측정한다.')}${CC('<ul><li>갑상선글로불린을 측정할 때에는 갑상선글로불린항체를 동시에 측정한다.</li><li>질병 상태에 따라 필요한 영상검사를 시행한다.</li></ul>')}
<h4>Tg·TgAb 측정 간격 요약 (Table II.2.1.A)</h4>
<div class="tbl"><table><thead><tr><th>초기위험군</th><th>초기</th><th>완전</th><th>불명확</th><th>생화학적 불완전</th><th>구조적 불완전</th></tr></thead><tbody>
<tr><td>고위험</td><td>6개월 이내</td><td>6–12개월</td><td>6–12개월</td><td>6–12개월</td><td>3–6개월</td></tr>
<tr><td>중간위험</td><td>6–12개월 후</td><td>1–2년</td><td>6–12개월</td><td>6–12개월</td><td>3–6개월</td></tr>
<tr><td>저위험</td><td>6–12개월 후</td><td>1–2년</td><td>1–2년</td><td>1–2년</td><td>3–6개월</td></tr></tbody></table></div>
<p class="small">추가 영상검사(CT, <sup>18</sup>F-FDG PET/CT, 진단적 RAI 스캔)는 Tg·항체 증가 또는 임상적 재발·전이 의심 시 시행한다.</p>`},
adv:{kind:'Part III. 진행성 갑상선분화암', sec:'Part III', title:'진행성 갑상선분화암', next:['locoreg','rai2','rair','meta'], nextLabel:'치료 선택', body:`<p>진행성 갑상선분화암은 수술부위 재발, 경부 림프절전이, 원격전이 등 구조적 병소가 지속·재발한 상태이다. 병소의 위치와 범위, RAI 섭취 여부, 진행 속도, 증상에 따라 치료를 선택한다.</p>
${R('III.4.1.A',2,'진행성 국소 또는 전이성 갑상선분화암은 진행 과정 중 분화도 감소 및 방사성요오드 불응성 발생 가능성을 고려하여 치료 방침을 결정한다.')}
<h4>치료 선택의 개요</h4>
<ul><li>수술적 절제 가능한 경부 병소: 구역 림프절절제술(III.1)</li>
<li>수술 고위험 또는 거부: 고주파절제술 등 비수술적 치료(III.2)</li>
<li>RAI 섭취 병소: 방사성요오드 치료(III.3)</li>
<li>RAI 불응성이면서 진행 또는 증상: 국소 치료 우선 검토 후 전신항암치료(III.4)</li>
<li>폐·뼈·중추신경계 전이: 부위별 원칙(III.5)</li></ul>
<p class="small">천천히 자라는 무증상 병소는 TSH 억제 치료를 유지하며 경과관찰할 수 있다.</p>`},
locoreg:{kind:'Part III. 진행성 갑상선분화암', sec:'III.1–III.2', title:'수술부위 재발·경부 전이림프절의 치료', next:[], body:`<h4>III.1 수술적 치료</h4>${R('III.1.A',3,'이전에 림프절절제가 이루어지지 않은 구역에서 재발이 나타날 경우, 해당 구역 림프절 절제술(nodal clearance in a compartmental fashion)을 해야 한다.')}${R('III.1.B',3,'이전에 림프절절제가 이루어진 구역에서 재발이 나타날 경우, 해당 구역 림프절절제 (nodal clearance in a compartmental fashion)의 종양학적 이점과 합병증의 위험성을 고려한 후 림프절절제 범위를 결정해야 한다.')}
<p class="small">재수술 시 다발성·미세 전이 가능성을 고려하여 해당 구역을 모두 절제하며, 재발 림프절만 선택적으로 제거하는 방식(berry picking)은 가급적 피한다.</p>
<h4>III.2 비수술적 치료</h4>${R('III.2.A',2,'갑상선절제술 후 발생한 갑상선 수술부위 재발암 또는 경부 전이림프절에 대해서 수술의 합병증 발생 위험도가 높거나, 수술을 거부하는 경우 근치적 또는 완화적 목적으로 고주파절제술을 포함한 비수술적절제 치료를 고려할 수 있다.')}`},
rai2:{kind:'Part III. 진행성 갑상선분화암', sec:'III.3', title:'진행성 갑상선분화암의 방사성요오드 치료', next:['rair'], body:`<h4>III.3.1 치료 대상</h4>${R('III.3.1.A',1,'폐 미세전이(pulmonary micrometastasis)는 방사성요오드 치료를 우선적으로 시행한다.')}${R('III.3.1.B',1,'방사성요오드 섭취가 있고 임상적으로 반응이 있는 폐 미세전이는 6-12개월 간격으로 반복하여 방사성요오드 치료를 한다.')}${R('III.3.1.C',3,'방사성요오드 섭취가 있는 대결절 폐전이(macronodular pulmonary metastasis)는 방사성요오드 치료를 고려할 수 있다.')}${R('III.3.1.D',3,'방사성요오드 치료 후 전이병소의 크기나 혈청 갑상선글로불린의 감소와 같이 객관적 이득이 있는 대결절 폐전이는 방사성요오드 치료를 반복할 수 있다.')}${R('III.3.1.E',1,'방사성요오드를 섭취하는 뼈 전이는 방사성요오드 치료를 시행한다.')}${R('III.3.1.F',3,'방사성요오드 치료를 위한 TSH 자극에 의해서 뼈 전이 병소가 증상, 골절, 신경학적 합병증을 유발할 것으로 예상되는 부위에 존재하는 경우에는 방사성요오드 치료 전에 외부 방사선 조사 치료와 함께 스테로이드제 투여를 적극적으로 고려할 수 있다.')}
<h4>III.3.2 투여량</h4>${R('III.3.2.A',2,'지속/재발 병소에 대한 방사성요오드 치료 시 경험적 고용량 100-200 mCi (3.7-7.4 GBq) 투여하거나 또는 선량측정법으로 개별투여량을 계산하여 투여할 수 있다.')}${R('III.3.2.B',1,'70세 이상 고령 환자에서 골수의 최대허용 방사선흡수량을 초과할 가능성이 있으므로 신기능 및 전신상태를 고려하여 투여용량을 결정한다.')}
<h4>III.3.3 rhTSH 사용</h4>${R('III.3.3.A',3,'진행성 국소 혹은 원격전이 병소가 있는 갑상선분화암 환자에게 방사성요오드 치료 시 전처치 목적의 rhTSH의 사용은 개별 임상적 상황에 따른 환자의 이득과 위해를 고려하여 결정한다.')}${R('III.3.3.B',2,'LT4 중단 시 발생하는 갑상선기능저하가 기저질환을 악화시켜 위험을 초래할 수 있는 경우, 뇌하수체 질환이나 병소에서 생성된 갑상선호르몬으로 인하여 내인성 TSH를 충분히 상승시킬 수 없는 경우, 또는 치료 지연이 심각한 악영향을 초래하는 경우 등에서 rhTSH를 이용한 방사성요오드 치료를 우선 시행할 수 있다.')}
<h4>III.3.5 Tg 양성·스캔 음성 환자의 경험적 치료</h4>${R('III.3.5.A',2,'혈청 갑상선글로불린이 증가되어 있으며 방사성요오드 전신스캔 음성인 환자에서 구조적으로 분명한 병소가 없는 경우 경험적 방사성요오드 치료를 고려할 수 있다.')}${R('III.3.5.B',4,'혈청 갑상선글로불린이 증가되어 있으며 방사성요오드 전신스캔 음성인 환자에서 측정 가능한 구조적 병소(직경≥1 cm)가 있는 경우 경험적 방사성요오드 치료를 고려할 근거가 충분하지 않다.')}${CC('이 경우 경험적 방사성요오드 치료는 임상적 상황에 따른 이득과 위해를 고려하여 결정한다.')}
<p class="small"><sup>18</sup>F-FDG를 섭취하는 종양은 RAI를 잘 섭취하지 않아 경험적 치료가 효과적이지 않을 수 있으므로 PET/CT가 결정에 도움이 된다.</p>
<h4>III.3.6 합병증</h4>${R('III.3.6.A',4,'방사성요오드 치료 후 침샘 손상을 예방하는 방법들은 그 효과에 대한 근거가 충분하지 않다.')}${R('III.3.6.B',3,'방사성요오드 치료 후 구강건조증이 발생한 환자는 충치에 대한 치과적 예방 조치를 고려한다.')}${R('III.3.6.C',4,'방사성요오드 치료 후 침샘스캔 검사의 유용성에 대한 근거가 충분하지 않다.')}${R('III.3.6.D',2,'방사성요오드 치료 후 코눈물관이 좁아진 경우에는 수술적 교정을 고려한다.')}${R('III.3.6.E',3,'방사성요오드 치료를 받은 갑상선암 환자에서 이차원발암에 대한 추가적인 선별검사는 필요하지 않다.')}
<h5>임신·수유</h5>${R('III.3.6.F',1,'가임기 여성은 방사성요오드 치료 전 임신 여부를 확인하여야 한다.')}${R('III.3.6.G',1,'임신을 고려하는 여성은 방사성요오드 치료 최소 6개월 이후로 임신계획을 미루어야 한다.')}${R('III.3.6.H',1,'수유 중인 여성에게는 방사성요오드 치료를 시행하지 않는다.')}${CC('환자의 임상상황에 따라 적어도 3-6개월 간 수유 또는 착유를 중단한 뒤로 방사성요오드 치료를 연기할 수 있다.')}
<p class="small">가임기 여성의 20–27%에서 치료 후 4–10개월간 일시적 무월경 또는 희발월경이 나타날 수 있다.</p>`},
rair:{kind:'Part III. 진행성 갑상선분화암', sec:'III.4', title:'방사성요오드 불응성 갑상선분화암의 전신항암치료', next:[], body:`<h4>III.4.1 방사성요오드 불응성의 정의</h4>${R('III.4.1.A',2,'진행성 국소 또는 전이성 갑상선분화암은 진행 과정 중 분화도 감소 및 방사성요오드 불응성 발생 가능성을 고려하여 치료 방침을 결정한다.')}${R('III.4.1.B',3,'갑상선분화암에서 전신항암치료를 고려해야 하는 방사성요오드 불응성은 일반적으로 다음의 세 가지 범주로 분류할 수 있다.')}<ul class="small rl"><li>B1. 방사성요오드 전신스캔에서 방사성요오드 섭취가 없는 경우</li><li>B2. 일부 병소에서만 방사성요오드 섭취가 있고 다른 부위에서는 섭취가 없는 경우</li><li>B3. 방사성요오드 섭취가 있음에도 불구하고 질병이 진행하는 경우</li></ul>${R('III.4.1.C',3,'방사성요오드 불응성이 이미 확인된 환자에서 전신항암치료를 시행하기 전에 방사성요오드 불응성을 확인하기 위해 다시 방사성요오드 치료를 하는 것은 권고하지 않는다.')}
<h4>III.4.2 치료원칙</h4>${R('III.4.2.A',3,'방사성요오드 불응성으로 확인된 경우에는 추가적인 방사성요오드 치료를 일반적으로 권고하지 않는다.')}${R('III.4.2.B',3,'증상이 있거나 진행성인 단일 병소나 동일한 장기 내의 제한된 여러 병소는 국소 치료(예: 수술, 외부 방사선조사 치료, 고주파절제술 등의 비수술적 절제술)의 적용 가능성을 고려해야 한다.')}${R('III.4.2.C',3,'방사성요오드 치료 중 일부(단일 또는 소수) 병소만 섭취를 보이지 않는 경우 이에 대한 국소 치료 적용 가능성을 고려한다.')}${R('III.4.2.D',3,'전신항암치료 중 일부(단일 또는 소수) 병소만 진행한 경우 이에 대한 국소 치료 적용 가능성을 고려한다.')}
<h4>III.4.3 치료 시기</h4>${R('III.4.3.A',2,'진행성 방사성요오드 불응성 갑상선암의 진단과 치료 시 내분비학, 종양학, 외과학, 영상의학, 핵의학 및 병리학 등의 다학제적 접근이 필요하다.')}${R('III.4.3.B',2,'국소 또는 전이 병소의 진행은 RECIST 기준이 적용 가능한 경우에는 이에 따라 평가한다.')}${R('III.4.3.C',3,'RECIST 기준이 적용되지 않는 뼈전이 또는 다발성 폐미세전이 등의 병소의 진행은 임상적으로 평가한다.')}${R('III.4.3.D',1,'전신항암요법이 고려되는 경우, 개별화된 치료를 위해 유전자 검사(BRAF<sup>V600E</sup> 돌연변이, NTRK 및 RET 융합유전자 포함) 시행을 고려한다.')}${R('III.4.3.E',2,'증상이 있거나 단기간 내 증상 발생이 예측 되거나, 진행이 확인된 방사성요오드 불응성 갑상선암(유두암, 침습피막형성여포유두암, 여포암, 호산성암, 고등급분화암과 저분화암 등)의 국소 또는 전이 병소가 국소 치료만으로 조절이 불가능한 경우 전신항암치료를 고려한다.')}${R('III.4.3.F',2,'전신항암치료는 예상되는 이점과 위험을 고려하여 환자와 전문가의 공유 의사결정을 통해 시작 여부 및 치료제의 종류를 결정한다.')}
<h4>III.4.4 약제의 선택</h4>${R('III.4.4.A',2,'렌바티닙과 소라페닙은 진행성 방사성요오드 불응성 갑상선분화암 성인 환자에서 1차 이상의 전신항암치료제로 고려한다.')}${R('III.4.4.B',2,'카보잔티닙은 소라페닙 또는 렌바티닙 치료 후 진행된 방사성요오드 불응성 갑상선분화암 성인 환자의 치료에 고려할 수 있다.')}${R('III.4.4.C',2,'RET 융합 유전자가 양성인 진행성 방사성요오드 불응성 갑상선분화암의 성인과 12세 이상의 청소년에게는 셀퍼카티닙과 프랄세티닙을 치료에 고려한다.')}${R('III.4.4.D',2,'라로트렉티닙은 수술이 불가능하고 다른 효과적인 치료 방법이 없는 전이성 NTRK 융합 유전자 양성의 갑상선암 성인 및 2세 이상 소아 환자의 1차 이상의 치료제로 고려한다.')}${R('III.4.4.E',2,'엔트렉티닙은 표준 치료에도 불구하고 진행된 전이성 또는 절제 불가능한 NTRK 융합유전자 양성의 갑상선암 성인 및 12세 이상 청소년 환자의 치료제로 고려한다.')}${R('III.4.4.F',2,'BRAF<sup>V600E</sup> 유전자 돌연변이가 동반된 진행성 방사성요오드 불응성 갑상선분화암의 성인 환자에서 다브라페닙과 트라메티닙의 병합 요법을 2차 이상의 치료로 고려할 수 있다.')}${R('III.4.4.G',3,'1차 항암제 사용 중 질병의 진행이 확인된 경우에는 2차 치료제 또는 임상연구 참여를 고려한다.')}

<tr><td>엔트렉티닙</td><td>NTRK 융합</td><td>54%</td><td>19.9개월</td><td>42%</td></tr>
<tr><td>다브라페닙+트라메티닙</td><td>BRAF<sup>V600E</sup></td><td>30%</td><td>15.1개월</td><td>48%</td></tr></tbody></table></div>
<h4>III.4.5 효과와 부작용 평가</h4>${R('III.4.5.A',1,'전신항암치료 시행 중에는 정기적으로 치료 반응을 평가하여야 한다.')}${R('III.4.5.B',1,'전신항암치료 시행 중에는 정기적으로 합병증 발생 여부를 평가하여야 한다.')}${R('III.4.5.C',1,'전신항암치료 시행 전, 환자에게 선택한 치료제에 대한 교육을 시행한다.')}${R('III.4.5.D',3,'전신항암치료 중 치료제의 용량은 임상 반응과 합병증에 기반한 득실을 평가하여 조절한다.')}`},
meta:{kind:'Part III. 진행성 갑상선분화암', sec:'III.5', title:'전이 병소의 부위별 치료 원칙', next:[], body:`<p>갑상선분화암 환자의 약 2–5%에서 진단 당시나 경과 중 원격전이가 발견된다. 흔한 부위는 폐(53%), 뼈(28%)이며 중추신경계는 4.7%이다. 5년 생존율은 폐전이 77%, 뼈전이 25%, 중추신경계 전이 6%로 보고된다. RAI 섭취 병소는 RAI 치료를 우선 고려하고, 병소 특성에 따라 수술, 고주파절제술, 외부 방사선 등 국소 치료를 병행한다.</p>
<h4>III.5.1 폐전이</h4>${R('III.5.1.A',1,'폐 미세전이(pulmonary micrometastasis)는 방사성요오드 치료를 우선적으로 고려한다.')}${R('III.5.1.B',1,'방사성요오드 섭취가 있고 임상적으로 반응이 있는 폐 미세전이는 6-12개월 간격으로 반복하여 방사성요오드 치료를 한다.')}${R('III.5.1.C',3,'방사성요오드 섭취가 있는 대결절 폐전이(macronodular pulmonary metastasis)는 방사성요오드 치료를 고려할 수 있다.')}${R('III.5.1.D',3,'방사성요오드 치료 후 전이병소의 크기나 혈청 갑상선글로불린의 감소와 같이 객관적 이득이 있는 대결절 폐전이는 방사성요오드 치료를 반복할 수 있다.')}${R('III.5.1.E',3,'천천히 자라는 폐전이 병소는 TSH 억제 치료를 하면서 경과를 추적 관찰할 수 있다.')}${R('III.5.1.F',3,'폐전이 병소의 개수가 제한적이고 전신 상태가 좋은 환자에서는 전이 병소의 수술적 제거를 고려할 수 있다.')}${R('III.5.1.G',3,'흉곽 내 전이 병소의 증상(기도 폐색이나 출혈 등) 완화를 위한 국소 치료(전이 병소 절제, 기도 내 레이저 치료, 또는 보존적 외부 방사선조사 치료 등)를 고려한다.')}${R('III.5.1.H',3,'원발성 폐암과 타 암종의 전이의 감별을 위한 조직검사 및 유전자변이 검사를 고려한다.')}${R('III.5.1.I',3,'국소 치료가 불가능한 진행성 또는 증상이 있는 폐전이 병소는 전신항암치료를 고려해야 한다.')}
<h4>III.5.2 뼈전이</h4>${R('III.5.2.A',1,'방사성요오드를 섭취하는 뼈전이 병소는 방사성요오드 치료를 시행한다.')}${R('III.5.2.B',2,'완전 절제가 가능한 단일 뼈전이 병소는 완전 절제 수술을 우선적으로 고려한다.')}${R('III.5.2.C',3,'완전 절제가 불가능하고 방사성요오드에 반응이 없으나, 증상이 없고 인접 부위에 중요한 구조물이 없는 안정적인 뼈전이 병소는 TSH 억제요법을 시행하면서 경과를 관찰한다.')}${R('III.5.2.D',3,'완전 절제가 불가능한 뼈전이 병소는 증상이 있거나 발생이 예측되는 경우 혹은 증상 발생에 의한 건강 위험이 높은 경우는 완화 목적의 국소 치료를 고려한다.')}${R('III.5.2.E',3,'방사성요오드 치료를 위한 TSH 자극에 의해서 뼈전이 병소가 증상, 골절, 신경학적 합병증을 유발할 것으로 예상되는 부위에 존재하는 경우에는 방사성요오드 치료 전에 외부 방사선 조사 치료 및 이와 병행한 스테로이드제 투여를 적극적으로 고려할 수 있다.')}${R('III.5.2.F',3,'방사성요오드 치료 또는 전신항암치료 중인 경우에도 증상이 있거나 발생 위험이 높은 병소는 국소 치료를 병행한다.')}${R('III.5.2.G',3,'뼈 흡수억제제(비스포스포네이트 및 데노수맙)를 단독으로 또는 국소 및 전신항암 치료와 함께 사용을 고려한다.')}${R('III.5.2.H',3,'국소 치료가 불가능한 진행성 또는 증상이 있는 방사성요오드 불응성 뼈전이 병소는 전신항암치료를 고려한다.')}
<h4>III.5.3 중추신경계 전이</h4>${R('III.5.3.A',1,'중추신경계 전이는 외과적 절제, 외부 방사선조사 치료를 우선적으로 고려하며 신경 외과와 협의 하에 개별적인 치료 방침을 결정한다.')}${R('III.5.3.B',3,'진행성 또는 증상이 있는 경우에는 전신항암치료를 고려해야 한다.')}
`},

preg:{kind:'추가 참고', sec:'Part IV', title:'임신 중 갑상선암의 치료', next:[], body:`<h4>IV.1 임신 중 새로 진단된 갑상선암</h4>${R('IV.1.A',1,'임신 초기에 새로 진단된 갑상선유두암은 초음파로 추적관찰한다.')}${R('IV.1.B',2,'임신 24-26주 전에 갑상선암이 진행하면 수술을 고려한다.')}${R('IV.1.C',2,'임신 24-26주까지 진행하지 않거나 임신 20주 이후에 갑상선유두암이 진단된 경우에는 출산 이후에 수술을 고려한다.')}
<h4>IV.2 TSH 조절 목표</h4>${R('IV.2.A',3,'갑상선암 여성 환자의 임신 중 TSH는 임신 직전 조절 목표에 맞추어 조절한다.')}${R('IV.2.B',2,'임신 기간 중 TSH 검사는 16-20주까지는 매 4-8주마다, 이후에는 최소한 26-32주 사이에 1회 이상 시행한다.')}
<h4>IV.3 임신 중 추적검사</h4>${R('IV.3.A',2,'임신 직전 지속적위험분류(ongoing risk stratification; ORS)에서 완전반응을 보인 경우 임신 중 갑상선초음파나 혈청 갑상선글로불린 추적검사는 필요하지 않다.')}${R('IV.3.B',2,'임신 직전 지속적위험분류(ORS)에서 생화학적 혹은 구조적 불완전반응 또는 불명확반응을 보인 경우에는 임신 중 갑상선초음파와 혈청 갑상선글로불린 추적검사를 고려한다.')}
<h4>IV.4 칼슘·비타민D 모니터링</h4>${R('IV.4.A',3,'수술 후 부갑상선기능저하증이 있는 경우에는 임신 기간 동안 알부민 조정 칼슘 혹은 이온화 칼슘을 주기적으로 측정하여 경구 칼슘과 비타민D로 조정한다.')}
<div class="box tip"><b>방사성요오드 치료 후 임신</b>임신을 고려하는 여성은 방사성요오드 치료 후 최소 6개월 이후로 임신을 미루어야 한다(III.3.6.G).</div>`},
peds:{kind:'추가 참고', sec:'Part V', title:'소아 갑상선분화암', next:[], body:`<h4>V.1 수술 전 평가</h4>${R('V.1.1.A',1,'수술 전 종양의 국소침범이나 림프절전이가 확인된 소아 갑상선암 환자는 수술 범위 결정을 위해 측경부 및 종격동 림프절을 포함한 영상검사를 시행한다.')}
<h4>V.2 고위험군에서의 고려 사항</h4>${R('V.2.1.A',1,'유전종양증후군이 의심되는 경우 유전자 검사를 권고한다.')}${R('V.2.2.A',1,'전신 혹은 두경부 방사선 치료를 받은 소아기 종양생존자에서 발생한 갑상선분화암은 갑상선전절제술을 권고한다.')}${R('V.2.2.B',2,'방사선 혹은 항암치료를 받은 소아기 종양생존자에서는 방사성요오드 치료 연관 합병증 발생 위험이 증가할 수 있음을 고려하여 치료를 결정한다.')}
<h4>V.3 수술의 원칙</h4>${R('V.3.1.A',2,'소아 갑상선분화암 환자에서는 갑상선전절제술을 우선적으로 고려한다.')}${R('V.3.1.B',3,'저위험군 소아 미세갑상선유두암 환자는 갑상선엽절제술을 고려할 수 있다.')}${R('V.3.1.C',1,'수술 전 및 수술 중 중앙경부 또는 측경부 림프절전이가 확인된 소아 갑상선암 환자에서는 치료적 중앙경부 림프절절제술을 시행한다.')}${R('V.3.1.D',2,'진행된 갑상선암(갑상선외부침범, 혈관 침습 및 원격전이 등)이 있는 환자에서는 예방적 중앙경부 림프절절제술이 시행될 수 있다.')}${R('V.3.1.E',1,'수술 전 측경부 림프절전이가 명백하게 발견된 소아 환자에서는 치료적 측경부 림프절절제술을 시행한다.')}${R('V.3.1.F',3,'소아 환자의 갑상선분화암 수술은 숙련된 외과의에 의한 시행을 고려한다.')}
<h4>V.4 초기위험군(소아위험수준 3단계)과 추적</h4>${R('V.4.1.A',2,'소아 갑상선암 환자의 수술 후 위험군 분류는 수술 후 종양 크기, 갑상선외부침범 및 전이 정도에 따른 소아위험수준 3단계 분류를 따른다.')}${R('V.4.1.B',2,'저위험군은 갑상선외부침범이 없고 림프절전이가 N0/Nx 또는 예방적 중앙경부 림프절절제술 후 발견된 미세전이(≤0.2 cm)가 있는 N1a인 경우이다.')}${R('V.4.1.C',2,'중간위험군은 림프절전이가 광범위한 N1a 또는 미세전이가 있는 N1b인 경우이다.')}${R('V.4.1.D',2,'고위험군은 진행된 원발암(T4)이거나 림프절전이가 광범위한 N1b인 경우로 원격전이가 동반될 수 있다.')}
<p class="small">AJCC 병기에서 55세 미만은 원격전이가 있어도 II기이므로 소아에서는 예후 예측에 한계가 있어, 수술 후 TNM에 근거한 소아위험수준 3단계를 사용한다.</p>
${R('V.4.2.A',2,'중간위험군과 고위험군에서는 방사성요오드 치료를 결정하기 위해 12주 이내 TSH-자극 갑상선글로불린 수치와 방사성요오드 진단 스캔검사를 시행할 수 있다.')}${R('V.4.2.B',2,'방사성요오드 진단스캔에서 요오드섭취가 있는 원격전이 병소 또는 수술적 절제가 어려운 경부 병소가 있으면 방사성요오드 치료를 시행할 수 있다.')}${R('V.4.2.C',2,'적정 갑상선호르몬(levothyroxine, LT4) 용량이 변화할 수 있는 성장기의 소아 갑상선암 환자는 3-6개월 간격으로 추적 검사를 시행한다.')}${R('V.4.2.D',2,'칼슘과 비타민D 요구량이 증가할 수 있는 성장기의 부갑상선기능저하증을 동반한 소아 갑상선암 환자는 3-6개월 간격으로 추적검사를 시행한다.')}
<h4>V.5 방사성요오드 치료</h4>${R('V.5.A',2,'소아 갑상선암 환자는 치료의 이득과 위험에 대한 다학제적 평가를 기반으로 방사성요오드 치료를 결정한다.')}${R('V.5.B',1,'방사성요오드 섭취가 있는 소아 갑상선분화암의 폐 미세전이(pulmonary micrometastasis)는 방사성요오드 치료를 시행한다.')}${R('V.5.C',2,'소아에서 수술적 절제가 불가능한 지속 병소가 방사성요오드 섭취를 보이는 경우 방사성요오드 치료를 고려한다.')}${R('V.5.D',3,'소아 갑상선분화암 환자에서는 치료 목적에 따른 경험적인 체중당 용량 또는 계산한 최대 허용방사선용량을 이용하여 방사성요오드 치료용량을 결정한다.')}
<h4>V.6 재발 또는 지속병소</h4>${R('V.6.A',1,'소아에서 수술 후 추적 관찰 중 갑상선글로불린 또는 항체가 상승하는 경우에는 경부 초음파를 우선적으로 시행한다.')}${R('V.6.B',1,'소아 갑상선암 환자의 수술적 절제가 가능한 경부 재발 병소는 우선적으로 수술을 고려한다.')}${R('V.6.C',1,'소아에서 추적 중 수술적 절제가 불가능한 경부 재발 병소가 있거나 새로이 폐전이가 발견된 경우에는 방사성요오드 전신스캔검사를 시행한다.')}${R('V.6.D',2,'소아 갑상선암 환자의 수술적 절제가 불가능한 경부 재발 병소는 방사성요오드 섭취를 보이면 방사성요오드 치료를 고려한다.')}${R('V.6.E',1,'소아 갑상선분화암 환자의 추적 중 새로이 발견된 폐전이는 방사성요오드 섭취를 보이면 방사성요오드 치료를 시행한다.')}${R('V.6.F',2,'소아에서 방사성요오드 치료 후 섭취를 보인 폐전이 병소는 충분한 간격을 두고 치료 반응을 평가한다. 치료 반응 평가에서 지속 또는 진행하는 경우에는 위험과 이득을 고려하여 추가 방사성요오드 치료의 시기와 용량을 결정한다.')}
<h4>V.7 방사성요오드 불응성</h4>${R('V.7.A',2,'소아의 방사성요오드 불응성 갑상선분화암이 증상이 없고 진행하지 않는 경우 TSH 억제치료를 지속하면서 추적할 수 있다.')}${R('V.7.B',3,'지속 또는 재발한 소아 방사성요오드 불응성 갑상선분화암 환자에서는 종양조직의 유전자변이 검사를 고려한다.')}${R('V.7.C',2,'소아에서 수술적 절제가 불가능한 방사성요오드 불응성 갑상선유두암이 진행하는 경우 종양조직의 유전자 변이에 근거한 전신항암치료를 고려한다.')}`},
levels:{kind:'추가 참고', sec:'Table 1', title:'권고수준의 정의', next:[], body:
  [1,2,3,4].map(l=>`<div class="rec"><span class="lv l${l}">권고수준 ${l}</span><p>${LV[l]}</p></div>`).join('')}
};

/* ---------- 약어 ---------- */
const ABBR = [
  ['AJCC','American Joint Committee on Cancer'],
  ['CT','Computed tomography, 전산화단층촬영'],
  ['DTC','Differentiated thyroid cancer, 갑상선분화암'],
  ['FDG PET/CT','<sup>18</sup>F-fluorodeoxyglucose PET/CT'],
  ['FNA','Fine-needle aspiration, 세침흡인검사'],
  ['KTA','Korean Thyroid Association, 대한갑상선학회'],
  ['ORS','Ongoing risk stratification, 지속적위험분류'],
  ['PTMC','Papillary thyroid microcarcinoma, 미세갑상선유두암'],
  ['RAI','Radioactive iodine, 방사성요오드'],
  ['rhTSH','Recombinant human TSH, 인간유전자재조합 갑상선자극호르몬'],
  ['Tg','Thyroglobulin, 갑상선글로불린'],
  ['TgAb','Thyroglobulin antibody, 갑상선글로불린항체'],
  ['TNM','Tumor, node, metastasis'],
  ['TSH','Thyroid-stimulating hormone, 갑상선자극호르몬'],
  ['WHO','World Health Organization']
];

/* ---------- 렌더링 ---------- */
const chart = document.getElementById('chart');
const edges = document.getElementById('edges');
const elabels = document.getElementById('elabels');
const SVGNS = 'http://www.w3.org/2000/svg';
EDGES.forEach(([d,arrow,cls])=>{
  const p = document.createElementNS(SVGNS,'path');
  p.setAttribute('d', d);
  if (arrow) p.setAttribute('marker-end','url(#ah)');
  if (cls) p.setAttribute('class', cls);
  edges.appendChild(p);
});
ELABELS.filter(l=>l.t).forEach(l=>{
  const t = document.createElementNS(SVGNS,'text');
  t.setAttribute('x', l.x); t.setAttribute('y', l.y); t.setAttribute('text-anchor', l.a || 'middle');
  t.textContent = l.t; elabels.appendChild(t);
});
const nodeEls = {};
NODES.forEach(n=>{
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'node' + (n.cls ? ' ' + n.cls : '');
  b.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
  b.innerHTML = n.label;
  b.addEventListener('click', ()=>open(n.id, b));
  chart.appendChild(b);
  nodeEls[n.id] = b;
});

D.abbr = {kind:'참고', title:'약어', next:[],
  body:`<div class="abbr"><input class="abbr-search" id="abbrSearch" type="search" placeholder="약어 또는 뜻으로 찾기" aria-label="약어 검색"><dl id="abbrList"></dl></div>`,
  onOpen(){
    const inp = document.getElementById('abbrSearch'), dl = document.getElementById('abbrList');
    const render = q => { q=(q||'').trim().toLowerCase();
      dl.innerHTML = ABBR.filter(([a,b])=>!q || a.toLowerCase().includes(q) || b.toLowerCase().includes(q))
        .map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('') || '<dd>일치하는 약어가 없다.</dd>'; };
    inp.addEventListener('input', e=>render(e.target.value)); render('');
  }
};
document.getElementById('abbrToggle').addEventListener('click', e=>open('abbr', e.currentTarget));
document.querySelectorAll('.below [data-id]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.id,b)));


/* ---------- 범례 클릭: 해당 종류 박스 2.4초 깜빡임 ---------- */
let flashTimer = null;
function flashLegend(cls, btn){
  clearTimeout(flashTimer);
  Object.values(nodeEls).forEach(el=>el.classList.remove('flash'));
  document.querySelectorAll('.legend .lg').forEach(b=>{ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); });
  void chart.offsetWidth; /* 애니메이션 재시작 */
  const KNOWN = ['test','tx','ben','mal'];
  NODES.forEach(n=>{
    const match = cls === 'plain' ? !KNOWN.includes(n.cls) : n.cls === cls;
    if (match) nodeEls[n.id].classList.add('flash');
  });
  chart.classList.add('hl');
  btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
  flashTimer = setTimeout(()=>{
    Object.values(nodeEls).forEach(el=>el.classList.remove('flash'));
    chart.classList.remove('hl');
    btn.classList.remove('on'); btn.setAttribute('aria-pressed','false');
  }, 2400);
}
document.querySelectorAll('.legend .lg').forEach(b=>b.addEventListener('click',()=>flashLegend(b.dataset.cls,b)));
/* ---------- 세부 창 ---------- */
const drawer = document.getElementById('drawer');
const backdrop = document.getElementById('backdrop');
const dKind = document.getElementById('dKind');
const dTitle = document.getElementById('dTitle');
const dSec = document.getElementById('dSec');
const dBody = document.getElementById('dBody');
const dNext = document.getElementById('dNext');
const dClose = document.getElementById('dClose');
let lastFocus = null;

function open(id, trigger){
  const d = D[id]; if (!d) return;
  if (trigger && !drawer.classList.contains('open')) lastFocus = trigger;
  dKind.textContent = d.kind;
  dTitle.textContent = d.title;
  dSec.textContent = d.sec ? '권고안 ' + d.sec : '';
  dBody.innerHTML = d.body;
  /* 공통 설명은 패널 안에서 해당 그룹의 첫 권고문에만 남김 */
  const seenExp = new Set();
  dBody.querySelectorAll('.rec.has-exp').forEach(rec=>{
    const g = EXPMAP[rec.dataset.rid];
    if (!seenExp.has(g)) { seenExp.add(g); return; }
    const box = document.getElementById(rec.getAttribute('aria-controls'));
    if (box && dBody.contains(box)) box.remove();
    rec.classList.remove('has-exp');
    ['role','tabindex','aria-expanded','aria-controls','data-rid'].forEach(a=>rec.removeAttribute(a));
    rec.querySelectorAll('.lv-ic').forEach(i=>i.remove());
  });
  dBody.scrollTop = 0;
  dNext.innerHTML = '';
  if (d.next && d.next.length){
    const s = document.createElement('span'); s.className = 'lbl'; s.textContent = d.nextLabel || '다음 단계';
    dNext.appendChild(s);
    d.next.forEach(nid=>{
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = D[nid].title;
      b.addEventListener('click', ()=>open(nid));
      dNext.appendChild(b);
    });
  }
  if (d.onOpen) d.onOpen();
  Object.values(nodeEls).forEach(el=>el.classList.remove('is-active'));
  if (nodeEls[id]) nodeEls[id].classList.add('is-active');
  drawer.classList.add('open'); backdrop.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  dClose.focus({preventScroll:true});
}
function close(){
  drawer.classList.remove('open'); backdrop.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  Object.values(nodeEls).forEach(el=>el.classList.remove('is-active'));
  if (lastFocus) lastFocus.focus({preventScroll:true});
  lastFocus = null;
}
dClose.addEventListener('click', close);
function toggleExp(rid, force){
  const key = rid.replace(/\./g,'-');
  const rec = dBody.querySelector(`.rec.has-exp[data-rid="${rid}"]`);
  const box = document.getElementById('exp-' + key);
  if (!rec || !box) return;
  const show = force !== undefined ? force : box.hidden;
  if (show && !box.innerHTML) box.innerHTML = renderExp(rid);
  box.hidden = !show; rec.setAttribute('aria-expanded', String(show));
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if (show) rec.scrollIntoView({behavior:smooth, block:'start'});
  else { rec.scrollIntoView({behavior:smooth, block:'nearest'}); rec.focus({preventScroll:true}); }
}
dBody.addEventListener('click', e=>{
  const c = e.target.closest('.exp-close');
  if (c){ toggleExp(c.dataset.rid, false); return; }
  const rec = e.target.closest('.rec.has-exp');
  if (!rec) return;
  if (String(window.getSelection && window.getSelection()).trim()) return;
  toggleExp(rec.dataset.rid);
});
dBody.addEventListener('keydown', e=>{
  const rec = e.target.closest('.rec.has-exp');
  if (rec && e.target === rec && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleExp(rec.dataset.rid); }
});
backdrop.addEventListener('click', close);
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && drawer.classList.contains('open')) close(); });

/* ---------- 한 화면 맞춤 ---------- */
const wrap = document.getElementById('chartWrap');
const size = document.getElementById('chartSize');
const CW = 920, CH = 820, NODE_PX = 15;
const mainEl = document.querySelector('main');
function layout(){
  const ms = getComputedStyle(mainEl);
  const cs = getComputedStyle(wrap);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  const leg = document.getElementById('legend');
  const gap = parseFloat(cs.columnGap) || 0;
  const mainW = mainEl.clientWidth - parseFloat(ms.paddingLeft) - parseFloat(ms.paddingRight);
  const availW = mainW - padX - leg.offsetWidth - gap;
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  const below = document.querySelector('.below').offsetHeight + 20;
  const availH = window.innerHeight - top - padY - below - 4;
  const scale = Math.min(1.3, availW / CW, Math.max(availH, 360) / CH);
  chart.style.transform = `scale(${scale})`;
  size.style.width = (CW * scale) + 'px';
  size.style.height = (CH * scale) + 'px';
  const ui = Math.max(11, Math.min(16, NODE_PX * scale));
  document.documentElement.style.setProperty('--ui-font', ui.toFixed(2) + 'px');
}
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
layout();
</script>
