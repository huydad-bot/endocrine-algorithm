<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0HC1J201FL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-0HC1J201FL');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>갑상선분화암 진료 흐름도 (KTA 2024)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#16212B; --muted:#56646F;
  --line:#7F8D99; --test:#DCE5EB; --test-ink:#12304A;
  --accent:#1F5E7E; --accent-soft:#E3EEF4;
  --mal:#A13D33; --mal-bg:#FBEDEA; --ben:#2C6A43; --ben-bg:#E9F3EC;
  --tx:#6A4C93; --tx-bg:#F1ECF8; --warn:#85600F; --warn-bg:#FBF3DF;
  --border:#C9D3DA;
  --fn:#C2410C; --fn-bg:#FFF1E6;
  --hdr-bg:#1F4F6B; --hdr-ink:#FFFFFF; --hdr-sub:#CFE1EC; --hdr-link:#FFE8A3; --hdr-rule:#E0B44C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
    --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
    --accent:#7FB7D6; --accent-soft:#1D3140;
    --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
    --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
    --border:#2E3E4A;
    --fn:#F59E62; --fn-bg:#3A2418;
    --fn:#F59E62; --fn-bg:#3A2418;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
  --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
  --accent:#7FB7D6; --accent-soft:#1D3140;
  --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
  --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
  --border:#2E3E4A;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:16px; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.top{
  background:var(--hdr-bg); color:var(--hdr-ink);
  border:1px solid var(--hdr-bg); border-bottom:0; border-radius:10px 10px 0 0; margin:0;
  box-shadow:inset 0 -3px 0 var(--hdr-rule);
}
.fig .chart-wrap{border-top:0; border-radius:0 0 10px 10px}
.chart-note{position:absolute; right:1rem; bottom:.55rem; margin:0; padding-left:1.1em; font-size:calc(var(--ui-font,13px) * .88); line-height:1.55; color:var(--muted); white-space:nowrap}
.chart-note a{color:var(--accent)}
.top .disclaimer{font-size:.74rem; font-style:italic; color:var(--hdr-sub); opacity:.85; margin:.15rem 0 0}
.top-inner{padding:.8rem 1.25rem .9rem; text-align:center}
.top h1{font-size:1.25rem; margin:0; font-weight:700; letter-spacing:-.01em; color:var(--hdr-ink)}
.top .src{font-size:.84rem; color:var(--hdr-sub); margin:.2rem 0 0}
.top .src a{color:var(--hdr-link); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--hdr-rule)}
.top .src a:hover{text-decoration-thickness:2px}
.top .src a:focus-visible{outline-color:var(--hdr-link)}
.btn{
  font:inherit; font-size:.85rem; color:var(--ink); background:var(--surface);
  border:1px solid var(--border); border-radius:6px; padding:.35rem .7rem; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

main{max-width:1180px; margin:0 auto; padding:1rem 1.25rem .75rem}
.intro{max-width:70ch; color:var(--muted); font-size:.95rem; margin:0 0 1rem}
.legend{order:2; display:flex; flex-direction:column; gap:.2rem; font-size:var(--ui-font,13px); color:var(--muted); flex:none; align-self:flex-start; padding:.25rem .25rem 0 .25rem}
.legend span{white-space:nowrap}
.legend span{display:inline-flex; align-items:center; gap:.4rem}
.sw{width:18px; height:12px; border-radius:3px; border:1.5px solid var(--line); display:inline-block}
.sw.test{background:var(--test)}
.sw.mal{border-color:var(--mal); background:var(--mal-bg)}
.sw.ben{border-color:var(--ben); background:var(--ben-bg)}
.sw.tx{border-color:var(--tx); background:var(--tx-bg)}

.chart-wrap{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  overflow-x:auto; padding:.75rem; display:flex; gap:1rem; align-items:flex-start; position:relative;
}
.chart-size{flex:none}
.fig{width:fit-content; max-width:100%; margin:0 auto}
.below{display:flex; flex-wrap:nowrap; align-items:center; gap:.4rem; margin-top:.6rem; overflow-x:auto; padding-bottom:2px}
.below button{flex-shrink:0; white-space:nowrap}
.sep{width:1px; height:1.4rem; background:var(--border); margin:0 .25rem}
.fn-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.5rem .75rem .75rem}
.fn-panel .fn-list{margin:0}
.chart-size{position:relative}
.chart{position:absolute; left:0; top:0; width:760px; height:720px; transform-origin:0 0}
.chart svg{position:absolute; inset:0; width:760px; height:720px; overflow:visible}
.chart svg path{fill:none; stroke:var(--line); stroke-width:1.4}
.chart svg path.dot{stroke-dasharray:3 4}
.chart svg marker path{fill:var(--line); stroke:none}

.node{
  position:absolute; display:flex; align-items:center; justify-content:center; text-align:center;
  font:inherit; font-size:15px; line-height:1.2; font-weight:500; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line); border-radius:4px;
  padding:2px 8px; cursor:pointer;
  transition:box-shadow .15s ease, border-color .15s ease;
}
.node sup{font-size:13px; margin-left:2px; color:var(--accent); font-weight:700; vertical-align:baseline; position:relative; top:-.5em; line-height:0}
.node.test{background:var(--test); color:var(--test-ink); font-weight:600}
.node.mal{border-color:var(--mal); background:var(--mal-bg)}
.node.ben{border-color:var(--ben); background:var(--ben-bg)}
.node.tx{border-color:var(--tx); background:var(--tx-bg)}
.node:hover{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.node.is-active{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent)}

.fn-list{margin:0; padding:0; list-style:none; display:grid; gap:.4rem}
.fn-list button{
  width:100%; text-align:left; font:inherit; font-size:.86rem; color:var(--ink);
  background:transparent; border:1px solid transparent; border-radius:6px; padding:.35rem .5rem; cursor:pointer;
  display:grid; grid-template-columns:1.4rem 1fr; gap:.25rem;
}
.fn-list button:hover{background:var(--accent-soft); border-color:var(--border)}
.fn-list b{color:var(--accent)}
.caption{font-size:.82rem; color:var(--muted); margin:.75rem 0 0}

.abbr-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.25rem .9rem .75rem}
.abbr-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-toggle:hover,.abbr-toggle:hover{border-color:var(--accent); background:var(--accent-soft)}
.abbr-search{margin:.6rem 0; width:100%; max-width:360px; font:inherit; font-size:.9rem; padding:.4rem .6rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--ink)}
.abbr dl{display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; margin:0; font-size:.88rem}
.abbr dt{font-weight:600; color:var(--accent)}
.abbr dd{margin:0}

/* recommendations */
.rec{display:grid; grid-template-columns:auto 1fr auto; gap:.25rem .6rem; align-items:start; border:1px solid var(--border); border-radius:6px; padding:.5rem .65rem; margin:.5rem 0; background:var(--bg)}
.rec p{margin:0; font-size:.9rem}
.rid{font-weight:700; color:var(--accent); font-size:.85rem; white-space:nowrap; padding-top:.05rem}
.lv{font-size:.72rem; font-weight:600; padding:.1rem .45rem; border-radius:999px; white-space:nowrap; cursor:help; border:1px solid currentColor}
.lv.l1{color:var(--ben); background:var(--ben-bg)}
.lv.l2{color:var(--accent); background:var(--accent-soft)}
.lv.l3{color:var(--warn); background:var(--warn-bg)}
.lv.l4{color:var(--muted); background:transparent}
.small,.d-body ul.small li{font-size:.86rem}
.d-body ul.small{color:var(--ink)}
@media (max-width:520px){ .rec{grid-template-columns:auto 1fr} .rec .lv{grid-column:2; justify-self:start} }
.extras{display:contents}
.extras button{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.extras button:hover{border-color:var(--accent); background:var(--accent-soft)}

.d-body .fn-list{padding-left:0; margin:0 0 .5rem}
.d-body .fn-list li{margin:0}
.d-body a{color:var(--accent)}
.xp{border:1px solid var(--border); border-radius:6px; margin:.4rem 0; background:var(--bg)}
.xp summary{cursor:pointer; padding:.5rem .7rem; font-size:.92rem; list-style:none; display:flex; gap:.5rem; align-items:baseline}
.xp summary::-webkit-details-marker{display:none}
.xp summary::before{content:"▸"; color:var(--accent); flex:none; transition:transform .15s}
.xp[open] summary::before{transform:rotate(90deg)}
.xp[open] summary{border-bottom:1px solid var(--border); font-weight:600}
.xp > div{padding:.3rem .8rem .6rem; background:var(--surface); border-radius:0 0 6px 6px}
.xp h5{font-size:.88rem; margin:.6rem 0 .2rem}
@media (prefers-reduced-motion: reduce){.xp summary::before{transition:none}}
.d-body h5{font-size:.9rem; margin:.7rem 0 .25rem; color:var(--accent)}
.kt th,.kt td:first-child{white-space:nowrap}
.kt td:nth-child(3),.kt td:nth-child(4){white-space:nowrap}
.fnl{margin:.4rem 0 0; padding-left:1.3rem}
.fnl li{margin:.25rem 0}
.fnl li::marker{font-weight:700; color:var(--fn)}
.kt sup, .d-body h4 sup{color:var(--fn); font-weight:700; background:var(--fn-bg); border-radius:3px; padding:0 .2em; margin-left:.1em}
.fnl{background:var(--fn-bg); border-left:3px solid var(--fn); border-radius:0 6px 6px 0; padding:.5rem .7rem .5rem 1.9rem}
.term{font:inherit; color:var(--accent); font-weight:700; background:var(--accent-soft); border:0; border-bottom:2px dotted var(--accent); border-radius:3px; padding:0 .25em; cursor:pointer}
.term::after{content:" ▸"; font-size:.8em}
.term[aria-expanded="true"]::after{content:" ▾"}
.term:hover{background:var(--test)}
.pop{margin:.5rem 0 .3rem; border:1px solid var(--accent); border-radius:8px; background:var(--surface); padding:.6rem .8rem; box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pop-h{display:block; color:var(--accent); margin-bottom:.3rem}
.pop ul{margin:.2rem 0; padding-left:1.1rem}
.pop li{font-size:.9rem; margin:.3rem 0}
.pop-src{font-size:.78rem; color:var(--muted); margin:.4rem 0 0}
.pop .tbl table{min-width:0}
.pop .tbl td:first-child{width:38%}
/* drawer */
.backdrop{position:fixed; inset:0; background:rgba(10,20,28,.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.backdrop.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(560px,100%);
  background:var(--surface); border-left:1px solid var(--border);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s ease;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:none}
.d-head{display:flex; gap:1rem; align-items:flex-start; padding:1rem 1.25rem .75rem; border-bottom:1px solid var(--border)}
.d-head > div{flex:1}
.d-kind{margin:0; font-size:.8rem; color:var(--accent); font-weight:600}
.d-head h2{margin:.15rem 0 0; font-size:1.25rem; line-height:1.35}
.d-body{flex:1; overflow-y:auto; padding:1rem 1.25rem 1.5rem; font-size:.95rem}
.d-body h4{font-size:.98rem; margin:1.25rem 0 .4rem; color:var(--ink)}
.d-body h4:first-child{margin-top:0}
.d-body p{margin:.4rem 0}
.d-body ul{margin:.3rem 0; padding-left:1.2rem}
.d-body li{margin:.2rem 0}
.tbl{overflow-x:auto; margin:.5rem 0}
.tbl table{border-collapse:collapse; width:100%; font-size:.85rem; min-width:440px}
.tbl th,.tbl td{border:1px solid var(--border); padding:.4rem .5rem; vertical-align:top; text-align:left}
.tbl th{background:var(--test); color:var(--test-ink); font-weight:600}
.box{border-radius:6px; padding:.6rem .8rem; margin:.75rem 0; font-size:.9rem}
.box.fn{background:var(--accent-soft); border-left:3px solid var(--accent)}
.box.tip{background:var(--ben-bg); border-left:3px solid var(--ben)}
.box.verify{background:var(--warn-bg); border-left:3px solid var(--warn)}
.box b{display:block; margin-bottom:.15rem}
.d-next{padding:.75rem 1.25rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:.4rem; align-items:center}
.d-next:empty{display:none}
.d-next .lbl{font-size:.8rem; color:var(--muted); margin-right:.25rem}
.d-next button{font:inherit; font-size:.85rem; padding:.3rem .65rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:transparent; cursor:pointer}
.d-next button:hover{background:var(--accent-soft)}

@media (max-width:700px){
  .drawer{top:auto; height:86%; width:100%; border-left:0; border-top:1px solid var(--border); border-radius:14px 14px 0 0; transform:translateY(100%)}
  .drawer.open{transform:none}
  main{padding:1rem .75rem}
  .chart-wrap{padding:.5rem}
}
@media (prefers-reduced-motion: reduce){
  .drawer,.backdrop,.node{transition:none}
}

/* ---- DTC 흐름도 추가 ---- */
.chart{width:920px; height:820px}
.chart svg{width:920px; height:820px}
.chart svg text{fill:var(--muted); font-size:12px; font-family:inherit; stroke:none}
.node small{font-size:11px; font-weight:500; color:var(--muted); margin-left:5px; white-space:nowrap}
.node{flex-wrap:wrap; column-gap:0}
.sw.plain{background:var(--surface)}

.lv-btn{font:inherit; font-size:.72rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:.25rem}
.lv-ic::after{content:"▸"; font-size:.8em}
.lv-btn[aria-expanded="true"] .lv-ic::after{content:"▾"}
.lv-btn:hover{box-shadow:0 0 0 2px var(--accent-soft)}
.exp{margin:-.3rem 0 .7rem; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:0 0 6px 6px; background:var(--surface); padding:.55rem .8rem .6rem; font-size:.88rem; line-height:1.7}
.exp-h{display:flex; justify-content:space-between; gap:.5rem; align-items:baseline; color:var(--accent); margin-bottom:.2rem}
.exp-h span{font-size:.78rem; color:var(--muted)}
.exp p{margin:.45rem 0}
.exp h5{margin:.7rem 0 .2rem; font-size:.86rem; color:var(--ink)}
.exp p.exp-li{margin:.2rem 0 .2rem .9rem; padding-left:1.4em; text-indent:-1.4em}
.exp-note,.exp-src{font-size:.78rem; color:var(--muted)}
.exp-src{border-top:1px dashed var(--border); padding-top:.4rem; margin-top:.6rem}

.rec.has-exp{cursor:pointer; transition:border-color .15s, box-shadow .15s}
.rec.has-exp:hover{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.rec.has-exp[aria-expanded="true"]{border-color:var(--accent); border-bottom-left-radius:0; border-bottom-right-radius:0; margin-bottom:0; background:var(--accent-soft)}
.rec.has-exp[aria-expanded="true"] .lv-ic::after{content:"▾"}
.exp{margin:0 0 .8rem; border-top:0}
.exp-h{position:sticky; top:-1rem; z-index:2; background:var(--surface); margin:-.55rem -.8rem .3rem; padding:.55rem .8rem .45rem; border-bottom:1px solid var(--border); align-items:center}
.exp-h .exp-r{margin-left:auto}
.exp-close{font:inherit; font-size:.78rem; padding:.2rem .55rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:var(--surface); cursor:pointer; white-space:nowrap}
.exp-close:hover{background:var(--accent-soft)}
.exp-close-b{display:block; margin:.5rem 0 0 auto}
@media (prefers-reduced-motion: reduce){.rec.has-exp{transition:none}}
.subrecs{margin:-.25rem 0 .6rem 1.4rem}
.rec.sub{margin:.3rem 0; padding:.35rem .55rem}
.rec.sub p{font-size:.86rem}
.rl{margin:-.2rem 0 .5rem 1.6rem}
.box.cc{margin:-.25rem 0 .6rem; font-size:.86rem}
.box.cc ul{margin:.2rem 0 0; padding-left:1.1rem}
.d-body td[rowspan]{vertical-align:middle}
.todo{border:1.5px dashed var(--border); border-radius:6px; padding:.45rem .7rem; color:var(--muted); font-size:.86rem; margin:.3rem 0 .8rem; background:var(--bg)}
.d-body h4 .sec{color:var(--accent); margin-right:.35rem}

/* 범례 클릭 시 해당 박스 깜빡임 */
.legend .lg{font:inherit; color:inherit; background:transparent; border:1px solid transparent; border-radius:6px; padding:.15rem .35rem; margin:0 -.35rem; display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap; cursor:pointer; text-align:left}
.legend .lg:hover{background:var(--accent-soft); border-color:var(--border); color:var(--ink)}
.legend .lg.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.node{--flash:var(--accent)}
.node.test{--flash:var(--test-ink)} .node.tx{--flash:var(--tx)} .node.ben{--flash:var(--ben)} .node.mal{--flash:var(--mal)}
@keyframes nodeFlash{0%,100%{box-shadow:0 0 0 0 transparent; transform:scale(1)} 50%{box-shadow:0 0 0 5px var(--flash); transform:scale(1.04)}}
.chart.hl .node{transition:opacity .2s}
.chart.hl .node:not(.flash){opacity:.3}
.node.flash{animation:nodeFlash .8s ease-in-out 3; z-index:3}
@media (prefers-reduced-motion: reduce){
  .node.flash{animation:none; box-shadow:0 0 0 4px var(--flash)}
  .chart.hl .node{transition:none}
}
.legend .chart-note{position:static; white-space:normal; max-width:170px; margin-top:1rem}
.legend .chart-note li{display:list-item}
.d-sec{font-size:.8rem; color:var(--muted); margin:.1rem 0 0}
</style>
</head>
<body>
<main>
  <div class="fig" id="fig">
  <header class="top">
    <div class="top-inner">
      <div>
        <h1>갑상선분화암 진료 흐름도</h1>
        <p class="src">대한갑상선학회 갑상선분화암 진료권고안 2024, <a href="https://doi.org/10.11106/ijt.2024.17.1.1" target="_blank" rel="noopener noreferrer">Int J Thyroidol 2024;17(1):1-20</a></p>
        <p class="disclaimer">This tool is not officially endorsed by KTA</p>
      </div>
    </div>
  </header>
  <div class="chart-wrap" id="chartWrap">
    <div class="legend" id="legend" aria-label="범례">
      <button type="button" class="lg" data-cls="plain" aria-label="진단·분류 박스 강조"><i class="sw plain"></i>진단·분류</button>

const EXP = {"I.1.1.A": {"ids": ["I.1.1.A", "I.1.1.B"], "p": ["수술 전 갑상선암 환자에서는 적절하게 시행된 영상검사를 통해서 암의 크기 및 다발성, 그리고 갑상선외부침범 여부, 림프절전이 등의 항목들을 파악해야 정확한 병기 결정이 이루어져서 적절한 수술 범위가 결정될 수 있으며, 재발의 위험도를 최소화하며 효과적인 수술 후 감시(postoperative surveillance)가 가능하다. 경부 초음파검사는 가장 손쉽고 비침습적이며, 방사선 노출 없이 할 수 있는 검사이며 고해상도의 영상을 얻을 수 있어 수술 전 갑상선 검사에 있어 첫 번째로 행해지는 검사 방법이며, CT 검사는 초음파에 보조적으로 시행될 수 있는 주요한 영상기법이다. MRI는 특수한 경우 CT의 보조적인 역할을 할 수 있다.", "(1) T 병기 예측", "수술 전에 정확한 T 병기 예측을 위해서는 갑상선암의 정확한 크기 측정 및 갑상선 피막을 비롯한 주변의 연부조직, 근육, 기도, 식도, 신경 등의 침범 여부를 판단하는 것이 중요하다.", "초음파는 높은 해상도로 인해 갑상선에 국한된 암의 정확한 크기 측정, 갑상선외부침범(extrathyroidal extension, ETE)의 평가에 민감하고 정확한 검사이다. 다만, 병소의 위치가 깊거나 공기나 뼈로 가려진 부분의 병소는 초음파에서 발견하기가 어려울 수 있으며, 크기가 매우 크거나 기도나 식도 내강 안으로 침범한 암의 경우 정확한 종양의 범위의 평가가 어려워 이런 경우 단층촬영영 상검사 (cross sectional imaging) 를 시행하면 종양 범위 평가에 도움이 된다.", "CT는 촬영시간이 짧아서 종양 침범으로 인해 호흡곤란이 있는 환자에서 고해상도의 영상을 얻을 수 있다. MRI는 연부 조직의 대조도가 높은 검사로 일반적으로 두경부암의 연부조직 침범뿐 아니라 골수, 신경 침범을 CT보다 정확하게 진단할 수 있는 장점을 갖고 있다. 따라서, 침습적(또는 진행성) 갑상선암에서 기도와 식도 등 주변 장기 침범이 의심되는 경우 또는 조영제 부작용 등으로 CT 를 시행하기 어려운 환자에서 수술 전 종양 범위 평가에 사용을 고려할 수 있다.", "8 판 TNM 병기 설정 체계에서는 과거에 중요시 되었던 미세 갑상선외부침범(microscopic ETE)보다는 육안적 갑상선외부침범(gross ETE) 유무가 환자의 예후에 영향을 미치는 것으로 판단하여 병기 설정을 개정하였다. 개정된 대한갑상선영상의학회의 진료권고안에서도 앞쪽 갑상선 피막에 대한 미세 갑상선외부침범과 갑상선 앞쪽 띠근육, 기도 및 되돌이후두신경의 육안적 침범을 시사하는 초음파 소견에 대해서 제시하였다(Table I.1.1.A).", "앞쪽 갑상선 피막(anterolateral thyroid capsule)과 인접한 종양에서 미세 갑상선외부침범(microscopic ETE)을 가장 잘 예측한 소견은 피막의 연속성 소실(capsular disruption)이었다(민감도 61.6%, 특이도 87.1%, 양성예측 도[positive predictive value, PPV] 58.5%, 음성예측도 [negative predictive value, NPV] 88.5%, 정확도 81.3%). 갑상선 뒤쪽 피막에 인접한 종양의 경우 피막에 닿아 있는 소견(capsular abutment)이 미세 갑상선외부침범을 시 사한다는 최근 연구 결과가 있으나, 추가적인 검증이 필요하며 아직은 확립된 소견이 없다. 종양의 앞쪽 띠근육(strap muscle)의 육안적 갑상선외부침범을 시사하는 소견으로 띠근육의 대체(replacement of strap muscle) 소견이 가장 높은 양성예측도를 보여 이를 띠근육을 침범한 육안적 갑상선외부침범의 초음파 소견으로 제시하였 다 (민감도 45.4%, 특이도 99.1%, PPV 75.9%, NPV 96.7%, 정확도 96.0%).", "수술 방법과 범위 결정에 중요한 영향을 미치는 기도와 되돌이후두신경 침범의 경우에는 진단 정확도가 높은 초음파 소견을 채택하였으며, 기도에 인접한 종양의 경우, 기도와 종양 사이의 경계면에서 둔각(obtuse angle) 을 이루는 소견을 기도 침범을 시사하는 소견으로 제시하였다(민감도 85.7%, 특이도 98.9%, 양성예측도 40.0%, 음성예측도 99.9%). 후방 내측에 위치한 종양의 경우 종양과 기도식도고랑 (tracheoesophageal groove) 사이에 정 상적인 갑상선 실질 조직이 소실되고, 종양이 갑상선 실 질의 경계보다 후내측으로 돌출된 소견 (posteromedial protrusion)을 되돌이후두신경 육안적 침범을 시사하는 초음파 소견으로 제시하였다(민감도 83.3%, 특이도 96.5%, 양성예측도 25.6%, 음성예측도 99.8%, 정확도 96.3%).", "(2) N 병기 예측", "갑상선분화암(특히 갑상선유두암)은 수술 후 병리조직 검사 시 약 20-50%에서 경부 림프절전이가 있다고 알려져 있는데, 종양이 작고 갑상선에 국한되어 있는 경우에도 경부 림프절전이가 될 수 있다. 림프절 내의 전이 암의 직경이 2 mm 이하인 경우로 정의되는 미세전이 (micrometastasis)는 그 빈도가 최대 80%에 달하며, 임상적으로 명백한 림프절전이가 없는 미세갑상선유두암 환자에서 예방적 림프절절제술을 시행한 경우 중앙경부구 역은 61%, 측경부는 40%의 환자에서 흔히 림프절전이가 발견되지만, 미세전이의 임상적 의미는 낮을 것으로 생각된다. 그러나 임상적으로 명백한 림프절전이 여부는 재발의 위험성을 높이고, 수술 범위의 결정에 중요한 역할을 하기 때문에 수술 전 정확한 N 병기설정은 수술 후 환자의 치료 방침 결정에 중요한 정보이다.", "초음파는 N 병기의 결정을 위해 시행하는 일차적인 검사 방법이다. 경부 림프절전이는 초음파검사에서 20-31%까지 발견되는데, 그 중 약 20%에서는 이로 인해 수술 범위가 변경되었다고 보고되었다. 중앙경부구 역은 림프절전이가 흔히 일어나는 부위이나, 위에 놓여 있는 갑상선에 가려져서, 초음파검사로 찾아낸 림프절전이가 수술 시 발견되는 림프절전이의 약 절반 정도로, 측경부구역에 비해 민감도가 낮은 것으로 알려져 있다.", "대한갑상선영상의학회에서는 갑상선암 환자에서 보일 수 있는 림프절의 초음파 소견을 암 위험도에 따라 의심스러운 (suspicious) 림프절 (암 위험도 73-88%), 미결정 (indeterminate) 림프절 (암 위험도 20%), 양성추정 (probably benign) 림프절 (암 위험도 ＜3%) 의 세 단계로 구분하였다(Table I.1.1.B). 양성추정 림프절은 초음파상 에서 림프절 내부에 고에코의 문(echogenic hilum)을 가 지거나 혈관은 문을 따라 분포하고 있으므로 도플러 상에서 문 주위로 혈관 분포(hilar vascularity)가 관찰된다.", "반면, 전이림프절을 진단하는 데 있어 높은 특이도를 보이는 소견인 림프절 피질의 고에코(국소 혹은 미만형), 고에코 점(echogenic foci) (석회화), 낭성 변화(cystic change), 색도플러 영상에서 보이는 비정상적인 혈류 (abnormal vascularity; diffuse or peripheral)의 네 가지 소견 중 하나의 소견이라도 있으면 의심스러운 림프절로 분류된다. 구형모양(round shape), 또는 미결정 림프절에 보이는 문의 소실 (loss of hilar echogenicity) 소견은 단독 기준으로는 전이림프절을 진단하는 데 특이도가 떨어지 는 소견으로 보고되었다.", "CT는 경부 전체를 평가할 수 있는 검사방법으로, 초음파에서 의심 소견이 뚜렷하지 않거나 초음파 평가가 제한적인 부위(후ㆍ인두부나 종격동 등)의 림프절을 평가하는 데 도움을 준다. 대한갑상선영상의학회의 지 침에서는 초음파와 마찬가지로 CT 소견에서도 3단계 림프절 분류를 적용한다(Table I.1.1.B). 양성추정 림프절은 림프절 내부에 지방문 (fatty hilum) 이나 혈관문의 조영증강 (hilar vessel enhancement) 이 보이면서 의심스러운 소견이 동반되지 않아야 한다. 반면, 국소적 혹은전반적인 비정상적인 조영증강(비균일한 조영증강 또는 강한 조영증강), 석회화, 낭성 변화를 보이면 의심스러운 림프절로 분류한다. 지방문과 혈관문의 조영증강이 소 실되어 보이나, 의심스러운 소견이 동반되지 않은 림프절은 미결정으로 분류한다.", "CT로 경부림프절을 평가하는 경우, 갑상선암 전이림프절 특유의 비균일한 조영증강 또는 강한 조영증강의 발견이 중요하기 때문에, 동맥기에 촬영된 얇은 절편의 조영증강검사가 권고된다. 석회화된 림프절의 발견을 위해서는, 비조영검사를 추가하는 것이 권고된다.", "CT와 초음파를 같이 시행하는 경우 원발 종양의 크기와 관계없이 측경부 림프절구역과 전체 림프절구역에서 경부림프절전이의 진단 민감도와 정확성을 높인다는 연구결과들이 보고되어, 수술 전 병기 결정을 정확하게 평가하는 데 도움이 된다. 최근 한 메타분석에서는 중앙 림프절전이의 진단에 있어 CT가 더 민감한 반면, 특이도는 낮았다는 결과를 발표하였다.", "영상검사에서 림프절전이가 의심되는 경우 초음파 유도 하에 병리진단검사를 시행해야 한다. 대한갑상선영상의학회 진료권고안에서는 갑상선암 수술 전에 단경이 3-5 mm 보다 큰 의심스러운 림프절이 있거나 단경이 5 mm 보다 큰 미결정 림프절이 있으면 세침흡인검사 (fine needle aspiration, FNA) 를 시행할 것을 권고하고 있다(Table I.1.1.B). 초음파 유도하의 세침흡인검사는 림프절전이를 진단하는 데 있어 유용한 검사이지만, 그 크기가 작거나 낭성 림프절 인 경우 비진단적 결과나 위음성 결과를 얻을 수 있다. 따라서 민감도를 높이고자 세침흡인세척액에서 갑상선글로불린을 측정하도록 권고하고 있다.", "수술 전 림프절의 세침흡인세척액-갑상선글로불린 값 의 경우 혈청 갑상선글로불린 값과 비교하여 더 높은 경우 전이림프절로 판정할 수 있다. 혈청 갑상선글로불린 음성의 기준은 정립되어 있지 않으나 2-10 ng/mL 보다 상승되어 있는 경우 전이림프절의 가능성을 고려할 수 있다(민감도 88.5-95.0%, 특이도 93.1-96.3%). 초음파에서는 의심스러운 소견이나 세침흡인검사와 세침흡인세척액-갑상선글로불린 결과가 음성인 경우, 위음성 결과일 가능성을 고려하여 재검이 필요하다."]}, "I.1.2.A": {"ids": ["I.1.2.A"], "p": ["혈청 갑상선글로불린은 갑상선 여포세포에서 분비되 며 양성이든 악성이든 대부분의 갑상선질환에서 혈청 갑상선글로불린이 증가할 수 있으므로 갑상선암의 진단 에는 민감도와 특이도가 낮다. 최근 한 국내 연구에서 수술 전 혈청 갑상선글로불린 63 ng/mL를 기준으로 갑상선 분화암의 초기 원격전이를 예측할 수 있음 (곡면아래면적[area under curve] 0.914, 민감도 84.2%, 특이도 90.6%)을 보고하고 있으나 이에 대한 추가 연구가 필요하다.", "수술 전 혈청 갑상선글로불린 및 갑상선글로불린항체 농도의 측정이 환자의 치료나 치료결과에 영향을 준다 는 증거는 아직 없으나, 갑상선암의 원격전이를 진단하는 데 도움이 될 수 있다. 세침흡인검사에서 비 정형세포 등 악성과 양성을 명확히 구분하기 어려운 경우 혈청 갑상선글로불린 측정이 악성을 예측할 수 있다는 연구 결과도 있다. 그러므로 수술 전 세포검사에 서 악성도를 확인하기 어려운 경우 혈청 갑상선글로불린 측정이 갑상선암 예측에 도움이 될 가능성이 있다.", "중국의 연구에서는 혈청 갑상선글로불린항체가 양성 일 경우 갑상선유두암의 위험도를 늘린다는 결과가 있 었으나 농도의 정도와는 관계가 없었다. 일부에서 혈청 갑상선글로불린항체의 농도가 높을수록 갑상선여포 암으로 진단받을 위험이 높다는 연구결과도 있다. 림프절전이와 재발이 있는 환자군에서 수술 전 혈청 갑상선글로불린항체가 더 높다는 연구결과들도 보고되고 있다. 그러나 아직까지 수술 전에 일률적으로 갑상선글로불린이나 갑상선글로불린항체를 측정하기에는 근거가 충분하지는 않아, 이를 일률적으로 시행하는 것은 권고하지 않는다."]}, "I.1.3.A": {"ids": ["I.1.3.A"], "p": ["<sup>18<\/sup>F-FDG PET/CT 검사는 수술 전 병기 결정을 위해일반적으로 권고되지는 않는다. 그러나, 갑상선암으로 진단된 환자 중 원격전이가 의심이 되는 경우에는 초기 병기 설정이나 치료 방침 결정, 예후 예측에 있어 <sup>18<\/sup>F-FDG PET/CT 검사가 도움이 될 수 있다. 전이성 갑상선분화암에 FDG가 섭취되는 것은 방사성요오드 치료 시 치료반응에 대한 중요한 음성 예측 인자이고, 낮은 생존율을 예측하는 독립적인 인자가 된다. 또한, 갑상선암은 분화도에 따라 방사성요오드 섭취와 FDG 섭취가 반비례하여, 특히 조직학적으로 공격적인 갑상선유두암의 고위험 아형, 갑상선저분화암, 고등급갑상선분화암과 같은 조직형의 경우에서는 FDG의 섭취가 증가하며 <sup>18<\/sup>F-FDG PET/CT의 민감도가 증가한다. 그러므로수술 전후에 이와 같은 공격적인 조직형이 확인된 경우에는 초기 병기 결정에 <sup>18<\/sup>F-FDG PET/CT 검사가 권고되고 있다.", "한편, 최근의 메타분석에서 수술 전 경부 림프절전이 진단에 있어서 <sup>18<\/sup>F-FDG PET/CT 검사가 경부 초음파검사 또는 CT 검사에 상보적일 수 있음이 보고되었으며, 측경부 림프절전이 병소의 FDG 섭취 정도에 따라 추후 치료방침의 결정 및 예후 예측에도 도움이 될 가능성이 있으므로 이의 유용성에 대한 추가 연구가 필요하다."]}, "I.2.1.A": {"ids": ["I.2.1.A", "I.2.1.B", "I.2.1.C", "I.2.1.D", "I.2.1.E"], "p": ["(1) 비진단적인 경우(Bethesda 범주 1)", "병리진단검사 소견이 비진단적인 경우(Bethesda 범주 1) 대부분 수술적 절제를 하지 않기 때문에 암 위험도를 정확히 평가하기는 어렵다. Bethesda 분류체계를 기반으로 한 대규모 연구 결과를 보면, 세침흡인검사에서 비진단적 결과를 보인 결절은 소아에서 11.4%, 성인에서 12.2%였다. 이 중 소아에서는 21.0%, 성인에서는 13.9% 의 환자가 수술을 받았으며, 수술 검체 중 소아의 15.7%, 성인의 19.1%에서 악성으로 진단되었다. Bethedsa 분류체계 제3판에 따르면, 세침흡인검사에서 비진단적(Bethesda 범주 1)으로 분류된 결절에서 수술이 시행된 경우 성인 에서의 암 위험도는 평균 13%이고 소아에서는 평균 14% 이다. 중심바늘생검에 의한 비진단적 결절에서 수술이 시행된 경우 암 위험도는 평균 33%로 알려졌다.", "세침흡인검사에서 비진단적 결과를 얻은 결절의 암 위험도는 초음파 소견에 따라 달라지며, 높은의심 (K-TIRADS 5) 결절인 경우 의미 있게 암 위험도가 높았다. 79건의 세침흡인검사에 의한 비진단적 결절의 암 위험도를 분석한 국내 연구에 따르면, 높은의심 (K-TIRADS 5) 결절인 경우 암 위험도가 80% (12/15)인데 반해, 중간의심(K-TIRADS 4) 결절에서는 20% (7/35), 낮은의심(K-TIRADS 3) 결절에서는 3.6% (1/28)로, 초음파 소견이 암 위험도를 예측하는 데 도움이 되었다. 또다른 국내 연구에서도 1143건의 세침흡인검사에 의한 비진단적 결절의 암 위험도를 초음파 소견에 따라 분석하였는데, 높은의심(K-TIRADS 5) 결절 105건 중 21건에 서 수술을 진행하였고 17건에서 악성으로 진단되어 높은 악성 빈도를 보였다 (81%, 17/21). 반면 낮은의심 (K-TIRADS 3) 결절은 550 건 중 38 건에서 수술을 진행하였고 10 건에서 악성으로 진단되어 초음파 소견에 따른악성 빈도의 차이가 있었다.", "따라서 반복적인 병리진단검사에도 비진단적 결과가 나오는 경우, 초음파 소견에서 악성을 시사하는 높은의심 소견이 없는 경우에는 주의 깊게 추적 관찰을 할 수 있으나, 초음파 소견상 악성이 강력히 의심되거나, 추적기간 동안 20% 이상 크기가 증가하거나, 임상적으로 악성의 위험도를 가진 경우에는 진단을 위해 초음파 및 임상 소견을 고려하여 수술적 절제를 고려할 수 있다.", "(2) 비정형(Bethesda 범주 3)", "Bethesda 범주 3 비정형은 범주 2 양성으로 진단할 수 없을 정도의 이형성을 보이지만, 범주 4 여포종양, 범주 5 악성의심, 범주 6 악성으로 진단하기에는 불완전한 세 포의 구조적 혹은 핵 모양의 이형성을 보일 때 진단된다. 비정형으로 나온 결절에 대해 다시 세침흡인검사를 시행하는 경우 대부분은 진단적인 결과를 얻지만, 10-30%는 다시 비정형으로 진단된다. Bethedsa 분류체계 제3판에 따르면, 세침흡인검사에서 비정형으로 분류된 결절에서 수술이 시행된 경우 암 위험도는 성인에서는 평균 22%, 소아에서는 평균 28%이다(Table I.2.1.A). 최근 논문에 따르면, 전체 갑상선 세침흡인검사 검체 중 소아는 10.5%에서, 성인은 8.0%에서 비정형으로 진단되었다. 비정형 결절을 수술로 절제하는 비율은 소아에서 62.6%, 성인에서 36.2%로 소아에서 높았고, 수술 후 악성으로 판명되는 비율은 소아에서 37.0%, 성인에서 30.5%였다.", "비정형 검체에서 암 위험도를 예측하기 위해 분자표지자검사를 이용할 수 있다. 유전자변이 검사의 민감도와 특이도는 갑상선유두암의 유병률에 따라 영향을 받 지만, BRAF<sup>V600E<\/sup> 유전자변이가 높은 아시아에서는 BRAF<sup>V600E<\/sup> 단독 검사만으로도 암 위험도가 33-56%에서 71-88%로 높아진다고 보고하였다. 최근 체계적 문헌고찰에서 비정형 결절을 대상으로 한 유전자패널검사의 암 위험도는 검사를 시행하지 않은 경우 17-26%와 비교하여 27-43%로 상승함을 보고하였고, 2개 이상의 유전자변이 등 나쁜 예후와 연관된 유전자변이가 발견되거나 고위험의 유전자 발현 양상을 보이면 수술 등 적극적인 치료 결정에 도움을 줄 수 있다.", "비정형으로 진단된 결절에서 초음파 소견은 결절의 악성도를 예측하는 데 도움이 되며, K-TIRADS를 기반으로 한 높은의심 초음파 소견을 보이는 결절에서 암 위험도가 63-89%로 높다. 따라서, 비정형 결과를 보이는 결절에서 병리진단검사 재검, 분자표지자검사 등이 시행되지 않았거나 결론에 이르지 못했을 경우, 임상적인 위험 인자, 초음파 소견, 환자의 선호도에 따라 초음파 추적 관찰 또는 진단적 수술이 시행될 수 있다.", "(3) 여포종양(Bethesda 범주 4)", "Bethesda 분류체계에서 범주 4 여포종양은 세포 밀도 가 높은 검체로 1) 여포세포가 유두암의 핵의 특징 없이 세포 군집 또는 소포 형태의 구조적인 변화를 보이는 경우, 2) 유두암 핵의 특징이 있더라도 유두 구조를 보이지 않고 소포 형태의 구조적인 변화를 보이는 경우, 3) 거의 대부분 호산성세포로만 구성된 경우에 진단된다. 2016 년 noninvasive follicular thyroid neoplasms with papillarylike nuclear features (NIFTP) 진단명이 도입된 이후 유두암 세포핵의 특징을 보이더라도 소포 형태의 구조적인 변화를 보이고 유두 구조는 보이지 않는 경우에는 대부분 여포종양으로 진단된다.", "세침흡인검사에서 여포종양으로 진단되는 비율은 소아에서 6.1%, 성인에서 6.1%이며, 중심바늘생검의 여포종양 진단 비율은 8-18%로 세침흡인검사보다 더 높 다. 세침흡인검사에서 진단된 여포종양에서 수술 비율은 소아에서 84.3%, 성인에서 60.5%로 소아에서 더 높고, 수술 후 악성 비율은 소아에서 41.4%, 성인에서 28.9%였다. 국내 환자를 대상으로 시행된 연구에 따르면, 중심바늘생검에서 여포종양으로 진단된 결절에서 수술 후 NIFTP 혹은 악성으로 판명되는 비율은 53-58%였다. 14개의 관찰연구에서, 2016개의 여포종양으로 진단된 결절을 포함한 종합된 근거를 합성한 결과에 따르면, 여포종양으로 진단된 2 cm 이상의 종양에서 종양의 크기가 커질수록 암 위험도가 증가한다. 종양 크기가 2 cm 이상인 경우가 2 cm 미만인 경우에 비해 암 위험도가 1.8 배, 2 cm 이상인 종양에서 암 위험도가 높았다. 종양 크기 3 cm를 기준으로 하는 경우 암 위험도는 2.4배이고, 4 cm를 기준으로 하는 경우 암 위험도는 2.3 배, 3 cm 또는 4 cm를 기준으로 할 때에도 기준 크기 이상에서 암 위험도가 2.3배가량 높았다.", "여포종양에서 진단되는 악성 종양의 상당수가 갑상선여포암 또는 NIFTP이기 때문에 수술적 절제를 통해서만 정확한 진단이 가능하며, 미국과 유럽의 갑상선결절 권고안에서도 세침흡인검사에서 여포종양으로 진단된 경우 수술적 절제를 우선적으로 권고하고 있다. 다만 여포종양에서 62-70%의 빈도로 불필요한 수술이 발생하 므로 수술 후 양성 결과가 나올 수 있음과 수술 후 발생할 수 있는 합병증에 대해 수술 전 환자에게 충분히 설명하고, 임상 상황, 초음파 소견 등을 고려하여 수술을 결정해야 한다.", "차세대염기서열기반 유전자패널검사의 임상적인 적 용이 가능하다면 여포종양에서 수술 결정을 위해 분자표지자검사를 활용할 수 있다. 그러나, 양성 결절에서도 유전자변이가 발견되므로 단일유전자만 발견되었을 때에는 악성 여부가 결론적이지 않고, 암 위험도도 발견된 유전자변이에 따라 상이하므로, 분자표지자검사도 여포종양의 악성 여부를 결정하는 데는 결론적이지 않다. 다만, 단일유전자변이가 발견되었을 경우에는, 환자의 임상상황, 초음파 소견, 환자의 선호도와 함께 해당 유전자변이의 암 위험도와 이와 연관된 갑상선암의 진 행위험도 또는 예후연관성을 고려하여 수술 시행 여부 또는 수술 범주를 결정할 수 있다.", "(4) 악성의심(Bethesda 범주 5)", "악성의심은 악성이 강력히 의심되지만 악성으로 확진 하기에는 병리학적 소견이 부족할 때 진단되며, 세침흡인검사에서 악성의심 세포 소견을 보여 수술이 시행된 경우 암 위험도는 평균 74%이고, 중심바늘생검에서 악성의심 세포로 나온 검체를 수술한 경우 암 위험도는 98%이다(Table I.2.1.A). 이 범주는 전체 갑상선결절에 대한 세침흡인검사의 1-6%를 차지하며, 수술 후 악 성도는 소아에서 90.5%, 성인에서 79.6%로 보고되었다. 최근 16개의 연구를 분석한 체계적 문헌고찰에 따르면 세침흡인검사에서 악성의심 세포 소견을 보인 결절의 악성 빈도는 92.5%였다. 이 범주는 암 위험도가 높기 때문에 수술적 절제의 적응증이 된다.", "수술 전 분자표지자검사 결과가 암 위험도를 보다 정확히 예측하고 수술적 절제에 대한 의사 결정을 바꿀 수 있다면 단일 또는 차세대염기서열기반 유전자패널 분자표지자검사를 고려해 볼 수 있다. 특히, TERT 프로모터돌연변이와 BRAF<sup>V600E<\/sup> 돌연변이가 함께 동반된 경우, BRAF<sup>V600E<\/sup> 돌연변이만 있는 경우에 비해 TNM 병기가높고(4.2배), 원격전이(11.7배), 재발률(4.3배) 및 사망률 (15배)이 높은 것으로 알려져 있다. 이를 포함하여 두 개 이상의 돌연변이나 불량한 예후를 예측하는 돌연변이가 발견된다면 적극적으로 수술적 치료를 고려해야 한다. 다만 분자표지자검사의 임상적인 유용성에 대해서는 비용-효과 등을 고려한 추가 연구가 필요하다.", "정리하면, 병리진단검사에서 악성의심인 경우, 악성으로 진단된 경우와 유사하게 임상적인 위험 요소, 초음파 소견, 환자의 선호도를 고려하여 수술적 절제를 시행하며, 유전자변이검사 결과에 따라 수술적 절제에 대한 의사 결정이 바뀔 수 있을 경우에는 분자표지자검사를 고려해 볼 수 있다."]}, "I.2.2.A": {"ids": ["I.2.2.A", "I.2.2.B", "I.2.2.C", "I.2.2.D", "I.2.2.E", "I.2.2.F"], "p": ["본 권고안에서는 개정된 American Joint Committee on Cancer (AJCC) 8판의 T stage에 따라 수술 범위를 세분화하여 권고하였다. 2016년 갑상선결절 및 암 진료권고안 이후 축적된 문헌을 근거로 국소적으로 진행된 소견이 없는 종양 크기 1 cm 이하(T1a)의 저위험군 갑상선암의 수술로는 갑상선엽절제술을 강하게 권고하였다. 또한 2016년 권고안에서 1 cm 초과의 갑상선암에서 갑 상선(근)전절제술을 권고했던 것에 비해, 본 권고안에서는 임상적으로 진행된 소견이 없는 1-2 cm 크기(1 cm 초과, 2 cm 이하; T1b)의 갑상선암에 대해서는 갑상선엽절제술을 우선적으로 권고하고 있다. 갑상선암의 크기가 2-4 cm (2 cm 초과, 4 cm 이하, T2)이면서 임상적으로 진행된 소견이 없는 경우 재발과 합병증에 미치는 영향을 고려하여 갑상선엽절제술 또는 갑상선전절제술을 선택하여 시행하는 것을 권하였다. 반면 갑상선암의 크기가 4 cm 초과이거나(T3a), 띠근육을 육안적으로 침범한 경우(T3b) 갑상선전절제술을 선택적으로 권하며, 주요 기관에 대한 육안적 침범(T4), 경부 림프절전이(cN1), 원격전이(M1)가 확인되는 경우 갑상선전절제술을 우선적으로 권하였다.", "(1) 임상적 T1, T2", "갑상선유두암의 수술방법에 따른 예후를 분석한 메타분석에 따르면, 종양 크기 1 cm 이하 (T1a), 또는 1.0-2.0 cm (T1b) 그룹에서는 갑상선전절제술과 엽절제술의 생 존율간 통계적 차이가 없었다. 반면 종양 크기 2.0-4.0 cm (T2) 그룹에서는 갑상선전절제술을 받은 그룹에서 엽절제술을 받은 그룹보다 사망률이 더 낮았다(위험비 0.88, 95% 신뢰구간 0.79-0.99).", "위 메타분석에 포함된 연구 중 미국 SEER 암등록자 료(1985-1998)에 포함된 갑상선유두암으로 진단 받은 52,173명의 환자의 예후를 분석한 결과, 종양 크기 1 cm 미만에서는 이전 메타분석과 마찬가지로, 수술 방법에 따른 사망률의 차이가 없었지만, 1.0-2.0 cm (T1b)와 2.1-4.0 cm (T2)에서는 엽절제술을 시행받은 환자가 전절제술을 받은 환자에 비해 재발률(위험비 1.24-1.26)과 사망률(위험비 1.31-1.49)이 통계적으로 의미 있게 증가하였다. 또 다른 연구로 미국 SEER 암등록자료(2004-2008)에 포함된 종양 크기 1.0-3.9 cm이면서 임상적으로 림프절전이가 없는 33,816명의 갑상선유두암 환자를 분석한 연구에 따르면, 여포아형 갑상선유두암은 수술 범위에 따른 생존율 차이가 없었으나, 갑상선유두암(conventional PTC)의 경우 전절제술을 받는 것이 생존율이 개선되었다. 특히 2.1-4.0 cm (T2)에서 엽절제술을 받는 환자들의 생존율이 통계적으로 유의하게 불량하였다(위험비 1.53). 갑상선유두암 T1b-T2 (종양 크기 1.1-4.0 cm)에 해당하는 8083례의 예후를 분석했던 연구에 따르면, 1552례가 육안적 갑상선외부침범, 임상적으로 경부 림프절전이, 원격전이 등 공격적인 암의 특성이 있었으 나 엽절제술을 받았고, 10년 추적기간 동안 88.5%의 생존율을 보여, 공격적인 암의 특성이 없고 엽절제술을 받 았던 환자들의 생존율 92.4%에 비해 유의하게 낮았으며, 사망률은 1.97배 높았다. 공격적인 암의 특성이 있으나 갑상선전절제술을 받고 방사성요오드 치료를 받는 것이 엽절제술만 받는 것에 비해 사망률을 낮추었다(위험비 0.65, 95% 신뢰구간 0.51-0.83).", "이상을 종합하였을 때, T1a, T1b 에서는 갑상선엽절제술을 받은 군에서도 생존율에 차이가 없었다. 그러므로, 두경부 방사선조사의 과거력이 없고 가족성 갑상선암이 아니면서 경부 림프절전이가 없는 갑상선 내에 국한된 단일 병소의 2 cm 이하의 작은 갑상선암의 경우(T1a, T1b) 일반적으로 초기 수술은 갑상선엽절제술로 충분할 수 있다. 이는 갑상선전절제술이 재발을 최소화하겠지 만, 엽절제술 후에도 상당히 낮은 재발률을 보이며, 재발 되더라도 재치료가 효과적이므로 재발률이 약간 높아지 더라도 처음에는 보존적인 치료를 선택하는 것이 가능 하기 때문이다.", "다만 수술 후 방사성요오드 치료를 포함한 전체적인치료 전략상 필요하거나, 55세 초과, 반대쪽 엽의 결절, 두경부 방사선조사의 과거력, 가족성 갑상선암의 경우에는 갑상선전절제술이 우선적으로 권고될 수 있다. 그러나, 2 cm 이하의 크기에서도 육안적 갑상선외부침범이나 임상적 경부 림프절전이 등 공격적 암의 특성이 있다면 전절제술에 비해 엽절제술의 생존율이 감소하므 로, 수술 전 정밀한 영상검사를 통해 공격적이고 진행된 암의 특성 유무를 확인하고 수술 범위를 결정하는 것이 필요하다.", "반면, T2 이상에서는 갑상선엽절제술을 받은 군에서 갑상선전절제술에 비해 생존율이 감소하였다. 미국의 1998-2006년 미국 SEER 암등록자료에 포함된 61,755명 의 갑상선유두암 환자를 분석한 자료에서는 종양 크기 1-2 cm (T1b), 2-4 cm (T2)에서 수술 범위에 따른 생존율의 차이가 없다고 보고하였으나, 위에서 언급한 바와 같이 1985-1998년 또는 2004-2008년 의 미국 SEER 암등록자료와 이들을 포함한 메타분석 에서는 2-4 cm 사이의 갑상선암(T2)에서는 갑상선전절제술을 받은 환자들의 생존율이 엽절제술을 받은 환자들에 비해 우월하였다. 따라서 종양 크기 2-4 cm 갑상선암(T2)에서 재발위험도 감소를 위해서는 갑상선전절제술을 고려할 수있다, 그러나, 연구 결과가 충분하지 않고 재발률이 높지 않고(전절제술 7.7%, 엽절제술 9.8%), 갑상선전절제술에 따른 수술 합병증 증가의 우려가 있다. 그러므로, 본 권고안에서는 종양 크기 2-4 cm 갑상선암(T2)의 수술 범주의 선택에 있어서 엽절제술 또는 전절제술 중 한 가지 를 우선적으로 권고하기보다는, 재발과 합병증의 위험도 등을 고려하여 선택하도록 하였다.", "(2) 임상적 T3, T4", "AJCC 8판에서는 육안적 갑상선외부침범 없이 띠근육에만 갑상선암이 침범하는 경우를 T3b로 정의하였고, 55 세 이상의 환자에서 10 년 질병특이 생존율을 85-95%, 55세 미만의 젊은 연령에서는 98-100%로 추정하였다. 이후 실제로 보고된 국내 단일 기관과 미국 단일 기관의 보고에 따르면 전체적인 T3b의 10년 생존율은 각각 98.9%, 96.4%이다. 최근 63,315명의 갑상선암 환자가 포함된 미국 SEER 암등록자료(2004-2012)를 분석한 연구에서는 갑상선외부침범이 없는 경우(no extrathyroidal extension, ETE), 현미경적 침범(microscopic ETE)하는 경우, 띠근육에만 국한하여 육안적으로 침범(T3b)하는 경우, 경부 주요 장기를 광범위하게 육안적으로 침범 (T4) 의 경우, 5 년 질병특이 생존율을 각각 99.7%, 98.5%, 98.0%, 87.6% 로 보고하여 T stage 증가에 따라 생존율이점차 감소하고 T4의 생존율이 월등히 감소하였다. 특히, T3b이면서 종양 크기가 4 cm를 초과하는 경우 10년 질병특이 생존율이 88.1%로, 4 cm 이하인 T3b의 97.1% 에 비해 현저히 감소하였다. 또한 T3b와 T4와 같은 높은 T stage가 5년 암특이 생존율의 독립적인 위험인자(각각 위험비 5.6, 위험비 32.6)로 보고하였다. 다만 국내 단 일기관 연구들에서는 T3b의 경우 10년 암특이 생존율이 98.9-99.1%로 재발률, 생존율 등 예후에 독립적인 인자는 아니었다. AJCC 8판에 새로 도입된 T3b가 예후에 미치는 영향을 확인하기 위해 8개의 후향적인 논문을 분 석하여 종합된 합성 결과를 도출하였을 때, 띠근육에 국한된 육안적 갑상선외부침범(T3b)을 보이는 경우, 띠근육 침범이 없는 환자군에 비해 불량한 재발률(오즈비 1.71)과 암특이 사망률(오즈비 4.94) 및 전체 사망률(오즈비 1.68)을 보였다. 다만 이들 연구의 근거 수준은 매우 낮음, 또는 낮음으로 평가되었으며 따라서 T3b의 갑상선암의 경우, 재발 감소 등 예후 향상과 수술 후 합병증 증가 측면을 고려하여 갑상선전절제술을 선택적으로 시행할 수 있다.", "반면, 크기가 4 cm 초과하는 경우(T3a) AJCC 8판에서는 55세 이상의 환자에서 10년 질병특이 생존율을 85-95%로 추정하며, 갑상선에 국한되며 크기가 4 cm 이하인 종양의 10년 질병특이 생존율 98-100%보다 월등히 낮게 추정하여 갑상선전절제의 근거가 된다. 국내 연구들에서도 AJCC 8판과 유사하게 T3a의 10년 질병 특이 생존율을 88.4-95.3%로 보고하였고, 띠근육만 육안적으로 침범하는 T3b에 종양 크기 4 cm 이상의 T3a가 동반될 때 T3b 단독에 비해 생존율이 의미 있게 감소한다는 근거 로 보아, 특정 상황에서 논란이 있을 수 있으나, 2023년 대한두경부외과학회에서 권고한 바와 같이, 종양 크기가 4 cm 초과(T3a)하는 갑상선암의 경우 불량한 예후와 방사성요오드 적용 가능성을 고려하여 일반적으로 갑상선전절제를 권고한다.", "한편, 갑상선암의 크기에 상관없이 기도, 식도, 후두, 되돌이후두신경, 피하조직, 혈관 등 경부의 주요 기관을 육안적으로 광범위하게 침범하는 경우(T4), 또는 임상적으로 경부 림프절전이나(cN1) 원격전이(M1)가 분명한 경우, 갑상선암에서는 특별한 금기가 없는 한 처음 수술 시 갑상선전절제와 원발암의 완전한 육안적 제거가 필요하다.", "외과의의 경험이 많을수록 환자의 치료 성적이 좋고 합병증의 빈도가 낮다는 연구 결과가 꾸준히 보고되어 왔다. 국내 단일 기관 연구에서는 외과의의 수술 경험이 늘어날수록 부갑상선기능저하증, 성대 마비, 수술 후 출혈이나 감염의 빈도가 크게 감소함을 보고하였다. 또다른 국내 다기관, 전향적 연구에서는 경험 많은 외과의 에서 수술 시간이 짧고 수술 후 합병증이 적었으며, 수술 후 성적이 안정되기 위해서는 50건 이상의 수술 경험이 필요하다고 보고하였다. 미국에서 보고된 연구 에서는 16,954례의 갑상선절전제술의 수술 후 부작용과 외과의의 연간 갑상선 수술 건수의 상관관계를 분석하였는 데, 연간 25례 이하의 갑상선 수술을 하는 외과의의 갑상선전절제술 수술 후 부작용 발생 위험이 1.5배, 수술 후 입원 일수가 12% 증가함을 보고하였다. 따라서 공격적이고 진행된 암의 특성(임상적 림프절전이, 되돌이후두신경의 침범, 육안적 갑상선외부침범 등)을 보이는 경우에는 병소의 완전한 절제를 통해 치료 성적을 높이고 합병증 발생을 줄이기 위해 숙련된 외과의에게 수술받고 향후 치료 전략을 종합적으로 수립할 수 있는 상급 병원 에서 치료받는 것이 필요하다."]}, "I.2.3.A": {"ids": ["I.2.3.A"], "p": ["갑상선유두암의 양호한 예후를 근거로 하여, 병리진단검사로 악성의심 또는 악성(Bethesda 범주 5 또는 6)으 로 진단된 저위험군 갑상선유두암에 대한 적극적 관찰이 도입되었다. 적극적 관찰을 결정하기 위해서는 고위험군을 제외하는 적절한 선별과정이 중요하며, 다음과 같은 경우에는 수술을 우선적으로 고려한다.", "가. 임상적으로 림프절전이 또는 원격전이가 의심되는 경우", "나. 임상적으로 종양의 육안적 갑상선외부침범이 있거나 기관(trachea) 또는 되돌이후두신경(recurrent laryngeal nerve, RLN) 침범이 의심 또는 우려되는 경우", "다. 갑상선유두암의 공격적인 조직아형이 관찰되는 경우(긴세포, 원주세포, Hobnail 아형 등)", "적극적 관찰을 진행하는 동안 고해상도 초음파를 포함한 주기적인 추적 과정이 요구되며, 추적 중에 질병 진행이 확인될 때까지 수술을 지연한다. 질병 진행의 정의는 종양의 크기 증가와 림프절전이가 새롭게 발견되는 경우를 기준으로 한다. 종양의 크기 증가는 개별 연구 별로 기준의 차이가 있으나 대부분의 연구에서 1) 종양의 최대 길이가 3 mm 이상 증가하는 경우와 2) 새로운 경부 림프절 혹은 원격전이나 갑상선외부침범 소견이 관찰되는 경우로 정의하였다. 종양의 부피를 기준으로 하여 50% 이상 증가하는 경우를 포함하는 연구들이 있으나, 부피 계산 과정에서 과대평가될 가능성이 있어 기준을 72-100%로 하는 연구도 있고, 2개 이상의 직경이 각 2 mm 이상 증가하는 경우를 기준으로 하기도 하였다. 크기 또는 부피가 커진 경우에는 측정에 따른 오차 등을 고려하여 3-6개월 간격으로 초음파를 시행하여 증가 소견을 확인하는 것이 권고되기도 한다.", "국내 연구를 포함한 2 cm 이하의 저위험군 갑상선유두암을 대상으로 평균 19개월에서 7.6년까지 적극적 관찰을 시행한 9개의 연구에서 종양의 길이가 3 mm 이상 증가하는 경우가 2.2-10.8%, 종양의 부피가 50% 이상 증가하는 경우가 16.0-28.8%로 보고되었으며, 새로운 림프절전이는 0-4.5%에서 발생하는 것으로 보고하였다. 일본에서 미세갑상선유두암으로 진단된 3222명의 적극적 관찰을 시행한 환자(평균 7.3년, 1.0-29.3년)의 장기간 추적 관찰 결과, 10년과 20년째 종양 크기 증가는 4.7%, 6.6%에서, 새로운 림프절전이는 1.0%, 1.6%에서 관 찰되었다. 진단 당시 즉시 수술이 시행된 1327명의 환자의 1.4%에서 잔여 갑상선 재발이 확인되었으며, 10년과 20년째 림프절전이는 0.4%, 0.7%로 적극적 관찰군에 비해 유의하게 낮았지만(p=0.009) 그 차이가 크지 않음을 보고하여, 저위험군 미세갑상선유두암 환자에서 적극적 관찰의 장기간 안전성을 확인하였다.", "2 cm 이하의 저위험군 갑상선유두암 환자를 대상으로 적극적 관찰을 시행한 연구 에서 1-2 cm과 1 cm 미만 군 간의 종양 크기 및 부피 변화의 차이는 없었으나, 1 cm 이상의 경우 우선적으로 수술이 권고되었고 수술을 원하지 않는 경우 적극적 관찰군으로 포함되어 있어 1-2 cm 크기의 종양에 대해서는 해석의 제한이 있다. 1 cm 이하의 환자 2705명을 대상으로 한 연구 결과에서 종양 크기가 9 mm 이상의 경우 종양 진행가능성이 높음이 보고되기도 하여(위험비 1.79, 95% 신뢰구간 1.11-2.86) 1-2 cm의 저위험군 갑상선유두암에서의 적극적 관찰에 대해서는 추가적인 연구가 필요하다.", "질병 진행과 관련된 인자로 연령, 성별, 초음파 소견에 대한 연구결과가 발표되었다. 적극적 관찰기간 동안 종양배가시간 (tumor volume doubling time) 이 빠른 경우 종양의 크기 증가 및 새로운 림프절전이의 발생이 유의하게 많이 관찰됨이 보고되었다. 국내 전향적 연구에서 적극적 관찰군의 질병 진행과 관련된 인자를 분석한 결과, 젊은 연령(30세 미만), 남성 및 종양의 크기가 6 mm 이상, 기저 TSH 농도 7 mIU/L 이상 및 초음파에서 종양내 혈류 소견이나 미만성 갑상선 질환 소견이 보이는 경우 등이 연관 관계를 보여주었다. 1235명의 환자를 대상으로 시행한 일본 연구에서 40세 미만의 젊은 환자에서는 3 mm 이상 종양의 길이가 증가되는 경우가 5.9%로 60세 이상의 2.2%에 비해 높았으며 림프절전이 도 젊은 환자에서 5.3%, 60세 이상에서 0.4%로 보고하였다. 따라서 기대수명과 동반질환으로 인한 상대적으로 높은 수술 합병증의 위험도를 고려하였을 때, 고령의 환자에서 적극적 관찰을 시행하는 것을 고려해 볼 수 있겠다. 다만 종양이 진행하는 경우에는 고령의 경우 예후를 결정하는 위험인자이므로 면밀한 추적 검사를 통하여 진행을 확인한 후 수술적 치료를 고려하여야 한다.", "갑상선유두암은 여성에서 남성에 비해 3배 높은 빈도를 보이며, 그 중에서도 가임기 여성이 1/3 정도를 차지 하기 때문에 적극적 관찰 중 임신에 대한 고려가 필요하다. 임신 중 증가되는 인간 융모막 성선자극호르몬 (human chorionic gonadotropin, hCG)과 에스트로겐이 갑상선암의 성장을 자극할 수 있다는 이론적 배경에서 임신 중 갑상선암의 진행에 대한 우려가 있다. 하지만, 임상적으로는 임신 중 진단된 갑상선암 환자의 종양진 행은 뚜렷하지 않았다. 적극적 관찰 중인 50명의 임산 부를 대상으로 추적관찰한 연구에서 종양의 길이 3 mm 이상 증가가 8%에서 관찰되었으며, 림프절전이는 관찰되지 않았다. 종양 크기가 증가한 4명의 환자 중 2명은 출산 후 수술을 시행하였으며 수술 후 재발은 없었다. 나머지 2명에서는 적극적 관찰을 지속하였으며 종양의 크기 증가는 그 이후 관찰되지 않았다. 따라서 추가적인 연구가 필요하지만, 임신을 원하는 미세갑상선유두암 환자에서 적극적 관찰에 대해서는 현재까지는 추천할 수 없다는 근거는 없으며, 적극적 관찰 중 임신을 하게 된 경우 면밀한 추적 관찰이 필요하다.", "한편, 치료 범주와 합병증, 그리고 질환의 장기적 예후가 적극적 관찰 중 진행 소견을 보여 수술을 하는 경 우(진행 후 수술군)와 즉시 수술하는 경우(즉시 수술군) 간 차이가 있는지가 치료 방침 결정에 중요하다. 일본에서 수술을 받은 699명 환자에서 분석한 연구 에서는 즉시 수술군과 진행 후 수술군 간 치료 범주, 합병증 및 수술병리 소견 모두 차이가 없었다. 반면 516명의 수술 후 경과를 분석한 국내 전향적 연구에서 즉시 수술군과 진행 후 수술군 간의 갑상선절제 범위와 합병증에는 차이가 없었으나, 림프절전이와 방사성요오드 치료 비율이 진행 후 수술군에서 증가하였다.", "적극적 관찰은 지속적인 추적 관찰이 필요하므로, 이에 따른 환자의 삶의 질과 사회경제적 측면에 대한 고려가 필요하다. 국내의 현재 의료환경을 기반으로 분석한 경제성 평가 연구 결과에서는 직접의료비용이 초기에는 즉시 수술군에서 높으나 약 16년 후부터는 적극적 관찰 군에서 높은 것으로 보고되었다. 그러나 환자의 삶의 질이나 불안감은 적극적 관찰을 선택한 경우에서 초기 선택 당시뿐만 아니라 추적 경과 중에도 지속적으로 양호한 결과를 보여 주었고, 적극적 관찰 도중 수술을 받은 환자 중에서는 진행되어 수술을 받은 경우가 진행 소견 없이 수술로 변경한 경우보다 높은 삶의 질을 보여주었다. 즉, 치료 방침 자체가 삶의 질에 영향을 미치는 것 보다는 환자의 특성이 삶의 질과 치료법의 선택에 영향을 미침을 시사하고 있다. 결국 저위험군 갑상선암 환자의 치료 방침 결정과 추적 관찰에 있어서, 종양의 자연 경과뿐 아니라 치료 방침에 따른 합병증과 예후, 사회의료비용 및 환자의 삶의 질 등이 함께 고려되어 환자의 선호도를 충분히 반영한 환자와 의사의 공유의사 결정이 중요하며, 이를 위해서는 이에 대한 임상 근거 의 창출과 이에 기반한 적정 진료 지침과 프로토콜, 환자 설명서 등의 구축이 필요하다."]}, "I.2.4.A": {"ids": ["I.2.4.A", "I.2.4.B", "I.2.4.C", "I.2.4.D", "I.2.4.E"], "p": ["경부 림프절의 구역은 잘 정의되어 있는데, 가장 흔히 전이되는 림프절 구역은 중앙경부 림프절 구역(level VI) 이다(Fig. I.2.4.A). 최근 중앙경부와 그 세부 림프절의 해부학적 경계, 그리고 중앙경부 림프절절제에 관한 용어 들이 관련 전문가들의 합의를 통해 결정되었다. 중앙경부 림프절전이는 대부분 수술 전 영상검사 또는 수술 중 검사로 발견되지 않아 임상적으로 림프절전이가 없는 것(cN0)으로 여겨질 수 있으며, 이 경우 예방적 중앙경부 림프절절제술을 시행하지 않았다면 수술 후 병기 결정에 cN0를 적용한다. 반대로 예방적 중앙경부 림프절절제술을 시행한 경우에는 수술 후 병리 결과에 따 르며, 이 경우 수술 후 조직에서도 림프절전이가 없다면 pN0를 적용한다.", "국소 림프절전이는 진단 당시 갑상선유두암 환자의 대부분에서 관찰되는 반면, 갑상선여포암에서는 그 빈도가 낮다. 보고자에 따라 저위험군 갑상선유두암 환자에서 림프절전이는 치료 성적에 중요한 영향을 미 치지 못한다고 하지만, 대규모 후향적 연구에서는 생존율에 영향을 미치는 중요한 예측 인자의 하나이며, 특히 진단 시 연령이 55세 초과인 환자에서 중요하다고 보고되었다. 또한 림프절전이의 정도에 따라 재발의 위험도가 결정되는데, 제한된 범위의 림프절 미세전이에 비해 임상적으로 림프절전이가 뚜렷하거나, 다발성이거나, 크기가 크거나 피막외 침범을 보이는 림프절전이의 경우 등에서 재발의 위험이 증가하였다. 최근에는 대규모 후향적 연구결과로 55세 미만의 환자에서도 림프절전이가 있는 경우가 없는 경우에 비해 적은 정도이기는 하지만 유의하게 사망의 위험이 증가되며, 전이 림프절의 수가 증가할수록 재발 위험도 증가되었다.", "한편, 예방적 중앙경부 림프절절제술을 통해 얻는 병기 정보는 사용에 유의해야 하는데, 예방적 림프절절제술은 림프절의 미세전이(pN1a)를 발견할 가능성을 높여, 병기를 상향 조정할 수 있기 때문이다. 특히 55세 이상 환자의 경우 AJCC 병기가 1기에서 2기로 올라갈 수있다. 그러나 실제로 림프절의 미세전이는 육안적 전이에 비해 재발에 미치는 영향이 크지 않은 것으로 알려져 있다. 예방적 중앙경부 림프절절제술은 병기 상승 으로 방사성요오드 치료의 대상을 넓힐 수도 있고, 일부 환자에서는 림프절전이가 없음을 확인하여 대상을 줄일 수도 있다. 예방적 중앙경부 림프절절제술의 적절한 수술 범위에 대해서는 아직 더 많은 전향적 연구가 필요하다.", "임상적으로 확인된 림프절전이(cN1)에 대한 치료적 림프절절제술의 역할은 잘 확립되어 있으며, 수술 전 중앙경부 림프절전이가 명확한 경우 갑상선전절제술과 동시에 중앙경부 림프절절제술을 시행한다. 한편, 수술 전 중앙 림프절전이가 확인되지 않은 갑상선분화암 환 자(cN0)에서 예방적 중앙 림프절절제술이 재발률을 낮 추지만, 특히 일부 연구에서 미세전이의 경우 재발이나 치료 성적에 미치는 영향이 크지 않다고 보고하였다. 또한, 예방적 중앙경부 림프절절제술은 병리 학적으로 확인되는 림프절전이(pN1)의 빈도를 높이게 되는데, 앞서 기술하였듯 림프절의 미세전이는 재발에 미치는 영향이 적고, 장기 치료 성적에 미치는 영향은 크지 않은 반면, 성대마비나 부갑상선기능저하증 과 같은 수술 합병증은 증가시킨다는 점을 고려해야 한다. 림프절전이가 흔하지 않은 갑상선여포암에서는 일반적으로 예방적 중앙경부 림프절절제가 필요하지 않다.", "본 위원회에서 임상적으로 수술 전 중앙경부 림프절전이가 발견되지 않은(cN0) 갑상선분화암 환자 1052명 을 대상으로 한 전향적 무작위배정연구 6편에 대해 메타 분석을 수행한 결과, 환자에서 예방적 중앙경부 림프절절제술은 전체 재발률을 오즈비 0.38로 유의미하게 감소 시켰으나 영구적 부갑상선기능저하증 / 칼슘저하증 같은 수술 합병증의 위험 또한 오즈비 2.33으로 증가시켰다. 동일한 기준의 환자 23,511명을 대상으로 한 후향적 관찰연구 32편에 대한 메타분석 결과에서도 예방적 중앙경부 림프절절제술은 전체 재발률을 오즈비 0.62, 중앙경부 림프절 재발률을 오즈비 0.42로 유의미하게 감소시 켰으나 측경부 림프절 재발률은 감소시키지 못하였다 (오즈비 0.92; 95% 신뢰구간 0.73-1.14). 반면 영구적 부갑상선기능저하증/칼슘저하증, 일시적 성대마비와 같은 수술 합병증의 위험은 오즈비 1.63 과 1.78 로 증가시켰다. 이처럼 비록 재발률 감소 효과는 있으나 주로 중앙경부림프절 재발에 국한되며, 재발률 자체가 2.7% (후향적관찰연구)-3.4% (전향적 무작위배정연구)로 낮기 때문에 실제 임상에서 예방적 중앙경부 림프절절제술의 적용은 재발 감소에 따른 종양학적 이득과 합병증의 위해를 고려하여 결정하여야 한다. 또한, 예방적 중앙경부 림프절절제술의 역할은 병기 결정에 필요한 정보를 줄 수 있는데, 예방적 중앙경부 림프절절제술이 수술 후 갑상선글로불린 수치를 낮추며 병기 결정에 유용하여 방사성요오드 치료 결정과 재발 위험 예측에 도움이 된다는 보고들도 있다. 그러므로 수술 후 예후 예측 및 치료 전략 결정이 필요한 경우에 예방적 중앙경부 림프절절제술을 고려할 수 있다.", "이런 이유로 미국, 영국, 유럽종양학회 등의 최신 권고 안마다 예방적 중앙경부림프절절제술에 대한 권고문은 약간씩 차이가 있으며 대부분 진행된 원발암의 경우에만 예방적 중앙경부 림프절절제술을 고려할 것을 권고하고 있거나 아예 권고하지 않는 경우도 있다. 재발률의 경우 진단 당시 암의 진행정도 및 여러 임상적 요소들이 다양하게 영향을 미칠 수 있는 반면, 수술 합병증의 경우 숙련된 외과의가 중앙경부 림프절절제술을 시행하는 경우 합병증 발생 빈도가 낮은 것으로 알려져 있으므로 외과의의 숙련도 고려가 함께 필요하다.", "갑상선암에서는 측경부(구역 II-V, Fig. I.2.4.A)와 구역 VII (전종격동), 그리고 드물게 구역 I의 림프절전이가 발생한다. 림프절전이가 수술 전 영상검사, 세침흡인검사 또는 세침흡인세척액-갑상선글로불린 검사를 통해 임상적으로 확인되거나, 수술 중에 확인되는 경우, 구역 단위의 림프절절제를 통해 재발의 위험을 낮추고 나아 가서 사망률을 줄일 가능성도 있다. 그러므로 수술 전 측경부 림프절전이가 명확한 경우에는 측경부 림프절절제술을 시행한다.", "예방적 중앙경부 림프절절제가 필요한 고위험군을 예측하는 데 종양의 돌연변이 유무의 역할에 대한 연구들이 최근 보고되고 있다. BRAF<sup>V600E<\/sup> 돌연변이는 림프절전이와 연관된다는 결과 와 그렇지 않다는 결과들이있다. 특히 우리나라와 같이 BRAF<sup>V600E<\/sup> 돌연변이 빈도가 높은 지역에서는 원발암의 BRAF<sup>V600E<\/sup> 돌연변이에의한 재발 또는 사망의 양성예측도는 제한적이므로, BRAF<sup>V600E<\/sup> 돌연변이만 단독으로 발견된 경우에는 이에의존하여 예방적 중앙경부 림프절절제술 여부를 결정하는 것은 바람직하지 않다. 다만, 수술 전 TERT 프로모터 돌연변이가 BRAF<sup>V600E<\/sup> 돌연변이와 함께 동반된 경우에는 림프절전이와 원격전이를 증가시키므로 예방적 중앙경부 림프절절제술을 함께 시행하는 것이 바람직하다."]}, "I.2.5.A": {"ids": ["I.2.5.A", "I.2.5.B", "I.2.5.C", "I.2.5.D", "I.2.5.E"], "p": ["세포 검사 결과가 미결정 또는 비진단적이어서 갑상선엽절제술을 시행한 후에 갑상선암으로 진단되면 갑상선완료절제술이 필요할 수 있다. 또한 일부 갑상선암 환자에서 다발성 병소를 제거하고 방사성요오드 치료의 효율을 높이기 위해 갑상선완료절제술이 필요하기도 하다. 그러나 갑상선 내에 국한된 유두암 또는 저위험 여포암의 경우에는 갑상선엽절제술로 충분하다. 갑상선엽절제술 후 갑상선완료절제술의 수술 위험은 전절제술의 경우와 비슷하다. 갑상선완료절제술 시행 시 임상적으로 중앙경부 림프절전이가 있다면 치료적 중앙경부 림프절절제술을 시행하여야 하지만, 그렇지 않은 경우에는 갑상선완료절제술 시 예방적 중앙경부 림프절절제술을 함께 시행할 것인가에 대해서는 그 유용성이 뚜렷하지 않다.", "갑상선분화암 환자에서 띠근육에 국한된 육안적 갑상선외부침범이 있는 경우 T3b로 정의되며, 이러한 소견과 관련된 재발과 질병관련 사망률 그리고 전체 사망률을 보고한 연구에 대하여 체계적 문헌고찰을 수행하였 을 때 재발률 과 질병관련 사망률 및 전체 사망률 을 증가시킨다는 보고는 있으나 근거수준은 매우 낮음, 또는 낮음으로 평가되었다. 또한 이와 관련하여 갑상선완료절제술이 재발률 또는 사망률을 감소시키는 근거는 미약하다. 다만, 추후 방사성요오드 치료의 가능성과 효율을 높이기 위하여, 수술 중 전절제술 로의 전환 또는 수술 후 병리검사 결과 확인 후 갑상선완료절제술이 도움이 될 수 있다. 그러나, 갑상선완료절제술을 수행함으로써 발생 가능한 합병증 증가에 대한 우려가 있으므로, T3b의 갑상선암의 경우, 재발 또는 사망 감소 등 예후 향상과 수술 후 합병증 증가 측면을 고려하여 갑상선전절제술을 선택적으로 시행할 수 있다.", "수술 이후 수행하는 조직검사에서 혈관침습과 림프관 침습은 구분되어야 하며, 혈관침습의 경우 침습 유무뿐 만 아니라 침습 개수도 기록해야 한다. 갑상선분화암 중 갑상선유두암 환자에서 수술 이후 수행하는 조직검사 결과 상 현미경적 혈관침습이 확인되는 경우 국소 재발 또는 원격 재발 의 위험성을 증가시킨다는 보고가 있다. 따라서 암세포가 주변 조직으로 광범위 침습을 하거나 혈관을 침습한 경우에는 임상적인 치 료반응평가에 근거하여, 지역 또는 원격 재발률을 낮추기 위하여 갑상선완료절제술 및 추가 치료를 고려할 수있다. 다만 보고된 연구들은 모두 후향적 관찰 연구이 며 연구에 포함된 환자들 중 예후에 영향을 줄 수 있는 교란변수의 통제가 어렵고, 혈관침습의 정도에 따른 양-반응(dose-response) 상관관계까지 정립되지 않은 상태이 기 때문에 일률적으로 갑상선완료절제술이 권고되지는않는다. 다른 임상인자와 침습정도에 따른 위험도 평가 등에 대한 추가 연구가 필요하다.", "갑상선완료절제술의 경우 갑상선엽절제술을 시행하 였던 수술 부위로 다시 접근하여 수술하는 방식으로 기존 수술에 의한 해부학적 변이와 조직의 유착이 있으며 따라서 되돌이후두신경의 마비와 같은 수술 합병증의 발생 빈도가 증가할 수 있다. 그러므로 갑상선완료절제술이 필요한 경우, 환자의 예후와 관계되는 요소들을 종합적으로 고려하여야 하며, 갑상선완료절제술과 추가적인 방사성요오드 진단 또는 치료를 시행하였을 경우에 대한 이득과 위해를 고려한 환자와의 공유의사결정 이 필요하다."]}, "I.2.6.A": {"ids": ["I.2.6.A"], "p": ["내시경 또는 로봇 수술 시스템을 이용하는 최소침습 (minimally invasive) 갑상선수술은 액와접근법(transaxillary approach), 양측액와유방접근법(bilateral axillo-breast approach, BABA), 후이개접근법(posterior auricular approach), 경구강접근법(transvestibular approach) 등이 대체로 많이 시행되고 있다. 각각의 수술방법에 따라 장단점에 차이가 있어 수술 방법을 정확하게 이해하 고 환자 개개인에게 맞는 수술 방법을 선택하여 시행하는 것이 중요하며 최소침습 수술을 시행하기 전에 경부 절제술(open thyroidectomy)에 대한 충분한 경험과 숙련 이 선행되어야 한다.", "내시경 및 로봇 갑상선 수술의 적응증은 외과의의 경험, 접근방법, 갑상선암의 상태 등에 따라서 변경되어야 하며, 초기 경험 외과의의 경우 갑상선 피막 또는 띠근육에 침범이 없으면서, 갑상선 전면에 위치한 종양, 크기 2 cm 이하, 명확한 중앙경부 림프절전이가 없는 저위험군 갑상선분화암이 대표적인 적응증으로 볼 수 있으며, 갑상선 피막 또는 띠근육의 침습, 갑상선암이 기도식도 고랑(trachea-esophageal groove)에 위치한 경우, 여러 개의 림프절전이가 있는 경우는 상대적인 금기로 볼 수 있다. 또한 숙련된 외과의의 경우는 수술의 적응증을 확대 시켜 시행할 수 있다는 보고가 있으며 적응증으로는 5-6 cm 미만의 여포종양 또는 양성 갑상선 결절, 체질량지수 (body mass index) ≤36 kg/m, 갑상선분화암(크기 4 cm 이하, 갑상선 피막 또는 띠근육의 미세침범, 중앙경부 또는 측경부 림프절전이)에 국한된 경우 고려할 수 있다. 상대적인 금기는 이전에 방사선조사의 과거력이 있는 경우, 큰 흉골하 갑상선종, 종양이 갑상선 피막 또는 띠근육 및 기도식도고랑의 위치에서 광범위한 침범이 의심되는 경우, 주변 구조물을 침범하는 다발성 림프절전이, 원격전이 등의 경우이다.", "내시경 및 로봇 갑상선 수술은 경부 절제술에 비해 다소 긴 수술 시간이 소요된다는 점, 수술을 위해 노출시 켜야 하는 작업공간(working space)이 절개 수술에 비해 넓다는 점, 수술 기구에 따른 수술 비용이 비싸다는 점, 특히 학습곡선(learning curve)에 도달하기까지는 기술적으로 어려운 수술 방법인 점 등을 단점으로 꼽을 수 있다.", "그러나 수술 후 환자의 삶의 질 변화에 대한 대부분의 연구에서 수술 후 목 통증, 불편감 및 감각이상 등은 호 전되거나 적어도 경부 절개술과 동일하며, 목소리 변화 및 연하 시 불편감 등은 경부 절개술에 비해 양호하거나 비슷하다는 결과를 보이고 있다. 최소침습 갑상선 수술의 대표적인 장점으로 꼽을 수 있는 미용적인 만족도는경부 절개술에 비해 우월하다.", "수술 후 부갑상선기능저하(일시적 또는 영구적), 되돌이후두신경마비(일시적 또는 영구적), 장액종, 혈종, 수술 후 출혈, 유미누출 등의 합병증 발생 빈도는 최소침습 갑상선 수술과 경부 절제술이 다르지 않으나 기도 손상, 피부 화상, 상완신경총 일시적 기능저하, 턱끝 신경 (mental nerve) 기능저하 등 최소침습수술에서만 생길 수 있는 합병증에 유의하여야 한다.", "종양학적 치료 효과에 대한 연구에 의하면 비교적 동일한 암의 특성을 가진 환자군에서 경부 림프절절제술 후 적출된 림프절의 숫자, 수술 후 TSH-자극 혈중 갑상선글로불린 수치 비교, 그리고 장기간의 추적 관찰을 통한 재발률에서도 최소침습 갑상선 수술과 경부 절제술 에서 통계학적으로 차이가 없었고 종양치료효과가 동일하였다."]}, "I.2.7.A": {"ids": ["I.2.7.A", "I.2.7.B"], "p": ["되돌이후두신경 손상은 갑상선암 수술의 주요 합병증 이며 호흡 곤란 및 흡인으로 인한 음성 변화 및 호흡기 합병증과도 관련된다. 갑상선암이 되돌이후두신경을 침범한 경우, 수술 전 평가에서 성대 마비 유무에 따라 수술 방법이 달라진다. 되돌이후두신경 침범이 갑상선분화암 환자의 예후에 미치는 영향에 대해서는 여전히 논란이 있다.", "일반적으로 성대 마비가 있는 환자는 목소리가 거칠 고 숨이 차는 음질을 보일 수 있으며 수술 전 후두경 검사로 성대 운동성을 평가하거나 연성 후두경 또는 스트 로보스코피(stroboscopy)와 경부 초음파를 통해 성대 움 직임을 확인할 수 있다. 이 때 수술 전 성대 운동성이 확인되어 성대 기능에 문제가 없는 경우, shaving operation 기법을 사용하여 성대를 보존적으로 치료할 수 있다. 따라서 환자의 직업(특히 전문 음성 사용자), 신경 침범 정도(둘러싸고 있는 정도), 일반적인 건강 상태, 반대쪽 되돌이후두신경의 기능 등을 종합적으로 고려하여 수술 기법을 결정한다. Shaving operation을 하면 1년 후 환자의 80% 이상에서 되돌이후두신경 기능이 보존되었다. 국소 재발률이나 전체생존율에는 신경 절제술과 신경 보존술을 받은 환자에서 유의한 차이가 없었다. 수술 중 신경 모니터링은 수술 전 되돌이후두신경 이 마비되었거나 종양에 의해 침범된 경우 수술 후 기능을 예측하는 데 유용하다.", "수술 전 성대 마비가 확인되면 침범된 되돌이후두신경을 절제할 수 있다. 수술 후 기능적 결손이 예상되는 경우 성대주입술, 갑상연골성형술, 피열연골내전술 및 즉각적인 신경 재건술을 고려해볼 수 있다. 성대주입술, 갑상연골성형술, 피열연골내전술 등의 성대 내측화 시 술은 수술 중 시행할 수도 있지만, 수술 중 성대의 기능을 확실히 알 수 없기 때문에 수술 후 성대 움직임과 음성을 평가한 후에 시행한다.", "성대 출혈, 부종, 반대측 성대 마비 등이 기도 폐쇄로 이어질 수 있으므로 보통 수술 후 수 개월간 경과 관찰을 하며, 음성 개선을 원하는 환자에게는 음성 수술을 시행한다. 수술 중 즉각적인 되돌이후두신경 재건은 신 경과 근육을 재생하여 최대한의 기능을 회복하는 데 도움이 된다. 새로운 축삭이 근육에 빠르게 도달하면 근육 위축에서 회복하고 긴장을 회복할 수 있으므로 최상의 신경 재생 결과를 얻을 수 있기 때문으로, 직접 문합, 신경 이식 등을 시행한다."]}, "I.2.7.C": {"ids": ["I.2.7.C", "I.2.7.D", "I.2.7.E"], "p": ["갑상선분화암에 의한 기도 침범은 드물어 약 3.4-13% 정도로 보고되고 있다. 기도 침범은 장기 생존과 예후에 악영향을 미치며, 침범 정도에 따라 예후가 악화된 다는 보고도 있다. 하지만, 기도 침범이 흔하지 않기 때문에 양질의 연구가 충분하지 않으며, 지금까지 보고된 갑상선암 치료에 대한 진료권고안에서는 기도 침범을 한 경우 수술적 치료에 대한 권장 사항을 포함하고 있지 않다.", "다만, 최종 병리 결과에서 절제연이 불충분한 경우 예후가 좋지 않다. 일부 연구에서 육안적으로 절제연이 음성인 경우에 현미경적으로 양성이라도 생존율에 유의한 차이가 없다고 보고하기도 했다. 다른 연구에서는 절제연 음성(R0) 그룹과 현미경적 양성(R1) 그룹 간의 전체 또는 무병 생존율에 유의한 차이가 없다고 보고 했다. 반면에, 다른 연구에서는 R0의 경우 94.4%, R1 의 경우 87.6%, 육안적으로 절제연이 양성(R2)의 경우 67.9%로 절제 범위에 따라 5년 질병생존율이 감소하는 것으로 보고하였다. 또 다른 연구에서, 103명의 갑상선분화암 환자를 대상으로 한 연구에 따르면 R0 및 R1 그룹 간 10년 생존율에 유의미한 차이가 있는 것으로 나타났다(65.5% vs. 27.3%). 그러므로, 갑상선분화암의 기도 침범이 의심되는 경우, 가능한 침범된 조직을 충분한 여유를 두고 완전히 절제하도록 한다.", "기도 침범 부위의 종양 제거는 주로 shaving partial resection, window resection, sleeve resection의 세 가지 방법으로 한다. Shaving partial resection은 기도 점막을 보존하면서 메스 같은 도구를 사용하여 기도 연골을 서서히 면도하여 병소를 제거하는 방법이다. Window resection은 종양 부위의 점막을 포함한 기도의 전층을 안전역을 두고 절제하는 방법으로, 결손의 크기에 따라 일차 봉합, 국소 피판술 등을 시행하여 재건할 수 있다. Sleeve resection 은 1 개 이상의 기도 연골 전체를 제거하고 절단된 기도의 상단과 하단을 문합하는 방법 이다.", "Shaving partial resection은 window resection 및 sleeve resection에 비해 수술 후 합병증 발생 가능성이 낮기 때문에 종양학적 안전성이 보장되는 경우에 좀 더 선호된다. 하지만, 연골하 침범이나 연골간 인대를 통한 침범으로 인해 완전하게 절제하기가 어려워 shaving partial resection 후 재발률이 높다는 보고도 있다. 그러나 이러한 연구들은 증례 수가 적고, 많은 경우 기도 침범 정도에 따른 수술 방법이 명확하게 구분되지 않았다. Shaving partial resection은 기도의 외측면에만 침범이 발 생했을 때 육안으로 종양의 절제연을 확인하면서 시행한다. 이때 주변 조직의 동결 절편 검사를 시행하여 음성을 확인하는 것이 좋다. 한 보고에서, 종양이 기도 점막을 침범하지 않았을 때 shaving partial resection을 받은 22명의 환자 중 21명(95%)에서 재발하지 않았다.", "한 체계적 문헌고찰에서 기도 침범이 있는 갑상선암 환자 284명 중 shaving partial resection을 받은 환자와 window resection 또는 sleeve resection을 받은 환자의 10 년 전체 생존율에 차이가 없다고 보고했다. 또 다른 체계적 문헌고찰에서는 window resection과 sleeve resection의 국소 재발률은 각각 15%와 25.6%, 전체 생존율은 각각 77.1%와 74.5%라고 보고했다. Window resection 의 적절한 적응증에 대한 근거는 아직 불충분하며, 일부 저자들은 기도 둘레의 절반까지 침범한 종양에 대해 window resection을 시행할 것을 권고하기도 한다. 또다른 보고에서, 종양이 기도 점막을 침범한 경우 반대편 으로 종양이 침범할 가능성이 있기 때문에 sleeve resection을 권장한다.", "이상을 종합하였을 때, 기도 내강 침범이 없으면 기도의 shaving partial resection을, 기도 내강 내 침범이 확인되면 window resection 또는 sleeve resection을 우선적으로 고려할 수 있다. 하지만, 기도 침범 상태에 따라 어떤 수술 방법을 선택해야 하는지에 대해서는 향후 연구가 더 필요할 것으로 판단된다."]}, "I.2.7.F": {"ids": ["I.2.7.F"], "p": ["국소 침습성 갑상선분화암의 식도 침범은 21% 정도로 보고되고 있다. 식도 침범은 일반적으로 원발 부위가 후방에 위치한 경우에 기도 침범과 함께 발생하며, 기도 주위 또는 식도 주위 전이 림프절로부터 침습하여 발생할 수도 있다. 식도와 인두의 점막은 직접적인 침범에 비교적 저항력이 있는 반면, 식도의 근육층은 쉽게 침범 되어 압박으로 인한 연하곤란을 유발할 수 있다. 수술 전 영상검사에서 식도 침범이 의심되는 경우, 식도내시 경을 시행하여 침범 정도를 평가하여 수술 계획을 세우는 것이 좋다.", "식도 근육층만 침범한 경우, 점막하층을 보존하면서 침범한 근육층을 완전히 절제하는 것으로 충분하다. 종양이 식도와 점막을 광범위하게 침범한 경우, 부분 식도 절제술과 함께 유리 피판, 근피판 등의 적절한 재건술을 시행해야 한다. 갑상선분화암의 식도 침범이 의심되는 경우, 수술 시 가능한 충분한 여유공간을 두고 침범된 조직을 완전히 절제하여야 한다. 그러나, 식도 침범 정도에 따른 절제 범위에 대한 권고안을 작성하기 위해서는 향후 추가 연구가 필요하다."]}, "I.3.1.A": {"ids": ["I.3.1.A", "I.3.1.B", "I.3.1.C", "I.3.1.D", "I.3.1.E", "I.3.1.F"], "p": ["갑상선 수술 전 후두의 관찰은 다음과 같은 의의가있다. 첫째, 환자가 수술 전 음성 변화가 있는 경우 성대의 이상 유무를 확인할 수 있다. 둘째, 성대마비가 있어도 음성은 정상 범주에 있을 수 있기 때문에, 수술 전 미리 성대마비 유무를 확인할 수 있다. 셋째, 수술 후 음성 변화가 있을 경우 음성의 개선을 위한 치료의 기초자 료를 마련할 수 있다. 수술 전 성대마비가 있는 환자들의 32%가 정상 목소리를 보인 결과도 있으며, 진행된 갑상선암의 경우 약 67%에서 수술 전 성대마비가 존재한다는 결과도 있다.", "그러나 음성변화가 모두 성대마비를 의미하는 것은 아니다. 한 보고에 의하면 갑상선 수술 전 음성변화를 호소하는 환자들에서 후두경 소견상 약 35%에서 성대운 동성은 정상이나 성대점막질환을 가지고 있었다. 수술 전 성대마비 존재의 확인은 수술 범위의 판단에도 유용하다. 수술 전 성대마비는 진행한 갑상선암을 의미하고, 외과의는 수술범위의 확장과 함께, 반대쪽 성대보존에 더욱 주의를 기울이게 된다.", "후두 관찰의 가장 좋은 방법은 후두경을 이용하는 것으로, 비교적 낮은 비용으로 후두 상태를 정확하게 평가할 수 있는 장점이 있다. 초음파를 이용한 성대관찰은 갑상연골이 석회화가 되어 있는 경우 관찰이 어려운 단점이 있으나 갑상선 수술 전 초음파검사 시행 시 동시 관찰하는 경우 대안이 될 수 있다.", "수술 전 후두의 관찰에 대한 해외 진료권고안을 살펴 보면 모든 갑상선암 환자들에서 권고하는 경우도 있고, 후방 침범이 의심되거나, 종괴가 큰 경우, 이전의 경부수술의 과거력, 광범위한 림프절전이가 의심되는 경우에만 선택적으로 권고하는 경우도 있다. 갑상선암 수술에서 수술 전 후두 관찰의 임상적 중요성 등을 고려하여 우리나라의 2023년 후두음성언어학회 권고안에서는 모든 환자에서 수술 전 후두 상태를 살펴볼 것을 권고하고 있다. 이상을 종합하였을 때, 갑상선 수술을 받는 모든 환자에서 음성 이상 유무를 확인하여야 하며, 가능한 경우 후두의 육안적 관찰을 시행하는 것이 바람직하다.", "음성 이상이 있거나, 후두육안검사상 이상 소견이 관찰되는 경우, 후방 침범이 의심되거나, 종괴가 큰 경우, 이전의 경부수술의 과거력, 광범위한 림프절전이가 의심되는 경우 등에서는 성대 상태에 대한 객관적인 평가를 시행하여야 한다. 수술 전 음성 이상의 존재, 성대 마비, 수술 후 음성 이상의 가능성이 높은 경우에는 추가적으로 음성 평가를 시행할 필요가 있다. 음성 이상을 주관 적으로 평가하는 가장 간단한 방법은 수술 전 환자에게 음성 변화 여부를 물어보아 차트에 기록해 두거나, 환자 자신만이 호소하는 음성 이상 형태를 설문형식으로 평가하는 방법이 있다. 객관적 음성 평가의 종류로는 기기 나 기구를 이용한 성대진동검사, 공기역학적 검사, 음향 학적 검사, 신경생리학적 검사와 검사자의 청지각적 평 가로 알아내기 어려운 환자의 음성장애를 평가하는 청지각적 평가가 있다.", "갑상선 수술 후 발생하는 성대마비는 외과의의 경험, 갑상선암의 위치 및 림프절전이의 존재, 재수술 여부 등과 관련이 있다. 일반적인 갑상선암 수술의 경우 수술 경험이 풍부한 외과의의 경우 신경감시시스템의 사용이 성대마비의 위험성을 감소시키지는 않는다. 그러나 경험이 충분하지 않거나, 갑상선 후방에 위치한 암, 광범위한 림프절전이 및 재수술과 같은 고위험 수술 등에서는 신경감시시스템을 적극적으로 활용할 필요가 있다. 한 메타분석에 따르면 고위험 갑상선 수술에서 신경감시시스템의 미사용 시 수술 후 일시적 성대마비 및 영구적 성대마비의 위험성이 약 40% 정도 증가하였다. 그러므로, 신경 및 신경기능을 확인하기 위해 수술 중 신경감시시스템 사용을 고려한다.", "갑상선암 수술 후 약 30-80% 정도에서 환자들은 음성변화를 호소한다. 수술 후 음성변화가 꼭 성대마비를 의미하는 것은 아니나, 바람이 새는 듯한 목소리나 협착음(stridor)의 존재는 성대마비를 강력히 시사한다. 한 메타분석에 따르면 갑상선 수술 후 일시적 성대마비의 비율은 9.8%, 영구적 성대마비의 비율은 2.3% 였다. 그러나 이 비율은 높은 성대마비가 존재한 경우는 연구결과가 보고되지 않았을 비뚤림이 존재하기 때문에 실제 비율은 이를 상회할 가능성이 있다. 수술 후 성대마비를 조기에 발견하여 교정할 경우 환자의 삶의 질 향상에 크게 기여할 수 있다. 그러므로, 갑상선 수술 후 모든 환자에게 음성 이상 유무를 확인하여야 하고, 수술 후 음성변화가 존재하는 경우 후두의 관찰을 통해 성대마비를 확인해야 한다.", "성대관찰의 시점은 일시적 성대마비의 회복과 지연성 성대마비를 고려하여 수술 후 7-14 일 이후에 시행하는 것이 좋다. 수술 후 성대마비가 관찰된 경우에는 6-12개월 정도는 정기적으로 성대마비의 회복 여부를 판단하는 것이 좋다. 수술 후 성대마비로 인해 흡인과 같은 합병증이 발생하거나 사회적 직업적 영향을 크게 받는 경우는 음성개선을 위한 조기 치료를 위한 노력이 필요하다."]}, "I.3.2.A": {"ids": ["I.3.2.A", "I.3.2.B", "I.3.2.C", "I.3.2.D", "I.3.2.E", "I.3.2.F", "I.3.2.G", "I.3.2.H"], "p": ["부갑상선기능저하증은 갑상선암 수술 환자에서 흔히 발생하는 합병증이다. 수술 후 발생한 부갑상선기능저하증은 임상적으로 혈중 부갑상선호르몬 수치의 감소 (대개 12 pg/mL 이하) 와 함께 저칼슘혈증이 있거나 이로 인한 증상이나 징후가 있을 때로 정의한다. 일시적 부갑상선기능저하증은 환자의 19-38%에서 관찰되나 6개월 이상 지속되는 부갑상선기능저하증은 환자의 0-3%에서만 확인된다. 갑상선전절제술, 중앙경부 림프절절제술, 과거 경부 수술의 병력이 있는 경우 영구적 부갑상선기능저하증의 발생 위험이 증가한다.", "수술 후 부갑상선기능저하증을 예방하기 위한 목적으로 갑상선암 수술을 받는 모든 환자에서 수술 전 혈청 칼슘, 부갑상선호르몬, 25[OH]D를 포함한 생화학검사 가 도움된다. 수술 전 혈청 칼슘 수치가 낮은 환자에서 부갑상선기능저하증의 발생이 증가하므로 식이를 통해 칼슘 섭취를 늘리거나 경구 칼슘제 투여를 고려해볼 수있다. 수술 전 혈청 부갑상선호르몬의 상승은 비타민 D 결핍 환자에서 흔히 관찰된다. 메타분석에서 수술 전 비타민D 결핍(25[OH]D ＜20 ng/mL)이 수술 후 일시적부갑상선기능저하증의 위험을 증가시킨다고 보고하였으나, 영구적 부갑상선기능저하증에 대해서는 위험도의 증가에 대한 논쟁이 있다. 하지만 일부 보고에서는 심한 비타민D 결핍(25[OH]D ＜10 ng/mL)에서 영구적 부갑상선기능저하증이 증가하였다. 수술 전후 비타민D 보충 요법이 부갑상선기능저하증을 줄일 수 있는지에 대하여서는 추가적인 연구가 필요하다.", "수술 직후 발생하는 부갑상선기능저하증의 예측에는 수술 중(갑상선 제거 후 10-20분째 측정) 또는 수술 24시간 내 시행한 혈청 부갑상선호르몬 검사가 도움된다. 검사법 및 기관별로 참고치의 차이가 있으나 대개 부갑 상선기능호르몬 수치가 15 pg/mL 미만일 때 수술 직후 저칼슘혈증의 위험이 증가하므로, 이러한 경우에는 경구 칼슘제와 활성형비타민D의 예방적 투여를 고려할 수있다.", "수술 직후 저칼슘혈증은 혈청 부갑상선호르몬 수준이 감소한 이후에 발생한다. 따라서 뒤늦게 나타날 수 있는 저칼슘혈증에 대한 예방 및 환자 교육이 중요하다. 저칼슘혈증이 확인된 경우에는 혈청 칼슘 수치 및 저칼슘혈증의 증상이나 징후에 따라 칼슘과 활성형비타민D 투여 요법을 결정한다(Table I.3.2.A). 혈청 칼슘은 이온화칼슘 (ionized calcium)과 총 칼슘(total calcium) 모두 기준으로 사용할 수 있으나 총 칼슘의 경우에는 혈청 알부민을 함께 측정하여 알부민 수치로 보정한 칼슘 수치를 기준으로 사용한다. 경증 또는 중등도의 부갑상선기능저하증에서는 경구 칼슘제와 활성형비타민D 보충 치료가 권장된다. 진행하거나 증상이 동반된 부갑상선기능저하증에서는 추가로 칼슘 정맥 투여가 필요할 수 있다.", "최근 부갑상선기능저하증 평가ㆍ관리 국제 워크숍 (the Second International Workshop)에서 발표한 진료권고안에서는 12개월 이상 지속되는 부갑상선기능저하증을 영구적 부갑상선기능저하증으로 정의한다. 영구적 부갑상선기능저하증의 예측인자로는 수술 전후 부갑상선호르몬 수치의 저하 및 수술 후 부갑상선호르몬의 감소, 수술 전 비타민D 결핍, 수술 후 혈청 칼슘 수치의 변화, 수술 후 혈청 마그네슘 수치의 감소 정도, 부갑상선 자가이식 등이 제시되나 연구들마다 결과가 상이하여 이들 검사의 활용에 대해서는 추가적인 연구가 필요하다.", "영구적 부갑상선기능저하증의 치료 목표는 혈청 칼슘을 무증상 범위로 유지하면서 고칼슘혈증 또는 저칼슘혈증과 관련된 합병증을 최대한 피하고 골건강을 유지하는 것이다. 부갑상선기능저하증의 장기적 치료는 기능 저하의 정도에 따라 비타민D, 경구 칼슘제 등을 통한 약물 치료를 기본으로 한다. 경구 칼슘제는 칼슘함유 량(elemental 칼슘)을 기준으로 하루 3500 mg (대개 1500 mg/day)까지 보충할 수 있다. 탄산칼슘(calcium carbonate; 칼슘함유량 40%)은 식사와 함께, 구연산칼슘(calcium citrate; 칼슘함유량 21%)은 식사와 무관하게 복용한다.", "활성형비타민D는 calcitriol (1,25[OH]2D) 또는 alfacalcidol (1α-[OH]D) 형태로 보충하는데, calcitriol은 하루 0.25-4.0 μg (대개 0.25 μg/day), alfacalcidol은 0.5-8.0 μ g 의 투여가 권장된다. 경우에 따라서는 활성형비타민 D와 함께 또는 대신해서 ergocalciferol이나 cholecalciferol 과 같은 비활성형비타민D를 사용해 볼 수도 있다. 표준 치료에도 조절되지 않는 저칼슘혈증과 고칼슘뇨증이 있는 경우에는 티아지드 이뇨제(thiazide; hydrochlorothiazide 12.5-50 mg/day)를 투여한다.", "2015년 미국 식품의약국(Food and Drug Administration, FDA)과 유럽 의약품청(European Medicines Agency, EMA)에서 부갑상선기능저하증의 장기 치료 시에 recombinant human PTH (rhPTH) (1-84)를 승인하 였으며, 일반적인 치료에도 불구하고 저칼슘혈증으로 입원치료를 요하는 경우, 고인산혈증이 동반된 경우, 콩 팥기능부전, 고칼슘뇨증, 신장결석이 동반된 경우, 높은 칼슘 용량으로 인한 소화기 부작용, 흡수저하, 복약순응 도가 현저히 감소된 경우 PTH 주사를 고려할 수 있으나, 현재 우리나라에서는 사용이 불가하다. PTH 주사 사용 시 고칼슘혈증에 주의해야 하며, rhPTH (1-84)는 50 μg/day로 시작하여 매 4주마다 25 μg씩 용량조절하 여 최대 100 μg/day로 사용 가능하다. 이 때는 함께 사용하는 칼슘과 비타민D의 용량 조절이 필요하다. rhPTH (1-34)는 부갑상선기능저하증에 대해서 아직 적응증을 받지 못했다.", "부갑상선기능저하증의 장기적 치료 시에는 혈청 칼슘, 인, 마그네슘, 크레아티닌 및 25[OH]D, 사구체여과 율, 24시간 소변 칼슘량 등을 주기적으로 측정하여 치료가 적절하게 이루어지고 있는지 여부를 평가한다. 수술 후 부갑상선기능저하증에서는 질환 자체 또는 치료와 관련하여 발생하는 만성 합병증에 유념해야 한다. 수술 후 부갑상선기능저하증에서 신질환(고칼슘뇨증, 신기능저하, 신석회화 및 신결석), 우울증 및 양극성장 애, 뇌신경장애, 감염이 증가하며 두개강 내 석회화는 56%에서 관찰된다. 일부 연구에서 악성 종양과 골절은 수술 후 부갑상선기능저하증에서 감소하는 것으로 보고 하였다. 비수술적 부갑상선기능저하증에서와 달리 백내 장, 부정맥 및 허혈성 심질환의 증가는 관찰되지 않으며 사망률과의 뚜렷한 연관성도 보고되지 않았다. 그러나 이에 대해서는 장기적 추적 관찰을 통한 추가 연구가 필요하다."]}, "I.4.1.A": {"ids": ["I.4.1.A"], "p": ["수술 후 병리학적 진단은 2022년 세계보건기구 종양분류체계에 따라 7개의 범주로 분류되며, 각 범주는 구 체적인 유형과 아형(있을 경우)으로 세분된다(Table I.4.1.A). 이들 갑상선종양 7개 범주 중에서, 본 권고안은 갑상선암의 거의 대부분을 차지하는 여포세포 유래 암 범주와 과거에 유두암의 아형으로 분류되었다가 현재는 다른 범주로 분류된 갑상선체모양-오디모양암(cribriform morular thyroid carcinoma) 유형을 대상으로 한다.", "여포세포 유래암은 분화암(differentiated thyroid carcinoma)과 미분화암(undifferentiated thyroid carcinoma)으로 구분되며, 분화암은 고분화암(여포암, 침습피막형성여포유두암, 유두암, 호산성암), 고등급분화암(high-grade differentiated thyroid carcinoma) 및 저분화암(poorly differentiated thyroid carcinoma)을 포함한다. 미분화암은 갑상선역형성암(anaplastic thyroid carcinoma)을 의미한다."]}, "I.4.2.A": {"ids": ["I.4.2.A", "I.4.2.B"], "p": ["수술 후 임상적, 병리적 병기 결정은 예후의 예측과 추후 치료방침의 결정을 위해서도 유용하다. 갑상선분화암에 서는 1) 갑상선분화암 환자의 예후를 예측하고, 2) 방사성요오드 치료나 TSH 억제와 같은 수술 후 치료방침을 결정하고, 3) 수술 후 추적의 빈도와 강도를 결정하고, 4) 의료 진 간의 의사소통을 위해 수술 후 병기 결정이 필요하다.", "수술 후 병기 결정에는 갑상선암을 비롯한 모든 암에 적용되고 있는 pTNM에 근거한 AJCC/UICC TNM 병기를 사용할 것을 권장한다(Table I.4.2.A, I.4.2.B). 갑상선분화암의 예후를 가장 잘 반영하는 원격전이 여부, 환자의 연령, 종양의 국소 진행 정도 등은 AJCC/UICC 병기를 구분하는 주요 인자이다. 각각의 분류는 갑상선분화암 환자의 사망 위험도를 예측하고, 저위험군에 속하 는 대부분의 환자(70-85%)를 구별하게 해주어 위험도에 맞는 추적관찰 및 치료를 시행할 수 있게 한다. 그러나 AJCC/UICC 병기는 갑상선분화암의 재발 위험도를 예 측하지 못하는 제한점이 있어, 방사성요오드 치료나 TSH 억제와 같은 수술 후 치료방침을 결정하기 위해서는 Part I의 제5장(I.5장, Table I.5.1.A)에서 제시된 별도의 재발 위험군 분류 체계가 사용된다."]}, "I.4.3.A": {"ids": ["I.4.3.A", "I.4.3.B", "I.4.3.C", "I.4.3.D"], "p": ["표준화된 갑상선암 병리 보고서를 통해 병리 진단을 표 준화할 수 있고, 임상의사와 병리의사 간의 소통이 원활하 여 환자의 치료 역량을 향상시킬 수 있다. 미국병리학회 (www.cap.org)와 암보고 국제협력기구(www.iccr-cancer.org) 는 갑상선암 병리 진단을 위한 표준 양식을 발표하고 있다. 현미학적 소견에 필수 항목으로 종양의 위치, 크기, 조직학적 유형 및 아형, 유사분열 수(mitotic counts; 2 mm 의 단위면적당 측정), 종양 괴사(necrosis), 혈관/림프관 침습, 갑상선외부침범 정도, 종양절제면 침범유무, 림프절전이의 개수, 크기 및 림프절 피막외 침범을 명시한다.", "면역화학염색을 통한 Ki67 표지지수(labelling index) 는 갑상선수질암의 종양 등급 평가를 위해 필수적으로 시행하여야 하며, 갑상선분화암에 대해서는 필수항목은 아니나, Ki67 표지지수 5% 이상일 때 악성도가 증가하며, 저분화암은 10% 이상, 역형성암은 30% 이상을 보인다는 연구가 있다. 유두암이나 여포암에서 유사분 열이 2 mm 당 5개 이상 관찰되거나 종양세포의 괴사가관찰되는 경우는 일반적인 갑상선분화암보다 예후가 더 나쁘며, 이를 2022년 세계보건기구 종양분류체계에서는 고등급갑상선분화암(differentiated high-grade thyroid carcinoma)으로 새롭게 명명하였다.", "갑상선유두암에서 조직학적 아형(subtype)에는 긴세포(tall cell), 원주세포(columnar cell), hobnail, 미만성 경 화(diffuse sclerosing), 고형(solid), Warthin-like 아형 등이 있다.", "피막형성여포아형 갑상선암에는 침습피막형성여포유 두암 (invasive encapsulated follicular variant of papillary thyroid carcinoma, IEFVPTC), 여포암(follicular thyroid carcinoma, FTC), 호산성암(oncocytic carcinoma of the thyroid, OCA)을 포함하며, 이들 종양은 피막의 침범 정도 및 혈관 침범 유무에 따라 최소침습형(minimally invasive), 피막형성혈관침습형(encapsulated angioinvasive) 및 광범위침습형(widely invasive) 아형으로 구분되어야한다.", "갑상선 여포세포에서 발생하는 유전성 갑상선암 그룹 을 증후군성 가족성 갑상선비수질암(syndromic familial non-medullary thyroid carcinoma, SFNMTC)이라고 한다. SFNMTC와 연관된 주요 증후군으로는 PTEN (phosphatase and tensin homolog) 과오종 증후군(PTEN hamartoma tumor syndrome, PHTS), 가족성 선종성 용종증(familial adenomatous polyposis, FAP), DICER1 (dicer 1, ribonuclease III) 증후군, 카니복합체(Carney complex, CNC), 베르너 증후군(Werner syndrome, WS) 등이 있다. 이와 같은 질환은 전형적으로 양쪽 엽과 협부에 다발성 결절을 형성한다.", "체모양-오디모양갑상선암(cribriform morular thyroid carcinoma, CMTC)의 97%는 젊은 여성에서 발생하고, 40세 미만이 89%의 비율을 차지한다. CMTC의 최대 53%가 FAP 증후군과 연관되어 있다. PHTS 관련 갑상선암은 일반적으로 다수의 세포밀도가 높은 여포성 결 절과 여포선종의 배경에서 발생하고, 지방선종과 미세 선종과도 종종 동반되어, 선종에서 암으로의 진행을 나 타낸다. PHTS의 발병기전으로 주로 PTEN 유전자의 선천적 돌연변이와 관련이 있지만, PIK3CA (phosphatidylinositol-4,5-bisphosphate 3-kinase catalytic subunit alpha), AKT1 (AKT serine/threonine kinase 1), SDHx (succinate dehydrogenase complex flavoprotein subunits) 유전자의 돌연변이와 KLLN (killin, p53 regulated DNA replication inhibitor) 메틸화도 관련성이 있다. DICER1 증후군의 진단은 DICER1 유전자의 병리학적 생식세포 돌연변이의 확인을 통해 이뤄진다. CNC는 PRKAR1A (protein kinase cAMP-dependent type I regulatory subunit alpha) 유전자의 생식세포 돌연변이를 종종 보이지만 이러한 돌연변이가 없는 경우가 많다. Werner syndrome (WS)의 확정 진단은 WRN 유전자의 이중 기능 소실 돌연변이의 확인을 통해 가능하다.", "SFNMTC의 진단에서 진단적 면역조직화학은 중요한 역할을 한다. FAP 환자의 CMTC는 핵과 세포질에서 β- 카테닌에 대한 면역화학염색의 양성이 특징이며, PHTS 는 갑상선 종양세포에서 PTEN 면역화학염색의 소실이 관찰된다."]}, "I.5.1.A": {"ids": ["I.5.1.A", "I.5.1.B"], "p": ["본 권고안 위원회에서는 최근 보고된 메타분석 결과 들과 대규모 관찰연구들의 결과를 면밀히 검토하고 다학제 회의를 거쳐 다음(Table I.5.1.A) 과 같이 재발의 저위험군, 중간위험군, 고위험군을 분류하였고, 각 위험군의 임상 병리학적 위험인자에 대해서는 현재까지 보고된 재발률을 제시하였다(Table I.5.1.B-I.5.2.I).", "위험군 분류에서 수정된 내용은 크게 네 가지로, 1) 2022 세계보건기구(World Health Organization, WHO) 종양분류체계에 따라 재분류하였다. 2) 재발위험도와 연관 인자가 유사한 피막형성침습형 여포유두암과 갑상선여포암, 갑상선호산성암을 피막형성여포아형 갑상선암으로 통합하여 위험군을 분류하고, 이들을 피막(capsule)과 혈관침습(vascular invasion) 정도에 따라 최소침습형 (minimally invasive), 피막형성혈관침습형(encapsulated angioinvasive), 광범위침습형(widely invasive)으로 구분하 여 위험도를 평가하였다. 3) 저위험군은 동일하게 재발률이 5% 이하로 알려진 경우로 정의하였으나, 고위험군은 알려진 재발률이 30% 이상인 경우로 상향하여, 재발위험도가 5-30%인 경우를 중간위험군으로 하였다. 4) 다만, 중간위험군에서는 우리나라의 보고를 중심으로 지금까지 알려진 각 세부 병리학적 소견을 포함한 다양한 임상병리인자에 따른 재발률을 제시하여, 한 가지 위험인자에 의한 재발률을 그대로 적용하기보다는, 개별 환자에서 동반된 각각의 임상인자의 조합에 따라 재발률을 예측하여 초기위험군을 평가하도록 권고하였다.", "(1) 저위험군", "저위험군은 보고된 재발위험도가 5% 이하인 경우로 서 대부분 엽절제술로 충분하며, 전절제를 시행한 경우 추가적인 방사성요오드 잔여제거술을 일반적으로 권고하지 않는다. 저위험군에 포함된 갑상선유두암 중 ‘림프절전이가 없거나 미세 림프절전이(≤0.2 cm)가 5개 이하인 경우’는 보고에 따라서 3-8%의 재발률을 보고하고 있으나, 2016 대한갑상선학회 및 2015 미국갑상선학회, 2019 유럽종양학회 권고안 과 동일하게, 본 권고안에서도 저위험군으로 구분하였다. 그러나, ‘갑상선 내 국한된 4 cm 이하의 갑상선분화암’은 기존의 다른 권고안들에 서 저위험군으로 분류되었으나, 우리나라의 갑상선유두암에서 매우 높은 빈도를 보이는 BRAF<sup>V600E<\/sup> 변이가 양성인 경우에는, 2-4 cm 크기의 갑상선유두암도 재발위험도가 10% 정도로 보고되어 있어, 본 권고안에서는 저위험군에서 제외하였다. 다른 병리학적 위험인자가 없는 크기가 4 cm 초과인 갑상선 내 국한된 유두암과 여포암 도 각각의 재발률이 8.3%와 0-11.1% 정도로 보고되고 있어 저위험군에서 제외하였다(Table I.5.1.B).", "(2) 고위험군", "고위험군은 알려진 재발위험도가 30% 이상이거나, 병소가 존재하는 경우, 원격전이의 위험도 높은 군으로서, 엽절제술이 시행된 경우에는 갑상선완료절제술을 시행하고, 질환 상태에 따라 방사성요오드 치료를 포함하여 적극적인 치료를 고려해야 한다.", "(3) 중간위험군", "본 권고안에서는 저위험군과 고위험군에 포함되지 않는 경우를 중간위험군으로 정의하였는데, 개별 환자에서 Table I.5.1.B 와 Table I.5.2.A-I.5.2.I 에 제시되어 있는 임상병리학적 위험인자 존재 여부를 확인하고, 이를 종합적으로 파악하여 재발위험도를 평가하여, 치료 방침을 결정하도록 한다.", "주지할 점은 각 인자들이 복합적으로 존재하는 경우에는 재발위험도가 각각의 위험인자 단독으로 존재하는 경우보다 상향될 수 있다는 것이다. 경우에 따라서 고위험군에 포함되지 않는 경우라 하더라도 재발위험도를 높이는 위험인자가 많은 경우에는 고위험군에 해당하는 재발률을 보일 수 있다. 그러므로 각 환자들이 보유한 위험인자들을 종합적으로 평가하여, 갑상선완료절제술 여부, 방사성요오드 치료 및 용량 (30 mCi, 30-100 mCi, ＞100 mCi 등) 등의 추가 치료 방침을 결정한다.", "일반적으로 종합적인 재발률이 낮은 경우 엽절제술이, 높은 경우 전절제술과 방사성요오드 치료가 우선적으로 고려될 수 있으나, 수술 범주를 결정할 때에는 종합한 재발률뿐만 아니라, 합병증, 환자의 건강 상태 및 선호도 등에 대한 고려가 필요하다."]}, "I.5.2.A": {"ids": ["I.5.2.A"], "p": ["본 권고안에서는 기존 권고안에서 다루지 않았던 임 상인자인 림프절전이의 상세 소견, 유전자 변이 등에 대해서도 지금까지 보고된 재발률을 제시하였다. 그러나, 수술 후 위험도 예측을 위한 혈청 갑상선글로불린 농도의 기준치 및 최근 임상적 보고가 추가된 병리소견들과 분자유전학적 특성 등에 대해서는 추후 보완이 필요하다.", "본 권고안의 재발률을 개별 환자에 적용할 때에는 다음의 제한점을 고려하여야 한다. 1) 재발률은 대상군의 임상적, 병리학적 특성과 수술 범주 및 방사성요오드 치료 여부 등에 따라 영향을 받을 수 있다. 2) 각 연구에서 분석한 대상자 수와 추적 기간에 따라 의미가 다르고, 대상군에서 임상, 병리 위험인자와 치료에 따른 조합이 매우 다양하기 때문에 재발률에 영향을 미치는 단독 인자의 영향을 분석하는 것이 매우 어렵다. 3) 최근 보다 구체화, 세분화된 병리위험인자의 평가에 10-20여년 전의 임상연구결과를 적용하는 데는 한계가 크다. 특히 전이림프절의 크기 및 비율, 림프절외부침범, 세부 유전자변이 등 최근 제시되기 시작한 위험인자들에 대해서는 아직까지 장기 예후에 미치는 영향에 대해 근거가 충분 치 않으므로, 다양한 상황에 대한 전향적인 연구들이 필요하다. 4) 또한 치료법의 발전도 과거에 보고된 임상연 구결과의 적용을 어렵게 한다. 그러므로 본 권고안에서 제시하고 있는 재발률에 대한 평가는 이를 고려한 해석이 필요하다.", "이상과 같이 임상에서 개별 환자에서 위험군을 적용할 때에는 위와 같은 다양한 측면을 고려하여야 하며, 또한 초기에 평가된 재발의 위험도는 시간이 지나면서 종양의 특성과 치료에 대한 반응에 따라서 변할 수 있으므로, 재발과 사망률에 대한 위험도는 수시로 재평가를시행하여야 한다.", "(1) 갑상선유두암의 공격적 아형(aggressive histology)", "기존 저분화암(poorly differentiated thyroid cancer)은 2022 세계보건기구 종양분류체계에서 유사분열 개수 (mitotic activity)와 종양 괴사(tumor necrosis)가 있는 종양의 경우 follicular-derived carcinomas, high grade로 재 명명되었다. 특히 전형적인 분화암의 핵 모양이나 구조 모양이 남아있는가에 따라 고등급갑상선분화암(differentiated high-grade thyroid carcinoma)과 저분화암(poorly differentiated thyroid carcinoma)으로 분류되었다. 저분화암은 진단 당시부터 원격전이가 흔하고(19-39%) 5년 암특이생존률이 낮아(66-70%) 고위험군으로 분류된다. 특히 저분화암에서도 혈관 침습이 있는 경우 예후가 더 좋지 않다는 보고들이 있다.", "갑상선유두암의 고위험 아형으로 긴세포(tall cell), 원주세포(columnar cell), hobnail 등이 여러 권고안에서 공통적으로 포함된다. 각 아형별 재발률은 긴세포아 형 22-37%, 원주세포아형 42%, hobnail 아형 23-35.5%로 보고되어, 보고에 따라서는 본 권고안에서 고위험군의 기준으로 설정한 30%를 상회하므로 주의가 필요하다(Table I.5.2.A). 다만 1 cm보다 작은 고위험 아형들을 따로 분석할 경우 재발률이 높지 않아 이들 아형 자체가 종양 자체의 크기나 갑상선외부침범, 전이 및 혈관 침습 등의 요소들과 독립적으로 얼마나 재발위험성을 높이는지 추가적인 연구가 필요하다.", "미만성 경화 아형(diffuse sclerosing subtype)과 고형 아형(solid subtype)은 일반적으로 고위험 아형으로 구분되지 않았으나, 본 권고안에서는 이 두 가지 아형도 중간위험군으로 분류하였다. 미만성 경화 아형은 미국 SEER 암등록자료 데이터베이스의 분석 결과 5년 암특이 사망률이 4.9%로, 전형적인 유두암(classic PTC)의 3.6%로 큰 차이를 보지 않는다는 보고도 있지만, 원격전이나 경부 림프절전이 위험이 높고, 재발률도 11.6-27% 정도로 보고되고 있으며, 고형아형의 재발률은 9.5-26%로 보고되었다.", "(2) 갑상선외부침범(extrathyroidal extension, ETE)", "갑상선외부침범은 갑상선암이 갑상선실질을 벗어나 주변 조직으로 침범한 경우를 일컬으며, 침범의 정도에 따라 현미경적(microscopic) 혹은 경미한(minimal) 침범을 보이는 경우와 육안적 (gross) 혹은 광범위한 (extensive) 침범을 보이는 경우로 나누었다. 갑상선 주변의 연부조직까지 이르는 경미한 침범을 보이는 경우에는", "Table I.5.2.B에서와 같이, 림프절 또는 원격전이가 동반된 경우에는 재발률이 1.5-26%까지 다양하였다. 그러나, 경미한(minimal) 침범을 보이는 경우라 하더라도 원격전이와 림프절전이가 동반되지 않은 7개 연구의 메타분 석을 포함한 보고들에서 재발률은 3.5% 이하였고, 림프절전이 여부가 불확실한(Nx) 경우에도 이와 유사한 결과를 보여주고 있어, 본 권고문에서는 경미한 갑상선외부침범을 단독 위험인자로 고려하지 않았다. 그러나, 5개 이하의 미세림프절전이 소견이 있는 저위험군 에서도 경미한 갑상선외부침범이 동반된 경우가 저위험군에 포함되는지는 확실하지 않다. 림프절전이 여부가 불확실한 경우에 1.5 cm보다 큰 갑상선유두암에서는 경미한 침범이 있는 경우 26%의 높은 재발률을 보고하고 있고(다만, 이 경우 림프절전이가 없는 경우도 10.6%의 재발률을 보임), 다수의 보고에서 림프절전이가 동반된 대상군에서는 5% 이상의 재발률을 보이므로(Table I.5.2.B), 동반된 다른 위험인자를 고려한 평가가 필요하다. 한편, 두 개의 국내 연구에서 침범이 없는 경우 부터 경미한 침범에서 육안적 침범이 있는 갑상선유두암 순서로 종양의 크기가 커지고 림프절전이가 많아짐 을 보고하였다. 요약하면, 비록 경미한 갑상선외부침범 소견만 발견된 경우에는 낮은 재발률을 보여 단독 위험인자로 고려하지 않았지만, 다른 위험인자가 동반되 었을 때 그에 따른 재발위험도를 더 증가시키는지 여부는 아직까지 불확실하여 이에 대한 주의가 필요하다. 이에 대한 추가적인 연구가 필요하다.", "최근에는 육안적 침범 중에서도 띠근육(strap muscle) 까지의 육안적 침범이 있을 경우 재발률이 5.9-29.4%, 사망률 1.1-3.6%로 보고되어, 다른 장기로의 침범(되돌이후두신경, 기도 등)에 비해 재발위험성이나 사망률이 낮다. 우리나라만의 보고에서는 재발률이 5.9-10.8% 정도로 알려져 있다(Table I.5.2.B). 또한 갑상선의 가장자 리에서 시작되었지만 크기가 작은 갑상선암의 경우에는 갑상선외부침범이 재발의 위험성을 높이지 않는다는 보고들이 있다. 따라서 띠근육으로의 육안적 침범이 단독으로 있을 경우(AJCC/UICC T stage T3b) 독립적으로 재발위험성을 현저히 높인다고 보기 어려워 본 권고안에서는 고위험군이 아닌 중간위험군으로 하향조정하였다.", "(3) 종양 절제연(resection margin)", "갑상선암의 수술적 절제의 완결성에 대해 크게 절제연 음성 (R0, no gross residual disease and negative resection margins on histopathology), 현미경적 절제연 양성(R1, no gross residual disease but positive margins on histopathology), 육안적 절제연 양성(R2, gross residual disease)의 3단계로 구분한다.", "R0와 R1은 장기적인 생존기간에는 차이가 없지만 R1 의 재발률은 3.85-10.9%로 보고되어 본 위원회에서는 R0 은 저위험군, R1은 중간위험군, R2는 고위험군으로 분류하였다. 특히 기도로의 경미한 침범이 있는 경우 shaving operation 등을 통해 R0을 기대할 수 있는 수준으로 수술 한다면 R1보다 국소 재발위험성을 4.6%로 낮출 수 있다는 보고들이 있다.", "(4) 피막형성갑상선분화암의 종양의 크기와 혈관 침", "습(tumor size and vascular invasion in follicular- patterned thyroid cancer) 갑상선여포암의 재발위험과 연관된 인자는 대표적으로 종양 크기, 종양의 피막 또는 혈관 침습이 있는데, 이들 인자들은 서로 동반되는 경우가 흔하다. 한 체계적 문헌고찰 에서 5개의 연구 중 3개의 연구에서는 종양의 크기는 재발위험도와 연관이 없었지만, 한 연구에서는 크기가 증가할수록 재발위험도가 증가하였고, 다른 한 연구에서는 최소침습 갑상선여포암에서는 4 cm 이상에서만 재발위험도가 증가하였으며, 광범위침습 갑상선여포암에서는 크기에 따라 위험도가 증가하지 않았다. 최근 메타분석 에서 최소침습 갑상선여포암을 대상으로 시행한 연구들은 4 cm 이하에서 1.1-9.8%, 4 cm 초과에서 5.9-16.7%로 다양한 재발률을 보였다. 한편, 미국에서 시행된 한 코호트 연구에서는 갑상선 내에 국한되고 혈관침범이 없는 4 cm 초과의 피막형성갑 상선분화암은 10년 재발이 없었다는 양호한 예후가 보고되었다. 그러므로 피막형성 갑상선분화암이 동일한 예후를 보이는지는 불확실하지만, 본 권고안에서는 4 cm 초과인 피막형성갑상선 분화암은 저위험군에서 제외하였다 (Table I.5.1.B).", "이와 같이 갑상선여포암의 예후는 단순히 크기 보다는 동반 병리 소견이 중요한 영향을 미치게 되는데, 따라서 미국갑상선학회, 유럽종양학회를 비롯한 다수의 권고안에서 갑상선여포암의 재발위험도에는 종양의 크기에 관계없이 종양의 피막 및 혈관 침습 정도에 따라 위험군을 분류하고 있다. 본 권고안에서도 갑상선여포암의 피막 및 혈관 침습 정도에 따라 위험도를 분류하였다. 최소침습 갑상선여포암의 경우 재발률 0-5%로 저위험군에 해당하였다. 피막형성혈관침습 갑상선여포암의 경우 침습된 혈관이 1-3 개인 경우 재발률 1.9-15.2% 로 보고되어 중간위험군으로 분류하였고, 침습된 혈관이 4개 이상인 피막형성혈관침습 갑상선여포암과 광범위침습 갑상선여포암의 재발률은 각각 17.9-44.4%와 12.7-54%로 고위험군으로 분류하였다(Table I.5.2.C). 피막형성갑상선분화암 분류는 2023년 에 처음 제안된 것으로, 갑상선여포암을 제외한 다른 피 막형성갑상선분화암에 대해서는 아직까지 독립적으로 알려진 상세한 병리 소견에 의한 재발위험도와 같은 예후가 보고된 바가 없어, 본 권고안에서는 다른 피막형성 갑상선분화암도 갑상선여포암과 동일한 기준을 적용할 것을 제안하였으며, 추후 이에 대한 연구가 필요하다.", "(5) 갑상선유두암의 종양 크기(tumor size)", "AJCC TNM병기에 따르면 갑상선분화암은 그 크기에 따라 T 병기가 분류되며, 재발위험도 역시 T 병기가 높 아짐에 따라 증가한다. 동반된 N 병기가 재발위험도에 영향을 미치므로 해석에 제한이 있지만 본 권고안에서는 Table I.5.1.B와 같이 2 cm 이하 갑상선유두암(T1)은 1-3.5%의 재발률, BRAF<sup>V600E<\/sup> 돌연변이 양성인 1 cm 이하 미세갑상선유두암(T1a)은 1-2% 의 재발률로 보고되어 저위험군으로 분류하였다. 본 위원회에서 육안적 갑상선외부침범과 림프절전이가 없는 환자 5759명의 종양 크기에 따른 재발률을 조사한 결과 5년 및 10년 재발률이 1 cm 이하에서는 1.3%와 2.5%, 1-2 cm에서는 2.7% 와 4.7%, 2-4 cm에서 6.8%와 11.1%였다. 이 중 경미한 갑상선외부침범이 있는 경우 5년 및 10년 재발률이 1 cm 이하에서는 1.5%와 2.6%, 1-2 cm에서는 3.8%와 5.6%, 2-4 cm에서 9.8%와 16.7%로서, 특히 2-4 cm 크기에서는 중간위험군 수준의 재발률을 보여주었다(미발표 자료).", "다른 연구에서도 갑상선에 국한된 2-4 cm 갑상선유두 암(T2)의 경우, 일반적으로 재발률이 5-6%로 알려져 있지만 그 중 BRAF<sup>V600E<\/sup> 음성인 경우에는 1-2% 정도로 낮은 반면, BRAF<sup>V600E<\/sup> 양성인 경우에는 12.1%까지 높게 보고되었다. 이상의 결과와 BRAF<sup>V600E<\/sup> 음성인갑상선유두암은 경미한 침범과 림프절전이의 위험도가 낮은 피막형성갑상선유두암에 속할 가능성이 높은 점 등을 고려하여, 본 권고안에서는 2-4 cm 크기(2 cm 초과, 4 cm 이하)의 갑상선유두암이 BRAF<sup>V600E<\/sup> 음성인 경우에는 저위험군으로, BRAF<sup>V600E<\/sup> 양성인 경우에는 중간위험군으로 분류하였다.", "갑상선에 국한된 4 cm 초과의 갑상선유두암(T3a)의 재발률은 8-10%로 보고되어 BRAF<sup>V600E<\/sup> 변이 동반 여부와 무관하게 중간위험군으로 분류하였다 (Table I.5.1.B).", "(6) 갑상선유두암의 혈관 침습(vascular invasion)", "갑상선유두암에서 침습된 혈관 개수에 따른 재발률은 보고되지 않았지만, 혈관 침습 여부에 따른 재발률에 대한 보고들이 있다. 혈관 침습 시 재발률은 10.7-28%였 고, 대부분의 연구들에서 혈관 침습이 있는 경우에 재발위험이 증가하였다. 혈관 침습 시 원격전이 발생률은 12.8-31.3%였고, 혈관 침습이 있는 경우에 원격전이 위험이 유의하게 증가하였다 (Table I.5.2.D). 그러나, 갑상선유두암에서 세분화된 혈관 침습 정도와 예후와의 연관성에 대해서는 아직까지 근거가 부족하여 추가적인 연구가 필요하다.", "본 권고안에서는 피막형성갑상선분화암에서 알려진 혈관 침습과 원격전이 및 예후와의 연관성을 고려하여, 갑상선유두암에서도 피막형성갑상선분화암에서의 혈관침습에 따른 구분과 동일하게, 침습된 혈관이 1-3개이면 중간위험군, 4개 이상이면 고위험군으로 구분하였다.", "(7) 갑상선유두암의 림프관 침습(lymphatic invasion)", "과거에는 병리보고서에서 갑상선유두암에서 림프관 과 혈관을 구분하지 않고 합쳐서 ‘림프혈관침습(lymphovascular invasion)’으로 보고하였으며, 림프혈관침습에 따른 재발률은 16-30%로 보고되었다. 그러나 혈관 침습을 제외한 림프관 침습 단독에 의한 영향을 구분하기 어렵고, 광범위 림프관 침습(extensive lymphatic invasion)에 대한 기준을 명확히 제시하지 않아 양-반응 비교를 하기 어렵다. 또한 광범위 림프관 침습은 림프절전이를 대부분 동반하는데다, 혈관 침습과 별개로 림프관 침습 단독 유무에 따른 위험도는 임상적 근거가 부족하다. 따라서 본 권고안에서는 림프관 침습을 위험도 분류에 포함하지 않았다.", "(8) 갑상선유두암의 다발성(multifocality)", "다발성 미세갑상선유두암(1 cm 이하)의 재발률은 2-6% 로 보고되나, 갑상선외부침범이 있고 BRAF<sup>V600E<\/sup> 돌연변이 양성인 다발성 미세갑상선유두암의 경우 재발률이 20%까지 보고된다. 그러나, 국내에서는 미세갑상선유두암의 다수가 BRAF<sup>V600E<\/sup> 돌연변이 양성임을 감안하여, 이를 별도의 위험인자로 고려하지 않았다. 1 cm를 초과하는 다발성 유두암의 재발률은 4-23%로 보고된다. 그러나 림프절전이가 동반되지 않은 다발성유 두암은 미세암의 경우 0.78-3.5%의 재발률이 보고되었 고, 1 cm 이상인 경우를 합하여도 4.4% 정도라는 보고도 있다(Table 1.5.2.E).", "이와 같이 육안적 갑상선외부침범이 없는 다발성 미세갑상선유두암의 재발률은 4-6% 이내로 보고되고 있다. 그러나, 갑상선외부침범이나 림프절전이(N1a, N1b) 등 다른 임상병리학적 특성이 동반되면 23%까지 증가한다. 따라서 미세갑상선유두암에서 다발성 단독으로 위험도를 분류하기보다는, 동반된 다른 임상병리학적 소견의 위험도를 고려하여 재발위험을 평가할 필요가 있다.", "한편, 1 cm보다 큰 갑상선유두암이 다발성인 경우에 대해서는 아직까지 근거가 불분명하다. 절반 정도의 환자에서 림프절전이가 동반된 1 cm 초과의 다발성 갑상선유두암 환자에서는 평균 5년 재발률이 6-6.6%로 보고되고 있으며, 이는 미세갑상선유두암에서의 2.4%보다는 높다. 또한 다발성 병소가 양엽에 존재하는 경우에 한 쪽 엽에만 있는 경우와 유사한 재발위험도를 가지는지에 대해서는 근거가 불분명하여 이에 대한 주의가 필요하다.", "(9) 전신스캔(whole-body scan)", "미국갑상선학회, 유럽종양학회를 비롯한 다수의 권고안에서 방사성요오드 잔여갑상선제거술(수술 후 첫 번째 방사성요오드 치료) 시 시행한 전신스캔 소견을 기준으로 재발위험도를 평가한다. 갑상선부위(thyroid bed) 외에 섭취가 없는 경우 저위험군으로, 갑상선부위 이외의 경부 섭취가 있는 경우는 중간위험군으로 분류하고 있다. 최근 림프절전이와 갑상선외부침범을 동반한 갑상선유두암 환자에서 방사성요오드 잔여갑상선제거술 이후 전신스캔에서 갑상선부위 외에는 섭취가 없는 경우 7%의 재발률(5년 재발률 4%)을 보고한 연구가 있으나, 전신스캔 결과에 따른 재발률을 보고한 연구는 부족하여 이전 권고안과 동일하게 분류하도록 하였다.", "(10) 전이림프절 개수 및 크기(lymph node count and", "size) 전이림프절의 크기와 개수가 모두 재발위험도에 영향을 미칠 수 있는데(Table I.5.2.F), 한 연구에서는 크기 0.2 cm 이하의 미세림프절전이만 있는 경우 재발률을 5%, 1 cm보다 큰 림프절전이가 있는 경우 재발률을 32% 로 보고한 바 있다. 또다른 연구에서는 3 cm 이상의 림프절전이가 있는 경우 재발률은 27%로 3 cm 미만의 경우인 11%보다 재발률이 크게 증가하였다. 국내 연구 결과로 원격전이 없이 갑상선전절제술 및 방사성요오드 치료를 받은 N1 환자를 대상으로 분석된 결과가 있는데, 크기 3 cm 이하의 림프절전이를 가진 환자의 경우 림프절 피막 침범 여부 및 전이림프절 수에 따라 4-12.7%의 재발률을 보였으며, 3 cm를 초과한 림프절전이가 있을 경우 재발률은 67%로 크게 증가하였다. 이에 본 권고안에서는 0.2 cm 이하 크기의 전이림프절을 림프절 미세전이(lymph node micrometastasis)로 정의하고, 5 개 이하의 림프절 미세전이는 저위험군으로 분류하였고, 3 cm 초과의 전이림프절이 하나라도 있을 경우 고위험군으로 분류하였고, 저위험군과 고위험군에 해당하지 않는 림프절전이는 중간위험군으로 분류하였다.", "전이림프절의 수는 림프절 절제 정도와 병리학적 평가 기준에 따라 차이가 있으나, 진단 당시 절제된 전이림프절의 수가 많을수록 재발위험과 양의 상관관계가 있다고 알려져 있다(Table I.5.2.G). 미국갑상선학회에서는 전이림프절이 5개 이하면 재발률이 3-8% (중앙값 4%), 5개 초과 시 7-21% (중앙값 19%)로 보고하였다. 국내 연구도 이와 유사한 결과를 보였으며, 종양크기 2 cm 미만의 갑상선유두암 환자 3282명을 분석한 국내 다기관 연구에서는 림프절전이가 2개 미만일 경우 10년 재발위험이 4%였지만, 2개 이상일 경우에는 16.8% 로 증가하였다. 또 다른 2384명의 갑상선유두암 환자를 분석한 국내 연구에서는 10년 재발위험률을 림프절전이가 없을 경우 1.2%, 1-5개는 3%, 6-10개는 12.9%, 10 개를 초과할 경우 27.7%로 보고하였다.", "(11) 림프절외부침범(extranodal extension, ENE)", "림프절외부침범이란 림프절 내에 전이된 종양이 림프절의 피막을 침범하고 외부로 돌출하는 것으로, 림프절 재발과 연관성이 높다고 알려져 있다. 19개의 연구에 대한 체계적 고찰 결과 림프절외부침범이 갑상선암의 예후에 부정적인 영향을 미친다고 보고하였다. 12개의 갑상선유두암 환자 대상 연구에 대한 메타분석에서는 림프절외부침범이 있을 경우 재발위험이 2.21배 증가하는 것으로 보고하였으며, 여러 변수를 보정한 위험비 역시 유의한 결과가 관찰되었다.", "미국갑상선학회에서는 림프절외부침범을 동반한 전이림프절이 3개 미만인 경우 재발률이 1-4%에 불과하지 만, 3개 이상인 경우 32%로 증가한다는 연구결과들을 근거로 3개 이상을 고위험군의 한 요소로 보고하였다. 2384명의 갑상선유두암 환자를 대상으로 한 국내 연구에서는 림프절외부침범을 동반한 전이림프절이 없는 경우 림프절 재발률은 2.28%였으나, 림프절외부침범이 있는 경우는 림프절 재발률은 13.2%로 증가하였다. 다른 국내 연구에서는 전이림프절이 5개 이하, 최대 크기가 3 cm 이하인 경우 림프절외부침범이 없을 경우 3년 재발위험은 4%였고, 림프절외부침범이 1-3개일 경우 11%로 증가하였다. 하지만 전이림프절이 5개 이상인 경우에는 림프절외부침범이 없을 경우 3년 재발위험 률 13%, 1-3개는 11%, 4개 이상일 때는 15%로 비슷하게 보고되었다.", "따라서 림프절외부침범이 전이림프절에 동반될 경우, 개수에 따른 재발위험도를 고려할 것이 바람직하다 (Table I.5.2.H). 다만, 우리나라의 연구에 따르면 중간위험군으로 분류되는 전이림프절이 5개 이하인 경우에는 림프절외부침범 소견이 있는 경우 재발위험도가 증가하지만, 전이림프절의 개수가 5개 초과인 경우에는 림프절외부침범의 동반에 의해 추가적인 재발률이 높아지지는 않았다(Table I.5.2.F-G).", "(12) 전이림프절 비율(lymph node ratio)", "전이림프절 비율은 전이림프절의 개수를 절제한 림프절의 개수로 나눈 값으로 정의된다. 전이림프절 비율은 기존의 진료권고안에서 제시한 위험군 분류에는 포함되어 있지 않았다. 그러나 9개의 후향적 연구에 대한 체계적 고찰에서 전이림프절 비율이 국소 재발을 독립적으로 예측하였다. 국내 연구들에서도 전이림프절 비율 과 재발의 유의한 연관성을 보고하였는데, 전이림프절 비율의 절단값은 0.22-0.65까지 다양하였다. 한 연구에서는 전이림프절 비율 0.29 이상일 때 재발률 12.4%로, 0.29 미만일 때의 2.5%에 비해 높았다. 다른 연구에서는 전이림프절 비율 0.65 이상일 때 10년 무재발생존율이 75.4%로, 0.65 미만일 때의 98.5%에 비해 낮았다. 15,698명의 갑상선암 환자를 대상으로 한 24개의 연구를 메타분석한 결과 역시 높은 전이림프절 비율이 무병생존율 의 감소와 연관되었다 (Table I.5.2.I).", "비록 전이림프절 비율이 절단값에 대한 일관된 기준이 없고, 그에 따른 연구간 이질성으로 인하여 특정 비율을 위험도 평가 기준에 포함시키기 어렵지만, 전이림프절 비율의 증가는 재발위험을 유의하게 증가시키므로 재발위험도 판단 시 함께 고려해야 한다."]}, "I.5.3.A": {"ids": ["I.5.3.A"], "p": ["혈청 갑상선글로불린 측정(갑상선글로불린항체 포함) 은 수술 후 초기 평가에 초음파검사와 같이 혹은 단독으로 시행된다. 수술 후 갑상선글로불린의 예측능력은 잔존 갑상선암 혹은 잔여 정상 갑상선조직의 양, 잔존 갑상선암의 갑상선글로불린 생산력, 측정 당시의 TSH 농도, 갑상선글로불린 측정법의 민감도, 갑상선글로불린 기준값, 방사성요오드가 섭취되는 국소 혹은 원격전이의 위험도, 갑상선절제술 후 경과 기간, 스캔 기법(SPECT/CT 혹은 평면 영상) 등 여러 요소에 의해 영향을 받는다. 특히, 수술 후 잔여 정상 갑상선조직의 양은 갑상선 절제 범위(엽/부분절제술 또는 전절제술) 또는 방사성요오드 잔여갑상선제거술 여부에 따라 혈청 갑상선글로불린 농도의 정상치와 예후 예측능력이 달라질 수 있어, 이에 대해서는 추가 연구와 이에 따른 기준값의 설정이 필요하다.", "갑상선전절제술 후 방사성요오드 잔여갑상선제거 시 TSH-자극 갑상선글로불린이 1-2 ng/mL 이상이면 재발의 위험이 높았으며, 다변량분석에서도 갑상선암의 지속 혹은 재발의 독립적인 예측 인자였다. TSH-자극 갑상선글로불린이 높으면(10-30 ng/mL 이상) 낮은 생존율과 관련 있는 반면, TSH-자극 갑상선글로불린 1-2 ng/mL 이하는 관해의 강력한 예측지표이다. 그러나, 방사성요오드 치료 여부를 결정하는 갑상 선글로불린(TSH-자극 혹은 비자극)의 기준값은 결정되 어 있지 않다. 때문에 수술 후 방사성요오드 잔여갑상선제거술의 필요성에 대한 의사 결정에 있어 수술 후 갑상선글로불린 값은 방사성요오드 잔여갑상선제거가 필요 없는 환자를 확인하는 것보다 방사성요오드 잔여갑상선제거술이 필요한 환자를 확인하는데 더 유용할 것이다.", "최근에는 방사성요오드 잔여갑상선제거는 시행하지 않고 엽절제술이나 전절제술만 받은 갑상선암 환자들의 갑상선글로불린 농도와 재발률을 분석한 여러 연구결과들이 보고되고 있다. 갑상선엽절제술을 받은 환자에서갑상선글로불린이 현저히 높거나 점차 증가하는 추세인 경우 재발률이 높았다. 엽절제술을 받은 환자 중 갑상선글로불린이 20 ng/mL를 초과하는 경우 56%가 재발하였 고, 갑상선글로불린 농도가 점차 증가한 환자 중 22% 가 재발하였다. 갑상선전절제술 후 방사성요오드 잔여갑상선제거술을 받지 않은 경우 갑상선글로불린이 1 ng/mL를 초과하는 경우 재발률 5.9%였지만 1 ng/mL 이하에서는 0.4%였다. 반면 1 ng/mL 초과인 경우에도 재발한 환자가 없었다는 보고들도 있었다. 한 체계적 문헌고찰 에 따르면 갑상선엽절제술을 받았거나 방사성요오드 잔여갑상선제거술을 받지 않은 갑상선전절제술 환자에서 혈청 갑상선글로불린의 측정은 재발 예측에 대한 근거가 부족하다고 보고하였다. 따라서 본 권고안에서는 수술 후 혈청 갑상선글로불린의 특정 농도를 기준으로 재발위험도를 예측하기는 어려우며, 추후 갑상선글로불린의 역할에 대한 전향적 연구가 필요하다."]}, "I.5.4.A": {"ids": ["I.5.4.A"], "p": ["TERT 프로모터 돌연변이를 가진 갑상선유두암 또는 갑상선여포암에서는 40% 초과의 재발률, BRAF<sup>V600E<\/sup> 돌연변이를 가진 갑상선유두암에서는 5.9-34.1%의 재발률이 보고되고 있다. BRAF<sup>V600E<\/sup> 돌연변이와 TERT 프로모터 돌연변이가 동반된 경우, 혹은 RAS 돌연변이와 TERT 프로모터 돌연변이가 동반될 것과 같이 위험도를 증가시키는 2개 이상의 돌연변이가 동반된 경우 재발률 40% 이상으로 고위험군으로 분류된다. 따라서 수술 후 예후를 예측하기 위한 용도로 BRAF<sup>V600E<\/sup>, RAS, TERT 프로모터 돌연변이를 검출하기 위한 검사를 고려할 수 있다.", "갑상선유두암에서 BRAF<sup>V600E<\/sup> 돌연변이와 나쁜 예후와의 연관성은 연구에 따라 다르게 보고되고 있다. 여러 후향적 연구에서 BRAF<sup>V600E<\/sup> 돌연변이와 TERT 프로모터 돌연변이가 공존하는 경우가 BRAF<sup>V600E<\/sup> 돌연변이만 있거나, TERT 프로모터 돌연변이만 있거나, 돌연변이가 없는 경우에 비해 유의하게 나쁜 예후를 보인다고 보고되었다. 26개 연구를 분석한 메타 연구에서 두 돌연변이가 함께 있는 경우가 BRAF<sup>V600E<\/sup> 돌연변이만 있는 경우 (오즈비 4.35, 95% 신뢰구간 2.17-9.09), 돌연변이가 모두 없는 경우 (오즈비 7.23, 95% 신뢰구간 3.37-15.51) 에비하여 종양 재발의 위험이 높았다.", "갑상선 내에 국한된 1-4 cm 크기의 갑상선유두암에서 TERT 프로모터 돌연변이가 있는 경우, 전절제술을 시행한 환자 군의 10년 무병생존율이 100%로 엽절제술을 시행한 군(64.5%)에 비하여 유의하게 높았다. 또한 TERT 프로모터 돌연변이를 동반한 최소침습 및 피막형성혈관침습 여포암의 경우 광범위침습 여포암과 원격전이 발생률과 종양 재발률에 차이가 없고, 2 cm 보다 큰 최소침습 및 피막형성 혈관 침습 여포암의 경우, TERT 프로모터 돌연변이가 있는 군에서 그렇지 않은 군보다 무병생존율이 낮아 TERT 프로모터 돌연변이 유무에 기반하여 갑상선완료절제술을 결정할 수 있다고 주장하는 연구가 보고되었다. 따라서 수술 후 TERT 프로모터 돌연변이가 검출된 갑상선분화암의 경우 갑상선완료절제술과 함께 방사성요오드 치료를 고려해볼 수 있다.", "앞서 기술된 장기 예후에 더하여 Bournaud 등 은 TERT 프로모터 돌연변이가 초기 치료 직후의 불완전 반 응(45.7% vs. 18.1%)과 연관되어 있고, 진단 당시 원격전이 와 공격적인 조직학적 특성이 없는 경우에도 낮은 무병생 존율을 보고한 바 있으므로 TERT 프로모터 돌연변이가 있는 환자의 경우 추적관찰 기간 단축을 고려해볼 수 있다. 그러나, 1 cm 이하의 갑상선유두암을 대상으로 한 대부분의 연구에서 TERT 프로모터 돌연변이 유무는 예후 인자로서의 역할이 없는 것으로 보고하고 있다.", "갑상선여포암의 경우, 51개의 연구를 분석한 메타 연구에서 TERT 프로모터 돌연변이가 종양의 재발(오즈비 4.59, 95% 신뢰구간 2.08-10.13), 질병특이 생존기간(오즈 비 9.28, 95% 신뢰구간 3.35-25.70)과 연관된 것이 보고되었다. 또한 갑상선분화암에서 RAS 및 TERT 프로모터 돌연변이가 함께 있는 경우 종양의 재발(오즈비 5.36, 95% 신뢰구간 1.20-24.02)과 사망(오즈비 14.75, 95% 신뢰구간 1.36-167.0)의 위험을 높이는 것이 확인되었다. 다만, 기존의 TERT 프로모터 돌연변이에 대한 연구 결과는 대부분 TERT 프로모터 돌연변이만 평가하거나 BRAF<sup>V600E<\/sup> 또는 RAS 돌연변이와 같이 제한된 수의 돌연변이만 확인된 것으로, 다른 유전자의 돌연변이와 동시에 존재한 영향이 반영되었을 가능성을 확인할 수 없으므로, 이의 적용에 주의를 요한다.", "전임상연구에서 BRAF<sup>V600E<\/sup> 돌연변이의 존재는 나트륨- 요오드 전달체(Na-I symporter, NIS) 발현과 방사성요오드 섭취를 유의하게 감소시키는 것으로 보고되고 있다. 13 개의 전향 / 후향 연구를 분석한 메타 연구에서 BRAF<sup>V600E<\/sup> 돌연변이 (오즈비 3.60, 95% 신뢰구간 1.74- 7.46) 와 함께 TERT 프로모터 돌연변이 (오즈비 9.84, 95% 신뢰구간 3.60-26.89)가 방사성요오드 섭취 감소의 위험을 높이는 인자로 나타났다. 하지만, BRAF<sup>V600E<\/sup>, TERT 프로모터를 비롯한 다른 유전자의 돌연변이가 방사성요오드 잔여갑상선제거나 보조치료에 영향을 줄 수 있는지, 혹은 투여 용량을 조절해야 하는지에 대한 임상 자료는 불충분하여, 이에 있어서 분자표지자의 역할은 아직 정립되지 않았다."]}, "I.6.1.A": {"ids": ["I.6.1.A", "I.6.1.B", "I.6.1.C"], "p": ["수술 후 치료 방침을 결정하기 위해 수술 후 병기(Part I. 제4장, Table I.4.2.A, I.4.2.B) 및 다른 병리소견과 혈청 갑상선글로불린, 경부 초음파검사, 방사성요오드 진단스캔 등을 포함한 여러 검사를 통해 수술 후 질병 상태를 평가하여, 재발위험도에 따라 방사성요오드 치료 여부를 결정한다(Part I. 제5장, Table I.5.1.A-I.5.2.I). 그러나 아직까지 이러한 진단검사들의 유용성을 비교한 무작위 대조연구는 아직 없다.", "수술 후 혈청 갑상선글로불린 농도는 질병 상태나 잔여갑상선의 존재를 평가하고 질병의 잠재적 재발을 예측하는 데 도움이 되며, 대부분 수술 후 3-4 주째 최저점에 도달한다. 그러나 방사성요오드 투여에 관한 의사결정을 하는데 있어서 수술 후 혈청 갑상선글로불린의 최적의 기준값 혹은 측정할 때의 상태(TSH-비자극 혹은 TSH-자극)에 대해서는 아직까지 연구 결과가 불충분하 여 알려지지 않았다.", "수술 후 방사성요오드 진단스캔(<sup>123<\/sup>I 혹은 <sup>131<\/sup>I, SPECT/ CT와 같이 혹은 단독)은 25-53%의 환자에서 질병 상태, 잔여갑상선 섭취, 방사성요오드를 섭취
