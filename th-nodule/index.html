<title>갑상선결절 검사 및 치료 알고리즘 (KTA 2024)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#16212B; --muted:#56646F;
  --line:#7F8D99; --test:#DCE5EB; --test-ink:#12304A;
  --accent:#1F5E7E; --accent-soft:#E3EEF4;
  --mal:#A13D33; --mal-bg:#FBEDEA; --ben:#2C6A43; --ben-bg:#E9F3EC;
  --tx:#6A4C93; --tx-bg:#F1ECF8; --warn:#85600F; --warn-bg:#FBF3DF;
  --border:#C9D3DA;
  --fn:#C2410C; --fn-bg:#FFF1E6;
  --hdr-bg:#1F4F6B; --hdr-ink:#FFFFFF; --hdr-sub:#CFE1EC; --hdr-link:#FFE8A3; --hdr-rule:#E0B44C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
    --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
    --accent:#7FB7D6; --accent-soft:#1D3140;
    --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
    --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
    --border:#2E3E4A;
    --fn:#F59E62; --fn-bg:#3A2418;
    --fn:#F59E62; --fn-bg:#3A2418;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --ink:#E4EAEE; --muted:#9AA8B3;
  --line:#7D8C98; --test:#243645; --test-ink:#D7E6F1;
  --accent:#7FB7D6; --accent-soft:#1D3140;
  --mal:#F08B80; --mal-bg:#3A1F1C; --ben:#86C79C; --ben-bg:#1B3124;
  --tx:#C2A8EA; --tx-bg:#2A2238; --warn:#E3C06A; --warn-bg:#352B14;
  --border:#2E3E4A;
  --hdr-bg:#1A3446; --hdr-ink:#EEF3F6; --hdr-sub:#A9C2D2; --hdr-link:#F2D27E; --hdr-rule:#B88F33;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:16px; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.top{
  background:var(--hdr-bg); color:var(--hdr-ink);
  border:1px solid var(--hdr-bg); border-bottom:0; border-radius:10px 10px 0 0; margin:0;
  box-shadow:inset 0 -3px 0 var(--hdr-rule);
}
.fig .chart-wrap{border-top:0; border-radius:0 0 10px 10px}
.chart-note{position:absolute; right:1rem; bottom:.55rem; margin:0; padding-left:1.1em; font-size:calc(var(--ui-font,13px) * .88); line-height:1.55; color:var(--muted); white-space:nowrap}
.chart-note a{color:var(--accent)}
.top .disclaimer{font-size:.74rem; font-style:italic; color:var(--hdr-sub); opacity:.85; margin:.15rem 0 0}
.top-inner{padding:.8rem 1.25rem .9rem; text-align:center}
.top h1{font-size:1.25rem; margin:0; font-weight:700; letter-spacing:-.01em; color:var(--hdr-ink)}
.top .src{font-size:.84rem; color:var(--hdr-sub); margin:.2rem 0 0}
.top .src a{color:var(--hdr-link); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--hdr-rule)}
.top .src a:hover{text-decoration-thickness:2px}
.top .src a:focus-visible{outline-color:var(--hdr-link)}
.btn{
  font:inherit; font-size:.85rem; color:var(--ink); background:var(--surface);
  border:1px solid var(--border); border-radius:6px; padding:.35rem .7rem; cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

main{max-width:1180px; margin:0 auto; padding:1rem 1.25rem .75rem}
.intro{max-width:70ch; color:var(--muted); font-size:.95rem; margin:0 0 1rem}
.legend{order:2; display:flex; flex-direction:column; gap:.2rem; font-size:var(--ui-font,13px); color:var(--muted); flex:none; align-self:flex-start; padding:.25rem .25rem 0 .25rem}
.legend span{white-space:nowrap}
.legend span{display:inline-flex; align-items:center; gap:.4rem}
.sw{width:18px; height:12px; border-radius:3px; border:1.5px solid var(--line); display:inline-block}
.sw.test{background:var(--test)}
.sw.mal{border-color:var(--mal); background:var(--mal-bg)}
.sw.ben{border-color:var(--ben); background:var(--ben-bg)}
.sw.tx{border-color:var(--tx); background:var(--tx-bg)}

.chart-wrap{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  overflow-x:auto; padding:.75rem; display:flex; gap:1rem; align-items:flex-start; position:relative;
}
.chart-size{flex:none}
.fig{width:fit-content; max-width:100%; margin:0 auto}
.below{display:flex; flex-wrap:nowrap; align-items:center; gap:.4rem; margin-top:.6rem; overflow-x:auto; padding-bottom:2px}
.below button{flex-shrink:0; white-space:nowrap}
.sep{width:1px; height:1.4rem; background:var(--border); margin:0 .25rem}
.fn-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.5rem .75rem .75rem}
.fn-panel .fn-list{margin:0}
.chart-size{position:relative}
.chart{position:absolute; left:0; top:0; width:760px; height:720px; transform-origin:0 0}
.chart svg{position:absolute; inset:0; width:760px; height:720px; overflow:visible}
.chart svg path{fill:none; stroke:var(--line); stroke-width:1.4}
.chart svg path.dot{stroke-dasharray:3 4}
.chart svg marker path{fill:var(--line); stroke:none}

.node{
  position:absolute; display:flex; align-items:center; justify-content:center; text-align:center;
  font:inherit; font-size:15px; line-height:1.2; font-weight:500; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line); border-radius:4px;
  padding:2px 8px; cursor:pointer;
  transition:box-shadow .15s ease, border-color .15s ease;
}
.node sup{font-size:13px; margin-left:2px; color:var(--accent); font-weight:700; vertical-align:baseline; position:relative; top:-.5em; line-height:0}
.node.test{background:var(--test); color:var(--test-ink); font-weight:600}
.node.mal{border-color:var(--mal); background:var(--mal-bg)}
.node.ben{border-color:var(--ben); background:var(--ben-bg)}
.node.tx{border-color:var(--tx); background:var(--tx-bg)}
.node:hover{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.node.is-active{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent)}

.fn-list{margin:0; padding:0; list-style:none; display:grid; gap:.4rem}
.fn-list button{
  width:100%; text-align:left; font:inherit; font-size:.86rem; color:var(--ink);
  background:transparent; border:1px solid transparent; border-radius:6px; padding:.35rem .5rem; cursor:pointer;
  display:grid; grid-template-columns:1.4rem 1fr; gap:.25rem;
}
.fn-list button:hover{background:var(--accent-soft); border-color:var(--border)}
.fn-list b{color:var(--accent)}
.caption{font-size:.82rem; color:var(--muted); margin:.75rem 0 0}

.abbr-panel{margin-top:.6rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.25rem .9rem .75rem}
.abbr-toggle{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.fn-toggle:hover,.abbr-toggle:hover{border-color:var(--accent); background:var(--accent-soft)}
.abbr-search{margin:.6rem 0; width:100%; max-width:360px; font:inherit; font-size:.9rem; padding:.4rem .6rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--ink)}
.abbr dl{display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; margin:0; font-size:.88rem}
.abbr dt{font-weight:600; color:var(--accent)}
.abbr dd{margin:0}

/* recommendations */
.rec{display:grid; grid-template-columns:auto 1fr auto; gap:.25rem .6rem; align-items:start; border:1px solid var(--border); border-radius:6px; padding:.5rem .65rem; margin:.5rem 0; background:var(--bg)}
.rec p{margin:0; font-size:.9rem}
.rid{font-weight:700; color:var(--accent); font-size:.85rem; white-space:nowrap; padding-top:.05rem}
.lv{font-size:.72rem; font-weight:600; padding:.1rem .45rem; border-radius:999px; white-space:nowrap; cursor:help; border:1px solid currentColor}
.lv.l1{color:var(--ben); background:var(--ben-bg)}
.lv.l2{color:var(--accent); background:var(--accent-soft)}
.lv.l3{color:var(--warn); background:var(--warn-bg)}
.lv.l4{color:var(--muted); background:transparent}
.small,.d-body ul.small li{font-size:.86rem}
.d-body ul.small{color:var(--ink)}
@media (max-width:520px){ .rec{grid-template-columns:auto 1fr} .rec .lv{grid-column:2; justify-self:start} }
.extras{display:contents}
.extras button{font:inherit; font-size:var(--ui-font,13px); padding:.4rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer}
.extras button:hover{border-color:var(--accent); background:var(--accent-soft)}

.d-body .fn-list{padding-left:0; margin:0 0 .5rem}
.d-body .fn-list li{margin:0}
.d-body a{color:var(--accent)}
.xp{border:1px solid var(--border); border-radius:6px; margin:.4rem 0; background:var(--bg)}
.xp summary{cursor:pointer; padding:.5rem .7rem; font-size:.92rem; list-style:none; display:flex; gap:.5rem; align-items:baseline}
.xp summary::-webkit-details-marker{display:none}
.xp summary::before{content:"▸"; color:var(--accent); flex:none; transition:transform .15s}
.xp[open] summary::before{transform:rotate(90deg)}
.xp[open] summary{border-bottom:1px solid var(--border); font-weight:600}
.xp > div{padding:.3rem .8rem .6rem; background:var(--surface); border-radius:0 0 6px 6px}
.xp h5{font-size:.88rem; margin:.6rem 0 .2rem}
@media (prefers-reduced-motion: reduce){.xp summary::before{transition:none}}
.d-body h5{font-size:.9rem; margin:.7rem 0 .25rem; color:var(--accent)}
.kt th,.kt td:first-child{white-space:nowrap}
.kt td:nth-child(3),.kt td:nth-child(4){white-space:nowrap}
.fnl{margin:.4rem 0 0; padding-left:1.3rem}
.fnl li{margin:.25rem 0}
.fnl li::marker{font-weight:700; color:var(--fn)}
.kt sup, .d-body h4 sup{color:var(--fn); font-weight:700; background:var(--fn-bg); border-radius:3px; padding:0 .2em; margin-left:.1em}
.fnl{background:var(--fn-bg); border-left:3px solid var(--fn); border-radius:0 6px 6px 0; padding:.5rem .7rem .5rem 1.9rem}
.term{font:inherit; color:var(--accent); font-weight:700; background:var(--accent-soft); border:0; border-bottom:2px dotted var(--accent); border-radius:3px; padding:0 .25em; cursor:pointer}
.term::after{content:" ▸"; font-size:.8em}
.term[aria-expanded="true"]::after{content:" ▾"}
.term:hover{background:var(--test)}
.pop{margin:.5rem 0 .3rem; border:1px solid var(--accent); border-radius:8px; background:var(--surface); padding:.6rem .8rem; box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pop-h{display:block; color:var(--accent); margin-bottom:.3rem}
.pop ul{margin:.2rem 0; padding-left:1.1rem}
.pop li{font-size:.9rem; margin:.3rem 0}
.pop-src{font-size:.78rem; color:var(--muted); margin:.4rem 0 0}
.pop .tbl table{min-width:0}
.pop .tbl td:first-child{width:38%}
/* drawer */
.backdrop{position:fixed; inset:0; background:rgba(10,20,28,.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.backdrop.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(560px,100%);
  background:var(--surface); border-left:1px solid var(--border);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s ease;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:none}
.d-head{display:flex; gap:1rem; align-items:flex-start; padding:1rem 1.25rem .75rem; border-bottom:1px solid var(--border)}
.d-head > div{flex:1}
.d-kind{margin:0; font-size:.8rem; color:var(--accent); font-weight:600}
.d-head h2{margin:.15rem 0 0; font-size:1.25rem; line-height:1.35}
.d-body{flex:1; overflow-y:auto; padding:1rem 1.25rem 1.5rem; font-size:.95rem}
.d-body h4{font-size:.98rem; margin:1.25rem 0 .4rem; color:var(--ink)}
.d-body h4:first-child{margin-top:0}
.d-body p{margin:.4rem 0}
.d-body ul{margin:.3rem 0; padding-left:1.2rem}
.d-body li{margin:.2rem 0}
.tbl{overflow-x:auto; margin:.5rem 0}
.tbl table{border-collapse:collapse; width:100%; font-size:.85rem; min-width:440px}
.tbl th,.tbl td{border:1px solid var(--border); padding:.4rem .5rem; vertical-align:top; text-align:left}
.tbl th{background:var(--test); color:var(--test-ink); font-weight:600}
.box{border-radius:6px; padding:.6rem .8rem; margin:.75rem 0; font-size:.9rem}
.box.fn{background:var(--accent-soft); border-left:3px solid var(--accent)}
.box.tip{background:var(--ben-bg); border-left:3px solid var(--ben)}
.box.verify{background:var(--warn-bg); border-left:3px solid var(--warn)}
.box b{display:block; margin-bottom:.15rem}
.d-next{padding:.75rem 1.25rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:.4rem; align-items:center}
.d-next:empty{display:none}
.d-next .lbl{font-size:.8rem; color:var(--muted); margin-right:.25rem}
.d-next button{font:inherit; font-size:.85rem; padding:.3rem .65rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:transparent; cursor:pointer}
.d-next button:hover{background:var(--accent-soft)}

@media (max-width:700px){
  .drawer{top:auto; height:86%; width:100%; border-left:0; border-top:1px solid var(--border); border-radius:14px 14px 0 0; transform:translateY(100%)}
  .drawer.open{transform:none}
  main{padding:1rem .75rem}
  .chart-wrap{padding:.5rem}
}
@media (prefers-reduced-motion: reduce){
  .drawer,.backdrop,.node{transition:none}
}

/* 범례 클릭 시 해당 박스 깜빡임 */
.legend .lg{font:inherit; color:inherit; background:transparent; border:1px solid transparent; border-radius:6px; padding:.15rem .35rem; margin:0 -.35rem; display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap; cursor:pointer; text-align:left}
.legend .lg:hover{background:var(--accent-soft); border-color:var(--border); color:var(--ink)}
.legend .lg.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.node{--flash:var(--accent)}
.node.test{--flash:var(--test-ink)} .node.tx{--flash:var(--tx)} .node.ben{--flash:var(--ben)} .node.mal{--flash:var(--mal)}
@keyframes nodeFlash{0%,100%{box-shadow:0 0 0 0 transparent; transform:scale(1)} 50%{box-shadow:0 0 0 5px var(--flash); transform:scale(1.04)}}
.chart.hl .node{transition:opacity .2s}
.chart.hl .node:not(.flash){opacity:.3}
.node.flash{animation:nodeFlash .8s ease-in-out 3; z-index:3}
@media (prefers-reduced-motion: reduce){
  .node.flash{animation:none; box-shadow:0 0 0 4px var(--flash)}
  .chart.hl .node{transition:none}
}

/* ---- DTC 형식 이식: 권고 설명, 하단 버튼 ---- */
.below{display:flex; flex-wrap:nowrap; align-items:center; gap:.4rem; margin-top:.6rem; overflow-x:auto; padding-bottom:2px}
.below button{flex-shrink:0; white-space:nowrap}
.node small{font-size:11px; font-weight:500; color:var(--muted); margin-left:5px; white-space:nowrap}
.lv-ic::after{content:"▸"; font-size:.8em}
.exp{margin:-.3rem 0 .7rem; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:0 0 6px 6px; background:var(--surface); padding:.55rem .8rem .6rem; font-size:.88rem; line-height:1.7}
.exp-h{display:flex; justify-content:space-between; gap:.5rem; align-items:baseline; color:var(--accent); margin-bottom:.2rem}
.exp-h span{font-size:.78rem; color:var(--muted)}
.exp p{margin:.45rem 0}
.exp h5{margin:.7rem 0 .2rem; font-size:.86rem; color:var(--ink)}
.exp p.exp-li{margin:.2rem 0 .2rem .9rem; padding-left:1.4em; text-indent:-1.4em}
.exp-note,.exp-src{font-size:.78rem; color:var(--muted)}
.exp-src{border-top:1px dashed var(--border); padding-top:.4rem; margin-top:.6rem}
.rec.has-exp{cursor:pointer; transition:border-color .15s, box-shadow .15s}
.rec.has-exp:hover{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.rec.has-exp[aria-expanded="true"]{border-color:var(--accent); border-bottom-left-radius:0; border-bottom-right-radius:0; margin-bottom:0; background:var(--accent-soft)}
.rec.has-exp[aria-expanded="true"] .lv-ic::after{content:"▾"}
.exp{margin:0 0 .8rem; border-top:0}
.exp-h{position:sticky; top:-1rem; z-index:2; background:var(--surface); margin:-.55rem -.8rem .3rem; padding:.55rem .8rem .45rem; border-bottom:1px solid var(--border); align-items:center}
.exp-h .exp-r{margin-left:auto}
.exp-close{font:inherit; font-size:.78rem; padding:.2rem .55rem; border-radius:6px; border:1px solid var(--accent); color:var(--accent); background:var(--surface); cursor:pointer; white-space:nowrap}
.exp-close:hover{background:var(--accent-soft)}
.exp-close-b{display:block; margin:.5rem 0 0 auto}
@media (prefers-reduced-motion: reduce){.rec.has-exp{transition:none}}
.rec.has-exp .lv{display:inline-flex; align-items:center; gap:.35rem; padding-right:.2rem}
.rec.has-exp .lv-ic{display:inline-flex; align-items:center; justify-content:center; width:1.35rem; height:1.35rem; border-radius:50%; background:var(--accent); color:#fff; flex:none; transition:transform .2s, background .15s}
.rec.has-exp .lv-ic::after{content:"▸"; font-size:.95rem; line-height:1; margin-left:.1rem}
.rec.has-exp:hover .lv-ic{background:var(--accent-ink, var(--ink)); transform:scale(1.12)}
.rec.has-exp[aria-expanded="true"] .lv-ic{transform:rotate(90deg)}
.rec.has-exp[aria-expanded="true"] .lv-ic::after{content:"▸"}
@media (prefers-reduced-motion: reduce){.rec.has-exp .lv-ic{transition:none}}
.below{gap:.4rem; margin-top:.6rem}
.below .sep{background:var(--border)}
.below button{--b:var(--accent); display:inline-flex; align-items:center; gap:.3rem; font-weight:500; font-size:var(--ui-font,13px); border:1px solid var(--b) !important; background:color-mix(in srgb, var(--b) 12%, var(--surface)) !important; color:var(--ink) !important; border-radius:6px; padding:.3rem .6rem; transition:transform .12s, box-shadow .12s, background .12s}
.below button:hover{background:color-mix(in srgb, var(--b) 24%, var(--surface)) !important; transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.12)}
.below button:focus-visible{outline:2px solid var(--b); outline-offset:2px}
.below .bt-ic{display:inline-flex; align-items:center; justify-content:center; min-width:1.05rem; height:1.05rem; padding:0 .15rem; border-radius:999px; background:var(--b); color:var(--surface); font-size:.6rem; font-weight:700; line-height:1}
.below .bt-lv, .below .bt-preg, .below .bt-peds, .below .bt-abbr{--b:var(--ben)}
@media (prefers-reduced-motion: reduce){.below button{transition:none} .below button:hover{transform:none}}
.node{flex-wrap:wrap; column-gap:0}
.below button{--b:var(--ben)}
</style>
</head>
<body>
<main>

  <div class="fig" id="fig">
  <header class="top">
    <div class="top-inner">
      <div>
        <h1>갑상선결절 검사 및 치료 알고리즘</h1>
        <p class="src">대한갑상선학회 갑상선결절 진료권고안 2024, <a href="https://doi.org/10.11106/ijt.2024.17.1.208" target="_blank" rel="noopener noreferrer">Int J Thyroidol 2024;17(1):208-244</a></p>
        <p class="disclaimer">This tool is not officially endorsed by KTA</p>
      </div>

const EXP = {"1.A": {"ids": ["1.A", "1.B", "1.C", "1.D"], "p": ["촉진으로 갑상선결절 또는 암을 진단하는 것은 매우 부정확하여, 갑상선암의 선별검사로는 갑상선 초음파검사를 시행한다. 갑상선의 급격한 크기 증가 및 쉰 목소 리와 같은 병력이나 성대 마비, 동측 경부 림프절 종대, 결절이 주위 조직에 고정되어 있는 것과 같은 신체검사 소견 등 갑상선암이 의심되는 임상증상이 있는 경우에는 반드시 초음파검사가 필요하다. 그러나 이와 같은 증상이 없는 경우 갑상선암의 선별검사로서 초음파의 적응증에 대해서는 아직까지 확실하게 정립된 바가 없다.", "일반적으로 암의 예후는 조기 진단 후 조기 치료할 경우 개선될 수 있다고 알려져 있고, 특정 암을 조기 진 단하기 위한 선별검사를 권장하는 경우는 환자에게 명확한 질환의 위험이 있거나, 선별검사로 인해 조기에 암을 진단할 수 있고 조기 진단이 질환의 재발, 환자의 생존율 등에 큰 영향을 미칠 때이다. 갑상선암의 경우, 두경부 방사선조사, 골수 이식을 위한 전신 방사선조사, 14세 이전 체르노빌의 방사능 낙진 노출 등 방사선에 대한 노출이 있었던 경우, 또는 갑상선암의 가족력이 있거나 직계가족 중 가족성 갑상선암이나 유전성 종양증후군(hereditary tumor syndrome)에 이환된 가 족이 있는 경우 등에서 갑상선결절과 갑상선암이 발생할 위험이 증가한다. 비교적 젊은 연령에 발병하는 가족 성수질암증후군 또는 다발성내분비종양증후군(multiple endocrine neoplasm syndrome)에 이환된 경우에는 조기 진단을 통해 예후를 향상시킬 수 있으므로 원인 유전자변이의 위험도에 따라 진단 및 치료를 하는 권고안이 제시되고 있다. 그러나 이외의 대부분의 고위험군에 대해서는 아직까지 조기 진단이 재발 및 사망의 감소에 미치는 영향에 대한 근거 연구들이 충분하지 않다.", "1.1. 가족 중에 갑상선분화암 환자가 있는 경우 갑상선암 선별검사의 역할", "갑상선분화암의 2.5-11.3%는 가족성으로 발생한다고 알려져 있으며 국내 연구에서는 9.0-9.6%가 가족성으로 알려졌다. 가족성 갑상선분화암에 대한 정의에 대해서는 다소 논란이 있으나, 알려진 유전성 질환이 배제된 상태에서 직계 가족 구성원 중 2명 또는 3명 이상의 갑상선분화암 환자가 있으면 가족성 갑상선분화암 이라고 간주한다. 2명 이상의 갑상선분화암이 발생한 가계에서 초음파를 통해 갑상선암 선별검사를 시행한 전향적 연구를 살펴보면 가계 내 2명의 갑상선암 환자가 있는 경우 4.6%에서 갑상선암이 발견된 데 반해, 3명 이상의 갑상선암 가족력이 있는 경우 22.7%에서 갑상선암이 발견되었다. 다른 연구에서도 2명 이상의 갑상선분화암 환자가 포함된 가계에서는 갑상선암 발생 빈도가 5.5%로, 대조군의 1.3%에 비해 유의하게 증가하였다.", "가족성 갑상선분화암의 예후에 대해서는 다양한 결과들이 보고되고 있다. 12개의 연구, 12,741명의 환자가 포함된 메타 연구에서는 가족성 갑상선분화암에서 다발성 암 (1.5배), 림프절전이 (1.2배) 및 재발 (1.7배)의 빈도가 높다고 보고하였다. 반면 최근 갑상선암에 대한 개별적인 위험 인자들을 매칭한 후 286명의 가족성 갑상선분화암 환자와 858명의 산발성 갑상선분화암 환자의 예후를 분석한 국내 연구를 보면, 평균 11.8년 추적 기간 동안 재발률은 각각 10.1%와 7.5%로 가족성 갑상선분화암 환자의 재발률이 다소 높았으나 통계적 유의성은 없었다. 더욱이 아직까지 가족성 갑상선분화암 환자에서 사망률이 더 높다는 연구는 없기 때문에 일률적으로 초음파검사를 권고할 근거는 부족하다 . 현재 권고되는 것은 갑상선분화암 환자의 가족 구성원에 대해서는 주의 깊게 병력을 살펴보고 정기적인 검사 중의 하나로 경부촉진검사를 실시하는 것이다.", "다만 유전성 종양증후군(PTEN hamartoma tumor syndrome/Cowden syndrome [PTEN, 10q23], familial adenomatous polyposis [FAP]/APC-associated polyposis [APC, 5q21-q22], Carney complex [PRKAR1A, 17q24.2; CNC2, 2p16], Werner syndrome/progeria [WRN, 8p12], DICER1 syndrome [DICER1, 14q32.13], multiple endocrine neoplasia type 2 [MEN2] syndrome [RET, 10q11.2] 등) 환자의 가족 구성원에 대해서는 유전상담을 시행하고, 유전자검사 결과에 따른 초음파검사와 적절한 치료가 필요하다.", "1.2. 그레이브스병과 하시모토갑상선염 환자에서 갑상선암 선별검사의 역할", "그레이브스병에서 갑상선암의 유병률은 2.6-15%로 보 고된다. 7개의 후향적 연구, 2582명의 그레이브스병 환자를 포함한 메타분석에서는 그레이브스병에서의 갑상선암 유병률을 11.5%로 보고하였다. 한 개 이상의 갑상선결절을 갖고 있는 그레이브스병 환자의 갑상선암 유병률이 22.2%인데 반해, 갑상선결절이 없던 환자의 갑상선암 유병률이 5.1%로, 그레이브스병 환자에서 한 개 이상의 결절을 갖고 있는 경우가 없는 경우에 비해 암 발생 위험도가 5.3배 높음을 보고하였다.", "그레이브스병에서 동반된 갑상선암의 예후와 관련된 메타연구에서는 12개의 연구, 3083명의 환자를 분석하여 그레이브스병 환자가 대조군과 비교해 재발 등 분화 갑상선암의 예후에 차이가 없었다. 세부 분석을 살펴보면, 연구가 진행된 지역별로 예후가 상이하게 보고되어, 유럽에서는 그레이브스병 환자의 갑상선암의 재발, 진행과 관련된 예후가 다소 불량(위험도 1.77배)한 데 반해, 아시아에서는 오히려 예후가 더 좋았다(위험도 0.43배). 이는 연구 형태, 인종적 차이, 의료환경 등 다양한 요소가 결과에 영향을 미쳤을 가능성을 시사하는 것으로, 해석에 주의가 필요하다.", "이상의 근거들로 볼 때, 그레이브스병 환자에서 갑상선결절이 있을 때 갑상선암의 위험이 4-5배 높으나, 그레이브스병 환자에서 발생한 갑상선암의 예후가 더 불량하다는 증거는 없으므로 일률적으로 초음파검사를 권고할 근거는 부족하며, 결절성 혹은 크기가 큰 갑상선종, 비대칭적인 갑상선종 등의 임상 상황에 따라 초음파검사를 고려할 수 있다. 특히, 갑상선기능항진증에 대한 방사성요오드 또는 수술적 치료를 시행하기 전에 초음파를 시행하여야 한다 .", "한편, 하시모토갑상선염에서 갑상선암 유병률은 대조군에 비해 높은 것으로 알려져 있다. 하시모토갑상선염 환자의 갑상선암 유병률은 대조군에 비하여 7개의 환자-대조군 연구의 메타분석에서는 1.8배, 9개의 코호트 연구의 메타분석에서는 1.5배 높았다. 반면, 하시모토갑상선염에서 발생한 갑상선유두암의 예후는 대조군에 비교하여 우수하여, 71개 연구의 44,034명 환자의 메타분석 결과, 대조군에 비해 림프절전이(위험도 0.82배), 원격전 이(위험도 0.49배), 재발률(상대위험도 0.50배) 등 낮게 보고되었다. 또 다른 최근 메타분석에서도 원격전이 (위험도 0.44배), 재발률(위험도 0.63배), 20년 암특이 생존율(위험도 1.39)에 있어 하시모토갑상선염 환자에서의 갑상선암 예후가 대조군에 비해 더 우월하였다. 현재까지의 연구결과들로 볼 때 하시모토갑상선염 환자에서 갑상선암 발생 위험은 1.5-1.8배 높으나 예후가 불량한 것은 아니므로, 일률적으로 초음파검사를 권고할 근거는 없고, 임상 상황(결절이 의심되거나 비대칭적 갑상선 종대가 관찰되는 경우 등)에 따라 초음파검사를 고려해야 한다.", "1.3. 부갑상선기능항진증 환자에서 갑상선암 선별검사의 역할", "부갑상선기능항진증 환자에서 갑상선암 동반 비율은 2.1-11.3%로 알려져 있다. 1975-1996년에 수술적 치료를 받았던 부갑상선기능항진증 환자 824명 중에서 일차성, 이차성, 삼차성에 따른 갑상선암의 빈도는 차이가 없이 2.6-3.2%였고, 1974-1999년에 수술한 일차성 부갑상선기능항진증 환자 580명 중에서는 103명이 갑상선질 환이 의심되어 갑상선절제술을 시행 받았고, 그 중 12명 (2.1%, 12/580)에서 갑상선암이 발견되었다. 이에 반하여 2000년도 이후 최근의 보고에서는 그 빈도가 매우 높아, 2014-2017년에 일차성 부갑상선기능항진증으로 수술 받은 275명 중 31명(11.3%)에서 갑상선암이 동반되어 있 었다 . 진단된 갑상선암은 모두 유두암이었고 종양크기 는 유두암만 진단 받은 대조군에 비해 작았으나(0.7 cm vs. 1.5 cm), 갑상선 피막 침범(capsule invasion)과 다발성 종양의 빈도는 의미 있게 높았다.", "MEN2A에서 발생하는 가족성 갑상선암이 아닌 산발 성(sporadic) 부갑상선기능항진증 환자에서 발생한 갑상선암의 예후에 대해서는 문헌이 부족하여 갑상선암의 선별검사에 대한 근거는 없다. 다만, 수술의 적응증이 되는 부갑상선기능항진증검사를 위해 시행한 영상검사에서 갑상선결절이 발견된 경우에는 발견된 결절의 초음파 소견에 근거한 진단 및 치료를 시행한다 .", "1.4. 소아 시기 방사선 치료 과거력이 있는 환자에서 갑상선암 선별검사의 역할", "갑상선을 포함한 경부 방사선 조사력은 갑상선암 발생의 위험 인자이다. 특히, 방사선에 민감한 소아 시기 갑상선부위로의 방사선조사는 갑상선 양성 및 악성 결절 위험을 증가시킨다. 최근 소아암 예후가 향상되어 5년 생존율이 79%에 이르는 만큼 이차암 발생이 소아 암의 장기예후에 있어 중요한 부분을 차지한다. 21개의 연구, 100,818명의 소아암 환자를 포함한 체계적 문헌고찰에 따르면, 연구마다 비교 대상군이나 방사선 조사 선량에 대한 구분이 상이하나, 1개 연구를 제외하고는 모두 갑상선암 위험도의 증가를 보였다. 방사선조사량 (Gy)에 따른 갑상선암 발생 상대위험도(relative risk) 값은 10 Gy까지 점차 증가하다가 10-30 Gy 구간에서 최대 정점(RR 15.2)을 보이고 ＞40 Gy (RR 5.1)에서 감소한다.", "세부 암종별로 살펴보면, 신경모세포종(neuroblastoma)으로 16세 이전 치료받은 544명을 대상으로 한 연구에 따르면, 15년 추적기간 동안 13건의 이차암(갑상선암 5건, 유방암 3건 포함)이 발생하였는데, 방사선 치료는 이차암 발생위험을 4.3배 증가시켰다. 피부 혈관종으로 영유아기 방사선 치료를 받은 3795명 연구에서 평균 35 년의 추적기간 동안 11건의 갑상선암이 진단되었는데, 선량 의존적인 위험도 증가(초과상대위험, excess RR, 14.7 per Gy)를 보였다.", "독일의 소아암 등록자료(German Childhood Cancer Registry) 연구를 보면, 소아암 생존자에서 갑상선암 발생 위험은 목 또는 척추 부위 방사선 조사를 받은 경우 6.6% (1 Gy 당 위험도 1.066배) 증가한 데 반해, 다른 신체 부위에 조사한 경우에는 증가하지 않았다. 갑상선암이 발생한 17명의 소아기 일차암 진단 중위 연령은 5 세(1-14세)였고, 갑상선암 진단 연령은 9.3년이 경과한 15세 (4.0-17.6세) 였다 . 이러한 결과들을 바탕으로 2018년 Childhood Cancer Guideline Harmonization Group에서 발표한 권고안에서는 소아암 생존자가 갑상선부위 포함한 방사선 치료뿐만 아니라 I metaiodobenzylguanidine (MIBG) 치료병력이 있으면 5년 후 갑상선암 선별검사가 권고되며, 1-2년 간격으로 면밀한 촉진 또는 3-5년 간격으로 갑상선 초음파검사 시행을 권고하고 있다."]}, "2.1.A": {"ids": ["2.1.A", "2.1.B", "2.1.C"], "p": ["갑상선결절이 발견되면 갑상선과 주위 경부 림프절에 관심을 둔 면밀한 병력청취 및 신체검사를 시행하여 갑상선암의 고위험군을 감별하여야 한다(Fig. 2.A).", "(1) 갑상선자극호르몬(thyroid stimulating hormone, TSH)과 갑상선스캔", "갑상선결절이 발견되면 혈청 TSH를 포함한 갑상선기능검사를 시행한다. 혈청 TSH 농도가 낮지 않은 경우 갑상선 초음파를 시행한다. 갑상선 초음파 시행의 의미는, 촉진되는 이상 소견이 정말 결절인지 확인할 수 있고, 초음파 소견에 의한 갑상선결절의 암 위험도 분류체계에 따라 결절의 악성 위험도를 예측할 수 있다는 점에있다. 또한 갑상선 초음파를 통해 촉진되는 주 결절 이외에 크기 및 초음파 소견상 병리진단검사가 필요한 결절을 추가로 발견할 수도 있다. 병리진단검사로는 세 침흡인검사(FNA)가 정확하고, 비용 대비 효율이 가장 큰 방법으로 일차적으로 권고된다. CNB는 FNA의 보완적 수단으로서 숙련된 외과의에 의해 선택적으로 고려할 수 있다.", "TSH가 정상보다 낮으면 결절이 자율기능성 결절 혹은 냉결절인지를 알기 위해 갑상선스캔을 시행한다. 자율기능성 결절은 냉결절에 비해 악성의 가능성이 낮 지만 초음파를 시행했다면 초음파 소견에 근거하여 필 요에 따라 병리진단검사를 시행한다. 만일 갑상선중독 증이 있는 경우라면 갑상선중독증의 원인 질환에 대한 추가적인 검사 및 치료가 필요할 수 있다.", "(2) 혈청 갑상선글로불린(thyroglobulin, Tg) 측정", "혈청 갑상선글로불린은 갑상선 여포세포에서 분비되 며 양성이든 악성이든 대부분의 갑상선질환에서 혈청 갑상선글로불린이 증가할 수 있으므로 갑상선암의 진단 에는 민감도와 특이도가 낮다. 최근 한 국내 연구에서 수술 전 혈청 갑상선글로불린 63 ng/mL를 기준으로 갑상선분화암의 초기 원격전이를 예측할 수 있음 (곡면아래면적[area under curve] 0.914, 민감도 84.2%, 특이도 90.6%)을 보고하고 있으나, 이에 대한 추가 연구가 필요하다.", "(3) 혈청 칼시토닌 측정", "갑상선수질암은 C 세포에서 발현되는 신경내분비종 양으로 대부분의 갑상선수질암은 칼시토닌을 분비한다. 갑상선수질암의 10년 생존율은 약 75%로 종양과 림프절전이 병소를 수술적으로 완전하게 절제하는 것이 예후 향상에 매우 중요하기 때문에 조기 발견과 적극적인 치료가 필요하다. 칼시토닌의 이용에 관해서는 몇 개의 전향적인 비무작위 연구들이 있으며 선별검사로 칼시토닌 농도를 측정할 경우 조기에 C세포증식증과 미세갑상선수질암을 진단할 수 있어 전반적인 생존율을 개선시킬 수 있음을 보여주었다. 최근 16개 연구의 결절성 갑상선질환을 가진 72,368명의 혈청 칼시토닌 농도를 분석한 메타분석에 의하면, 갑상선수질암의 유병률은 0.32% 였으며 혈청 칼시토닌 농도 10 pg/mL를 기준으로 갑상선수질암 진단의 민감도 100% (95% 신뢰구간 99.7-100%), 특이도 97.2% (95% 신뢰구간 95.9-98.6%) 였다. 혈청 칼시토닌 농도가 100 pg/mL 이상인 경우 거의모든 환자에서 갑상선수질암이 진단되었기 때문에 갑상선수질암에 대한 적극적인 검사가 필요하고, 반면 10-20 pg/mL에서는 5%에서 갑상선수질암이 진단되었다.", "하지만 혈청 칼시토닌은 C세포증식증을 유발하는 갑상선 염증이나, 만성신부전, 폐질환, 외상, 패혈증과 같은 갑상선질환과 무관한 다양한 상황에서도 상승할 수 있고 갑상선수질암의 유병률이 낮아, 대부분의 권고안에서 갑상선결절이 발견된 환자에서 일률적으로 칼시토닌 측정을 권하지는 않는다. 즉, 갑상선수질암의 낮은 유 병률로 인해 양성예측도(positive predictive value)가 낮으 므로 모든 갑상선결절 환자에서 혈청 칼시토닌 농도를 측정하는 것이 비용 효율적인 측면에서는 효율적이지 않을 수 있다.", "최근 몇몇 연구에서 갑상선결절을 수술하기 전에는 칼시토닌을 측정하는 것이 도움이 될 수 있음을 보고하였는데, 독일의 갑상선/부갑상선 수술 등록 자료를 분석한 연구에서는 29,590 명의 환자에서 수술 전 칼시토닌을 측정하여 357명 (1.2%)의 갑상선수질암을 수술 전에 진단할 수 있었다. 연구 결과, 남성에서는 혈청 칼시토닌 농도가 ＞15 pg/mL 인 경우 갑상선수질암에 대한 민감도와 특이도가 각각 96%와 97%였고, 여성에서는 ＞7.9 pg/mL일 때 95%의 민감도와 98%의 특이도를 보였다. 또 다른 1454명의 갑상선암 환자를 분석한 단일 기관 연구에서는 43명(3%)에서 갑상선수질암이 진단되었는데, 이 중 6명(14%)의 환자는 수술 전 혈청 칼시토닌검사를 통해 갑상선수질암을 발견하였다. 이러한 결과들을 바탕으로 일부 유럽 권고안에서는 갑상선결절의 수술 또는 비수술적절제 치료 전에는 혈청 칼시토닌 측정을 권고하고 있다.", "이상을 고려하였을 때, 모든 갑상선결절의 혈청 칼시토닌 측정에 대한 근거는 충분하지 않으나, 수술 전 또는 비수술적 치료 전에는 혈청 칼시토닌 측정을 고려할 수 있다."]}, "2.2.A": {"ids": ["2.2.A"], "p": ["(1) 초음파 소견을 바탕으로 한 갑상선암 위험도 예측", "갑상선결절의 초음파 소견으로 갑상선암 위험도를 예측할 수 있는데, 여러 연구들에서 제시된 주요 암 의심 소견은 점상 고에코 병소(punctate echogenic foci) 혹은 미세석회화, 비평행 방향성(nonparallel orientation) 혹은 앞뒤가 긴 모양(taller than wide shape), 불규칙적 경계 (침상 혹은 소엽성 경계), 고형(solid), 저에코 소견 등이다. 이 중에서 점상 에코(punctate echogenic foci) 혹은 미세석회화, 불규칙한 경계, 비평행 방향성(nonparallel orientation) 혹은 앞뒤로 긴 모양(taller than wide) 소견은 갑상선암 진단 민감도는 낮으나 특이도가 높은 소견이다. 이러한 갑상선암 의심 초음파 소견은 주로 유두암을 예측하는 소견들이며 여포암에서는 이러한 초음파 소견은 드물다.", "이상의 초음파 소견에 기반하여 2021년 대한갑상선영상의학회에서 개정한 갑상선결절의 암 위험도 분류체계 (K-TIRADS)에서는 갑상선결절을 초음파 유형에 따라서 갑상선암 높은의심(high suspicion), 중간의심(intermediate suspicion), 낮은의심(low suspicion), 양성(benign)으로 분류하였다(Table 2.2.A).", "갑상선결절의 암 위험도는 결절의 초음파 소견들이 결합된 유형에 따라서 결정되는데, 높은의심 결절은 악성 가능성이 높은 결절로 저에코 고형결절에서 암 의심소견이 동반된 경우이며, 중간의심 결절은 악성 가능성이 중간 정도의 결절이며 암 의심 소견이 없는 저에코 고형결절이나 부분 낭성 혹은 등에코/고에코 결절에서 암 의심 소견이 동반된 경우이다. 낮은의심 결절은 악성 가능성이 낮은 결절로 암 의심 소견이 없는 부분 낭성 혹은 등에코/고에코 결절이며, 양성 결절은 악성 가능성이 거의 없는 결절로 해면모양을 동반한 등에코/고에코 의 결절, 낭성 부분 내 혜성꼬리 인공음영(comet-tail artifact)을 보이는 고에코 병소(echogenic foci)를 동반한 부분 낭성 결절, 혹은 순수 낭종이다.", "(2) 갑상선결절의 암 위험도에 따른 병리진단검사 시행 기준", "갑상선결절의 병리진단검사(FNA/CNB) 시행 기준은 일반적으로 결절의 초음파 소견에 따른 암 위험도와 결절의 크기에 의해서 결정된다. 초음파 소견에서 암위험 도가 높은의심인 결절은 크기가 1 cm보다 큰 결절에서, 중간의심 결절은 임상 소견, 초음파 소견, 환자 요인을 고려하여 1 cm보다 크거나 1.5 cm보다 큰 결절에서, 낮은의심 결절은 2 cm보다 큰 결절에서 병리진단검사를 시행한다. 초음파 소견 상 양성 결절은 암 가능성이 거의 없기 때문에 진단 목적의 병리진단검사는 필요하지 않으나 지속적으로 크기가 커져 치료를 계획하는 경우 병리진단검사가 시행될 수 있다(Table 2.2.A).", "1 cm 이하의 결절에서 병리진단검사 시행 기준에 관해서는 아직까지 이견이 많다. 단, 경부 림프절전이 의심, 명백한 주변 구조물로의 갑상선외부침범(기도, 후두, 인두, 되돌이 후두신경, 또는 갑상선 주위 혈관), 확인된 원격전이, 갑상선수질암 의심 등의 불량한 예후 인자를 가진 경우 즉각적 치료가 필요할 수 있기 때문에 결절 크기와 무관하게 가장 의심스러운 결절에서 병리진단검사가 권고된다. 수술이 필요한 고위험 갑상선암 가능성이 있는 기도 혹은 되돌이 후두신경 경로를 따라 갑상선 후내측 피막에 붙어있는 높은의심 결절(＞0.5 cm 및 ≤1 cm)은 병리진단검사가 권고된다. 크기가 작은(＞0.5 cm 및 ≤1 cm) 높은의심 결절의 경우에 적극적 관찰 등 치료 결정을 위해 성인에서 병리진단검사가 고려될 수 있으며, 소아의 경우 높은의심 결절은 크기가 작더라도 (＞0.5 cm 및 ≤1.0 cm) 임상적 소견을 고려하여 병리진단검사가 시행될 수 있다."]}, "2.3.A": {"ids": ["2.3.A"], "p": ["<sup>18<\/sup>F-FDG PET/CT 검사는 암 환자의 병기를 평가하기위해 광범위하게 사용되고 있다. 일반적으로 새로 진단된 갑상선결절이나 갑상선질환 환자에서 <sup>18<\/sup>F–FDG PET/CT 검사가 추천되지는 않으나, 다른 목적으로 시행한 <sup>18<\/sup>F-FDG PET/CT 검사에서 우연히 갑상선의 비정상적인 섭취 증가 소견을 발견할 수 있다. <sup>18<\/sup>F-FDG PET 검사를시행한 환자 중 1-2%에서 갑상선 국소 섭취 소견이, 2% 정도의 환자에서 미만 섭취 소견이 우연히 발견된다. 갑상선에 국소 섭취 소견을 보이는 경우 임상적으로 갑상선결절과 일치하는 경우가 많고, 국소 섭취를 보인 결절은 악성 가능성이 높기 때문에 결절의 특성을 확인하기 위해 초음파검사가 권고되며, 초음파 소견을 고려한 추가적인 임상검사와 병리진단검사가 권고된다.", "5151개 결절에 대한 59개 연구의 메타분석 에서 30.8% (95% 신뢰구간 28.1-33.4%, 최소 10.34-최대 66.67%)의 다양한 암 위험도가 보고되었다. 그런데, 암 위험도는 초음파 소견에 따라 달라서, 2015년 K-TIRADS 구분에 따라 907개의 <sup>18<\/sup>F-FDG PET/CT 검사에서 국소 섭취를 보인결절에서 조직검사에 따른 악성여부를 조사한 국내연구에 따르면, 양성 초음파 소견(K-TIRADS 2)을 보인 4개 중에서는 악성이 없었고, 286개의 낮은의심 초음파 소견 결절에서는 10.2%, 265개 중간의심 초음파 소견 결절에서는 52.1%, 352개 높은의심 초음파 소견 결절에서는 93.5%가 악성으로 나타났다. 1 cm 이상 크기 결절에서는 각각 0%, 7.4%, 41.2%와 92.4%의 빈도였다. 미국 American College of Radiology (ACR)-TIRADS를 기준으로 하여 151개의 국소 섭취 결절을 분석한 연구에서도 TR1 (양성 소견)에서 TR5 (높은의심 소견)까지 각각 0%, 16.7%, 13.2%, 23.7%, 68.1%의 암 위험도를 보고하였다.", "반면 <sup>18<\/sup>F-FDG PET/CT 검사에서 미만 섭취를 보이는경우에는 대부분 하시모토갑상선염 등의 미만성 갑상선 질환이 있는 경우가 많아 갑상선 기능검사가 필요하며, 결절 유무를 확인하기 위해 갑상선 초음파검사가 필요할 수 있다. 임상 소견과 초음파검사 소견이 미만성 갑상 선질환에 합당한 경우에는 추가적인 영상검사나 병리진단검사는 거의 필요하지 않으나, 전형적 미만성 갑상선 질환이 아닌 경우에는 임상상황을 고려하여 다른 악성 종양의 갑상선 전이나 림프종 등의 질환을 감별하기 위해 병리진단검사가 필요할 수 있다."]}, "3.1.A": {"ids": ["3.1.A", "3.1.B", "3.1.C", "3.1.D"], "p": ["갑상선암의 병리진단검사 방법으로는 FNA와 CNB가 있으며, 병리진단에 보조적으로 분자표지자검사가 시행될 수 있다. FNA는 갑상선결절을 진단하는 데 정확하고, 비용 대비 효율이 가장 큰 방법으로 우선적으로 고려하여야 한다. CNB는 FNA의 보완적 병리진단검사법으 로서 결절의 특성을 고려하여 숙련된 외과의에 의해 선택적으로 시행될 수 있다. 병리진단결과에 보조적으로 암 위험도를 계층화하기 위해, 임상적인 위험 요소, 초음파 소견 및 환자의 선호도 등을 고려하여, 면역화학염색 검사, 단일 유전자변이검사 또는 차세대염기서열을 기반으로 하는 유전자패널검사 등의 분자표지자검사가 고려될 수 있다.", "FNA의 결과는 “The Bethesda System for Reporting Thyroid Cytopathology”에 따라 6개 범주로 보고한다. Bethesda system은 2010년 제1판, 2018년 제2판으로 출 판되었으며, 2023년 제3판 으로 개정되었다.", "Bethesda system (제3판)은 6개의 범주, 즉 1) 비진단적, 2) 양성, 3) AUS, 4) 여포종양, 5) 악성의심, 6) 악성으로 구성되어 있으며, 문헌 검토와 전문가 의견을 통하여 범주별로 암 위험도를 예측하여 제시하고 있다(Table 3.1.A). 소아에서의 암 위험도는 성인과 차이가 있다.", "FNA의 주된 진단명은 항상 일정한 용어를 사용하여 임상적 의미를 명확히 하여야 한다. Bethesda system 제2 판까지는 범주 1, 범주 3, 범주 4에서 2개의 진단 용어가 제시되었으나, 주 진단명에 2개의 용어를 각기 다른 의미를 가진 것으로 사용하는 것은 권장되지 않았다. 따라서 2023년 Bethesda system 제3판은 6개 범주에서 모두 한 가지의 용어만 사용하도록 개정하였다(Table 3.1.A). 범주 1에서 nondiagnostic 혹은 unsatisfactory에서 nondiagnostic만 사용하도록 하였으며, 범주 3에서 AUS 혹은 follicular lesion of undetermined significance (FLUS)의 두 가지 용어 중에서 AUS만 사용하도록 하였다. 마찬가지로 범주 4에서 ‘여포종양’과 ‘여포종양 의심’을 서로 다른 의미로 사용할 수도 있기 때문에 Bethesda system 제3 판에서는 ‘ 여포종양 ’ 한 가지 용어로 통일하였다. 범주 3과 범주 4에서 종양 세포핵의 비정형을 보이는 아형은 세포핵의 비정형을 보이지 않는 아형보다 암 위험도는 2-3배 더 높은 것으로 보고되어, 주 진단명과 더불어 세부 아형을 구분하는 것은 권장된다. 각 의료 기관마다 Bethesda system의 6개 진단 범주의 암 위험도를 독립적으로 평가하여 임상의가 암 위험도를 예측할 수 있게 지 침을 제시하고, 범주 3과 범주 4의 미결정 세포검사 결과의 경우에는 적절한 분자표지자검사를 선택할 수 있도록 도움을 주어야 한다.", "CNB의 병리진단은 FNA와 동일한 6개 범주체계를 따르고 있다. CNB는 FNA의 보완적 수단으로 갑상선결절을 진단하는 유용한 검사이다. CNB 결과는 대한갑상선학회 병리진단 권고안의 진단 범주에 따라 6개의 범주로 진단한다. FNA의 Bethesda system과 동일한 범주 체계로, 1) 비진단적, 2) 양성, 3) 비정형, 4) 여포종양, 5) 악성의심, 6) 악성으로 구성되어 있으며, 문헌 검토에 따라 범주별로 진단 빈도와 암 위험도는 Table 3.1.B와 같다. 병리진단검사를 시행한 갑상선결절은 그 결과에 따라 추적검사 여부 또는 치료를 결정하게 되는데, 병리진단검사의 진단 범주에 따라 권고되는 치료 또는 추적검사는 다음과 같다 (Fig. 3.1.A)."]}, "3.2.A": {"ids": ["3.2.A", "3.2.B", "3.2.C"], "p": ["FNA에서 비진단적 결과는 검체의 적절성(보존이 잘 된 10개 이상의 여포세포로 이루어진 세포 군집이 6개 이상 보여야 함) 기준에 미흡한 경우이다. 예외적으로, 아무리 세포가 적게 나오더라도 뚜렷한 비정형 세포가 보일 때는 비진단적으로 진단하지 않으며, 심한 염증을동반한 고형결절이거나 콜로이드 결절일 경우에는 세포가 적게 나오더라도 양성으로 진단할 수 있다. CNB에서 비진단적 검체의 비율은 FNA보다 낮으나 갑상선외부의 조직만 생검되었거나, 병소 내부가 생검되었다 하더라도 석회화, 섬유화 등의 조직 변화로 인해 종양세 포가 전혀 보이지 않을 경우에 비진단적으로 진단한다.", "초기에 비진단적인 결과로 진단되었더라도 초음파유도하 FNA를 재시행하면(가능하다면 현장에서 세포학적 평가 시행) 검체의 적절성을 상당히 높일 수 있다. FNA를 반복하는 경우에는 이전 생검에 의해 발생하는 반응성 세포학적 변화로 인한 위양성 결과를 방지하기 위해 첫 번째 FNA 시행 후 적어도 3개월 이내에는 시행하지 말아야 한다는 제안이 있었다. 그러나 최근 연구에서는 두 번째 검사 전 대기 기간과 진단율 및 정확도 간 유의한 연관성이 관찰되지 않는 것으로 보고되고 있어, 비진단적 결과 후 3개월의 대기 기간의 필요성은 불 확실하다. 특히 임상 소견이나 영상 소견에서 악성이 의심된다면 더 짧은 기간 내에 FNA를 시행하는 것이 적절하다. 다만, 비진단적인 결과와 달리 비정형 결과로 인해 FNA를 재검사하는 경우에는 3개월 이상의 대기 기간이 더 적절하다는 연구도 있다.", "FNA를 재시행한 경우 결절의 낭성 부분이 50% 이하이면 진단율이 60-80%에 이른다. 낭성 부분이 많을수록 재검 시에도 비진단적인 결과를 얻을 가능성이 더 높다. FNA에서 비진단적 결과를 보인 결절에서 FNA를 재시행 했을 경우 28.1-40.0%에서 반복하여 비진단적 결과가 나오는 반면, CNB를 시행했을 경우에는 1.1-3.8% 에서만 비진단적 결과를 보여, CNB는 FNA의 비진단적 결과를 낮추는데 도움이 되는 검사법이다. 반복적으로 비진단적 결과를 보이는 경우 초음파 소견이 악성의 가능성을 파악하는 데 도움이 된다. 한 연구에 의하면 2회 비진단적 결과를 보인 결절 중 초음파에서 높은의심 소견(미세석회화, 침상 경계, 앞뒤로 긴 모양 또는 저에코)을 보이는 경우 25%가 악성이었으나, 악성의심 소견이 없는 경우에는 단 4%만 악성이었다.", "FNA에서 비진단적 결과를 보인 결절은 Bethesda system을 기반으로 한 대규모의 연구에서, 소아에서는 11.4% (95% 신뢰구간 8.5-14.2%), 성인에서는 12.2% (95% 신뢰구간 9.3-15.1%)를 차지하였으며, 그 중 소아는 21.0% (95% 신뢰구간 14.2-27.9%)에서, 성인은 13.9% (95% 신뢰구간 11.2-16.7%)에서 수술적 절제를 받았다. 비진단적 결과로 진단된 후 수술로 절제된 검체 중에서 소아는 15.7% (95% 신뢰구간 8.0-23.3%)에서, 성인은 19.1% (95% 신뢰구간 14.2-24.2%)에서 악성으로 판명되었다. 그러므로, 반복적인 병리진단검사에서도 비진단적인 경우, 초음파 소견에서 악성을 시사하는 높은의심 소견이 없는 경우에는 주의 깊은 추적관찰을 할 수 있으나, 초음파 소견상 악성이 강력히 의심되거나, 추적관찰 동안 20% 이상 크기가 증가하거나, 임상적으로 암 위험도를 가진 경우에는 진단을 위해 수술적 절제를 고려한다."]}, "3.3.A": {"ids": ["3.3.A"], "p": ["갑상선 FNA에서 양성으로 진단된 결절의 악성 위험도는 1-3%로 보고되고 있다. 결절의 크기와 FNA의 정확도의 연관성을 조사한 결과, 결절의 크기가 3-4 cm 이상인 경우 악성률이 더 높다는 보고가 있으나, 장기간 추적관찰한 연구에서도 위음성률은 미미하였고, 갑상선암으로 인한 사망은 없었다. 따라서 갑상선결절의 크기가 4 cm보다 크고 양성 세포 결과를 보이는 경우 작은 결절과 다르게 다뤄야 하는지는 아직 명확하지 않다. 그러나, 이와는 상반된 연구 결과도 존재하여, 크기보다는 높은의심 초음파 소견을 보이는 경우에 위음성률이 더 높았다. 그러므로 특히 높은의심 초음파 소견을 보이는 경우에는 이에 대한 고려가 필요하다."]}, "3.4.A": {"ids": ["3.4.A", "3.4.B"], "p": ["진단 범주 3 비정형은 범주 2 양성으로 진단할 수는 없을 정도의 이형성을 보이지만, 범주 4 여포종양, 범주 5 악성의심, 혹은 범주 6 악성으로 진단하기에는 불완전한 세포의 구조적 혹은 핵 모양의 이형성을 보일 때 진단된다. CNB는 FNA의 Bethesda system 진단 체계를 따르고 있으나 조직병리학적 진단 용어를 채택함에 따라 범주 3에서 미결정병소(indeterminate lesion) 사용을 권장하였다. 그러나, 각 기관별 상황에 따라 AUS 혹은 FLUS 용어도 사용되고 있다.", "FNA에서 Bethesda system에서 초기에 비정형 진단을 7% 이내의 제한된 범위에서 사용하도록 권장하였고 이후 많은 기관들이 이 기준을 충족하였다. 제2판과 제3판 에서는 실제 임상 현장을 고려하여 10% 이내로 진단하 도록 권장하고 있다. 최근까지 보고된 논문에 의하면, 전체 갑상선 FNA 검체 중에서 소아는 10.5% (95% 신뢰구간 7.0-13.5%)에서, 성인은 8.0% (95% 신뢰구간 6.1-9.9%)에서 비정형으로 진단되었다. 비정형 결절을 수술로 절제하는 시행하는 비율은 소아에서 62.6% (95% 신뢰구간 50.3-74.9%), 성인에서 36.2% (95% 신뢰구간 29.9-42.5%)로 소아에서 더 높다. 수술 후 악성으로 판명되는 비율은 소아에서 37.0% (95% 신뢰구간 24.0-50.0%), 성인에서 30.5% (95% 신뢰구간 24.2-37.0%)였다.", "비정형 세포 결과를 보이는 경우, 경험이 많은 병리과 전문의에게 슬라이드의 재판독을 의뢰해 볼 수 있다. 실제 이러한 방법을 통하여 많은 예가 양성 또는 비진단적인 범주로 재분류되면서, 전체적인 진단의 정확도가 상 승되는 것으로 알려져 있다. 비정형으로 나온 결절에 대해서 FNA를 다시 시행하는 경우 대부분 진단적인 결과를 얻을 수 있지만, 10-30%는 다시 비정형으로 진단된다. FNA에서 비정형으로 진단된 경우 CNB를 시행함으로써 반복적 비정형으로의 진단 비율을 줄일 수 있다.", "비정형 결과를 보이는 결절의 암 위험도를 계층화하기 위해 분자표지자검사가 이용될 수 있다. 비정형 결과를 보이는 경우 BRAF<sup>V600E<\/sup> 돌연변이 단독 검사는 갑상선유두암 진단에 대한 특이도가 높으나, 이의 암 진단에 대한 민감도와 특이도는 유두암의 유병률에 따라 영향을 많이 받는다. 즉, BRAF<sup>V600E<\/sup> 돌연변이 빈도가 낮은 비정형에 속하는 결절에서 시행할 경우 악성에 대한 진단 민감도가 낮아서, BRAF<sup>V600E<\/sup> 돌연변이 유병률이 낮은 지역에서는 BRAF<sup>V600E<\/sup> 돌연변이 단독 검사의 진단 민감도가 낮으나, BRAF<sup>V600E<\/sup> 돌연변이 빈도가 높은 아시아에서는 이의 검사만으로도 암 위험도가 33.4-56.5%에서 71.1-87.9%로 높아짐이 보고되었다.", "한편 차세대염기서열을 기반으로 하는 유전자패널검사는 다수의 유전자변이와 발현 정도를 동시에 분석함 으로써 비정형 혹은 여포종양 결과를 보이는 결절의 진단 정확도를 높일 수 있다. 유전자패널검사법을 비정형 혹은 여포종양 결절 대상으로 시행하였을 경우 악성 진단에 대한 성적은 민감도 74-94%, 특이도 68-85%, 음성예측도 92-97%, 양성예측도 43-74%를 보였다. 최근의 체계적 문헌고찰에서 비정형 결절을 대상으로 한 유전자패널검사의 암 위험도는 검사를 시행하지 않은 경우 17.0-26.0%와 비교하여 27.1-43.0%로 상승함을 보고하였으며, 2개 이상의 유전자변이 등의 나쁜 예후와 연관된 유전자변이가 발견되거나 고위험의 유전자발현 양 상이 발견되면 적극적인 치료 결정에 도움을 줄 수 있다.", "비정형으로 진단된 결절에서 초음파 소견은 결절의 암 위험도를 예측하는 데 도움이 되며, 높은의심 초음파 소견을 갖는 결절에서 암 위험도가 높다.", "그러므로, 비정형으로 진단된 경우, 임상 또는 초음파 소견에서 의심되는 소견과 환자의 선호도 및 실행 가능성 등을 고려하여 초음파 추적관찰을 하거나 진단적 수술을 결정하기 전에 암 위험도 평가에 도움을 얻기 위해 반복적인 FNA, CNB, 또는 분자표지자검사를 시행해 볼 수 있다. 추가 검사가 시행되지 않았거나 검사 후에도 결론에 이르지 못했을 경우, 임상적인 위험 인자, 초음파 소견, 분자표지자검사 결과, 환자의 선호도에 따라 초음파 추적관찰 또는 진단적 수술을 고려한다."]}, "3.5.A": {"ids": ["3.5.A", "3.5.B"], "p": ["Bethesda system에서 여포종양은 세포밀도가 높은 검체로 1) 여포세포가 유두암의 핵의 특징 없이 세포 군집 또는 소포 형태의 구조적인 변화를 보이는 경우, 2) 소포 형태의 세포 군집이 유두암 핵의 특징을 보이는 경우, 또는 3) 거의 대부분 호산성세포(oncocytic 또는 H ű rthle cell)로만 구성된 경우에 적용된다.", "2016년 non-invasive follicular thyroid neoplasm with papillary-like nuclear features (NIFTP) 진단명이 도입된 이후 유두암 세포핵의 특징을 보일지라도 소포 형태의 구조적인 변화를 보이고 유두 구조는 보이지 않는 경우에는 대부분 여포종양으로 진단된다. FNA에서 범주 4 여포종양으로 진단되는 비율은 소아에서 6.1% (95% 신뢰구간 4.2-8.0%), 성인에서 6.1% (95% 신뢰구간 4.5-7.7%)이다. CNB의 여포종양 진단 비율은 8-18%로 FNA 보다 더 높다.", "FNA로 진단된 여포종양에서 수술 비율은 소아에서 84.3% (95% 신뢰구간 75.2-93.4%), 성인에서 60.5% (95% 신뢰구간 54.5-66.5%)로 소아에서 더 높다. 수술 후 악성 비율은 소아에서 41.4% (95% 신뢰구간 27.0-55.9%), 성인에서 28.9% (95% 신뢰구간 26.2-31.6%) 였다. 국내 환자를 대상으로 시행된 연구에 따르면, CNB에서 여포종양으로 진단된 결절에서 수술 후 NIFTP 혹은 악성으로 판명되는 비율은 53-58%였다.", "14개의 관찰연구, 2016개의 여포종양으로 진단된 종양을 포함한 종합된 근거 합성 결과에 따르면, 크기에 따라서는 여포종양으로 진단된 종양 크기가 4 cm 이상인 경우, 4 cm 미만인 종양에 비해 암 위험도 2.29배(95% 신뢰구간 1.68-3.11)로, 4 cm 이상인 종양에서 암 위험도가 높았다. 종양의 크기가 3 cm 이상인 경우에는 3 cm 미만인 종양에 비해 암 위험도 2.39배(95% 신뢰구간 1.45-3.95)로, 3 cm 이상인 종양에서 암 위험도가 높았다. 종양 크기가 2 cm 이상인 경우가 2 cm 미만인 종양에 비해 암 위험도 1.63배(95% 신뢰구간 1.13-2.35)로, 2 cm 이상인 종양에서 암 위험도가 높았다. 즉, 병리진단검사에서 여포종양으로 진단된 종양에서 종양 크기가 2 cm, 3 cm, 4 cm 이상인 경우가 기준 크기 미만인 경우에 비해 암 위험도가 각각 1.63배, 2.39배, 2.29배로 증가하였다. 크기 기준에 따른 악성 진단 빈도를 보면 4 cm 이상인 경우 악성 진단 빈도는 360건 중 137건(38.1%), 4 cm 미만인 경우에는 905건 중 207건 (22.9%)이고, 3 cm 이상인 경우에는 138건 중 41건 (29.7%), 3 cm 미만인 경우에는 280건 중 49건(17.5%), 2 cm 이상인 경우에는 301건 중 106건(35.2%), 2 cm 미만인 경우에는 342건 중 84건(24.5%)으로, 기준 크기 미만 이라도 상당한 비율(18-25%)에서 악성으로 진단되었다.", "여포종양에서 진단되는 악성 종양의 상당수가 갑상선여포암 또는 NIFTP이기 때문에 수술적 절제를 통해서만 정확한 진단이 가능하며, 미국과 유럽의 갑상선결절 권고안에서도 세침흡인검사에서 여포종양으로 진단된 경우 수술적 절제를 우선적으로 권고하고 있다. 다만 여포종양에서 62-70%의 빈도로 불필요한 수술이 발생하므로 수술 후 양성 결과가 나올 수 있음과 수술 후 발생할 수 있는 합병증에 대해 수술 전 환자에게 충분히 설명하고, 임상 상황, 초음파 소견 등을 고려하여 수술을 결정해야 한다.", "그러나, 임상적인 소견과 초음파 소견을 고려한 임상적인 의사 결정과 환자의 선호도 및 실행 가능성에 따라 초음파 추적관찰 또는 수술 결정을 위한 암 위험도 평가를 위해 분자표지자검사를 이용해 볼 수 있다. 차세대염기서열기반 유전자패널검사는 아직까지는 주로 서구에 서 많이 사용하고 있다.", "차세대염기서열 기반 유전자패널검사법이 단일 유전자검사법보다 양성진단율 (rate of positive test)은 유의하게 높지만 (40.3-63.4% vs. 2.2-12.2%), 양성 결절에서도 유전자변이가 발견되므로 단일 유전자변이만 발견되었을때에는 악성여부가 결론적이지 않고 유전자변이가 발견된 경우의 암 위험도도 단일 유전자검사법보다 낮은 경향을 보인다(24.2-39.2% vs. 21.2-63.0%). 그러므로, 분자표지자검사도 여포종양의 악성 여부를 결정하는 데는 결론적이지 않다. 다만, 단일 유전자변이가 발견되었을 경우에는, 환자의 임상상황, 초음파 소견, 환자의 선호도와 함께 해당 유전자변이의 암 위험도와 이와 연관된 갑상선암의 진행 위험도 또는 예후연관성을 고려하여 수술 시행 여부 또는 수술 범주를 결정할 수 있다. 분자표지자검사도 결론적이지 않다면, 초음파 소견, 임상상황 등과 함께 암 위험도를 종합적으로 평가한 후 수술 또는 추적관찰을 결정하여야 한다."]}, "3.6.A": {"ids": ["3.6.A", "3.6.B"], "p": ["악성의심은 악성이 강력히 의심되지만(주로 갑상선유두암) 악성으로 확진하기에는 병리학적 소견이 부족할 때 진단하며, 이 경우 암 위험도는 50-75% 정도이다. 이 범주는 전체 갑상선결절에 대한 FNA의 1-6%를 차지하며, 수술 후 암 위험도는 소아에서 90.5% (95% 신뢰구간 85.0-95.9%), 성인에서 79.6% (95% 신뢰구간 75.2-83.9%)로 보고되었다. 이와 같이 유두암의심 진단은 암 위험도가 높기 때문에 수술적 절제의 적응증이 된다.", "이 때 수술 전 분자표지자검사 결과가 암 위험도를 보다 정확하게 예측하고 수술적 절제에 관한 의사 결정을 바꿀 수 있다면 단일 또는 차세대염기서열 기반 유전자 패널 분자표지자검사를 고려해 볼 수 있다. 특히, TERT 프로모터 돌연변이와 BRAF<sup>V600E<\/sup> 돌연변이가 함께 동반된 경우, BRAF<sup>V600E<\/sup> 돌연변이만 있는 경우에 비해 TMN 병기가 높고(4.2배), 원격전이(11.7배), 재발률(4.3배) 및 사망률 (15배)이 높은 것으로 알려져 있다. 이를 포함하여 두 개 이상의 돌연변이나 불량한 예후를 예측하는 돌연변이가 발견된다면 적극적으로 수술적 치료를고려해야 한다. 다만 분자표지자검사의 임상적인 유용성에 대해서는 비용-효과 등을 고려한 추가 연구가 필요하다.", "정리하면, 병리진단검사에서 악성의심인 경우, 악성으로 진단된 경우와 유사하게 임상적인 위험 요소, 초음파 소견, 환자의 선호도를 고려하여 수술적 절제를 시행하며, 유전자변이검사 결과에 따라 수술적 절제에 대한 의사 결정이 바뀔 수 있을 경우에는 분자표지자검사를 고려해 볼 수 있다.", "수질암이나 림프종과 같이 드문 암이 의심될 경우 CNB를 시행하여 면역조직화학염색 혹은 분자표지자검사를 시행하면 진단 정확도를 높일 수 있다."]}, "3.7.A": {"ids": ["3.7.A", "3.7.B"], "p": ["갑상선암의 치료에서 수술은 병소의 완전한 절제를 통해 완치를 기대할 수 있는 일차 치료로서 중요한 역할을 한다. 그러므로, 병리진단 결과 악성인 경우 일반적으로 수술적 치료를 하게 된다. 병리진단검사 후 수술을 결정한 경우 종양의 크기와 병리진단검사 결과, 영상검사를 포함한 임상상을 종합적으로 고려하여 수술 범주를 결정한다(대한갑상선학회 갑상선분화암 진료권고안 2024의 ‘I.2.2. 병리진단검사에 암으로 진단된 경우의 수술’ 참조).", "그러나, 갑상선유두암의 양호한 예후를 근거로 하여, 병리진단검사로 악성의심 또는 악성(Bethesda 범주 5 또는 6)으로 진단된 저위험군 갑상선유두암에 대한 적극적 관찰이 도입되었다. 적극적 관찰을 결정하기 위해서는 고위험군을 제외하는 적절한 선별과정이 중요하며, 다음과 같은 경우에는 수술을 우선적으로 고려한다.", "가. 임상적으로 림프절전이 또는 원격전이가 의심되는 경우", "나. 임상적으로 종양의 육안적 갑상선외부침범이 있거나 기관(trachea) 또는 되돌이후두신경(recurrent laryngeal nerve, RLN) 침범이 의심 또는 우려되는 경우", "다. 갑상선유두암의 공격적인 조직아형이 관찰되는 경우(긴세포, 원주세포, hobnail 아형 등)", "다음의 경우에는 적극적 관찰(active surveillance)을 고려할 수 있다.", "가. 매우 낮은 위험도를 가진 종양의 경우(임상적으로 전이와 육안적 갑상선외부침범이 없고 세포학적으로 공격적인 조직아형이라는 근거가 없는 미세갑상선유두암 등)", "나. 동반된 다른 질환으로 인해 수술의 위험도가 큰 경우", "다. 남은 여생이 짧을 것으로 예상되는 경우(심한 심혈관계 질환, 다른 악성 종양, 고령인 경우 등)", "라. 갑상선 수술 전에 해결되어야 할 내과적 또는 외과적 질환이 동반된 경우", "적극적 관찰을 진행하는 동안 고해상도 초음파를 포함한 주기적인 추적 과정이 요구되며, 추적 중에 질병 진행이 확인될 때까지 수술을 지연한다. 질병 진행의 정의는 종양의 크기 증가와 림프절전이가 새롭게 발견되는 경우를 기준으로 한다. 종양의 크기 증가는 개별 연구 별로 기준의 차이가 있으나 대부분의 연구에서 1) 종양의 최대 길이가 3 mm 이상 증가하는 경우와 2) 새로운 경부 림프절 혹은 원격전이나 갑상선외부침범 소견이 관찰되는 경우로 정의하였다. 종양의 부피를 기준으로 하여 50% 이상 증가하는 경우를 포함하는 연구들이 있으나, 부피 계산 과정에서 과대평가될 가능성이 있어 기준을 72-100%로 하는 연구도 있고, 2개 이상의 직경이 각 2 mm 이상 증가하는 경우를 기준으로 하기도 하였다. 크기 또는 부피가 커진 경우에는 측정에 따른 오차 등을 고려하여 3-6개월 간격으로 초음파를 시행하여 증가 소견을 확인하는 것이 권고되기도 한다.", "국내 연구를 포함한 1-2 cm 이하의 저위험군 갑상선유두암을 대상으로 평균 19개월에서 7.6년까지 적극적 관찰을 시행한 9개의 연구에서 종양의 길이가 3 mm 이상 증가하는 경우가 2.2-10.8%, 종양의 부피가 50% 이상 증가하는 경우가 16.0-28.8%로 보고되었으며, 새로운 림프절전이는 0-4.5%에서 발생하는 것으로 보고하였 다. 일본에서 미세갑상선유두암으로 진단된 3222 명의 적극적 관찰을 시행한 환자 (평균 7.3년, 1.0-29.3년) 의장기간 추적관찰 결과, 10년과 20년째 종양 크기 증가는 4.7%, 6.6%에서, 새로운 림프절전이는 1.0%, 1.6%에서 관찰되었다. 진단 당시 즉시 수술이 시행된 1327명의 환자의 1.4%에서 잔여 갑상선 재발이 확인되었으며, 10년과 20년째 림프절전이는 0.4%, 0.7%로 적극적 관찰군에 비해 유의하게 낮았지만(p=0.009) 그 차이가 크지 않음을 보고하여, 저위험군 미세갑상선유두암 환자에서 적극적 관찰의 장기간 안전성을 확인하였다.", "2 cm 이하의 저위험군 갑상선유두암 환자를 대상으로 적극적 관찰을 시행한 연구에서 1-2 cm와 1 cm 미만 군 간의 종양 크기 및 부피 변화의 차이는 없었으나, 1 cm 이상의 경우 우선적으로 수술이 권고되었고 수술을 원하지 않은 경우 적극적 관찰군으로 포함되어 있어 1-2 cm 크기의 종양에 대해서는 해석의 제한이 있다. 1 cm 이하의 환자 2705명을 대상으로 한 연구 결과 에서 종양 크기가 9 mm 이상의 경우 종양 진행가능성이 높음이 보고되기도 하여(위험비 1.79, 95% 신뢰구간 1.11-2.86) 1-2 cm의 저위험군 갑상선유두암에서의 적극적 관찰에 대해서는 추가적인 연구가 필요하다.", "질병 진행과 관련된 인자로 연령, 성별, 초음파 소견에 대한 연구결과가 발표되었다. 적극적 관찰기간 동안 종양배가시간(tumor volume doubling time)이 빠른 경우 종양의 크기 증가 및 새로운 림프절전이의 발생이 유의하게 많이 관찰되었다. 국내 전향적 연구에서 적극적 관찰군의 질병 진행과 관련된 인자를 분석한 결과, 젊은 연령(30세 미만), 남성 및 종양의 크기가 6 mm 이상, 기저 TSH 농도 7 mIU/L 이상 및 초음파에서 종양내 혈류 소견이나 미만성 갑상선질환 소견이 보이는 경우 등이 연관 관계를 보여주었다. 1235명의 환자를 대상으로 시행한 일본 연구에서 40세 미만의 젊은 환자에서는 3 mm 이상 종양의 길이가 증가되는 경우가 5.9%로 60세 이상의 2.2%에 비해 높았으며 림프절전이도 젊은 환자에서 5.3%, 60세 이상에서 0.4%로 보고하였다. 따라서 기대수명과 동반질환으로 인한 상대적으로 높은 수술 합병증의 위험도를 고려하였을 때, 고령의 환자에서 적극적 관찰을 시행하는 것을 고려해 볼 수 있겠다. 다만 종양이 진행하는 경우에는 고령의 경우 예후를 결정하는 위험인자이므로 면밀한 추적검사를 통하여 진행을 확인한 후 수술적 치료를 고려하여야 한다.", "갑상선유두암은 여성에서 남성에 비해 3배 높은 빈도를 보이며, 그 중에서도 가임기 여성이 1/3 정도를 차지하기 때문에 적극적 관찰 중 임신에 대한 고려가 필요하다. 임신 중 증가되는 인간 융모막 성선자극호르몬 (human chorionic gonadotropin, hCG)과 에스트로겐이갑상선암의 성장을 자극할 수 있다는 이론적 배경에서 임신 중 갑상선암의 진행에 대한 우려가 있다. 하지만, 임상적으로는 임신 중 진단된 갑상선암 환자의 종양 진행은 뚜렷하지 않았다. 적극적 관찰 중인 50명의 임 산부를 대상으로 추적관찰한 연구에서 종양의 길이 3 mm 이상 증가가 8%에서 관찰되었으며, 림프절전이는 관찰되지 않았다. 종양 크기가 증가한 4명의 환자 중 2명은 출산 후 수술을 시행하였으며 수술 후 재발은 없었다. 나머지 2명에서는 적극적 관찰을 지속하였으며 종양의 크기 증가는 그 이후 관찰되지 않았다. 따라서 추가적인 연구가 필요하지만, 임신을 원하는 미세갑상선유두암 환자에서 적극적 관찰에 대해서는 현재까지는 추천할 수 없다는 근거는 없으며, 적극적 관찰 중 임신을 하게 된 경우 면밀한 추적관찰이 필요하다.", "한편, 치료 범주와 합병증, 그리고 질환의 장기적 예후가 적극적 관찰 중 진행 소견을 보여 수술을 하는 경우(진행 후 수술군)와 즉시 수술하는 경우(즉시 수술군) 간 차이가 있는지가 치료 방침 결정에 중요하다. 일본에서 수술을 받은 699명 환자에서 분석한 연구에서는 즉시 수술군과 진행 후 수술군 간 치료 범주, 합병증 및 수술병리 소견 모두 차이가 없었다. 반면 516명의 수술 후 경과를 분석한 국내 전향적 연구에서 즉시 수술군과 진행 후 수술군 간의 갑상선절제범위와 합병증에는 차이가 없었으나, 림프절전이와 방사성요오드 치료 비율이 진행 후 수술군에서 증가하였다.", "적극적 관찰은 지속적인 추적관찰이 필요하므로, 이에 따른 환자의 삶의 질과 사회경제적 측면에 대한 고려가 필요하다. 국내의 현재 의료환경을 기반으로 분석한 경제성 평가 연구 결과에서는 직접의료비용이 초기에는 즉시 수술군에서 높으나 약 16년 후부터는 적극적 관찰군에서 높은 것으로 보고되었다. 그러나 환자의 삶의 질이나 불안감은 적극적 관찰을 선택한 경우에서 초기 선택 당시뿐만 아니라 추적 경과 중에도 지속적으로 양호한 결과를 보여 주었고, 적극적 관찰 도중 수술을 받은 환자 중에서는 진행되어 수술을 받은 경우가 진행 소견 없이 수술로 변경한 경우보다 높은 삶의 질을 보여주었다. 즉, 치료 방침 자체가 삶의 질에 영향을 미치는 것 보다는 환자의 특성이 삶의 질과 치료법의 선택에 영향을 미침을 시사하고 있다. 결국 저위험군 갑상선암 환자의 치료 방침 결정과 추적관찰에 있어서, 종양의 자연 경과뿐 아니라 치료 방침에 따른 합병증과 예후, 사회의료비용 및 환자의 삶의 질 등이 함께 고려되어 환자의 선호도를 충분히 반영한 환자와 의사의 공유의사결정이 중요하며, 이를 위해서는 이에 대한 임상근거의 창출과 이에 기반한 적정 진료 지침과 프로토콜, 환자 설명서 등의 구축이 필요하다."]}, "3.8.A": {"ids": ["3.8.A"], "p": ["BRAF 유전자검사는 유두암 진단에 대한 특이도가 높다. BRAF<sup>V600E<\/sup> 돌연변이 혹은 BRAF 융합 유전자가 갑상선결절에서 발견될 경우 악성을 의미하기 때문에 갑상선암을 확진하는데 도움을 준다. 다른 유형의 BRAF 유전자변이는 악성뿐만 아니라 양성 종양에도 발견되기 때문에 BRAF 유전자검사 결과 해석에 주의가 요구된다. BRAF<sup>V600E<\/sup> 유전자검사의 암 진단에 대한 민감도와 특이도는 유두암 유병률에 따라 영향을 많이 받으며, BRAF<sup>V600E<\/sup> 돌연변이 빈도가 낮은 비정형 및 여포성 병소혹은 여포종양 결과를 보이는 결절에서 시행할 경우 악성에 대한 진단 민감도가 낮다.", "RAS 유전자는 NRAS, HRAS 및 KRAS를 포함하며, 악성뿐만 아니라 NIFTP 및 양성 종양에서도 유전자변이가 발견될 수 있다. RAS 돌연변이의 악성에 대한 양성예측도는 약 66%로 알려졌다. RAS 돌연변이가 발견된 양성 종양은 악성으로 진행될 가능성이 있기 때문에 수술 전 RAS 돌연변이가 발견된 결절을 대상으로 수술적 절제는 진단 및 치료 목적으로 사용된다.", "TERT 프로모터 돌연변이가 발견된 갑상선암 환자는 대부분 나이가 많고 림프절전이 및 원격전이를 자주 일 으키며 방사성요오드 치료에 내성을 보인다. 특히 BRAF<sup>V600E<\/sup> 혹은 RAS 돌연변이에 동반될 경우 더 나쁜 임상 경과를 보여, 예후 예측 표지자로 사용된다. TERT 프로모터 돌연변이 검사가 갑상선암에 대한 특이도는 매우 높으나 민감도가 낮다. 후향적 연구결과에 따르면 유두암과 여포암에서 평균 유전자변이 발생률은 각각 11%와 15%로 나타났으나, 실제 임상 현장에서 전향적으로 조 사할 경우에는 발생 빈도가 4배 정도 더 낮은 것으로 보고 되었다.", "단일 유전자검사 보다는 다수의 유전자를 포함하여유전자의 아형 및 발현 혹은 후성유전체 아형을 검사할 수 있는 차세대염기서열기반 유전자패널검사법은 진단 정확도가 더 높다. 그러나, 유전자패널검사법의 진단능은 적용한 패널의 종류, 병리진단검사 결과와 각 병리진단검사 결과에 대한 암 위험도 등에 따라 달라질 수 있으며, 체계적 문헌고찰에 의하면 분자표지자검사 시행에 따른 암 위험도는 지역과 검사방법에 따라서도 달라서, 서구에서는 검사를 시행하여도 시행하지 않은 경우와 비교하여 분자표지자검사 시행 후 암 위험도에 차이가 크지 않은 반면(22.7-34.6% vs. 24.4-30.2%), 아시아에서는 차이가 보다 큼(40.1-88.2% vs. 27.5-38.1%)이 보고되어 지역(또는 인종)과 기관을 고려한 적용과 결과의 해석이 필요함을 시사한다.", "분자표지자검사 시행을 결정하기 전에 검사를 시행하게 됨으로써 얻을 수 있는 이익과 검사의 한계점, 검사 결과의 치료 및 임상적인 영향에 대한 불확실성 등에 대한 정보를 환자에게 제공하여야 한다. 이후, 임상적인 위험 요소, 세포검사 결과 및 초음파 소견을 기반으로 한 악성의 가능성과 실행 가능성, 환자의 선호도 등을 고려하여 시행해야 한다."]}, "3.8.B": {"ids": ["3.8.B"], "p": ["초기 연구들을 대상으로 한 메타분석 결과, 세포검사 결과 미결정으로 나온 결절을 대상으로 한 <sup>18<\/sup>F-FDG PET 스캔의 민감도 89%, 특이도 55%, 양성예측도 41%, 음성예측도 93%로 차세대염기서열을 기반으로 한 유전자패널검사와 비슷한 성적을 보였다. 또한 비용 효율 분석에서는 <sup>18<\/sup>F-FDG PET 스캔이 진단 목적의 수술이나유전자패널검사, 단일 유전자검사보다 더 효율적이었다. 그러나 <sup>18<\/sup>F-FDG PET 스캔과 갑상선 초음파검사를 전향적으로 비교한 연구에서는 <sup>18<\/sup>F-FDG PET 스캔을시행하여 얻을 수 있는 추가 이득이 없어, 미국 갑상 선학회는 2015 진료권고안에서 세포검사 결과 미결정 갑상선결절의 평가를 위해 <sup>18<\/sup>F-FDG PET을 일률적으로권고하지는 않음을 발표하였다. 다만, 최근 시행된 무작위 대조군 다기관 연구에서는 세포검사 결과 미결정 갑상선결절 환자에서 <sup>18<\/sup>F-FDG PET/CT를 시행함으로써불필요한 진단적 수술을 40% 감소시킬 수 있었으며 비용 효과적인 면에서도 유리함이 발표되어, 이러한환자에서 <sup>18<\/sup>F-FDG PET/CT의 역할을 새롭게 규명할 필요가 있다."]}, "3.9.A": {"ids": ["3.9.A", "3.9.B", "3.9.C", "3.9.D"], "p": ["다결절성 갑상선종 환자의 암 위험도는 단일 결절 환자와 유사하다. 14개의 후향적 연구를 분석한 메타 연구에서는 다결절성 갑상선종의 암 위험도가 단일 결절 보다 낮은 경향을 보였으며(위험도 0.80, 95% 신뢰구간 0.67-0.96), 요오드 섭취 상태, 성별 등 다양한 요소에 따라 암 위험도는 다소 차이가 있었다. 단일 결절과 마찬가지로 결절들의 특성을 확인하기 위해 갑상선 초음파를 시행한다. 이 때 주결절 혹은 가장 큰 결절에서만 병리진단검사를 시행한다면 갑상선암을 간과할 수 있으므로, 결절의 크기보다는 초음파에서 암 위험도가 높은 결절에서 병리진단검사를 시행하는 것이 진단 효율을 더 높일 수 있다.", "혈청 TSH가 낮은 경우, 다발성결절 중 자율기능성 결절이 있을 수 있으므로 갑상선스캔을 시행해야 한다. 다만, 자율기능성 결절에서도 암 위험이 있다고 일부 보고되고 있으므로 갑상선스캔에서 열결절이라도 초음파 소견에서 보이는 암 위험도에 따라 병리진단검사 시행을 고려해야 한다."]}, "4.1.A": {"ids": ["4.1.A", "4.1.B", "4.1.C", "4.1.D"], "p": ["FNA에서 양성으로 진단된 결절의 암 위험도(위음성률)는 0-3%로 낮지만, 결절의 크기 증가보다 초음파 특징에 근거했을 때 놓쳤던 악성 결절을 진단할 가능성이 높다는 것을 고려하면, 병리진단검사에서 양성인 갑상선결절의 추적관찰은 초음파 소견에 따라 결정되어야 한다. 한 전향적 연구에서는 첫 FNA에서 양성으로 보고된 553개의 결절을 추적한 결과, 높은의심 초음파 소견을 보였던 55개의 결절 중 10개의 결절(18.2%)에서 악성으로 진단되었고, 추적 중 새롭게 높은의심 초음파 소견을 보인 결절 18개에서 2개의 결절(11.1%)에서 악성이 확인되었다. 반면, 추적 중 크기는 증가했으나 높은의심 초음파 소견이 없었던 82개의 결절에서는 2개의 결절 (2.4%)에서 악성이 진단되었고, 크기나 초음파 소견에 변화가 없던 398개의 결절에서는 악성으로 진단된 결절이 없었다. 또한, 첫 FNA에서 양성으로 진단된 1010 개의 결절에 대해 평균 3.8년 뒤 모든 두 번째 FNA를 시행한 다른 후향적 연구에서도, 낮은의심 초음파 소견과 중간의심 초음파 소견을 보였던 결절의 암 빈도는 각각 0.8%, 1.2%였던 데 비해, 높은의심 초음파 소견을 보였던 95개의 결절 중 3개의 결절(3.1%)에서 악성으로 진단되었다. 낮은의심 또는 중간의심 초음파 소견을 보이면서 추적 기간 중 크기가 증가한 결절의 암 빈도는 1.2-1.3%로 낮았으나, 높은의심 초음파 소견을 보이면서 추적 기간 중 크기가 증가했던 결절에서는 암 빈도가 6.4%였다. 이와 같이 FNA에서 양성으로 진단된 높은의심 초음파 소견 결절은 위음성률이 3.1-18.2%로 상대적으로 높기 때문에 추적검사에서 결절 크기가 감소하 지 않은 경우 병리진단검사를 반복 시행하는 것이 권고된다. 한편, 높은의심 초음파 소견이라 하더라도 CNB에서 양성으로 진단된 경우는 위음성률이 낮기 때문에(약 3% 이하), 병리소견, 초음파 소견, 임상소견을 고려하여 반복 병리진단검사 없이 초음파 추적검사를 고려할 수도 있다.", "병리진단검사에서 양성으로 보고된 낮은의심 또는 중간의심 초음파 소견의 결절과 병리진단검사에서 2번 이상 양성으로 보고된 결절은 추적 초음파에서 소견에 변화가 없으면 반복적인 병리진단검사는 필요하지 않다 (Fig. 3.1.A)."]}, "4.2.A": {"ids": ["4.2.A", "4.2.B", "4.2.C"], "p": ["갑상선결절은 Table 2.2.A에 제시한 바와 같이 초음파 소견에서 보이는 암 위험도를 기반으로 병리진단검사를 시행하며, 병리진단검사를 시행하지 않는 결절은 초음파를 통해 크기와 암 위험도의 변화 여부를 추적한다 (Fig. 4.2.A). 초음파 소견에서 양성 결절로 보이거나 FNA에서 양성 결절로 진단된 992 명의 환자를 5 년간 추적한 다기관 연구의 결과에서, 대부분(89%)의 결절에서 크기 변화가 없거나 감소하였고, 11%에서 크기 증가를 보였는데 5년 간 평균 4.9 mm 장경이 증가하였다. 이 연구에 포함된 결절의 초기 장경은 14 mm이고, 79%의 결절이 고형 성분의 결절이고, 21%의 결절이 고형 성 분과 낭성 성분이 혼합된 결절이었다. 또한 대부분(88%)에서 갑상선결절의 수가 증가하지 않았다. 총 1567개의 결절 중 5개(0.3%)의 결절에서 갑상선암이 진단되었는 데, 초기 초음파 소견에서 4 건은 중간의심, 1 건은 높은의심 소견을 보였으나 모두 첫 번째 FNA에서 양성으로 확인되었고, 두 번째 FNA에서 악성이 의심되어 수술을시행, 갑상선암으로 확인되었다. 따라서 초음파에서 발견되었으나 FNA 시행 기준을 충족하지 않는 결절의 초음파 추적관찰 전략은 결절의 초음파 특징에 따라 결정되어야 한다."]}, "5.A": {"ids": ["5.A", "5.B", "5.C", "5.D", "5.E", "5.F", "5.G", "5.H", "5.I"], "p": ["일반적으로 증상이 없는 양성 갑상선결절은 치료가 필요하지 않다. 많은 무작위 연구와 3개의 메타분석 결과에서 얻어진 증거들은 경계범위의 저요오드 섭취지역 의 경우 혈청 TSH 농도를 정상 이하로 억제시키는 갑상선호르몬 치료가 결절의 크기를 약간(5-15%) 줄일 수 있음을 보여주었다. 하지만 요오드 섭취가 충분한 인 구군에서 얻어진 결과는 설득력이 낮으며, TSH치 를 0.1-0.2 mIU/L 미만으로 억제시키는 것은 증상을 유발할뿐 아니라 부정맥과 골다공증의 위험도를 높인다. 이와 같이 크기가 증가하는 갑상선 양성 결절 환자에서 갑상선호르몬 억제 치료의 효과에 대한 증거는 불충분하며, 치료에 어느 정도 반응을 보일 수 있을지라도 억제요법의 잠재적인 위해가 이득을 상회하므로, 양성 갑상선결절에 대한 일률적인 갑상선호르몬 억제 치료는 권고되지 않는다. 경과관찰 중 크기가 증가되어 반복 시행한 세포검사에서도 양성인 경우, 크기가 약간 증가하는 대부분의 무증상 결절은 치료 없이 추적관찰한다.", "반복 시행한 병리진단검사에서 양성으로 진단된 갑상선결절이라 하더라도 1) 갑상선결절에 의한 압박증상이 있거나, 2) 미용적 문제가 있는 경우, 또는 3) 갑상선기능 항진증을 동반하는 자율기능성 갑상선결절인 경우는 치료가 필요할 수 있다. 단, 압박 증상이나 미용적인 문제 는, 발생한 증상이 갑상선결절로 인한 것임을 영상검사에서 확인하여 비특이적인 증상을 감별해야 한다. 양성 갑상선결절의 치료법으로는 비수술적절제 치료(에탄올절제술, 고주파절제술, 레이저절제술), 방사성요오드 치료 및 수술이 있는데, 치료 방법은 임상적 특성, 동반 질환, 치료법에 따른 장단점, 환자의 선호도, 실행 가능성 등을 고려하여 선택할 수 있다.", "크기가 증가하는 4 cm 보다 큰 결절은 기도와 같은 주요 기관에 대한 압박증상이 심하거나 악성 여부에 대한 임상적 우려가 있는 경우 수술적 치료를 고려하여야 한다. 갑상선전절제술 혹은 부분절제술과 같은 수술적치료를 통해 갑상선결절을 제거함으로써 압박 증상을 없앨뿐 아니라, 결절의 악성 여부를 확인할 수 있는 장점이 있다. 그러나 수술은 전신마취와 입원을 해야 할 수 있고, 수술 후 상처, 갑상선기능저하증으로 인한 호르몬 제 복용, 되돌이 후두신경 마비, 부갑상선기능저하증과 같은 부작용이 발생할 수 있다.", "갑상선결절의 비수술적절제 치료는 갑상선결절의 크기를 줄여서 증상 또는 미용상의 문제를 호전시킨다. 고주파절제술은 수술에 비교하여 결절 크기 감소 시간이 오래 걸리며, 크기가 큰 경우 2회 이상의 치료가 필요한 단점을 갖고 있으나, 수술과 비교하여 결절에 의한 증상완화 효과는 비슷하면서 갑상선 혹은 부갑상선 기능저하증을 초래하지 않고, 다른 부작용은 비 슷하거나 적으며, 미용 효과와 삶의 질은 보다 우수하고, 반복 치료가 가능한 장점을 갖는다. 그러므로, 반복적인 병리진단검사에서 양성으로 진단된 갑상선결절이 1) 갑상선결절에 의한 압박 증상이 있는 경우, 2) 갑상선결절로 인한 미용적 문제가 있는 경우, 3) 자율기능성 결절과 같이 치료의 적응증에 해당하는 경우에 비수술적절제 치료를 고려할 수 있다.", "비수술적절제 치료의 대상이 되는 양성 갑상선결절의 정의는 FNA 혹은 CNB 검사에서 2회 이상 양성으로 진단된 경우이다. 양성 초음파 소견(K-TIRADS 2)을 보이는 결절과 자율기능성 갑상선결절의 경우에는 1회의 양성 진단 결과로도 비수술적절제 치료의 대상이 될 수 있고, 순수 낭종인 경우는 병리진단검사에서 비진단적 결과를 보여도 에탄올절제술을 시행할 수 있다. 특히 갑상선결절에 대한 FNA의 진단 민감도가 74% 정도임에 비교하여 CNB의 진단 민감도는 80-91%로 높았다. 여포암의 수술 전 병리진단검사로 FNA를 시행한 경우 16.1-16.7%가 양성(범주 2), 7-12.5%가 비진단적(범주 1) 이었던 반면, CNB에서는 0-4.4%만이 양성이었고 비진단적인 경우는 없었다. 그러므로, 고주파절제 치료결정을 위한 병리진단검사에는 여포성 종양의 진단 민감도가 높은 CNB를 포함하는 것이 권고된다. 2회 이상 병리진단검사에서 양성으로 진단된 갑상선결절에서 위음성을 보이는 경우는 매우 드문 것으로 보고되고있다.", "그러나, 병리진단검사에서 여포종양 혹은 악성의심 진단(범주 4, 5, 6)이 된 결절은 반복적인 병리진단검사에서 2회 이상 양성 결절로 진단되었다고 하더라도 양성 결절로 간주될 수 없으며, 비수술적절제 치료의 대상에서 제외된다. 또한, 비록 2 회 이상 병리진단검사에서 양성으로 진단된 결절에서의 위음성이 매우 드물기는 하지만 이에 대한 우려가 있고, 병리진단결과에 따른 암 위험도가 기관에 따라 다를 수 있다. 그러므로 고주파절제술을 포함한 비수술적절제 치료는 치료 대상 결절이 양성 결절의 병리진단기준을 충족하고 치료 적응증에 해당되어도 고의심 초음파 소견(K-TIRADS 5)을 보이거나 초음파 또는 임상적 소견에서 암 혹은 여포종 양이 의심되는 경우는 치료 대상에서 제외된다.", "치료가 필요한 흉골뒤갑상선종(retrosternal goiter)은 결절이 종격동에 위치하여 초음파로 결절 위치 및 상태를 정확히 평가하기 어렵기 때문에 비수술적절제 치료 대상이 되지 않는다. 또한, 결절 크기가 매우 커서(약 6-7 cm 이상) 비수술적절제 치료로 효과적 치료가 어렵거나 비용대비 효과가 적다고 판단되는 경우는 수술적 치료를 우선적으로 고려해야 하며, 자율기능성 결절의 크기가 크거나 다발성으로 효과적 치료가 어려운 경우에는 방사성요오드 치료 또는 수술을 일차적으로 고려해야한다.", "비수술적절제 치료의 대상 결절 중에서 갑상선 협부에 위치하여 영상검사에서 연관성이 확인된 압박 증상 혹은 미용적 문제가 발생한 결절 혹은 자율기능성 갑상선결절의 경우는 크기가 작아도 치료 대상이 될 수 있다. 그러나 갑상선 양엽에 위치한 결절은 크기가 최소 2 cm 보다 크면서 결절로 인한 압박 증상 혹은 미용적 문제가 발생한 경우에만 치료 대상이 된다.", "비수술적절제 치료 후에 추적검사에서 결절의 크기가 다시 증가하거나 증상을 초래하는 경우, 해당 결절에 대한 추가적인 병리진단검사가 필요하며 반복적인 비수술적절제 치료 혹은 수술이 고려될 수 있다.", "갑상선결절에 비수술적절제 치료로 적용하는 방법은 갑상선결절의 고형 성분의 양에 따라서 각각 다른 치료법이 제안되고 있다. 결절로 인한 압박 증상이나 미용적 문제를 유발하는 양성 낭성 결절(낭종 혹은 낭성 우세 결절)은 단순 흡인 (simple aspiration) 만으로도 일부에서 증상 호전을 기대할 수 있기 때문에 단순 흡인을 우선적으로 시도하고, 흡인 후 재발하는 양성 낭성 결절은 에탄올절제술(ethanol ablation)이 효과적이고 간 편하여 일차적 치료법으로 권고된다. 에탄올절제술 후 치료 효과가 충분치 않거나 드물게 재발하는 낭성 결절의 경우에는 에탄올절제술을 반복 시행하거나 고주파절제술을 고려할 수 있다.", "결절로 인한 압박 증상 혹은 미용적 문제를 초래하는 고형 혹은 고형 우세 갑상선결절의 비수술적절제 치료법으로는 고주파절제술 또는 레이저절제술이 비수술적절제 치료방법 중 우선적으로 권고된다. 에탄올절제술은 고형 혹은 고형 우세 갑상선결절에서 치료 효과가 낮아 권고되지 않는다. 그 이유는 주입한 에탄올이 고형결절 안에서 골고루 잘 퍼지지 않고 바늘이 들어간 자리를 통해서 갑상선 밖으로 누출될 위험이 있고, 누출 된 에탄올은 심한 통증, 주변 신경 손상 등의 부작용을 초래하거나 주변 조직 유착을 일으켜 추후 수술이 필요한 경우 이를 어렵게 할 수 있기 때문이다.", "갑상선기능항진증의 증상을 동반하는 자율기능성 갑상선결절은 방사성요오드 치료 또는 수술이 우선적으로 고려될 수 있다. 방사성요오드 치료 후 2-3년 이내에 60-70%에서 갑상선기능이 정상화되고 장기적으로는 4-75%에서 갑상선기능저하증이 발생할 수 있다. 그러나, 그레이브스병에서와는 다르게 갑상선안병증 위험이 증가하지 않는다. 다만 방사성요오드 치료는 임신 또는 수유 중에는 금기이며, 방사성요오드 섭취율이 낮은 결절의 경우 치료효과가 떨어지기 때문에 이러한 경우에는 방사성요오드 치료를 우선적으로 고려하지 않는다. 수술의 경우에도 10-44%에서 갑상선기능저하가 발생하고, 다른 수술에 따른 합병증도 발생할 수 있다. 그러므로, 방사성요오드 치료나 수술을 거부하거나 동반질환으로 인하여 수술이나 방사성요오드 치료가 어려운 경우에는 고주파절제술을 포함한 비수술적절제 치료를 고려할 수 있다.", "또한, 전독성(pretoxic nodule) 혹은 무증상(subclinical) 결절로서 비교적 작은(10-20 mL 이하) 단일 결절, 특히 젊은 나이에서 갑상선실질에 방사성 섭취가 존재하여 방사성요오드 치료 시 기능저하증의 발생 위험도가 높은 경우에는 비수술적절제 치료가 고려될 수 있다. 최근의 체계적 문헌고찰에 따르면 비수술적절제 치료 후 71.2% (22.7-94.1%)에서 TSH가 정상화되고 있었는데, 361명의 자율기능성 결절을 대상으로 비수술적절제 치료를 시행한 연구에서는 12개월 후 10 mL 미만의 작은 결절은 74%에서, 10-30 mL의 중간 크기 결절은 49%, 30 mL보다 큰 결절에서는 19%가 TSH가 정상화되었다. 그러므로, 전독성 결절이라 하더라도 15-20 mL 이상의 크기에서는 비수술적절제 치료가 우선적인 치료로는 권고되고 있지 않다."]}, "6.A": {"ids": ["6.A", "6.B"], "p": ["임신부에서 발견되는 갑상선결절도 비임신부와 마찬가지로 초음파 소견을 기반으로 암 위험도를 예측하며, 병리진단검사도 안전하게 시행할 수 있다. 임신 기간 중 갑상선결절의 크기가 약간 증가된다는 연구결과도 있으나, 이것이 악성으로 전환되었다는 것을 의미하 지는 않는다. 갑상선스캔이 금기라는 것을 제외하면 임신부에서 결절에 대한 검사법은 비임신부와 같다. 갑상선암에 대한 수술을 임신 중 또는 출산 후에 시행하는 것이 전체적인 예후에 영향을 주지 않기 때문에 환자의 선호를 고려하여 FNA 시점에 대한 상의가 필요하다.", "임신부에서 FNA 결과가 악성으로 나온 경우 수술이 권고된다. 수술을 한다면 유산 등의 위험성을 최소화하기 위해서는 임신 24주 이전 임신 중기에 시행하는 것이 좋다. 그러나 임신 중 발견되었으나 임신 중에 수술을 받지 않은 경우 같은 연령대의 비임신 여성의 갑상선암과 비슷한 예후를 보였으며, 임신 중 수술한 경우와 분만 후 수술을 시행한 경우를 비교하였을 때 재발률 및 생존율의 차이가 없었다. 또 다른 후향적 연구 결과는 갑상선암 진단 후 1년 이내의 치료지연은 환자의 예후에 악영향이 없음을 보여주었다. 국내 연구에서도 임신 직전 또는 임신 초기 갑상선유두암으로 진단 받은 19 명의 임신부를 임신 중 수술하지 않고 추적하였는데, 진단 시 평균 종양 크기는 0.91 cm (사분위수, 0.61-1.11 cm), 평균 9.5개월 뒤 종양 크기는 0.98 cm (사분위수, 0.72-1.12 cm)였으며, trimester별 종 <tr><td>2 양성<sup>h</sup></td><td>1) 등/고에코(iso/hyperechoic)의 해면모양 결절(spongiform nodule)<br>2) 낭성 부분 내에 혜성꼬리 인공음영(comet-tail artifact)을 보이는 고에코 병소(echogenic foci)를 동반한 부분 낭성 결절(partially cystic nodule)<br>3) 순수 낭종(pure cyst)</td><td>&lt;3</td><td>해당하지 않음<sup>i</sup></td></tr>
<tr><td>1 무결절</td><td>–</td><td>–</td><td></td></tr>
</tbody></table></div>
<ol class="fnl small" type="a">
<li>경부 림프절전이 의심, 명백한 주변 구조물로의 갑상선외부침범(기도, 후두, 인두, 되돌이 후두신경, 또는 갑상선 주위 혈관), 확인된 원격전이, 또는 갑상선수질암 의심 등의 불량한 예후 인자를 가진 경우에는 결절의 크기와 무관하게 가장 의심스러운 결절에서 병리진단검사를 시행한다.</li>
<li>FNA는 가장 많이 사용되는 일차적 병리진단검사법이며, CNB는 FNA의 보완적 병리진단검사법으로 숙련된 외과의에 의해 선택적으로 시행될 수 있다.</li>
<li>점상 고에코 병소(punctate echogenic foci) 혹은 미세석회화(microcalcification), 비평행 방향성(nonparallel orientation) 혹은 앞뒤가 긴 모양(taller than wide), 불규칙적 경계(irregular margin: 침상[spiculated] 혹은 소엽성[microlobulated] 경계).</li>
<li>크기가 작은(&gt;0.5 cm 및 ≤1 cm) 높은의심 결절에서 되돌이 후두신경의 경로를 따라 기도 또는 후내측 피막에 부착이 의심되는 경우 수술이 필요한 고위험 갑상선암일 수 있어 병리진단검사가 권고된다. 크기가 작은(&gt;0.5 cm 및 ≤1 cm) 높은의심 결절에서 임상적 고위험 특성이 동반되지 않는 경우 적극적 관찰 등 치료 계획 수립을 위해 성인에서 병리진단검사가 고려될 수 있다. 소아의 경우 임상적인 소견을 고려하여 크기가 작은(&gt;0.5 cm 및 ≤1 cm) 높은의심 결절에서 병리진단검사가 고려되어야 한다.</li>
<li>명확히 구분되는 결절 없이 광범위한 실질내 점상 고에코 병소(parenchymal punctate echogenic foci) 혹은 미세석회화를 보여 미만성 경화 아형(diffuse sclerosing subtype) 유두암이 의심되는 경우와 미만성 침습적 병소(전이나 림프종과 같은 침습적 악성 종양 의심)는 중간의심(K-TIRADS 4) 결절로 간주한다.</li>
<li>초음파 영상에서 후방음향음영으로 인해 결절의 초음파 특성을 확인하기 어려운 완전히 석회화된 형태를 보이는 결절(entirely calcified nodules).</li>
<li>병리진단검사의 결절 크기 기준은 초음파 소견, 결절 위치, 임상적 위험 인자, 환자 특성(연령, 동반질환, 선호도)을 고려하여 1–1.5 cm의 범위 안에서 결정한다.</li>
<li>암 의심 초음파 소견이 동반된 결절도 포함된다.</li>
<li>일반적으로 병리진단검사 대상에 해당하지 않으나, 지속적으로 의미 있게 크기가 커지는 결절 또는 수술적 치료를 계획하는 결절에서 생검이 시행될 수 있으며, 고주파 혹은 에탄올절제술 치료 예정인 결절은 치료 전 병리진단검사를 시행해야 한다.</li>
</ol>`;

nodule:{kind:'출발점', title:'갑상선결절(촉진 혹은 영상 진단)', next:['eval'], body:`

<h4>역학</h4>
<ul><li>고해상도 초음파로 국내 성인의 30–40%, 촉진으로 약 5%에서 발견된다.</li>
<li>임상적 중요성은 일부(2–6%)가 갑상선암이라는 점과, 악성 여부와 무관하게 커지면 압박 증상을 일으킬 수 있다는 점에 있다.</li></ul>

${fnBox('b')}
${tip('권고안 본문 (5장)','자율기능성 갑상선결절은 1회의 양성 진단 결과로도 비수술적절제 치료의 대상이 될 수 있다.')}`},

hypertx:{kind:'치료', title:'기능항진증에 대한 치료', next:[], body:`
${R('5.I',1,'현성의 자율기능성 갑상선결절의 치료는 방사성요오드 치료 또는 수술이 일차적으로 고려된다.')}
${R('5.D',3,'반복 시행한 병리진단검사에서 양성으로 진단된 갑상선결절이라 하더라도 압박증상이 있거나 미용적 문제가 있는 경우, 또는 자율기능성 갑상선결절인 경우는 치료가 필요할 수 있다. 치료법으로는 수술과 방사성요오드 치료 및 비수술적절제 치료(에탄올절제술, 고주파절제술, 레이저절제술)가 있으며, 임상적 특성, 동반 질환, 치료법에 따른 장단점, 환자의 선호도, 실행 가능성 등을 고려하여 시행한다.')}
<h4>치료별 특징</h4>
<ul><li><b>방사성요오드</b>: 2–3년 내 60–70%에서 기능이 정상화되고, 장기적으로 4–75%에서 기능저하증이 발생한다. 그레이브스병과 달리 갑상선안병증 위험은 증가하지 않는다. 임신·수유 중 금기이며, 섭취율이 낮은 결절은 우선 고려하지 않는다.</li>
<li><b>수술</b>: 10–44%에서 기능저하가 발생하고 수술 합병증이 있을 수 있다.</li>
<li><b>비수술적절제(고주파 등)</b>: 방사성요오드나 수술을 거부하거나 시행이 어려운 경우 고려한다. 전독성(pretoxic)·무증상(subclinical)의 비교적 작은(10–20 mL 이하) 단일 결절, 특히 젊은 나이에서 방사성요오드 후 기능저하 위험이 높을 때 고려될 수 있다.</li>
<li>자율기능성 결절 361명 연구에서 절제 후 12개월 TSH 정상화: &lt;10 mL (74%), 10–30 mL (49%), &gt;30 mL (19%). 체계적 문헌고찰에서는 비수술적절제 후 71.2%(22.7–94.1%)에서 TSH가 정상화되었다. 전독성(pretoxic) 결절이라 하더라도 15–20 mL 이상에서는 비수술적절제가 우선 치료로 권고되지 않는다.</li>
<li>크기가 크거나 다발성이어서 효과적 치료가 어려운 자율기능성 결절은 방사성요오드 또는 수술을 일차로 고려한다.</li></ul>`},

tshnormal:{kind:'TSH 분기', title:'TSH 정상 또는 증가', next:['us'], body:`
<p>혈청 TSH가 낮지 않으면 갑상선 초음파를 시행한다. 초음파는 촉진된 이상이 실제 결절인지 확인하고, 초음파 소견으로 악성 위험도를 예측하며, 병리진단이 필요한 다른 결절을 추가로 발견할 수 있게 한다.</p>`},

us:{kind:'검사 단계', title:'진단 초음파', next:['susp','benus'], body:`
${R('2.2.A',1,'갑상선결절이 존재하거나 의심되는 모든 환자에서 경부 림프절 평가를 포함한 갑상선 초음파검사를 권고한다.')}
<p>국내에서는 2021 K-TIRADS(대한갑상선영상의학회)에 따라 암 위험도와 병리진단검사 기준을 적용한다. 암 의심 소견은 특이도는 높으나 민감도는 낮으며, 주로 유두암을 예측하고 여포암에서는 드물다.</p>
<h4>Table 2.2.A 2021 K-TIRADS에 기초한 갑상선결절의 암 위험도 및 병리진단검사 기준<sup>a</sup></h4>
${KTIRADS}
<h4>다결절성 갑상선종</h4>
${R('3.9.A',1,'크기가 1 cm를 초과하는 결절이 2개 이상 있는 다결절성 갑상선종 환자는 단일 결절 환자와 동일하게 평가되어야 하며, 결절마다 독립적으로 악성 위험이 있을 수 있기 때문에 초음파 소견에 근거하여 1개 이상의 결절에서 FNA를 고려할 수 있다.')}
${R('3.9.B',1,'크기가 1 cm를 초과하는 결절이 다수 있는 경우 초음파 소견과 FNA 시행 크기 기준에 따라 악성 가능성이 가장 높은 결절에서 우선적으로 FNA를 시행할 수 있다.')}
${R('3.9.C',3,'초음파 소견에서 악성이 의심되는 결절이 없고, 결절 사이에 정상 조직 없이 초음파 소견이 유사한 융합성 결절들이 다수 관찰된다면 악성의 가능성은 낮으며, 가장 큰 결절(&gt;2 cm)에서 FNA를 시행하거나, FNA 없이 관찰할 수 있다.')}`},

susp:{kind:'초음파 결과', title:'높은/중간/낮은의심 결절', next:['fna'], body:`
<p>K-TIRADS 3–5 결절이다. 병리진단검사 기준은 암 위험도와 크기로 결정한다.</p>
<ul><li>높은의심(K5): &gt;1 cm</li>
<li>중간의심(K4): 임상·초음파·환자 요인을 고려해 &gt;1 cm 또는 &gt;1.5 cm</li>
<li>낮은의심(K3): &gt;2 cm</li></ul>
<h4>1 cm 이하 결절</h4>
<ul><li>병리진단 기준에 이견이 많다. 다만 림프절전이 의심, 명백한 갑상선외부침범, 원격전이, 수질암 의심이 있으면 크기와 무관하게 가장 의심스러운 결절에서 시행한다.</li>
<li>기도 또는 되돌이후두신경 경로를 따라 후내측 피막에 붙은 &gt;0.5–≤1 cm 높은의심 결절은 병리진단을 권고한다.</li>
<li>그 외 &gt;0.5–≤1 cm 높은의심 결절은 적극적 관찰 등 치료 결정을 위해 성인에서 고려할 수 있다. 소아는 임상 소견을 고려하여 크기가 작더라도 시행될 수 있다.</li></ul>
<h4>기준 미달 결절의 추적</h4>
${R('4.2.A',2,'높은의심 초음파 소견: 초기 1-2년 동안은 6-12개월 간격으로 초음파 추적검사를 시행하며, 크기 증가가 없다면 이후 1년 간격으로 추적검사를 시행한다.')}
${R('4.2.B',3,'낮은의심 또는 중간의심 초음파 소견: 1-2년 이상의 간격으로 초음파 추적검사를 고려한다. 단, 1 cm 이하의 낮은의심 초음파 소견은 2-5년 이후에 초음파 추적검사를 고려할 수 있다.')}
${FIG42A}`},

benus:{kind:'초음파 결과', title:'결절이 아니거나 양성 결절 소견', next:['tshnl2','tshup2'], body:`
<ul><li><b>결절이 아님(K-TIRADS 1)</b>: 촉진 이상이 실제 결절이 아닌 경우</li>
<li><b>양성(K-TIRADS 2, 암 위험도 &lt;3%)</b>: 등/고에코(iso/hyperechoic) 해면모양 결절(spongiform nodule), 혜성꼬리 인공음영(comet-tail artifact)을 동반한 부분 낭성 결절(partially cystic nodule), 순수 낭종(pure cyst)</li></ul>
<p>암 가능성이 거의 없어 진단 목적의 병리진단검사는 필요하지 않다. 지속적으로 커져 치료를 계획하는 경우에는 시행할 수 있다.</p>
${R('4.2.C',3,'양성 초음파 소견: 악성 위험을 고려한 추적 초음파검사는 필요하지 않으나, 결절의 크기와 임상 소견에 따라 2-5년 이후에 초음파 추적검사를 고려할 수 있다.')}`},

tshnl2:{kind:'TSH 분기', title:'TSH 정상', next:['fu1'], body:`<p>기능이 정상이고 초음파에서 결절이 아니거나 양성 소견이면 추가 검사 없이 추적관찰한다.</p>`},

fu1:{kind:'관리', title:'추적관찰 (양성 초음파 소견)', next:['benigntx'], body:`
${R('4.2.C',3,'양성 초음파 소견: 악성 위험을 고려한 추적 초음파검사는 필요하지 않으나, 결절의 크기와 임상 소견에 따라 2-5년 이후에 초음파 추적검사를 고려할 수 있다.')}
<ul><li>초음파 양성 또는 FNA 양성 결절 992명을 5년간 추적한 연구에서 89%는 크기 변화가 없거나 감소했고, 11%가 커졌다(5년간 장경 평균 4.9 mm 증가). 결절 수는 88%에서 늘지 않았다.</li>
</ul>
<h4>압박 증상·미용 문제가 생길 때 (5장)</h4>
${R('5.D',3,'반복 시행한 병리진단검사에서 양성으로 진단된 갑상선결절이라 하더라도 압박증상이 있거나 미용적 문제가 있는 경우, 또는 자율기능성 갑상선결절인 경우는 치료가 필요할 수 있다. 치료법으로는 수술과 방사성요오드 치료 및 비수술적절제 치료(에탄올절제술, 고주파절제술, 레이저절제술)가 있으며, 임상적 특성, 동반 질환, 치료법에 따른 장단점, 환자의 선호도, 실행 가능성 등을 고려하여 시행한다.')}
${R('5.E',3,'크기가 증가하는 4 cm 보다 큰 결절은 압박증상이 심하거나 악성 여부에 대한 임상적 우려가 있는 경우에는 수술을 고려한다.')}
${R('5.F',2,'압박 증상이나 미용상의 문제가 있는 정상 기능의 양성 고형 갑상선결절은 비수술적절제 치료 또는 수술을 고려할 수 있다.')}
${R('5.G',2,'양성 고형결절의 비수술적절제 치료법으로는 고주파 혹은 레이저절제술이 권고된다.')}
${R('5.H',1,'재발하는 양성 낭성 결절은 압박 증상이나 미용 상의 문제가 있는 경우 에탄올절제술이 일차적 치료법으로 권고된다.')}
<details class="xp"><summary>치료 전 확인할 사항</summary><div><ul>
<li>증상이 결절에 의한 것인지 영상검사로 확인하여 비특이적 증상을 감별한다.</li>
<li>비수술적절제 대상은 FNA 또는 CNB에서 2회 이상 양성인 결절이다. 초음파 양성(K-TIRADS 2) 결절은 1회 양성으로도 대상이 되고, 순수 낭종은 비진단적 결과여도 에탄올절제술이 가능하다.</li>
<li>고주파 혹은 에탄올절제술 치료 예정 결절은 치료 전 병리진단검사를 시행해야 한다(Table 2.2.A 각주 i). 특히 고주파절제 치료 결정을 위한 병리진단검사에는 여포성 종양의 진단 민감도가 높은 CNB를 포함하는 것이 권고된다.</li>
<li>제외 대상: 범주 4·5·6 진단 이력, 높은의심 초음파 소견(K-TIRADS 5), 암 또는 여포종양 의심, 흉골뒤갑상선종</li>
<li>양엽 결절은 2 cm보다 크면서 압박·미용 문제가 있을 때 대상이 된다. 협부 결절은 연관성이 확인되면 작아도 대상이 될 수 있다.</li></ul></div></details>
<details class="xp"><summary>치료법별 특징</summary><div><ul>
<li><b>낭성 결절</b>: 단순 흡인을 우선 시도하고, 흡인 후 재발하면 에탄올절제술을 시행한다. 효과가 부족하면 에탄올절제술 반복 또는 고주파절제술을 고려한다.</li>
<li><b>고형결절</b>: 고주파 또는 레이저절제술을 우선 권고한다. 에탄올은 고르게 퍼지지 않고 누출 시 통증, 신경 손상, 유착을 일으킬 수 있어 권고되지 않는다.</li>
<li><b>고주파절제술</b>: 크기 감소에 시간이 걸리고 큰 결절은 2회 이상 치료가 필요할 수 있으나, 수술과 증상 완화 효과는 비슷하면서 갑상선·부갑상선 기능저하를 초래하지 않고 미용 효과와 삶의 질이 우수하며 반복 치료가 가능하다.</li>
<li><b>수술</b>: 압박 증상을 없애고 악성 여부를 확인할 수 있으나, 전신마취, 흉터, 기능저하증으로 인한 호르몬제 복용, 되돌이후두신경 마비, 부갑상선기능저하증이 생길 수 있다. 약 6–7 cm 이상으로 매우 큰 결절은 수술을 우선 고려한다.</li>
<li>치료 후 다시 커지거나 증상이 생기면 추가 병리진단검사 후 반복 비수술적절제 또는 수술을 고려한다.</li></ul></div></details>`},

tshup2:{kind:'TSH 분기', title:'TSH 증가', next:['hypotx'], body:`<p>원발성 갑상선기능저하증 상태이다. 결절 평가와 별개로 기능저하증의 진단과 치료를 병행한다.</p>`},

hypotx:{kind:'치료', title:'기능저하증에 대한 치료', next:[], body:`
<p>본 권고안은 기능저하증 치료의 세부를 다루지 않는다. 일반 원칙에 따라 현성 기능저하증은 레보티록신으로 치료하고, 무증상 기능저하증은 TSH 수준, 증상, 연령, 임신 계획 등을 고려해 결정한다.</p>
${R('5.A',1,'양성 갑상선결절에 대한 일률적인 갑상선호르몬 억제 치료는 권고되지 않는다. 치료에 어느 정도 반응을 보일 수 있을지라도 억제요법의 잠재적인 위해가 이득을 상회한다.')}
<p class="small">TSH를 0.1–0.2 mIU/L 미만으로 억제하면 증상을 유발할 뿐 아니라 부정맥과 골다공증 위험이 높아진다. 기능저하증 교정을 위한 대체요법과 결절 축소 목적의 억제요법은 구분한다.</p>`},

fna:{kind:'검사 단계', title:'병리진단검사', next:['b1','b3','b56','b4','b2'], body:`
${fnBox('c')}
${R('3.1.A',1,'세침흡인검사(FNA)는 갑상선결절의 병리 진단에 있어 가장 좋은 검사이다.')}
${R('3.1.B',1,'갑상선결절의 FNA 결과는 Bethesda system에 기술된 진단 범주에 따라 보고한다.')}
${R('3.1.C',2,'갑상선결절의 중심바늘생검(CNB) 결과는 대한갑상선학회 병리진단 권고안의 진단 범주에 따라 보고한다.')}
${R('3.1.D',3,'병리진단 범주에 따라 암 위험도 평가 및 수술적 절제 여부 결정에 도움을 얻기 위해 임상적인 위험 요소, 초음파 소견 및 환자의 선호도 등을 고려하여, 분자표지자검사를 시행할 수 있다.')}

<ul><li>정의: 보존이 잘 된 10개 이상 여포세포로 이루어진 세포 군집이 6개 이상이라는 적절성 기준에 미흡한 경우. 뚜렷한 비정형 세포가 있으면 세포가 적어도 비진단적으로 하지 않는다. <button type="button" class="term" aria-expanded="false" aria-controls="pop-nd">비진단적 결과의 원인</button>
<div class="pop" id="pop-nd" hidden>
<b class="pop-h">비진단적 결과는 왜 생기나</b>
<ul>
<li><b>권고안 (3.2절)</b>: 충분한 여포세포를 얻지 못해 적절성 기준에 미달한 경우이다. 심한 염증을 동반한 고형결절이나 콜로이드 결절은 세포가 적어도 양성으로 진단할 수 있다. 재검 시 낭성 부분이 많을수록 다시 비진단적일 가능성이 높다. CNB는 갑상선 바깥 조직만 채취되었거나, 석회화·섬유화로 종양세포가 보이지 않을 때 비진단적이 된다.</li>
<li><b>결절 특성 (가장 중요)</b>: 낭성 우세가 가장 일관된 예측인자이다(비진단 비율: 낭성 &lt;50% 에서 16% vs 낭성 &gt;50% 에서는 72%). 거친 석회화, 특히 테두리(rim) 석회화(OR 5.7), 깊이 &gt;15 mm(OR 7.1), 결절 내부 혈류 증가, 1 cm 미만의 작은 크기도 비진단적 결과와 관련된 예측인자로 보고되었다.</li>
<li><b>시술 요인</b>: 시술자 경험의 영향은 연구마다 결과가 엇갈린다(경험 부족이 관련 요인이라는 연구와 차이가 없다는 연구가 공존). <button type="button" class="term" aria-expanded="false" aria-controls="pop-needle">바늘 굵기와 흡인 기법</button>도 연관이 보고되었다.

<ul>
<li><b>흡인법(aspiration)</b>: 바늘에 주사기를 연결하고 음압을 걸어 세포를 빨아들인다.</li>
<li><b>비흡인법(capillary/non-aspiration)</b>: 주사기 없이 바늘만 결절 안에서 앞뒤로 움직여, 모세관 현상으로 세포가 바늘 안으로 들어오게 한다. 음압이 없어 혈액이 덜 섞이는 것이 장점이다.</li>

<h5>2. 바늘 굵기</h5>
<ul>
<li>보통 22–25 게이지(G)를 쓴다. 숫자가 클수록 가늘어서 25G가 가장 가늘다.</li>

<li><b>가는 바늘(25G)</b>: 혈액 혼입은 적지만 세포량이 부족할 수 있다.</li>
<li>관행도 지역마다 다르다. 미국은 25G가 표준이고, 아시아는 주로 21–23G를 쓴다.</li>
</ul>
</div></li>
<li><b>검체 처리 요인</b>: 너무 두꺼운 도말, 혈액에 가려진 여포세포, 불량한 고정이나 부적절한 염색</li>
<li><b>대응</b>: 초음파유도하 재시행과 현장 세포학적 평가로 적절성을 높이고, 반복되면 CNB를 고려한다(재검 비진단 비율 FNA 28.1–40.0% vs CNB 1.1–3.8%).</li>

</div></li>

<li>재검 시 낭성 부분이 50% 이하이면 진단율이 60–80%이다.</li>
<li>FNA 재시행 시 28.1–40.0%가 다시 비진단적이지만, CNB는 1.1–3.8%에 그친다.</li>
<li>재검 간격: K-TIRADS 3/4는 12개월 내, K-TIRADS 5는 6개월 내(Fig. 3.1.A).</li></ul>`},

b3:{kind:'병리 결과', title:'비정형 (Bethesda III, AUS)', next:['repeat'], body:`
${R('3.4.A',3,'병리진단 범주 3 비정형(atypia of undetermined significance, AUS) 결과를 보이는 결절의 경우, 임상적인 위험 인자, 초음파 소견, 환자의 선호도와 실행 가능성을 고려하여, 초음파 추적경과 관찰을 하거나 진단적 수술 결정을 위한 암 위험도 평가에 도움을 얻기 위해 반복적인 FNA, CNB, 또는 분자표지자검사를 시행해 볼 수 있다.')}
<ul><li>성인 FNA의 8.0%가 비정형으로 진단되며, 수술 시 악성 비율은 성인 30.5%, 소아 37.0%였다.</li>
<li>경험 많은 병리과 전문의의 슬라이드 재판독으로 많은 예가 양성 또는 비진단적으로 재분류된다.</li>
<li>FNA를 반복하면 대부분 진단적 결과를 얻지만 10–30%는 다시 비정형이다. CNB는 반복 비정형 비율을 줄일 수 있다.</li>
<li>BRAF<sup>V600E</sup> 단독 검사: 빈도가 높은 아시아에서는 이 검사만으로 암 위험도가 33.4–56.5%에서 71.1–87.9%로 높아진다.</li>
<li><button type="button" class="term" aria-expanded="false" aria-controls="pop-ngs-b3">NGS 패널</button>(비정형·여포종양 대상): 민감도 74–94%, 특이도 68–85%, 음성예측도 92–97%, 양성예측도 43–74%
<div class="pop" id="pop-ngs-b3" hidden>
<b class="pop-h">NGS 패널: 여포종양에서의 의의와 한계</b>
<ul>
<li><b>무엇을 보나</b>: 여러 유전자의 점 돌연변이(BRAF<sup>V600E</sup> 포함, RAS, TERT, TP53, EIF1AX, DICER1 등)와 융합 유전자(RET, NTRK, ALK, PAX8-PPARG, BRAF 융합 등)를 한 번에 분석한다. 패널에 따라 유전자 발현과 복제수 변화까지 본다.</li>
<li><b>확진(rule-in)으로는 약하다</b>: 여포종양의 주요 변이(RAS, EIF1AX, PAX8-PPARG, DICER1)는 여포선종에서도 비슷한 빈도로 발견된다. 권고안도 분자표지자검사는 여포종양의 악성 여부를 결정하는 데 결론적이지 않다고 명시한다.</li>
<li><b>의의 ① 배제(rule-out)</b>: 의미 있는 변이가 없으면 악성 가능성이 낮아(음성예측도 92–97%) 수술 대신 추적관찰의 근거가 된다. 단, 이 수치는 발현·복제수까지 분석하는 패널의 성적이며 기관의 악성 유병률에 따라 달라진다.</li>
<li><b>의의 ② 고위험 변이 식별</b>: TERT 프로모터, TP53, 2개 이상의 변이가 확인되면 적극적 수술이나 수술 범위 결정에 참고한다.</li>
<li><b>의의 ③ RAS 양성</b>: 양성 종양이라도 진행 가능성이 있어 관찰보다 진단·치료 목적의 수술 쪽으로 판단을 기울이는 정보가 된다.</li>
<li><b>국내 상황</b>: 국내 갑상선암에서 BRAF<sup>V600E</sup>는 고전형 유두암에 많고(약 71%), 여포선종·여포암은 RAS가 주된 변이(약 30–38%)이며 BRAF<sup>V600E</sup>는 거의 없다(0–4%). TERT 프로모터 변이는 유두암에서 다른 나라보다 낮지만(2.8% vs 10%), 여포암에서는 비슷하다(18.4% vs 17%). 특히 광범위 침윤 여포암에서 높다. 수술 전 생검 검체의 진단 목적 NGS 검사는 국내에서 허용되지 않았고, 권고안도 NGS 패널은 주로 서구에서 사용된다고 기술한다. 비용-효과에 대해서는 추가 연구가 필요하다.</li>
</ul>
<p class="pop-src">출처: KTA 갑상선결절 진료권고안 2024 3.5·3.8절; Song YS, Park YJ. Endocrinol Metab 2019;34:1-10; Yang H, et al. Endocrinol Metab 2022;37:652-63; Jung CK. J Pathol Transl Med 2023</p>
</div></li>
<li>높은의심 초음파 소견이 있으면 암 위험도가 높다. 재검 간격은 K3/4 12개월 내, K5 6개월 내(Fig. 3.1.A).</li></ul>
<details class="xp"><summary>비정형(AUS)의 정의</summary><div><ul>
<li>범주 2(양성)로 진단할 수 없을 정도의 이형성을 보이지만, 범주 4·5·6으로 진단하기에는 불완전한 세포의 구조적 또는 핵 모양의 이형성을 보일 때 진단한다.</li>
<li>CNB에서는 범주 3에 미결정병소(indeterminate lesion)를 쓰도록 권장한다. Bethesda는 비정형 진단을 전체 FNA의 10% 이내로 권장한다.</li>
<li>핵 비정형 아형은 그렇지 않은 아형보다 암 위험도가 2–3배 높다.</li>
<li>비정형 결과로 재검할 때는 3개월 이상 대기가 더 적절하다는 연구가 있다.</li></ul></div></details>
<details class="xp"><summary>FDG PET/CT는 일률적으로 권고하지 않음 (3.8.B)</summary><div>
${R('3.8.B',3,'FNA 검사 결과 미결정 갑상선결절의 평가를 위해 일률적인 <sup>18</sup>F-FDG PET/CT 검사를 권고하지 않는다.')}
<ul><li>미결정 결절 대상 메타분석: 민감도 89%, 특이도 55%, 양성예측도 41%, 음성예측도 93%. 초음파와 비교한 전향적 연구에서는 추가 이득이 없었다.</li>
<li>최근 무작위 대조 다기관 연구에서는 불필요한 진단적 수술을 40% 줄였다.</li></ul></div></details>`},

<h4>분자표지자검사의 해석</h4>
<ul><li><b>BRAF<sup>V600E</sup> 또는 BRAF 융합</b>: 발견되면 악성을 의미한다. 다른 BRAF 변이는 양성 종양에서도 발견된다. 비정형·여포종양 범주에서는 민감도가 낮다.</li>
<li><b>RAS</b>: 악성, NIFTP, 양성 종양 모두에서 발견되며 악성 양성예측도는 약 66%이다. 진단·치료 목적의 수술 대상이 된다.</li>
<li><b>TERT 프로모터</b>: 고령, 림프절·원격전이, 방사성요오드 내성과 관련된다. BRAF<sup>V600E</sup> 또는 RAS와 동반 시 예후가 더 나쁘다. 특이도는 매우 높으나 민감도가 낮다.</li>
<li>분자검사 후 암 위험도 변화는 서구(22.7–34.6% vs 24.4–30.2%)보다 아시아(40.1–88.2% vs 27.5–38.1%)에서 크다.</li>
<li>시행 전 이익, 한계, 결과의 불확실성을 환자에게 설명한다.</li></ul>
