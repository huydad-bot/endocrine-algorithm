<h4>적용 대상</h4>
<ul><li>첫 FNA에서 비정형(Bethesda III)이었고, 반복 FNA 또는 CNB에서도 결론에 이르지 못한 결절</li>
<li>분자표지자검사를 시행하지 않았거나, 시행했으나 결론에 이르지 못한 경우</li></ul>
<h4>권고안의 정리</h4>
<p>추가 검사가 시행되지 않았거나 검사 후에도 결론에 이르지 못했다면, 임상적인 위험 인자, 초음파 소견, 분자표지자검사 결과, 환자의 선호도에 따라 초음파 추적관찰 또는 진단적 수술을 고려한다. Fig. 3.1.A에서도 반복검사에서 다시 Bethesda III로 보고되면 <b>추적검사 또는 수술</b>로 제시한다.</p>
<h4>결정에 반영할 요소</h4>
<ul><li><b>초음파 소견</b>: 비정형 결절에서 초음파 소견은 암 위험도 예측에 도움이 되며, 높은의심 초음파 소견을 갖는 결절에서 암 위험도가 높다.</li>
<li><b>임상 위험 인자</b>: 방사선 노출, 갑상선암 가족력, 유전성 종양증후군, 급격한 크기 증가, 성대 마비, 경부 림프절 종대 등(1장, 2장)</li>
<li><b>분자표지자검사 결과</b>(시행한 경우): 2개 이상의 유전자변이 등 나쁜 예후와 연관된 변이나 고위험 유전자발현 양상은 적극적 치료 결정에 도움이 된다.</li>
<li><b>결절 크기</b>: 판단 요소로 명시되어 있으나, 비정형 결절에 대한 별도의 크기 기준은 권고안에 제시되어 있지 않다.</li>
<li><b>환자의 선호도</b>: 수술 후 양성으로 나올 가능성과 수술 합병증, 추적관찰의 부담을 함께 설명한다.</li></ul>
<h4>참고 수치</h4>
<ul class="small"><li>비정형 결절에서 FNA를 다시 시행하면 10–30%가 다시 비정형으로 진단된다. CNB는 반복 비정형 비율을 줄일 수 있다.</li>
<li>비정형 결절 전체에서 수술 비율은 성인 36.2%, 수술 후 악성은 성인 30.5%였다.</li></ul>
<p class="small" style="color:var(--muted)">비정형의 정의, 첫 비정형 결과에서의 재검·분자검사 선택은 "비정형" 단계에 정리했다.</p>`},

close:{kind:'관리', title:'면밀한 추적관찰 혹은 수술', next:[], body:`
<p class="small" style="color:var(--muted)">각 항목을 누르면 권고안의 해당 근거가 펼쳐진다.</p>
<h4>수술 쪽으로 판단하는 경우</h4>
<details class="xp"><summary>초음파상 악성이 강력히 의심될 때 (3.2.C)</summary><div>
${R('3.2.C',3,'반복적인 병리진단검사에서도 비진단적 결과가 나오는 경우, 초음파 소견상 악성이 강력히 의심되거나, 추적관찰 동안 20% 이상 크기가 증가하거나, 임상적으로 암 위험도를 가진 경우에는 진단을 위해 수술적 절제를 고려한다.')}
<ul><li>반복적으로 비진단적인 결절에서는 초음파 소견이 악성 가능성을 판단하는 데 도움이 된다.</li>
<li>2회 비진단적 결절 중 높은의심 소견(미세석회화, 침상 경계, 앞뒤로 긴 모양, 저에코)이 있으면 25%가 악성이었고, 악성의심 소견이 없으면 4%만 악성이었다.</li>
<li>비정형 결절에서도 높은의심 초음파 소견을 갖는 결절의 암 위험도가 높다.</li>
<li>참고: 높은의심(K-TIRADS 5)의 암 위험도는 &gt;60%이다.</li></ul></div></details>

<details class="xp"><summary>추적 중 20% 이상 크기 증가 (3.2.C)</summary><div>
<ul><li>권고안의 결절 성장 정의: ${GROWTH}.</li>
<li>초음파에 비해 촉진은 크기 변화 판단이 부정확하므로 반드시 초음파로 평가한다.</li>
<li>크기 증가 자체가 악성을 시사하지는 않으나 반복 병리진단검사의 적응증이 된다. 양성 결절도 서서히 커지는 경우가 더 흔하다.</li></ul></div></details>

<details class="xp"><summary>임상적으로 암 위험도가 있을 때 (3.2.C)</summary><div>
<h5>병력상 고위험군 (1장)</h5>
<ul><li>두경부 방사선조사, 골수 이식을 위한 전신 방사선조사, 14세 이전 체르노빌의 방사능 낙진 노출</li>
<li>소아 시기 갑상선 부위 방사선 치료(방사선량 10–30 Gy에서 상대위험도 최고 15.2)</li>
<li>갑상선분화암 가족력(가계 내 3명 이상이면 22.7%에서 암 발견), 유전성 종양증후군(PTEN/Cowden, FAP, Carney complex, Werner, DICER1, MEN2)</li></ul>
<h5>갑상선암이 의심되는 임상증상</h5>
<ul><li>급격한 크기 증가, 쉰 목소리, 성대 마비, 동측 경부 림프절 종대, 주위 조직에 고정된 결절</li></ul>
<h5>불량 예후 인자 (Table 2.2.A 각주 a)</h5>
<ul><li>경부 림프절전이 의심, 주변 구조물로의 명백한 갑상선외부침범, 원격전이, 갑상선수질암 의심(혈청 칼시토닌 100 pg/mL 이상이면 거의 모두 수질암)</li></ul></div></details>

<details class="xp"><summary>분자표지자검사에서 고위험 변이가 확인될 때 (3.4, 3.6, 3.8)</summary><div>
${R('3.8.A',3,'분자표지자검사는 임상적인 위험 요소, 세포검사 결과 및 초음파 소견을 기반으로 한 암 위험도와 실행 가능성, 환자의 선호도 등을 고려하여 시행되어야 한다.')}
<ul><li><b>BRAF<sup>V600E</sup> 또는 BRAF 융합 유전자</b>: 발견되면 악성을 의미한다. 빈도가 높은 아시아에서는 비정형 결절의 암 위험도가 33.4–56.5%에서 71.1–87.9%로 높아진다.</li>
<li><b>TERT 프로모터 + BRAF<sup>V600E</sup> 동반</b>: BRAF 단독보다 높은 병기(4.2배), 원격전이(11.7배), 재발률(4.3배), 사망률(15배)과 관련된다.</li>
<li><b>2개 이상의 변이 또는 불량 예후 변이</b>: 적극적으로 수술적 치료를 고려한다. NGS 패널에서 고위험 유전자발현 양상이 확인되어도 적극적 치료 결정에 도움이 된다.</li>
<li><b>RAS</b>: 악성에 대한 양성예측도 약 66%. 양성 종양도 악성으로 진행할 가능성이 있어 진단 및 치료 목적의 수술 대상이 된다.</li>
<li>다른 유형의 BRAF 변이는 양성 종양에서도 발견되므로 해석에 주의한다.</li></ul></div></details>

<h4>추적관찰을 선택할 수 있는 경우</h4>
<details class="xp"><summary>높은의심 소견이 없는 낭성 결절 (3.2.B)</summary><div>
${R('3.2.B',3,'반복적인 병리진단검사에서도 비진단적인 낭성 결절(단, 초음파 소견에서 악성을 시사하는 높은의심 소견이 없는 경우)은 주의 깊게 추적관찰하거나 수술적 절제가 필요할 수 있다.')}
<ul><li>낭성 부분이 50% 이하이면 재검 진단율이 60–80%이지만, 낭성 부분이 많을수록 재검에서도 비진단적 결과가 나올 가능성이 높다.</li>
<li>높은의심 소견이 없는 2회 비진단적 결절의 악성률은 4%였다.</li>
<li>FNA 재시행 시 28.1–40.0%가 다시 비진단적이나, CNB는 1.1–3.8%에 그쳐 비진단적 결과를 줄이는 데 도움이 된다.</li>
<li>순수 낭종은 비진단적 결과여도 증상이 있으면 에탄올절제술을 시행할 수 있다(5장).</li></ul></div></details>

<details class="xp"><summary>임상 위험 인자, 크기, 초음파 소견, 환자 선호도상 수술 이득이 크지 않을 때 (3.4.B)</summary><div>
${R('3.4.B',2,'반복적인 병리진단검사에서 결론에 이르지 못하고, 분자표지자검사가 시행되지 않았거나 결론에 이르지 못한 경우, 임상적인 위험 인자, 결절 크기 및 초음파 소견, 환자의 선호도에 따라 초음파 추적관찰 또는 수술이 시행될 수 있다.')}
<ul><li>비정형 결절에서 FNA를 반복하면 대부분 진단적 결과를 얻지만 10–30%는 다시 비정형으로 진단된다. CNB는 반복 비정형 비율을 줄일 수 있다.</li>
<li>경험 많은 병리과 전문의의 슬라이드 재판독으로 많은 예가 양성 또는 비진단적으로 재분류된다.</li>
<li>성인 비정형 결절의 수술 비율은 36.2%, 수술 후 악성은 30.5%였다. 대부분은 양성이므로 수술 이득과 합병증을 함께 고려한다.</li>
<li>Fig. 3.1.A: 반복 검사에서도 비진단적 또는 비정형이면 추적검사 또는 수술을 선택한다.</li></ul></div></details>`},

b56:{kind:'병리 결과', title:'악성 혹은 악성의심 (Bethesda V, VI)', next:['surg'], body:`
<h4>악성의심 (V)</h4>
${R('3.6.A',2,'병리진단검사에서 갑상선유두암의심(악성의심)인 경우에는 악성으로 진단된 경우와 유사하게 임상적인 위험 요소, 초음파 소견, 환자의 선호도를 고려하여 수술적 절제를 시행한다.')}
${R('3.6.B',3,'임상적인 위험 요소와 초음파 소견, 환자의 선호도를 고려하였을 때, 유전자변이검사 결과에 따라 수술적 절제에 관한 의사 결정이 바뀔 수 있는 경우에는 분자표지자검사를 고려해 볼 수 있다.')}
<ul class="small"><li>FNA의 1–6%를 차지하며 수술 후 암 위험도는 성인 79.6%, 소아 90.5%였다.</li>
<li>TERT 프로모터와 BRAF<sup>V600E</sup> 동반 시 BRAF 단독보다 높은 병기(4.2배), 원격전이(11.7배), 재발(4.3배), 사망(15배)과 관련된다. 2개 이상 변이나 불량 예후 변이가 있으면 적극적 수술을 고려한다.</li>
<li>수질암, 림프종 등 드문 암이 의심되면 CNB 후 면역조직화학염색 또는 분자검사로 정확도를 높일 수 있다.</li></ul>
<h4>악성 (VI)</h4>
${R('3.7.A',1,'병리진단검사 결과가 악성인 경우 일반적으로 수술을 권고한다.')}
${R('3.7.B',2,'저위험군 미세갑상선유두암으로 진단된 성인 환자에서 적극적 관찰을 고려할 수 있다.')}`},

b4:{kind:'병리 결과', title:'여포종양 (Bethesda IV)', next:['surg'], body:`
${R('3.5.A',2,'여포종양(Bethesda 범주 4)으로 진단된 경우, 수술을 우선적으로 고려한다. 치료를 결정할 때, 여포종양의 크기가 2 cm 혹은 그 이상으로 커질수록 암 위험도가 증가함을 고려한다.')}
${R('3.5.B',3,'임상적인 소견과 초음파 소견을 참고하여 초음파 추적관찰 또는 암 위험도 평가와 수술 결정을 위한 분자표지자검사를 진행할 수 있다. 임상적인 의사 결정에 환자의 선호도와 실행 가능성이 고려되어야 한다.')}
<ul><li>세포 밀도가 높은 검체로, 유두암 핵 특징 없는 구조적 변화, 유두암 핵 특징을 보이는 소포 형태 군집, 또는 거의 호산성세포로만 구성된 경우이다.</li>
<li>FNA의 6.1%가 여포종양이며, 수술 후 악성은 성인 28.9%, 소아 41.4%였다.</li>
<li>크기별 암 위험도: ≥2 cm 1.63배, ≥3 cm 2.39배, ≥4 cm 2.29배. 기준 미만이라도 18–25%가 악성이었다.</li>
<li>여포암과 NIFTP는 수술로만 확진되지만 62–70%에서 불필요한 수술이 발생하므로, 양성 가능성과 합병증을 수술 전 충분히 설명한다.</li>
<li><button type="button" class="term" aria-expanded="false" aria-controls="pop-ngs">NGS 패널</button>은 단일 유전자검사보다 검사 양성률(변이 검출률, rate of positive test)이 높지만(40.3–63.4% vs 2.2–12.2%) 양성 결절에서도 변이가 발견되어 단독으로 결론적이지 않다.
<div class="pop" id="pop-ngs" hidden>
<b class="pop-h">NGS 패널: 여포종양에서의 의의와 한계</b>
<ul>
<li><b>무엇을 보나</b>: 여러 유전자의 점 돌연변이(BRAF<sup>V600E</sup> 포함, RAS, TERT, TP53, EIF1AX, DICER1 등)와 융합 유전자(RET, NTRK, ALK, PAX8-PPARG, BRAF 융합 등)를 한 번에 분석한다. 패널에 따라 유전자 발현과 복제수 변화까지 본다.</li>
<li><b>확진(rule-in)으로는 약하다</b>: 여포종양의 주요 변이(RAS, EIF1AX, PAX8-PPARG, DICER1)는 여포선종에서도 비슷한 빈도로 발견된다. 권고안도 분자표지자검사는 여포종양의 악성 여부를 결정하는 데 결론적이지 않다고 명시한다.</li>
<li><b>의의 ① 배제(rule-out)</b>: 의미 있는 변이가 없으면 악성 가능성이 낮아(음성예측도 92–97%) 수술 대신 추적관찰의 근거가 된다. 단, 이 수치는 발현·복제수까지 분석하는 패널의 성적이며 기관의 악성 유병률에 따라 달라진다.</li>
<li><b>의의 ② 고위험 변이 식별</b>: TERT 프로모터, TP53, 2개 이상의 변이가 확인되면 적극적 수술이나 수술 범위 결정에 참고한다.</li>
<li><b>의의 ③ RAS 양성</b>: 양성 종양이라도 진행 가능성이 있어 관찰보다 진단·치료 목적의 수술 쪽으로 판단을 기울이는 정보가 된다.</li>
<li><b>국내 상황</b>: 국내 갑상선암에서 BRAF<sup>V600E</sup>는 고전형 유두암에 많고(약 71%), 여포선종·여포암은 RAS가 주된 변이(약 30–38%)이며 BRAF<sup>V600E</sup>는 거의 없다(0–4%). TERT 프로모터 변이는 유두암에서 다른 나라보다 낮지만(2.8% vs 10%), 여포암에서는 비슷하다(18.4% vs 17%). 특히 광범위 침윤 여포암에서 높다. 수술 전 생검 검체의 진단 목적 NGS 검사는 국내에서 허용되지 않았고, 권고안도 NGS 패널은 주로 서구에서 사용된다고 기술한다. 비용-효과에 대해서는 추가 연구가 필요하다.</li>
</ul>
<p class="pop-src">출처: KTA 갑상선결절 진료권고안 2024 3.5·3.8절; Song YS, Park YJ. Endocrinol Metab 2019;34:1-10; Yang H, et al. Endocrinol Metab 2022;37:652-63; Jung CK. J Pathol Transl Med 2023</p>
</div></li></ul>`},

b2:{kind:'병리 결과', title:'양성 (Bethesda II)', next:['fu2'], body:`
${R('3.3.A',1,'병리진단검사에서 양성인 결절은 즉각적인 추가 검사나 치료가 필요하지 않다.')}
<ul><li>FNA 양성 결절의 악성 위험도는 1–3%이다. 결절 병리진단 전체의 위음성률은 약 5%로, 양성이어도 추적관찰이 필요하다.</li>
<li>4 cm 초과 결절의 위음성에 대해서는 결과가 엇갈리며, 크기보다 높은의심 초음파 소견에서 위음성률이 더 높다.</li></ul>`},

fu2:{kind:'관리', title:'추적관찰 (세포학적 양성)', next:['benigntx'], body:`
${R('4.1.A',1,'높은의심 초음파 소견: 6-12개월 이내에 초음파를 시행하고 크기 감소가 없는 경우 병리진단검사를 반복 시행한다. [임상적 고려사항] 1 cm 이하 크기는 병리진단검사를 반복하지 않고 초음파 추적검사를 고려할 수 있다.')}
${R('4.1.B',3,'낮은의심 또는 중간의심 초음파 소견: 12-24개월 시점에 초음파를 시행한다. 초음파에서 결절의 크기 증가(적어도 두 방향에서 2 mm 이상이면서 20% 이상의 직경 증가가 확인되거나, 용적이 50% 이상 증가된 경우) 혹은 새로운 의심소견이 관찰된 경우 병리진단검사를 시행하거나 혹은 지속적으로 관찰할 수 있으며, 지속적인 크기 증가를 보인다면 병리진단검사를 시행할 수 있다.')}
${R('4.1.C',2,'양성 초음파 소견: 지속적인 크기 증가로 치료 목적 혹은 치료 계획을 위해 병리진단검사를 시행한 후 양성으로 진단된 경우 악성 위험을 고려한 추적 초음파검사는 필요하지 않다.')}
${R('4.1.D',1,'추적검사를 통해 반복적으로 시행된 병리진단검사에서 양성이라면, 결절의 악성의심 소견의 변화가 없는 경우 추적 병리진단검사는 필요하지 않다.')}
<ul class="small"><li>결절 성장의 정의: ${GROWTH}. 크기 증가 자체가 악성을 시사하지는 않지만 반복 병리진단의 적응증이 된다.</li>
<li>FNA 양성인 높은의심 결절의 위음성률은 3.1–18.2%로 상대적으로 높다. 높은의심 소견이라도 CNB에서 양성이면 위음성률이 약 3% 이하여서, 병리·초음파·임상 소견을 고려해 반복 병리진단 없이 초음파 추적을 고려할 수 있다.</li>
<li>낮은·중간의심 결절과 2회 이상 양성 결절은 추적 초음파에서 변화가 없으면 반복 병리진단이 필요하지 않다.</li></ul>`},

benigntx:{kind:'치료', title:'갑상선 양성 결절의 치료', next:[], body:`
${R('5.A',1,'양성 갑상선결절에 대한 일률적인 갑상선호르몬 억제 치료는 권고되지 않는다. 치료에 어느 정도 반응을 보일 수 있을지라도 억제요법의 잠재적인 위해가 이득을 상회한다.')}
${R('5.B',2,'경과관찰 중 크기가 증가되지만 반복 시행한 세포검사에서 양성인 경우 주기적으로 추적관찰한다. 크기가 약간 증가하는 대부분의 무증상 결절은 치료 없이 추적관찰한다.')}
${R('5.C',4,'크기가 증가하는 갑상선 양성 결절 환자에서 갑상선호르몬 억제 치료에 대한 자료는 없다.')}
${R('5.D',3,'반복 시행한 병리진단검사에서 양성으로 진단된 갑상선결절이라 하더라도 압박증상이 있거나 미용적 문제가 있는 경우, 또는 자율기능성 갑상선결절인 경우는 치료가 필요할 수 있다. 치료법으로는 수술과 방사성요오드 치료 및 비수술적절제 치료(에탄올절제술, 고주파절제술, 레이저절제술)가 있으며, 임상적 특성, 동반 질환, 치료법에 따른 장단점, 환자의 선호도, 실행 가능성 등을 고려하여 시행한다.')}
${R('5.E',3,'크기가 증가하는 4 cm 보다 큰 결절은 압박증상이 심하거나 악성 여부에 대한 임상적 우려가 있는 경우에는 수술을 고려한다.')}
${R('5.F',2,'압박 증상이나 미용상의 문제가 있는 정상 기능의 양성 고형 갑상선결절은 비수술적절제 치료 또는 수술을 고려할 수 있다.')}
${R('5.G',2,'양성 고형결절의 비수술적절제 치료법으로는 고주파 혹은 레이저절제술이 권고된다.')}
${R('5.H',1,'재발하는 양성 낭성 결절은 압박 증상이나 미용 상의 문제가 있는 경우 에탄올절제술이 일차적 치료법으로 권고된다.')}
<h4>비수술적절제의 대상</h4>
<ul><li>FNA 또는 CNB에서 2회 이상 양성인 결절. K-TIRADS 2 결절과 자율기능성 결절은 1회 양성으로도 대상이 되고, 순수 낭종은 비진단적 결과여도 에탄올절제술이 가능하다.</li>
<li>고주파절제 치료 결정을 위한 병리진단검사에는 여포성 종양의 진단 민감도가 높은 CNB를 포함하는 것이 권고된다(FNA 진단 민감도 약 74%, CNB 80–91%).</li>
<li>제외: 범주 4·5·6 이력, K-TIRADS 5, 암 또는 여포종양 의심, 흉골뒤갑상선종. 약 6–7 cm 이상의 매우 큰 결절은 수술을 우선 고려한다.</li>
<li>양엽 결절은 최소 2 cm보다 크면서 압박·미용 문제가 있을 때 대상이 된다. 협부 결절은 연관성이 확인되면 작아도 대상이 될 수 있다.</li>
<li>낭성 결절은 단순 흡인을 먼저 시도하고, 재발하면 에탄올절제술을 시행한다. 에탄올은 고형결절에서 효과가 낮고 누출 위험이 있어 권고되지 않는다.</li></ul>`},

tshnl2b:{},

surg:{kind:'치료', title:'수술 (또는 면밀한 추적관찰)', next:[], body:`
<p>수술 범위는 종양 크기, 병리진단 결과, 영상검사를 포함한 임상상을 종합하여 결정한다(대한갑상선학회 갑상선분화암 진료권고안 2024 'I.2.2' 참조).</p>
${fnBox('e')}
<h4>수술을 우선 고려하는 경우</h4>
<ul><li>임상적으로 림프절전이 또는 원격전이가 의심되는 경우</li>
<li>육안적 갑상선외부침범, 또는 기관이나 되돌이후두신경 침범이 의심·우려되는 경우</li>
<li>공격적 조직아형(긴세포[tall cell], 원주세포[columnar cell], hobnail 아형 등)이 관찰되는 경우</li></ul>
<h4>적극적 관찰을 고려할 수 있는 경우</h4>
<ul><li>매우 낮은 위험도 종양(전이와 육안적 외부침범이 없고 공격적 아형 근거가 없는 미세유두암 등)</li>
<li>동반 질환으로 수술 위험이 큰 경우</li>
<li>남은 여생이 짧을 것으로 예상되는 경우(심한 심혈관질환, 다른 악성 종양, 고령)</li>
<li>수술 전에 해결해야 할 내과·외과적 질환이 있는 경우</li></ul>
<h4>질병 진행의 정의 (적극적 관찰 시)</h4>
<ul><li>종양 최대 길이 3 mm 이상 증가, 또는 새로운 경부 림프절·원격전이·갑상선외부침범</li>
<li>부피 기준은 50% 이상(과대평가 우려로 72–100%를 쓰기도 함), 또는 2개 이상 직경이 각 2 mm 이상 증가</li>
<li>증가 소견은 측정 오차를 고려해 3–6개월 간격 초음파로 확인한다.</li></ul>
<h4>적극적 관찰 근거 요약</h4>
<ul class="small"><li>1–2 cm 이하 저위험 유두암 9개 연구: 길이 3 mm 이상 증가 2.2–10.8%, 부피 50% 이상 증가 16.0–28.8%, 새 림프절전이 0–4.5%</li>
<li>일본 3222명 장기 추적: 10년·20년 크기 증가 4.7%·6.6%, 림프절전이 1.0%·1.6%</li>
<li>진행 관련 인자(국내 전향적 연구): 30세 미만, 남성, 종양 크기 6 mm 이상, 기저 TSH 7 mIU/L 이상, 초음파상 종양 내 혈류 또는 미만성 갑상선질환 소견. 종양배가시간이 빠르면 크기 증가와 새 림프절전이가 유의하게 많았다.</li>
<li>1 cm 이하 2705명 연구에서 9 mm 이상이면 진행 위험이 높았다(HR 1.79). 1–2 cm 저위험 유두암의 적극적 관찰은 추가 연구가 필요하다.</li>
<li>일본 1235명 연구: 40세 미만은 3 mm 이상 증가 5.9%, 림프절전이 5.3%로 60세 이상(2.2%, 0.4%)보다 높았다.</li>
<li>고령에서는 기대수명과 수술 합병증을 고려해 적극적 관찰을 고려해 볼 수 있다.</li>
<li>임신 중 적극적 관찰 50명: 3 mm 이상 증가 8%, 림프절전이 없음. 임신을 원하는 환자에게 추천할 수 없다는 근거는 없으며, 임신 시 면밀한 추적이 필요하다.</li>
<li>삶의 질과 불안감은 적극적 관찰군에서 지속적으로 양호했고, 직접의료비는 약 16년 후부터 적극적 관찰군에서 더 높았다. 환자와의 공유의사결정이 중요하다.</li></ul>`},

screen:{kind:'추가 참고', title:'고위험군과 갑상선암 선별검사', next:[], body:`
${R('1.A',4,'직계 가족 중에 3명 이상의 갑상선분화암 환자가 있는 경우 가족 구성원들에게 시행하는 선별검사는 조기 진단은 가능하나 이환율과 사망률을 낮춘다는 증거가 없으므로 이러한 목적의 초음파검사를 일률적으로 권고하지는 않는다.')}
${R('1.B',2,'가족성 갑상선암이나 유전성 종양증후군 환자의 가족 구성원들은 유전상담을 받고 유전자변이 유무에 따라 선별검사와 치료를 시행해야 한다.')}
${R('1.C',4,'그레이브스병, 하시모토갑상선염, 부갑상선기능항진증 환자에게 갑상선암 선별검사로서의 초음파검진을 일률적으로 권고하지는 않는다.')}
${R('1.D',2,'1.A-C 항의 경우 신체검진 후 갑상선결절이나 비대칭적 갑상선종대, 림프절 종대가 의심될 때 초음파검진을 고려한다.')}
<ul class="small"><li>가족성 분화암: 가계 내 2명이면 4.6%, 3명 이상이면 22.7%에서 암이 발견되었다.</li>
<li>그레이브스병: 결절이 있으면 암 위험이 4–5배 높으나 예후가 더 불량하다는 근거는 없어 일률적 초음파검사의 근거는 부족하다. 결절성·큰·비대칭적 갑상선종 등 임상 상황에 따라 초음파를 고려하며, 갑상선기능항진증에 대한 방사성요오드 또는 수술적 치료 전에는 초음파를 시행하여야 한다.</li>
<li>하시모토갑상선염: 암 위험이 1.5–1.8배 높으나 예후가 불량하지 않아(림프절전이·원격전이·재발 위험 오히려 낮음) 일률적 초음파검사의 근거는 없다. 결절 의심이나 비대칭적 갑상선종대 등 임상 상황에 따라 초음파를 고려한다.</li>
<li>소아기 방사선치료(또는 <sup>131</sup>I-MIBG) 생존자: 5년 후부터 1–2년 간격 촉진 또는 3–5년 간격 초음파(국제 권고)</li></ul>`},
preg:{kind:'추가 참고', title:'임신부의 갑상선결절', next:[], body:`
${R('6.A',1,'임신부에서 갑상선결절이 발견된 경우 비임신부와 마찬가지로 초음파 소견에 근거하여 FNA를 고려한다. 임신 초기(first trimester) 이후에도 혈청 TSH가 지속적으로 낮은 경우에는 결절의 기능을 평가할 수 있는 갑상선스캔이 가능해지는 출산 이후로 병리진단검사를 미룰 수 있다.')}

<ul class="small"><li>의미 있는 성장: ${GROWTH}</li>
<li>갑상선스캔이 금기라는 점 외에 검사법은 비임신부와 같다.</li>
<li>임신 중 수술과 분만 후 수술 사이에 재발률과 생존율 차이가 없었다. 수술한다면 24주 이전 임신 중기가 좋다.</li></ul>`},
levels:{kind:'추가 참고', title:'권고수준의 정의 (Table 1)', next:[], body:`
${[1,2,3,4].map(l=>`<div class="rec"><span class="lv l${l}">권고수준 ${l}</span><p>${LV[l]}</p></div>`).join('')}`}

Object.assign(D, EXTRA);

/* ---------- 렌더링 ---------- */
const chart = document.getElementById('chart');
const edges = document.getElementById('edges');
EDGES.forEach(([d,arrow,cls])=>{
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d);
  if (arrow) p.setAttribute('marker-end','url(#ah)');
  if (cls) p.setAttribute('class', cls);
  edges.appendChild(p);
});
const nodeEls = {};
NODES.forEach(n=>{
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'node' + (n.cls ? ' ' + n.cls : '');
  b.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
  b.innerHTML = n.label;
  b.addEventListener('click', ()=>open(n.id, b));
  chart.appendChild(b);
  nodeEls[n.id] = b;
});

/* 각주 목록 (세부 창) */
const FN_LINK = {a:'tshlow', b:'auto', c:'fna', d:'repeat', e:'surg'};
D.footnotes = {kind:'순서도 각주', title:'각주 a–e', next:['tshlow','auto','fna','repeat','surg'], nextLabel:'관련 단계',
  body:`<ul class="fn-list">${Object.keys(FN).map(k=>`<li><button type="button" data-go="${FN_LINK[k]}"><b>${k}</b><span>${FN[k]}</span></button></li>`).join('')}</ul>
<p class="caption">원 그림: Fig. 2.A 갑상선결절에 대한 검사 및 치료 알고리즘 (Park YJ, et al. <a href="https://doi.org/10.11106/ijt.2024.17.1.208" target="_blank" rel="noopener noreferrer">Int J Thyroidol 2024;17(1):208-244</a>, CC BY-NC 4.0)</p>
<p class="small" style="color:var(--muted)">각주를 누르면 해당 단계의 세부 내용으로 이동한다.</p>`,
  onOpen(){ dBody.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.go))); }
};
D.abbr = {kind:'참고', title:'약어', next:[],
  body:`<div class="abbr"><input class="abbr-search" id="abbrSearch" type="search" placeholder="약어 첫 글자 입력 (예: A, BR)" aria-label="약어 첫 글자로 검색" autocomplete="off" spellcheck="false"><dl id="abbrList"></dl></div>`,
  onOpen(){
    const inp = document.getElementById('abbrSearch'), dl = document.getElementById('abbrList');
    const render = q => { q=(q||'').trim().toLowerCase();
      dl.innerHTML = ABBR.filter(([a])=>!q || a.replace(/<[^>]+>/g,'').toLowerCase().replace(/\s+/g,'').startsWith(q.replace(/\s+/g,''))).map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('') || '<dd>일치하는 약어가 없다.</dd>'; };
    inp.addEventListener('input', e=>render(e.target.value)); render('');
  }
};
document.getElementById('fnToggle').addEventListener('click', e=>open('footnotes', e.currentTarget));
document.getElementById('abbrToggle').addEventListener('click', e=>open('abbr', e.currentTarget));

document.querySelectorAll('.below [data-id]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.id,b)));


/* ---------- 범례 클릭: 해당 종류 박스 2.4초 깜빡임 ---------- */
let flashTimer = null;
function flashLegend(cls, btn){
  clearTimeout(flashTimer);
  Object.values(nodeEls).forEach(el=>el.classList.remove('flash'));
  document.querySelectorAll('.legend .lg').forEach(b=>{ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); });
  void chart.offsetWidth;
  NODES.forEach(n=>{ if (n.cls === cls) nodeEls[n.id].classList.add('flash'); });
  chart.classList.add('hl');
  btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
  flashTimer = setTimeout(()=>{
    Object.values(nodeEls).forEach(el=>el.classList.remove('flash'));
    chart.classList.remove('hl');
    btn.classList.remove('on'); btn.setAttribute('aria-pressed','false');
  }, 2400);
}
document.querySelectorAll('.legend .lg').forEach(b=>b.addEventListener('click',()=>flashLegend(b.dataset.cls,b)));
/* ---------- 세부 창 ---------- */
const drawer = document.getElementById('drawer');
const backdrop = document.getElementById('backdrop');
const dKind = document.getElementById('dKind');
const dTitle = document.getElementById('dTitle');
const dBody = document.getElementById('dBody');
const dNext = document.getElementById('dNext');
const dClose = document.getElementById('dClose');
let lastFocus = null, current = null;

function open(id, trigger){
  const d = D[id]; if (!d) return;
  if (trigger && !drawer.classList.contains('open')) lastFocus = trigger;
  current = id;
  dKind.textContent = d.kind;
  dTitle.textContent = d.title;
  dBody.innerHTML = d.body;
  /* 공통 설명은 패널 안에서 해당 그룹의 첫 권고문에만 남김 */
  const seenExp = new Set();
  dBody.querySelectorAll('.rec.has-exp').forEach(rec=>{
    const g = EXPMAP[rec.dataset.rid];
    if (!seenExp.has(g)) { seenExp.add(g); return; }
    const box = document.getElementById(rec.getAttribute('aria-controls'));
    if (box && dBody.contains(box)) box.remove();
    rec.classList.remove('has-exp');
    ['role','tabindex','aria-expanded','aria-controls','data-rid'].forEach(a=>rec.removeAttribute(a));
    rec.querySelectorAll('.lv-ic').forEach(i=>i.remove());
  });
  dBody.scrollTop = 0;
  dNext.innerHTML = '';
  if (d.next && d.next.length){
    const s = document.createElement('span'); s.className = 'lbl'; s.textContent = d.nextLabel || '다음 단계';
    dNext.appendChild(s);
    d.next.forEach(nid=>{
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = D[nid].title;
      b.addEventListener('click', ()=>open(nid));
      dNext.appendChild(b);
    });
  }
  if (d.onOpen) d.onOpen();
  Object.values(nodeEls).forEach(el=>el.classList.remove('is-active'));
  if (nodeEls[id]) nodeEls[id].classList.add('is-active');
  drawer.classList.add('open'); backdrop.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  dClose.focus({preventScroll:true});
}
function close(){
  drawer.classList.remove('open'); backdrop.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  Object.values(nodeEls).forEach(el=>el.classList.remove('is-active'));
  if (lastFocus) lastFocus.focus({preventScroll:true});
  lastFocus = null; current = null;
}
dClose.addEventListener('click', close);
dBody.addEventListener('click', e=>{
  const t = e.target.closest('.term'); if (!t) return;
  const box = document.getElementById(t.getAttribute('aria-controls')); if (!box) return;
  const show = box.hidden; box.hidden = !show; t.setAttribute('aria-expanded', String(show));
  if (show) box.scrollIntoView({behavior:'smooth', block:'nearest'});
});
function toggleExp(rid, force){
  const key = rid.replace(/\./g,'-');
  const rec = dBody.querySelector(`.rec.has-exp[data-rid="${rid}"]`);
  const box = document.getElementById('exp-' + key);
  if (!rec || !box) return;
  const show = force !== undefined ? force : box.hidden;
  if (show && !box.innerHTML){ box.innerHTML = renderExp(rid); box.hidden = false; }
  box.hidden = !show; rec.setAttribute('aria-expanded', String(show));
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if (show) rec.scrollIntoView({behavior:smooth, block:'start'});
  else { rec.scrollIntoView({behavior:smooth, block:'nearest'}); rec.focus({preventScroll:true}); }
}
dBody.addEventListener('click', e=>{
  const c = e.target.closest('.exp-close');
  if (c){ toggleExp(c.dataset.rid, false); return; }
  const rec = e.target.closest('.rec.has-exp');
  if (!rec) return;
  if (String(window.getSelection && window.getSelection()).trim()) return;
  toggleExp(rec.dataset.rid);
});
dBody.addEventListener('keydown', e=>{
  const rec = e.target.closest('.rec.has-exp');
  if (rec && e.target === rec && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleExp(rec.dataset.rid); }
});
backdrop.addEventListener('click', close);
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && drawer.classList.contains('open')) close(); });

/* ---------- 한 화면 맞춤 ---------- */
const wrap = document.getElementById('chartWrap');
const size = document.getElementById('chartSize');
const CW = 760, CH = 720, NODE_PX = 15;
const mainEl = document.querySelector('main');
function layout(){
  const ms = getComputedStyle(mainEl);
  const cs = getComputedStyle(wrap);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  const leg = document.getElementById('legend');
  const gap = parseFloat(cs.columnGap) || 0;
  const mainW = mainEl.clientWidth - parseFloat(ms.paddingLeft) - parseFloat(ms.paddingRight);
  const availW = mainW - padX - leg.offsetWidth - gap;
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  const below = document.querySelector('.below').offsetHeight + 20;
  const availH = window.innerHeight - top - padY - below - 4;
  const scale = Math.min(1.3, availW / CW, Math.max(availH, 320) / CH);
  chart.style.transform = `scale(${scale})`;
  size.style.width = (CW * scale) + 'px';
  size.style.height = (CH * scale) + 'px';
  const ui = Math.max(11, Math.min(16, NODE_PX * scale));
  document.documentElement.style.setProperty('--ui-font', ui.toFixed(2) + 'px');
}
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
layout();
